name: Tests

# Runs the Jest suite on every push to main and on every pull request, so a change
# that breaks DataService / sync-merge / currency / validation logic is caught
# before it lands instead of after it reaches a device.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR supersedes an in-flight run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # index.html and app-v3.html are two copies of the same single-file app (the tests
      # read app-v3.html; the server serves index.html). They must never drift apart.
      - name: index.html and app-v3.html are identical
        run: cmp index.html app-v3.html

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
