function App() {
    const [currentScreen, setCurrentScreen] = useState('summary');
    const [activeView, setActiveViewState] = useState(() => getActiveView());
    const [settingsScrollTarget, setSettingsScrollTarget] = useState(null);
    const [expenses, setExpenses] = useState([]);
    const [income, setIncome] = useState([]);
    const [categories, setCategories] = useState([]);
    const [netWorthItems, setNetWorthItems] = useState([]);
    const [assetCategories, setAssetCategories] = useState([]);
    const [liabilityCategories, setLiabilityCategories] = useState([]);
    const [defaultCurrency, setDefaultCurrency] = useState('GBP');
    const [people, setPeople] = useState([]);
    const [notifications, setNotifications] = useState(() => DataService.getNotifications());
    // Redesign shell (Phase 0): header sheets + back-navigation history. UI state only.
    const [shellSheet, setShellSheet] = useState(null); // null | 'view' | 'sync' | 'profile' | 'add'
    const [screenHistory, setScreenHistory] = useState([]);
    const [incomeAutoOpen, setIncomeAutoOpen] = useState(false); // + sheet → Income opens its form
    const [expensesInitDateFrom, setExpensesInitDateFrom] = useState('');
    const [expensesInitDateTo, setExpensesInitDateTo] = useState('');
    const [currentUser, setCurrentUser] = useState(() => {
        if (window.__firebaseReady) return null;
        try {
            const expiry = parseInt(localStorage.getItem('financeApp_session_expiry') || '0');
            const sessionActive = sessionStorage.getItem('financeApp_session_active') === 'true';
            if (expiry > Date.now() || sessionActive) {
                const storedUser = JSON.parse(localStorage.getItem('financeApp_currentUser') || 'null');
                if (!storedUser) return null;
                // Session UID binding: prevents accidental data inheritance across different
                // local accounts (e.g. same device, different users). Note: this is not a
                // cryptographic anti-spoofing control — all values live in browser-writable
                // storage and a same-origin attacker with devtools access can bypass it.
                // Robust identity guarantees require a server-side auth layer (e.g. Firebase).
                const sessionUid = expiry > Date.now()
                    ? localStorage.getItem('financeApp_session_uid')
                    : sessionStorage.getItem('financeApp_session_uid');
                if (sessionUid !== String(storedUser.id)) return null;
                return storedUser;
            }
            return null;
        } catch (_) { return null; }
    });
    const [authLoading, setAuthLoading] = useState(() => !!window.__firebaseReady);
    const [storagePreference, setStoragePreference] = useState(() => localStorage.getItem('financeApp_storagePreference') || '');
    const [showStoragePicker, setShowStoragePicker] = useState(false);
    const [localDeviceBannerDismissed, setLocalDeviceBannerDismissed] = useState(
        () => localStorage.getItem('financeApp_localBannerDismissed') === DateUtils.today()
    );
    const [syncStatus, setSyncStatus] = useState('idle');
    const [lastSyncTime, setLastSyncTime] = useState(() => localStorage.getItem('financeApp_lastCloudSync') || '');
    // Coalesces bursts of handleDataUpdate() calls (e.g. a 50-row CSV import firing one
    // save event per row) into a single download+merge+upload cycle, instead of one full
    // cloud round-trip per call — avoiding Drive/OneDrive per-user rate limits (HTTP 429).
    const cloudSyncDebounceRef = React.useRef(null);
    const cloudSyncInFlightRef = React.useRef(false);
    const [cloudSyncGate, setCloudSyncGate] = useState('idle'); // idle|checking|reconnect-prompt|restore-prompt
    const [cloudRestoreData, setCloudRestoreData] = useState(null);
    const [showCloudHistory, setShowCloudHistory] = useState(false);
    const [cloudGateConnecting, setCloudGateConnecting] = useState(false);
    const [cloudGateError, setCloudGateError] = useState('');
    const [reconnectBannerDismissed, setReconnectBannerDismissed] = useState(false);
    const [syncMergeToast, setSyncMergeToast] = useState('');
    const showSyncMergeToast = (msg) => { setSyncMergeToast(msg); setTimeout(() => setSyncMergeToast(''), 4500); };
    // Persisted (unlike syncStatus) so a failed/offline sync is still visible and
    // auto-retryable after the user reloads or comes back to the app later.
    const [pendingSyncSince, setPendingSyncSince] = useState(() => localStorage.getItem('financeApp_pendingCloudSync') || '');
    const [pendingSyncBannerDismissed, setPendingSyncBannerDismissed] = useState(false);
    // The debounced sync normally clears pendingSyncSince within a few seconds, so
    // surfacing the banner the instant a change is made (before that debounce even has a
    // chance to fire) reads as an alarming false alarm on every single edit. Only show it
    // once a sync has genuinely been stuck for a while — a real problem, not a normal save
    // in flight. React state doesn't re-render on its own as time passes, so a periodic
    // tick re-evaluates the elapsed time while a sync is pending.
    const PENDING_SYNC_BANNER_DELAY_MS = 60000;
    const [pendingSyncNowTick, setPendingSyncNowTick] = useState(() => Date.now());
    useEffect(() => {
        if (!pendingSyncSince) return;
        const interval = setInterval(() => setPendingSyncNowTick(Date.now()), 5000);
        return () => clearInterval(interval);
    }, [pendingSyncSince]);
    const pendingSyncBannerReady = !!pendingSyncSince && (pendingSyncNowTick - new Date(pendingSyncSince).getTime()) >= PENDING_SYNC_BANNER_DELAY_MS;

    // Recomputes which budget/bill alerts are currently true and reconciles them into the
    // persisted notification store (financeApp_notifications) so they survive reloads and
    // show up in the bell/panel instead of only as a banner that resets on every render.
    const refreshNotifications = async () => {
        const notifSettings = JSON.parse(localStorage.getItem('financeApp_notifSettings') || '{}');
        let budgetActive = [];
        if (notifSettings.budgetAlertsEnabled !== false) {
            const alerts = await DataService.checkBudgetAlerts(activeView);
            budgetActive = alerts.map(a => ({
                key: 'budget:' + a.categoryId,
                type: a.type === 'over' ? 'budget-over' : 'budget-near',
                title: a.type === 'over' ? `${a.name}: over budget` : `${a.name}: approaching budget`,
                message: `${a.pct.toFixed(0)}% of budget ${a.type === 'over' ? 'spent' : 'used'}`,
                screen: 'categories'
            }));
        }
        const todayStr = DateUtils.today();
        // A reminder of 0 days means Off: no reminder for that bill.
        const dueSoon = DataService.getBills().filter(b => { if (!b.isActive || Number(b.reminderDaysBefore) === 0) return false; const diff = Math.ceil((new Date(b.nextDueDate) - new Date(todayStr)) / 86400000); return diff <= b.reminderDaysBefore; });
        const billActive = dueSoon.map(b => ({ key: 'bill:' + b.id, type: 'bill', title: `${b.name}: due soon`, message: 'Due ' + ValidationUtils.formatDate(b.nextDueDate), screen: 'manage' }));
        const activeAlerts = [...budgetActive, ...billActive];
        // Diff against the store BEFORE syncing so a native notification fires once per
        // newly-appearing alert, not every time this recomputes while it's still active.
        const previousKeys = new Set(DataService.getNotifications().map(n => n.key));
        const newlyActive = activeAlerts.filter(a => !previousKeys.has(a.key));
        DataService.syncNotifications(activeAlerts);
        setNotifications(DataService.getNotifications());
        if (newlyActive.length > 0) showDesktopNotifications(newlyActive);
    };

    useEffect(() => {
        if (!window.__firebaseReady) return;
        const unsubscribe = window.__firebaseAuth.onAuthStateChanged(async (fbUser) => {
            if (fbUser) {
                const stored = (() => { try { return JSON.parse(localStorage.getItem('financeApp_currentUser') || 'null'); } catch (_) { return null; } })();
                console.log('[BackupPref] onAuthStateChanged fired', { fbUserUid: fbUser.uid, storedUid: stored && stored.uid, willWipe: !!(stored && stored.uid && stored.uid !== fbUser.uid) });
                // If a different user's data is sitting in localStorage, wipe it before loading
                if (stored && stored.uid && stored.uid !== fbUser.uid) {
                    DataService.clearAllUserData();
                }
                const user = {
                    id: fbUser.uid, uid: fbUser.uid,
                    displayName: fbUser.displayName || (stored && stored.displayName) || fbUser.email,
                    email: fbUser.email,
                    authProvider: 'firebase',
                    createdAt: (stored && stored.createdAt) || new Date().toISOString()
                };
                localStorage.setItem('financeApp_currentUser', JSON.stringify(user));
                // Read storagePreference from Firestore BEFORE calling setCurrentUser so that
                // localStorage is already populated when the storage-gate useEffect runs. This
                // is now the ONLY place that resolves the saved preference after sign-in — it
                // used to also be read independently inside AuthUtils.signIn/signInWithGoogle/
                // signInWithFacebook right after their own sign-in call, which raced this same
                // fetch (two separate Firestore reads for the same doc, whichever "won" decided
                // what localStorage ended up with) and could occasionally lose the race with a
                // still-in-flight read, showing the storage picker to a returning user who'd
                // already chosen one. Firestore doc creation for brand-new social sign-ins (no
                // doc yet) also happens here now, for the same reason.
                try {
                    const doc = await window.__firebaseDb.collection('users').doc(fbUser.uid).get();
                    console.log('[BackupPref] onAuthStateChanged fetched doc', { uid: fbUser.uid, exists: doc.exists, data: doc.exists ? doc.data() : null });
                    if (doc.exists) {
                        const pref = doc.data().storagePreference;
                        if (pref) {
                            localStorage.setItem('financeApp_storagePreference', pref);
                            localStorage.setItem('financeApp_storagePickerConfirmed', 'true');
                        }
                    } else {
                        await window.__firebaseDb.collection('users').doc(fbUser.uid).set({
                            displayName: user.displayName,
                            storagePreference: 'local',
                            createdAt: new Date().toISOString()
                        });
                        localStorage.setItem('financeApp_storagePreference', 'local');
                    }
                } catch (err) {
                    console.error('[BackupPref] onAuthStateChanged Firestore read FAILED', { uid: fbUser.uid, err });
                }
                console.log('[BackupPref] localStorage after resolve', { pref: localStorage.getItem('financeApp_storagePreference'), confirmed: localStorage.getItem('financeApp_storagePickerConfirmed') });
                setCurrentUser(user);
            } else {
                setCurrentUser(null);
            }
            setAuthLoading(false);
        });
        return () => unsubscribe();
    }, []);

    useEffect(() => {
        if (!currentUser) return;
        const pref = localStorage.getItem('financeApp_storagePreference') || '';
        const confirmed = localStorage.getItem('financeApp_storagePickerConfirmed') === 'true';
        console.log('[BackupPref] gating effect running', { uid: currentUser.uid, pref, confirmed, skipCount: localStorage.getItem('financeApp_storagePickerSkipCount') });
        setStoragePreference(pref);
        if (pref === 'gdrive' || pref === 'onedrive') {
            localStorage.setItem('financeApp_storagePickerConfirmed', 'true');
            setShowStoragePicker(false);
            const lastSync = localStorage.getItem('financeApp_lastCloudSync');
            if (lastSync) { setLastSyncTime(lastSync); setSyncStatus('synced'); }
            // Cloud restore/reconnect gate — blocks main app until check is resolved
            const skipCloudCheck = localStorage.getItem('financeApp_skipCloudRestoreCheck') === 'true';
            if (skipCloudCheck) {
                localStorage.removeItem('financeApp_skipCloudRestoreCheck');
                setCloudSyncGate('idle');
                // Upload the manually restored data to cloud so it stays in sync
                const svc = pref === 'gdrive' ? GDriveService : OneDriveService;
                if (svc.isConfigured() && svc.isTokenValid()) {
                    setSyncStatus('syncing');
                    signBackupForUpload(DataService.createBackup(currentUser), currentUser).then(signed =>
                        SyncService.upload(signed)
                    ).then(result => {
                        if (result.status === 'success') { setSyncStatus('synced'); setLastSyncTime(result.syncedAt); }
                        else { setSyncStatus('idle'); }
                    }).catch(() => { setSyncStatus('idle'); });
                }
                return;
            }
            const svc = pref === 'gdrive' ? GDriveService : OneDriveService;
            if (svc.isConfigured()) {
                (async () => {
                // OneDrive's SDK loads async+defer and may not be ready yet on a fresh page
                // load; wait for it so isTokenValid() doesn't spuriously report "no session".
                if (svc.waitUntilReady) await svc.waitUntilReady();
                let tokenReady = svc.isTokenValid();
                if (!tokenReady && pref === 'gdrive') {
                    // The Drive access token is short-lived (~1hr) and tab-scoped by design, so
                    // it's routinely "invalid" here even for a user who connected minutes ago.
                    // Before interrupting them with the Reconnect screen, try a silent (no
                    // popup) token refresh — if they're still signed into Google in this browser
                    // and previously granted Drive access, this succeeds with zero clicks, same
                    // as OneDrive already does via MSAL's acquireTokenSilent below.
                    try { await GDriveService.requestTokenSilent(); tokenReady = true; } catch (_) { tokenReady = false; }
                }
                if (tokenReady) {
                    setCloudSyncGate('checking');
                    SyncService.download().then(async cloudBackup => {
                        if (!cloudBackup) { setCloudSyncGate('idle'); return; }
                        // Fail-closed: reject backups that don't belong to the current user
                        if (!isBackupOwnedByCurrentUser(cloudBackup, currentUser)) { setCloudSyncGate('idle'); return; }
                        const cloudTime = getBackupTimestamp(cloudBackup);
                        const localTime = new Date(localStorage.getItem('financeApp_lastCloudSync') || 0).getTime();
                        if (cloudTime > localTime) {
                            if (!isLocalDataEmpty()) {
                                // This is a headless path with no confirmation UI, so an unsigned
                                // legacy backup (requiresConfirmation) must not merge silently —
                                // decline and leave both local and cloud data untouched instead.
                                const sigResult = await verifyBackupSignature(cloudBackup, currentUser);
                                if (!isSignatureAcceptable(sigResult) || sigResult.requiresConfirmation) {
                                    setCloudSyncGate('idle');
                                    return;
                                }
                                // Both devices have data — merge so nothing is lost, then tell the user
                                const merged = DataService.mergeBackups(DataService.createBackup(currentUser), cloudBackup);
                                DataService.restoreBackup(merged);
                                DataService.isInitialized = false;
                                // Re-apply the active-view filter (not a raw fetch+set) — otherwise a
                                // silent login-time merge repopulates expenses/income with everyone's
                                // data while the Active View selector still shows "own".
                                await reloadCoreData(activeView);
                                showSyncMergeToast('Merged changes from another device');
                                setSyncStatus('syncing');
                                try {
                                    const signed = await signBackupForUpload(merged, currentUser);
                                    const result = await SyncService.upload(signed);
                                    if (result.status === 'success') { setSyncStatus('synced'); setLastSyncTime(result.syncedAt); localStorage.setItem('financeApp_lastCloudSync', result.syncedAt); }
                                    else {
                                        setSyncStatus('error');
                                        showSyncMergeToast('Merged locally, but the upload to the cloud failed — will retry on your next change.');
                                    }
                                } catch (_) {
                                    setSyncStatus('error');
                                    showSyncMergeToast('Merged locally, but the upload to the cloud failed — will retry on your next change.');
                                }
                                // Gate release deliberately waits until the reupload above has settled
                                // (success or failure) — releasing it earlier would let the user start
                                // editing (and kick off their own debounced sync) while this reupload of
                                // the merged snapshot is still in flight, racing on upload order.
                                setCloudSyncGate('idle');
                            } else {
                                // Local is empty (routine after every logout, which wipes it) and the
                                // user already has this provider chosen as their backup — there's no
                                // real decision to make here: restoring an empty device from your own
                                // signed cloud backup can't lose anything, so do it silently instead of
                                // interrupting every single login with "Cloud Backup Found?". Still ask
                                // when the signature can't be trusted (unsigned/legacy backup, or one
                                // that fails verification) — that genuinely needs a human decision.
                                const sigResult = await verifyBackupSignature(cloudBackup, currentUser);
                                if (isSignatureAcceptable(sigResult) && !sigResult.requiresConfirmation) {
                                    DataService.restoreBackup(cloudBackup);
                                    DataService.isInitialized = false;
                                    setCloudSyncGate('idle');
                                    await reloadCoreData(activeView);
                                } else {
                                    setCloudRestoreData(cloudBackup); setCloudSyncGate('restore-prompt');
                                }
                            }
                        } else { setCloudSyncGate('idle'); }
                    }).catch(() => { setCloudSyncGate('idle'); });
                } else {
                    // No active session token — prompt user to reconnect before entering app
                    setCloudSyncGate('reconnect-prompt');
                }
                })();
            }
        } else if (!confirmed) {
            // skipCount = logins remaining before re-prompt (2 on first skip → hides on login 1 & 2 → shows on login 3)
            const skipCount = parseInt(localStorage.getItem('financeApp_storagePickerSkipCount') || '0', 10);
            if (skipCount > 0) {
                // Still inside the skip window — decrement and let user in without prompting
                localStorage.setItem('financeApp_storagePickerSkipCount', String(skipCount - 1));
                setShowStoragePicker(false);
            } else {
                // Skip window exhausted (or never skipped) — show the picker
                setShowStoragePicker(true);
            }
        } else {
            setShowStoragePicker(false);
        }
    }, [currentUser ? currentUser.uid : null]);

    // Fetches expenses/income/categories/settings and applies the active-view filter to
    // expenses/income before they reach any screen — the one place Feature 3 requires this
    // for the two data types that already flow centrally through App. Takes the view
    // explicitly (rather than reading the `activeView` closure) so callers that just changed
    // the view can pass the new value straight through without waiting on React's async
    // state update.
    const reloadCoreData = async (view) => {
        // Cloud restore/merge paths reset DataService.isInitialized and repopulate localStorage
        // directly (DataService.restoreBackup), bypassing the mount effect's one-time migration
        // call entirely — re-running this idempotent migration here, on every reload, guarantees
        // categories are always in personBudgets shape by the time any screen reads them,
        // regardless of which path (mount vs. restore vs. merge) last populated the data.
        await DataService.initialize();
        DataService.migrateCategoryBudgetsToPersonScope();
        DataService.migrateNetWorthOriginalAmounts();
        DataService.migrateStrayLockedCashCategory();
        DataService.migrateCashWithdrawItemsToComputed();
        DataService.refreshCustomCurrencySymbols();
        const [expensesData, incomeData, categoriesData, settings] = await Promise.all([
            DataService.getExpenses(), DataService.getIncome(), DataService.getCategories(), DataService.getSettings()
        ]);
        setExpenses(expensesData.filter(e => matchesActiveView(e.paidBy, view)));
        setIncome(incomeData.filter(i => matchesActiveView(i.paidBy, view)));
        setCategories(categoriesData);
        setNetWorthItems(DataService.getNetWorthItems().filter(i => matchesActiveView(i.person, view)));
        // getNetWorthCategories('asset') guarantees "Bank & Savings" (a locked default)
        // exists before this state is read by the Net Worth screen's category grouping.
        setAssetCategories(DataService.getNetWorthCategories('asset'));
        setLiabilityCategories(DataService.getNetWorthCategories('liability'));
        setDefaultCurrency(settings.currency || 'GBP');
        setPeople(DataService.getPeople());
    };

    const handleActiveViewChange = (newView) => {
        setActiveView(newView);
        setActiveViewState(newView);
        reloadCoreData(newView);
    };

    useEffect(() => {
        const loadData = async () => {
            try {
                await DataService.processRecurringSchedules();
                DataService.migrateLegacyNetWorthCategories();
                await DataService.migrateIncomeWhosIncome();
                await reloadCoreData(activeView);
                await refreshNotifications();
            } catch (error) { console.error('Error loading data:', error); }
        };
        loadData();
    }, []);

    // Deferred until authLoading resolves: onAuthStateChanged runs clearAllUserData()
    // synchronously (for a uid mismatch) before it sets authLoading false, so waiting here
    // guarantees any stale/previous-session localStorage has already been wiped before this
    // reads DataService.data to decide whether to auto-backup. Without this gate, a mount
    // that races ahead of Firebase's auth resolution could capture and locally save a
    // previous or mismatched account's leftover data, stamped with today's date.
    useEffect(() => {
        if (authLoading) return;
        const maybeAutoBackup = async () => {
            try {
                const todayStr = DateUtils.today();
                const appSettings = await DataService.getSettings();
                const hasData = DataService.data.expenses.length > 0 || DataService.data.income.length > 0;
                if (appSettings.autoBackupEnabled !== false && hasData && !SyncService.isCloudEnabled() && DataService.hasDataChangedSinceLastBackup()) {
                    const lastAutoBackup = localStorage.getItem('financeApp_lastAutoBackup');
                    if (lastAutoBackup !== todayStr) {
                        DataService.downloadBackup();
                        localStorage.setItem('financeApp_lastAutoBackup', todayStr);
                    }
                }
            } catch (error) { console.error('Error running auto-backup check:', error); }
        };
        maybeAutoBackup();
    }, [authLoading]);

    // Used by every "is this device fresh enough to silently overwrite from cloud, or does
    // it have real local data that must be merged instead?" check. Deliberately excludes
    // categories/assetCategories/liabilityCategories, which always have non-empty default-
    // seeded data even on a brand-new device — including them would make this never return true.
    const isLocalDataEmpty = () => ['expenses', 'income', 'goals', 'bills', 'recurring', 'debts', 'bankAccounts', 'networth', 'transfers', 'reconciliations']
        .every(k => { try { return JSON.parse(localStorage.getItem('financeApp_' + k) || '[]').length === 0; } catch (_) { return true; } });
    // The actual download+merge+upload cloud round-trip — runs once per debounce window,
    // no matter how many handleDataUpdate() calls fed into it (see cloudSyncDebounceRef above).
    const performCloudSync = async () => {
        if (!SyncService.isCloudEnabled()) return;
        if (cloudSyncInFlightRef.current) return;
        cloudSyncInFlightRef.current = true;
        setSyncStatus('syncing');
        try {
            // Download-first: merge any changes uploaded by another device
            // before writing our snapshot, so neither device loses data.
            let backupToUpload = DataService.createBackup(currentUser);
            try {
                const cloudBackup = await SyncService.download();
                if (cloudBackup && isBackupOwnedByCurrentUser(cloudBackup, currentUser)) {
                    const sigResult = await verifyBackupSignature(cloudBackup, currentUser);
                    if (isSignatureAcceptable(sigResult) && !sigResult.requiresConfirmation) {
                        const cloudTime = getBackupTimestamp(cloudBackup);
                        const lastSync = new Date(localStorage.getItem('financeApp_lastCloudSync') || 0).getTime();
                        if (cloudTime > lastSync) {
                            // Another device has uploaded since our last sync — merge
                            const merged = DataService.mergeBackups(backupToUpload, cloudBackup);
                            DataService.restoreBackup(merged);
                            DataService.isInitialized = false;
                            await reloadCoreData(activeView);
                            backupToUpload = merged;
                        }
                    }
                }
            } catch (_) { /* cloud check failed — proceed with local-only upload */ }
            const signedBackup = await signBackupForUpload(backupToUpload, currentUser);
            const result = await SyncService.upload(signedBackup);
            if (result.status === 'success') {
                setSyncStatus('synced'); setLastSyncTime(result.syncedAt); localStorage.setItem('financeApp_lastCloudSync', result.syncedAt);
                // Reconcile lastSaveTime with what we actually uploaded — otherwise it stays
                // pinned to the pre-upload stamp (set above by saveLatestBackup()), which is
                // always slightly older than backupToUpload.createdAt. On the next reload/login
                // the cloud-vs-local check then sees cloudTime > localTime and treats our own
                // just-uploaded data as "newer than local", triggering a spurious re-merge.
                if (backupToUpload.createdAt) localStorage.setItem('financeApp_lastSaveTime', backupToUpload.createdAt);
                clearCloudSyncPending();
            }
            else if (result.status === 'reconnect-needed') { setSyncStatus('reconnect-needed'); setReconnectBannerDismissed(false); }
            else if (result.status !== 'local') { setSyncStatus(result.status === 'not_configured' ? 'not_configured' : 'error'); }
        } catch (_) { setSyncStatus('error'); }
        finally { cloudSyncInFlightRef.current = false; }
    };
    const CLOUD_SYNC_DEBOUNCE_MS = 3000;
    const scheduleCloudSync = () => {
        if (cloudSyncDebounceRef.current) clearTimeout(cloudSyncDebounceRef.current);
        cloudSyncDebounceRef.current = setTimeout(() => { cloudSyncDebounceRef.current = null; performCloudSync(); }, CLOUD_SYNC_DEBOUNCE_MS);
    };
    const cancelScheduledCloudSync = () => { if (cloudSyncDebounceRef.current) { clearTimeout(cloudSyncDebounceRef.current); cloudSyncDebounceRef.current = null; } };

    // Marks that a local change hasn't been confirmed uploaded yet. Set optimistically
    // whenever a sync is scheduled (not just on failure) so the flag — and the banner it
    // drives — survives a tab close/reload that happens before the debounced sync fires
    // or while offline, instead of only surfacing after a failed attempt.
    const markCloudSyncPending = () => {
        if (!localStorage.getItem('financeApp_pendingCloudSync')) {
            const now = new Date().toISOString();
            localStorage.setItem('financeApp_pendingCloudSync', now);
            setPendingSyncSince(now);
            setPendingSyncBannerDismissed(false);
        }
    };
    const clearCloudSyncPending = () => {
        localStorage.removeItem('financeApp_pendingCloudSync');
        setPendingSyncSince('');
    };

    // Retries a pending sync as soon as the browser regains connectivity, instead of
    // waiting for the user's next edit or a manual "Sync now". The periodic check is a
    // fallback for the 'online' event not firing reliably (e.g. captive portals that
    // briefly report connectivity before the real request fails).
    useEffect(() => {
        const retryIfPending = () => {
            if (SyncService.isCloudEnabled() && navigator.onLine && localStorage.getItem('financeApp_pendingCloudSync')) {
                performCloudSync();
            }
        };
        window.addEventListener('online', retryIfPending);
        const intervalId = setInterval(retryIfPending, 2 * 60 * 1000);
        return () => { window.removeEventListener('online', retryIfPending); clearInterval(intervalId); };
    }, []);

    const handleDataUpdate = async () => {
        try {
            await reloadCoreData(activeView);
            await refreshNotifications();
            // Guard: check BEFORE saveLatestBackup() sets financeApp_lastSaveTime, so that
            // a freshly-wiped device (just logged in, no local data yet) doesn't overwrite
            // the cloud backup with empty data.
            const hasSavedLocally = !!localStorage.getItem('financeApp_lastSaveTime');
            DataService.saveLatestBackup();
            // Debounced: a burst of calls (e.g. one per row of a CSV import) coalesces into
            // a single cloud round-trip fired after the burst settles, instead of one per call.
            if (SyncService.isCloudEnabled() && hasSavedLocally) { markCloudSyncPending(); scheduleCloudSync(); }
        } catch (error) { console.error('Error updating data:', error); }
    };

    const handleRegister = (user) => { setCurrentUser(user); };
    // Profile/Settings name edits already persist to financeApp_currentUser directly —
    // this just keeps App's own currentUser state (which the header "name pin" initials
    // and Active View label read from) in sync, since those don't otherwise re-read
    // localStorage until the next login/reload.
    const handleCurrentUserDisplayNameChange = (newName) => {
        setCurrentUser(prev => prev ? { ...prev, displayName: newName } : prev);
    };
    const handleLogout = async () => {
        console.log('[BackupPref] handleLogout called', { uid: currentUser && currentUser.uid, prefBeforeWipe: localStorage.getItem('financeApp_storagePreference') });
        // Flush any unsynced edit BEFORE cancelling/wiping — cancelling first (the old
        // behavior) could permanently lose an edit made within the debounce window or while
        // offline, since clearAllUserData() below wipes the only local copy right after.
        // A failed flush is a lesser evil than blocking logout entirely, so proceed either way.
        if (localStorage.getItem('financeApp_pendingCloudSync') && SyncService.isCloudEnabled()) {
            try { await performCloudSync(); } catch (_) {}
        }
        // A pending debounced sync must not fire after logout — it would read the
        // about-to-be-wiped local data and could overwrite the cloud backup with it.
        cancelScheduledCloudSync();
        const pref = localStorage.getItem('financeApp_storagePreference') || '';
        if (pref === 'gdrive') GDriveService.clearToken();
        else if (pref === 'onedrive') OneDriveService.clearToken();
        // Clear session integrity token from sessionStorage (localStorage token wiped by clearAllUserData)
        sessionStorage.removeItem('financeApp_session_uid');
        sessionStorage.removeItem('financeApp_session_active');
        // Wipe per-screen list filters so the next user on this device starts clean
        FilterMemory.clearAll();
        // Rotate the backup signing key so it stops being valid for this account on this
        // device once logged out (a stolen key from a shared/borrowed device shouldn't
        // remain usable indefinitely)
        if (currentUser) rotateBackupSignKey(currentUser.uid || String(currentUser.id));
        // Wipe all financial data so the next user on this device starts with a clean slate
        DataService.clearAllUserData();
        setCurrentUser(null); setStoragePreference(''); setShowStoragePicker(false);
        setSyncStatus('idle'); setReconnectBannerDismissed(false);
        setCloudSyncGate('idle'); setCloudGateConnecting(false); setCloudGateError('');
        setExpenses([]); setIncome([]); setCategories([]); setPeople([]);
        // Logout can only be triggered from the Profile screen, so without this the next
        // login (in the same browser session, no full page reload) would land right back
        // on Profile instead of defaulting to Summary, since currentScreen otherwise
        // survives the logout/login cycle untouched.
        setCurrentScreen('summary');
    };
    const handleStorageConfirm = async (pref, cloudBackup) => {
        // Provider migration: switching from one cloud provider to another
        const oldPref = storagePreference;
        const isOldCloud = oldPref === 'gdrive' || oldPref === 'onedrive';
        const isNewCloud = pref === 'gdrive' || pref === 'onedrive';
        if (isOldCloud && isNewCloud && oldPref !== pref) {
            try {
                const oldSvc = oldPref === 'gdrive' ? GDriveService : OneDriveService;
                if (oldSvc.isConfigured() && oldSvc.isTokenValid()) {
                    const oldBackup = await oldSvc.download();
                    if (oldBackup && isBackupOwnedByCurrentUser(oldBackup, currentUser)) {
                        const sigResult = await verifyBackupSignature(oldBackup, currentUser);
                        // Skip auto-migration restore for unsigned backups — no modal here for TOFU
                        if (isSignatureAcceptable(sigResult) && !sigResult.requiresConfirmation) {
                            // Merge, don't overwrite — a raw restore would silently discard any local
                            // edit made since the old provider's last synced snapshot.
                            const merged = DataService.mergeBackups(DataService.createBackup(currentUser), oldBackup);
                            DataService.restoreBackup(merged);
                        }
                    }
                }
            } catch (_) {}
        }
        setStoragePreference(pref);
        setShowStoragePicker(false);
        setSyncStatus('idle');
        setReconnectBannerDismissed(false);
        localStorage.removeItem('financeApp_storagePickerSkipCount');
        // Reflect a backup that already succeeded (e.g. the picker's own upload when this
        // provider had no prior file) immediately, instead of waiting on handleDataUpdate()'s
        // own re-upload below to succeed before the Settings screen shows a synced time.
        const persistedSync = localStorage.getItem('financeApp_lastCloudSync');
        if ((pref === 'gdrive' || pref === 'onedrive') && persistedSync) { setLastSyncTime(persistedSync); setSyncStatus('synced'); }
        let showingRestore = false;
        if (cloudBackup && isBackupOwnedByCurrentUser(cloudBackup, currentUser)) {
            const cloudTime = getBackupTimestamp(cloudBackup);
            const localTime = new Date(localStorage.getItem('financeApp_lastCloudSync') || 0).getTime();
            if (cloudTime > localTime) { setCloudRestoreData(cloudBackup); setCloudSyncGate('restore-prompt'); showingRestore = true; }
        }
        // Upload local data to cloud immediately after connecting (unless we're showing the restore prompt)
        if ((pref === 'gdrive' || pref === 'onedrive') && !showingRestore) {
            handleDataUpdate();
        }
    };
    const handleOpenStoragePicker = () => { setShowStoragePicker(true); };
    const handleReconnect = async () => {
        const svc = storagePreference === 'gdrive' ? GDriveService : OneDriveService;
        if (!svc || !svc.isConfigured()) { setSyncStatus('not_configured'); return; }
        try {
            await svc.requestToken();
            // After re-connecting, check if cloud has newer data and offer restore
            setSyncStatus('syncing');
            try {
                const cloudBackup = await SyncService.download();
                if (cloudBackup && isBackupOwnedByCurrentUser(cloudBackup, currentUser)) {
                    const sigResult = await verifyBackupSignature(cloudBackup, currentUser);
                    if (!isSignatureAcceptable(sigResult)) throw new Error('Cloud backup integrity check failed — restore blocked.');
                    const cloudTime = getBackupTimestamp(cloudBackup);
                    const localTime = new Date(localStorage.getItem('financeApp_lastCloudSync') || 0).getTime();
                    if (cloudTime > localTime) {
                        if (!isLocalDataEmpty() && !sigResult.requiresConfirmation) {
                            const merged = DataService.mergeBackups(DataService.createBackup(currentUser), cloudBackup);
                            DataService.restoreBackup(merged);
                            DataService.isInitialized = false;
                            const signedM = await signBackupForUpload(merged, currentUser);
                            const mergeResult = await SyncService.upload(signedM);
                            if (mergeResult.status === 'success') { localStorage.setItem('financeApp_lastCloudSync', mergeResult.syncedAt); }
                            else { markCloudSyncPending(); }
                            await reloadCoreData(activeView);
                        } else {
                            setCloudRestoreData(cloudBackup);
                            setCloudSyncGate('restore-prompt');
                            setSyncStatus('idle');
                            return;
                        }
                    }
                }
            } catch (_) {
                setSyncStatus('error');
                return;
            }
            setReconnectBannerDismissed(true);
            setSyncStatus('idle');
            handleDataUpdate();
        } catch (_) { setSyncStatus('reconnect-needed'); }
    };
    const handleSyncNow = async () => {
        if (!SyncService.isCloudEnabled()) return;
        // A manual sync makes any pending debounced one from a recent edit redundant.
        cancelScheduledCloudSync();
        const svc = storagePreference === 'gdrive' ? GDriveService : OneDriveService;
        // If no valid token, show reconnect instead of trying (and failing with session-expired)
        if (!svc || !svc.isTokenValid()) { setSyncStatus('reconnect-needed'); setReconnectBannerDismissed(false); return; }
        setSyncStatus('syncing');
        try {
            // Download-first: if cloud is newer than local, offer restore instead of overwriting
            const cloudBackup = await SyncService.download();
            if (cloudBackup && isBackupOwnedByCurrentUser(cloudBackup, currentUser)) {
                const sigResult = await verifyBackupSignature(cloudBackup, currentUser);
                if (isSignatureAcceptable(sigResult)) {
                    const cloudTime = getBackupTimestamp(cloudBackup);
                    const localTime = new Date(localStorage.getItem('financeApp_lastCloudSync') || 0).getTime();
                    if (cloudTime > localTime) {
                        if (sigResult.requiresConfirmation) {
                            setCloudRestoreData(cloudBackup);
                            setCloudSyncGate('restore-prompt');
                            setSyncStatus('idle');
                            return;
                        }
                        // Merge cloud + local instead of replacing either side
                        const merged = DataService.mergeBackups(DataService.createBackup(currentUser), cloudBackup);
                        DataService.restoreBackup(merged);
                        DataService.isInitialized = false;
                        const signedMerged = await signBackupForUpload(merged, currentUser);
                        const mergeResult = await SyncService.upload(signedMerged);
                        if (mergeResult.status === 'success') { setSyncStatus('synced'); setLastSyncTime(mergeResult.syncedAt); localStorage.setItem('financeApp_lastCloudSync', mergeResult.syncedAt); clearCloudSyncPending(); }
                        else if (mergeResult.status === 'reconnect-needed') { setSyncStatus('reconnect-needed'); setReconnectBannerDismissed(false); }
                        else { setSyncStatus(mergeResult.status === 'not_configured' ? 'not_configured' : 'error'); }
                        await reloadCoreData(activeView);
                        return;
                    }
                }
            }
            // Local is up to date — upload it
            const signedForSync = await signBackupForUpload(DataService.createBackup(currentUser), currentUser);
            const result = await SyncService.upload(signedForSync);
            if (result.status === 'success') { setSyncStatus('synced'); setLastSyncTime(result.syncedAt); clearCloudSyncPending(); }
            else if (result.status === 'reconnect-needed') { setSyncStatus('reconnect-needed'); setReconnectBannerDismissed(false); }
            else { setSyncStatus(result.status === 'not_configured' ? 'not_configured' : 'error'); }
        } catch (_) { setSyncStatus('error'); }
    };
    const handleCloudGateConnect = async () => {
        const svc = storagePreference === 'gdrive' ? GDriveService : OneDriveService;
        if (!svc || !svc.isConfigured()) { setCloudSyncGate('idle'); return; }
        setCloudGateConnecting(true); setCloudGateError('');
        try {
            await svc.requestToken();
        } catch {
            // Only the OAuth step itself failing is actually a pop-up/permissions problem
            setCloudGateConnecting(false);
            setCloudGateError('Connection failed — check pop-up permissions and try again.');
            return;
        }
        setCloudGateConnecting(false); // OAuth complete — clear spinner before transition
        setCloudSyncGate('checking');
        try {
            const cloudBackup = await SyncService.download();
            if (!cloudBackup) { setCloudSyncGate('idle'); return; }
            // Fail-closed: reject backups that don't belong to the current user
            if (!isBackupOwnedByCurrentUser(cloudBackup, currentUser)) { setCloudSyncGate('idle'); return; }
            const sigResult = await verifyBackupSignature(cloudBackup, currentUser);
            if (!isSignatureAcceptable(sigResult)) { setCloudSyncGate('idle'); return; }
            const cloudTime = getBackupTimestamp(cloudBackup);
            const localTime = new Date(localStorage.getItem('financeApp_lastCloudSync') || 0).getTime();
            if (cloudTime > localTime) {
                if (!isLocalDataEmpty() && !sigResult.requiresConfirmation) {
                    const merged = DataService.mergeBackups(DataService.createBackup(currentUser), cloudBackup);
                    DataService.restoreBackup(merged);
                    DataService.isInitialized = false;
                    setCloudSyncGate('idle');
                    await reloadCoreData(activeView);
                    try {
                        const signed = await signBackupForUpload(merged, currentUser);
                        const result = await SyncService.upload(signed);
                        if (result.status === 'success') { setSyncStatus('synced'); setLastSyncTime(result.syncedAt); localStorage.setItem('financeApp_lastCloudSync', result.syncedAt); }
                        else { setSyncStatus('error'); markCloudSyncPending(); }
                    } catch (_) { setSyncStatus('error'); markCloudSyncPending(); }
                } else {
                    setCloudRestoreData(cloudBackup); setCloudSyncGate('restore-prompt');
                }
            }
            else { setCloudSyncGate('idle'); }
        } catch {
            // A Drive/network/verification failure here has nothing to do with OAuth pop-ups —
            // showing the pop-up-permissions message here sent users to re-grant a permission
            // they already had, with no way to fix the actual problem. Return to the reconnect
            // screen (instead of leaving the app stuck on the "Checking…" spinner forever) with
            // wording that matches what actually failed.
            setCloudSyncGate('reconnect-prompt');
            setCloudGateError("Connected, but couldn't reach your cloud backup — check your connection and try again.");
        }
    };
    const handleCloudGateSkip = () => { setCloudSyncGate('idle'); setCloudGateError(''); };

    const handleCurrencyChange = (newCurrency) => {
        setDefaultCurrency(newCurrency);
        DataService.getCustomCurrencies().filter(c => c.isLive).forEach(async c => {
            const rate = await CurrencyService.lookupLiveRate(c.code, newCurrency);
            if (rate != null) DataService.updateCustomCurrencyRate(c.id, { rate, rateAgainst: newCurrency, isLive: true });
            else DataService.updateCustomCurrencyRate(c.id, { rate: c.rate, rateAgainst: c.rateAgainst, isLive: false });
        });
        handleDataUpdate();
    };

    const renderScreen = () => {
        switch (currentScreen) {
            case 'expenses': return <ExpenseList expenses={expenses} categories={categories} onUpdate={handleDataUpdate} initialDateFrom={expensesInitDateFrom} initialDateTo={expensesInitDateTo} activeView={activeView} defaultCurrency={defaultCurrency} />;
            case 'trends': return <MonthlyTrends expenses={expenses} income={income} categories={categories} defaultCurrency={defaultCurrency} onMonthSelect={(from, to) => { setExpensesInitDateFrom(from); setExpensesInitDateTo(to); setCurrentScreen('expenses'); }} />;
            case 'add-expense': return <ExpenseForm categories={categories} onSave={handleDataUpdate} onCancel={() => setCurrentScreen('expenses')} activeView={activeView} />;
            case 'categories': return <CategoryManager categories={categories} assetCategories={assetCategories} liabilityCategories={liabilityCategories} onUpdate={handleDataUpdate} defaultCurrency={defaultCurrency} activeView={activeView} />;
            case 'income': return <IncomeForm income={income} onUpdate={handleDataUpdate} activeView={activeView} defaultCurrency={defaultCurrency} autoOpenForm={incomeAutoOpen} onFormOpened={() => setIncomeAutoOpen(false)} />;
            case 'summary': return <Summary expenses={expenses} income={income} categories={categories} defaultCurrency={defaultCurrency} activeView={activeView} onUpdate={handleDataUpdate} currentUser={currentUser} notifications={notifications} onNavigate={navigate} />;
            case 'goals': return <SavingsGoals defaultCurrency={defaultCurrency} activeView={activeView} onUpdate={handleDataUpdate} />;
            case 'manage': case 'bills': case 'recurring': case 'debts':
                return <ManageScreen categories={categories} defaultCurrency={defaultCurrency} onUpdate={handleDataUpdate} activeView={activeView} initialTab={currentScreen} />;
            case 'bulk-upload': return <BulkUpload categories={categories} assetCategories={assetCategories} liabilityCategories={liabilityCategories} activeView={activeView} onUpdate={handleDataUpdate} />;
            case 'accounts': return <AccountsScreen categories={categories} activeView={activeView} defaultCurrency={defaultCurrency} onUpdate={handleDataUpdate} />;
            case 'networth': return <NetWorth defaultCurrency={defaultCurrency} activeView={activeView} assetCategories={assetCategories} liabilityCategories={liabilityCategories} onUpdate={handleDataUpdate} />;
            case 'settings': return <SettingsScreen currentCurrency={defaultCurrency} onCurrencyChange={handleCurrencyChange} currentUser={currentUser} onStoragePickerOpen={handleOpenStoragePicker} syncStatus={syncStatus} lastSyncTime={lastSyncTime} storagePreference={storagePreference} onSyncNow={handleSyncNow} onReconnect={handleReconnect} onViewHistory={() => setShowCloudHistory(true)} activeView={activeView} onActiveViewChange={handleActiveViewChange} scrollTarget={settingsScrollTarget} onScrollTargetHandled={() => setSettingsScrollTarget(null)} onDisplayNameChange={handleCurrentUserDisplayNameChange} categories={categories} onUpdate={handleDataUpdate} />;
            case 'export': return <ExportData expenses={expenses} income={income} categories={categories} netWorthItems={netWorthItems} assetCategories={assetCategories} liabilityCategories={liabilityCategories} defaultCurrency={defaultCurrency} activeView={activeView} onNavigate={setCurrentScreen} />;
            // Profile now opens as a sheet from the header avatar; 'profile' falls back to More.
            case 'more': case 'profile': return <MoreScreen onNavigate={navigate} />;
            default: return <ExpenseList expenses={expenses} categories={categories} onUpdate={handleDataUpdate} activeView={activeView} defaultCurrency={defaultCurrency} />;
        }
    };

    if (authLoading) return <AuthLoading title="Signing you in…" />;
    if (!currentUser) return <RegistrationScreen onRegister={handleRegister} onLogin={handleRegister} />;
    if (!currentUser.displayName) return <DisplayNamePrompt onRegister={handleRegister} />;
    if (showStoragePicker) return <StoragePickerModal currentUser={currentUser} initialPreference={storagePreference || 'local'} onConfirm={handleStorageConfirm} onSkip={() => { localStorage.setItem('financeApp_storagePickerSkipCount', '2'); setShowStoragePicker(false); }} />;
    if (cloudSyncGate === 'checking') return <AuthLoading title="Checking cloud backup…" sub={storagePreference === 'gdrive' ? 'Google Drive' : 'OneDrive'} />;
    if (cloudSyncGate === 'reconnect-prompt') return (
        <CloudReconnectGate provider={storagePreference} connecting={cloudGateConnecting} error={cloudGateError} onConnect={handleCloudGateConnect} onSkip={handleCloudGateSkip} />
    );
    if (cloudSyncGate === 'restore-prompt' && cloudRestoreData) return (
        <CloudRestoreModal
            backupData={cloudRestoreData}
            currentUser={currentUser}
            onRestore={async () => {
                // Restore in-place — no page reload needed.
                // DataService.restoreBackup() was already called inside CloudRestoreModal
                // before onRestore fires; force a cache-bust so handleDataUpdate re-reads
                // the freshly restored localStorage values instead of stale in-memory data.
                DataService.isInitialized = false;
                setCloudRestoreData(null);
                setCloudSyncGate('idle');
                await handleDataUpdate();
            }}
            onKeepLocal={() => { setCloudRestoreData(null); setCloudSyncGate('idle'); handleDataUpdate(); }}
        />
    );

    const hasLocalData = expenses.length > 0 || income.length > 0;
    const showLocalDeviceBanner = storagePreference === 'local'
        && localStorage.getItem('financeApp_storagePickerConfirmed') === 'true'
        && !localStorage.getItem('financeApp_latestBackup')
        && hasLocalData
        && !localDeviceBannerDismissed;

    // ── Redesign shell (Phase 0): navigation ──
    // Dock tabs reset the back-stack; screens opened from More / the + sheet push onto it.
    const PRIMARY_SCREENS = ['summary', 'expenses', 'manage', 'bills', 'recurring', 'debts', 'more', 'profile'];
    const isPrimaryScreen = PRIMARY_SCREENS.includes(currentScreen);
    const navigate = (screen) => { setShellSheet(null); setScreenHistory(h => [...h, currentScreen].slice(-20)); setCurrentScreen(screen); };
    const goToTab = (screen) => { setShellSheet(null); setScreenHistory([]); setCurrentScreen(screen); };
    const goBack = () => {
        const prev = screenHistory.length ? screenHistory[screenHistory.length - 1] : 'more';
        setScreenHistory(screenHistory.slice(0, -1));
        setCurrentScreen(prev);
    };

    // ── Redesign shell: sync status, derived only from existing state ──
    const isCloudStorage = storagePreference === 'gdrive' || storagePreference === 'onedrive';
    const storageLabel = storagePreference === 'gdrive' ? 'Google Drive' : storagePreference === 'onedrive' ? 'OneDrive' : 'This device';
    const storedConflicts = (() => { try { return JSON.parse(localStorage.getItem('financeApp_syncConflicts')) || {}; } catch (_) { return {}; } })();
    const CONFLICT_SCREENS = {
        expenses: ['Expenses', 'expenses'], income: ['Income', 'income'], goals: ['Goals', 'goals'],
        bills: ['Bills', 'manage'], recurring: ['Recurring', 'manage'], debts: ['Debts', 'manage'],
        categories: ['Categories', 'categories'], assetCategories: ['Asset categories', 'categories'], liabilityCategories: ['Liability categories', 'categories'],
        networth: ['Net Worth', 'networth'], bankAccounts: ['Bank accounts', 'accounts'],
        transfers: ['Transfers', 'accounts'], reconciliations: ['Reconciliations', 'accounts']
    };
    const conflictGroups = Object.keys(CONFLICT_SCREENS)
        .map(k => ({ key: k, label: CONFLICT_SCREENS[k][0], screen: CONFLICT_SCREENS[k][1], count: Object.keys(storedConflicts[k] || {}).length }))
        .filter(g => g.count > 0);
    const conflictTotal = conflictGroups.reduce((s, g) => s + g.count, 0);
    const closeAnd = (fn) => () => { setShellSheet(null); fn(); };
    let syncView;
    if (!isCloudStorage) syncView = { tone: 'idle', icon: 'fas fa-mobile-screen', title: 'Stored on this device', detail: 'Cloud sync is off. Back up regularly or connect cloud storage.', action: 'Set up sync', actionIcon: 'fas fa-cloud', onAction: closeAnd(handleOpenStoragePicker) };
    else if (syncStatus === 'syncing') syncView = { tone: 'idle', icon: 'fas fa-rotate fa-spin', title: 'Syncing…', detail: 'Uploading your latest changes.' };
    else if (syncStatus === 'reconnect-needed') syncView = { tone: 'bad', icon: 'fas fa-cloud', title: 'Sync disconnected', detail: storageLabel + ' access expired. Changes are saved on this device only.', action: 'Reconnect', actionIcon: 'fas fa-plug', onAction: closeAnd(handleReconnect) };
    else if (syncStatus === 'error') syncView = { tone: 'bad', icon: 'fas fa-circle-exclamation', title: 'Sync error', detail: "The last sync didn't finish. Your changes are still saved on this device.", action: 'Try again', onAction: closeAnd(handleSyncNow) };
    else if (syncStatus === 'not_configured') syncView = { tone: 'warn', icon: 'fas fa-cloud', title: 'Cloud sync not configured', detail: storageLabel + " isn't set up on this server, so changes stay on this device." };
    else if (pendingSyncBannerReady) syncView = { tone: 'warn', icon: 'fas fa-cloud-arrow-up', title: 'Changes not backed up', detail: "Some changes are only on this device. We'll retry automatically, or back up now.", action: 'Back up now', actionIcon: 'fas fa-cloud-arrow-up', onAction: closeAnd(handleSyncNow) };
    else if (conflictTotal > 0) syncView = { tone: 'info', icon: 'fas fa-code-compare', title: conflictTotal + ' conflict' + (conflictTotal === 1 ? '' : 's') + ' to review', detail: 'These records were changed here and on another device. Open a screen below to compare the two versions.', action: 'Sync now', onAction: closeAnd(handleSyncNow) };
    else syncView = { tone: 'ok', icon: 'fas fa-cloud', title: 'Synced', detail: 'All changes are backed up to ' + storageLabel + '.', action: 'Sync now', onAction: closeAnd(handleSyncNow) };
    // Header icon colours follow the design: green when synced, indigo for conflicts, grey for
    // pending / disconnected / local (with a dot where action is needed). "Sync error" isn't in
    // the design, so it stays red.
    const syncIconColor = syncView.tone === 'ok' ? '#16a34a' : syncView.tone === 'info' ? '#4f46e5' : syncStatus === 'error' && isCloudStorage ? '#e11d48' : syncStatus === 'syncing' ? '#64748b' : '#94a3b8';
    const syncNeedsAttention = syncView.tone === 'bad' || syncView.tone === 'warn' || syncView.tone === 'info';
    const peopleList = people && people.length ? people : DataService.getPeople();

    return (
        <div className="mobile-app sp-shell">
            <header className="sp-top">
                <ViewBar activeView={activeView} currentUser={currentUser} people={peopleList} onOpen={() => setShellSheet('view')} />
                <button type="button" className="sp-iconbtn" onClick={() => setShellSheet('sync')} title={syncView.title}>
                    <i className={syncView.icon} style={{color: syncIconColor}}></i>
                    {syncNeedsAttention && <span className="sp-iconbtn-dot" style={{background: syncIconColor}}></span>}
                </button>
                <button type="button" className={'sp-avatar-btn' + (shellSheet === 'profile' ? ' is-open' : '')} onClick={() => setShellSheet('profile')} title="My profile">
                    {((currentUser && currentUser.displayName) || '?').trim().charAt(0).toUpperCase()}
                </button>
            </header>
            {/* The same conditions and dismiss behaviour as the old banners, shown as pop-up messages. */}
            <div className="sp-toasts">
                {syncMergeToast && (
                    <SpToast tone="info" icon="fas fa-code-merge" title="Synced" text={syncMergeToast} onClose={() => setSyncMergeToast('')} />
                )}
                {syncStatus === 'reconnect-needed' && !reconnectBannerDismissed && (
                    <SpToast tone="err" icon="fas fa-cloud" title="Cloud sync disconnected" text="Your data isn't backing up." action={'Reconnect ' + (storagePreference === 'gdrive' ? 'Google Drive' : 'OneDrive')} onAction={handleReconnect} onClose={() => setReconnectBannerDismissed(true)} />
                )}
                {pendingSyncBannerReady && !pendingSyncBannerDismissed && syncStatus !== 'syncing' && syncStatus !== 'reconnect-needed' && (
                    <SpToast tone="warn" icon="fas fa-cloud-arrow-up" title="Changes not backed up" text={'Pending since ' + new Date(pendingSyncSince).toLocaleString() + ". We'll retry automatically."} action="Sync now" onAction={handleSyncNow} onClose={() => setPendingSyncBannerDismissed(true)} />
                )}
                {showLocalDeviceBanner && (
                    <SpToast tone="warn" icon="fas fa-triangle-exclamation" title="Your data is stored on another device" text="Import a backup to restore it here, or switch your storage in Settings." action="Import a backup" onAction={() => navigate('settings')} onClose={() => { localStorage.setItem('financeApp_localBannerDismissed', DateUtils.today()); setLocalDeviceBannerDismissed(true); }} />
                )}
            </div>
            {!isPrimaryScreen && currentScreen !== 'add-expense' && (
                <div className="sp-backbar">
                    <button type="button" className="sp-backbtn" onClick={goBack} title="Back"><i className="fas fa-arrow-left"></i></button>
                    <span className="sp-backbar-title">Back</span>
                </div>
            )}
            <div className="app-content">{renderScreen()}</div>
            <Dock currentScreen={currentScreen} onTab={goToTab} onPlus={() => setShellSheet('add')} />

            {shellSheet === 'view' && (
                <ActiveViewSheet activeView={activeView} currentUser={currentUser} people={peopleList} onChange={handleActiveViewChange}
                    onClose={() => setShellSheet(null)}
                    onManagePeople={() => { setShellSheet(null); navigate('settings'); }} />
            )}
            {shellSheet === 'sync' && (
                <SyncSheet view={syncView} providerLabel={storageLabel} lastSyncTime={lastSyncTime} pendingSince={pendingSyncSince} conflictGroups={conflictGroups} isCloud={isCloudStorage}
                    onClose={() => setShellSheet(null)}
                    onOpenConflicts={(screen) => navigate(screen)}
                    onStorageSettings={() => navigate('settings')}
                    onViewHistory={() => { setShellSheet(null); setShowCloudHistory(true); }} />
            )}
            {shellSheet === 'profile' && (
                <Sheet onClose={() => setShellSheet(null)}>
                    <ProfileScreen currentUser={currentUser} onLogout={async () => { await handleLogout(); setShellSheet(null); setScreenHistory([]); }} onUpdate={handleDataUpdate} onDisplayNameChange={handleCurrentUserDisplayNameChange}
                        onClose={() => setShellSheet(null)} pendingSince={pendingSyncSince} />
                </Sheet>
            )}
            {shellSheet === 'add' && (
                <QuickAddSheet onClose={() => setShellSheet(null)} onPick={(screen) => { if (screen === 'income') setIncomeAutoOpen(true); navigate(screen); }} />
            )}
            {showCloudHistory && (
                <CloudHistoryModal
                    onClose={() => setShowCloudHistory(false)}
                    onRestored={() => {
                        setShowCloudHistory(false);
                        DataService.isInitialized = false;
                        handleDataUpdate();
                    }}
                    currentUser={currentUser}
                />
            )}
        </div>
    );
}

class ErrorBoundary extends React.Component {
    constructor(props) {
        super(props);
        this.state = { hasError: false };
    }
    static getDerivedStateFromError() {
        return { hasError: true };
    }
    componentDidCatch(error, errorInfo) {
        console.error('Unhandled error in app:', error, errorInfo);
    }
    render() {
        if (this.state.hasError) {
            return (
                <div style={{padding: '2rem', textAlign: 'center', maxWidth: '480px', margin: '4rem auto'}}>
                    <i className="fas fa-exclamation-triangle" style={{fontSize: '2rem', color: '#dc3545', marginBottom: '1rem'}}></i>
                    <h4>Something went wrong</h4>
                    <p className="text-muted">The app hit an unexpected error and couldn't continue. Your data is saved locally and hasn't been lost.</p>
                    <button className="btn btn-primary" onClick={() => window.location.reload()}>Reload App</button>
                </div>
            );
        }
        return this.props.children;
    }
}

ReactDOM.render(<ErrorBoundary><App /></ErrorBoundary>, document.getElementById('root'));
    </script>
</body>
</html>
