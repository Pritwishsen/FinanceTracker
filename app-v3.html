const SP_NOTIFY_CHOICES = [50, 70, 80, 90, 100];

function CategoryFormSheet({ kind, category, look, existingNames, onClose, onSave }) {
    const isExpense = kind === 'expense';
    const [name, setName] = useState(category ? category.name : '');
    const [icon, setIcon] = useState(category ? (category.icon || '') : SP_CAT_ICON_CHOICES[0][0]);
    const [subs, setSubs] = useState([]);
    const [subDraft, setSubDraft] = useState('');
    const [error, setError] = useState('');
    const shownIcon = icon || (look && look.icon) || SP_CAT_ICON_CHOICES[0][0];
    const choice = SP_CAT_ICON_CHOICES.find(c => c[0] === shownIcon);
    const headLook = isExpense ? (choice ? { icon: choice[0], tint: choice[1], ink: choice[2] } : look) : { icon: kind === 'asset' ? 'fas fa-layer-group' : 'fas fa-file-invoice-dollar', tint: kind === 'asset' ? '#dcfce7' : '#fee2e2', ink: kind === 'asset' ? '#16a34a' : '#e11d48' };
    const addSub = () => {
        const s = subDraft.trim();
        if (!s) return;
        if (subs.includes(s)) { setError('Subcategory already exists'); return; }
        setSubs(prev => [...prev, s]); setSubDraft(''); setError('');
    };
    const save = () => {
        const n = name.trim();
        if (isExpense) { const v = ValidationUtils.validateCategory({ name: n }); if (!v.isValid) { setError(v.errors.name); return; } }
        else if (!n) { setError('Category name is required'); return; }
        if (existingNames.some(x => x.toLowerCase() === n.toLowerCase() && (!category || x.toLowerCase() !== category.name.toLowerCase()))) { setError('Category name already exists'); return; }
        const pendingSub = subDraft.trim();
        onSave({ name: n, icon: icon || '', subs: pendingSub && !subs.includes(pendingSub) ? [...subs, pendingSub] : subs });
    };
    const noun = kind === 'expense' ? 'expense' : kind;
    return (
        <Sheet onClose={onClose} footer={<React.Fragment>
            <button type="button" className="sp-btn sp-btn-cancel" onClick={onClose}>Cancel</button>
            <button type="button" className="sp-btn sp-btn-primary sp-btn-grow" onClick={save}><i className="fas fa-check"></i>{category ? 'Save changes' : 'Save category'}</button>
        </React.Fragment>}>
            <SpSheetHead icon={headLook.icon} tint={headLook.tint} ink={headLook.ink} title={category ? 'Edit ' + noun + ' category' : 'New ' + noun + ' category'} />
            {error && <div className="sp-alert sp-alert-err"><i className="fas fa-circle-exclamation"></i><span>{error}</span></div>}
            <div className="sp-formcard" style={{marginTop: 0}}>
                <div className={'sp-formrow' + (error && !name.trim() ? ' is-bad' : '')}><span>Name</span><input type="text" value={name} placeholder={isExpense ? 'e.g. Pets' : 'e.g. Crypto'} onChange={e => { setName(e.target.value); setError(''); }} autoFocus /></div>
            </div>
            {isExpense && (
                <React.Fragment>
                    <div className="sp-formlabel">Icon</div>
                    <div className="sp-icongrid">
                        {SP_CAT_ICON_CHOICES.map(([ic, tint, ink]) => (
                            <button key={ic} type="button" className={shownIcon === ic ? 'is-active' : ''} style={{background: tint, color: ink}} onClick={() => setIcon(ic)} aria-label={ic.replace('fas fa-', '')}><i className={ic}></i></button>
                        ))}
                    </div>
                    {category && !category.icon && !icon && <div className="sp-hint" style={{margin: '6px 4px 0', fontSize: '11px'}}>Showing a suggested icon. Tap one to save it.</div>}
                </React.Fragment>
            )}
            {!category && (
                <React.Fragment>
                    <div className="sp-formlabel">Sub categories</div>
                    <div className="sp-subadd-card">
                        {subs.length > 0 && <div className="sp-subchips">{subs.map(s => <span key={s}>{s}<button type="button" onClick={() => setSubs(prev => prev.filter(x => x !== s))} aria-label={'Remove ' + s}><i className="fas fa-xmark"></i></button></span>)}</div>}
                        <form className="sp-subadd" onSubmit={e => { e.preventDefault(); addSub(); }}>
                            <input type="text" value={subDraft} placeholder="Add a sub category" onChange={e => setSubDraft(e.target.value)} />
                            <button type="submit">Add</button>
                        </form>
                    </div>
                </React.Fragment>
            )}
        </Sheet>
    );
}

// Sub-category list shared by expense and net-worth categories. `ops` supplies the
// existing DataService calls and usage counts; rename keeps the "updates N records" confirm.
function SpSubcategoryList({ category, ops, budgetInput, onChanged }) {
    const [editing, setEditing] = useState(null); // { oldName, value }
    const [renameConfirm, setRenameConfirm] = useState(null);
    const [pendingDelete, setPendingDelete] = useState(null);
    const [blocked, setBlocked] = useState(null); // { name, msg }
    const [draft, setDraft] = useState('');
    const [error, setError] = useState('');
    const add = async (e) => {
        e.preventDefault();
        const s = draft.trim();
        if (!s) { setError('Subcategory name is required'); return; }
        if (category.subcategories.includes(s)) { setError('Subcategory already exists'); return; }
        await ops.add(s); setDraft(''); setError(''); onChanged('Sub category added');
    };
    const requestRename = async () => {
        const newName = (editing.value || '').trim();
        if (!newName) { setError('Subcategory name is required'); return; }
        if (newName === editing.oldName) { setEditing(null); return; }
        if (category.subcategories.includes(newName)) { setError('Subcategory already exists'); return; }
        setError('');
        const usage = await ops.renameUsage(editing.oldName);
        if (usage.total === 0) { await ops.rename(editing.oldName, newName); setEditing(null); onChanged('Sub category renamed'); return; }
        setRenameConfirm({ oldName: editing.oldName, newName, ...usage });
    };
    const confirmRename = async () => { await ops.rename(renameConfirm.oldName, renameConfirm.newName); setRenameConfirm(null); setEditing(null); onChanged('Sub category renamed'); };
    const askDelete = async (name) => {
        setBlocked(null); setPendingDelete(null);
        const n = await ops.deleteUsage(name);
        if (n > 0) { setBlocked({ name, msg: 'Can\'t delete ' + name + ': it\'s used by ' + n + ' ' + ops.itemWord + (n === 1 ? '' : 's') + '.' }); return; }
        setPendingDelete(name);
    };
    const doDelete = async (name) => { await ops.remove(name); setPendingDelete(null); onChanged('Sub category deleted'); };
    return (
        <div className="sp-sublist">
            {category.subcategories.map(sub => {
                const isEditing = editing && editing.oldName === sub;
                const uses = ops.useLabel ? ops.useLabel(sub) : '';
                return (
                    <div key={sub} className="sp-subrow">
                        {isEditing ? (
                            <div className="sp-subedit">
                                <input type="text" value={editing.value} autoFocus onChange={e => setEditing(p => ({ ...p, value: e.target.value }))} onKeyDown={e => { if (e.key === 'Enter') requestRename(); if (e.key === 'Escape') setEditing(null); }} />
                                <button type="button" className="sp-subedit-cancel" onClick={() => { setEditing(null); setRenameConfirm(null); setError(''); }}>Cancel</button>
                                <button type="button" className="sp-subedit-save" onClick={requestRename}>Save</button>
                            </div>
                        ) : (
                            <div className="sp-subview">
                                <div className="sp-subname"><div>{sub}</div>{uses && <span>{uses}</span>}</div>
                                {budgetInput && budgetInput(sub)}
                                <button type="button" className="sp-subbtn" onClick={() => { setEditing({ oldName: sub, value: sub }); setPendingDelete(null); setBlocked(null); }} title="Rename"><i className="fas fa-pen"></i></button>
                                <button type="button" className="sp-subbtn is-danger" onClick={() => askDelete(sub)} title="Delete"><i className="fas fa-trash"></i></button>
                            </div>
                        )}
                        {isEditing && renameConfirm && (
                            <InlineConfirm text={'Rename ' + renameConfirm.oldName + ' to ' + renameConfirm.newName + '? This updates ' + renameConfirm.total + ' record' + (renameConfirm.total === 1 ? '' : 's') + (renameConfirm.detail ? ' (' + renameConfirm.detail + ')' : '') + '.'} keepLabel="Cancel" cta="Rename" onKeep={() => setRenameConfirm(null)} onConfirm={confirmRename} />
                        )}
                        {blocked && blocked.name === sub && <div className="sp-blocked"><i className="fas fa-circle-info"></i><span>{blocked.msg}</span></div>}
                        {pendingDelete === sub && <InlineConfirm text={'Delete ' + sub + '?'} keepLabel="Cancel" cta="Delete" onKeep={() => setPendingDelete(null)} onConfirm={() => doDelete(sub)} />}
                    </div>
                );
            })}
            <form className="sp-subadd" onSubmit={add}>
                <input type="text" value={draft} placeholder="Add a sub category" onChange={e => { setDraft(e.target.value); setError(''); }} />
                <button type="submit"><i className="fas fa-plus" style={{marginRight: '5px'}}></i>Add</button>
            </form>
            {error && <div className="sp-suberror">{error}</div>}
        </div>
    );
}

function CategoryManager({ categories, assetCategories, liabilityCategories, onUpdate, defaultCurrency, activeView }) {
    const [tab, setTab] = useState(() => { const t = FilterMemory.load('categories').tab; return ['expense', 'asset', 'liability'].includes(t) ? t : 'expense'; });
    useEffect(() => { FilterMemory.save('categories', { tab }); }, [tab]);
    const [openId, setOpenId] = useState(null);
    const [toast, setToast] = useState('');
    useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(''), 3000); return () => clearTimeout(t); }, [toast]);
    const [formFor, setFormFor] = useState(null); // null | 'new' | category
    const [pendingDelete, setPendingDelete] = useState(null);
    const [blocked, setBlocked] = useState(null); // { id, msg }
    const [askReset, setAskReset] = useState(false);
    const [renameCatConfirm, setRenameCatConfirm] = useState(null); // net-worth rename { id, oldName, newName, itemCount }
    const [showConflictDetail, setShowConflictDetail] = useState(null); // category id
    const [drafts, setDrafts] = useState({}); // unsaved budget input text by key
    const [usage, setUsage] = useState({ exp: {}, bills: {} }); // counts by 'catId|sub'
    const people = DataService.getPeople();
    const done = async (msg) => { if (msg) setToast(msg); await onUpdate(); };
    const switchTab = (t) => { setTab(t); setOpenId(null); setPendingDelete(null); setBlocked(null); setAskReset(false); };

    // Budgets are only shown and edited while a single person is active (C1); with several
    // people there's no single "whose budget", so they're hidden with a note instead.
    const isSingleView = activeView.length === 1;
    const editingPersonKey = isSingleView ? (resolveActiveViewValue(activeView) === '' ? 'own' : resolveActiveViewValue(activeView)) : null;
    const whoName = !editingPersonKey ? '' : editingPersonKey === 'own' ? ((JSON.parse(localStorage.getItem('financeApp_currentUser') || 'null') || {}).displayName || 'You').split(' ')[0] : editingPersonKey;
    const pbOf = (cat) => (editingPersonKey && cat.personBudgets && cat.personBudgets[editingPersonKey]) || null;
    const hasBudgetCurrencyMismatch = !!editingPersonKey && categories.some(cat => { const pb = pbOf(cat); return pb && pb.budgetCurrency && pb.budgetCurrency !== defaultCurrency && (pb.monthlyBudget > 0 || (pb.subcategoryBudgets && Object.values(pb.subcategoryBudgets).some(v => v > 0))); });
    const budgetSym = (cat, sub) => {
        const pb = pbOf(cat);
        if (!hasBudgetCurrencyMismatch || !pb) return ValidationUtils.getCurrencySymbol(defaultCurrency);
        const c = sub ? (pb.subcategoryBudgetCurrencies && pb.subcategoryBudgetCurrencies[sub]) : pb.budgetCurrency;
        return ValidationUtils.getCurrencySymbol(c || defaultCurrency);
    };
    const subMode = (cat) => { const pb = pbOf(cat); return !!(pb && pb.useSubcategoryBudgets) && cat.subcategories.length > 0; };
    const storedBudget = (cat, sub) => { const pb = pbOf(cat); if (!pb) return 0; return sub ? ((pb.subcategoryBudgets && pb.subcategoryBudgets[sub]) || 0) : (pb.monthlyBudget || 0); };
    const catTotal = (cat) => subMode(cat) ? cat.subcategories.reduce((s, sub) => s + (parseFloat(storedBudget(cat, sub)) || 0), 0) : (parseFloat(storedBudget(cat)) || 0);
    const totalBudget = categories.reduce((s, c) => s + catTotal(c), 0);
    const budgetedCount = categories.filter(c => catTotal(c) > 0).length;
    const heroCurrency = hasBudgetCurrencyMismatch ? ((categories.map(pbOf).find(pb => pb && pb.budgetCurrency) || {}).budgetCurrency || defaultCurrency) : defaultCurrency;
    const fmt0 = (v, cur) => ValidationUtils.getCurrencySymbol(cur || defaultCurrency) + Math.round(v).toLocaleString((cur || defaultCurrency) === 'INR' ? 'en-IN' : 'en-GB');

    // Expense / bill counts per sub category (display only, for "N expenses" and rename confirms).
    useEffect(() => {
        let cancelled = false;
        DataService.getExpenses().then(exps => {
            if (cancelled) return;
            const exp = {}, bills = {};
            exps.forEach(e => { const k = e.categoryId + '|' + (e.subcategory || ''); exp[k] = (exp[k] || 0) + 1; exp[e.categoryId + '|*'] = (exp[e.categoryId + '|*'] || 0) + 1; });
            DataService.getBills().forEach(b => { const k = b.categoryId + '|' + (b.subcategory || ''); bills[k] = (bills[k] || 0) + 1; });
            setUsage({ exp, bills });
        });
        return () => { cancelled = true; };
    }, [categories]);

    // Budgets save on their own (C2): when a field loses focus, or on Enter.
    const draftKey = (cat, sub) => 'b:' + cat.id + ':' + (sub || '');
    const budgetValue = (cat, sub) => { const k = draftKey(cat, sub); return drafts[k] !== undefined ? drafts[k] : (storedBudget(cat, sub) || ''); };
    const commitBudget = async (cat, sub) => {
        const k = draftKey(cat, sub);
        if (drafts[k] === undefined) return;
        const value = drafts[k];
        setDrafts(prev => { const n = { ...prev }; delete n[k]; return n; });
        if ((parseFloat(value) || 0) === (parseFloat(storedBudget(cat, sub)) || 0)) return;
        if (sub) await DataService.setSubcategoryBudget(cat.id, sub, value, defaultCurrency, editingPersonKey);
        else await DataService.setCategoryBudget(cat.id, value, defaultCurrency, editingPersonKey);
        done('Budget saved');
    };
    const moneyInput = (cat, sub) => (
        <span className="sp-budgetin">
            <span>{budgetSym(cat, sub)}</span>
            <input type="number" min="0" step="1" inputMode="decimal" placeholder="0" disabled={hasBudgetCurrencyMismatch}
                value={budgetValue(cat, sub)}
                onChange={e => { const v = e.target.value; setDrafts(prev => ({ ...prev, [draftKey(cat, sub)]: v })); }}
                onBlur={() => commitBudget(cat, sub)}
                onKeyDown={e => { if (e.key === 'Enter') e.currentTarget.blur(); }} />
        </span>
    );
    const setMode = async (cat, useSub) => { await DataService.setUseSubcategoryBudgets(cat.id, editingPersonKey, useSub); done(useSub ? 'Budget set by sub category' : 'Budget set for the whole category'); };
    const threshold = (cat) => { const pb = pbOf(cat); return (pb && pb.notificationThreshold) || 80; };
    const setThreshold = async (cat, v) => { await DataService.setPersonBudgetThreshold(cat.id, editingPersonKey, Math.min(100, Math.max(50, parseInt(v) || 80))); done('Notify level saved'); };
    const handleResetAll = async () => { setAskReset(false); await DataService.resetAllBudgets(defaultCurrency, editingPersonKey); setDrafts({}); done('All budgets reset for ' + whoName); };

    const netType = tab === 'asset' || tab === 'liability' ? tab : null;
    const list = tab === 'expense' ? categories : tab === 'asset' ? assetCategories : liabilityCategories;
    const conflictCollection = tab === 'expense' ? 'categories' : tab === 'asset' ? 'assetCategories' : 'liabilityCategories';
    const syncConflicts = useMemo(() => SyncConflicts.read(conflictCollection), [conflictCollection, list]);
    const conflictCategory = showConflictDetail ? list.find(c => c.id === showConflictDetail) : null;
    const conflictSnapshot = showConflictDetail ? syncConflicts[String(showConflictDetail)] : null;
    const categoryConflictFieldLabels = { name: 'Name', subcategories: 'Subcategories', icon: 'Icon', personBudgets: 'Budgets' };
    const formatCategoryConflictValue = (key, value) => {
        if (key === 'subcategories') return Array.isArray(value) && value.length ? value.join(', ') : '—';
        if (key === 'personBudgets' || key === 'budgetHistory') return 'Budgets differ';
        if (key === 'icon') return value ? value.replace('fas fa-', '') : '—';
        return value === undefined || value === null || value === '' ? '—' : String(value);
    };
    const handleResolveConflict = async (useCloud) => {
        const catId = showConflictDetail;
        if (netType) {
            // updateNetWorthCategory only renames (and refuses locked categories), as before.
            const cat = list.find(c => c.id === catId);
            if (cat && !cat.locked) DataService.updateNetWorthCategory(netType, catId, useCloud && conflictSnapshot ? conflictSnapshot.cloudSnapshot.name : cat.name);
        } else {
            await DataService.updateCategory(catId, useCloud && conflictSnapshot ? conflictSnapshot.cloudSnapshot : {});
        }
        SyncConflicts.dismiss(conflictCollection, catId);
        setShowConflictDetail(null);
        done();
    };

    const expenseSubOps = (cat) => ({
        itemWord: 'expense',
        useLabel: (sub) => { const n = usage.exp[cat.id + '|' + sub] || 0; return n ? n + ' expense' + (n === 1 ? '' : 's') : ''; },
        add: (s) => DataService.addSubcategory(cat.id, s),
        remove: (s) => DataService.removeSubcategory(cat.id, s),
        rename: (a, b) => DataService.renameSubcategory(cat.id, a, b),
        deleteUsage: async (s) => (await DataService.getExpensesByCategory(cat.id, s)).length,
        renameUsage: async (s) => {
            const [exps, bills] = await Promise.all([DataService.getExpensesByCategory(cat.id, s), DataService.getBills()]);
            const billCount = bills.filter(b => b.categoryId === cat.id && b.subcategory === s).length;
            return { total: exps.length + billCount, detail: exps.length + ' expense' + (exps.length === 1 ? '' : 's') + ', ' + billCount + ' bill' + (billCount === 1 ? '' : 's') };
        }
    });
    const netSubOps = (cat) => ({
        itemWord: 'item',
        add: (s) => DataService.addNetWorthSubcategory(netType, cat.id, s),
        remove: (s) => DataService.removeNetWorthSubcategory(netType, cat.id, s),
        rename: (a, b) => DataService.renameNetWorthSubcategory(netType, cat.id, a, b),
        deleteUsage: async (s) => DataService.countNetWorthSubcategoryUsage(netType, cat.id, s),
        renameUsage: async (s) => { const n = DataService.countNetWorthSubcategoryUsage(netType, cat.id, s); return { total: n, detail: '' }; }
    });

    const askDeleteCategory = async (cat) => {
        setPendingDelete(null); setBlocked(null);
        const n = netType ? DataService.countNetWorthCategoryUsage(netType, cat.id) : (await DataService.getExpensesByCategory(cat.id)).length;
        if (n > 0) { setBlocked({ id: cat.id, msg: 'Can\'t delete ' + cat.name + ': it\'s used by ' + n + ' ' + (netType ? 'item' : 'expense') + (n === 1 ? '' : 's') + '.' }); return; }
        setPendingDelete(cat.id);
    };
    const doDeleteCategory = async (cat) => {
        if (netType) DataService.deleteNetWorthCategory(netType, cat.id);
        else await DataService.deleteCategory(cat.id);
        setPendingDelete(null); setOpenId(null); done(cat.name + ' deleted');
    };

    const saveForm = async ({ name, icon, subs }) => {
        const editing = formFor && formFor !== 'new' ? formFor : null;
        if (netType) {
            if (editing) {
                if (name !== editing.name) { setRenameCatConfirm({ id: editing.id, oldName: editing.name, newName: name, itemCount: DataService.countNetWorthCategoryUsage(netType, editing.id) }); setOpenId(editing.id); }
                setFormFor(null);
                return;
            }
            DataService.addNetWorthCategory(netType, name);
            const created = DataService.getNetWorthCategories(netType).find(c => c.name.toLowerCase() === name.toLowerCase());
            if (created) subs.forEach(s => DataService.addNetWorthSubcategory(netType, created.id, s));
            setFormFor(null); done(name + ' added');
            return;
        }
        if (editing) {
            const updates = {};
            if (name !== editing.name) updates.name = name;
            if (icon && icon !== (editing.icon || '')) updates.icon = icon; // only written when picked
            if (Object.keys(updates).length) await DataService.updateCategory(editing.id, updates);
            setFormFor(null); done(Object.keys(updates).length ? 'Category updated' : '');
            return;
        }
        await DataService.addCategory({ name, icon, subcategories: subs });
        setFormFor(null); done(name + ' added');
    };
    const confirmNetRename = () => { DataService.updateNetWorthCategory(netType, renameCatConfirm.id, renameCatConfirm.newName); setRenameCatConfirm(null); done('Category renamed'); };

    const noun = tab === 'expense' ? 'expense' : tab;
    const lookOf = (cat, i) => netType ? spNetWorthCatLook(cat, netType) : spCategoryLook(cat, i);

    return (
        <div className="sp-page sp-catpage">
            <div className="sp-page-kicker">{list.length} {noun} categor{list.length === 1 ? 'y' : 'ies'}</div>
            <h2 className="sp-page-title" style={{marginBottom: '12px'}}>Categories</h2>
            <div className="sp-seg" style={{margin: '0 0 12px'}}>
                {[['expense', 'Expense'], ['asset', 'Asset'], ['liability', 'Liability']].map(([k, l]) => <button key={k} type="button" className={tab === k ? 'is-active' : ''} onClick={() => switchTab(k)}>{l}</button>)}
            </div>

            {tab === 'expense' && !isSingleView && (
                <div className="sp-alert sp-alert-warn"><i className="fas fa-triangle-exclamation"></i><span><b style={{display: 'block', color: 'var(--sp-navy)'}}>Budgets hidden in shared view</b>Budgets are set per person. Switch to one person in the view bar to see or edit budgets. You can still manage categories here.</span></div>
            )}
            {tab === 'expense' && isSingleView && (
                <div className="sp-hero sp-cathero">
                    <div className="sp-cathero-top"><span className="sp-hero-label">Total monthly budget · {whoName}</span><span className="sp-cathero-cur"><i className="fas fa-lock"></i>{defaultCurrency} · default</span></div>
                    <div className="sp-hero-value">{fmt0(totalBudget, heroCurrency)}</div>
                    <div className="sp-cathero-foot">
                        <span>{budgetedCount} of {categories.length} categories budgeted · currency follows your default in Settings</span>
                        {budgetedCount > 0 && !askReset && <button type="button" className="sp-cathero-reset" onClick={() => setAskReset(true)}><i className="fas fa-rotate-left"></i>Reset all</button>}
                    </div>
                    {askReset && (
                        <div className="sp-cathero-confirm">
                            <div className="sp-cathero-confirm-title">Reset all budgets for {whoName}?</div>
                            <div className="sp-cathero-confirm-text">Clears every category and sub-category budget. Categories and expenses stay as they are.</div>
                            <div className="sp-btn-row" style={{marginTop: '10px'}}>
                                <button type="button" className="sp-btn sp-btn-white" style={{height: '40px', fontSize: '13px'}} onClick={() => setAskReset(false)}>Cancel</button>
                                <button type="button" className="sp-btn sp-btn-danger" style={{height: '40px', fontSize: '13px'}} onClick={handleResetAll}>Reset all</button>
                            </div>
                        </div>
                    )}
                </div>
            )}
            {tab === 'expense' && hasBudgetCurrencyMismatch && (
                <div className="sp-alert sp-alert-warn"><i className="fas fa-triangle-exclamation"></i><span>Budgets were set in a different currency. Reset all to {defaultCurrency} to edit them.</span></div>
            )}
            {toast && <div className="sp-alert sp-alert-ok"><i className="fas fa-circle-check"></i><span>{toast}</span></div>}

            {list.length === 0 && <div className="sp-empty"><i className="fas fa-tags"></i>No {noun} categories yet.</div>}
            {list.map((cat, i) => {
                const look = lookOf(cat, i);
                const isOpen = openId === cat.id;
                const locked = !!(netType && cat.locked);
                const showBudget = tab === 'expense' && isSingleView;
                const total = showBudget ? catTotal(cat) : 0;
                const conflict = syncConflicts[String(cat.id)];
                const cfOpen = showConflictDetail === cat.id;
                const nSubs = cat.subcategories.length;
                return (
                    <div key={cat.id} className="sp-catcard">
                        <button type="button" className="sp-catrow" onClick={() => { setOpenId(isOpen ? null : cat.id); setPendingDelete(null); setBlocked(null); }}>
                            <span className="sp-schedicon" style={{background: look.tint, color: look.ink}}><i className={look.icon}></i></span>
                            <span className="sp-schedmain">
                                <span className="sp-schedtitle">
                                    <span>{cat.name}</span>
                                    {locked && <span className="sp-kindtag is-paused"><i className="fas fa-lock" style={{fontSize: '8px', marginRight: '3px'}}></i>SYSTEM</span>}
                                    {conflict && <span role="button" className={'sp-cfbtn' + (cfOpen ? ' is-open' : '')} title="Sync conflict · tap to compare" onClick={(e) => { e.stopPropagation(); setShowConflictDetail(cfOpen ? null : cat.id); }}><i className="fas fa-code-compare"></i></span>}
                                </span>
                                <span className="sp-schedmeta">{nSubs ? nSubs + ' sub categor' + (nSubs === 1 ? 'y' : 'ies') : 'No sub categories'}</span>
                            </span>
                            {showBudget && (
                                <span className="sp-schedright">
                                    <span className="sp-schedamt">{total > 0 ? fmt0(total, budgetSym(cat) === ValidationUtils.getCurrencySymbol(defaultCurrency) ? defaultCurrency : heroCurrency) : '—'}</span>
                                    <span className="sp-schedsub">{total > 0 ? (subMode(cat) ? 'by sub category' : 'per month') : 'No budget'}</span>
                                </span>
                            )}
                            <i className={'fas fa-chevron-' + (isOpen ? 'up' : 'down') + ' sp-catchev'}></i>
                        </button>
                        {cfOpen && conflictCategory && conflictSnapshot && (
                            <div style={{padding: '0 15px 12px'}}>
                                <ConflictCompare localRecord={conflictCategory} cloudSnapshot={conflictSnapshot.cloudSnapshot} detectedAt={conflictSnapshot.detectedAt} fieldLabels={categoryConflictFieldLabels} formatValue={formatCategoryConflictValue} onKeepLocal={() => handleResolveConflict(false)} onUseCloud={() => handleResolveConflict(true)} />
                            </div>
                        )}
                        {isOpen && (
                            <div className="sp-catopen">
                                {showBudget && (
                                    <React.Fragment>
                                        <div className="sp-catlabel">Monthly budget · {whoName}</div>
                                        <div className="sp-catbox">
                                            {nSubs > 0 && (
                                                <div className="sp-seg is-light" style={{marginBottom: '10px'}}>
                                                    <button type="button" className={!subMode(cat) ? 'is-active' : ''} onClick={() => subMode(cat) && setMode(cat, false)}>Whole category</button>
                                                    <button type="button" className={subMode(cat) ? 'is-active' : ''} onClick={() => !subMode(cat) && setMode(cat, true)}>By sub category</button>
                                                </div>
                                            )}
                                            {subMode(cat)
                                                ? <div className="sp-catbox-row"><span>Set an amount on each sub category below</span><b>{fmt0(total)}</b></div>
                                                : <div className="sp-catbox-row"><span>Amount per month</span>{moneyInput(cat)}</div>}
                                        </div>
                                    </React.Fragment>
                                )}
                                <div className="sp-catlabel">Sub categories</div>
                                <SpSubcategoryList category={cat} ops={netType ? netSubOps(cat) : expenseSubOps(cat)} budgetInput={showBudget && subMode(cat) ? (sub) => moneyInput(cat, sub) : null} onChanged={done} />
                                {showBudget && (
                                    <div className="sp-catbox" style={{marginTop: '10px'}}>
                                        <div className="sp-remind-head"><span><i className="fas fa-bell"></i>Notify me at</span><span className="sp-remind-when">{threshold(cat)}% of budget</span></div>
                                        <div className="sp-remind-chips">
                                            {(SP_NOTIFY_CHOICES.includes(threshold(cat)) ? SP_NOTIFY_CHOICES : [...SP_NOTIFY_CHOICES, threshold(cat)].sort((a, b) => a - b)).map(n => (
                                                <button key={n} type="button" className={threshold(cat) === n ? 'is-active' : ''} onClick={() => setThreshold(cat, n)}>{n}%</button>
                                            ))}
                                        </div>
                                    </div>
                                )}
                                {renameCatConfirm && renameCatConfirm.id === cat.id && (
                                    <div style={{marginTop: '10px'}}>
                                        <InlineConfirm text={'Rename ' + renameCatConfirm.oldName + ' to ' + renameCatConfirm.newName + '?' + (renameCatConfirm.itemCount ? ' ' + renameCatConfirm.itemCount + ' Net Worth item' + (renameCatConfirm.itemCount === 1 ? '' : 's') + ' will show under the new name.' : '')} keepLabel="Cancel" cta="Rename" onKeep={() => setRenameCatConfirm(null)} onConfirm={confirmNetRename} />
                                    </div>
                                )}
                                {locked ? (
                                    <div className="sp-blocked" style={{marginTop: '10px'}}><i className="fas fa-lock"></i><span>System category · can't be renamed or removed. You can add sub categories.</span></div>
                                ) : (
                                    <div style={{marginTop: '8px'}}>
                                        <SpActBar actions={[
                                            { key: 'edit', label: 'Edit', icon: 'fas fa-pen', tone: 'slate', onClick: () => setFormFor(cat) },
                                            { key: 'delete', label: 'Delete', icon: 'fas fa-trash', tone: 'rose', onClick: () => askDeleteCategory(cat) }
                                        ]} />
                                    </div>
                                )}
                                {blocked && blocked.id === cat.id && <div className="sp-blocked"><i className="fas fa-circle-info"></i><span>{blocked.msg}</span></div>}
                                {pendingDelete === cat.id && <InlineConfirm text={'Delete ' + cat.name + '? Its sub categories' + (tab === 'expense' && isSingleView ? ' and budget' : '') + ' go too.'} keepLabel="Cancel" cta="Delete" onKeep={() => setPendingDelete(null)} onConfirm={() => doDeleteCategory(cat)} />}
                            </div>
                        )}
                    </div>
                );
            })}
            {!formFor && <PinnedCta label={'New ' + (tab === 'expense' ? 'Expense' : tab === 'asset' ? 'Asset' : 'Liability') + ' Category'} icon="fas fa-plus" onClick={() => setFormFor('new')} />}
            {formFor && (
                <CategoryFormSheet kind={tab} category={formFor === 'new' ? null : formFor} look={formFor === 'new' ? null : lookOf(formFor, list.indexOf(formFor))}
                    existingNames={list.map(c => c.name)} onClose={() => setFormFor(null)} onSave={saveForm} />
            )}
        </div>
    );
}

// Display-only icon for an income source (design: coloured tile per source), guessed from the name.
const SP_INCOME_ICONS = [
    [/salary|wage|payroll|pay\b/i, 'fas fa-briefcase', '#dcfce7', '#16a34a'], [/freelance|contract|consult|client|invoice/i, 'fas fa-laptop-code', '#eef2ff', '#4f46e5'],
    [/dividend|invest|interest|stock|share/i, 'fas fa-chart-line', '#dbeafe', '#2563eb'], [/rent|property|lodger/i, 'fas fa-house', '#ffedd5', '#ea580c'],
    [/refund|cashback|rebate/i, 'fas fa-rotate-left', '#ccfbf1', '#0d9488'], [/gift|present/i, 'fas fa-gift', '#fae8ff', '#c026d3'],
    [/debt|loan|repay/i, 'fas fa-handshake', '#fce7f3', '#db2777'], [/bonus/i, 'fas fa-star', '#fef3c7', '#d97706']
];
function spIncomeLook(source) {
    const hit = SP_INCOME_ICONS.find(([re]) => re.test(source || ''));
    return hit ? { icon: hit[1], tint: hit[2], ink: hit[3] } : { icon: 'fas fa-coins', tint: '#fef3c7', ink: '#d97706' };
}

function IncomeForm({ income, onUpdate, activeView, defaultCurrency, autoOpenForm, onFormOpened }) {
    const [people, setPeople] = useState([]);
    const [formData, setFormData] = useState(() => { const initialPaidBy = resolveActiveViewValue(activeView); return { amount: '', date: DateUtils.today(), source: '', description: '', paidBy: initialPaidBy, currency: 'GBP', accountId: resolveDefaultAccountId(initialPaidBy, 'GBP'), tags: [] }; });
    const [errors, setErrors] = useState({});
    const [isSubmitting, setIsSubmitting] = useState(false);
    const [showSuccess, setShowSuccess] = useState(false);
    const [editingIncome, setEditingIncome] = useState(null);
    const [showDeleteConfirm, setShowDeleteConfirm] = useState(null);
    const [isRecurring, setIsRecurring] = useState(false);
    const [recurringFreq, setRecurringFreq] = useState('monthly');
    const [recurringEndDate, setRecurringEndDate] = useState('');
    const _f0 = FilterMemory.load('income');
    const [searchTerm, setSearchTerm] = useState(_f0.search || '');
    // Source and person filters are multi-select ("any of"); '__mine__' = your own income.
    const [filterSources, setFilterSources] = useState(() => Array.isArray(_f0.sources) ? _f0.sources : (_f0.source ? [_f0.source] : []));
    const [filterPersons, setFilterPersons] = useState(() => Array.isArray(_f0.persons) ? _f0.persons : (_f0.person ? [_f0.person] : []));
    const [filterDateFrom, setFilterDateFrom] = useState(_f0.dateFrom || '');
    const [filterDateTo, setFilterDateTo] = useState(_f0.dateTo || '');
    const [datePreset, setDatePreset] = useState(() => _f0.datePreset || ((_f0.dateFrom || _f0.dateTo) ? 'custom' : 'all'));
    const [filterSyncConflict, setFilterSyncConflict] = useState(!!_f0.syncConflict);
    const [visibleCount, setVisibleCount] = useState(50);
    const [showConflictDetail, setShowConflictDetail] = useState(null);
    // Redesign (Phase 3) — layout state only.
    const [showForm, setShowForm] = useState(false);
    const [openRowId, setOpenRowId] = useState(null);
    const [showFilterSheet, setShowFilterSheet] = useState(false);
    const [stopRepeat, setStopRepeat] = useState(false);
    const [tagError, setTagError] = useState('');
    const [showCurrencySheet, setShowCurrencySheet] = useState(false);
    const [repeatEndMode, setRepeatEndMode] = useState('never');

    useEffect(() => { setPeople(DataService.getPeople()); }, []);
    // Opened from the + sheet: show the form straight away.
    useEffect(() => { if (autoOpenForm) { setShowForm(true); if (onFormOpened) onFormOpened(); } }, [autoOpenForm]);

    const syncConflicts = useMemo(() => SyncConflicts.read('income'), [income]);
    const accountNameById = useMemo(() => {
        const m = new Map();
        DataService.getBankAccounts().forEach(a => m.set(String(a.id), a.accountName));
        return m;
    }, [income]);

    // Mirrors ExpenseList: the person sub-filter only makes sense when multiple
    // participants are active — drop any stale selection once it drops back to one.
    useEffect(() => { if (activeView.length <= 1 && filterPersons.length) setFilterPersons([]); }, [activeView]);

    // Persist filters for the session (see FilterMemory) so navigating away keeps them.
    useEffect(() => {
        FilterMemory.save('income', { search: searchTerm, sources: filterSources, persons: filterPersons, dateFrom: filterDateFrom, dateTo: filterDateTo, datePreset, syncConflict: filterSyncConflict });
    }, [searchTerm, filterSources, filterPersons, filterDateFrom, filterDateTo, datePreset, filterSyncConflict]);

    // Re-defaults the Account field to the newly-selected person's primary account (only when
    // its currency matches formData.currency) whenever "Who's Income" or the currency changes —
    // see the matching effect in ExpenseForm for the full rationale. Skipped while editing an
    // existing record so it never clobbers that record's own accountId.
    useEffect(() => {
        if (editingIncome) return;
        const nextId = resolveDefaultAccountId(formData.paidBy, formData.currency);
        setFormData(prev => (prev.accountId === nextId ? prev : { ...prev, accountId: nextId }));
    }, [formData.paidBy, formData.currency]);

    const handleInputChange = (field, value) => {
        // See ExpenseForm's handleInputChange for why accountId is normalized to a number here.
        const normalized = (field === 'accountId' && value !== '') ? Number(value) : value;
        setFormData(prev => ({ ...prev, [field]: normalized }));
        if (errors[field]) setErrors(prev => ({ ...prev, [field]: '' }));
    };
    const blankForm = (paidBy) => ({ amount: '', date: DateUtils.today(), source: '', description: '', paidBy, currency: 'GBP', accountId: resolveDefaultAccountId(paidBy || 'own', 'GBP'), tags: [] });
    const handleSubmit = (e) => {
        e.preventDefault(); setIsSubmitting(true);
        const validation = ValidationUtils.validateIncome({ ...formData, amount: parseFloat(formData.amount) });
        if (!validation.isValid) { setErrors(validation.errors); setIsSubmitting(false); return; }
        try {
            const incomeData = { ...formData, amount: parseFloat(formData.amount) };
            if (editingIncome) { DataService.updateIncome(editingIncome.id, incomeData); }
            else {
                // Repeat: create the schedule first so the income saved here records its id.
                const schedule = isRecurring ? DataService.addRecurring({ templateExpense: incomeData, frequency: recurringFreq, endDate: recurringEndDate, type: 'income' }) : null;
                DataService.addIncomeWithConversion(schedule ? { ...incomeData, recurringId: schedule.id } : incomeData);
            }
            setShowSuccess(true);
            setTimeout(() => { const newPaidBy = resolveActiveViewValue(activeView); setFormData(blankForm(newPaidBy)); setEditingIncome(null); setShowSuccess(false); setShowForm(false); setIsRecurring(false); setRecurringEndDate(''); setRepeatEndMode('never'); onUpdate(); }, 1000);
        } catch (error) { setErrors({ general: 'Failed to save income. Please try again.' }); }
        setIsSubmitting(false);
    };
    const handleEdit = (incomeItem) => { setEditingIncome(incomeItem); setShowForm(true); setErrors({}); setFormData({ amount: incomeItem.amount.toString(), date: incomeItem.date, source: incomeItem.source, description: incomeItem.description || '', paidBy: incomeItem.paidBy || '', currency: incomeItem.currency || 'GBP', accountId: incomeItem.accountId || '', tags: incomeItem.tags || [] }); window.scrollTo({ top: 0, behavior: 'smooth' }); };
    const handleDelete = (incomeId) => { DataService.deleteIncome(incomeId); setShowDeleteConfirm(null); onUpdate(); };
    // A copy isn't generated by the original's repeat schedule, so it doesn't inherit the link.
    const handleDuplicateIncome = (incomeItem) => { const duplicate = { ...incomeItem, date: DateUtils.today() }; delete duplicate.id; delete duplicate.createdAt; delete duplicate.recurringId; DataService.addIncome(duplicate); onUpdate(); };
    const handleCancelEdit = () => { setEditingIncome(null); setShowForm(false); setFormData(blankForm('')); setErrors({}); setTagError(''); setIsRecurring(false); };
    const totalIncome = income.reduce((sum, item) => sum + CurrencyService.convertToDefaultSync(item.amount, item.currency || 'GBP', defaultCurrency || 'GBP'), 0);

    const filteredIncome = useMemo(() => {
        let filtered = income;
        if (filterSources.length) filtered = filtered.filter(item => filterSources.includes(item.source));
        if (filterPersons.length) filtered = filtered.filter(item => {
            const who = (item.paidBy || '').trim();
            return filterPersons.some(p => p === '__mine__' ? !who : who === p.trim());
        });
        if (filterDateFrom) filtered = filtered.filter(item => (item.date || '').substring(0, 10) >= filterDateFrom);
        if (filterDateTo) filtered = filtered.filter(item => (item.date || '').substring(0, 10) <= filterDateTo);
        if (filterSyncConflict) filtered = filtered.filter(item => !!syncConflicts[String(item.id)]);
        if (searchTerm) { const st = searchTerm.toLowerCase(); filtered = filtered.filter(item => (item.description || '').toLowerCase().includes(st) || (item.source || '').toLowerCase().includes(st) || (item.tags || []).some(tag => tag.includes(st))); }
        return filtered;
    }, [income, filterSources, filterPersons, filterDateFrom, filterDateTo, filterSyncConflict, syncConflicts, searchTerm]);

    useEffect(() => { setVisibleCount(50); }, [filteredIncome]);

    const visibleIncome = filteredIncome.slice(0, visibleCount);
    const incomeSources = [...new Set(income.map(item => item.source).filter(Boolean))].sort();
    const conflictIncome = showConflictDetail ? income.find(i => i.id === showConflictDetail) : null;
    const conflictSnapshot = showConflictDetail ? syncConflicts[String(showConflictDetail)] : null;
    const incomeConflictFieldLabels = { amount: 'Amount', date: 'Date', source: 'Source', description: 'Description', paidBy: 'Paid By', currency: 'Currency', accountId: 'Account', tags: 'Tags' };
    const formatIncomeConflictValue = (key, value) => {
        if (key === 'accountId') return value ? (accountNameById.get(String(value)) || String(value)) : '—';
        if (key === 'amount' && value !== undefined && value !== null) return ValidationUtils.formatCurrency(value, (conflictIncome && conflictIncome.currency) || 'GBP');
        if (Array.isArray(value)) return value.length ? value.join(', ') : '—';
        return value === undefined || value === null || value === '' ? '—' : String(value);
    };
    const handleResolveConflict = async (useCloud) => {
        const incomeId = showConflictDetail;
        const updates = useCloud && conflictSnapshot ? conflictSnapshot.cloudSnapshot : {};
        await DataService.updateIncome(incomeId, updates);
        SyncConflicts.dismiss('income', incomeId);
        setShowConflictDetail(null);
        onUpdate();
    };

    // ── Presentation (Phase 3) ──
    const allTags = useMemo(() => [...new Set((DataService.data.income || []).flatMap(i => i.tags || []).concat((DataService.data.expenses || []).flatMap(e => e.tags || [])))].sort(), [income]);
    const recentCurrencies = useMemo(() => {
        const seen = [];
        (DataService.data.income || []).forEach(i => { if (i.currency && !seen.includes(i.currency)) seen.push(i.currency); });
        let list = seen.slice(0, 3);
        if (!list.includes(formData.currency)) list = [formData.currency, ...list].slice(0, 3);
        return list;
    }, [formData.currency]);

    if (showSuccess) {
        return (<div className="sp-page"><div className="sp-saved"><i className="fas fa-circle-check"></i><div className="sp-sheet-title">{editingIncome ? 'Income updated' : 'Income added'}</div></div></div>);
    }

    const today = DateUtils.today();
    const monthKey = today.slice(0, 7);
    const scheduleById = new Map(DataService.getRecurring().map(r => [r.id, r]));
    const formOpen = showForm || !!editingIncome;
    const accounts = DataService.getAccountsForPerson(formData.paidBy || 'own');
    const isCash = !formData.accountId;
    const firstRepeat = computeNextDue(new Date(), recurringFreq);
    const upcoming = [1, 2, 3].reduce((acc) => { acc.push(computeNextDue(acc[acc.length - 1], recurringFreq)); return acc; }, [firstRepeat]).slice(1);
    const firstError = errors.general || errors.amount || errors.date || errors.source || errors.paidBy || tagError;
    const presetRange = (key) => {
        if (key === 'month') return [monthKey + '-01', today];
        if (key === 'last') { const first = DateUtils.addToDateStr(monthKey + '-01', { months: -1 }); return [first, DateUtils.addToDateStr(monthKey + '-01', { days: -1 })]; }
        if (key === '30d') return [DateUtils.addToDateStr(today, { days: -29 }), today];
        if (key === 'all') return ['', ''];
        return [filterDateFrom, filterDateTo];
    };
    const applyPreset = (key) => { const [f, t] = presetRange(key); setDatePreset(key); setFilterDateFrom(f); setFilterDateTo(t); };
    const PRESET_LABELS = { all: 'All time', month: 'This month', last: 'Last month', '30d': 'Last 30 days', custom: 'Custom' };
    const personName = (key) => key === '__mine__' ? 'You' : key;
    const clearAll = () => { setFilterSources([]); setFilterPersons([]); setFilterDateFrom(''); setFilterDateTo(''); setDatePreset('all'); setSearchTerm(''); setFilterSyncConflict(false); };
    const activeChips = [];
    filterPersons.forEach(p => activeChips.push({ key: 'p:' + p, label: personName(p), onRemove: () => setFilterPersons(prev => prev.filter(x => x !== p)) }));
    filterSources.forEach(s => activeChips.push({ key: 's:' + s, label: s, onRemove: () => setFilterSources(prev => prev.filter(x => x !== s)) }));
    if (datePreset !== 'all' && (filterDateFrom || filterDateTo)) activeChips.push({ key: 'date', label: datePreset === 'custom' ? [filterDateFrom && ValidationUtils.formatDate(filterDateFrom), filterDateTo && ValidationUtils.formatDate(filterDateTo)].filter(Boolean).join(' – ') : PRESET_LABELS[datePreset], onRemove: () => applyPreset('all') });
    if (filterSyncConflict) activeChips.push({ key: 'cf', label: 'Sync conflicts', onRemove: () => setFilterSyncConflict(false) });
    const deletingIncome = showDeleteConfirm ? income.find(i => i.id === showDeleteConfirm) : null;
    const deleteSchedule = deletingIncome && deletingIncome.recurringId ? scheduleById.get(deletingIncome.recurringId) : null;
    const closeDelete = () => { setShowDeleteConfirm(null); setStopRepeat(false); };
    const whoLabel = (i) => (i.paidBy || '').trim() ? i.paidBy : 'You';
    const freqLabel = (f) => f ? f.charAt(0).toUpperCase() + f.slice(1) : '';

    return (
        <div className="sp-page">
            <div className="sp-head">
                <div><div className="sp-head-kicker">{new Date().toLocaleDateString('en-GB', { month: 'long', year: 'numeric' })}</div><h2>Income</h2></div>
                <button type="button" className="sp-filterbtn" onClick={() => setShowFilterSheet(true)} title="Filters">
                    <i className="fas fa-sliders-h"></i>
                    {activeChips.length > 0 && <span className="sp-filterbtn-count">{activeChips.length}</span>}
                </button>
            </div>
            <div className="sp-hero" style={{borderRadius: '22px', padding: '18px'}}>
                <div className="sp-hero-label">Total received</div>
                <div className="sp-hero-value">{ValidationUtils.formatCurrency(totalIncome, defaultCurrency || 'GBP')}</div>
                <div className="sp-hero-pills" style={{marginTop: '10px'}}><span className="sp-hero-pill is-green">{income.length} entr{income.length === 1 ? 'y' : 'ies'}</span></div>
            </div>

            {formOpen && (
                <form onSubmit={handleSubmit} className="sp-formcard" style={{marginTop: 0, marginBottom: '12px', padding: '4px 16px 14px', boxShadow: editingIncome ? '0 0 0 2px #6366f1' : 'none'}} noValidate>
                    {editingIncome && <div style={{display: 'flex', alignItems: 'center', gap: '7px', padding: '11px 0 3px', fontSize: '12px', fontWeight: 800, color: '#6366f1', textTransform: 'uppercase', letterSpacing: '.06em'}}><i className="fas fa-pen" style={{fontSize: '10px'}}></i>Editing income</div>}
                    {firstError && <div className="sp-alert sp-alert-err" style={{marginTop: '10px'}}><i className="fas fa-triangle-exclamation"></i><span>{firstError}</span></div>}
                    <div className={'sp-formrow' + (errors.source ? ' is-bad' : '')}>
                        <span>Source</span>
                        <input type="text" value={formData.source} onChange={(e) => handleInputChange('source', e.target.value)} placeholder="e.g. Salary" list="sp-income-sources" style={{width: '60%'}} />
                        <datalist id="sp-income-sources">{incomeSources.map(s => <option key={s} value={s} />)}</datalist>
                    </div>
                    <div className={'sp-formblock' + (errors.amount ? ' is-bad' : '')} style={{borderTop: '1px solid #f1f5f9'}}>
                        <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                            <span style={{fontSize: '14px', color: errors.amount ? '#e11d48' : '#64748b', fontWeight: 600}}>Amount</span>
                            <div style={{display: 'flex', alignItems: 'baseline', gap: '3px'}}>
                                <span style={{fontSize: '14px', color: '#94a3b8', fontWeight: 700}}>{ValidationUtils.getCurrencySymbol(formData.currency)}</span>
                                <input type="number" step="0.01" min="0" inputMode="decimal" value={formData.amount} onChange={(e) => handleInputChange('amount', e.target.value)} placeholder="0.00" style={{border: 'none', fontSize: '14px', color: '#0f172a', fontWeight: 700, textAlign: 'right', outline: 'none', width: '110px', padding: 0, background: 'none', fontFamily: 'inherit', colorScheme: 'light'}} />
                            </div>
                        </div>
                        <div style={{display: 'flex', justifyContent: 'flex-end', gap: '5px', marginTop: '9px', flexWrap: 'wrap'}}>
                            {recentCurrencies.map(code => (
                                <button key={code} type="button" className="sp-curchip" style={formData.currency === code ? {background: '#10b981', color: '#06281c'} : {background: '#f1f5f9', color: '#475569'}} onClick={() => handleInputChange('currency', code)}>{formData.currency === code ? ValidationUtils.getCurrencySymbol(code) + ' ' + code : code}</button>
                            ))}
                            <button type="button" className="sp-curchip" style={{background: '#f1f5f9', color: '#475569'}} onClick={() => setShowCurrencySheet(true)}>More<i className="fas fa-chevron-down" style={{fontSize: '9px'}}></i></button>
                        </div>
                    </div>
                    <div className={'sp-formrow' + (errors.date ? ' is-bad' : '')} style={{borderTop: '1px solid #f1f5f9'}}>
                        <span>Date</span>
                        <input type="date" value={formData.date} onChange={(e) => handleInputChange('date', e.target.value)} />
                    </div>
                    <div className="sp-formrow">
                        <span>Note</span>
                        <input type="text" value={formData.description} onChange={(e) => handleInputChange('description', e.target.value)} placeholder="Optional" style={{width: '60%'}} />
                    </div>
                    <div className="sp-formblock">
                        <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px'}}>
                            <span style={{fontSize: '14px', color: '#64748b', fontWeight: 600}}>Tags</span>
                            <span className="sp-hint">Enter or comma to add</span>
                        </div>
                        <TagInput tags={formData.tags || []} onChange={(tags) => setFormData(prev => ({ ...prev, tags }))} allTags={allTags} onError={setTagError} noun="income" />
                    </div>
                    {activeView.length > 1 ? (
                        <div className={'sp-formrow' + (errors.paidBy ? ' is-bad' : '')}>
                            <span>Earned by</span>
                            <PersonSelect id="paidBy" value={formData.paidBy} onChange={(v) => handleInputChange('paidBy', v)} activeView={activeView} className="sp-row-input" />
                        </div>
                    ) : (
                        <div className="sp-formrow">
                            <span>Earned by</span>
                            <span style={{display: 'inline-flex', alignItems: 'center', gap: '7px', fontSize: '13px', fontWeight: 700, color: '#0f172a'}}>{formData.paidBy || 'You'}<i className="fas fa-lock" style={{fontSize: '10px', color: '#cbd5e1'}}></i></span>
                        </div>
                    )}
                    <div className="sp-panel-label" style={{margin: '6px 0 8px'}}>Received as</div>
                    <div className="sp-seg is-light">
                        <button type="button" className={!isCash ? 'is-active' : ''} onClick={() => { if (isCash) handleInputChange('accountId', resolveDefaultAccountId(formData.paidBy, formData.currency) || (accounts[0] ? accounts[0].id : '')); }}><i className="fas fa-building-columns" style={{marginRight: '6px'}}></i>Bank</button>
                        <button type="button" className={isCash ? 'is-active' : ''} onClick={() => handleInputChange('accountId', '')}><i className="fas fa-money-bill-wave" style={{marginRight: '6px'}}></i>Cash</button>
                    </div>
                    {!isCash && accounts.length > 0 && (
                        <div style={{marginTop: '8px', background: '#f8fafc', borderRadius: '14px', padding: '2px 12px'}}>
                            {accounts.map(a => {
                                const on = String(formData.accountId) === String(a.id);
                                return (
                                    <button key={a.id} type="button" className="sp-bankrow" style={{padding: '10px 0'}} onClick={() => handleInputChange('accountId', a.id)}>
                                        <span className="sp-tile" style={{width: '32px', height: '32px', borderRadius: '10px', background: on ? '#dbeafe' : '#fff', color: on ? '#1d4ed8' : '#64748b', fontSize: '12px'}}><i className="fas fa-building-columns"></i></span>
                                        <div className="sp-row-main">
                                            <div style={{display: 'flex', alignItems: 'center', gap: '6px'}}><span className="sp-row-title" style={{fontSize: '13px'}}>{a.accountName}</span>{a.isPrimary && <span className="sp-badge-primary">PRIMARY</span>}</div>
                                            <div className="sp-row-sub" style={{fontSize: '11px'}}>{a.accountType || 'Account'} · {a.currency}</div>
                                        </div>
                                        <i className={on ? 'fas fa-circle-check' : 'far fa-circle'} style={{color: on ? '#10b981' : '#cbd5e1', fontSize: '15px'}}></i>
                                    </button>
                                );
                            })}
                        </div>
                    )}
                    {accounts.length === 0 && (
                        <div className="sp-alert sp-alert-warn" style={{marginTop: '8px'}}><i className="fas fa-circle-info"></i><span>No bank accounts for {formData.paidBy || 'you'} yet, so this is recorded as cash. Add accounts in More → Accounts.</span></div>
                    )}
                    {!editingIncome && (
                        <React.Fragment>
                            <button type="button" onClick={() => setIsRecurring(v => !v)} style={{marginTop: '12px', display: 'flex', alignItems: 'center', gap: '10px', padding: '10px 12px', borderRadius: '14px', background: '#f8fafc', cursor: 'pointer', width: '100%', border: 'none', fontFamily: 'inherit', textAlign: 'left', boxShadow: isRecurring ? '0 0 0 2px #7c3aed' : 'none'}}>
                                <span className="sp-tile" style={{background: '#ede9fe', color: '#7c3aed'}}><i className="fas fa-rotate"></i></span>
                                <div className="sp-row-main"><div className="sp-row-title" style={{fontSize: '13px'}}>Repeat</div><div style={{fontSize: '11px', fontWeight: 700, color: '#7c3aed'}}>{isRecurring ? freqLabel(recurringFreq) : 'Off · one-time income'}</div></div>
                                <span className={'sp-switch' + (isRecurring ? ' is-on' : '')} style={{background: isRecurring ? '#7c3aed' : undefined}}><span></span></span>
                            </button>
                            {isRecurring && (
                                <div style={{marginTop: '8px', background: '#f8fafc', borderRadius: '14px', padding: '12px'}}>
                                    <div className="sp-panel-label" style={{fontSize: '11px', marginBottom: '8px'}}>Repeat every</div>
                                    <div className="sp-seg" style={{marginTop: 0, borderRadius: '11px', padding: '3px'}}>
                                        {['daily', 'weekly', 'monthly', 'quarterly', 'yearly'].map(f => (
                                            <button key={f} type="button" className={recurringFreq === f ? 'is-active' : ''} style={{fontSize: '12px', padding: '7px 2px', borderRadius: '9px'}} onClick={() => {
                                                setRecurringFreq(f);
                                                const minEnd = computeNextDue(new Date(), f);
                                                if (recurringEndDate && recurringEndDate < minEnd) setRecurringEndDate('');
                                            }}>{f === 'quarterly' ? 'Quarter' : freqLabel(f)}</button>
                                        ))}
                                    </div>
                                    <div className="sp-panel-label" style={{fontSize: '11px', margin: '12px 0 7px'}}>Ends</div>
                                    <div className="sp-endtabs">
                                        <button type="button" className={'sp-endtab' + (repeatEndMode === 'never' ? ' is-active' : '')} onClick={() => { setRepeatEndMode('never'); setRecurringEndDate(''); }}>Never</button>
                                        <button type="button" className={'sp-endtab' + (repeatEndMode === 'date' ? ' is-active' : '')} onClick={() => setRepeatEndMode('date')}>On a date</button>
                                    </div>
                                    {repeatEndMode === 'date' && (
                                        <div className="sp-formrow" style={{borderTop: '1px solid #e2e8ef', marginTop: '8px', padding: '10px 0 2px'}}>
                                            <span style={{fontSize: '13px'}}>End date</span>
                                            <input type="date" value={recurringEndDate} min={firstRepeat} onChange={e => setRecurringEndDate(e.target.value)} />
                                        </div>
                                    )}
                                    <div className="sp-infobox" style={{background: '#ede9fe', marginTop: '10px'}}>
                                        <div className="sp-infobox-row">
                                            <span className="sp-infobox-icon" style={{color: '#7c3aed'}}><i className="fas fa-calendar-check"></i></span>
                                            <div><div className="sp-infobox-kicker" style={{color: '#7c3aed'}}>First repeat</div><div className="sp-infobox-value">{ValidationUtils.formatDate(firstRepeat)}</div></div>
                                        </div>
                                        <div className="sp-infobox-dates">{upcoming.map(d => <span key={d}>{ValidationUtils.formatDate(d)}</span>)}</div>
                                        <div className="sp-infobox-foot" style={{color: '#7c3aed'}}>Adds a schedule under Scheduled → Recurring.</div>
                                    </div>
                                </div>
                            )}
                        </React.Fragment>
                    )}
                    <button type="submit" className="sp-btn sp-btn-dark" style={{marginTop: '12px', height: '42px', borderRadius: '12px', fontSize: '14px'}} disabled={isSubmitting}>
                        {isSubmitting ? <><i className="fas fa-spinner fa-spin"></i>{editingIncome ? 'Updating…' : 'Saving…'}</> : (editingIncome ? 'Save changes' : 'Save income')}
                    </button>
                </form>
            )}

            <div className="sp-search">
                <i className="fas fa-search"></i>
                <input type="text" placeholder="Search income" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
            </div>
            {activeChips.length > 0 && (
                <div className="sp-activechips">
                    {activeChips.map(c => <button key={c.key} type="button" className="sp-activechip" onClick={c.onRemove}>{c.label}<i className="fas fa-xmark" style={{fontSize: '10px'}}></i></button>)}
                    <button type="button" className="sp-clearlink" onClick={clearAll}>Clear all</button>
                </div>
            )}
            <div className="sp-resultlabel">{filteredIncome.length} entr{filteredIncome.length === 1 ? 'y' : 'ies'} · tap a row for actions</div>

            {filteredIncome.length === 0 ? (
                <div className="sp-empty"><i className="fas fa-wallet"></i>{income.length === 0 ? 'No income yet — tap Add income to record some.' : 'No income matches your filters.'}</div>
            ) : visibleIncome.map(item => {
                const look = spIncomeLook(item.source);
                const isOpen = openRowId === item.id;
                const conflict = syncConflicts[String(item.id)];
                const cfOpen = conflict && showConflictDetail === item.id;
                const bankName = item.accountId ? (accountNameById.get(String(item.accountId)) || 'Bank') : '';
                const schedule = item.recurringId ? scheduleById.get(item.recurringId) : null;
                const oc = spPersonColor((item.paidBy || '').trim() ? item.paidBy : 'own', people);
                const tags = item.tags || [];
                return (
                    <div key={item.id} className="sp-listcard" style={{marginBottom: '10px'}}>
                        <div role="button" tabIndex={0} className={'sp-item-row' + (isOpen ? ' is-open' : '')} style={{padding: '12px 14px', gap: '12px'}} onClick={() => setOpenRowId(isOpen ? null : item.id)} onKeyDown={e => { if (e.key === 'Enter') setOpenRowId(isOpen ? null : item.id); }}>
                            <span className="sp-cattile" style={{width: '40px', height: '40px', borderRadius: '13px', fontSize: '15px', background: look.tint, color: look.ink}}><i className={look.icon}></i></span>
                            <div className="sp-item-main">
                                <div className="sp-item-title">
                                    <span style={{fontSize: '14px'}}>{item.source}</span>
                                    {conflict && <button type="button" className={'sp-cfbtn' + (cfOpen ? ' is-open' : '')} title="Sync conflict · tap to compare" onClick={(e) => { e.stopPropagation(); setShowConflictDetail(cfOpen ? null : item.id); }}><i className="fas fa-code-compare"></i></button>}
                                </div>
                                <div className="sp-item-meta">
                                    {activeView.length > 1 && <span className="sp-ownerchip" style={{background: oc[0], color: oc[1]}}><span className="sp-ownerchip-dot" style={{background: oc[1]}}>{whoLabel(item).charAt(0).toUpperCase()}</span>{whoLabel(item)}</span>}
