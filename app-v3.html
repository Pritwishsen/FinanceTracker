        if (!date || date > today) { setError('Pick a date up to today'); return; }
        DataService.recordNetWorthValuation(item.id, v, date, activeView);
        onSaved(item.name + (isAsset ? ' valued at ' : ' balance set to ') + spFmtMoney(v, item.currency));
    };
    const vsBase = valid ? v - base : 0, vsLast = valid ? v - item.value : 0;
    const accent = isAsset ? { tint: '#dbeafe', ink: '#2563eb', icon: 'fas fa-chart-line' } : { tint: '#ede9fe', ink: '#7c3aed', icon: 'fas fa-scale-balanced' };
    return (
        <Sheet onClose={onClose} footer={<React.Fragment>
            <button type="button" className="sp-btn sp-btn-cancel" onClick={onClose}>Cancel</button>
            <button type="button" className="sp-btn sp-btn-primary sp-btn-grow" onClick={save}><i className="fas fa-check"></i>{isAsset ? 'Save value' : 'Save balance'}</button>
        </React.Fragment>}>
            <SpSheetHead icon={accent.icon} tint={accent.tint} ink={accent.ink} title={isAsset ? 'Update value' : 'Update balance'} sub={item.name + ' · ' + item.currency} />
            {error && <div className="sp-alert sp-alert-err"><i className="fas fa-circle-exclamation"></i><span>{error}</span></div>}
            <div className="sp-nwtiles">
                <div><span>{isAsset ? 'Total invested' : 'Originally borrowed'}</span><b>{spFmtMoney(base, item.currency)}</b></div>
                <div><span>{isAsset ? 'Last value' : 'Owed ' + (item.valuedOn ? 'on ' + spShortDate(item.valuedOn) : 'now')}</span><b>{spFmtMoney(item.value, item.currency)}</b></div>
            </div>
            <div className="sp-formcard">
                <div className="sp-formrow"><span>{isAsset ? 'Current value' : 'Outstanding balance'}</span><span className="sp-moneyin"><span>{CurrencyService.getCurrencySymbol(item.currency)}</span><input type="number" step="0.01" min="0" inputMode="decimal" value={value} autoFocus onChange={e => { setValue(e.target.value); setError(''); }} /></span></div>
                <div className="sp-formrow"><span>{isAsset ? 'Valued on' : 'As of'}</span><input type="date" value={date} max={today} onChange={e => setDate(e.target.value)} /></div>
            </div>
            {valid && (
                <div className="sp-nwtiles">
                    {isAsset ? (
                        <div style={{background: tone(vsBase >= 0).bg}}><span style={{color: tone(vsBase >= 0).ink}}>vs invested</span><b style={{color: tone(vsBase >= 0).ink}}>{vsBase >= 0 ? '+' : ''}{pctOf(v, base)}% · {vsBase >= 0 ? '+' : ''}{spFmtMoney(vsBase, item.currency)}</b></div>
                    ) : (
                        <div style={{background: tone(base - v >= 0).bg}}><span style={{color: tone(base - v >= 0).ink}}>Repaid so far</span><b style={{color: tone(base - v >= 0).ink}}>{spFmtMoney(base - v, item.currency)}{base > 0 ? ' · ' + Math.round(((base - v) / base) * 100) + '%' : ''}</b></div>
                    )}
                    <div style={{background: tone(isAsset ? vsLast >= 0 : vsLast <= 0).bg}}><span style={{color: tone(isAsset ? vsLast >= 0 : vsLast <= 0).ink}}>vs last {isAsset ? 'value' : 'balance'}</span><b style={{color: tone(isAsset ? vsLast >= 0 : vsLast <= 0).ink}}>{vsLast >= 0 ? '+' : ''}{spFmtMoney(vsLast, item.currency)}</b></div>
                </div>
            )}
            {recent.length > 0 && (
                <React.Fragment>
                    <div className="sp-formlabel">Recent {isAsset ? 'valuations' : 'balances'}</div>
                    <div className="sp-formcard" style={{marginTop: '8px'}}>
                        {recent.map(h => (
                            <div key={h.id} className="sp-formrow"><span>{spLongDate(h.date)}</span><b>{spFmtMoney(h.value, item.currency)} <small style={{color: (h.value - h.from) >= 0 === isAsset ? '#15803d' : '#be123c', fontWeight: 700}}>{h.value - h.from >= 0 ? '+' : ''}{spFmtMoney(h.value - h.from, item.currency)}</small></b></div>
                        ))}
                    </div>
                </React.Fragment>
            )}
        </Sheet>
    );
}

// Cash is computed; both actions write the existing cash-correction record
// (accountId 'cash-{person}|{currency}', never an Expense/Income). Add cash (approved change)
// is the same record with a positive delta, for cash received outside an ATM withdrawal.
function NetWorthCashSheet({ mode, target, activeView, defaultCurrency, onClose, onSaved }) {
    const today = DateUtils.today();
    const [person, setPerson] = useState(target.person || 'own');
    const [currency, setCurrency] = useState(target.currency || defaultCurrency || 'GBP');
    const [amount, setAmount] = useState('');
    const [date, setDate] = useState(today);
    const [notes, setNotes] = useState('');
    const [error, setError] = useState('');
    const [showCurrency, setShowCurrency] = useState(false);
    const found = DataService.getCashWithdrawItems(null).find(i => i.person === (person || 'own') && i.currency === currency);
    const current = found ? found.value : 0;
    const isAdd = mode === 'add';
    const save = () => {
        const n = parseFloat(amount);
        if (amount === '' || isNaN(n)) { setError(isAdd ? 'Enter the amount received' : 'Enter the actual cash amount'); return; }
        if (isAdd && n <= 0) { setError('Amount must be greater than 0'); return; }
        if (isAdd && (!date || date > today)) { setError('Pick a date up to today'); return; }
        const delta = Math.round((isAdd ? n : n - current) * 100) / 100;
        if (delta === 0) { setError('Already matches — no adjustment needed.'); return; }
        const p = person || 'own';
        DataService.addReconciliation({
            accountId: 'cash-' + p + '|' + currency, person: p, date: isAdd ? date : today,
            balanceBefore: current, delta, balanceAfter: Math.round((current + delta) * 100) / 100,
            notes: notes || (isAdd ? 'Cash received' : ''), loggedAsTransaction: false, transactionType: null, transactionId: null
        });
        onSaved(isAdd ? spFmtMoney(n, currency) + ' cash added' : 'Cash set to ' + spFmtMoney(n, currency));
    };
    return (
        <Sheet onClose={onClose} footer={<React.Fragment>
            <button type="button" className="sp-btn sp-btn-cancel" onClick={onClose}>Cancel</button>
            <button type="button" className="sp-btn sp-btn-primary sp-btn-grow" onClick={save}><i className="fas fa-check"></i>{isAdd ? 'Add cash' : 'Save'}</button>
        </React.Fragment>}>
            <SpSheetHead icon="fas fa-money-bill-wave" tint="#dcfce7" ink="#15803d" title={isAdd ? 'Add cash' : 'Update cash'} sub={isAdd ? 'Cash you received outside an ATM withdrawal' : 'Set the cash you actually have'} />
            {error && <div className="sp-alert sp-alert-err"><i className="fas fa-circle-exclamation"></i><span>{error}</span></div>}
            <div className="sp-formcard" style={{marginTop: 0}}>
                {!target.locked && activeView.length > 1 && <div className="sp-formrow"><span>Whose cash</span><PersonSelect value={person === 'own' ? '' : person} onChange={v => setPerson(v || 'own')} activeView={activeView} className="" ownLabel="You" /></div>}
                <div className="sp-formrow">
                    <span>Currency</span>
                    {target.locked ? <b>{currency}</b> : <button type="button" className="sp-rowpick" onClick={() => setShowCurrency(true)}>{currency}<i className="fas fa-chevron-down"></i></button>}
                </div>
                <div className="sp-formrow"><span>Cash now (computed)</span><b>{spFmtMoney(current, currency)}</b></div>
                <div className="sp-formrow"><span>{isAdd ? 'Amount received' : 'Actual cash'}</span><span className="sp-moneyin"><span>{CurrencyService.getCurrencySymbol(currency)}</span><input type="number" step="0.01" inputMode="decimal" placeholder="0.00" value={amount} autoFocus onChange={e => { setAmount(e.target.value); setError(''); }} /></span></div>
                {isAdd && <div className="sp-formrow"><span>Date</span><input type="date" value={date} max={today} onChange={e => setDate(e.target.value)} /></div>}
                <div className="sp-formrow"><span>Note</span><input type="text" value={notes} placeholder={isAdd ? 'e.g. Birthday money' : 'Optional'} onChange={e => setNotes(e.target.value)} /></div>
            </div>
            <div className="sp-hint" style={{fontSize: '11px', margin: '8px 4px 0'}}>Saved as a cash correction (shown with balance reconciliations). It isn't counted as income or spending.</div>
            {showCurrency && <CurrencySheet value={currency} onPick={c => { setCurrency(c); setShowCurrency(false); }} onClose={() => setShowCurrency(false)} />}
        </Sheet>
    );
}

function NetWorth({ defaultCurrency, activeView, assetCategories = [], liabilityCategories = [], onUpdate }) {
    const [items, setItems] = useState(() => DataService.getNetWorthItems());
    const [tick, setTick] = useState(0);
    const [bankAccounts, setBankAccounts] = useState(() => DataService.getBankAccounts());
    const [openGroups, setOpenGroups] = useState({});
    const [openItem, setOpenItem] = useState(null);
    const [pendingDelete, setPendingDelete] = useState(null);
    const [sheet, setSheet] = useState(null); // { kind: 'add'|'edit'|'topup'|'value'|'cash', ... }
    const [toast, setToast] = useState('');
    const [filterSyncConflict, setFilterSyncConflict] = useState(!!FilterMemory.load('networth').syncConflict);
    const [showConflictDetail, setShowConflictDetail] = useState(null);
    const people = DataService.getPeople();
    useEffect(() => { FilterMemory.save('networth', { syncConflict: filterSyncConflict }); }, [filterSyncConflict]);
    useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(''), 3500); return () => clearTimeout(t); }, [toast]);

    const reload = () => { setItems(DataService.getNetWorthItems()); setBankAccounts(DataService.getBankAccounts()); setTick(t => t + 1); };
    const done = (msg) => { setSheet(null); if (msg) setToast(msg); reload(); if (onUpdate) onUpdate(); };

    const syncConflicts = useMemo(() => SyncConflicts.read('networth'), [items]);
    const netWorthConflictFieldLabels = { name: 'Name', value: 'Value', originalAmount: 'Original Amount', currency: 'Currency', categoryId: 'Category', subcategory: 'Subcategory', notes: 'Notes', person: 'Person', country: 'Country', openDate: 'Opened', valuedOn: 'Valued on', history: 'History' };
    const conflictItem = showConflictDetail ? items.find(i => i.id === showConflictDetail) : null;
    const conflictSnapshot = showConflictDetail ? syncConflicts[String(showConflictDetail)] : null;
    const formatNetWorthConflictValue = (key, value) => {
        if ((key === 'value' || key === 'originalAmount') && value !== undefined && value !== null) return spFmtMoney(value, (conflictItem && conflictItem.currency) || defaultCurrency);
        if (key === 'categoryId') { const cat = [...assetCategories, ...liabilityCategories].find(c => c.id === value); return cat ? cat.name : (value ? String(value) : '—'); }
        if (key === 'history') return Array.isArray(value) ? value.length + ' entr' + (value.length === 1 ? 'y' : 'ies') : '—';
        return value === undefined || value === null || value === '' ? '—' : String(value);
    };
    const handleResolveConflict = (useCloud) => {
        const itemId = showConflictDetail;
        const updates = useCloud && conflictSnapshot ? conflictSnapshot.cloudSnapshot : {};
        DataService.updateNetWorthItem(itemId, updates, { activeView });
        SyncConflicts.dismiss('networth', itemId);
        setShowConflictDetail(null);
        done();
    };

    const convertToDefault = (value, currency) => CurrencyService.convertToDefaultSync(value, currency, defaultCurrency);
    const walletParts = DataService.computeWalletParts(activeView, defaultCurrency);
    const wallet = walletParts.unlinkedIncome - walletParts.unlinkedExpenses + walletParts.primaryBalances;
    const debtLiabilities = DataService.getDebts().filter(d => d.direction === 'owe' && !d.isSettled && (matchesActiveView(d.person, activeView) || (d.createdInView || []).some(v => activeView.includes(v))));
    const storedItems = items.filter(i => matchesActiveView(i.person, activeView));
    const bankAssetItems = DataService.getBankAssetItems(activeView);
    const bankLiabilityItems = DataService.getBankLiabilityItems(activeView);
    const cashItems = DataService.getCashWithdrawItems(activeView);
    // Primary accounts are display-only here: their balance is already in "In wallet".
    const primaryWalletItems = DataService.getPrimaryWalletBankItems(activeView);
    const counted = [...storedItems, ...bankAssetItems, ...bankLiabilityItems, ...cashItems];
    const schedules = DataService.getRecurring();
    const today = DateUtils.today();
    const scheduleFor = (id) => schedules.find(s => (s.type === 'asset' || s.type === 'liability') && s.templateExpense && s.templateExpense.netWorthItemId === id && s.isActive && !(s.endDate && today > s.endDate)) || null;

    // Hero: one row per country + currency, in the original currency (never converted).
    const countryRows = (() => {
        const map = {};
        const add = (country, currency, type, value) => {
            const k = (country || '') + '|' + currency;
            if (!map[k]) map[k] = { country: country || '', currency, assets: 0, owed: 0 };
            if (type === 'asset') map[k].assets += value; else map[k].owed += value;
        };
        counted.forEach(i => add(i.country, i.currency, i.type, i.value));
        debtLiabilities.forEach(d => add('', d.currency, 'liability', d.amount));
        return Object.values(map).map(r => ({ ...r, net: r.assets - r.owed })).sort((a, b) => convertToDefault(b.net, b.currency) - convertToDefault(a.net, a.currency));
    })();
    const hasForeign = [...counted, ...primaryWalletItems].some(i => i.currency !== defaultCurrency);

    const conflictOnly = (list) => filterSyncConflict ? list.filter(i => !!syncConflicts[String(i.id)]) : list;
    const buildGroups = (type) => {
        const cats = type === 'asset' ? assetCategories : liabilityCategories;
        const members = [...(type === 'asset' ? [...storedItems.filter(i => i.type === 'asset'), ...bankAssetItems, ...cashItems] : [...storedItems.filter(i => i.type === 'liability'), ...bankLiabilityItems])];
        const display = type === 'asset' ? primaryWalletItems : [];
        const groups = [];
        const other = { key: type + '-other', name: type === 'asset' ? 'Other assets' : 'Other liabilities', look: { icon: 'fas fa-shapes', tint: '#f1f5f9', ink: '#475569' }, items: [], extra: [] };
        cats.forEach(c => {
            const its = conflictOnly(members.filter(i => i.categoryId === c.id));
            const ex = filterSyncConflict ? [] : display.filter(i => i.categoryId === c.id);
            if (!its.length && !ex.length) return;
            // System categories get their own group, and so does any category holding computed rows (e.g. Cash).
            if (c.locked || its.some(i => i.isBankAccount) || ex.length) groups.push({ key: 'c' + c.id, name: c.name, look: spNetWorthCatLook(c, type), items: its, extra: ex });
            else { other.items.push(...its.map(i => ({ ...i, _catName: c.name }))); other.extra.push(...ex); }
        });
        const orphans = conflictOnly(members.filter(i => !cats.some(c => c.id === i.categoryId)));
        if (orphans.length) other.items.push(...orphans);
        if (other.items.length || other.extra.length) groups.push(other);
        if (type === 'liability' && debtLiabilities.length && !filterSyncConflict) {
            groups.push({ key: 'debts', name: 'Debts I owe', look: { icon: 'fas fa-handshake', tint: '#fef3c7', ink: '#b45309' }, items: debtLiabilities.map(d => ({ id: 'debt-' + d.id, name: d.counterparty, value: d.amount, currency: d.currency, type: 'liability', person: d.person, country: '', isDebt: true, debt: d })), extra: [] });
        }
        return groups.map(g => {
            const totals = {};
            g.items.forEach(i => { const k = (i.country || '') + '|' + i.currency; totals[k] = totals[k] || { country: i.country || '', currency: i.currency, value: 0 }; totals[k].value += i.value; });
            return { ...g, totals: Object.values(totals) };
        });
    };
    const assetGroups = buildGroups('asset');
    const liabilityGroups = buildGroups('liability');
    const sumConverted = (list) => list.reduce((s, i) => s + convertToDefault(i.value, i.currency), 0);
    const totalAssetsConv = sumConverted(counted.filter(i => i.type === 'asset'));
    const totalLiabConv = sumConverted(counted.filter(i => i.type === 'liability')) + debtLiabilities.reduce((s, d) => s + convertToDefault(d.amount, d.currency), 0);
    const fmt0 = (v) => spFmtMoney(v, defaultCurrency, 0);

    const itemKind = (i) => i.isDebt ? 'debt' : i.isPrimaryWallet ? 'primary' : i.isComputedCash ? 'cash' : i.isBankAccount ? 'bank' : 'stored';
    const deleteText = (item) => {
        if (item.type === 'liability') return 'Delete ' + item.name + '? Its balance history goes too. This can\'t be undone.';
        const sch = scheduleFor(item.id);
        return 'Delete ' + item.name + '? Its valuation history' + (sch ? ' and the ' + spFmtMoney(sch.templateExpense.amount, item.currency) + ' ' + sch.frequency + ' repeat in Scheduled' : '') + ' will be removed. Top-ups already logged in Accounts stay. This can\'t be undone.';
    };
    const doDelete = (item) => { DataService.deleteNetWorthItem(item.id, activeView); setPendingDelete(null); setOpenItem(null); done(item.name + ' deleted'); };

    const renderItem = (item, groupKey) => {
        const kind = itemKind(item);
        const isOpen = openItem === groupKey + ':' + item.id;
        const isAsset = item.type === 'asset';
        const invested = item.originalAmount != null ? item.originalAmount : null;
        const pct = kind === 'stored' && isAsset && invested > 0 ? Math.round(((item.value - invested) / invested) * 1000) / 10 : null;
        const chip = pct === null ? null : pct > 0 ? ['#dcfce7', '#15803d', '+' + pct + '%'] : pct < 0 ? ['#ffe4e6', '#be123c', pct + '%'] : ['#f1f5f9', '#64748b', '0%'];
        const overdrawn = kind === 'bank' && isAsset && item.value < 0;
        const negCash = kind === 'cash' && item.value < 0;
        const meta = kind === 'debt' ? ['From Scheduled → Debts', item.debt.dueDate ? 'due ' + spLongDate(item.debt.dueDate) : '']
            : kind === 'primary' ? ['Primary account', 'In wallet']
            : kind === 'bank' ? ['Linked account', item.subcategory]
            : kind === 'cash' ? ['Cash in hand']
            : [item._catName, item.subcategory, item.country, item.openDate ? 'Opened ' + spLongDate(item.openDate) : ''];
        const conflict = kind === 'stored' && syncConflicts[String(item.id)];
        const cfOpen = showConflictDetail === item.id;
        const sch = kind === 'stored' ? scheduleFor(item.id) : null;
        const topups = (item.history || []).filter(h => h.type === 'topup').length;
        return (
            <div key={item.id} className="sp-nwitem">
                <button type="button" className="sp-nwitem-row" onClick={() => { setOpenItem(isOpen ? null : groupKey + ':' + item.id); setPendingDelete(null); }}>
                    <span className="sp-nwitem-main">
                        <span className="sp-schedtitle">
                            <span>{item.name}</span>
                            {conflict && <span role="button" className={'sp-cfbtn' + (cfOpen ? ' is-open' : '')} title="Sync conflict · tap to compare" onClick={(e) => { e.stopPropagation(); setShowConflictDetail(cfOpen ? null : item.id); }}><i className="fas fa-code-compare"></i></span>}
                            {activeView.length > 1 && spOwnerChip(item.person, people)}
                            {sch && <i className="fas fa-rotate" style={{color: '#7c3aed', fontSize: '10px', flexShrink: 0}} title="Recurring investment"></i>}
                        </span>
                        <span className="sp-nwitem-meta sp-nwitem-metaline">{meta.filter(Boolean).join(' · ') || '—'}</span>
                        {negCash && <span className="sp-kindtag" style={{background: '#fef3c7', color: '#92400e', marginTop: '4px'}}>Spent more than withdrawn</span>}
                    </span>
                    <span className="sp-schedright">
                        <span className="sp-schedamt" style={{color: !isAsset || negCash || overdrawn ? '#e11d48' : undefined}}>{overdrawn ? spFmtMoney(0, item.currency) : (!isAsset ? '−' : '') + spFmtMoney(isAsset ? item.value : Math.abs(item.value), item.currency)}</span>
                        {overdrawn && <span className="sp-schedsub" style={{color: '#e11d48'}}>Overdraft {spFmtMoney(Math.abs(item.value), item.currency)}</span>}
                        {chip && <span className="sp-kindtag" style={{background: chip[0], color: chip[1], marginTop: '4px'}}>{chip[2]}</span>}
                        {item.currency !== defaultCurrency && <span className="sp-schedsub">≈ {spFmtMoney(convertToDefault(item.value, item.currency), defaultCurrency)}</span>}
                    </span>
                    <i className={'fas fa-chevron-' + (isOpen ? 'up' : 'down') + ' sp-catchev'}></i>
                </button>
                {cfOpen && conflictItem && conflictSnapshot && (
                    <div style={{padding: '0 0 10px'}}>
                        <ConflictCompare localRecord={conflictItem} cloudSnapshot={conflictSnapshot.cloudSnapshot} detectedAt={conflictSnapshot.detectedAt} fieldLabels={netWorthConflictFieldLabels} formatValue={formatNetWorthConflictValue} onKeepLocal={() => handleResolveConflict(false)} onUseCloud={() => handleResolveConflict(true)} />
                    </div>
                )}
                {isOpen && (
                    <div className="sp-nwitem-open">
                        {item.notes && <div className="sp-nwnote">{item.notes}</div>}
                        {kind === 'stored' && isAsset && (
                            <div className="sp-nwdetail">
                                Invested <b>{spFmtMoney(invested != null ? invested : item.value, item.currency)}</b>
                                {invested != null && <React.Fragment> · {item.value - invested >= 0 ? 'Gain' : 'Loss'} <b style={{color: item.value - invested >= 0 ? '#15803d' : '#be123c'}}>{spFmtMoney(Math.abs(item.value - invested), item.currency)}</b></React.Fragment>}
                                {item.valuedOn && <React.Fragment> · Last valued {spLongDate(item.valuedOn)}</React.Fragment>}
                                {topups > 0 && <React.Fragment> · {topups} top-up{topups === 1 ? '' : 's'} recorded</React.Fragment>}
                                {sch && <React.Fragment> · Repeats {spFmtMoney(sch.templateExpense.amount, item.currency)} {sch.frequency}, next {spLongDate(sch.nextDue)}</React.Fragment>}
                            </div>
                        )}
                        {kind === 'stored' && !isAsset && (
                            <div className="sp-nwdetail">
                                Originally <b>{spFmtMoney(invested != null ? invested : item.value, item.currency)}</b>
                                {invested != null && invested - item.value > 0 && <React.Fragment> · Repaid <b style={{color: '#15803d'}}>{spFmtMoney(invested - item.value, item.currency)}</b></React.Fragment>}
                                {item.valuedOn && <React.Fragment> · As of {spLongDate(item.valuedOn)}</React.Fragment>}
                                {sch && <React.Fragment> · Repeats {spFmtMoney(sch.templateExpense.amount, item.currency)} {sch.frequency}</React.Fragment>}
                            </div>
                        )}
                        {kind === 'bank' && <div className="sp-nwdetail">Worked out from this account's linked transactions. Adjust it with Balance (reconcile) in More → Accounts.</div>}
                        {kind === 'primary' && <div className="sp-nwdetail">Your primary account. Its balance is counted in "In wallet" above, so it isn't added again here.</div>}
                        {kind === 'cash' && <div className="sp-nwdetail">Cash withdrawals minus cash spending, plus any cash corrections.</div>}
                        {kind === 'debt' && <div className="sp-nwdetail">Settle or edit it in Scheduled → Debts.</div>}
                        {kind === 'stored' && (
                            <SpActBar actions={[
                                isAsset && { key: 'topup', label: 'Top up', icon: 'fas fa-plus', tone: 'green', onClick: () => setSheet({ kind: 'topup', item }) },
                                { key: 'value', label: isAsset ? 'Update value' : 'Update balance', icon: isAsset ? 'fas fa-chart-line' : 'fas fa-scale-balanced', tone: isAsset ? 'blue' : 'slate', onClick: () => setSheet({ kind: 'value', item }) },
                                { key: 'edit', label: 'Edit', icon: 'fas fa-pen', tone: 'slate', onClick: () => setSheet({ kind: 'edit', item }) },
                                { key: 'delete', label: 'Delete', icon: 'fas fa-trash', tone: 'rose', onClick: () => setPendingDelete(item.id) }
                            ]} />
                        )}
                        {kind === 'cash' && (
                            <SpActBar actions={[
                                { key: 'update', label: 'Update cash', icon: 'fas fa-pen', tone: 'slate', onClick: () => setSheet({ kind: 'cash', mode: 'update', target: { person: item.person, currency: item.currency, locked: true } }) },
                                { key: 'add', label: 'Add cash', icon: 'fas fa-plus', tone: 'green', onClick: () => setSheet({ kind: 'cash', mode: 'add', target: { person: item.person, currency: item.currency, locked: true } }) }
                            ]} />
                        )}
                        {pendingDelete === item.id && <div style={{marginTop: '8px'}}><InlineConfirm text={deleteText(item)} keepLabel="Cancel" cta="Delete" onKeep={() => setPendingDelete(null)} onConfirm={() => doDelete(item)} /></div>}
                    </div>
                )}
            </div>
        );
    };

    const renderGroup = (g, type) => {
        const open = !!openGroups[g.key];
        const n = g.items.length + g.extra.length;
        return (
            <div key={g.key} className="sp-nwgroup">
                <button type="button" className="sp-nwgroup-head" onClick={() => setOpenGroups(p => ({ ...p, [g.key]: !open }))} aria-expanded={open}>
                    <span className="sp-schedicon" style={{background: g.look.tint, color: g.look.ink}}><i className={g.look.icon}></i></span>
                    <span className="sp-schedmain"><span className="sp-schedtitle"><span style={{fontSize: '16px'}}>{g.name}</span></span><span className="sp-schedmeta">{n} {type === 'asset' ? 'asset' : 'liabilit'}{type === 'asset' ? (n === 1 ? '' : 's') : (n === 1 ? 'y' : 'ies')}</span></span>
                    <span className="sp-nwchev"><i className={'fas fa-chevron-' + (open ? 'up' : 'down')}></i></span>
                </button>
                {g.totals.length > 0 && (
                    <div className="sp-nwtotals">
                        {g.totals.map(t => (
                            <div key={t.country + t.currency}><span className="sp-nwcc">{spCountryCode(t.country)}</span><b style={{color: type === 'liability' || t.value < 0 ? '#e11d48' : undefined}}>{type === 'liability' ? '−' : ''}{spFmtMoney(type === 'liability' ? Math.abs(t.value) : t.value, t.currency)}</b></div>
                        ))}
                    </div>
                )}
                {open && <div className="sp-nwitems">{g.items.map(i => renderItem(i, g.key))}{g.extra.map(i => renderItem(i, g.key))}</div>}
            </div>
        );
    };

    return (
        <div className="sp-page sp-nwpage">
            <div className="sp-page-kicker">Where you stand</div>
            <h2 className="sp-page-title" style={{marginBottom: '12px'}}>Net Worth</h2>
            {toast && <div className="sp-alert sp-alert-ok"><i className="fas fa-circle-check"></i><span>{toast}</span></div>}
            {Object.keys(syncConflicts).length > 0 && (
                <label className="sp-check" style={{margin: '0 4px 10px'}}>
                    <input type="checkbox" checked={filterSyncConflict} onChange={(e) => setFilterSyncConflict(e.target.checked)} />
                    <i className="fas fa-code-compare" style={{color: '#4f46e5'}}></i>Sync conflicts only
                </label>
            )}

            <div className="sp-nwhero">
                <div className="sp-nwhero-label">Net worth by country</div>
                {countryRows.length === 0 && <div className="sp-nwhero-empty">Add an asset or liability to see where you stand.</div>}
                {countryRows.map(r => (
                    <div key={r.country + r.currency} className="sp-nwhero-row">
                        <span className="sp-nwhero-cc">{spCountryCode(r.country)}</span>
                        <div className="sp-nwhero-main">
                            <div className="sp-nwhero-name">{r.country || 'No country set'}{r.country && COUNTRY_CURRENCY_MAP[r.country] === r.currency ? '' : ' · ' + r.currency}</div>
                            <div className="sp-nwhero-sub"><span style={{color: '#34d399'}}>▲ {spFmtMoney(r.assets, r.currency)}</span>{r.owed > 0 && <span style={{color: '#fb7185'}}>▼ {spFmtMoney(r.owed, r.currency)}</span>}</div>
                        </div>
                        <div className="sp-nwhero-val" style={{color: r.net < 0 ? '#fb7185' : undefined}}>{spFmtMoney(r.net, r.currency)}</div>
                    </div>
                ))}
                <div className="sp-nwhero-row is-wallet">
                    <span className="sp-nwhero-cc" style={{color: '#34d399'}}><i className="fas fa-wallet"></i></span>
                    <div className="sp-nwhero-main">
                        <div className="sp-nwhero-name" style={{color: 'var(--sp-slate-300)'}}>In wallet</div>
                        <div className="sp-nwhero-sub" style={{color: 'var(--sp-slate-400)', display: 'block'}}>{fmt0(walletParts.primaryBalances)} primary · {walletParts.unlinkedIncome > 0 ? '+' : ''}{fmt0(walletParts.unlinkedIncome)} unlinked income · {walletParts.unlinkedExpenses > 0 ? '−' : ''}{fmt0(walletParts.unlinkedExpenses)} unlinked spend</div>
                    </div>
                    <div className="sp-nwhero-val">{spFmtMoney(wallet, defaultCurrency)}</div>
                </div>
                {hasForeign && <div className="sp-nwhero-note"><i className="fas fa-circle-info"></i>In wallet and ≈ amounts use approximate offline exchange rates.</div>}
            </div>

            <div className="sp-btn-row" style={{margin: '0 0 14px'}}>
                <button type="button" className="sp-btn sp-btn-primary" style={{flex: 1, height: '50px', fontSize: '15px'}} onClick={() => setSheet({ kind: 'add', type: 'asset' })}><i className="fas fa-plus"></i>Add asset</button>
                <button type="button" className="sp-btn sp-btn-white" style={{flex: 1, height: '50px', fontSize: '15px', color: '#e11d48'}} onClick={() => setSheet({ kind: 'add', type: 'liability' })}><i className="fas fa-plus"></i>Add liability</button>
            </div>

            <div className="sp-group-head" style={{padding: '0 4px 8px'}}><span className="sp-group-label">Assets</span><span className="sp-group-total" style={{color: '#16a34a', fontWeight: 800}}>{fmt0(totalAssetsConv)}</span></div>
            {assetGroups.length === 0 ? <div className="sp-empty" style={{marginBottom: '14px'}}><i className="fas fa-arrow-trend-up"></i>No assets yet.</div> : assetGroups.map(g => renderGroup(g, 'asset'))}
            <button type="button" className="sp-linkbtn" onClick={() => setSheet({ kind: 'cash', mode: 'update', target: { person: resolveActiveViewValue(activeView) || 'own', currency: defaultCurrency, locked: false } })}><i className="fas fa-money-bill-wave"></i>Set a cash balance</button>

            <div className="sp-group-head" style={{padding: '14px 4px 8px'}}><span className="sp-group-label">Liabilities</span><span className="sp-group-total" style={{color: '#e11d48', fontWeight: 800}}>{totalLiabConv > 0 ? '−' : ''}{fmt0(totalLiabConv)}</span></div>
            {liabilityGroups.length === 0 ? <div className="sp-empty"><i className="fas fa-arrow-trend-down"></i>No liabilities.</div> : liabilityGroups.map(g => renderGroup(g, 'liability'))}

            {sheet && (sheet.kind === 'add' || sheet.kind === 'edit') && (
                <NetWorthItemSheet type={sheet.kind === 'add' ? sheet.type : sheet.item.type} item={sheet.kind === 'edit' ? sheet.item : null} assetCategories={assetCategories} liabilityCategories={liabilityCategories} bankAccounts={bankAccounts} defaultCurrency={defaultCurrency} activeView={activeView} onClose={() => setSheet(null)} onSaved={done} />
            )}
            {sheet && sheet.kind === 'topup' && <NetWorthTopUpSheet item={sheet.item} bankAccounts={bankAccounts} schedule={scheduleFor(sheet.item.id)} activeView={activeView} onClose={() => setSheet(null)} onSaved={done} />}
            {sheet && sheet.kind === 'value' && <NetWorthValueSheet item={sheet.item} activeView={activeView} onClose={() => setSheet(null)} onSaved={done} />}
            {sheet && sheet.kind === 'cash' && <NetWorthCashSheet mode={sheet.mode} target={sheet.target} activeView={activeView} defaultCurrency={defaultCurrency} onClose={() => setSheet(null)} onSaved={done} />}
        </div>
    );
}

function DebtFormSheet({ debt, direction, defaultCurrency, activeView, onClose, onSaved }) {
    const people = DataService.getPeople();
    const [f, setF] = useState(() => debt
        ? { direction: debt.direction, counterparty: debt.counterparty, amount: String(debt.amount), currency: debt.currency, notes: debt.notes || '', dueDate: debt.dueDate || '', person: debt.person || 'own' }
        : { direction, counterparty: '', amount: '', currency: defaultCurrency || 'GBP', notes: '', dueDate: '', person: resolveActiveViewValue(activeView) });
    const [errors, setErrors] = useState({});
    const [showCurrency, setShowCurrency] = useState(false);
    const set = (k, v) => setF(p => ({ ...p, [k]: v }));
    const owe = f.direction === 'owe';
    const save = () => {
        const e = {};
        if (!f.counterparty.trim()) e.counterparty = 'Person name is required';
        if (!f.amount || parseFloat(f.amount) <= 0) e.amount = 'Amount must be greater than 0';
        if (Object.keys(e).length > 0) { setErrors(e); return; }
        if (debt) {
            DataService.updateDebt(debt.id, { counterparty: f.counterparty.trim(), amount: parseFloat(f.amount), currency: f.currency, notes: f.notes, dueDate: f.dueDate, person: f.person || 'own' });
        } else {
            const { direction: dir, ...rest } = f;
            DataService.addDebt({ ...rest, counterparty: f.counterparty.trim(), direction: dir, createdInView: activeView });
        }
        onSaved(debt ? 'Debt updated' : 'Debt with ' + f.counterparty.trim() + ' added', f.direction);
    };
    const err = errors.counterparty || errors.amount;
    return (
        <Sheet onClose={onClose} footer={<React.Fragment>
            <button type="button" className="sp-btn sp-btn-cancel" onClick={onClose}>Cancel</button>
            <button type="button" className="sp-btn sp-btn-primary sp-btn-grow" onClick={save}><i className="fas fa-check"></i>{debt ? 'Save changes' : 'Save debt'}</button>
        </React.Fragment>}>
            <SpSheetHead icon="fas fa-handshake" tint="#fef3c7" ink="#d97706" title={debt ? 'Edit debt' : 'Add debt'} sub="Money between you and someone else" />
            {!debt && (
                <div className="sp-seg" style={{margin: '0 0 12px'}}>
                    <button type="button" className={owe ? 'is-active' : ''} onClick={() => set('direction', 'owe')}>To pay</button>
                    <button type="button" className={!owe ? 'is-active' : ''} onClick={() => set('direction', 'owed')}>To collect</button>
                </div>
            )}
            {err && <div className="sp-alert sp-alert-err"><i className="fas fa-circle-exclamation"></i><span>{err}</span></div>}
            <div className="sp-formcard" style={{marginTop: 0}}>
                <div className={'sp-formrow' + (errors.counterparty ? ' is-bad' : '')}><span>{owe ? 'Pay to' : 'Collect from'}</span><input type="text" value={f.counterparty} placeholder="Name" onChange={e => set('counterparty', e.target.value)} /></div>
                <div className="sp-formrow">
                    <span>Debt owner</span>
                    {activeView.length > 1
                        ? <PersonSelect value={f.person === 'own' ? '' : f.person} onChange={v => set('person', v || 'own')} activeView={activeView} className="" ownLabel="You" />
                        : <span className="sp-lockedval">{spOwnerChip(f.person, people)}<i className="fas fa-lock"></i></span>}
                </div>
                <div className="sp-formrow"><span>Currency</span><button type="button" className="sp-rowpick" onClick={() => setShowCurrency(true)}>{f.currency}<i className="fas fa-chevron-down"></i></button></div>
                <div className={'sp-formrow' + (errors.amount ? ' is-bad' : '')}>
                    <span>Amount</span>
                    <span className="sp-moneyin"><span>{ValidationUtils.getCurrencySymbol(f.currency)}</span><input type="number" step="0.01" min="0.01" inputMode="decimal" placeholder="0.00" value={f.amount} onChange={e => set('amount', e.target.value)} /></span>
                </div>
                <div className="sp-formrow"><span>Due date</span><input type="date" value={f.dueDate} onChange={e => set('dueDate', e.target.value)} /></div>
                <div className="sp-formrow"><span>Note</span><input type="text" value={f.notes} placeholder="Optional" onChange={e => set('notes', e.target.value)} /></div>
            </div>
            {showCurrency && <CurrencySheet value={f.currency} onPick={c => { set('currency', c); setShowCurrency(false); }} onClose={() => setShowCurrency(false)} />}
        </Sheet>
    );
}

// Settling records the same expense / income as before; "owed to me" can now land in one of
// the receiving person's accounts (approved change) — Cash keeps today's no-account income.
function DebtSettleSheet({ debt, categories, activeView, onClose, onSettled }) {
    const today = DateUtils.today();
    const owe = debt.direction === 'owe';
    const paidBy = resolveActiveViewValue(activeView);
    const accounts = owe ? [] : DataService.getAccountsForPerson(paidBy || 'own');
    const [accountId, setAccountId] = useState(() => owe ? '' : (resolveDefaultAccountId(paidBy, debt.currency) || ''));
    const [categoryId, setCategoryId] = useState('');
    const [subcategory, setSubcategory] = useState('');
    const [busy, setBusy] = useState(false);
    const amountFmt = ValidationUtils.formatCurrency(debt.amount, debt.currency || 'GBP');
    const account = accounts.find(a => String(a.id) === String(accountId));

    const settleOnly = () => { DataService.settleDebt(debt.id); onSettled('Debt with ' + debt.counterparty + ' settled'); };
    const settleAndLog = async () => {
        if (busy) return;
        setBusy(true);
        DataService.settleDebt(debt.id);
        try {
            if (owe) {
                const cat = (categories || []).find(c => String(c.id) === String(categoryId));
                await DataService.addExpense({ amount: debt.amount, currency: debt.currency, date: today, categoryId: categoryId ? Number(categoryId) : null, category: cat ? cat.name : '', subcategory, description: `Settled debt to ${debt.counterparty}`, paidBy, tags: [] });
                onSettled('Settled · expense logged');
            } else {
                const rec = { amount: debt.amount, currency: debt.currency, date: today, source: `Debt from ${debt.counterparty}`, description: `Received debt from ${debt.counterparty}`, paidBy };
                if (account) rec.accountId = Number(account.id);
                await DataService.addIncome(rec);
                onSettled('Settled · income added' + (account ? ' to ' + account.accountName : ' as cash'));
            }
        } catch (e) { onSettled('Settled, but the ' + (owe ? 'expense' : 'income') + ' could not be logged'); }
    };

    return (
        <Sheet onClose={onClose}>
            <SpSheetHead icon="fas fa-handshake" tint="#dcfce7" ink="#16a34a" title={'Settle ' + amountFmt} sub={(owe ? 'You paid ' + debt.counterparty : debt.counterparty + ' paid you') + (debt.notes ? ' · ' + debt.notes : '')} />
            {owe ? (
                <React.Fragment>
                    <div className="sp-sheet-q">Log this payment as an expense?</div>
                    <div className="sp-formlabel" style={{marginTop: '4px'}}>Expense category</div>
                    <SpCategoryPicker categories={categories || []} categoryId={categoryId} subcategory={subcategory} onChange={(c, s) => { setCategoryId(c); setSubcategory(s); }} />
                    <div className="sp-formcard" style={{marginTop: '12px'}}>
                        <div className="sp-formrow"><span>Date</span><b>Today, {spShortDate(today)}</b></div>
                    </div>
                </React.Fragment>
            ) : (
                <React.Fragment>
                    <div className="sp-sheet-q">Where did you receive it?</div>
                    <div className="sp-bankrows" style={{marginTop: 0}}>
                        {accounts.map(a => {
                            const on = String(accountId) === String(a.id);
                            return (
                                <button key={a.id} type="button" className="sp-bankrow" onClick={() => setAccountId(a.id)}>
                                    <span className="sp-tile" style={{background: on ? '#dcfce7' : '#f1f5f9', color: on ? '#16a34a' : '#64748b'}}><i className={a.accountType === 'Credit' ? 'fas fa-credit-card' : a.accountType === 'Savings' ? 'fas fa-piggy-bank' : 'fas fa-building-columns'}></i></span>
                                    <div className="sp-row-main">
                                        <div style={{display: 'flex', alignItems: 'center', gap: '6px'}}><span className="sp-row-title">{a.accountName}</span>{a.isPrimary && <span className="sp-badge-primary">PRIMARY</span>}</div>
                                        <div className="sp-row-sub">{a.accountType || 'Account'} · {a.currency}</div>
                                    </div>
                                    <i className={on ? 'fas fa-circle-check' : 'far fa-circle'} style={{color: on ? '#10b981' : '#cbd5e1', fontSize: '16px'}}></i>
                                </button>
                            );
                        })}
                        <button type="button" className="sp-bankrow" onClick={() => setAccountId('')}>
                            <span className="sp-tile" style={{background: !accountId ? '#dcfce7' : '#f1f5f9', color: !accountId ? '#16a34a' : '#64748b'}}><i className="fas fa-money-bill-wave"></i></span>
                            <div className="sp-row-main"><div className="sp-row-title">Cash</div><div className="sp-row-sub">Received in hand</div></div>
                            <i className={!accountId ? 'fas fa-circle-check' : 'far fa-circle'} style={{color: !accountId ? '#10b981' : '#cbd5e1', fontSize: '16px'}}></i>
                        </button>
                    </div>
                    <div className="sp-hint" style={{margin: '8px 4px 0', fontSize: '11px'}}>Logged in Income as "Debt from {debt.counterparty}".</div>
                </React.Fragment>
            )}
            <div className="sp-sheet-actions">
                <button type="button" className="sp-btn sp-btn-primary" disabled={busy} onClick={settleAndLog}>
                    <i className={owe ? 'fas fa-receipt' : 'fas fa-arrow-down'}></i>{owe ? 'Settle & log expense' : account ? 'Settle & add to ' + account.accountName : 'Settle & add as cash'}
                </button>
                <div className="sp-btn-row">
                    <button type="button" className="sp-btn sp-btn-cancel" onClick={onClose}>Cancel</button>
                    <button type="button" className="sp-btn sp-btn-white" disabled={busy} onClick={settleOnly}>Settle only</button>
                </div>
            </div>
        </Sheet>
    );
}

function DebtTracker({ defaultCurrency, categories, onUpdate, activeView, embedded }) {
    const _f0 = FilterMemory.load('debts'); // restore last session's tab / settled toggle (see FilterMemory)
    const [activeTab, setActiveTab] = useState(_f0.tab === 'owed' ? 'owed' : 'owe');
    const [debts, setDebts] = useState(() => DataService.getDebts());
    const [openId, setOpenId] = useState(null);
    const [pendingDelete, setPendingDelete] = useState(null);
    const [formDebt, setFormDebt] = useState(null); // null | 'new' | debt
    const [settleDebt, setSettleDebt] = useState(null);
    const [toast, setToast] = useState('');
    const [showSettled, setShowSettled] = useState(!!_f0.showSettled);
    const [filterSyncConflict, setFilterSyncConflict] = useState(!!_f0.syncConflict);
    const [showConflictDetail, setShowConflictDetail] = useState(null);
    const people = DataService.getPeople();

    // Persist tab + settled toggle for the session (see FilterMemory).
    useEffect(() => { FilterMemory.save('debts', { tab: activeTab, showSettled, syncConflict: filterSyncConflict }); }, [activeTab, showSettled, filterSyncConflict]);
    useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(''), 4000); return () => clearTimeout(t); }, [toast]);

    const syncConflicts = useMemo(() => SyncConflicts.read('debts'), [debts]);
    const reload = () => setDebts(DataService.getDebts());
    const today = DateUtils.today();
    const isOverdue = (d) => d.dueDate && d.dueDate < today && !d.isSettled;

    // A debt is visible if it's linked to a selected person, OR it was created while a
    // selected person's view was active (unchanged rule).
    const personDebts = debts.filter(d => matchesActiveView(d.person, activeView) || (d.createdInView || []).some(v => activeView.includes(v)));
    const displayDebts = filterSyncConflict ? personDebts.filter(d => !!syncConflicts[String(d.id)]) : personDebts;
    const activeDebts = displayDebts.filter(d => !d.isSettled && d.direction === activeTab);
    const settledDebts = displayDebts.filter(d => d.isSettled && d.direction === activeTab);
    const sortedActive = [...activeDebts].sort((a, b) => (isOverdue(a) ? 0 : 1) - (isOverdue(b) ? 0 : 1) || new Date(b.createdAt) - new Date(a.createdAt));

    const fmtAmt = (amount, currency) => {
        try { return new Intl.NumberFormat('en-GB', { style: 'currency', currency }).format(amount); } catch (_) { return `${currency} ${Number(amount).toFixed(2)}`; }
    };
    const fmt0 = (amount, currency) => ValidationUtils.getCurrencySymbol(currency) + Math.round(amount).toLocaleString('en-GB');
    const totalsLabel = (dir) => {
        const totals = {};
        personDebts.filter(d => !d.isSettled && d.direction === dir).forEach(d => { totals[d.currency] = (totals[d.currency] || 0) + d.amount; });
        const parts = Object.entries(totals).map(([c, a]) => fmt0(a, c));
        return parts.length ? parts.join(' + ') : fmt0(0, defaultCurrency || 'GBP');
    };

    const afterChange = (msg) => { reload(); if (msg) setToast(msg); if (onUpdate) onUpdate(); };
    const handleDelete = (id) => { DataService.deleteDebt(id); setPendingDelete(null); setOpenId(null); afterChange('Debt deleted'); };

    const conflictDebt = showConflictDetail ? debts.find(d => d.id === showConflictDetail) : null;
    const conflictSnapshot = showConflictDetail ? syncConflicts[String(showConflictDetail)] : null;
    const debtConflictFieldLabels = { counterparty: 'Person', amount: 'Amount', currency: 'Currency', direction: 'Direction', notes: 'Notes', dueDate: 'Due Date', person: 'Owner', isSettled: 'Settled', settledAt: 'Settled On' };
    const formatDebtConflictValue = (key, value) => {
        if (key === 'amount' && value !== undefined && value !== null) return fmtAmt(value, (conflictDebt && conflictDebt.currency) || 'GBP');
        if (key === 'direction') return value === 'owe' ? 'To pay' : value === 'owed' ? 'To collect' : String(value || '—');
        if (typeof value === 'boolean') return value ? 'Yes' : 'No';
        return value === undefined || value === null || value === '' ? '—' : String(value);
    };
    const handleResolveConflict = (useCloud) => {
        const debtId = showConflictDetail;
        const updates = useCloud && conflictSnapshot ? conflictSnapshot.cloudSnapshot : {};
        DataService.updateDebt(debtId, updates);
        SyncConflicts.dismiss('debts', debtId);
        setShowConflictDetail(null);
        afterChange();
    };

    const renderRow = (debt, settled) => {
        const owe = debt.direction === 'owe';
        const overdue = isOverdue(debt);
        const late = overdue ? -spDaysFrom(today, debt.dueDate) : 0;
        const meta = settled ? 'Settled' + (debt.settledAt ? ' ' + spLongDate(debt.settledAt.slice(0, 10)) : '')
            : !debt.dueDate ? 'No due date' : overdue ? 'Was due ' + spShortDate(debt.dueDate) + ' · ' + late + ' day' + (late === 1 ? '' : 's') + ' late' : 'Due ' + spLongDate(debt.dueDate);
        const isOpen = openId === debt.id;
        const conflict = syncConflicts[String(debt.id)];
        const cfOpen = showConflictDetail === debt.id;
        return (
            <div key={debt.id} className="sp-schedcard">
                <button type="button" className="sp-schedrow" style={{opacity: settled ? 0.6 : 1}} onClick={() => { setOpenId(isOpen ? null : debt.id); setPendingDelete(null); }}>
                    <span className="sp-schedicon" style={{background: owe ? '#fee2e2' : '#dcfce7', color: owe ? '#e11d48' : '#16a34a', fontWeight: 800, fontSize: '15px'}}>{(debt.counterparty || '?').charAt(0).toUpperCase()}</span>
                    <span className="sp-schedmain">
                        <span className="sp-schedtitle">
                            <span>{debt.counterparty}</span>
                            {conflict && <span role="button" className={'sp-cfbtn' + (cfOpen ? ' is-open' : '')} title="Sync conflict · tap to compare" onClick={(e) => { e.stopPropagation(); setShowConflictDetail(cfOpen ? null : debt.id); }}><i className="fas fa-code-compare"></i></span>}
                            {overdue && <span className="sp-kindtag" style={{background: '#fee2e2', color: '#e11d48'}}><i className="fas fa-circle-exclamation" style={{fontSize: '8px', marginRight: '3px'}}></i>OVERDUE</span>}
                        </span>
                        <span className="sp-schedmeta" style={{color: overdue ? '#e11d48' : 'var(--sp-slate-400)'}}>
                            {activeView.length > 1 && spOwnerChip(debt.person, people)}
                            <span>{meta}</span>
                        </span>
                        {debt.notes && <span className="sp-schedend" style={{fontWeight: 500}}>{debt.notes}</span>}
                    </span>
                    <span className="sp-schedright"><span className="sp-schedamt" style={{color: settled ? 'var(--sp-slate-400)' : owe ? '#e11d48' : '#16a34a', textDecoration: settled ? 'line-through' : 'none'}}>{fmtAmt(debt.amount, debt.currency)}</span></span>
                </button>
                {cfOpen && conflictDebt && conflictSnapshot && (
                    <div style={{padding: '0 15px 12px'}}>
                        <ConflictCompare localRecord={conflictDebt} cloudSnapshot={conflictSnapshot.cloudSnapshot} detectedAt={conflictSnapshot.detectedAt} fieldLabels={debtConflictFieldLabels} formatValue={formatDebtConflictValue} onKeepLocal={() => handleResolveConflict(false)} onUseCloud={() => handleResolveConflict(true)} />
                    </div>
                )}
                {isOpen && (
                    <div className="sp-schedopen">
                        <SpActBar actions={[
                            !settled && { key: 'settle', label: 'Settle', icon: 'fas fa-handshake', tone: 'green', onClick: () => setSettleDebt(debt) },
                            !settled && { key: 'edit', label: 'Edit', icon: 'fas fa-pen', tone: 'slate', onClick: () => setFormDebt(debt) },
                            { key: 'delete', label: 'Delete', icon: 'fas fa-trash', tone: 'rose', onClick: () => setPendingDelete(debt.id) }
                        ]} />
                        {pendingDelete === debt.id && (
                            <div style={{padding: '4px 4px 2px'}}>
                                <InlineConfirm text={'Delete this ' + fmtAmt(debt.amount, debt.currency) + ' debt with ' + debt.counterparty + '? Nothing is logged.'} keepLabel="Cancel" cta="Delete" onKeep={() => setPendingDelete(null)} onConfirm={() => handleDelete(debt.id)} />
                            </div>
                        )}
                    </div>
                )}
            </div>
        );
    };

    return (
        <div className={embedded ? undefined : 'sp-page'}>
            <div className="sp-debtpills">
                <button type="button" className={activeTab === 'owe' ? 'is-active' : ''} onClick={() => { setActiveTab('owe'); setOpenId(null); }}>To pay · {totalsLabel('owe')}</button>
                <button type="button" className={activeTab === 'owed' ? 'is-active' : ''} onClick={() => { setActiveTab('owed'); setOpenId(null); }}>To collect · {totalsLabel('owed')}</button>
            </div>
            {toast && <div className="sp-alert sp-alert-ok"><i className="fas fa-circle-check"></i><span>{toast}</span></div>}
            {Object.keys(syncConflicts).length > 0 && (
                <label className="sp-check" style={{margin: '0 4px 10px'}}>
                    <input type="checkbox" checked={filterSyncConflict} onChange={(e) => setFilterSyncConflict(e.target.checked)} />
                    <i className="fas fa-code-compare" style={{color: '#4f46e5'}}></i>Sync conflicts only
                </label>
            )}
            {sortedActive.length === 0
                ? <div className="sp-empty"><i className={activeTab === 'owe' ? 'fas fa-hand-holding-dollar' : 'fas fa-money-bill-wave'}></i>{activeTab === 'owe' ? 'Nothing to pay.' : 'Nothing to collect.'}</div>
                : sortedActive.map(d => renderRow(d, false))}
            {settledDebts.length > 0 && (
                <React.Fragment>
                    <button type="button" className="sp-showsettled" onClick={() => setShowSettled(v => !v)}>
                        {showSettled ? 'Hide' : 'Show'} settled ({settledDebts.length})<i className={'fas fa-chevron-' + (showSettled ? 'up' : 'down')}></i>
                    </button>
                    {showSettled && settledDebts.map(d => renderRow(d, true))}
                </React.Fragment>
            )}
            {!formDebt && !settleDebt && <PinnedCta label="Add Debt" icon="fas fa-plus" onClick={() => setFormDebt('new')} aboveDock />}
            {formDebt && <DebtFormSheet debt={formDebt === 'new' ? null : formDebt} direction={activeTab} defaultCurrency={defaultCurrency} activeView={activeView} onClose={() => setFormDebt(null)} onSaved={(msg, dir) => { setFormDebt(null); setActiveTab(dir); afterChange(msg); }} />}
            {settleDebt && <DebtSettleSheet debt={settleDebt} categories={categories} activeView={activeView} onClose={() => setSettleDebt(null)} onSettled={(msg) => { setSettleDebt(null); setOpenId(null); afterChange(msg); }} />}
        </div>
    );
}

function ManageScreen({ categories, defaultCurrency, onUpdate, activeView, initialTab }) {
    const [activeTab, setActiveTab] = useState(() => ['bills', 'recurring', 'debts'].includes(initialTab) ? initialTab : (FilterMemory.load('scheduled').tab || 'bills'));
    const [, setTick] = useState(0);
    useEffect(() => { FilterMemory.save('scheduled', { tab: activeTab }); }, [activeTab]);
    // Tabs report changes here too so the tiles above them refresh straight away.
    const changed = () => { setTick(t => t + 1); if (onUpdate) onUpdate(); };

    const cur = defaultCurrency || 'GBP';
    const toDefault = (amount, currency) => (!currency || currency === cur) ? amount : CurrencyService.convertToDefaultSync(amount, currency, cur);
    const today = DateUtils.today();
    const activeBills = DataService.getBills().filter(b => b.isActive && spBillVisible(b, activeView));
    const billsMonthly = activeBills.reduce((s, b) => s + toDefault(b.amount, b.currency) * (SP_BILL_FREQ_MONTHLY[b.frequency] || 1), 0);
    const activeSchedules = DataService.getRecurring().filter(s => s.isActive && !spScheduleEnded(s, today) && spScheduleVisible(s, activeView));
    const recurringMonthly = activeSchedules.reduce((s, r) => { const t = r.templateExpense || {}; return s + toDefault(t.amount || 0, t.currency) * (SP_SCHED_FREQ_MONTHLY[r.frequency] || 1); }, 0);
    const fmt0 = (v) => ValidationUtils.getCurrencySymbol(cur) + Math.round(v).toLocaleString(cur === 'INR' ? 'en-IN' : 'en-GB');

    return (
        <div className="sp-page sp-sched">
            <div className="sp-page-kicker">Repeating money events</div>
            <h2 className="sp-page-title" style={{marginBottom: '12px'}}>Scheduled</h2>
            <div className="sp-stattiles">
                <div className="sp-stattile">
                    <div className="sp-stattile-head"><span style={{background: '#fee2e2', color: '#e11d48'}}><i className="fas fa-file-invoice"></i></span>BILLS / MO</div>
                    <div className="sp-stattile-value">{fmt0(billsMonthly)}</div>
                    <div className="sp-stattile-sub">{activeBills.length} active bill{activeBills.length === 1 ? '' : 's'}</div>
                </div>
                <div className="sp-stattile">
                    <div className="sp-stattile-head"><span style={{background: '#ede9fe', color: '#7c3aed'}}><i className="fas fa-rotate"></i></span>RECURRING / MO</div>
                    <div className="sp-stattile-value">{fmt0(recurringMonthly)}</div>
                    <div className="sp-stattile-sub">{activeSchedules.length} active</div>
                </div>
            </div>
            <div className="sp-seg" style={{margin: '0 0 12px'}}>
                {[['bills', 'Bills'], ['recurring', 'Recurring'], ['debts', 'Debts']].map(([k, l]) => (
                    <button key={k} type="button" className={activeTab === k ? 'is-active' : ''} onClick={() => setActiveTab(k)}>{l}</button>
                ))}
            </div>
            {activeTab === 'bills' && <BillTracker categories={categories} onUpdate={changed} activeView={activeView} embedded />}
            {activeTab === 'recurring' && <RecurringList onUpdate={changed} activeView={activeView} embedded />}
            {activeTab === 'debts' && <DebtTracker defaultCurrency={defaultCurrency} categories={categories} onUpdate={changed} activeView={activeView} embedded />}
        </div>
    );
}

// Shows a native OS notification per alert, opt-in only. `tag` is set to the
// alert's own dedup key so re-showing a still-active alert replaces the
// previous notification instead of stacking a new one.
// ── Redesign: app shell components (Phase 0) ─────────────────────────────────
// Presentation only — every action here calls an existing App/DataService handler.
// Design palette (pColor): [tint, ink] per person.
const SP_PERSON_COLORS = [['#dbeafe', '#1d4ed8'], ['#fae8ff', '#a21caf'], ['#ffedd5', '#c2410c'], ['#ccfbf1', '#0f766e'], ['#fce7f3', '#be185d'], ['#e0e7ff', '#4338ca']];
// Stable colour per person: 'own' is always green; others by their order in the people list;
// anyone not in the list is slate.
function spPersonColor(key, people) {
    if (!key || key === 'own') return ['#dcfce7', '#15803d'];
    const names = (people || []).filter(p => !p.systemManaged).map(p => p.name);
    const i = names.indexOf(key);
    return i < 0 ? ['#f1f5f9', '#475569'] : SP_PERSON_COLORS[i % SP_PERSON_COLORS.length];
}

function Sheet({ onClose, title, sub, danger, showClose, children, footer }) {
    useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', onKey);
        return () => document.removeEventListener('keydown', onKey);
    }, [onClose]);
    return (
        <div className={'sp-scrim' + (danger ? ' is-danger' : '')} onClick={onClose}>
            <div className="sp-sheet" role="dialog" aria-modal="true" onClick={e => e.stopPropagation()}>
                <div className="sp-sheet-grab"></div>
                {(title || showClose) && (
                    <div className="sp-sheet-head">
                        {title && <div className="sp-sheet-title">{title}</div>}
                        {showClose && <button type="button" className="sp-sheet-close" onClick={onClose} title="Close"><i className="fas fa-xmark"></i></button>}
                    </div>
                )}
                {sub && <div className="sp-sheet-sub">{sub}</div>}
                {children}
                {footer && <div className="sp-sheet-foot">{footer}</div>}
            </div>
        </div>
    );
}

function SpSwitch({ on, onToggle, label }) {
    return <button type="button" className={'sp-switch' + (on ? ' is-on' : '')} onClick={onToggle} role="switch" aria-checked={!!on} aria-label={label}><span></span></button>;
}

function InlineConfirm({ text, keepLabel = 'Keep', cta, onKeep, onConfirm, busy }) {
    return (
        <div className="sp-confirm">
            <div className="sp-confirm-text"><i className="fas fa-triangle-exclamation" style={{marginTop: '2px'}}></i><div>{text}</div></div>
