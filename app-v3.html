// Draws a bar that grows upward from a baseline with rounded top corners and a
// square bottom edge (per the app's chart mark spec — data-end rounded, baseline square).
function verticalBarPath(x, yTop, w, h, r) {
    if (h <= 0) return '';
    const radius = Math.min(r, w / 2, h);
    return `M ${x} ${yTop + h} L ${x} ${yTop + radius} Q ${x} ${yTop} ${x + radius} ${yTop} L ${x + w - radius} ${yTop} Q ${x + w} ${yTop} ${x + w} ${yTop + radius} L ${x + w} ${yTop + h} Z`;
}
const formatCompactAmount = (value, defaultCurrency) => {
    const symbol = ValidationUtils.getCurrencySymbol(defaultCurrency);
    return symbol + new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 1 }).format(value);
};

// Grouped vertical bar chart: income vs expense across a series of periods (days,
// a single month, or a run of months — the caller decides the bucketing and just
// passes {label, income, expense} entries). Colors match the existing summary
// cards above it (success green / danger red) so the same income/expense color
// mapping is used everywhere on this screen. No Y-axis: every bar carries its own
// value label instead, so the scale never needs a separate reference line/legend.
function IncomeExpenseTrendChart({ months, defaultCurrency, seriesFilter = 'both' }) {
    const [hovered, setHovered] = useState(null); // { i, series } | null
    const INCOME_COLOR = '#10b981', EXPENSE_COLOR = '#ef4444';
    const showIncome = seriesFilter !== 'expense';
    const showExpense = seriesFilter !== 'income';
    const width = 340, height = 190;
    const padding = { top: 20, right: 10, bottom: 22, left: 6 };
    const plotWidth = width - padding.left - padding.right;
    const plotHeight = height - padding.top - padding.bottom;
    const visibleValues = months.flatMap(m => [showIncome ? m.income : null, showExpense ? m.expense : null]).filter(v => v !== null);
    const rawMax = Math.max(1, ...visibleValues);
    const groupWidth = plotWidth / months.length;
    const singleSeries = !(showIncome && showExpense);
    const barWidth = singleSeries ? Math.min(28, groupWidth - 10) : Math.min(20, groupWidth / 2 - 6);
    const barGap = 3;
    const yFor = (v) => padding.top + plotHeight - (v / rawMax) * plotHeight;
    // Past ~6 months the bars get too narrow for their value labels, which start
    // overlapping neighbors. Drop the always-on labels there and rely on the existing
    // hover/tap tooltip (below) instead, rather than adding a horizontal-scroll chart.
    const showLabels = months.length <= 6;

    return (
        <div style={{ position: 'relative' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '1rem', marginBottom: '0.5rem', fontSize: '0.8rem' }}>
                {showIncome && <span style={{ display: 'flex', alignItems: 'center', gap: '0.35rem' }}><span style={{ width: 10, height: 10, borderRadius: 2, background: INCOME_COLOR, display: 'inline-block' }}></span>Income</span>}
                {showExpense && <span style={{ display: 'flex', alignItems: 'center', gap: '0.35rem' }}><span style={{ width: 10, height: 10, borderRadius: 2, background: EXPENSE_COLOR, display: 'inline-block' }}></span>Expense</span>}
            </div>
            <svg viewBox={`0 0 ${width} ${height}`} style={{ width: '100%', height: 'auto', display: 'block', overflow: 'visible' }}>
                {months.map((m, i) => {
                    const groupX = padding.left + i * groupWidth;
                    const incomeX = singleSeries ? groupX + groupWidth / 2 - barWidth / 2 : groupX + groupWidth / 2 - barWidth - barGap / 2;
                    const expenseX = singleSeries ? groupX + groupWidth / 2 - barWidth / 2 : groupX + groupWidth / 2 + barGap / 2;
                    const incomeHovered = hovered && hovered.i === i && hovered.series === 'income';
                    const expenseHovered = hovered && hovered.i === i && hovered.series === 'expense';
                    return (
                        <g key={i}>
                            {showIncome && (
                                <>
                                    <path d={verticalBarPath(incomeX, yFor(m.income), barWidth, plotHeight - (yFor(m.income) - padding.top), 4)}
                                        fill={INCOME_COLOR} opacity={incomeHovered ? 1 : 0.9} style={{ cursor: 'pointer' }} tabIndex={0}
                                        onMouseEnter={() => setHovered({ i, series: 'income' })} onMouseLeave={() => setHovered(null)}
                                        onFocus={() => setHovered({ i, series: 'income' })} onBlur={() => setHovered(null)} />
                                    {showLabels && <text x={incomeX + barWidth / 2} y={yFor(m.income) - 4} textAnchor="middle" fontSize="7.5" fill="#1f2937" fontWeight="600">{formatCompactAmount(m.income, defaultCurrency)}</text>}
                                </>
                            )}
                            {showExpense && (
                                <>
                                    <path d={verticalBarPath(expenseX, yFor(m.expense), barWidth, plotHeight - (yFor(m.expense) - padding.top), 4)}
                                        fill={EXPENSE_COLOR} opacity={expenseHovered ? 1 : 0.9} style={{ cursor: 'pointer' }} tabIndex={0}
                                        onMouseEnter={() => setHovered({ i, series: 'expense' })} onMouseLeave={() => setHovered(null)}
                                        onFocus={() => setHovered({ i, series: 'expense' })} onBlur={() => setHovered(null)} />
                                    {showLabels && <text x={expenseX + barWidth / 2} y={yFor(m.expense) - 4} textAnchor="middle" fontSize="7.5" fill="#1f2937" fontWeight="600">{formatCompactAmount(m.expense, defaultCurrency)}</text>}
                                </>
                            )}
                            <text x={groupX + groupWidth / 2} y={height - padding.bottom + 13} textAnchor="middle" fontSize="9" fill="#6b7280">{m.label}</text>
                        </g>
                    );
                })}
            </svg>
            {hovered && (() => {
                const m = months[hovered.i];
                const val = hovered.series === 'income' ? m.income : m.expense;
                const groupX = padding.left + hovered.i * groupWidth;
                const leftPct = ((groupX + groupWidth / 2) / width) * 100;
                const topPct = (yFor(val) / height) * 100;
                return (
                    <div style={{ position: 'absolute', left: leftPct + '%', top: topPct + '%', transform: 'translate(-50%, -110%)', background: '#1f2937', color: '#fff', padding: '0.3rem 0.55rem', borderRadius: '6px', fontSize: '0.72rem', pointerEvents: 'none', whiteSpace: 'nowrap', zIndex: 5 }}>
                        <strong>{ValidationUtils.formatCurrency(val, defaultCurrency)}</strong> · {hovered.series === 'income' ? 'Income' : 'Expense'} · {m.label}
                    </div>
                );
            })()}
        </div>
    );
}


const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

// Summary (home) helpers. Month keys are 'YYYY-MM' strings, compared as text.
const spPerfColor = (pct) => pct > 110 ? '#e11d48' : pct > 100 ? '#f59e0b' : '#10b981';
const SP_PERF_INK = { '#10b981': '#047857', '#f59e0b': '#b45309', '#e11d48': '#be123c' };
const spMonthKey = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
const spShiftMonth = (k, n) => spMonthKey(new Date(+k.slice(0, 4), +k.slice(5, 7) - 1 + n, 1));
const spMonthLabel = (k, opts) => new Date(+k.slice(0, 4), +k.slice(5, 7) - 1, 1).toLocaleDateString('en-GB', opts).replace(/\bSept\b/, 'Sep');
const spMonthDiff = (a, b) => (+b.slice(0, 4) - +a.slice(0, 4)) * 12 + (+b.slice(5, 7) - +a.slice(5, 7)) + 1;
const spMonthRange = (fromK, toK) => {
    const out = [];
    for (let k = fromK; k && k <= toK && out.length < 600; k = spShiftMonth(k, 1)) out.push(k);
    return out;
};

function SummaryRangeSheet({ from, to, onApply, onClose }) {
    const nowK = spMonthKey(new Date());
    const nowY = new Date().getFullYear();
    const [d, setD] = useState(() => {
        const f = from || spShiftMonth(nowK, -2);
        return { from: f, to: to || nowK, target: 'from', year: +f.slice(0, 4) };
    });
    const upd = (p) => setD(prev => ({ ...prev, ...p }));
    const pick = (k) => {
        if (d.target === 'from') upd({ from: k, to: d.to < k ? k : d.to, target: 'to' });
        else if (k < d.from) upd({ from: k, target: 'to' });
        else upd({ to: k });
    };
    const n = spMonthDiff(d.from, d.to);
    return (
        <Sheet onClose={onClose} title="Custom range" sub="Pick a start and end month.">
            <div className="sp-rangepresets">
                {[3, 6, 12].map(p => {
                    const fk = spShiftMonth(nowK, -(p - 1));
                    return <button key={p} type="button" className={d.from === fk && d.to === nowK ? 'is-active' : ''} onClick={() => upd({ from: fk, to: nowK, target: 'to', year: nowY })}>Last {p} mo</button>;
                })}
            </div>
            <div className="sp-rangeends">
                {[['from', 'FROM', d.from], ['to', 'TO', d.to]].map(([k, kicker, v]) => (
                    <button key={k} type="button" className={d.target === k ? 'is-active' : ''} onClick={() => upd({ target: k, year: +v.slice(0, 4) })}>
                        <span>{kicker}</span>{spMonthLabel(v, { month: 'short', year: 'numeric' })}
                    </button>
                ))}
            </div>
            <div className="sp-rangecal">
                <div className="sp-rangecal-head">
                    <button type="button" onClick={() => upd({ year: d.year - 1 })} aria-label="Previous year"><i className="fas fa-chevron-left"></i></button>
                    <span>{d.year}</span>
                    <button type="button" disabled={d.year >= nowY} onClick={() => upd({ year: d.year + 1 })} aria-label="Next year"><i className="fas fa-chevron-right"></i></button>
                </div>
                <div className="sp-rangecal-grid">
                    {Array.from({ length: 12 }, (_, i) => {
                        const k = d.year + '-' + String(i + 1).padStart(2, '0');
                        const cls = k === d.from || k === d.to ? 'is-edge' : k > d.from && k < d.to ? 'is-inside' : '';
                        return <button key={k} type="button" disabled={k > nowK} className={cls} onClick={() => pick(k)}>{spMonthLabel(k, { month: 'short' })}</button>;
                    })}
                </div>
            </div>
            <div className="sp-rangesum">{n} month{n === 1 ? '' : 's'} selected · tap {d.target === 'from' ? 'a start' : 'an end'} month</div>
            <button type="button" className="sp-btn sp-btn-primary" style={{marginTop: '10px'}} onClick={() => onApply(d.from, d.to)}>Apply range</button>
        </Sheet>
    );
}

function Summary({ expenses, income, categories, defaultCurrency, activeView, onUpdate, currentUser, notifications = [], onNavigate }) {
    const _f0 = FilterMemory.load('summary'); // restore last session's filters (see FilterMemory)
    // Filters saved by the previous Summary screen (timeRange etc.) map onto the new periods.
    const _init = (() => {
        const nowK = spMonthKey(new Date());
        if (['month', 'last', 'year', 'custom'].includes(_f0.period)) return { period: _f0.period, from: _f0.from || '', to: _f0.to || '' };
        const legacyMonths = { threeMonths: 3, sixMonths: 6 }[_f0.timeRange];
        if (legacyMonths) return { period: 'custom', from: spShiftMonth(nowK, -(legacyMonths - 1)), to: nowK };
        if (_f0.timeRange === 'custom' && _f0.customFromYear != null && _f0.customToYear != null) {
            const a = spMonthKey(new Date(_f0.customFromYear, _f0.customFromMonth, 1)), b = spMonthKey(new Date(_f0.customToYear, _f0.customToMonth, 1));
            return { period: 'custom', from: a <= b ? a : b, to: a <= b ? b : a };
        }
        return { period: _f0.timeRange === 'year' ? 'year' : 'month', from: '', to: '' };
    })();
    const [period, setPeriod] = useState(_init.period === 'custom' && !(_init.from && _init.to) ? 'month' : _init.period);
    const [rangeFrom, setRangeFrom] = useState(_init.from);
    const [rangeTo, setRangeTo] = useState(_init.to);
    const [sumCats, setSumCats] = useState(() => Array.isArray(_f0.cats) ? _f0.cats : _f0.category ? [parseInt(_f0.category)] : []);
    const [chartSeriesFilter, setChartSeriesFilter] = useState(_f0.chartSeries || 'both'); // 'both' | 'income' | 'expense'
    const [showRangeSheet, setShowRangeSheet] = useState(false);
    const [showCatSheet, setShowCatSheet] = useState(false);
    const [openBuckets, setOpenBuckets] = useState({});
    const [openCats, setOpenCats] = useState({});
    const [convertedExpenses, setConvertedExpenses] = useState([]);
    const [convertedIncome, setConvertedIncome] = useState([]);
    const [monthBudgets, setMonthBudgets] = useState({}); // { 'YYYY-MM': { [categoryId]: { amount, subs: { [name]: amount } } } }
    // Drop categories that no longer exist (deleted elsewhere) from the filter.
    const validCats = sumCats.filter(id => categories.some(c => c.id === id));

    // Persist filters for the session (see FilterMemory) so navigating away keeps them.
    useEffect(() => {
        FilterMemory.save('summary', { period, from: rangeFrom, to: rangeTo, cats: sumCats, chartSeries: chartSeriesFilter });
    }, [period, rangeFrom, rangeTo, sumCats, chartSeriesFilter]);

    const convertAmountSync = (amount, fromCurrency, toCurrency) => {
        if (!fromCurrency || !toCurrency || fromCurrency === toCurrency) return amount;
        return Math.round(CurrencyService.convertToDefaultSync(amount, fromCurrency, toCurrency) * 100) / 100;
    };

    useEffect(() => {
        const convertAll = async () => {
            const newExpenses = await Promise.all(expenses.map(async (exp) => {
                const expCurrency = exp.currency || 'GBP';
                if (expCurrency === defaultCurrency) return exp;
                try {
                    const converted = await CurrencyService.convertCurrency(exp.amount, expCurrency, defaultCurrency);
                    return { ...exp, amount: converted, currency: defaultCurrency, originalDisplayAmount: exp.amount, originalDisplayCurrency: expCurrency };
                } catch (e) {
                    return { ...exp, amount: convertAmountSync(exp.amount, expCurrency, defaultCurrency), currency: defaultCurrency };
                }
            }));
            const newIncome = await Promise.all(income.map(async (inc) => {
                const incCurrency = inc.currency || 'GBP';
                if (incCurrency === defaultCurrency) return inc;
                try {
                    const converted = await CurrencyService.convertCurrency(inc.amount, incCurrency, defaultCurrency);
                    return { ...inc, amount: converted, currency: defaultCurrency };
                } catch (e) {
                    return { ...inc, amount: convertAmountSync(inc.amount, incCurrency, defaultCurrency), currency: defaultCurrency };
                }
            }));
            setConvertedExpenses(newExpenses);
            setConvertedIncome(newIncome);
        };
        convertAll();
    }, [expenses, income, defaultCurrency]);

    // `now` picks which month's mid-month budget reset (budgetHistory) applies.
    const getEffectiveBudget = (category, now, person) => {
        const pb = (category.personBudgets && category.personBudgets[person]) || {};
        const currentMonthStart = new Date(now.getFullYear(), now.getMonth(), 1);
        const currentMonthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 0);
        if (pb.budgetHistory && pb.budgetHistory.length > 0) {
            const midMonthReset = pb.budgetHistory.find(h => {
                const endDate = DateUtils.parseDateStr(h.endDate);
                return endDate >= currentMonthStart && endDate <= currentMonthEnd;
            });
            if (midMonthReset) {
                return { amount: midMonthReset.amount, currency: midMonthReset.currency };
            }
        }
        if (pb.useSubcategoryBudgets && pb.subcategoryBudgets) {
            const total = Object.values(pb.subcategoryBudgets).reduce((sum, v) => sum + (v || 0), 0);
            const currency = pb.budgetCurrency || (pb.subcategoryBudgetCurrencies ? Object.values(pb.subcategoryBudgetCurrencies)[0] : null) || defaultCurrency;
            return { amount: total, currency: currency };
        }
        return { amount: pb.monthlyBudget || 0, currency: pb.budgetCurrency || defaultCurrency };
    };
    const getEffectiveSubcategoryBudget = (category, subcatName, now, person) => {
        const pb = (category.personBudgets && category.personBudgets[person]) || {};
        const currentMonthStart = new Date(now.getFullYear(), now.getMonth(), 1);
        const currentMonthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 0);
        if (pb.subcategoryBudgetHistory && pb.subcategoryBudgetHistory[subcatName]) {
            const midMonthReset = pb.subcategoryBudgetHistory[subcatName].find(h => {
                const endDate = DateUtils.parseDateStr(h.endDate);
                return endDate >= currentMonthStart && endDate <= currentMonthEnd;
            });
            if (midMonthReset) {
                return { amount: midMonthReset.amount, currency: midMonthReset.currency };
            }
        }
        const amount = (pb.subcategoryBudgets && pb.subcategoryBudgets[subcatName]) || 0;
        const currency = (pb.subcategoryBudgetCurrencies && pb.subcategoryBudgetCurrencies[subcatName]) || defaultCurrency;
        return { amount, currency };
    };
    const convertBudgetAmount = async (amount, fromCurrency) => {
        if (!fromCurrency || fromCurrency === defaultCurrency || amount <= 0) return amount;
        try { return await CurrencyService.convertCurrency(amount, fromCurrency, defaultCurrency); }
        catch (e) { return convertAmountSync(amount, fromCurrency, defaultCurrency); }
    };

    const today = DateUtils.today();
    const curKey = today.slice(0, 7);
    const monthKeys = period === 'month' ? [curKey]
        : period === 'last' ? [spShiftMonth(curKey, -1)]
        : period === 'year' ? spMonthRange(curKey.slice(0, 4) + '-01', curKey)
        : spMonthRange(rangeFrom, rangeTo);
    const monthKeysSig = monthKeys.join(',');

    // Budgets per month in the period, pooled across every active person (the same rules the
    // old Monthly Budget Overview used for the current month). Sub-category budgets only come
    // from people who budget this category by sub-category. The current month is always included
    // for the Needs attention amounts.
    useEffect(() => {
        let cancelled = false;
        (async () => {
            const out = {};
            for (const key of monthKeys.includes(curKey) ? monthKeys : [...monthKeys, curKey]) {
                const at = new Date(+key.slice(0, 4), +key.slice(5, 7) - 1, 15);
                const byCat = {};
                for (const category of categories) {
                    let amount = 0;
                    for (const person of activeView) {
                        const eff = getEffectiveBudget(category, at, person);
                        amount += await convertBudgetAmount(eff.amount, eff.currency);
                    }
                    const subs = {};
                    const subPeople = activeView.filter(p => category.personBudgets && category.personBudgets[p] && category.personBudgets[p].useSubcategoryBudgets);
                    for (const sub of (subPeople.length ? (category.subcategories || []) : [])) {
                        let subAmount = 0;
                        for (const person of subPeople) {
                            const eff = getEffectiveSubcategoryBudget(category, sub, at, person);
                            subAmount += await convertBudgetAmount(eff.amount, eff.currency);
                        }
                        subs[sub] = subAmount;
                    }
                    byCat[category.id] = { amount, subs };
                }
                out[key] = byCat;
            }
            if (!cancelled) setMonthBudgets(out);
        })();
        return () => { cancelled = true; };
    }, [monthKeysSig, categories, activeView, defaultCurrency]);

    const sym = ValidationUtils.getCurrencySymbol(defaultCurrency);
    const numLocale = defaultCurrency === 'INR' ? 'en-IN' : 'en-GB';
    const fmt0 = (v) => (v < 0 ? '−' : '') + sym + Math.round(Math.abs(v)).toLocaleString(numLocale);
    const kLabel = (v) => v <= 0 ? '' : v >= 1000 ? sym + (v / 1000).toFixed(v >= 10000 ? 0 : 1) + 'k' : sym + Math.round(v);

    // Whole months, including records dated later this month — the same basis as the budget
    // alerts in Needs attention and the old Monthly Budget Overview.
    const keySet = new Set(monthKeys);
    const inPeriod = (d) => !!d && keySet.has(d.slice(0, 7));
    const catOk = (e) => !validCats.length || validCats.includes(e.categoryId);
    const pExp = convertedExpenses.filter(e => inPeriod(e.date) && catOk(e));
    const pInc = convertedIncome.filter(i => inPeriod(i.date));
    const totalExpenses = pExp.reduce((s, e) => s + e.amount, 0);
    const totalIncome = pInc.reduce((s, i) => s + i.amount, 0);
    const net = totalIncome - totalExpenses;

    // "vs" pill: This month → same days of last month; Last month → the month before;
    // Year → last year to the same date; Custom → the same number of months just before.
    const prevOk = (() => {
        if (period === 'month') { const k = spShiftMonth(curKey, -1), dd = today.slice(8, 10); return (d) => d.slice(0, 7) === k && d.slice(8, 10) <= dd; }
        if (period === 'last') { const k = spShiftMonth(curKey, -2); return (d) => d.slice(0, 7) === k; }
        if (period === 'custom') { const n = monthKeys.length, a = spShiftMonth(rangeFrom, -n), b = spShiftMonth(rangeFrom, -1); return (d) => d.slice(0, 7) >= a && d.slice(0, 7) <= b; }
        const y = String(+today.slice(0, 4) - 1), md = today.slice(5); return (d) => d.slice(0, 4) === y && d.slice(5) <= md;
    })();
    const prevExp = convertedExpenses.filter(e => e.date && prevOk(e.date) && catOk(e)).reduce((s, e) => s + e.amount, 0);
    // Periods that run to today compare only what's dated up to today on both sides.
    const cmpExp = period === 'last' ? totalExpenses : pExp.filter(e => e.date <= today).reduce((s, e) => s + e.amount, 0);
    const vsPct = prevExp > 0 ? Math.round(((cmpExp - prevExp) / prevExp) * 100) : null;
    const vsWord = { month: 'vs last month', last: 'vs month before', year: 'vs last year', custom: 'vs prior period' }[period];

    const periodStart = DateUtils.parseDateStr(monthKeys[0] + '-01');
    const lastKey = monthKeys[monthKeys.length - 1];
    const periodEndStr = lastKey === curKey ? today : DateUtils.addToDateStr(spShiftMonth(lastKey, 1) + '-01', { days: -1 });
    const periodDays = Math.max(1, Math.round((DateUtils.parseDateStr(periodEndStr) - periodStart) / 86400000) + 1);

    const catsList = validCats.length ? categories.filter(c => validCats.includes(c.id)) : categories;
    const budgetOf = (keys, cat) => keys.reduce((s, k) => s + ((monthBudgets[k] && monthBudgets[k][cat.id] && monthBudgets[k][cat.id].amount) || 0), 0);
    const subBudgetOf = (keys, cat, sub) => keys.reduce((s, k) => s + ((monthBudgets[k] && monthBudgets[k][cat.id] && monthBudgets[k][cat.id].subs[sub]) || 0), 0);
    const budgetFor = (keys) => catsList.reduce((s, c) => s + budgetOf(keys, c), 0);
    const periodBudget = budgetFor(monthKeys);

    const catLocked = validCats.length > 0;
    const effSeries = catLocked ? 'expense' : chartSeriesFilter;
    const showIncome = effSeries !== 'expense', showExpense = effSeries !== 'income';
    const incBy = {}, expBy = {};
    pInc.forEach(i => { const k = i.date.slice(0, 7); incBy[k] = (incBy[k] || 0) + i.amount; });
    pExp.forEach(e => { const k = e.date.slice(0, 7); expBy[k] = (expBy[k] || 0) + e.amount; });
    const sumK = (map, ks) => ks.reduce((t, k) => t + (map[k] || 0), 0);
    const mShort = (k) => spMonthLabel(k, { month: 'short' }).slice(0, 3);

    // More than 12 months folds into one bar per year.
    const byYear = monthKeys.length > 12;
    let buckets;
    if (byYear) {
        const g = {};
        monthKeys.forEach(k => { (g[k.slice(0, 4)] = g[k.slice(0, 4)] || []).push(k); });
        buckets = Object.keys(g).sort().map(y => {
            const ks = g[y];
            const sub = ks.length === 12 ? '(Jan–Dec)' : ks.length === 1 ? '(' + mShort(ks[0]) + ')' : '(' + mShort(ks[0]) + '–' + mShort(ks[ks.length - 1]) + ')';
            return { label: y, sub, keys: ks };
        });
    } else {
        buckets = monthKeys.map(k => ({ label: mShort(k), sub: '', keys: [k] }));
    }
    const nB = buckets.length;
    const customLabel = !rangeFrom ? 'Custom' : rangeFrom === rangeTo ? spMonthLabel(rangeFrom, { month: 'short', year: 'numeric' })
        : rangeFrom.slice(0, 4) === rangeTo.slice(0, 4) ? spMonthLabel(rangeFrom, { month: 'short' }) + ' – ' + spMonthLabel(rangeTo, { month: 'short', year: 'numeric' })
        : spMonthLabel(rangeFrom, { month: 'short', year: 'numeric' }) + ' – ' + spMonthLabel(rangeTo, { month: 'short', year: 'numeric' });
    const periodName = { month: 'This month', last: 'Last month', year: 'Jan – ' + mShort(curKey) + ' ' + curKey.slice(0, 4) }[period] || customLabel;
    const chartRangeLabel = periodName + (byYear ? ' · by year' : '') + (catLocked ? ' · ' + validCats.length + ' categor' + (validCats.length === 1 ? 'y' : 'ies') : '');
    const maxIE = Math.max(1, ...buckets.map(bk => Math.max(showIncome ? sumK(incBy, bk.keys) : 0, showExpense ? sumK(expBy, bk.keys) : 0)));
    const both = showIncome && showExpense;
    const dense = nB > 6;
    const vertLabels = dense || (both && nB > 4);
    const barW = nB <= 2 ? (both ? 34 : 52) : nB <= 4 ? (both ? 20 : 34) : dense ? (both ? 7 : 14) : (both ? 11 : 18);

    const buildTree = (keys, bid) => catsList.map((c) => {
        const look = spCategoryLook(c, categories.indexOf(c));
        const catExp = pExp.filter(e => e.categoryId === c.id && keys.includes(e.date.slice(0, 7)));
        const spent = catExp.reduce((s, e) => s + e.amount, 0);
        const budget = budgetOf(keys, c);
        const pct = budget > 0 ? (spent / budget) * 100 : 0;
        const subs = (c.subcategories || []).map(sub => {
            const sp = catExp.filter(e => e.subcategory === sub).reduce((s, e) => s + e.amount, 0);
            const sb = subBudgetOf(keys, c, sub);
            return { name: sub, spent: sp, budget: sb, pct: sb > 0 ? (sp / sb) * 100 : 0 };
        });
        return { cat: c, look, spent, budget, pct, color: budget > 0 ? spPerfColor(pct) : '#94a3b8', subs, ck: bid + ':' + c.id };
    }).filter(t => t.spent > 0 || t.budget > 0);

    const periodCards = [...buckets].reverse().map((bk, idx) => {
        const bid = bk.keys[0] + '_' + bk.keys[bk.keys.length - 1];
        const inc = sumK(incBy, bk.keys), ex = sumK(expBy, bk.keys), bNet = inc - ex;
        const bud = budgetFor(bk.keys);
        const pct = bud > 0 ? (ex / bud) * 100 : 0;
        const outColor = bud > 0 ? spPerfColor(pct) : '#94a3b8';
        const isOpen = openBuckets[bid] === undefined ? idx === 0 : openBuckets[bid];
        const title = byYear ? bk.label : spMonthLabel(bk.keys[0], { month: 'long', year: 'numeric' });
        return { bid, bk, inc, ex, bNet, bud, pct, outColor, isOpen, title };
    });
    const periodListTitle = byYear ? 'Year by year' : nB === 1 ? 'This period' : 'Month by month';

    // Same alerts the old notifications bell listed (budget thresholds + bill reminders).
    // Chip amounts use this screen's converted figures for the current month (the alert only says which category).
    const billsById = new Map(DataService.getBills().map(b => [String(b.id), b]));
    const alertAmount = (key) => {
        const cat = categories.find(c => 'budget:' + c.id === key);
        const budget = cat && monthBudgets[curKey] && monthBudgets[curKey][cat.id] ? monthBudgets[curKey][cat.id].amount : 0;
        if (!budget) return null;
        const spent = convertedExpenses.filter(e => e.categoryId === cat.id && e.date && e.date.slice(0, 7) === curKey).reduce((s, e) => s + e.amount, 0);
        return { spent, budget, pct: (spent / budget) * 100 };
    };
    const attentionItems = notifications.map(n => {
        const amt = n.type !== 'bill' ? alertAmount(n.key) : null;
        const bill = n.type === 'bill';
        const over = n.type === 'budget-over';
        const b = bill ? billsById.get(String(n.key).slice(5)) : null;
        const due = b ? Math.round((DateUtils.parseDateStr(b.nextDueDate) - DateUtils.parseDateStr(today)) / 86400000) : null;
        return {
            key: n.key || n.id, screen: n.screen,
            title: b ? b.name + ' ' + ValidationUtils.getCurrencySymbol(b.currency || defaultCurrency) + Math.round(b.amount).toLocaleString(numLocale)
                : (n.title || '').replace(/: (over budget|approaching budget|due soon)$/, ''),
            sub: b ? (due < 0 ? 'Overdue' : due === 0 ? 'Due today' : due === 1 ? 'Due tomorrow' : 'Due in ' + due + ' days')
                : amt ? (amt.spent > amt.budget ? fmt0(amt.spent - amt.budget) + ' over budget' : fmt0(amt.budget - amt.spent) + ' left · ' + Math.round(amt.pct) + '% used')
                : over ? 'Over budget · ' + n.message : n.message,
            icon: bill ? 'fas fa-bell' : 'fas fa-triangle-exclamation',
            tone: over ? 'is-over' : 'is-warn'
        };
    });

    const hour = new Date().getHours();
    const greeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
    const firstName = ((currentUser && currentUser.displayName) || '').trim().split(' ')[0];
    const pageTitle = { month: 'Your Month', last: 'Last Month', year: 'Your Year', custom: 'Your Range' }[period];
    const toggleCat = (id) => setSumCats(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
    const hasData = pExp.length > 0 || pInc.length > 0;

    return (
        <div className="sp-page">
            <div className="sp-page-kicker">{greeting}{firstName ? ', ' + firstName : ''}</div>
            <h2 className="sp-page-title" style={{marginBottom: '12px'}}>{pageTitle}</h2>

            <div className="sp-periodbar">
                <div className="sp-seg is-light sp-periodseg">
                    {[['month', 'This mo'], ['last', 'Last mo'], ['year', 'Year']].map(([k, l]) => (
                        <button key={k} type="button" className={period === k ? 'is-active' : ''} onClick={() => setPeriod(k)}>{l}</button>
                    ))}
                    <button type="button" className={period === 'custom' ? 'is-active' : ''} onClick={() => setShowRangeSheet(true)}>Custom</button>
                </div>
                <button type="button" className={'sp-sumcatbtn' + (catLocked ? ' is-active' : '')} onClick={() => setShowCatSheet(true)} title="Filter by category">
                    <i className="fas fa-tags"></i>
                    {catLocked && <span className="sp-filterbtn-count">{validCats.length}</span>}
                </button>
            </div>
            {period === 'custom' && (
                <button type="button" className="sp-rangechip" onClick={() => setShowRangeSheet(true)}>
                    <i className="fas fa-calendar"></i>
                    <span className="sp-rangechip-label">{customLabel}</span>
                    <span className="sp-rangechip-count">{monthKeys.length} month{monthKeys.length === 1 ? '' : 's'}</span>
                    <i className="fas fa-pen" style={{color: 'var(--sp-slate-400)', fontSize: '10px'}}></i>
                </button>
            )}
            {catLocked && (
                <div className="sp-activechips">
                    {catsList.map(c => <button key={c.id} type="button" className="sp-activechip" onClick={() => toggleCat(c.id)}>{c.name}<i className="fas fa-xmark" style={{fontSize: '10px'}}></i></button>)}
                    <button type="button" className="sp-clearlink" onClick={() => setSumCats([])}>Clear</button>
                </div>
            )}

            <div className="sp-hero sp-sumhero">
                <div className="sp-sumhero-top">
                    <div>
                        <div className="sp-hero-label">{net >= 0 ? 'Net surplus' : 'Net deficit'}</div>
                        <div className="sp-hero-value">{(net >= 0 ? '+' : '−') + fmt0(Math.abs(net))}</div>
                    </div>
                    <div className="sp-sumhero-io">
                        <div style={{color: '#34d399'}}>▲ {fmt0(totalIncome)} in</div>
                        <div style={{color: '#fb7185'}}>▼ {fmt0(totalExpenses)} out</div>
                    </div>
                </div>
                <div className="sp-hero-pills">
                    {vsPct !== null && (
                        <span className="sp-hero-pill" style={{background: vsPct > 0 ? '#e11d4826' : '#10b98122', color: vsPct > 0 ? '#fb7185' : '#34d399'}}>
                            {(vsPct > 0 ? '▲ ' : vsPct < 0 ? '▼ ' : '') + Math.abs(vsPct) + '% spend ' + vsWord}
                        </span>
                    )}
                    <span className="sp-hero-pill is-green">{totalIncome > 0 ? Math.round((net / totalIncome) * 100) + '%' : '0%'} saved</span>
                    <span className="sp-hero-pill">{fmt0(totalExpenses / periodDays)}/day avg</span>
                    <span className="sp-hero-pill">{periodBudget > 0 ? fmt0(totalExpenses) + ' of ' + fmt0(periodBudget) + ' budget' : 'No budget set'}</span>
                </div>
            </div>

            {attentionItems.length > 0 && (
                <React.Fragment>
                    <div className="sp-group-label" style={{padding: '0 4px 6px'}}>Needs attention</div>
                    <div className="sp-attn">
                        {attentionItems.map(a => (
                            <button key={a.key} type="button" className={'sp-attn-item ' + a.tone} onClick={() => a.screen && onNavigate && onNavigate(a.screen)}>
                                <span className="sp-attn-icon"><i className={a.icon}></i></span>
                                <span><span className="sp-attn-title">{a.title}</span><span className="sp-attn-sub">{a.sub}</span></span>
                            </button>
                        ))}
                    </div>
                </React.Fragment>
            )}

            <div className="sp-chartcard">
                <div className="sp-chartcard-head">
                    <div>
                        <div className="sp-chartcard-kicker">INCOME VS EXPENSE</div>
                        <div className="sp-chartcard-range">{chartRangeLabel}</div>
                    </div>
                    <div className="sp-miniseg">
                        {[['both', 'Both'], ['income', 'In'], ['expense', 'Out']].map(([k, l]) => (
                            <button key={k} type="button" disabled={catLocked && k !== 'expense'} className={effSeries === k ? 'is-active' : ''} onClick={() => setChartSeriesFilter(k)}>{l}</button>
                        ))}
                    </div>
                </div>
                <div className="sp-bars" style={{gap: nB > 8 ? '2px' : '6px'}}>
                    {buckets.map(bk => {
                        const inc = sumK(incBy, bk.keys), ex = sumK(expBy, bk.keys);
                        const bud = budgetFor(bk.keys);
                        const color = bud > 0 ? spPerfColor((ex / bud) * 100) : '#94a3b8';
                        const lblStyle = vertLabels ? { writingMode: 'vertical-rl', transform: 'rotate(180deg)' } : {};
                        return (
                            <div key={bk.label + bk.keys[0]} className="sp-bars-col" title={bk.label + (bk.sub ? ' ' + bk.sub : '') + ' · in ' + fmt0(inc) + ' · out ' + fmt0(ex)}>
                                <div className="sp-bars-pair" style={{gap: dense ? '1px' : '3px'}}>
                                    {showIncome && <div className="sp-bars-bar"><span style={{...lblStyle, color: 'var(--sp-slate-600)'}}>{kLabel(inc)}</span><div style={{width: barW + 'px', background: 'var(--sp-slate-300)', height: Math.max(3, (inc / maxIE) * 88) + 'px'}}></div></div>}
                                    {showExpense && <div className="sp-bars-bar"><span style={{...lblStyle, color: SP_PERF_INK[color] || 'var(--sp-slate-500)'}}>{kLabel(ex)}</span><div style={{width: barW + 'px', background: color, height: Math.max(3, (ex / maxIE) * 88) + 'px'}}></div></div>}
                                </div>
                                <span className="sp-bars-label" style={{fontSize: nB > 8 ? '9px' : '10px'}}>{bk.label}</span>
                                {bk.sub && <span className="sp-bars-sub">{bk.sub}</span>}
                            </div>
                        );
                    })}
                </div>
                <div className="sp-legend">
                    <span className="sp-legend-item"><span style={{background: 'var(--sp-slate-300)'}}></span>Income</span>
                    <span className="sp-legend-sep"></span>
                    <span className="sp-legend-kicker">Expense vs budget:</span>
                    <span className="sp-legend-item"><span style={{background: '#10b981'}}></span>Within</span>
                    <span className="sp-legend-item"><span style={{background: '#f59e0b'}}></span>≤10% over</span>
                    <span className="sp-legend-item"><span style={{background: '#e11d48'}}></span>&gt;10% over</span>
                </div>
                {catLocked && (
                    <div className="sp-chartnote">
                        <i className="fas fa-circle-info"></i>
                        <span>Showing expenses only · income has no categories</span>
                        <button type="button" onClick={() => setSumCats([])}>Clear filter</button>
                    </div>
                )}
            </div>

            {!hasData ? (
                <div className="sp-empty" style={{marginBottom: '14px'}}><i className="fas fa-chart-column"></i>No income or expenses in this period.</div>
            ) : (
                <React.Fragment>
                    <div className="sp-group-head" style={{padding: '0 4px 10px'}}>
                        <span className="sp-group-label">{periodListTitle}</span>
                        <span className="sp-group-total">tap for budget detail</span>
                    </div>
                    {periodCards.map(p => {
                        const tree = p.isOpen ? buildTree(p.bk.keys, p.bid) : [];
                        return (
                            <div key={p.bid} className="sp-pcard">
                                <button type="button" className="sp-pcard-head" onClick={() => setOpenBuckets(prev => ({ ...prev, [p.bid]: !p.isOpen }))} aria-expanded={p.isOpen}>
                                    <div className="sp-pcard-titlerow">
                                        <span className="sp-pcard-title">{p.title}</span>
                                        {byYear && <span className="sp-pcard-sub">{p.bk.sub}</span>}
                                        <i className={'fas fa-chevron-' + (p.isOpen ? 'up' : 'down')}></i>
                                    </div>
                                    <div className="sp-pcard-grid">
                                        <div><div className="sp-pcard-k">IN</div><div className="sp-pcard-v">{fmt0(p.inc)}</div></div>
                                        <div><div className="sp-pcard-k">OUT</div><div className="sp-pcard-v" style={{color: SP_PERF_INK[p.outColor] || 'var(--sp-slate-600)'}}>{fmt0(p.ex)}</div></div>
                                        <div>
                                            <div className="sp-pcard-k">NET SAVING</div>
                                            <div className="sp-pcard-v" style={{color: p.bNet >= 0 ? '#047857' : '#be123c'}}>{(p.bNet >= 0 ? '+' : '−') + fmt0(Math.abs(p.bNet))}</div>
                                            {p.inc > 0 && <div className="sp-pcard-rate" style={{color: p.bNet >= 0 ? '#047857' : '#be123c'}}>{Math.round((p.bNet / p.inc) * 100)}% saved</div>}
                                        </div>
                                    </div>
                                    <div className="sp-pcard-budget">
                                        <div className="sp-bar"><div style={{width: Math.min(p.pct, 100) + '%', background: p.outColor}}></div></div>
                                        <span>{p.bud > 0 ? Math.round(p.pct) + '% of ' + fmt0(p.bud) + ' budget' : 'No budget'}</span>
                                    </div>
                                </button>
                                {p.isOpen && (
                                    <div className="sp-tree">
                                        {tree.length === 0 && <div className="sp-tree-empty">No category spending or budgets in this period.</div>}
                                        {tree.map(t => {
                                            const catOpen = !!openCats[t.ck];
                                            return (
                                                <div key={t.ck} className="sp-tree-cat">
                                                    <button type="button" className="sp-tree-cathead" onClick={() => setOpenCats(prev => ({ ...prev, [t.ck]: !catOpen }))} aria-expanded={catOpen}>
                                                        <span className="sp-tree-icon" style={{background: t.look.tint, color: t.look.ink}}><i className={t.look.icon}></i></span>
                                                        <span className="sp-tree-main">
                                                            <span className="sp-tree-row"><span className="sp-tree-name">{t.cat.name}</span><span className="sp-tree-amt">{fmt0(t.spent)}{t.budget > 0 ? ' / ' + fmt0(t.budget) : ''}</span></span>
                                                            {t.budget > 0 && (
                                                                <span className="sp-tree-barrow">
                                                                    <span className="sp-bar"><span style={{width: Math.min(t.pct, 100) + '%', background: t.color}}></span></span>
                                                                    <span className="sp-tree-pct" style={{color: t.color}}>{Math.round(t.pct)}%</span>
                                                                </span>
                                                            )}
                                                            <span className="sp-tree-left" style={{color: t.color}}>{t.budget <= 0 ? 'No budget set' : t.spent <= t.budget ? fmt0(t.budget - t.spent) + ' left' : fmt0(t.spent - t.budget) + ' over budget'}</span>
                                                        </span>
                                                        {t.subs.length > 0 && <i className={'fas fa-chevron-' + (catOpen ? 'up' : 'down') + ' sp-tree-chev'}></i>}
                                                    </button>
                                                    {catOpen && t.subs.length > 0 && (
                                                        <div className="sp-tree-subs">
                                                            {t.subs.map(s => {

            {showRangeSheet && (

            <div className="sp-formrow"><span>Country</span><select value={f.country} onChange={e => set('country', e.target.value)}>{COUNTRIES.map(c => <option key={c} value={c}>{c}</option>)}</select></div>

            <div className="sp-formrow"><span>Account ID<small className="sp-formrow-hint">Optional · last 4 or IBAN</small></span><input type="text" value={f.accountRef} placeholder="Optional" onChange={e => set('accountRef', e.target.value)} /></div>
            <button type="button" className="sp-checkrow" onClick={() => set('isPrimary', !f.isPrimary)}>

                <span><span className="sp-row-title">Set as primary account</span><span className="sp-row-sub" style={{display: 'block'}}>For {f.person === 'own' ? 'you' : f.person} · pre-selected when paying or receiving</span></span>
            </button>

            <button type="button" className="sp-btn sp-btn-soft" style={{width: '100%', marginTop: '10px'}} onClick={onCancel}>Cancel</button>

function AccountsScreen({ categories, activeView, defaultCurrency, onUpdate }) {
    const [bankAccounts, setBankAccounts] = useState(() => DataService.getBankAccounts());
    const [transfers, setTransfers] = useState(() => DataService.getTransfers());
    const [reconciliations, setReconciliations] = useState(() => DataService.getReconciliations());
    const [linkableExpenses, setLinkableExpenses] = useState([]);
    const [linkableIncome, setLinkableIncome] = useState([]);
    const [openId, setOpenId] = useState(null);
    const [form, setForm] = useState(null); // null | 'new' | account
    const [pendingPrimary, setPendingPrimary] = useState(null);
    const [pendingDelete, setPendingDelete] = useState(null); // movement key
    const [deleteAccount, setDeleteAccount] = useState(null);
    const [deleteAck, setDeleteAck] = useState(false);
    const [toast, setToast] = useState('');
    const [filterSyncConflict, setFilterSyncConflict] = useState(!!FilterMemory.load('bankAccounts').syncConflict);
    const [showConflictDetail, setShowConflictDetail] = useState(null); // { collection, id }
    const people = DataService.getPeople();
    useEffect(() => { FilterMemory.save('bankAccounts', { syncConflict: filterSyncConflict }); }, [filterSyncConflict]);
    useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(''), 3500); return () => clearTimeout(t); }, [toast]);

    const reloadLinkable = async () => { const [exp, inc] = await Promise.all([DataService.getExpenses(), DataService.getIncome()]); setLinkableExpenses(exp); setLinkableIncome(inc); };
    useEffect(() => { reloadLinkable(); }, []);
    const reload = () => { setBankAccounts(DataService.getBankAccounts()); setTransfers(DataService.getTransfers()); setReconciliations(DataService.getReconciliations()); reloadLinkable(); };
    const done = (msg) => { if (msg) setToast(msg); reload(); if (onUpdate) onUpdate(); };

    const linkCandidatesAll = React.useMemo(() => computeLinkCandidates(bankAccounts, linkableExpenses, linkableIncome), [bankAccounts, linkableExpenses, linkableIncome]);
    const visible = bankAccounts.filter(a => matchesActiveView(a.person, activeView));
    const acctSyncConflicts = useMemo(() => SyncConflicts.read('bankAccounts'), [bankAccounts]);
    const transferSyncConflicts = useMemo(() => SyncConflicts.read('transfers'), [transfers]);
    const reconciliationSyncConflicts = useMemo(() => SyncConflicts.read('reconciliations'), [reconciliations]);
    const displayAccounts = filterSyncConflict ? visible.filter(a => !!acctSyncConflicts[String(a.id)]) : visible;
    const isLiab = (a) => DataService.LIABILITY_ACCOUNT_TYPES.includes(a.accountType);
    const bal = (a) => DataService.computeBankAccountBalance(a);
    const signed = (a) => isLiab(a) ? -bal(a) : bal(a); // what it adds to your total

    // Hero: your default currency total, other currencies listed separately (never converted).
    const byCur = {};
    visible.forEach(a => { byCur[a.currency] = (byCur[a.currency] || 0) + signed(a); });
    const curOrder = Object.keys(byCur).sort((a, b) => a === defaultCurrency ? -1 : b === defaultCurrency ? 1 : a.localeCompare(b));
    const groups = curOrder.map(cur => ({ cur, name: (CurrencyService.getAllCurrencies().find(c => c.code === cur) || {}).name || cur, total: byCur[cur], rows: displayAccounts.filter(a => a.currency === cur) })).filter(g => g.rows.length);

    // ---- Link (same scope as before: this person's unlinked expenses + income → their primary)
    const [linkSheet, setLinkSheet] = useState(null);
    const openLink = (account) => {
        const c = linkCandidatesAll.find(x => x.person === account.person);
        setLinkSheet({ account, expenseCount: c ? c.expenseCount : 0, incomeCount: c ? c.incomeCount : 0 });
    };
    const confirmLink = async () => {
        const { account, expenseCount, incomeCount } = linkSheet;
        await DataService.bulkLinkAccounts([account.person]);
        setLinkSheet(null);
        done('Linked ' + expenseCount + ' expense' + (expenseCount === 1 ? '' : 's') + ' and ' + incomeCount + ' income record' + (incomeCount === 1 ? '' : 's') + ' to ' + account.accountName);
    };

    // ---- Transfer (unchanged rules: overseas fee → fee expense with a category when it's your
    // own account; to another person → expense for the sender + income for the receiver)
    const emptyTransferForm = { fromAccountId: '', toAccountId: '', date: DateUtils.today(), amount: '', conversionRate: '', fee: '', toAmount: '', categoryId: '', subcategory: '', principalCategoryId: '', principalSubcategory: '', notes: '' };
    const [transferForm, setTransferForm] = useState(null);
    const [transferErrors, setTransferErrors] = useState({});
    const [transferSubmitting, setTransferSubmitting] = useState(false);
    const [liveConversionRate, setLiveConversionRate] = useState(null);
    const tf = transferForm || emptyTransferForm;
    const transferFromAccount = bankAccounts.find(a => String(a.id) === String(tf.fromAccountId));
    const transferToAccount = bankAccounts.find(a => String(a.id) === String(tf.toAccountId));
    const isOverseasTransfer = !!(transferFromAccount && transferToAccount && transferFromAccount.currency !== transferToAccount.currency);
    const isCrossPersonTransfer = !!(transferFromAccount && transferToAccount && transferFromAccount.person !== transferToAccount.person);
    const transferFeeCategory = categories.find(c => c.id === parseInt(tf.categoryId));
    const transferPrincipalCategory = categories.find(c => c.id === parseInt(tf.principalCategoryId));
    useEffect(() => {
        if (!isOverseasTransfer) { setLiveConversionRate(null); return; }
        let cancelled = false;
        CurrencyService.getConversionRate(transferFromAccount.currency, transferToAccount.currency).then(rate => { if (!cancelled) setLiveConversionRate(rate); });
        return () => { cancelled = true; };
    }, [transferFromAccount && transferFromAccount.currency, transferToAccount && transferToAccount.currency, isOverseasTransfer]);
    useEffect(() => {
        if (!transferForm || !isOverseasTransfer) return;
        const amount = parseFloat(tf.amount) || 0, fee = parseFloat(tf.fee) || 0, rate = parseFloat(tf.conversionRate) || liveConversionRate;
        if (!amount || !rate) return;
        setTransferForm(prev => ({ ...prev, toAmount: String(Math.round((amount - fee) * rate * 100) / 100) }));
        // eslint-disable-next-line react-hooks/exhaustive-deps
    }, [tf.amount, tf.fee, tf.conversionRate, liveConversionRate, isOverseasTransfer]);
    const setTf = (field, value) => {
        setTransferForm(prev => {
            const next = { ...prev, [field]: value };
            if (field === 'categoryId') next.subcategory = '';
            if (field === 'principalCategoryId') next.principalSubcategory = '';
            return next;
        });
        if (transferErrors[field]) setTransferErrors(prev => ({ ...prev, [field]: '' }));
    };
    const submitTransfer = async () => {
        const errors = {};
        const amount = parseFloat(tf.amount);
        if (!tf.toAccountId) errors.toAccountId = 'Choose where the money goes';
        if (!amount || amount <= 0) errors.amount = 'Amount must be greater than 0';
        const feeAmount = parseFloat(tf.fee) || 0;
        if (isOverseasTransfer && feeAmount > 0 && !isCrossPersonTransfer) {
            if (!tf.categoryId) errors.categoryId = 'Category is required for a fee';
            if (transferFeeCategory && transferFeeCategory.subcategories.length > 0 && !tf.subcategory) errors.subcategory = 'Subcategory is required for a fee';
        }
        if (isCrossPersonTransfer) {
            if (!tf.principalCategoryId) errors.principalCategoryId = 'Category is required';
            if (transferPrincipalCategory && transferPrincipalCategory.subcategories.length > 0 && !tf.principalSubcategory) errors.principalSubcategory = 'Subcategory is required';
        }
        if (Object.keys(errors).length > 0) { setTransferErrors(errors); return; }
        setTransferSubmitting(true);
        try {
            const rate = isOverseasTransfer ? (parseFloat(tf.conversionRate) || liveConversionRate || await CurrencyService.getConversionRate(transferFromAccount.currency, transferToAccount.currency)) : 1;
            const toAmount = isOverseasTransfer ? (parseFloat(tf.toAmount) || Math.round((amount - feeAmount) * rate * 100) / 100) : amount;
            let feeExpenseId = null;
            if (isOverseasTransfer && feeAmount > 0 && !isCrossPersonTransfer) {
                const feeExpense = await DataService.addExpense({ amount: feeAmount, currency: transferFromAccount.currency, date: tf.date, description: `Transfer fee: ${transferFromAccount.accountName} → ${transferToAccount.accountName}`, categoryId: parseInt(tf.categoryId), subcategory: tf.subcategory || '', paidBy: transferFromAccount.person === 'own' ? '' : transferFromAccount.person, accountId: transferFromAccount.id, tags: ['transfer-fee'] });
                feeExpenseId = feeExpense.id;
            }
            let principalExpenseId = null, recipientIncomeId = null;
            if (isCrossPersonTransfer) {
                const toPersonLabel = transferToAccount.person === 'own' ? 'Me' : transferToAccount.person;
                const fromPersonLabel = transferFromAccount.person === 'own' ? 'Me' : transferFromAccount.person;
                const principalExpense = await DataService.addExpense({ amount: amount + (isOverseasTransfer ? feeAmount : 0), currency: transferFromAccount.currency, date: tf.date, description: `Transfer to ${toPersonLabel}: ${transferFromAccount.accountName} → ${transferToAccount.accountName}`, categoryId: parseInt(tf.principalCategoryId), subcategory: tf.principalSubcategory || '', paidBy: transferFromAccount.person === 'own' ? '' : transferFromAccount.person, tags: ['transfer-principal'] });
                principalExpenseId = principalExpense.id;
                const recipientIncome = await DataService.addIncome({ amount: toAmount, currency: transferToAccount.currency, date: tf.date, source: `Transfer from ${fromPersonLabel}`, description: `Transfer from ${fromPersonLabel}: ${transferFromAccount.accountName} → ${transferToAccount.accountName}`, paidBy: transferToAccount.person === 'own' ? '' : transferToAccount.person, tags: ['transfer-incoming'] });
                recipientIncomeId = recipientIncome.id;
            }
            DataService.addTransfer({ date: tf.date, fromAccountId: transferFromAccount.id, toAccountId: transferToAccount.id, fromAmount: amount, toAmount, isOverseas: isOverseasTransfer, conversionRate: rate, fee: isOverseasTransfer ? feeAmount : 0, feeExpenseId, principalExpenseId, recipientIncomeId, notes: tf.notes || '' });
            setTransferForm(null); setTransferErrors({});
            done(spFmtMoney(amount, transferFromAccount.currency) + ' moved to ' + transferToAccount.accountName);
        } finally { setTransferSubmitting(false); }
    };

    // ---- Cash withdrawal (unchanged)
    const emptyWithdrawForm = { currency: 'GBP', amount: '', fee: '', feeCurrency: 'GBP', deductedAmount: '', date: DateUtils.today() };
    const [withdrawAccount, setWithdrawAccount] = useState(null);
    const [withdrawForm, setWithdrawForm] = useState(emptyWithdrawForm);
    const [withdrawErrors, setWithdrawErrors] = useState({});
    const [withdrawSubmitting, setWithdrawSubmitting] = useState(false);
    const openWithdraw = (account) => { setWithdrawAccount(account); setWithdrawForm({ ...emptyWithdrawForm, currency: account.currency, feeCurrency: account.currency }); setWithdrawErrors({}); };
    useEffect(() => {
        if (!withdrawAccount) return;
        const amount = parseFloat(withdrawForm.amount) || 0, fee = parseFloat(withdrawForm.fee) || 0;
        if (!amount && !fee) return;
        const converted = CurrencyService.convertToDefaultSync(amount, withdrawForm.currency, withdrawAccount.currency);
        const convertedFee = CurrencyService.convertToDefaultSync(fee, withdrawForm.feeCurrency, withdrawAccount.currency);
        setWithdrawForm(prev => ({ ...prev, deductedAmount: String(Math.round((converted + convertedFee) * 100) / 100) }));
    }, [withdrawForm.amount, withdrawForm.fee, withdrawForm.currency, withdrawForm.feeCurrency, withdrawAccount]);
    const submitWithdraw = async () => {
        const errors = {};
        const amount = parseFloat(withdrawForm.amount), deductedAmount = parseFloat(withdrawForm.deductedAmount);
        if (!withdrawForm.amount || amount <= 0) errors.amount = 'Amount must be greater than 0';
        if (!withdrawForm.deductedAmount || deductedAmount <= 0) errors.deductedAmount = 'Deducted amount must be greater than 0';
        if (!withdrawForm.date) errors.date = 'Date is required';
        if (Object.keys(errors).length > 0) { setWithdrawErrors(errors); return; }
        setWithdrawSubmitting(true);
        try {
            DataService.withdrawCash({ accountId: withdrawAccount.id, currency: withdrawForm.currency, amount, fee: parseFloat(withdrawForm.fee) || 0, feeCurrency: withdrawForm.feeCurrency, deductedAmount, date: withdrawForm.date });
            const name = withdrawAccount.accountName;
            setWithdrawAccount(null); setWithdrawErrors({});
            done(spFmtMoney(amount, withdrawForm.currency) + ' cash taken from ' + name);
        } finally { setWithdrawSubmitting(false); }
    };

    // ---- Reconcile: always a balance correction now (approved) — never an Expense/Income.
    const [reconcile, setReconcile] = useState(null); // { account, to, notes, error }
    const submitReconcile = () => {
        const account = reconcile.account;
        const actualBalance = parseFloat(reconcile.to);
        if (reconcile.to === '' || isNaN(actualBalance)) { setReconcile(r => ({ ...r, error: 'Enter the actual balance' })); return; }
        const balanceBefore = bal(account);
        const delta = Math.round((actualBalance - balanceBefore) * 100) / 100;
        if (delta === 0) { setReconcile(r => ({ ...r, error: 'Already matches — no adjustment needed.' })); return; }
        DataService.addReconciliation({ accountId: account.id, person: account.person, date: DateUtils.today(), balanceBefore, delta, balanceAfter: actualBalance, notes: reconcile.notes || '', loggedAsTransaction: false, transactionType: null, transactionId: null });
        setReconcile(null);
        done(account.accountName + ' balance set to ' + spFmtMoney(actualBalance, account.currency));
    };

    // ---- Delete account (records linked to it are left as they are, as before)
    const accountImpacts = (a) => {
        const exp = linkableExpenses.filter(e => String(e.accountId) === String(a.id)).length;
        const inc = linkableIncome.filter(i => String(i.accountId) === String(a.id)).length;
        const tr = transfers.filter(t => String(t.fromAccountId) === String(a.id) || String(t.toAccountId) === String(a.id)).length;
        const out = [];
        if (exp || inc) out.push({ icon: 'fas fa-receipt', text: exp + ' expense' + (exp === 1 ? '' : 's') + ' and ' + inc + ' income record' + (inc === 1 ? '' : 's') + ' linked to it stay in your lists.' });
        if (tr) out.push({ icon: 'fas fa-right-left', text: tr + ' money movement' + (tr === 1 ? '' : 's') + ' mention it and stay in the log.' });
        if (a.isPrimary) out.push({ icon: 'fas fa-star', text: 'It is ' + (a.person === 'own' ? 'your' : a.person + "'s") + ' primary account, so new entries won\'t have a default account until you pick another.' });
        if (!out.length) out.push({ icon: 'fas fa-circle-check', text: 'Nothing is linked to this account.' });
        return out;
    };
    const confirmDeleteAccount = () => { const a = deleteAccount; DataService.deleteBankAccount(a.id); setDeleteAccount(null); setDeleteAck(false); setOpenId(null); done(a.accountName + ' deleted'); };

    // ---- Money movements (moved from Summary; no date filter)
    const findAccount = (id) => bankAccounts.find(a => String(a.id) === String(id));
    const shortName = (id) => { const a = findAccount(id); return a ? a.accountName : 'Unknown account'; };
    const currencyOf = (id) => { const a = findAccount(id); return a ? a.currency : defaultCurrency; };
    const visibleTransfers = transfers.filter(t => { const from = findAccount(t.fromAccountId); return from && matchesActiveView(from.person, activeView); }).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    const isCashRecon = (id) => typeof id === 'string' && id.startsWith('cash-');
    const reconLabel = (r) => { if (isCashRecon(r.accountId)) { const [p, c] = r.accountId.slice(5).split('|'); return 'Cash (' + (p === 'own' ? 'you' : p) + ' · ' + c + ')'; } return shortName(r.accountId); };
    const reconCur = (r) => isCashRecon(r.accountId) ? r.accountId.split('|')[1] : currencyOf(r.accountId);
    const visibleRecons = reconciliations.filter(r => matchesActiveView(r.person, activeView)).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    const assetItems = DataService.getNetWorthItems();
    const assetFundingDrop = (t) => {
        const item = assetItems.find(i => i.id === t.toAssetId);
        return item ? { item, from: item.value, to: item.value - (Number(t.toAmount) || 0) } : null;
    };
    const sections = [
        { key: 'overseas', title: 'Overseas Transfers', icon: 'fas fa-earth-europe', tint: '#dbeafe', ink: '#2563eb', rows: visibleTransfers.filter(t => t.isOverseas) },
        { key: 'account', title: 'Account Transfers', icon: 'fas fa-right-left', tint: '#eef2ff', ink: '#4f46e5', rows: visibleTransfers.filter(t => !t.isOverseas && !t.toAssetId) },
        { key: 'asset', title: 'Asset Funding', icon: 'fas fa-seedling', tint: '#dcfce7', ink: '#16a34a', rows: visibleTransfers.filter(t => t.toAssetId && !t.isCashWithdrawal) },
        { key: 'cash', title: 'Cash Withdrawals', icon: 'fas fa-money-bill-wave', tint: '#fef3c7', ink: '#d97706', rows: visibleTransfers.filter(t => t.isCashWithdrawal) },
        { key: 'recon', title: 'Balance Reconciliations', icon: 'fas fa-scale-balanced', tint: '#fae8ff', ink: '#c026d3', rows: visibleRecons }
    ];
    const sumBy = (rows, amt, cur) => { const m = {}; rows.forEach(r => { const c = cur(r); m[c] = (m[c] || 0) + amt(r); }); return Object.entries(m).map(([c, v]) => spFmtMoney(v, c, 0)).join(' + '); };
    const deleteMovement = (sec, row) => {
        if (sec.key === 'recon') { DataService.deleteReconciliation(row.id); setPendingDelete(null); done('Reconciliation deleted'); return; }
        const drop = sec.key === 'asset' ? assetFundingDrop(row) : null;
        DataService.deleteTransfer(row.id);
        if (drop) DataService.revertAssetFunding(row);
        setPendingDelete(null);
        done(sec.key === 'asset' && drop ? 'Funding removed · ' + drop.item.name + ' now ' + spFmtMoney(drop.to, drop.item.currency) : 'Entry deleted');
    };

    // ---- Edit a cash withdrawal (kept from Summary)
    const [editWithdraw, setEditWithdraw] = useState(null);
    const saveEditWithdraw = () => {
        const w = editWithdraw;
        const amount = parseFloat(w.amount), deducted = parseFloat(w.deductedAmount);
        if (!w.amount || amount <= 0) { setEditWithdraw(p => ({ ...p, error: 'Amount must be greater than 0' })); return; }
        if (!w.deductedAmount || deducted <= 0) { setEditWithdraw(p => ({ ...p, error: 'Deducted amount must be greater than 0' })); return; }
        if (!w.date) { setEditWithdraw(p => ({ ...p, error: 'Date is required' })); return; }
        DataService.updateTransfer(w.id, { toAmount: amount, cashWithdrawCurrency: w.currency, fee: parseFloat(w.fee) || 0, feeCurrency: w.feeCurrency, fromAmount: deducted, date: w.date });
        setEditWithdraw(null);
        done('Cash withdrawal updated');
    };

    // ---- Sync conflicts (accounts, transfers, reconciliations)
    const conflictSets = { bankAccounts: acctSyncConflicts, transfers: transferSyncConflicts, reconciliations: reconciliationSyncConflicts };
    const conflictLabels = {
        bankAccounts: { accountName: 'Account Name', accountRef: 'Account ID', accountType: 'Type', country: 'Country', currency: 'Currency', person: 'Person', openingAmount: 'Opening Amount', isPrimary: 'Primary' },
        transfers: { date: 'Date', fromAccountId: 'From Account', toAccountId: 'To Account', fromAmount: 'From Amount', toAmount: 'To Amount', isOverseas: 'Overseas', conversionRate: 'Conversion Rate', fee: 'Fee', feeCurrency: 'Fee Currency', notes: 'Notes', toAssetId: 'To Asset', toAssetName: 'Asset Name', isCashWithdrawal: 'Cash Withdrawal', cashWithdrawCurrency: 'Withdrawal Currency' },
        reconciliations: { accountId: 'Account', person: 'Person', date: 'Date', balanceBefore: 'Balance Before', delta: 'Adjustment', balanceAfter: 'Balance After', notes: 'Notes', loggedAsTransaction: 'Logged as Transaction', transactionType: 'Transaction Type' }
    };
    const formatConflictValue = (key, value) => {
        if ((key === 'fromAccountId' || key === 'toAccountId' || key === 'accountId') && value) return findAccount(value) ? shortName(value) : String(value);
        if (typeof value === 'boolean') return value ? 'Yes' : 'No';
        return value === undefined || value === null || value === '' ? '—' : String(value);
    };
    const resolveConflict = (useCloud) => {
        const { collection, id } = showConflictDetail;
        const snap = conflictSets[collection][String(id)];
        const updates = useCloud && snap ? snap.cloudSnapshot : {};
        if (collection === 'bankAccounts') DataService.updateBankAccount(id, updates);
        else if (collection === 'transfers') DataService.updateTransfer(id, updates);
        else DataService.updateReconciliation(id, updates);
        SyncConflicts.dismiss(collection, id);
        setShowConflictDetail(null);
        done();
    };
    const conflictPanel = (collection, record) => {
        const snap = conflictSets[collection][String(record.id)];
        if (!showConflictDetail || showConflictDetail.collection !== collection || showConflictDetail.id !== record.id || !snap) return null;
        return <div style={{margin: '0 0 10px'}}><ConflictCompare localRecord={record} cloudSnapshot={snap.cloudSnapshot} detectedAt={snap.detectedAt} fieldLabels={conflictLabels[collection]} formatValue={formatConflictValue} onKeepLocal={() => resolveConflict(false)} onUseCloud={() => resolveConflict(true)} /></div>;
    };
    const cfButton = (collection, id) => {
        if (!conflictSets[collection][String(id)]) return null;
        const open = showConflictDetail && showConflictDetail.collection === collection && showConflictDetail.id === id;
        return <span role="button" className={'sp-cfbtn' + (open ? ' is-open' : '')} title="Sync conflict · tap to compare" onClick={(e) => { e.stopPropagation(); setShowConflictDetail(open ? null : { collection, id }); }}><i className="fas fa-code-compare"></i></span>;
    };
    const anyConflicts = Object.keys(acctSyncConflicts).length + Object.keys(transferSyncConflicts).length + Object.keys(reconciliationSyncConflicts).length > 0;

    const movementRow = (sec, t) => {
        const key = sec.key + ':' + t.id;
        let title, meta, amount, ink;
        if (sec.key === 'recon') {
            title = reconLabel(t);
            meta = [spFmtMoney(t.balanceBefore, reconCur(t)) + ' → ' + spFmtMoney(t.balanceAfter, reconCur(t)), t.notes, t.loggedAsTransaction ? 'logged as ' + t.transactionType : '', spShortDate(t.date)].filter(Boolean).join(' · ');
            amount = (t.delta > 0 ? '+' : '−') + spFmtMoney(Math.abs(t.delta), reconCur(t)); ink = t.delta > 0 ? '#16a34a' : '#e11d48';
        } else if (sec.key === 'cash') {
            title = shortName(t.fromAccountId);
            meta = 'Fee ' + spFmtMoney(t.fee || 0, t.feeCurrency || currencyOf(t.fromAccountId)) + ' · ' + spShortDate(t.date);
            amount = spFmtMoney(t.toAmount, t.cashWithdrawCurrency || currencyOf(t.fromAccountId));
        } else if (sec.key === 'asset') {
            title = shortName(t.fromAccountId) + ' → ' + (t.toAssetName || 'Asset');
            meta = 'Logged for audit · ' + spShortDate(t.date);
            amount = spFmtMoney(t.fromAmount, currencyOf(t.fromAccountId));
        } else {
            const to = findAccount(t.toAccountId);
            title = shortName(t.fromAccountId) + ' → ' + shortName(t.toAccountId);
            meta = sec.key === 'overseas' ? '1 ' + currencyOf(t.fromAccountId) + ' = ' + t.conversionRate + ' ' + currencyOf(t.toAccountId) + ' · fee ' + spFmtMoney(t.fee || 0, currencyOf(t.fromAccountId)) + ' · ' + spShortDate(t.date)
                : 'To: ' + (to ? (to.person === 'own' ? 'You' : to.person) : '—') + ' · ' + spShortDate(t.date);
            amount = spFmtMoney(t.fromAmount, currencyOf(t.fromAccountId));
        }
        const drop = sec.key === 'asset' ? assetFundingDrop(t) : null;
        const confirmText = sec.key === 'recon' ? 'Delete this correction? The balance goes back to ' + spFmtMoney(t.balanceBefore, reconCur(t)) + (t.loggedAsTransaction ? ', and its ' + t.transactionType + ' record is deleted too.' : '.')
            : sec.key === 'asset' ? 'Delete this funding? ' + shortName(t.fromAccountId) + ' gets ' + amount + ' back' + (drop ? ' and ' + drop.item.name + ' drops from ' + spFmtMoney(drop.from, drop.item.currency) + ' to ' + spFmtMoney(drop.to, drop.item.currency) : '') + '.'
            : sec.key === 'cash' ? 'Delete this withdrawal? ' + shortName(t.fromAccountId) + ' gets the money back and your cash goes down.'
            : 'Delete this transfer? Both balances go back' + (t.feeExpenseId || t.principalExpenseId || t.recipientIncomeId ? ', and the expense/income it logged is deleted too.' : '.');
        return (
            <div key={key} className="sp-mvrow">
                <div className="sp-mvrow-line">
                    <div className="sp-mvrow-main"><div className="sp-schedtitle"><span style={{fontSize: '14px'}}>{title}</span>{cfButton(sec.key === 'recon' ? 'reconciliations' : 'transfers', t.id)}</div><div className="sp-mvrow-meta">{meta}</div></div>
                    <span className="sp-mvrow-amt" style={{color: ink}}>{amount}</span>
                    {sec.key === 'cash' && <button type="button" className="sp-mvrow-btn" title="Edit" onClick={() => setEditWithdraw({ id: t.id, amount: String(t.toAmount), currency: t.cashWithdrawCurrency || currencyOf(t.fromAccountId), fee: String(t.fee || 0), feeCurrency: t.feeCurrency || currencyOf(t.fromAccountId), deductedAmount: String(t.fromAmount), date: t.date, accountCurrency: currencyOf(t.fromAccountId), accountName: shortName(t.fromAccountId) })}><i className="fas fa-pen"></i></button>}
                    <button type="button" className="sp-mvrow-btn" title="Delete" onClick={() => setPendingDelete(pendingDelete === key ? null : key)}><i className="fas fa-trash"></i></button>
                </div>
                {conflictPanel(sec.key === 'recon' ? 'reconciliations' : 'transfers', t)}
                {pendingDelete === key && <InlineConfirm text={confirmText} keepLabel="Cancel" cta="Delete" onKeep={() => setPendingDelete(null)} onConfirm={() => deleteMovement(sec, t)} />}
            </div>
        );
    };

    const hasOthers = bankAccounts.length >= 2;
    return (
        <div className="sp-page sp-acctpage">
            <div className="sp-page-kicker">Banks, cards &amp; transfers</div>
            <h2 className="sp-page-title" style={{marginBottom: '12px'}}>Accounts</h2>
            <div className="sp-hero sp-cathero">
                <div className="sp-hero-label">Total balance · {curOrder[0] || defaultCurrency}</div>
                <div className="sp-hero-value">{spFmtMoney(byCur[curOrder[0]] || 0, curOrder[0] || defaultCurrency)}</div>
                <div className="sp-hero-pills">
                    <span className="sp-hero-pill is-green">{visible.length} account{visible.length === 1 ? '' : 's'}</span>
                    {curOrder.slice(1).map(c => <span key={c} className="sp-hero-pill">{byCur[c] >= 0 ? '+ ' : '− '}{spFmtMoney(Math.abs(byCur[c]), c)}</span>)}
                </div>
            </div>
            {toast && <div className="sp-alert sp-alert-ok"><i className="fas fa-circle-check"></i><span>{toast}</span></div>}
            {anyConflicts && (
                <label className="sp-check" style={{margin: '0 4px 10px'}}>
                    <input type="checkbox" checked={filterSyncConflict} onChange={(e) => setFilterSyncConflict(e.target.checked)} />
                    <i className="fas fa-code-compare" style={{color: '#4f46e5'}}></i>Sync conflicts only (accounts)
                </label>
            )}
            {form && <AccountFormCard account={form === 'new' ? null : form} bankAccounts={bankAccounts} activeView={activeView} onCancel={() => setForm(null)} onSaved={(msg) => { setForm(null); done(msg); }} />}

            {visible.length === 0 && !form && <div className="sp-empty" style={{marginBottom: '14px'}}><i className="fas fa-building-columns"></i>No accounts yet. Add your bank accounts and cards to track their balances.</div>}
            {groups.map(g => (
                <div key={g.cur} style={{marginBottom: '14px'}}>
                    <div className="sp-group-head" style={{padding: '0 4px 8px'}}><span className="sp-group-label">{g.cur} · {g.name}</span><span className="sp-group-total">{spFmtMoney(g.total, g.cur)}</span></div>
                    <div className="sp-acctlist">
                        {g.rows.map(a => {
                            const look = spAcctLook(a.accountType);
                            const isOpen = openId === a.id;
                            const b = bal(a);
                            const candidate = a.isPrimary ? linkCandidatesAll.find(c => c.person === a.person) : null;
                            const unlinked = candidate ? candidate.expenseCount + candidate.incomeCount : 0;
                            const primaryNow = !a.isPrimary && bankAccounts.find(x => x.isPrimary && x.person === a.person);
                            const last4 = a.accountRef ? ' ·· ' + String(a.accountRef).replace(/\s+/g, '').slice(-4) : '';
                            return (
                                <div key={a.id} className="sp-acctitem">
                                    <button type="button" className="sp-acctrow" onClick={() => { setOpenId(isOpen ? null : a.id); setPendingPrimary(null); }}>
                                        <span className="sp-schedicon" style={{background: look.tint, color: look.ink}}><i className={look.icon}></i></span>
                                        <span className="sp-schedmain">
                                            <span className="sp-schedtitle"><span>{a.accountName}</span>{cfButton('bankAccounts', a.id)}</span>
                                            <span className="sp-schedmeta">
                                                {a.isPrimary && <span className="sp-badge-primary">PRIMARY</span>}
                                                {activeView.length > 1 && spOwnerChip(a.person, people)}
                                                <span>{a.accountType}{last4}</span>
                                            </span>
                                            {!a.isPrimary && !isLiab(a) && <span role="button" className="sp-setprimary" onClick={(e) => { e.stopPropagation(); setPendingPrimary(pendingPrimary === a.id ? null : a.id); }}>Set as primary</span>}
                                        </span>
                                        <span className="sp-schedright"><span className="sp-schedamt" style={{color: isLiab(a) ? (b > 0 ? '#e11d48' : undefined) : (b < 0 ? '#e11d48' : undefined)}}>{isLiab(a) && b > 0 ? '−' : ''}{spFmtMoney(isLiab(a) ? Math.abs(b) : b, a.currency)}</span></span>
                                        <i className={'fas fa-chevron-' + (isOpen ? 'up' : 'down') + ' sp-catchev'}></i>
                                    </button>
                                    {conflictPanel('bankAccounts', a)}
                                    {pendingPrimary === a.id && (
                                        <div style={{padding: '0 0 10px'}}>
                                            <InlineConfirm text={primaryNow ? 'Make ' + a.accountName + ' the primary account? It replaces ' + primaryNow.accountName + '.' : 'Make ' + a.accountName + ' the primary account?'} keepLabel="Cancel" cta="Set primary" onKeep={() => setPendingPrimary(null)} onConfirm={() => { DataService.updateBankAccount(a.id, { isPrimary: true }); setPendingPrimary(null); done(a.accountName + ' is now primary'); }} />
                                        </div>
                                    )}
                                    {isOpen && (
                                        <div className="sp-nwitem-open">
                                            <SpActBar actions={[
                                                a.isPrimary && { key: 'link', label: unlinked ? 'Link (' + unlinked + ')' : 'Link', icon: 'fas fa-link', tone: 'blue', onClick: () => openLink(a) },
                                                hasOthers && { key: 'xfer', label: 'Transfer', icon: 'fas fa-right-left', tone: 'slate', onClick: () => { setTransferForm({ ...emptyTransferForm, fromAccountId: String(a.id) }); setTransferErrors({}); } },
                                                !isLiab(a) && { key: 'cash', label: 'Cash', icon: 'fas fa-money-bill-wave', tone: 'amber', onClick: () => openWithdraw(a) },
                                                { key: 'bal', label: 'Balance', icon: 'fas fa-scale-balanced', tone: 'slate', onClick: () => setReconcile({ account: a, to: '', notes: '', error: '' }) },
                                                { key: 'edit', label: 'Edit', icon: 'fas fa-pen', tone: 'slate', onClick: () => { setForm(a); window.scrollTo({ top: 0, behavior: 'smooth' }); } },
                                                { key: 'del', label: 'Delete', icon: 'fas fa-trash', tone: 'rose', onClick: () => { setDeleteAccount(a); setDeleteAck(false); } }
                                            ]} />
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            ))}

            <div className="sp-group-head" style={{padding: '6px 4px 8px'}}><span className="sp-group-label">Money movements</span></div>
            {sections.map(sec => (
                <div key={sec.key} className="sp-mvcard">
                    <div className="sp-mvcard-head">
                        <span className="sp-tile" style={{background: sec.tint, color: sec.ink}}><i className={sec.icon}></i></span>
                        <span className="sp-mvcard-title">{sec.title}</span>
