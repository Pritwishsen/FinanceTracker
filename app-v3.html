                                        </div>
                                        {isCloud && relativeSync && !isReconnectNeeded && (
                                            <div style={{fontSize:'0.78rem',color:'#6c757d',marginTop:'1px'}}>
                                                Last synced {relativeSync}
                                            </div>
                                        )}
                                        {isCloud && !relativeSync && !isReconnectNeeded && (
                                            <div style={{fontSize:'0.78rem',color:'#6c757d',marginTop:'1px'}}>{info.sub}</div>
                                        )}
                                        {isReconnectNeeded && (
                                            <div style={{fontSize:'0.78rem',color:'#dc3545',fontWeight:'500',marginTop:'1px'}}>
                                                <i className="fas fa-exclamation-triangle me-1"></i>Session expired — re-connect to resume syncing
                                            </div>
                                        )}
                                        {!isCloud && (
                                            <div style={{fontSize:'0.78rem',color:'#6c757d',marginTop:'1px'}}>{info.sub}</div>
                                        )}
                                    </div>
                                </div>
                                <button className="btn btn-sm btn-outline-primary" onClick={() => onStoragePickerOpen && onStoragePickerOpen()}>
                                    Switch
                                </button>
                            </div>
                            {isCloud && (
                                <div className="d-flex gap-2">
                                    {isReconnectNeeded ? (
                                        <button className="btn btn-sm btn-warning flex-grow-1" onClick={() => onReconnect && onReconnect()}>
                                            <i className="fas fa-plug me-1"></i>Re-connect {pref === 'gdrive' ? 'Google Drive' : 'OneDrive'}
                                        </button>
                                    ) : (
                                        <button className="btn btn-sm btn-outline-secondary flex-grow-1" onClick={() => onSyncNow && onSyncNow()} disabled={isSyncing}>
                                            {isSyncing
                                                ? <><i className="fas fa-spinner fa-spin me-1"></i>Syncing…</>
                                                : <><i className="fas fa-sync-alt me-1"></i>Sync now</>
                                            }
                                        </button>
                                    )}
                                    {isConnected && (
                                        <button className="btn btn-sm btn-outline-secondary" title="Version history" onClick={() => onViewHistory && onViewHistory()} style={{flexShrink:0}}>
                                            <i className="fas fa-history"></i>
                                        </button>
                                    )}
                                </div>
                            )}
                        </div>
                    );
                })()}
                {(storagePref === 'gdrive' || storagePref === 'onedrive') && (
                    <div style={{marginTop: '0.85rem'}}>
                        <label className="form-label small fw-semibold mb-1">Backup retention</label>
                        <select className="form-select form-select-sm" value={cloudBackupRetention} onChange={e => handleChangeBackupRetention(e.target.value)}>
                            <option value="count5">Keep last 5 backups</option>
                            <option value="7d">Keep backups for 7 days</option>
                            <option value="30d">Keep backups for 30 days</option>
                            <option value="90d">Keep backups for 90 days</option>
                        </select>
                        <div className="text-muted" style={{fontSize: '0.78rem', marginTop: '0.25rem'}}>
                            The most recent backup is always kept, even if it's older than this window.
                        </div>
                    </div>
                )}
            </div>
            </React.Fragment>)}

            <hr style={{margin: '1.5rem 0'}} />
            <div style={{marginBottom: '1rem'}}>
                {renderSectionHeader('contactUs', 'fas fa-envelope', 'Contact Us')}
            </div>
            {expandedSection === 'contactUs' && (<React.Fragment>
            <div style={{marginBottom: '1rem'}}>
                <p className="text-muted" style={{fontSize: '0.9rem', marginBottom: '1rem'}}>
                    Have a question or found a problem? Send us a message.
                </p>
                <button className="btn btn-outline-primary w-100" onClick={() => setShowContactModal(true)}>
                    <i className="fas fa-paper-plane me-2"></i>Contact Support
                </button>
            </div>
            {showContactModal && (
                <ContactUsModal onClose={() => setShowContactModal(false)} defaultReplyTo={currentUser ? currentUser.email : ''} />
            )}
            </React.Fragment>)}
        </div>
    );
}

// Builds a CSV blob from headers + rows (quote-escaping values that contain
// commas/quotes/newlines) and triggers a browser download. Shared by ExportData
// and BulkUpload's template/failed-rows downloads.
function downloadCSV(filename, headers, rows) {
    // Neutralize CSV/formula injection: a value starting with =, +, - or @ is
    // interpreted as a live formula by Excel/Sheets when the exported file is
    // reopened there. Genuine numbers (e.g. negative amounts) are exempted so they
    // still import as numbers rather than being forced to text.
    const isNumeric = (s) => /^-?\d+(\.\d+)?$/.test(s.trim());
    const esc = (val) => {
        const s = String(val == null ? '' : val);
        const neutralized = (/^[=+\-@]/.test(s) && !isNumeric(s)) ? "'" + s : s;
        return (neutralized.includes(',') || neutralized.includes('"') || neutralized.includes('\n')) ? '"' + neutralized.replace(/"/g, '""') + '"' : neutralized;
    };
    const lines = [headers.map(esc).join(','), ...rows.map(r => r.map(esc).join(','))];
    const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 500);
}

const BULK_UPLOAD_MAX_ROWS = 1000;
const BULK_UPLOAD_MAX_BYTES = 5 * 1024 * 1024;

function BulkUpload({ categories, assetCategories = [], liabilityCategories = [], activeView, onUpdate }) {
    const [activeTab, setActiveTab] = useState('expenses');
    const [parsedRows, setParsedRows] = useState([]);
    const [originalHeaderCols, setOriginalHeaderCols] = useState([]);
    const [fileError, setFileError] = useState('');
    const [selectedFileName, setSelectedFileName] = useState('');
    const [importResult, setImportResult] = useState(null);
    const [isImporting, setIsImporting] = useState(false);
    const [isDragOver, setIsDragOver] = useState(false);
    const [showOnlyErrors, setShowOnlyErrors] = useState(false);
    const [currentPage, setCurrentPage] = useState(1);
    const fileInputRef = React.useRef(null);
    const ROWS_PER_PAGE = 50;

    const validCurrencies = CurrencyService.getAllCurrencies().map(c => c.code);

    const parseCSVLine = (line) => {
        const result = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
            const ch = line[i];
            if (inQuotes) {
                if (ch === '"' && i + 1 < line.length && line[i + 1] === '"') { current += '"'; i++; }
                else if (ch === '"') { inQuotes = false; }
                else { current += ch; }
            } else {
                if (ch === '"') { inQuotes = true; }
                else if (ch === ',') { result.push(current.trim()); current = ''; }
                else { current += ch; }
            }
        }
        result.push(current.trim());
        return result;
    };

    const parseDate = (val) => {
        if (!val) return null;
        let year, month, day;
        if (/^\d{4}-\d{2}-\d{2}$/.test(val)) {
            [year, month, day] = val.split('-').map(Number);
        } else if (/^\d{2}[\/\-]\d{2}[\/\-]\d{4}$/.test(val)) {
            const parts = val.split(/[\/\-]/);
            day = Number(parts[0]); month = Number(parts[1]); year = Number(parts[2]);
        } else {
            return null;
        }
        if (!year || !month || !day || month < 1 || month > 12 || day < 1 || day > 31) return null;
        const pad = n => String(n).padStart(2, '0');
        return `${year}-${pad(month)}-${pad(day)}`;
    };

    // Shared by the file picker and the drag-and-drop zone so both paths go
    // through identical validation and parsing.
    const processFile = (file) => {
        setImportResult(null);
        setFileError('');
        setParsedRows([]);
        setOriginalHeaderCols([]);
        setSelectedFileName(file.name);

        if (file.size > BULK_UPLOAD_MAX_BYTES) {
            setFileError(`This file is ${(file.size / (1024 * 1024)).toFixed(1)}MB, which exceeds the 5MB limit. Please split it into smaller files.`);
            return;
        }

        const reader = new FileReader();
        reader.onload = (evt) => {
            const text = evt.target.result;
            const lines = text.split(/\r?\n/).filter(l => l.trim());
            if (lines.length < 2) { setFileError('The file must contain a header row and at least one data row.'); return; }
            if (lines.length - 1 > BULK_UPLOAD_MAX_ROWS) {
                setFileError(`This file has ${lines.length - 1} rows, which exceeds the ${BULK_UPLOAD_MAX_ROWS}-row limit. Please split it into smaller files.`);
                return;
            }
            setOriginalHeaderCols(parseCSVLine(lines[0]));
            const headers = parseCSVLine(lines[0]).map(h => h.toLowerCase().trim());

            if (activeTab === 'expenses') {
                const colMap = {};
                const expHeaders = ['date', 'amount', 'currency', 'description', 'category', 'sub category', 'paid by', 'payment method', 'bank'];
                expHeaders.forEach(eh => { const idx = headers.indexOf(eh); if (idx !== -1) colMap[eh] = idx; });
                if (colMap['date'] === undefined || colMap['amount'] === undefined || colMap['category'] === undefined || colMap['sub category'] === undefined) {
                    setFileError('Missing required columns: Date, Amount, Category, Sub Category');
                    return;
                }
                const rows = [];
                const today = DateUtils.today();
                for (let i = 1; i < lines.length; i++) {
                    const vals = parseCSVLine(lines[i]);
                    const errors = [];
                    const dateVal = vals[colMap['date']] || '';
                    const amountVal = vals[colMap['amount']] || '';
                    const currencyVal = colMap['currency'] !== undefined ? (vals[colMap['currency']] || '').toUpperCase() : '';
                    const descVal = colMap['description'] !== undefined ? (vals[colMap['description']] || '') : '';
                    const catVal = vals[colMap['category']] || '';
                    const subVal = vals[colMap['sub category']] || '';
                    const paidByVal = colMap['paid by'] !== undefined ? (vals[colMap['paid by']] || '') : '';

                    const parsedDate = parseDate(dateVal);
                    if (!parsedDate) errors.push('Invalid date');
                    else if (parsedDate > today) errors.push('Future date not allowed');

                    const amount = parseFloat(amountVal.replace(/[£$€₹,]/g, ''));
                    if (isNaN(amount) || amount <= 0) errors.push('Invalid amount');

                    const currency = currencyVal || 'GBP';
                    if (!validCurrencies.includes(currency)) errors.push('Invalid currency: ' + currencyVal);

                    const matchedCat = categories.find(c => c.name.toLowerCase() === catVal.toLowerCase());
                    if (!matchedCat) errors.push('Category not found: ' + catVal);
                    let matchedSub = null;
                    if (matchedCat) {
                        matchedSub = matchedCat.subcategories.find(s => s.toLowerCase() === subVal.toLowerCase());
                        if (!matchedSub) errors.push('Subcategory not found: ' + subVal);
                    }

                    const description = descVal || (matchedCat && matchedSub ? matchedCat.name + ' - ' + matchedSub : '');

                    // Payment Method disambiguates "Cash" from "no bank specified" — without it,
                    // an imported expense could never be marked Paid by Cash at all (a blank
                    // Bank column previously always meant "unlinked", never explicitly cash).
                    const methodVal = colMap['payment method'] !== undefined ? (vals[colMap['payment method']] || '').trim().toLowerCase() : '';
                    if (methodVal && methodVal !== 'cash' && methodVal !== 'bank') errors.push('Payment Method must be Cash or Bank');
                    const isCashPayment = methodVal === 'cash';

                    const bankVal = colMap['bank'] !== undefined ? (vals[colMap['bank']] || '').trim() : '';
                    if (methodVal === 'bank' && !bankVal) errors.push('Bank is required when Payment Method is Bank');
                    let accountId = '';
                    if (!isCashPayment && bankVal) {
                        const matchedAccount = DataService.getAccountsForPerson(paidByVal || 'own').find(a => a.accountName.toLowerCase() === bankVal.toLowerCase());
                        if (!matchedAccount) errors.push('Bank account not found: ' + bankVal);
                        else if (matchedAccount.currency !== currency) errors.push(`Bank currency (${matchedAccount.currency}) does not match transaction currency (${currency})`);
                        else accountId = matchedAccount.id;
                    }

                    rows.push({
                        rowNum: i,
                        date: parsedDate,
                        amount: amount,
                        currency: currency,
                        description: description,
                        categoryId: matchedCat ? matchedCat.id : null,
                        categoryName: matchedCat ? matchedCat.name : catVal,
                        subcategory: matchedSub || subVal,
                        paidBy: paidByVal,
                        isCashPayment: isCashPayment,
                        bank: bankVal,
                        accountId: accountId,
                        error: errors.length > 0 ? errors.join('; ') : null,
                        raw: lines[i]
                    });
                }
                setParsedRows(rows);
            } else if (activeTab === 'income') {
                const colMap = {};
                const incHeaders = ['date', 'source of income', 'currency', 'amount', 'description', "who's income", 'bank'];
                incHeaders.forEach(eh => { const idx = headers.indexOf(eh); if (idx !== -1) colMap[eh] = idx; });
                if (colMap['date'] === undefined || colMap['amount'] === undefined || colMap['source of income'] === undefined) {
                    setFileError('Missing required columns: Date, Amount, Source of Income');
                    return;
                }
                const rows = [];
                const today = DateUtils.today();
                for (let i = 1; i < lines.length; i++) {
                    const vals = parseCSVLine(lines[i]);
                    const errors = [];
                    const dateVal = vals[colMap['date']] || '';
                    const sourceVal = vals[colMap['source of income']] || '';
                    const currencyVal = colMap['currency'] !== undefined ? (vals[colMap['currency']] || '').toUpperCase() : '';
                    const amountVal = vals[colMap['amount']] || '';
                    const descVal = colMap['description'] !== undefined ? (vals[colMap['description']] || '') : '';
                    const whosVal = colMap["who's income"] !== undefined ? (vals[colMap["who's income"]] || '') : '';

                    const parsedDate = parseDate(dateVal);
                    if (!parsedDate) errors.push('Invalid date');
                    else if (parsedDate > today) errors.push('Future date not allowed');

                    const amount = parseFloat(amountVal.replace(/[£$€₹,]/g, ''));
                    if (isNaN(amount) || amount <= 0) errors.push('Invalid amount');

                    if (!sourceVal.trim()) errors.push('Source of Income is required');

                    const currency = currencyVal || 'GBP';
                    if (currencyVal && !validCurrencies.includes(currency)) errors.push('Invalid currency: ' + currencyVal);

                    const bankVal = colMap['bank'] !== undefined ? (vals[colMap['bank']] || '').trim() : '';
                    let accountId = '';
                    if (bankVal) {
                        const matchedAccount = DataService.getAccountsForPerson(whosVal || 'own').find(a => a.accountName.toLowerCase() === bankVal.toLowerCase());
                        if (!matchedAccount) errors.push('Bank account not found: ' + bankVal);
                        else if (matchedAccount.currency !== currency) errors.push(`Bank currency (${matchedAccount.currency}) does not match transaction currency (${currency})`);
                        else accountId = matchedAccount.id;
                    }

                    rows.push({
                        rowNum: i,
                        date: parsedDate,
                        amount: amount,
                        currency: currency,
                        source: sourceVal.trim(),
                        description: descVal,
                        paidBy: whosVal,
                        bank: bankVal,
                        accountId: accountId,
                        error: errors.length > 0 ? errors.join('; ') : null,
                        raw: lines[i]
                    });
                }
                setParsedRows(rows);
            } else {
                // Assets ('assets' tab, type 'asset') and Liabilities ('liabilities' tab,
                // type 'liability') share one column schema — the same one ExportData writes —
                // so a file exported from this app reproduces exactly on re-import. Unlike
                // Expense, Sub Category here is free text (not validated against a fixed list —
                // see NetWorth's handleSubmit, which only requires Name and a positive Value).
                const colMap = {};
                // "Funded From Bank" is asset-only (it wires into the Add-Asset "fund from
                // account" feature, which moves money out of a bank account) — Liabilities
                // have no equivalent funding concept, so it's simply not read for that tab.
                const nwHeaders = ['name', 'value', 'currency', 'category', 'sub category', 'original amount', 'person', 'country', 'bank', 'notes', 'funded from bank'];
                nwHeaders.forEach(eh => { const idx = headers.indexOf(eh); if (idx !== -1) colMap[eh] = idx; });
                if (colMap['name'] === undefined || colMap['value'] === undefined || colMap['category'] === undefined) {
                    setFileError('Missing required columns: Name, Value, Category');
                    return;
                }
                const type = activeTab === 'assets' ? 'asset' : 'liability';
                const categoryList = type === 'asset' ? assetCategories : liabilityCategories;
                const rows = [];
                for (let i = 1; i < lines.length; i++) {
                    const vals = parseCSVLine(lines[i]);
                    const errors = [];
                    const nameVal = (vals[colMap['name']] || '').trim();
                    const valueVal = vals[colMap['value']] || '';
                    const currencyVal = colMap['currency'] !== undefined ? (vals[colMap['currency']] || '').toUpperCase() : '';
                    const catVal = vals[colMap['category']] || '';
                    const subVal = colMap['sub category'] !== undefined ? (vals[colMap['sub category']] || '') : '';
                    const origVal = colMap['original amount'] !== undefined ? (vals[colMap['original amount']] || '') : '';
                    const personVal = colMap['person'] !== undefined ? (vals[colMap['person']] || '').trim() : '';
                    const countryVal = colMap['country'] !== undefined ? (vals[colMap['country']] || '') : '';
                    const bankVal = colMap['bank'] !== undefined ? (vals[colMap['bank']] || '').trim() : '';
                    const notesVal = colMap['notes'] !== undefined ? (vals[colMap['notes']] || '') : '';

                    // A Bank value that matches a real account means this row IS that linked
                    // account (a "Bank & Savings"/Credit Card/Loan row from export) — it's
                    // already tracked automatically from the account itself, so re-creating it
                    // as a manual item would double-count. Checked by account name rather than
                    // category name, since a user could file a genuinely manual item under
                    // "Bank & Savings" too. The computed Cash Withdraw figure has no single
                    // account to match against, so it's recognized by its fixed name+category
                    // instead — a low-risk heuristic given how specific that combination is.
                    const isLinkedBankRow = !!bankVal && DataService.getBankAccounts().some(a => a.accountName.toLowerCase() === bankVal.toLowerCase());
                    const isComputedCashRow = type === 'asset' && nameVal.toLowerCase() === 'cash' && catVal.trim().toLowerCase() === 'cash';
                    const skip = isLinkedBankRow || isComputedCashRow;

                    if (!nameVal) errors.push('Name is required');

                    const value = parseFloat(valueVal.replace(/[£$€₹,]/g, ''));
                    if (isNaN(value) || value <= 0) errors.push('Invalid value');

                    const currency = currencyVal || 'GBP';
                    if (currencyVal && !validCurrencies.includes(currency)) errors.push('Invalid currency: ' + currencyVal);

                    const matchedCat = categoryList.find(c => c.name.toLowerCase() === catVal.toLowerCase());
                    if (!matchedCat) errors.push('Category not found: ' + catVal);

                    let originalAmount = null;
                    if (origVal.trim()) {
                        originalAmount = parseFloat(origVal.replace(/[£$€₹,]/g, ''));
                        if (isNaN(originalAmount) || originalAmount <= 0) errors.push('Invalid original amount');
                    }

                    const fundBankVal = (type === 'asset' && colMap['funded from bank'] !== undefined) ? (vals[colMap['funded from bank']] || '').trim() : '';
                    let fundAccountId = '';
                    if (!skip && fundBankVal) {
                        const matchedAccount = DataService.getAccountsForPerson(personVal || 'own').find(a => a.accountName.toLowerCase() === fundBankVal.toLowerCase());
                        if (!matchedAccount) errors.push('Bank account not found: ' + fundBankVal);
                        else if (matchedAccount.currency !== currency) errors.push(`Bank currency (${matchedAccount.currency}) does not match value currency (${currency})`);
                        else fundAccountId = matchedAccount.id;
                    }

                    rows.push({
                        rowNum: i,
                        name: nameVal,
                        value: value,
                        currency: currency,
                        categoryId: matchedCat ? matchedCat.id : null,
                        categoryName: matchedCat ? matchedCat.name : catVal,
                        subcategory: subVal,
                        originalAmount: originalAmount,
                        person: personVal,
                        country: countryVal,
                        bank: bankVal,
                        notes: notesVal,
                        fundBank: fundBankVal,
                        fundAccountId: fundAccountId,
                        skip: skip,
                        // A skipped row isn't going to be imported either way, so it doesn't
                        // need to also be flagged as an error even if something else about it
                        // looks off (e.g. a stale category name from before a rename).
                        error: skip ? null : (errors.length > 0 ? errors.join('; ') : null),
                        raw: lines[i]
                    });
                }
                setParsedRows(rows);
            }
        };
        reader.readAsText(file);
    };

    const handleFileSelect = (e) => {
        const file = e.target.files[0];
        if (file) processFile(file);
    };

    const handleDrop = (e) => {
        e.preventDefault();
        setIsDragOver(false);
        if (isImporting) return;
        const file = e.dataTransfer.files && e.dataTransfer.files[0];
        if (file) processFile(file);
    };

    const handleDownloadTemplate = () => {
        if (activeTab === 'expenses') {
            const exampleCat = categories[0];
            const exampleSub = exampleCat && exampleCat.subcategories && exampleCat.subcategories[0];
            downloadCSV('financetracker-expenses-template.csv',
                ['Date', 'Amount', 'Currency', 'Description', 'Category', 'Sub Category', 'Paid By', 'Payment Method', 'Bank'],
                [['2026-01-15', '25.00', 'GBP', 'Example expense', exampleCat ? exampleCat.name : 'Food & Dining', exampleSub || 'Groceries', '', '', '']]);
        } else if (activeTab === 'income') {
            downloadCSV('financetracker-income-template.csv',
                ['Date', 'Source of Income', 'Currency', 'Amount', 'Description', "Who's Income", 'Bank'],
                [['2026-01-15', 'Salary', 'GBP', '2000.00', 'Example income', '', '']]);
        } else if (activeTab === 'assets') {
            const exampleCat = assetCategories[0];
            downloadCSV('financetracker-assets-template.csv',
                ['Name', 'Value', 'Currency', 'Category', 'Sub Category', 'Original Amount', 'Person', 'Country', 'Bank', 'Notes', 'Funded From Bank'],
                [['Example asset', '1000.00', 'GBP', exampleCat ? exampleCat.name : 'Investment', '', '', '', '', '', '', '']]);
        } else {
            const exampleCat = liabilityCategories[0];
            downloadCSV('financetracker-liabilities-template.csv',
                ['Name', 'Value', 'Currency', 'Category', 'Sub Category', 'Original Amount', 'Person', 'Country', 'Bank', 'Notes'],
                [['Example liability', '1000.00', 'GBP', exampleCat ? exampleCat.name : 'Loans', '', '', '', '', '', '']]);
        }
    };

    const handleDownloadFailedRows = () => {
        const failed = parsedRows.filter(r => r.error);
        if (failed.length === 0) return;
        const headers = [...originalHeaderCols, 'Error'];
        const rows = failed.map(r => [...parseCSVLine(r.raw), r.error]);
        downloadCSV(`financetracker-${activeTab}-failed-rows.csv`, headers, rows);
    };

    const handleImport = async () => {
        setIsImporting(true);
        try {
            const validRows = parsedRows.filter(r => !r.error && !r.skip);
            let imported = 0;
            for (const row of validRows) {
                if (activeTab === 'expenses') {
                    await DataService.addExpense({
                        amount: row.amount,
                        currency: row.currency,
                        date: row.date,
                        description: row.description,
                        categoryId: row.categoryId,
                        subcategory: row.subcategory,
                        paidBy: row.paidBy,
                        isCashPayment: row.isCashPayment,
                        accountId: row.accountId
                    });
                } else if (activeTab === 'income') {
                    await DataService.addIncome({
                        amount: row.amount,
                        currency: row.currency,
                        date: row.date,
                        source: row.source,
                        description: row.description,
                        paidBy: row.paidBy,
                        accountId: row.accountId
                    });
                } else {
                    const newItem = DataService.addNetWorthItem({
                        name: row.name,
                        value: row.value,
                        currency: row.currency,
                        type: activeTab === 'assets' ? 'asset' : 'liability',
                        categoryId: row.categoryId,
                        subcategory: row.subcategory,
                        notes: row.notes,
                        person: row.person,
                        country: row.country,
                        originalAmount: row.originalAmount
                    }, activeView);
                    // Mirrors the Add-Asset form's own "fund from account" behavior: draws the
                    // value out of the chosen bank account via the Transfer ledger (an
                    // investment move, not spending — logged in Summary's Asset Funding table).
                    if (row.fundAccountId) {
                        const account = DataService.getBankAccounts().find(a => a.id === row.fundAccountId);
                        if (account) {
                            DataService.addTransfer({
                                date: DateUtils.today(),
                                fromAccountId: account.id, toAccountId: null,
                                fromAmount: row.value, toAmount: row.value,
                                isOverseas: false, conversionRate: 1, fee: 0,
                                feeExpenseId: null, principalExpenseId: null, recipientIncomeId: null,
                                toAssetId: newItem.id, toAssetName: newItem.name,
                                notes: 'Investment funding — logged for audit'
                            });
                        }
                    }
                }
                imported++;
            }
            const errorCount = parsedRows.filter(r => r.error).length;
            const skippedCount = parsedRows.filter(r => r.skip).length;
            setImportResult({ imported, errors: errorCount, skipped: skippedCount, fileName: selectedFileName });
            setParsedRows([]);
            setSelectedFileName('');
            if (fileInputRef.current) fileInputRef.current.value = '';
            onUpdate();
        } finally {
            setIsImporting(false);
        }
    };

    const validCount = parsedRows.filter(r => !r.error && !r.skip).length;
    const errorCount = parsedRows.filter(r => r.error).length;
    const skippedCount = parsedRows.filter(r => r.skip).length;
    const displayRows = showOnlyErrors ? parsedRows.filter(r => r.error) : parsedRows;
    const totalPages = Math.max(1, Math.ceil(displayRows.length / ROWS_PER_PAGE));
    const pageRows = displayRows.slice((currentPage - 1) * ROWS_PER_PAGE, currentPage * ROWS_PER_PAGE);

    useEffect(() => { setCurrentPage(1); }, [parsedRows, showOnlyErrors]);

    const resetOnTabChange = (tab) => {
        if (isImporting) return;
        setActiveTab(tab);
        setParsedRows([]);
        setFileError('');
        setImportResult(null);
        setSelectedFileName('');
        setShowOnlyErrors(false);
        if (fileInputRef.current) fileInputRef.current.value = '';
    };

    return (
        <div className="screen">
            <div className="screen-header">
                <h2>Bulk Upload</h2>
            </div>
            <ul className="nav nav-tabs" style={{marginBottom: '1rem'}}>
                {/* No "nav-item" class here: the app defines a global .nav-item rule for the
                    bottom navigation bar (flex-column, max-width 70px) that collides with and
                    breaks Bootstrap's unrelated nav-tabs <li> when reusing the same class name. */}
                <li>
                    <button className={'nav-link ' + (activeTab === 'expenses' ? 'active' : '')} onClick={() => resetOnTabChange('expenses')} disabled={isImporting}>Expenses</button>
                </li>
                <li>
                    <button className={'nav-link ' + (activeTab === 'income' ? 'active' : '')} onClick={() => resetOnTabChange('income')} disabled={isImporting}>Income</button>
                </li>
                <li>
                    <button className={'nav-link ' + (activeTab === 'assets' ? 'active' : '')} onClick={() => resetOnTabChange('assets')} disabled={isImporting}>Assets</button>
                </li>
                <li>
                    <button className={'nav-link ' + (activeTab === 'liabilities' ? 'active' : '')} onClick={() => resetOnTabChange('liabilities')} disabled={isImporting}>Liabilities</button>
                </li>
            </ul>

            {importResult && (
                <div className="alert alert-info">
                    <i className="fas fa-check-circle me-2"></i>
                    Imported {importResult.imported} row{importResult.imported !== 1 ? 's' : ''}{importResult.fileName ? <> from <strong>{importResult.fileName}</strong></> : ''}.
                    {importResult.errors > 0 && ` ${importResult.errors} rows had errors and were not imported.`}
                    {importResult.skipped > 0 && ` ${importResult.skipped} rows are already tracked automatically and were not imported.`}
                </div>
            )}

            <div style={{marginBottom: '1rem'}}>
                <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.5rem'}}>
                    <label style={{fontWeight: '600', margin: 0}}>Select CSV File</label>
                    <button type="button" className="btn btn-sm btn-outline-secondary" onClick={handleDownloadTemplate}>
                        <i className="fas fa-download me-1"></i>Download Template
                    </button>
                </div>
                <div
                    onDragOver={e => { e.preventDefault(); if (!isImporting) setIsDragOver(true); }}
                    onDragLeave={() => setIsDragOver(false)}
                    onDrop={handleDrop}
                    style={{
                        border: '2px dashed ' + (isDragOver ? '#4a6cf7' : '#ced4da'),
                        borderRadius: '8px',
                        padding: '0.75rem',
                        background: isDragOver ? '#eef2ff' : 'transparent',
                        transition: 'all 0.15s',
                        opacity: isImporting ? 0.6 : 1
                    }}
                >
                    <input ref={fileInputRef} type="file" className="form-control" accept=".csv" onChange={handleFileSelect} disabled={isImporting} />
                    <div className="form-text mb-0">Drag and drop a CSV file here, or use the picker above.</div>
                </div>
                <div className="form-text">
                    {activeTab === 'expenses'
                        ? 'Columns: Date, Amount, Currency, Description, Category, Sub Category, Paid By, Payment Method, Bank'
                        : activeTab === 'income'
                        ? "Columns: Date, Source of Income, Currency, Amount, Description, Who's Income, Bank"
                        : activeTab === 'assets'
                        ? 'Columns: Name, Value, Currency, Category, Sub Category, Original Amount, Person, Country, Bank, Notes, Funded From Bank'
                        : 'Columns: Name, Value, Currency, Category, Sub Category, Original Amount, Person, Country, Bank, Notes'}
                    {' '}· Max {BULK_UPLOAD_MAX_ROWS} rows, 5MB.
                </div>
            </div>

            {fileError && <div className="alert alert-danger"><i className="fas fa-exclamation-circle me-2"></i>{fileError}</div>}

            {parsedRows.length > 0 && (
                <div>
                    <div style={{marginBottom: '0.75rem', display: 'flex', flexWrap: 'wrap', gap: '0.75rem', alignItems: 'center', justifyContent: 'space-between'}}>
                        <div style={{display: 'flex', gap: '0.75rem', alignItems: 'center', flexWrap: 'wrap'}}>
                            <span className="badge bg-success">{validCount} valid</span>
                            {skippedCount > 0 && <span className="badge bg-secondary">{skippedCount} tracked automatically</span>}
                            {errorCount > 0 && <span className="badge bg-danger">{errorCount} errors</span>}
                            <div className="btn-group btn-group-sm" role="group">
                                <button type="button" className={'btn ' + (!showOnlyErrors ? 'btn-primary' : 'btn-outline-primary')} onClick={() => setShowOnlyErrors(false)}>All</button>
                                <button type="button" className={'btn ' + (showOnlyErrors ? 'btn-primary' : 'btn-outline-primary')} onClick={() => setShowOnlyErrors(true)} disabled={errorCount === 0}>Errors only</button>
                            </div>
                        </div>
                        {errorCount > 0 && (
                            <button type="button" className="btn btn-sm btn-outline-danger" onClick={handleDownloadFailedRows}>
                                <i className="fas fa-download me-1"></i>Download Failed Rows
                            </button>
                        )}
                    </div>

                    <button className="btn btn-primary mb-3" onClick={handleImport} disabled={validCount === 0 || isImporting}>
                        {isImporting
                            ? <><span className="spinner-border spinner-border-sm me-2"></span>Importing...</>
                            : <><i className="fas fa-file-import me-2"></i>Import {validCount} valid row{validCount !== 1 ? 's' : ''}</>
                        }
                    </button>

                    <div style={{overflowX: 'auto', marginBottom: '0.5rem'}}>
                        <table className="table table-sm table-bordered" style={{fontSize: '0.85rem'}}>
                            <thead className="table-light">
                                <tr>
                                    <th>#</th>
                                    {activeTab === 'expenses' ? (
                                        <>{['Date', 'Amount', 'Currency', 'Description', 'Category', 'Subcategory', 'Paid By', 'Payment Method', 'Bank', 'Status'].map(h => <th key={h}>{h}</th>)}</>
                                    ) : activeTab === 'income' ? (
                                        <>{['Date', 'Source', 'Amount', 'Currency', 'Description', "Who's Income", 'Bank', 'Status'].map(h => <th key={h}>{h}</th>)}</>
                                    ) : activeTab === 'assets' ? (
                                        <>{['Name', 'Value', 'Currency', 'Category', 'Sub Category', 'Original Amount', 'Person', 'Country', 'Bank', 'Funded From Bank', 'Status'].map(h => <th key={h}>{h}</th>)}</>
                                    ) : (
                                        <>{['Name', 'Value', 'Currency', 'Category', 'Sub Category', 'Original Amount', 'Person', 'Country', 'Bank', 'Status'].map(h => <th key={h}>{h}</th>)}</>
                                    )}
                                </tr>
                            </thead>
                            <tbody>
                                {pageRows.map((row, idx) => (
                                    <tr key={row.rowNum ?? idx} className={row.skip ? 'table-secondary' : row.error ? 'table-danger' : 'table-success'}>
                                        <td>{row.rowNum}</td>
                                        {activeTab === 'expenses' ? (
                                            <>
                                                <td>{row.date || '-'}</td>
                                                <td>{isNaN(row.amount) ? '-' : row.amount}</td>
                                                <td>{row.currency}</td>
                                                <td>{row.description || '-'}</td>
                                                <td>{row.categoryName || '-'}</td>
                                                <td>{row.subcategory || '-'}</td>
                                                <td>{row.paidBy || '-'}</td>
                                                <td>{row.isCashPayment ? 'Cash' : row.accountId ? 'Bank' : '-'}</td>
                                                <td>{row.bank || '-'}</td>
                                            </>
                                        ) : activeTab === 'income' ? (
                                            <>
                                                <td>{row.date || '-'}</td>
                                                <td>{row.source || '-'}</td>
                                                <td>{isNaN(row.amount) ? '-' : row.amount}</td>
                                                <td>{row.currency}</td>
                                                <td>{row.description || '-'}</td>
                                                <td>{row.paidBy || '-'}</td>
                                                <td>{row.bank || '-'}</td>
                                            </>
                                        ) : activeTab === 'assets' ? (
                                            <>
                                                <td>{row.name || '-'}</td>
                                                <td>{isNaN(row.value) ? '-' : row.value}</td>
                                                <td>{row.currency}</td>
                                                <td>{row.categoryName || '-'}</td>
                                                <td>{row.subcategory || '-'}</td>
                                                <td>{row.originalAmount != null ? row.originalAmount : '-'}</td>
                                                <td>{row.person || '-'}</td>
                                                <td>{row.country || '-'}</td>
                                                <td>{row.bank || '-'}</td>
                                                <td>{row.fundBank || '-'}</td>
                                            </>
                                        ) : (
                                            <>
                                                <td>{row.name || '-'}</td>
                                                <td>{isNaN(row.value) ? '-' : row.value}</td>
                                                <td>{row.currency}</td>
                                                <td>{row.categoryName || '-'}</td>
                                                <td>{row.subcategory || '-'}</td>
                                                <td>{row.originalAmount != null ? row.originalAmount : '-'}</td>
                                                <td>{row.person || '-'}</td>
                                                <td>{row.country || '-'}</td>
                                                <td>{row.bank || '-'}</td>
                                            </>
                                        )}
                                        <td>{row.skip ? <span className="text-muted" style={{fontSize: '0.8rem'}}><i className="fas fa-info-circle me-1"></i>Tracked automatically</span> : row.error ? <span className="text-danger" style={{fontSize: '0.8rem'}}>{row.error}</span> : <i className="fas fa-check text-success"></i>}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                    {totalPages > 1 && (
                        <div className="d-flex justify-content-between align-items-center mb-3" style={{fontSize: '0.85rem'}}>
                            <button className="btn btn-sm btn-outline-secondary" onClick={() => setCurrentPage(p => Math.max(1, p - 1))} disabled={currentPage === 1}>
                                <i className="fas fa-chevron-left me-1"></i>Prev
                            </button>
                            <span className="text-muted">Page {currentPage} of {totalPages}</span>
                            <button className="btn btn-sm btn-outline-secondary" onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))} disabled={currentPage === totalPages}>
                                Next<i className="fas fa-chevron-right ms-1"></i>
                            </button>
                        </div>
                    )}
                </div>
            )}

            {parsedRows.length === 0 && !importResult && !fileError && (
                <div className="text-muted text-center" style={{padding: '2rem', background: '#f8f9fa', borderRadius: '8px'}}>
                    <i className="fas fa-file-csv fa-3x" style={{marginBottom: '0.75rem', display: 'block', opacity: 0.4}}></i>
                    <p>Select a CSV file to preview and import {activeTab === 'expenses' ? 'expenses' : activeTab === 'income' ? 'income' : activeTab === 'assets' ? 'assets' : 'liabilities'}</p>
                </div>
            )}
        </div>
    );
}

// Goal card accents rotate emerald → indigo → amber (display only).
const SP_GOAL_ACCENTS = [['#10b981', '#dcfce7', '#047857'], ['#6366f1', '#eef2ff', '#4f46e5'], ['#d97706', '#fef3c7', '#b45309']];

function SavingsGoals({ defaultCurrency, activeView, onUpdate }) {
    const [goals, setGoals] = useState([]);
    const [monthlyNet, setMonthlyNet] = useState(0);
    const [showForm, setShowForm] = useState(false);
    const [editingGoal, setEditingGoal] = useState(null);
    const [formData, setFormData] = useState({ name: '', targetAmount: '', currency: defaultCurrency || 'GBP', deadline: '', currentSaved: '', emoji: '', notes: '', owner: resolveActiveViewValue(activeView) });
    const [formErrors, setFormErrors] = useState({});
    const [pendingDelete, setPendingDelete] = useState(null);
    const [fundDrafts, setFundDrafts] = useState({}); // goalId -> text
    const [fundError, setFundError] = useState(null); // { id, msg }
    const [showCurrencySheet, setShowCurrencySheet] = useState(false);
    const [toast, setToast] = useState('');
    const _f0 = FilterMemory.load('goals');
    const [filterSyncConflict, setFilterSyncConflict] = useState(!!_f0.syncConflict);
    const [showConflictDetail, setShowConflictDetail] = useState(null);
    const people = DataService.getPeople();

    const loadGoals = () => setGoals(DataService.getGoals());

    useEffect(() => {
        loadGoals();
        const calcMonthlyNet = async () => {
            const now = new Date();
            const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
            const [expenses, income] = await Promise.all([DataService.getExpenses(), DataService.getIncome()]);
            const monthExp = expenses.filter(e => DateUtils.parseDateStr(e.date) >= startOfMonth).reduce((s, e) => s + e.amount, 0);
            const monthInc = income.filter(i => DateUtils.parseDateStr(i.date) >= startOfMonth).reduce((s, i) => s + i.amount, 0);
            setMonthlyNet(Math.max(0, monthInc - monthExp));
        };
        calcMonthlyNet();
    }, []);

    useEffect(() => { FilterMemory.save('goals', { syncConflict: filterSyncConflict }); }, [filterSyncConflict]);
    useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(''), 3000); return () => clearTimeout(t); }, [toast]);

    const resetForm = () => {
        setFormData({ name: '', targetAmount: '', currency: defaultCurrency || 'GBP', deadline: '', currentSaved: '', emoji: '', notes: '', owner: resolveActiveViewValue(activeView) });
        setFormErrors({});
        setEditingGoal(null);
    };
    const closeForm = () => { resetForm(); setShowForm(false); };
    const set = (k, v) => { setFormData(p => ({ ...p, [k]: v })); if (formErrors[k === 'deadline' ? 'deadline' : k]) setFormErrors(p => { const n = { ...p }; delete n[k]; return n; }); };

    const handleSubmit = (e) => {
        if (e) e.preventDefault();
        const errors = {};
        if (!formData.name || formData.name.trim().length < 2) errors.name = 'Name must be at least 2 characters';
        if (!formData.targetAmount || parseFloat(formData.targetAmount) <= 0) errors.targetAmount = 'Target amount must be greater than 0';
        if (formData.deadline && new Date(formData.deadline) <= new Date()) errors.deadline = 'Deadline must be in the future';
        if (!errors.name && editingGoal && DataService.goalNameTaken(formData.name, formData.owner, editingGoal.id)) errors.name = 'This person already has a goal with this name';
        if (Object.keys(errors).length > 0) { setFormErrors(errors); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
        try {
            if (editingGoal) {
                DataService.updateGoal(editingGoal.id, { name: formData.name.trim(), targetAmount: parseFloat(formData.targetAmount), currency: formData.currency, deadline: formData.deadline, notes: formData.notes, emoji: formData.emoji, currentSaved: parseFloat(formData.currentSaved || 0), owner: formData.owner || 'own' });
            } else {
                DataService.addGoal({ name: formData.name.trim(), targetAmount: formData.targetAmount, currency: formData.currency, deadline: formData.deadline, notes: formData.notes, emoji: formData.emoji, currentSaved: formData.currentSaved, owner: formData.owner || 'own' });
            }
            setToast(editingGoal ? 'Goal updated' : formData.name.trim() + ' added');
            closeForm(); loadGoals();
            if (onUpdate) onUpdate();
        } catch (err) { setFormErrors({ name: err.message }); }
    };

    const handleEdit = (goal) => {
        setFormData({ name: goal.name, targetAmount: goal.targetAmount.toString(), currency: goal.currency || defaultCurrency || 'GBP', deadline: goal.deadline || '', currentSaved: goal.currentSaved.toString(), emoji: goal.emoji || '', notes: goal.notes || '', owner: goal.owner || 'own' });
        setFormErrors({}); setEditingGoal(goal); setShowForm(true); setPendingDelete(null);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    const handleDelete = (goal) => { DataService.deleteGoal(goal.id); setPendingDelete(null); setToast(goal.name + ' deleted'); loadGoals(); if (onUpdate) onUpdate(); };

    const handleAddFunds = (goal) => {
        const raw = fundDrafts[goal.id] || '';
        const amount = parseFloat(raw);
        if (!raw || isNaN(amount) || amount <= 0) { setFundError({ id: goal.id, msg: 'Enter a valid amount > 0' }); return; }
        DataService.addToGoal(goal.id, amount);
        setFundDrafts(prev => ({ ...prev, [goal.id]: '' })); setFundError(null);
        setToast(fmt(amount, goal.currency || defaultCurrency) + ' added to ' + goal.name);
        loadGoals();
        if (onUpdate) onUpdate();
    };

    const getProjectedCompletion = (goal) => {
        const remaining = goal.targetAmount - goal.currentSaved;
        if (remaining <= 0 || monthlyNet <= 0) return null;
        const projDate = new Date();
        projDate.setMonth(projDate.getMonth() + Math.ceil(remaining / monthlyNet));
        return projDate.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
    };
    const daysLeft = (deadline) => deadline ? Math.ceil((new Date(deadline) - new Date()) / (1000 * 60 * 60 * 24)) : null;

    // Whole numbers without decimals, otherwise up to 2 — always in the goal's own currency.
    const fmt = (amount, currency) => {
        const cur = currency || defaultCurrency;
        const n = Number(amount) || 0;
        return (n < 0 ? '−' : '') + ValidationUtils.getCurrencySymbol(cur) + Math.abs(n).toLocaleString(cur === 'INR' ? 'en-IN' : 'en-GB', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    };
    const visibleGoals = goals.filter(g => matchesActiveView(g.owner, activeView));
    const syncConflicts = useMemo(() => SyncConflicts.read('goals'), [goals]);
    const displayGoals = filterSyncConflict ? visibleGoals.filter(g => !!syncConflicts[String(g.id)]) : visibleGoals;
    const conflictGoal = showConflictDetail ? goals.find(g => g.id === showConflictDetail) : null;
    const conflictSnapshot = showConflictDetail ? syncConflicts[String(showConflictDetail)] : null;
    const goalConflictFieldLabels = { name: 'Name', targetAmount: 'Target Amount', currency: 'Currency', deadline: 'Deadline', notes: 'Notes', emoji: 'Emoji', currentSaved: 'Currently Saved', owner: 'Owner' };
    const formatGoalConflictValue = (key, value) => {
        if ((key === 'targetAmount' || key === 'currentSaved') && value !== undefined && value !== null) return fmt(value, (conflictGoal && conflictGoal.currency) || defaultCurrency);
        return value === undefined || value === null || value === '' ? '—' : String(value);
    };
    const handleResolveConflict = (useCloud) => {
        const goalId = showConflictDetail;
        const updates = useCloud && conflictSnapshot ? conflictSnapshot.cloudSnapshot : {};
        DataService.updateGoal(goalId, updates);
        SyncConflicts.dismiss('goals', goalId);
        setShowConflictDetail(null);
        loadGoals(); if (onUpdate) onUpdate();
    };

    const chipCurrencies = [...new Set([defaultCurrency || 'GBP', 'USD', 'EUR', formData.currency])].slice(0, 4);
    const moreCount = Math.max(0, CurrencyService.getAllCurrencies().length - chipCurrencies.length);
    const sym = ValidationUtils.getCurrencySymbol(formData.currency);
    const formError = formErrors.name || formErrors.targetAmount || formErrors.deadline;

    return (
        <div className="sp-page sp-goalspage">
            <div className="sp-page-kicker">You're saving</div>
            <h2 className="sp-page-title" style={{marginBottom: '12px'}}>Goals</h2>
            {toast && <div className="sp-alert sp-alert-ok"><i className="fas fa-circle-check"></i><span>{toast}</span></div>}
            {Object.keys(syncConflicts).length > 0 && (
                <label className="sp-check" style={{margin: '0 4px 10px'}}>
                    <input type="checkbox" checked={filterSyncConflict} onChange={(e) => setFilterSyncConflict(e.target.checked)} />
                    <i className="fas fa-code-compare" style={{color: '#4f46e5'}}></i>Sync conflicts only
                </label>
            )}

            {showForm && (
                <form className="sp-goalform" onSubmit={handleSubmit} noValidate>
                    <div className="sp-goalform-title">{editingGoal ? 'Edit goal' : 'New goal'}</div>
                    {formError && <div className="sp-alert sp-alert-err" style={{marginTop: '8px'}}><i className="fas fa-circle-exclamation"></i><span>{formError}</span></div>}
                    <div className={'sp-formrow' + (formErrors.name ? ' is-bad' : '')}><span>Name</span><input type="text" value={formData.name} placeholder="e.g. Holiday" onChange={e => set('name', e.target.value)} /></div>
                    <div className="sp-formrow"><span>Emoji</span><input type="text" value={formData.emoji} placeholder="✈️" maxLength={2} onChange={e => set('emoji', e.target.value)} style={{width: '60px', fontSize: '18px'}} /></div>
                    <div className="sp-formrow">
                        <span>Currency</span>
                        <div className="sp-curchips is-light">
                            {chipCurrencies.map(code => (
                                <button key={code} type="button" className={'sp-curchip' + (formData.currency === code ? ' is-active' : '')} onClick={() => set('currency', code)}>
                                    {formData.currency === code ? ValidationUtils.getCurrencySymbol(code) + ' ' + code : code}
                                </button>
                            ))}
                            {moreCount > 0 && <button type="button" className="sp-curchip" onClick={() => setShowCurrencySheet(true)}>+{moreCount} more<i className="fas fa-chevron-down" style={{fontSize: '9px'}}></i></button>}
                        </div>
                    </div>
                    <div className={'sp-formrow' + (formErrors.targetAmount ? ' is-bad' : '')}>
                        <span>Target</span>
                        <span className="sp-moneyin"><span>{sym}</span><input type="number" step="0.01" min="0.01" inputMode="decimal" placeholder="0" value={formData.targetAmount} onChange={e => set('targetAmount', e.target.value)} /></span>
                    </div>
                    <div className="sp-formrow">
                        <span>Already saved<small className="sp-formrow-hint">Money you've already put aside</small></span>
                        <span className="sp-moneyin"><span>{sym}</span><input type="number" step="0.01" min="0" inputMode="decimal" placeholder="0" value={formData.currentSaved} onChange={e => set('currentSaved', e.target.value)} /></span>
                    </div>
                    <div className={'sp-formrow' + (formErrors.deadline ? ' is-bad' : '')}><span>Target date</span><input type="date" value={formData.deadline} onChange={e => set('deadline', e.target.value)} /></div>
                    <div className="sp-formblock">
                        <div className="sp-formblock-label">Note</div>
                        <textarea className="sp-textarea" rows={2} style={{marginTop: '8px'}} value={formData.notes} placeholder="Optional · what this goal is for" onChange={e => set('notes', e.target.value)} />
                    </div>
                    <div className="sp-formrow">
                        <span>Goal owner</span>
                        {activeView.length > 1
                            ? <PersonSelect value={formData.owner === 'own' ? '' : formData.owner} onChange={v => set('owner', v)} activeView={activeView} className="" ownLabel="You" />
                            : <span className="sp-lockedval">{spOwnerChip(formData.owner, people)}<i className="fas fa-lock"></i></span>}
                    </div>
                    <button type="button" className="sp-btn sp-btn-soft" style={{width: '100%', marginTop: '10px'}} onClick={closeForm}>Cancel</button>
                    <PinnedCta type="submit" label={editingGoal ? 'Save changes' : 'Save goal'} icon="fas fa-check" />
                </form>
            )}

            {visibleGoals.length === 0 && !showForm ? (
                <div className="sp-empty"><i className="fas fa-piggy-bank"></i>No savings goals yet. Create your first one.</div>
            ) : displayGoals.map((goal, idx) => {
                const [accent, tint, ink] = SP_GOAL_ACCENTS[idx % SP_GOAL_ACCENTS.length];
                const currency = goal.currency || defaultCurrency;
                const pct = goal.targetAmount > 0 ? Math.min((goal.currentSaved / goal.targetAmount) * 100, 100) : 0;
                const reached = goal.currentSaved >= goal.targetAmount;
                const left = daysLeft(goal.deadline);
                const projected = getProjectedCompletion(goal);
                const conflict = syncConflicts[String(goal.id)];
                const cfOpen = showConflictDetail === goal.id;
                const meta = reached ? 'Goal reached 🎉'
                    : fmt(goal.targetAmount - goal.currentSaved, currency) + ' to go' + (left === null ? '' : left < 0 ? ' · overdue by ' + Math.abs(left) + ' day' + (Math.abs(left) === 1 ? '' : 's') : ' · ' + left + ' day' + (left === 1 ? '' : 's') + ' left');
                return (
                    <div key={goal.id} className="sp-goalcard">
                        <div className="sp-goalhead">
                            <span className="sp-goalemoji">{goal.emoji || <i className="fas fa-piggy-bank" style={{color: accent, fontSize: '22px'}}></i>}</span>
                            <div className="sp-goalmain">
                                <div className="sp-schedtitle">
                                    <span style={{fontSize: '16px', fontWeight: 800}}>{goal.name}</span>
                                    {conflict && <button type="button" className={'sp-cfbtn' + (cfOpen ? ' is-open' : '')} title="Sync conflict · tap to compare" onClick={() => setShowConflictDetail(cfOpen ? null : goal.id)}><i className="fas fa-code-compare"></i></button>}
                                </div>
                                <div className="sp-goalamts">{fmt(goal.currentSaved, currency)} / {fmt(goal.targetAmount, currency)}</div>
                            </div>
                            <div className="sp-goalbadges">
                                <span className="sp-goalcur">{currency}</span>
                                <span className="sp-goalpct" style={{background: tint, color: ink}}>{Math.round(pct)}%</span>
                            </div>
                        </div>
                        <div className="sp-bar" style={{height: '8px', marginTop: '14px'}}><div style={{width: pct + '%', background: accent}}></div></div>
                        <div className="sp-goalmeta" style={{color: !reached && left !== null && left < 0 ? '#e11d48' : undefined}}>{meta}</div>
                        {activeView.length > 1 && <div style={{marginTop: '6px'}}>{spOwnerChip(goal.owner, people)}</div>}
                        {projected && !reached && <div className="sp-goalnote"><i className="fas fa-calendar-check"></i>Projected: {projected} at current saving rate</div>}
                        {goal.notes && <div className="sp-goalnote"><i className="fas fa-note-sticky"></i>{goal.notes}</div>}
                        {cfOpen && conflictGoal && conflictSnapshot && (
                            <div style={{marginTop: '10px'}}>
                                <ConflictCompare localRecord={conflictGoal} cloudSnapshot={conflictSnapshot.cloudSnapshot} detectedAt={conflictSnapshot.detectedAt} fieldLabels={goalConflictFieldLabels} formatValue={formatGoalConflictValue} onKeepLocal={() => handleResolveConflict(false)} onUseCloud={() => handleResolveConflict(true)} />
                            </div>
                        )}
                        <form className="sp-goalactions" noValidate onSubmit={e => { e.preventDefault(); handleAddFunds(goal); }}>
                            <input type="number" step="0.01" min="0.01" inputMode="decimal" placeholder={'Add funds (' + ValidationUtils.getCurrencySymbol(currency) + ')'}
                                value={fundDrafts[goal.id] || ''} onChange={e => { const v = e.target.value; setFundDrafts(prev => ({ ...prev, [goal.id]: v })); if (fundError) setFundError(null); }} />
                            <button type="submit" className="sp-goaladd" style={{background: accent}}>Add</button>
                            <button type="button" className="sp-subbtn" style={{width: '38px', height: '42px'}} onClick={() => handleEdit(goal)} title="Edit"><i className="fas fa-pen"></i></button>
                            <button type="button" className="sp-subbtn" style={{width: '38px', height: '42px'}} onClick={() => setPendingDelete(pendingDelete === goal.id ? null : goal.id)} title="Delete"><i className="fas fa-trash"></i></button>
                        </form>
                        {fundError && fundError.id === goal.id && <div className="sp-suberror">{fundError.msg}</div>}
                        {pendingDelete === goal.id && (
                            <div style={{marginTop: '10px'}}>
                                <InlineConfirm text={'Delete ' + (goal.emoji ? goal.emoji + ' ' : '') + goal.name + '? This cannot be undone.'} keepLabel="Cancel" cta="Delete" onKeep={() => setPendingDelete(null)} onConfirm={() => handleDelete(goal)} />
                            </div>
                        )}
                    </div>
                );
            })}

            {!showForm && <PinnedCta label="New Goal" icon="fas fa-piggy-bank" onClick={() => { resetForm(); setShowForm(true); setPendingDelete(null); window.scrollTo({ top: 0, behavior: 'smooth' }); }} />}
            {showCurrencySheet && <CurrencySheet value={formData.currency} onPick={c => { set('currency', c); setShowCurrencySheet(false); }} onClose={() => setShowCurrencySheet(false)} />}
        </div>
    );
}

// ── Scheduled (Phase 5): shared bits for Bills / Recurring / Debts ───────────
const SP_BILL_FREQ_MONTHLY = { Weekly: 4.33, Monthly: 1, Quarterly: 1 / 3, Yearly: 1 / 12 };
const SP_SCHED_FREQ_MONTHLY = { daily: 30.44, weekly: 4.33, monthly: 1, quarterly: 1 / 3, yearly: 1 / 12 };
const SP_REMIND_CHOICES = [0, 1, 3, 7, 14];
const spShortDate = (d) => d ? DateUtils.parseDateStr(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }).replace(/\bSept\b/, 'Sep') : '';
const spLongDate = (d) => d ? DateUtils.parseDateStr(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }).replace(/\bSept\b/, 'Sep') : '';
// Day + month, adding the year only when it isn't the current one.
const spDueDate = (d) => d && d.slice(0, 4) !== DateUtils.today().slice(0, 4) ? spLongDate(d) : spShortDate(d);
const spDaysFrom = (today, d) => Math.round((DateUtils.parseDateStr(d) - DateUtils.parseDateStr(today)) / 86400000);
// Visibility rules shared by the list tabs and the Scheduled stat tiles (unchanged from before).
const spBillVisible = (b, activeView) => !b.person || matchesActiveView(b.person, activeView) || (b.createdInView || []).some(v => activeView.includes(v));
const spScheduleVisible = (s, activeView) => {
    const t = s.templateExpense || {};
    return matchesActiveView(s.type === 'asset' || s.type === 'liability' ? t.person : t.paidBy, activeView);
};
const spScheduleEnded = (s, today) => !!(s.endDate && today > s.endDate);

function spOwnerChip(person, people) {
    const key = person && person !== 'own' ? person : 'own';
    const name = key === 'own' ? 'You' : key;
    const oc = spPersonColor(key, people);
    return <span className="sp-ownerchip" style={{background: oc[0], color: oc[1]}}><span className="sp-ownerchip-dot" style={{background: oc[1]}}>{name.charAt(0).toUpperCase()}</span>{name}</span>;
}

// Expanded-row action bar: icon tile over a small label (design's inline expand pattern).
function SpActBar({ actions }) {
    return (
        <div className="sp-actbar">
            {actions.filter(Boolean).map(a => (
                <button key={a.key} type="button" className="sp-actbar-item" onClick={a.onClick}>
                    <span className={'sp-actbar-icon is-' + a.tone}><i className={a.icon}></i></span>
                    <span className="sp-actbar-label">{a.label}</span>
                </button>
            ))}
        </div>
    );
}

function SpSheetHead({ icon, tint, ink, title, sub }) {
    return (
        <div className="sp-sheethead">
            <span className="sp-sheethead-icon" style={{background: tint, color: ink}}><i className={icon}></i></span>
            <div style={{minWidth: 0}}><div className="sp-sheet-title">{title}</div>{sub && <div className="sp-sheethead-sub">{sub}</div>}</div>
        </div>

}

// Category chips + sub-category row, used by the bill form and the mark-paid / settle sheets.
function SpCategoryPicker({ categories, categoryId, subcategory, onChange, required, bad }) {
    const cat = categories.find(c => String(c.id) === String(categoryId));
    const subs = (cat && cat.subcategories) || [];
    return (
        <React.Fragment>
            <div className="sp-catchips">
                {categories.map((c, i) => {
                    const on = String(c.id) === String(categoryId);
                    const look = spCategoryLook(c, i);
                    return (
                        <button key={c.id} type="button" className={'sp-catchip' + (on ? ' is-active' : '') + (bad && !categoryId ? ' is-bad' : '')}
                            onClick={() => onChange(on && !required ? '' : String(c.id), '')}>
                            <i className={look.icon} style={{color: on ? '#34d399' : look.ink}}></i>{c.name}
                        </button>
                    );
                })}
            </div>

                <div className="sp-formcard" style={{marginTop: '12px'}}>

                        <span>Sub category</span>
                        <select value={subcategory} onChange={e => onChange(String(categoryId), e.target.value)}>
                            <option value="">{required ? 'Select' : 'None'}</option>

                        </select>
                    </div>
                </div>
            )}

}

// Mirrors DataService.markBillPaid's frequency-based advancement.
const spBillNextDue = (bill) => {
    const delta = bill.frequency === 'Weekly' ? { days: 7 } : bill.frequency === 'Monthly' ? { months: 1 } : bill.frequency === 'Quarterly' ? { months: 3 } : bill.frequency === 'Yearly' ? { years: 1 } : {};
    return DateUtils.addToDateStr(bill.nextDueDate, delta);
};

function BillPaySheet({ bill, categories, onClose, onPaid }) {
    const today = DateUtils.today();
    const [categoryId, setCategoryId] = useState(bill.categoryId ? String(bill.categoryId) : '');
    const [subcategory, setSubcategory] = useState(bill.subcategory || '');
    const [busy, setBusy] = useState(false);
    const origCat = categories.find(c => c.id === bill.categoryId);
    // Same check as before: no category, or a category with sub-categories but none picked.
    const needsPick = !bill.categoryId || !origCat || (origCat.subcategories && origCat.subcategories.length > 0 && !bill.subcategory);
    const cat = categories.find(c => String(c.id) === String(categoryId));
    const catHasSubs = !!(cat && cat.subcategories && cat.subcategories.length > 0);
    const canLog = !!categoryId && (!catHasSubs || !!subcategory);
    const nextDue = spBillNextDue(bill);

    const logAndPay = async () => {
        if (!canLog || busy) return;
        setBusy(true);
        try {
            await DataService.addExpense({ amount: bill.amount, date: today, description: bill.name, categoryId: parseInt(categoryId), subcategory: subcategory || '', currency: bill.currency || 'GBP', paidBy: '' });
            DataService.updateBill(bill.id, { categoryId: parseInt(categoryId), subcategory: subcategory || '', nextDueDate: nextDue, isPaid: false });
            onPaid(bill.name + ' logged as an expense · next due ' + spShortDate(nextDue));
        } catch (e) { onPaid('Failed to log expense'); }
    };
    const payOnly = () => { DataService.markBillPaid(bill.id); onPaid(bill.name + ' marked paid · next due ' + spShortDate(nextDue)); };

    return (
        <Sheet onClose={onClose}>
            <SpSheetHead icon="fas fa-check" tint="#dcfce7" ink="#16a34a" title={'Mark ' + bill.name + ' as paid'} sub={'Next due moves to ' + spShortDate(nextDue)} />
            <div className="sp-sheet-q">Log this payment as an expense?</div>
            {needsPick ? (
                <React.Fragment>
                    <div className="sp-alert sp-alert-warn" style={{marginBottom: 0}}><i className="fas fa-circle-info"></i><span>{bill.categoryId && origCat ? 'Pick a sub category to log this expense.' : 'This bill has no category yet. Pick one to log it as an expense.'}</span></div>
                    <div className="sp-formlabel">Expense category</div>
                    <SpCategoryPicker categories={categories} categoryId={categoryId} subcategory={subcategory} required onChange={(c, s) => { setCategoryId(c); setSubcategory(s); }} />
                    <div className="sp-formcard" style={{marginTop: '12px'}}>
                        <div className="sp-formrow"><span>Amount</span><b>{ValidationUtils.formatCurrency(bill.amount, bill.currency || 'GBP')}</b></div>
                        <div className="sp-formrow"><span>Date</span><b>Today, {spShortDate(today)}</b></div>
                    </div>
                </React.Fragment>
            ) : (
                <div className="sp-formcard" style={{marginTop: 0}}>
                    <div className="sp-formrow"><span>Amount</span><b style={{fontSize: '15px', fontWeight: 800}}>{ValidationUtils.formatCurrency(bill.amount, bill.currency || 'GBP')}</b></div>
                    <div className="sp-formrow"><span>Category</span><b>{origCat.name}</b></div>
                    {bill.subcategory && <div className="sp-formrow"><span>Sub category</span><b>{bill.subcategory}</b></div>}
                    <div className="sp-formrow"><span>Date</span><b>Today, {spShortDate(today)}</b></div>
                </div>
            )}
            <div className="sp-sheet-actions">
                <button type="button" className="sp-btn sp-btn-primary" disabled={!canLog || busy} onClick={logAndPay}><i className="fas fa-receipt"></i>Mark paid &amp; log expense</button>
                <div className="sp-btn-row">
                    <button type="button" className="sp-btn sp-btn-cancel" onClick={onClose}>Cancel</button>
                    <button type="button" className="sp-btn sp-btn-white" onClick={payOnly} disabled={busy}>Mark paid only</button>
                </div>
            </div>
        </Sheet>
    );
}

function BillFormSheet({ bill, categories, activeView, onClose, onSaved }) {
    const today = DateUtils.today();
    const people = DataService.getPeople();
    const [f, setF] = useState(() => bill
        ? { name: bill.name, amount: bill.amount.toString(), currency: bill.currency || 'GBP', frequency: bill.frequency || 'Monthly', nextDueDate: bill.nextDueDate, categoryId: bill.categoryId ? bill.categoryId.toString() : '', subcategory: bill.subcategory || '', reminderDaysBefore: bill.reminderDaysBefore == null ? 3 : Number(bill.reminderDaysBefore), notes: bill.notes || '', person: bill.person || 'own' }
        : { name: '', amount: '', currency: 'GBP', frequency: 'Monthly', nextDueDate: today, categoryId: '', subcategory: '', reminderDaysBefore: 3, notes: '', person: resolveActiveViewValue(activeView) || 'own' });
    const [errors, setErrors] = useState({});
    const [showCurrency, setShowCurrency] = useState(false);
    const set = (k, v) => setF(p => ({ ...p, [k]: v }));
    const remind = Number(f.reminderDaysBefore) || 0;
    const remindChoices = SP_REMIND_CHOICES.includes(remind) ? SP_REMIND_CHOICES : [...SP_REMIND_CHOICES, remind].sort((a, b) => a - b);

    const save = () => {
        const e = {};
        if (!f.name || f.name.trim().length < 2) e.name = 'Name must be at least 2 characters';
        if (!f.amount || parseFloat(f.amount) <= 0) e.amount = 'Amount must be greater than 0';
        if (!f.nextDueDate || f.nextDueDate < today) e.nextDueDate = 'Due date must be today or in the future';
        if (Object.keys(e).length > 0) { setErrors(e); return; }
        try {
            if (bill) {
                DataService.updateBill(bill.id, { name: f.name.trim(), amount: parseFloat(f.amount), currency: f.currency, frequency: f.frequency, nextDueDate: f.nextDueDate, categoryId: parseInt(f.categoryId) || null, subcategory: f.subcategory || '', reminderDaysBefore: remind, notes: f.notes, person: f.person || 'own' });
            } else {
                DataService.addBill({ name: f.name.trim(), amount: f.amount, currency: f.currency, frequency: f.frequency, nextDueDate: f.nextDueDate, categoryId: f.categoryId, subcategory: f.subcategory, reminderDaysBefore: remind, notes: f.notes, person: f.person || 'own', createdInView: activeView });
            }
            onSaved(bill ? 'Bill updated' : f.name.trim() + ' added');
        } catch (err) { setErrors({ name: err.message }); }
    };
    const firstError = errors.name || errors.amount || errors.nextDueDate;
    const remindOn = remind > 0 && f.nextDueDate ? DateUtils.addToDateStr(f.nextDueDate, { days: -remind }) : '';

    return (
        <Sheet onClose={onClose} footer={<React.Fragment>
            <button type="button" className="sp-btn sp-btn-cancel" onClick={onClose}>Cancel</button>
            <button type="button" className="sp-btn sp-btn-primary sp-btn-grow" onClick={save}><i className="fas fa-check"></i>{bill ? 'Save changes' : 'Save bill'}</button>
        </React.Fragment>}>
            <SpSheetHead icon="fas fa-file-invoice" tint="#fef3c7" ink="#d97706" title={bill ? 'Edit bill' : 'Add bill'} sub="Scheduled payment with reminder" />
            {firstError && <div className="sp-alert sp-alert-err"><i className="fas fa-circle-exclamation"></i><span>{firstError}</span></div>}
            <div className="sp-formcard" style={{marginTop: 0}}>
                <div className={'sp-formrow' + (errors.name ? ' is-bad' : '')}><span>Bill name</span><input type="text" value={f.name} placeholder="e.g. Water" onChange={e => set('name', e.target.value)} /></div>
                <div className="sp-formrow">
                    <span>Bill owner</span>
                    {activeView.length > 1
                        ? <PersonSelect value={f.person === 'own' ? '' : f.person} onChange={v => set('person', v || 'own')} activeView={activeView} className="" ownLabel="You" />
                        : <span className="sp-lockedval">{spOwnerChip(f.person, people)}<i className="fas fa-lock"></i></span>}
                </div>
                <div className="sp-formrow"><span>Currency</span><button type="button" className="sp-rowpick" onClick={() => setShowCurrency(true)}>{f.currency}<i className="fas fa-chevron-down"></i></button></div>
                <div className={'sp-formrow' + (errors.amount ? ' is-bad' : '')}>
                    <span>Amount</span>
                    <span className="sp-moneyin"><span>{ValidationUtils.getCurrencySymbol(f.currency)}</span><input type="number" step="0.01" min="0.01" inputMode="decimal" placeholder="0.00" value={f.amount} onChange={e => set('amount', e.target.value)} /></span>
                </div>
                <div className="sp-formblock">
                    <div className="sp-formblock-label">Frequency</div>
                    <div className="sp-seg is-light" style={{marginTop: '8px'}}>
                        {['Weekly', 'Monthly', 'Quarterly', 'Yearly'].map(q => <button key={q} type="button" className={f.frequency === q ? 'is-active' : ''} onClick={() => set('frequency', q)}>{q}</button>)}
                    </div>
                </div>
                <div className={'sp-formrow' + (errors.nextDueDate ? ' is-bad' : '')}><span>Next due date</span><input type="date" value={f.nextDueDate} min={today} onChange={e => set('nextDueDate', e.target.value)} /></div>
            </div>
            <div className="sp-formlabel">Expense category</div>
            <SpCategoryPicker categories={categories} categoryId={f.categoryId} subcategory={f.subcategory} onChange={(c, s) => setF(p => ({ ...p, categoryId: c, subcategory: s }))} />
            <div className="sp-formcard" style={{marginTop: '12px'}}>
