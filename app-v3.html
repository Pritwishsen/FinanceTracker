                                <input type="text" className={'form-control mb-2' + (nameError ? ' is-invalid' : '')} value={newName} onChange={e => { setNewName(e.target.value); setNameError(''); }} autoFocus />
                                {nameError && <div className="invalid-feedback d-block mb-2">{nameError}</div>}
                                <div className="d-flex gap-2">
                                    <button className="btn btn-primary btn-sm fw-semibold" onClick={handleSaveName} disabled={nameSaving} style={gradientBtn}>{nameSaving ? 'Saving…' : 'Save'}</button>
                                    <button className="btn btn-outline-secondary btn-sm" onClick={() => { setEditingName(false); setNewName(user.displayName || ''); setNameError(''); }}>Cancel</button>
                                </div>
                            </div>
                        ) : (
                            <div className="d-flex align-items-center gap-2">
                                <span className="fw-semibold">{user.displayName}</span>
                                <button className="btn btn-outline-secondary btn-sm" onClick={() => { setEditingName(true); setNewName(user.displayName || ''); }}><i className="fas fa-pencil-alt me-1"></i>Edit</button>
                            </div>
                        )}
                    </div>
                    <div className="mb-3">
                        <label className="form-label fw-semibold small text-muted text-uppercase" style={{fontSize: '0.7rem', letterSpacing: '0.05em'}}>Email</label>
                        <div className="p-2 rounded bg-light text-muted small">{user.email || '—'}</div>
                    </div>
                    <div className="mb-3">
                        <label className="form-label fw-semibold small text-muted text-uppercase" style={{fontSize: '0.7rem', letterSpacing: '0.05em'}}>Sign-in Method</label>
                        <div className="p-2 rounded bg-light text-muted small">{providerLabel[user.authProvider] || user.authProvider || '—'}</div>
                    </div>
                    <div>
                        <label className="form-label fw-semibold small text-muted text-uppercase" style={{fontSize: '0.7rem', letterSpacing: '0.05em'}}>Account Created</label>
                        <div className="p-2 rounded bg-light text-muted small">{createdDate}</div>
                    </div>
                </div>
            </div>

            {user.authProvider === 'email' && (
                <div className="card mb-3 shadow-sm">
                    <div className="card-header fw-semibold"><i className="fas fa-lock me-2 text-primary"></i>Change Password</div>
                    <div className="card-body">
                        {pwError && <div className="alert alert-danger py-2 small mb-3">{pwError}</div>}
                        {pwSuccess && <div className="alert alert-success py-2 small mb-3">{pwSuccess}</div>}
                        <div className="mb-3">
                            <label className="form-label fw-semibold small">Current Password</label>
                            <div className="input-group">
                                <input type={showCurrPw ? 'text' : 'password'} className="form-control" value={currPw} onChange={e => { setCurrPw(e.target.value); setPwError(''); }} autoComplete="current-password" />
                                <button type="button" className="btn btn-outline-secondary" onClick={() => setShowCurrPw(v => !v)} tabIndex={-1}><i className={'fas fa-' + (showCurrPw ? 'eye-slash' : 'eye')}></i></button>
                            </div>
                        </div>
                        <div className="mb-3">
                            <label className="form-label fw-semibold small">New Password <span className="text-muted fw-normal">(min. 8 characters)</span></label>
                            <div className="input-group">
                                <input type={showNewPw ? 'text' : 'password'} className="form-control" value={newPw} onChange={e => { setNewPw(e.target.value); setPwError(''); }} autoComplete="new-password" />
                                <button type="button" className="btn btn-outline-secondary" onClick={() => setShowNewPw(v => !v)} tabIndex={-1}><i className={'fas fa-' + (showNewPw ? 'eye-slash' : 'eye')}></i></button>
                            </div>
                        </div>
                        <div className="mb-3">
                            <label className="form-label fw-semibold small">Confirm New Password</label>
                            <div className="input-group">
                                <input type={showConfirmPw ? 'text' : 'password'} className="form-control" value={confirmPw} onChange={e => { setConfirmPw(e.target.value); setPwError(''); }} autoComplete="new-password" />
                                <button type="button" className="btn btn-outline-secondary" onClick={() => setShowConfirmPw(v => !v)} tabIndex={-1}><i className={'fas fa-' + (showConfirmPw ? 'eye-slash' : 'eye')}></i></button>
                            </div>
                        </div>
                        <button className="btn btn-primary w-100 fw-semibold" onClick={handleChangePw} style={gradientBtn}>Change Password</button>
                    </div>
                </div>
            )}

            <div className="card shadow-sm">
                <div className="card-body text-center">
                    <p className="text-muted small mb-3">Your expenses, income and settings stay on this device — only your session is cleared.</p>
                    <button className="btn btn-danger w-100 fw-semibold py-2" onClick={() => setShowLogoutConfirm(true)}><i className="fas fa-sign-out-alt me-2"></i>Log Out</button>
                </div>
            </div>

            {showLogoutConfirm && (
                <div className="modal show d-block" style={{backgroundColor: 'rgba(0,0,0,0.5)'}}>
                    <div className="modal-dialog modal-dialog-centered">
                        <div className="modal-content">
                            <div className="modal-header"><h5 className="modal-title"><i className="fas fa-sign-out-alt me-2"></i>Log Out</h5></div>
                            <div className="modal-body"><p className="mb-0">Are you sure you want to log out? Your data will remain safe on this device.</p></div>
                            <div className="modal-footer">
                                <button className="btn btn-secondary" onClick={() => setShowLogoutConfirm(false)}>Cancel</button>
                                <button className="btn btn-danger fw-semibold" onClick={handleLogoutConfirm}>Log Out</button>
                            </div>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

function MonthlyTrends({ expenses, income, categories, defaultCurrency, onMonthSelect }) {
    const [timeWindow, setTimeWindow] = useState(() => sessionStorage.getItem('trends_timeWindow') || '6m');
    const [selectedCategory, setSelectedCategory] = useState(() => sessionStorage.getItem('trends_category') || '');
    const [chartSeriesFilter, setChartSeriesFilter] = useState('both'); // 'both' | 'income' | 'expense'
    const [expanded, setExpanded] = useState({});
    // Custom time period: month+year only (no day-level picker), same shape as Summary's.
    const [customFromMonth, setCustomFromMonth] = useState(() => { const v = sessionStorage.getItem('trends_customFromMonth'); return v !== null ? parseInt(v) : new Date().getMonth(); });
    const [customFromYear, setCustomFromYear] = useState(() => { const v = sessionStorage.getItem('trends_customFromYear'); return v !== null ? parseInt(v) : new Date().getFullYear(); });
    const [customToMonth, setCustomToMonth] = useState(() => { const v = sessionStorage.getItem('trends_customToMonth'); return v !== null ? parseInt(v) : new Date().getMonth(); });
    const [customToYear, setCustomToYear] = useState(() => { const v = sessionStorage.getItem('trends_customToYear'); return v !== null ? parseInt(v) : new Date().getFullYear(); });

    const setTw = (v) => { setTimeWindow(v); sessionStorage.setItem('trends_timeWindow', v); };
    const setCat = (v) => { setSelectedCategory(v); sessionStorage.setItem('trends_category', v); };
    const setCustomFrom = (m, y) => { setCustomFromMonth(m); setCustomFromYear(y); sessionStorage.setItem('trends_customFromMonth', m); sessionStorage.setItem('trends_customFromYear', y); };
    const setCustomTo = (m, y) => { setCustomToMonth(m); setCustomToYear(y); sessionStorage.setItem('trends_customToMonth', m); sessionStorage.setItem('trends_customToYear', y); };

    const toggle = (key) => setExpanded(prev => ({ ...prev, [key]: !prev[key] }));

    const convertSync = (amount, from, to) => {
        if (!from || !to || from === to) return amount;
        const rates = CurrencyService.fallbackRates[from];
        if (rates && rates[to]) return Math.round(amount * rates[to] * 100) / 100;
        return amount;
    };
    const fmt = (n) => ValidationUtils.formatCurrency(n, defaultCurrency);

    const getMonths = () => {
        const now = new Date();
        const months = [];
        if (timeWindow === 'year') {
            for (let m = 0; m <= now.getMonth(); m++) months.push({ year: now.getFullYear(), month: m });
        } else if (timeWindow === 'custom') {
            const fromKey = customFromYear * 12 + customFromMonth, toKey = customToYear * 12 + customToMonth;
            const [sY, sM, eY, eM] = fromKey <= toKey ? [customFromYear, customFromMonth, customToYear, customToMonth] : [customToYear, customToMonth, customFromYear, customFromMonth];
            let cursor = new Date(sY, sM, 1);
            const end = new Date(eY, eM, 1);
            let guard = 0;
            while (cursor <= end && guard < 60) { months.push({ year: cursor.getFullYear(), month: cursor.getMonth() }); cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1); guard++; }
        } else {
            const count = timeWindow === '3m' ? 3 : timeWindow === '12m' ? 12 : 6;
            for (let i = count - 1; i >= 0; i--) {
                const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                months.push({ year: d.getFullYear(), month: d.getMonth() });
            }
        }
        return months;
    };

    const months = getMonths();
    const now = new Date();
    const curYear = now.getFullYear(), curMonth = now.getMonth();
    // Person scoping now comes entirely from the global Active View — expenses/income
    // arrive already filtered by it; this screen only adds its own category filter.
    const filteredExpenses = selectedCategory ? expenses.filter(e => e.categoryId === parseInt(selectedCategory)) : expenses;
    const filteredIncome = income;

    const monthData = months.map(({ year, month }) => {
        const mm = String(month + 1).padStart(2, '0');
        const prefix = `${year}-${mm}`;
        const me = filteredExpenses.filter(e => (e.date || '').startsWith(prefix));
        const mi = filteredIncome.filter(i => (i.date || '').startsWith(prefix));
        const totalExp = me.reduce((s, e) => s + convertSync(e.amount, e.currency || 'GBP', defaultCurrency), 0);
        const totalInc = mi.reduce((s, i) => s + convertSync(i.amount, i.currency || 'GBP', defaultCurrency), 0);
        const net = totalInc - totalExp;
        const savingsRate = totalInc > 0 ? ((totalInc - totalExp) / totalInc) * 100 : null;
        const isCurrent = year === curYear && month === curMonth;
        const lastDay = new Date(year, month + 1, 0).getDate();
        const from = `${year}-${mm}-01`;
        const to = `${year}-${mm}-${String(lastDay).padStart(2, '0')}`;
        const label = new Date(year, month, 1).toLocaleDateString('en-GB', { month: 'short', year: 'numeric' });
        const shortLabel = new Date(year, month, 1).toLocaleDateString('en-GB', { month: 'short' });

        const catBreakdown = {};
        categories.forEach(cat => {
            const catExps = me.filter(e => e.categoryId === cat.id);
            if (catExps.length === 0) return;
            const total = catExps.reduce((s, e) => s + convertSync(e.amount, e.currency || 'GBP', defaultCurrency), 0);
            const subBreakdown = {};
            catExps.forEach(e => { if (e.subcategory) subBreakdown[e.subcategory] = (subBreakdown[e.subcategory] || 0) + convertSync(e.amount, e.currency || 'GBP', defaultCurrency); });
            catBreakdown[cat.id] = { total, subBreakdown, catName: cat.name };
        });

        const incomeBreakdown = {};
        mi.forEach(i => { const src = i.source || 'Other'; incomeBreakdown[src] = (incomeBreakdown[src] || 0) + convertSync(i.amount, i.currency || 'GBP', defaultCurrency); });

        return { year, month, prefix, label, shortLabel, totalExp, totalInc, net, savingsRate, isCurrent, from, to, catBreakdown, incomeBreakdown };
    });

    // A category filter turns this into "how much did I spend on X, month by month"
    // rather than a multi-month income/expense/net/savings-rate comparison — a single
    // month of spend (including the still-in-progress current month) is meaningful on
    // its own, so it doesn't need the 2-complete-month bar the general trend view uses.
    const completeMonths = selectedCategory
        ? monthData.filter(m => m.totalExp > 0)
        : monthData.filter(m => !m.isCurrent && (m.totalExp > 0 || m.totalInc > 0));
    const minMonthsNeeded = selectedCategory ? 1 : 2;

    // Chart series: a category filter means "no income data makes sense here", so it
    // always forces expense-only and hides the Both/Income/Expense toggle.
    const effectiveSeriesFilter = selectedCategory ? 'expense' : chartSeriesFilter;
    const chartMonths = monthData.map(m => ({ label: m.shortLabel, income: m.totalInc, expense: m.totalExp }));
    // Table columns collapse to Month/Expenses only under a category filter, since
    // Income/Net/Savings% all depend on income data that isn't shown in that mode.
    const gridCols = selectedCategory ? '1fr 100px' : '1fr 70px 70px 62px 52px';
    const totalIncomeAll = monthData.reduce((s, m) => s + m.totalInc, 0);
    const totalExpAll = monthData.reduce((s, m) => s + m.totalExp, 0);
    const totalNetAll = totalIncomeAll - totalExpAll;
    const totalSavingsPctAll = totalIncomeAll > 0 ? ((totalIncomeAll - totalExpAll) / totalIncomeAll) * 100 : null;

    return (
        <div className="screen">
            <div className="screen-header">
                <h2><i className="fas fa-chart-line me-2"></i>Monthly Trends</h2>
                <div className="summary-filters">
                    <div className="filter-group">
                        <label className="filter-label">Time Period:</label>
                        <select className="form-select form-select-sm" value={timeWindow} onChange={(e) => setTw(e.target.value)}>
                            <option value="3m">Last 3 Months</option>
                            <option value="6m">Last 6 Months</option>
                            <option value="12m">Last 12 Months</option>
                            <option value="year">This Year</option>
                            <option value="custom">Custom</option>
                        </select>
                    </div>
                    {timeWindow === 'custom' && (
                        <div className="filter-group" style={{display: 'flex', gap: '0.75rem', flexWrap: 'wrap'}}>
                            <div>
                                <label className="filter-label">From:</label>
                                <div style={{display: 'flex', gap: '0.25rem'}}>
                                    <select className="form-select form-select-sm" value={customFromMonth} onChange={e => setCustomFrom(parseInt(e.target.value), customFromYear)}>
                                        {MONTH_NAMES.map((m, i) => (<option key={i} value={i}>{m}</option>))}
                                    </select>
                                    <select className="form-select form-select-sm" value={customFromYear} onChange={e => setCustomFrom(customFromMonth, parseInt(e.target.value))}>
                                        {Array.from({length: 8}, (_, i) => new Date().getFullYear() - i).map(y => (<option key={y} value={y}>{y}</option>))}
                                    </select>
                                </div>
                            </div>
                            <div>
                                <label className="filter-label">To:</label>
                                <div style={{display: 'flex', gap: '0.25rem'}}>
                                    <select className="form-select form-select-sm" value={customToMonth} onChange={e => setCustomTo(parseInt(e.target.value), customToYear)}>
                                        {MONTH_NAMES.map((m, i) => (<option key={i} value={i}>{m}</option>))}
                                    </select>
                                    <select className="form-select form-select-sm" value={customToYear} onChange={e => setCustomTo(customToMonth, parseInt(e.target.value))}>
                                        {Array.from({length: 8}, (_, i) => new Date().getFullYear() - i).map(y => (<option key={y} value={y}>{y}</option>))}
                                    </select>
                                </div>
                            </div>
                        </div>
                    )}
                    <div className="filter-group">
                        <label className="filter-label">Category:</label>
                        <select className="form-select form-select-sm" value={selectedCategory} onChange={e => setCat(e.target.value)}>
                            <option value="">All Categories</option>
                            {categories.map(c => (<option key={c.id} value={c.id}>{c.name}</option>))}
                        </select>
                    </div>
                </div>
            </div>

            {completeMonths.length < minMonthsNeeded ? (
                <div style={{textAlign:'center',padding:'3rem 1rem'}}>
                    <i className="fas fa-chart-line fa-3x text-muted" style={{display:'block',marginBottom:'1rem'}}></i>
                    <h5 className="text-muted">Not enough data yet</h5>
                    <p className="text-muted small">{selectedCategory ? 'Add an expense in this category to see trends.' : 'Add expenses over at least 2 months to see trends.'}</p>
                </div>
            ) : (
                <React.Fragment>
                    <div style={{padding:'0 1rem 1rem'}}>
                        <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '0.5rem', marginBottom: '0.5rem'}}>
                            <h5 style={{margin: 0}}><i className="fas fa-chart-bar me-2"></i>Income vs Expense</h5>
                            {!selectedCategory && (
                                <div className="btn-group btn-group-sm" role="group" aria-label="Chart series">
                                    <button type="button" className={'btn ' + (chartSeriesFilter === 'both' ? 'btn-primary' : 'btn-outline-secondary')} onClick={() => setChartSeriesFilter('both')}>Both</button>
                                    <button type="button" className={'btn ' + (chartSeriesFilter === 'income' ? 'btn-primary' : 'btn-outline-secondary')} onClick={() => setChartSeriesFilter('income')}>Income</button>
                                    <button type="button" className={'btn ' + (chartSeriesFilter === 'expense' ? 'btn-primary' : 'btn-outline-secondary')} onClick={() => setChartSeriesFilter('expense')}>Expense</button>
                                </div>
                            )}
                        </div>
                        <IncomeExpenseTrendChart months={chartMonths} defaultCurrency={defaultCurrency} seriesFilter={effectiveSeriesFilter} />
                    </div>

                    <div style={{padding:'0 1rem 1rem'}}>
                        <div style={{display:'grid',gridTemplateColumns:gridCols,gap:'4px',padding:'0 10px 0.3rem',alignItems:'center',fontSize:'0.7rem',color:'#6c757d',fontWeight:600}}>
                            <span>Month</span>
                            {!selectedCategory && <span style={{textAlign:'right',color:'#198754'}}>Income</span>}
                            <span style={{textAlign:'right',color:'#fd7e14'}}>Expenses</span>
                            {!selectedCategory && <span style={{textAlign:'right'}}>Net</span>}
                            {!selectedCategory && <span style={{textAlign:'right'}}>Savings%</span>}
                        </div>

                        {monthData.map(m => {
                            const expKey = `${m.prefix}:exp`;
                            const incKey = `${m.prefix}:inc`;
                            const hasCat = Object.keys(m.catBreakdown).length > 0;
                            const hasInc = !selectedCategory && Object.keys(m.incomeBreakdown).length > 0;
                            return (
                                <div key={m.prefix} style={{marginBottom:'6px',border:'1px solid',borderColor:m.isCurrent?'#adb5bd':'#dee2e6',borderStyle:m.isCurrent?'dashed':'solid',borderRadius:'8px',overflow:'hidden'}}>
                                    <div style={{display:'grid',gridTemplateColumns:gridCols,gap:'4px',alignItems:'center',padding:'8px 10px',background:m.isCurrent?'#f8f9fa':'#fff'}}>
                                        <div style={{minWidth:0}}>
                                            <div style={{fontWeight:600,fontSize:'0.75rem',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{m.label}</div>
                                            {m.isCurrent && <span className="badge bg-secondary" style={{fontSize:'0.55rem',marginTop:'2px',display:'inline-block'}}>current</span>}
                                        </div>
                                        {!selectedCategory && <div style={{fontSize:'0.8rem',color:'#198754',textAlign:'right'}}>{m.totalInc > 0 ? fmt(m.totalInc) : <span style={{color:'#adb5bd'}}>—</span>}</div>}
                                        <div style={{fontSize:'0.8rem',color:'#fd7e14',textAlign:'right',cursor:m.totalExp>0?'pointer':'default',textDecoration:m.totalExp>0?'underline':'none',textDecorationColor:'#fd7e14',textUnderlineOffset:'2px'}}
                                            onClick={() => m.totalExp > 0 && onMonthSelect(m.from, m.to)}
                                            title={m.totalExp > 0 ? `View ${m.label} expenses` : undefined}>
                                            {m.totalExp > 0 ? fmt(m.totalExp) : <span style={{color:'#adb5bd'}}>—</span>}
                                        </div>
                                        {!selectedCategory && (
                                            <div style={{fontSize:'0.8rem',fontWeight:600,textAlign:'right',color:(m.totalInc>0||m.totalExp>0)?(m.net>=0?'#198754':'#dc3545'):'#adb5bd'}}>
                                                {(m.totalInc > 0 || m.totalExp > 0) ? fmt(m.net) : '—'}
                                            </div>
                                        )}
                                        {!selectedCategory && (
                                            <div style={{fontSize:'0.78rem',color:'#6c757d',textAlign:'right'}}>
                                                {m.savingsRate !== null ? m.savingsRate.toFixed(0)+'%' : 'N/A'}
                                            </div>
                                        )}
                                    </div>
                                    {(hasCat || hasInc) && (
                                        <div style={{display:'flex',gap:'4px',padding:'3px 10px 5px',borderTop:'1px solid #f0f0f0',background:'#fafafa'}}>
                                            {hasCat && (
                                                <button type="button" className={'btn btn-sm ' + (expanded[expKey] ? 'btn-warning' : 'btn-outline-secondary')}
                                                    style={{fontSize:'0.7rem',padding:'1px 8px'}}
                                                    onClick={e => { e.stopPropagation(); toggle(expKey); }}>
                                                    <i className={'fas fa-' + (expanded[expKey] ? 'minus' : 'plus') + ' me-1'}></i>Expenses
                                                </button>
                                            )}
                                            {hasInc && (
                                                <button type="button" className={'btn btn-sm ' + (expanded[incKey] ? 'btn-success' : 'btn-outline-secondary')}
                                                    style={{fontSize:'0.7rem',padding:'1px 8px'}}
                                                    onClick={e => { e.stopPropagation(); toggle(incKey); }}>
                                                    <i className={'fas fa-' + (expanded[incKey] ? 'minus' : 'plus') + ' me-1'}></i>Income
                                                </button>
                                            )}
                                        </div>
                                    )}
                                    {expanded[expKey] && hasCat && (
                                        <div style={{borderTop:'1px solid #f0f0f0'}}>
                                            {Object.entries(m.catBreakdown).sort((a,b) => b[1].total - a[1].total).map(([catId, data]) => {
                                                const catKey = `${m.prefix}:cat:${catId}`;
                                                const hasSubs = Object.keys(data.subBreakdown).length > 0;
                                                return (
                                                    <div key={catId}>
                                                        <div style={{display:'flex',alignItems:'center',padding:'5px 10px 5px 18px',gap:'6px',background:'#fff9f0'}}>
                                                            {hasSubs
                                                                ? <button type="button" className="btn btn-sm btn-outline-secondary" style={{fontSize:'0.65rem',padding:'0 5px',lineHeight:'1.4',minWidth:'20px'}} onClick={e => { e.stopPropagation(); toggle(catKey); }}>
                                                                    <i className={'fas fa-' + (expanded[catKey] ? 'minus' : 'plus')}></i>
                                                                  </button>
                                                                : <span style={{width:'22px',display:'inline-block'}}></span>
                                                            }
                                                            <span style={{flex:1,fontSize:'0.8rem',fontWeight:500}}>{data.catName}</span>
                                                            <span style={{fontSize:'0.8rem',color:'#fd7e14',fontWeight:600}}>{fmt(data.total)}</span>
                                                        </div>
                                                        {expanded[catKey] && hasSubs && Object.entries(data.subBreakdown).sort((a,b) => b[1]-a[1]).map(([sub, amt]) => (
                                                            <div key={sub} style={{display:'flex',padding:'3px 10px 3px 46px',fontSize:'0.77rem',color:'#6c757d',background:'#fffdf8'}}>
                                                                <span style={{flex:1}}>{sub}</span>
                                                                <span>{fmt(amt)}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                    {expanded[incKey] && hasInc && (
                                        <div style={{borderTop:'1px solid #f0f0f0'}}>
                                            {Object.entries(m.incomeBreakdown).sort((a,b) => b[1]-a[1]).map(([src, amt]) => (
                                                <div key={src} style={{display:'flex',padding:'5px 10px 5px 18px',fontSize:'0.8rem',background:'#f0fff4'}}>
                                                    <span style={{flex:1,color:'#495057'}}><i className="fas fa-arrow-circle-down me-1 text-success"></i>{src}</span>
                                                    <span style={{color:'#198754',fontWeight:600}}>{fmt(amt)}</span>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            );
                        })}

                        <div style={{display:'grid',gridTemplateColumns:gridCols,gap:'4px',alignItems:'center',padding:'8px 10px',marginTop:'2px',borderTop:'2px solid #adb5bd'}}>
                            <div style={{fontWeight:700,fontSize:'0.85rem'}}>Total</div>
                            {!selectedCategory && <div style={{fontSize:'0.8rem',fontWeight:700,color:'#198754',textAlign:'right'}}>{fmt(totalIncomeAll)}</div>}
                            <div style={{fontSize:'0.8rem',fontWeight:700,color:'#fd7e14',textAlign:'right'}}>{fmt(totalExpAll)}</div>
                            {!selectedCategory && <div style={{fontSize:'0.8rem',fontWeight:700,textAlign:'right',color:totalNetAll>=0?'#198754':'#dc3545'}}>{fmt(totalNetAll)}</div>}
                            {!selectedCategory && <div style={{fontSize:'0.78rem',fontWeight:700,color:'#6c757d',textAlign:'right'}}>{totalSavingsPctAll !== null ? totalSavingsPctAll.toFixed(0)+'%' : 'N/A'}</div>}
                        </div>
                    </div>
                </React.Fragment>
            )}
        </div>
    );
}

function NetWorth({ defaultCurrency, activeView, assetCategories = [], liabilityCategories = [], onUpdate }) {
    const [items, setItems] = useState(() => DataService.getNetWorthItems());
    const [history, setHistory] = useState(() => DataService.getNetWorthHistory());
    const [showForm, setShowForm] = useState(false);
    const [editingItem, setEditingItem] = useState(null);
    const [form, setForm] = useState({ name: '', value: '', currency: defaultCurrency || 'GBP', type: 'asset', categoryId: (assetCategories && assetCategories[0] && assetCategories[0].id) || '', subcategory: '', notes: '', person: resolveActiveViewValue(activeView), country: '', fundAccountId: '' });
    const [formErrors, setFormErrors] = useState({});
    const [showDeleteModal, setShowDeleteModal] = useState(null);
    const [showHistory, setShowHistory] = useState(true);
    const [showClearHistoryConfirm, setShowClearHistoryConfirm] = useState(false);
    const [valuationItem, setValuationItem] = useState(null);
    const [valuationValue, setValuationValue] = useState('');
    const [valuationError, setValuationError] = useState('');
    const [bankAccounts] = useState(() => DataService.getBankAccounts());
    const [addMoneyItem, setAddMoneyItem] = useState(null);
    const [addMoneyForm, setAddMoneyForm] = useState({ amount: '', accountId: '' });
    const [addMoneyErrors, setAddMoneyErrors] = useState({});
    const [addMoneySubmitting, setAddMoneySubmitting] = useState(false);

    // Reseed the form's person whenever the active view changes (only when not mid-edit),
    // so a freshly-opened Add form defaults to whoever's view is currently active.
    useEffect(() => {
        if (!editingItem) setForm(f => ({...f, person: resolveActiveViewValue(activeView)}));
    }, [activeView]);

    const CURRENCIES = CurrencyService.getAllCurrencies().map(c => c.code);
    const categoriesForType = (type) => (type === 'asset' ? assetCategories : liabilityCategories) || [];

    const reload = () => { setItems(DataService.getNetWorthItems()); setHistory(DataService.getNetWorthHistory()); };

    const convertToDefault = (value, currency) => CurrencyService.convertToDefaultSync(value, currency, defaultCurrency);

    const fmt = (amount, currency) => {
        try { return new Intl.NumberFormat('en-GB', { style: 'currency', currency }).format(amount); }
        catch (_) { return `${currency} ${Number(amount).toFixed(2)}`; }
    };

    // Wallet: unlinked income/expenses + each active person's Primary account balance —
    // deliberately excludes non-primary bank accounts (those show as their own Asset/
    // Liability rows below) so nothing gets counted twice. Replaces the old blunt
    // "Cash Flow" (all-time income − all-time expenses) now that bank-linked money has
    // a more precise home.
    const wallet = DataService.computeWallet(activeView, defaultCurrency);

    // Debts "I Owe" → shown as liabilities, filtered by the global active view
    const debtLiabilities = DataService.getDebts().filter(d => d.direction === 'owe' && !d.isSettled && (matchesActiveView(d.person, activeView) || (d.createdInView || []).some(v => activeView.includes(v))));

    // Filter items by the global active view, merged with read-only rows computed live from
    // linked bank accounts (see DataService.getBankAssetItems/getBankLiabilityItems) so they
    // flow through the same totals/grouping/rendering as manually-added items.
    const visibleItems = [
        ...items.filter(i => matchesActiveView(i.person, activeView)),
        ...DataService.getBankAssetItems(activeView),
        ...DataService.getBankLiabilityItems(activeView)
    ];

    const totalAssets = visibleItems.filter(i => i.type === 'asset').reduce((s, i) => s + convertToDefault(i.value, i.currency), 0);
    const totalManualLiabilities = visibleItems.filter(i => i.type === 'liability').reduce((s, i) => s + convertToDefault(i.value, i.currency), 0);
    const totalDebtLiabilities = debtLiabilities.reduce((s, d) => s + convertToDefault(d.amount, d.currency), 0);
    const totalLiabilities = totalManualLiabilities + totalDebtLiabilities;
    // Net Worth = Total Assets + Wallet − Total Liabilities
    const netWorth = totalAssets + wallet - totalLiabilities;

    // Per-category Total Assets breakdown for the summary tiles — matches default asset
    // category names case-insensitively (categories are user-renameable, so this degrades
    // gracefully: a renamed/deleted category's items just fall into "Other Asset" below).
    const findAssetCatId = (name) => {
        const c = assetCategories.find(c => c.name.trim().toLowerCase() === name.toLowerCase());
        return c ? c.id : null;
    };
    const sumAssetsInCat = (catId) => catId == null ? 0 :
        visibleItems.filter(i => i.type === 'asset' && i.categoryId === catId)
            .reduce((s, i) => s + convertToDefault(i.value, i.currency), 0);

    const savingsValue = sumAssetsInCat(findAssetCatId('Bank & Savings'));
    const investmentValue = sumAssetsInCat(findAssetCatId('Investment'));
    const propertyValue = sumAssetsInCat(findAssetCatId('Property'));
    const pensionValue = sumAssetsInCat(findAssetCatId('Pension & Retirement'));
    // Remainder, not a name-matched sum — guarantees the tiles always foot to totalAssets
    // and automatically covers "Vehicles & Other Asset" plus any user-added categories.
    // Rounded to cents so floating-point subtraction of near-equal sums (e.g. an exact
    // wash to zero) can't leave a residue like -1e-11 that displays as "-£0.00" in red.
    const otherAssetValueRaw = totalAssets - savingsValue - investmentValue - propertyValue - pensionValue;
    const otherAssetValue = Math.round(otherAssetValueRaw * 100) / 100 === 0 ? 0 : otherAssetValueRaw;

    const openAddForm = () => {
        setEditingItem(null);
        const firstAssetCat = assetCategories && assetCategories[0];
        setForm({ name: '', value: '', currency: defaultCurrency || 'GBP', type: 'asset', categoryId: firstAssetCat ? firstAssetCat.id : '', subcategory: '', notes: '', person: resolveActiveViewValue(activeView), country: '', fundAccountId: '' });
        setFormErrors({});
        setShowForm(true);
    };

    const openEditForm = (item) => {
        setEditingItem(item);
        setForm({ name: item.name, value: String(item.value), currency: item.currency, type: item.type, categoryId: item.categoryId, subcategory: item.subcategory || '', notes: item.notes || '', person: item.person || 'own', country: item.country || '', fundAccountId: '' });
        setFormErrors({});
        setShowForm(true);
    };

    const handleTypeChange = (type) => {
        const firstCat = categoriesForType(type)[0];
        setForm(f => ({ ...f, type, categoryId: firstCat ? firstCat.id : '', subcategory: '', fundAccountId: '' }));
    };

    const handleSubmit = async (e) => {
        e.preventDefault();
        const errors = {};
        if (!form.name.trim()) errors.name = 'Name is required';
        if (!form.value || parseFloat(form.value) <= 0) errors.value = 'Value must be greater than 0';
        if (Object.keys(errors).length > 0) { setFormErrors(errors); return; }
        if (editingItem) {
            // Base-amount correction (typo/data-entry fix) — not a real valuation movement,
            // so it must not show up as a gain/loss in the history "Change" column.
            DataService.updateNetWorthItem(editingItem.id, { name: form.name.trim(), value: parseFloat(form.value), currency: form.currency, type: form.type, categoryId: parseInt(form.categoryId), subcategory: form.subcategory || '', notes: form.notes, person: form.person || 'own', country: form.country || '' }, { skipHistory: true });
        } else {
            const newItem = DataService.addNetWorthItem({ name: form.name.trim(), value: form.value, currency: form.currency, type: form.type, categoryId: parseInt(form.categoryId), subcategory: form.subcategory || '', notes: form.notes, person: form.person || 'own', country: form.country || '' }, activeView);
            if (form.type === 'asset' && form.fundAccountId) {
                const account = bankAccounts.find(a => a.id === parseInt(form.fundAccountId));
                if (account) {
                    const amount = parseFloat(form.value);
                    // Funded via the Transfer ledger (not an Expense) — this is an investment
                    // move, not spending; it's logged in Summary's Asset Funding table instead.
                    DataService.addTransfer({
                        date: new Date().toISOString().split('T')[0],
                        fromAccountId: account.id, toAccountId: null,
                        fromAmount: amount, toAmount: amount,
                        isOverseas: false, conversionRate: 1, fee: 0,
                        feeExpenseId: null, principalExpenseId: null, recipientIncomeId: null,
                        toAssetId: newItem.id, toAssetName: newItem.name,
                        notes: 'Investment funding — logged for audit'
                    });
                    if (onUpdate) await onUpdate();
                }
            }
        }
        setShowForm(false);
        setEditingItem(null);
        reload();
    };

    const handleDelete = (id) => { DataService.deleteNetWorthItem(id, activeView); setShowDeleteModal(null); reload(); };

    const openValuationForm = (item) => { setValuationItem(item); setValuationValue(String(item.value)); setValuationError(''); };

    const handleValuationSubmit = (e) => {
        e.preventDefault();
        if (!valuationValue || parseFloat(valuationValue) <= 0) { setValuationError('Value must be greater than 0'); return; }
        // A real valuation update — logged to history so the change shows as a gain/loss.
        DataService.updateNetWorthItem(valuationItem.id, { value: parseFloat(valuationValue) }, { activeView });
        setValuationItem(null);
        setValuationValue('');
        reload();
    };

    const openAddMoneyForm = (item) => { setAddMoneyItem(item); setAddMoneyForm({ amount: '', accountId: '' }); setAddMoneyErrors({}); };

    const handleAddMoneySubmit = async (e) => {
        e.preventDefault();
        const errors = {};
        const amount = parseFloat(addMoneyForm.amount);
        if (!addMoneyForm.amount || amount <= 0) errors.amount = 'Amount must be greater than 0';
        if (Object.keys(errors).length > 0) { setAddMoneyErrors(errors); return; }
        setAddMoneySubmitting(true);
        try {
            const currentOriginal = addMoneyItem.originalAmount != null ? addMoneyItem.originalAmount : addMoneyItem.value;
            DataService.updateNetWorthItem(addMoneyItem.id, { originalAmount: currentOriginal + amount, value: addMoneyItem.value + amount }, { activeView });
            if (addMoneyForm.accountId) {
                const account = bankAccounts.find(a => a.id === parseInt(addMoneyForm.accountId));
                if (account) {
                    DataService.addTransfer({
                        date: new Date().toISOString().split('T')[0],
                        fromAccountId: account.id, toAccountId: null,
                        fromAmount: amount, toAmount: amount,
                        isOverseas: false, conversionRate: 1, fee: 0,
                        feeExpenseId: null, principalExpenseId: null, recipientIncomeId: null,
                        toAssetId: addMoneyItem.id, toAssetName: addMoneyItem.name,
                        notes: 'Investment funding — logged for audit'
                    });
                    if (onUpdate) await onUpdate();
                }
            }
            setAddMoneyItem(null);
            setAddMoneyForm({ amount: '', accountId: '' });
            setAddMoneyErrors({});
            reload();
        } finally {
            setAddMoneySubmitting(false);
        }
    };

    const groupBy = (arr, key) => arr.reduce((acc, item) => { (acc[item[key]] = acc[item[key]] || []).push(item); return acc; }, {});
    const assetItems = visibleItems.filter(i => i.type === 'asset');
    const liabilityItems = visibleItems.filter(i => i.type === 'liability');
    const assetsByCat = groupBy(assetItems, 'categoryId');
    const liabsByCat = groupBy(liabilityItems, 'categoryId');
    // Display-only — see getPrimaryWalletBankItems's comment. Never fold into assetItems/totalAssets.
    const primaryWalletItems = DataService.getPrimaryWalletBankItems(activeView);
    const primaryWalletItemsByCat = groupBy(primaryWalletItems, 'categoryId');

    // Country breakdown: a new categorization axis, separate from totalAssets/netWorth, so
    // primaryWalletItems (normally excluded elsewhere to avoid double-counting into Wallet) is
    // safe to include here — it's real money in a real country. Debts have no country field
    // (out of scope) so "I Owe" liabilities aren't represented here. No currency conversion —
    // summed per country per currency, using the same fmt() every item card already uses.
    const countryBreakdown = {};
    [...visibleItems, ...primaryWalletItems].forEach(item => {
        const country = item.country || 'Not specified';
        if (!countryBreakdown[country]) countryBreakdown[country] = {};
        if (!countryBreakdown[country][item.currency]) countryBreakdown[country][item.currency] = { asset: 0, liability: 0 };
        countryBreakdown[country][item.currency][item.type] += item.value;
    });
    const countryNames = Object.keys(countryBreakdown).sort((a, b) => {
        if (a === 'Not specified') return 1;
        if (b === 'Not specified') return -1;
        return a.localeCompare(b);
    });

    // Only show snapshots taken under a view that overlaps the currently active one — same
    // pattern as debts' createdInView — so switching person doesn't surface the other
    // person's net-worth movements. Legacy entries with no view tag predate per-person
    // tracking and were combined totals across everyone, so they can't be truthfully
    // attributed to any one person — treat them as belonging to the account owner ('own')
    // rather than showing them under every person's view, which produced the same
    // mismatched-jump symptom this fix was meant to eliminate.
    const sortedHistory = [...history].filter(entry => entry.view ? entry.view.some(v => activeView.includes(v)) : activeView.includes('own')).reverse();

    const catColor = { Cash:'#0dcaf0', Investments:'#6f42c1', Property:'#198754', Vehicle:'#fd7e14', Other:'#6c757d', Mortgage:'#dc3545', Loan:'#e83e8c', 'Credit Card':'#fd7e14' };

    const renderItemCard = (item, colorClass) => (
        <div key={item.id} style={{marginBottom:'6px',borderRadius:'8px',border:'1px solid ' + (item.isPrimaryWallet ? '#ffc107' : '#e9ecef'),background:item.isPrimaryWallet ? '#fff3cd' : '#fff',padding:'9px 12px',display:'flex',alignItems:'flex-start',gap:'8px'}}>
            <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:600,fontSize:'0.88rem'}}>{item.name}{item.isPrimaryWallet && <span style={{marginLeft:'0.35rem',color:'#ffc107',fontSize:'0.8rem'}} title="Primary account">★</span>}{item.subcategory && <span style={{fontWeight:400,color:'#6c757d'}}> · {item.subcategory}</span>}</div>
                {/* A linked account can compute negative (overdrawn) — the asset total still
                    correctly negates by the full amount (unchanged), but showing e.g. "-£50"
                    as the headline reads as if that's cash on hand. Show £0 with the shortfall
                    called out separately instead, banking-statement style. */}
                {item.isBankAccount && item.type === 'asset' && item.value < 0 ? (
                    <div style={{fontSize:'0.92rem',fontWeight:700,color:'#dc3545'}}>{fmt(0, item.currency)} <span style={{fontSize:'0.8rem',fontWeight:600}}>(Overdraft {fmt(Math.abs(item.value), item.currency)})</span></div>
                ) : (
                    <div style={{fontSize:'0.92rem',fontWeight:700,color:item.value < 0 ? '#dc3545' : colorClass}}>{fmt(item.value, item.currency)}</div>
                )}
                {item.currency !== defaultCurrency && (
                    item.isBankAccount && item.type === 'asset' && item.value < 0 ? (
                        <div style={{fontSize:'0.72rem',color:'#6c757d'}}>≈ {fmt(0, defaultCurrency)} (Overdraft {fmt(Math.abs(convertToDefault(item.value, item.currency)), defaultCurrency)})</div>
                    ) : (
                        <div style={{fontSize:'0.72rem',color:'#6c757d'}}>≈ {fmt(convertToDefault(item.value, item.currency), defaultCurrency)}</div>
                    )
                )}
                {item.type === 'asset' && !item.isBankAccount && !item.isPrimaryWallet && item.originalAmount != null && (() => {
                    const original = item.originalAmount;
                    const pnlPct = original > 0 ? ((item.value - original) / original) * 100 : null;
                    return (
                        <div style={{fontSize:'0.72rem',color:'#6c757d',marginTop:'2px'}}>
                            Original: {fmt(original, item.currency)}
                            {pnlPct !== null && (
                                <span style={{marginLeft:'6px',fontWeight:600,color: pnlPct > 0 ? '#198754' : pnlPct < 0 ? '#dc3545' : '#6c757d'}}>
                                    {pnlPct > 0 ? '+' : ''}{pnlPct.toFixed(1)}%
                                </span>
                            )}
                        </div>
                    );
                })()}
                {item.notes && <div style={{fontSize:'0.75rem',color:'#6c757d',marginTop:'2px'}}>{item.notes}</div>}
            </div>
            {item.isPrimaryWallet ? (
                <div style={{fontSize:'0.68rem',color:'#6c757d',flexShrink:0,textAlign:'right',maxWidth:'90px'}} title="This account's balance is already included in the Wallet total above — not added again to Total Assets">
                    <i className="fas fa-wallet me-1"></i>In Wallet
                </div>
            ) : item.isBankAccount ? (
                <div style={{fontSize:'0.68rem',color:'#6c757d',flexShrink:0,textAlign:'right',maxWidth:'90px'}} title="Computed from this account's linked transactions — edit its Opening Amount in Settings → Bank Accounts to adjust">
                    <i className="fas fa-link me-1"></i>Linked account
                </div>
            ) : (
                <div style={{display:'flex',gap:'4px',flexShrink:0}}>
                    {item.type === 'asset' && (
                        <button type="button" className="btn btn-sm btn-outline-success" style={{fontSize:'0.7rem',padding:'2px 7px'}} title="Add money" onClick={() => openAddMoneyForm(item)}>
                            <i className="fas fa-piggy-bank"></i>
                        </button>
                    )}
                    <button type="button" className="btn btn-sm btn-outline-success" style={{fontSize:'0.7rem',padding:'2px 7px'}} title="Update valuation (logs a change)" onClick={() => openValuationForm(item)}>
                        <i className="fas fa-chart-line"></i>
                    </button>
                    <button type="button" className="btn btn-sm btn-outline-primary" style={{fontSize:'0.7rem',padding:'2px 7px'}} title="Edit base amount (no change logged)" onClick={() => openEditForm(item)}>
                        <i className="fas fa-pencil-alt"></i>
                    </button>
                    <button type="button" className="btn btn-sm btn-outline-danger" style={{fontSize:'0.7rem',padding:'2px 7px'}} onClick={() => setShowDeleteModal(item.id)}>
                        <i className="fas fa-trash"></i>
                    </button>
                </div>
            )}
        </div>
    );

    return (
        <div className="screen">
            <div className="screen-header"><h2><i className="fas fa-balance-scale me-2"></i>Net Worth</h2></div>

            {/* Summary banner — Net Worth on top, then Wallet/Savings/Investment,
                Property/Pension/Other Asset, then Liabilities on its own row */}
            <div style={{padding:'0 1rem 0.5rem'}}>
                <div style={{display:'flex',justifyContent:'center',marginBottom:'8px'}}>
                    <div style={{background:netWorth>=0?'#f0fff4':'#fff5f5',border:`1px solid ${netWorth>=0?'#c3e6cb':'#f5c6cb'}`,borderRadius:'12px',padding:'10px 32px',textAlign:'center'}}>
                        <div style={{fontSize:'0.65rem',color:'#6c757d',fontWeight:700,letterSpacing:'0.05em',marginBottom:'3px'}}>NET WORTH</div>
                        <div style={{fontSize:'1.2rem',fontWeight:800,color:netWorth>=0?'#198754':'#dc3545',lineHeight:1.1}}>{fmt(netWorth, defaultCurrency)}</div>
                        <div style={{fontSize:'0.6rem',color:'#adb5bd',marginTop:'3px'}}>Assets + Wallet − Liabilities</div>
                    </div>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'8px',marginBottom:'8px'}}>
                    <div style={{background:wallet>=0?'#f0fff4':'#fff5f5',border:`1px solid ${wallet>=0?'#c3e6cb':'#f5c6cb'}`,borderRadius:'10px',padding:'9px 8px',textAlign:'center'}}>
                        <div style={{fontSize:'0.6rem',color:'#6c757d',fontWeight:700,letterSpacing:'0.04em',marginBottom:'3px'}}>WALLET</div>
                        <div style={{fontSize:'0.88rem',fontWeight:800,color:wallet>=0?'#198754':'#dc3545',lineHeight:1.1}}>{fmt(wallet, defaultCurrency)}</div>
                        <div style={{fontSize:'0.58rem',color:'#adb5bd',marginTop:'3px'}}>Unlinked cash + Primary account</div>
                    </div>
                    <div style={{background:savingsValue>=0?'#f0fff4':'#fff5f5',border:`1px solid ${savingsValue>=0?'#c3e6cb':'#f5c6cb'}`,borderRadius:'10px',padding:'9px 8px',textAlign:'center'}}>
                        <div style={{fontSize:'0.6rem',color:'#6c757d',fontWeight:700,letterSpacing:'0.04em',marginBottom:'3px'}}>SAVINGS</div>
                        <div style={{fontSize:'0.88rem',fontWeight:800,color:savingsValue>=0?'#198754':'#dc3545',lineHeight:1.1}}>{fmt(savingsValue, defaultCurrency)}</div>
                        <div style={{fontSize:'0.58rem',color:'#adb5bd',marginTop:'3px'}}>Bank accounts</div>
                    </div>
                    <div style={{background:investmentValue>=0?'#f0fff4':'#fff5f5',border:`1px solid ${investmentValue>=0?'#c3e6cb':'#f5c6cb'}`,borderRadius:'10px',padding:'9px 8px',textAlign:'center'}}>
                        <div style={{fontSize:'0.6rem',color:'#6c757d',fontWeight:700,letterSpacing:'0.04em',marginBottom:'3px'}}>INVESTMENT</div>
                        <div style={{fontSize:'0.88rem',fontWeight:800,color:investmentValue>=0?'#198754':'#dc3545',lineHeight:1.1}}>{fmt(investmentValue, defaultCurrency)}</div>
                        <div style={{fontSize:'0.58rem',color:'#adb5bd',marginTop:'3px'}}>Investment accounts</div>
                    </div>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'8px',marginBottom:'8px'}}>
                    <div style={{background:propertyValue>=0?'#f0fff4':'#fff5f5',border:`1px solid ${propertyValue>=0?'#c3e6cb':'#f5c6cb'}`,borderRadius:'10px',padding:'9px 8px',textAlign:'center'}}>
                        <div style={{fontSize:'0.6rem',color:'#6c757d',fontWeight:700,letterSpacing:'0.04em',marginBottom:'3px'}}>PROPERTY</div>
                        <div style={{fontSize:'0.88rem',fontWeight:800,color:propertyValue>=0?'#198754':'#dc3545',lineHeight:1.1}}>{fmt(propertyValue, defaultCurrency)}</div>
                        <div style={{fontSize:'0.58rem',color:'#adb5bd',marginTop:'3px'}}>Property value</div>
                    </div>
                    <div style={{background:pensionValue>=0?'#f0fff4':'#fff5f5',border:`1px solid ${pensionValue>=0?'#c3e6cb':'#f5c6cb'}`,borderRadius:'10px',padding:'9px 8px',textAlign:'center'}}>
                        <div style={{fontSize:'0.6rem',color:'#6c757d',fontWeight:700,letterSpacing:'0.04em',marginBottom:'3px'}}>PENSION & RETIREMENT</div>
                        <div style={{fontSize:'0.88rem',fontWeight:800,color:pensionValue>=0?'#198754':'#dc3545',lineHeight:1.1}}>{fmt(pensionValue, defaultCurrency)}</div>
                        <div style={{fontSize:'0.58rem',color:'#adb5bd',marginTop:'3px'}}>Pension accounts</div>
                    </div>
                    <div style={{background:otherAssetValue>=0?'#f0fff4':'#fff5f5',border:`1px solid ${otherAssetValue>=0?'#c3e6cb':'#f5c6cb'}`,borderRadius:'10px',padding:'9px 8px',textAlign:'center'}}>
                        <div style={{fontSize:'0.6rem',color:'#6c757d',fontWeight:700,letterSpacing:'0.04em',marginBottom:'3px'}}>OTHER ASSET</div>
                        <div style={{fontSize:'0.88rem',fontWeight:800,color:otherAssetValue>=0?'#198754':'#dc3545',lineHeight:1.1}}>{fmt(otherAssetValue, defaultCurrency)}</div>
                        <div style={{fontSize:'0.58rem',color:'#adb5bd',marginTop:'3px'}}>Everything else</div>
                    </div>
                </div>
                <div style={{background:'#fff5f5',border:'1px solid #f5c6cb',borderRadius:'10px',padding:'9px 8px',textAlign:'center'}}>
                    <div style={{fontSize:'0.6rem',color:'#dc3545',fontWeight:700,letterSpacing:'0.04em',marginBottom:'3px'}}>LIABILITIES</div>
                    <div style={{fontSize:'0.88rem',fontWeight:800,color:'#dc3545',lineHeight:1.1}}>{fmt(totalLiabilities, defaultCurrency)}</div>
                    <div style={{fontSize:'0.58rem',color:'#adb5bd',marginTop:'3px'}}>Total owed</div>
                </div>
            </div>

            {/* Breakdown by Country — original currency, no conversion */}
            {countryNames.length > 0 && (
                <div style={{margin:'0 1rem 0.75rem',background:'#f8f9fa',borderRadius:'10px',padding:'0.75rem'}}>
                    <h6 style={{marginBottom:'0.6rem',fontSize:'0.85rem',fontWeight:600}}><i className="fas fa-globe me-2"></i>Net Worth by Country</h6>
                    {countryNames.map(country => (
                        <div key={country} style={{marginBottom:'0.5rem',paddingBottom:'0.5rem',borderBottom:'1px solid #e9ecef'}}>
                            <div style={{fontWeight:600,fontSize:'0.82rem',marginBottom:'0.25rem',color: country === 'Not specified' ? '#6c757d' : 'inherit'}}>{country}</div>
                            {Object.entries(countryBreakdown[country]).map(([currency, totals]) => (
                                <div key={currency} style={{display:'flex',justifyContent:'space-between',fontSize:'0.78rem',marginBottom:'0.15rem'}}>
                                    <span style={{color:'#6c757d'}}>{currency}</span>
                                    <span>
                                        {totals.asset > 0 && <span style={{color:'#198754'}}>{fmt(totals.asset, currency)} assets</span>}
                                        {totals.asset > 0 && totals.liability > 0 && '   '}
                                        {totals.liability > 0 && <span style={{color:'#dc3545'}}>{fmt(totals.liability, currency)} liabilities</span>}
                                    </span>
                                </div>
                            ))}
                        </div>
                    ))}
                </div>
            )}

            {/* Add button */}
            <div style={{padding:'0.25rem 1rem 0.75rem',display:'flex',gap:'8px'}}>
                <button type="button" className={'btn btn-sm flex-fill ' + (showForm ? 'btn-secondary' : 'btn-primary')}
                    onClick={() => { if (showForm) { setShowForm(false); setEditingItem(null); } else openAddForm(); }}>
                    <i className={'fas fa-' + (showForm ? 'times' : 'plus') + ' me-1'}></i>
                    {showForm ? 'Cancel' : 'Add Asset / Liability'}
                </button>
            </div>

            {/* Form */}
            {showForm && (
                <div style={{margin:'0 1rem 0.75rem',background:'#f8f9fa',borderRadius:'10px',padding:'0.75rem'}}>
                    <h6 style={{marginBottom:'0.6rem',fontSize:'0.85rem',fontWeight:600}}>{editingItem ? 'Edit Item' : 'Add New Item'}</h6>
                    <form onSubmit={handleSubmit}>
                        <div className="mb-2" style={{display:'flex',gap:'8px'}}>
                            <button type="button" className={'btn btn-sm flex-fill ' + (form.type==='asset' ? 'btn-success' : 'btn-outline-secondary')} onClick={() => handleTypeChange('asset')}>
                                <i className="fas fa-plus-circle me-1"></i>Asset
                            </button>
                            <button type="button" className={'btn btn-sm flex-fill ' + (form.type==='liability' ? 'btn-danger' : 'btn-outline-secondary')} onClick={() => handleTypeChange('liability')}>
                                <i className="fas fa-minus-circle me-1"></i>Liability
                            </button>
                        </div>
                        <div className="mb-2">
                            <input className={'form-control form-control-sm' + (formErrors.name ? ' is-invalid' : '')}
                                placeholder="Name (e.g. Savings Account)" value={form.name}
                                onChange={e => setForm(f => ({...f, name: e.target.value}))} />
                            {formErrors.name && <div className="invalid-feedback">{formErrors.name}</div>}
                        </div>
                        <div className="mb-2" style={{display:'grid',gridTemplateColumns:'1fr 100px',gap:'8px'}}>
                            <div>
                                <input type="number" min="0.01" step="0.01"
                                    className={'form-control form-control-sm' + (formErrors.value ? ' is-invalid' : '')}
                                    placeholder="Value" value={form.value}
                                    onChange={e => setForm(f => ({...f, value: e.target.value}))} />
                                {formErrors.value && <div className="invalid-feedback">{formErrors.value}</div>}
                            </div>
                            <select className="form-select form-select-sm" value={form.currency} onChange={e => setForm(f => ({...f, currency: e.target.value}))}>
                                {CURRENCIES.map(c => <option key={c} value={c}>{c}</option>)}
                            </select>
                        </div>
                        <div className="mb-2">
                            <select className="form-select form-select-sm" value={form.categoryId} onChange={e => setForm(f => ({...f, categoryId: e.target.value, subcategory: ''}))}>
                                {categoriesForType(form.type).map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                            </select>
                        </div>
                        {(() => {
                            const selectedCat = categoriesForType(form.type).find(c => String(c.id) === String(form.categoryId));
                            return selectedCat && selectedCat.subcategories.length > 0 && (
                                <div className="mb-2">
                                    <select className="form-select form-select-sm" value={form.subcategory} onChange={e => setForm(f => ({...f, subcategory: e.target.value}))}>
                                        <option value="">No subcategory</option>
                                        {selectedCat.subcategories.map(sub => <option key={sub} value={sub}>{sub}</option>)}
                                    </select>
                                </div>
                            );
                        })()}
                        <div className="mb-2">
                            <select className="form-select form-select-sm" value={form.country} onChange={e => setForm(f => ({...f, country: e.target.value}))}>
                                <option value="">Country: Not specified</option>
                                {COUNTRIES.map(c => <option key={c} value={c}>{c}</option>)}
                            </select>
                        </div>
                        {activeView.length > 1 && (
                            <div className="mb-2">
                                <label style={{fontSize:'0.75rem',fontWeight:600,marginBottom:'3px',display:'block'}}>Linked to</label>
                                <PersonSelect value={form.person} onChange={v => setForm(f => ({...f, person: v}))} activeView={activeView} className="form-select form-select-sm" ownLabel="Own (Me)" />
                            </div>
                        )}
                        {!editingItem && form.type === 'asset' && (
                            <React.Fragment>
                                <div className="mb-2">
                                    <label style={{fontSize:'0.75rem',fontWeight:600,marginBottom:'3px',display:'block'}}>Fund from bank account (optional)</label>
                                    <select className="form-select form-select-sm" value={form.fundAccountId} onChange={e => setForm(f => ({...f, fundAccountId: e.target.value}))}>
                                        <option value="">Don't deduct from a bank account</option>
                                        {bankAccounts.filter(a => a.currency === form.currency).map(a => (<option key={a.id} value={a.id}>{a.accountName} ({a.currency})</option>))}
                                    </select>
                                </div>
                                {form.fundAccountId && (
                                    <div className="alert alert-warning py-2" style={{fontSize:'0.78rem'}}>
                                        <i className="fas fa-exclamation-triangle me-1"></i>This will deduct {fmt(parseFloat(form.value) || 0, form.currency)} from the selected account and log it in Summary as a transfer — kept for audit, not counted as an expense.
                                    </div>
                                )}
                            </React.Fragment>
                        )}
                        <div className="mb-3">
                            <input className="form-control form-control-sm" placeholder="Notes (optional)" value={form.notes}
                                onChange={e => setForm(f => ({...f, notes: e.target.value}))} />
                        </div>
                        <div style={{display:'flex',gap:'8px'}}>
                            <button type="submit" className="btn btn-sm btn-primary">{editingItem ? 'Save Changes' : 'Add Item'}</button>
                            <button type="button" className="btn btn-sm btn-outline-secondary" onClick={() => { setShowForm(false); setEditingItem(null); setFormErrors({}); }}>Cancel</button>
                        </div>
                    </form>
                </div>
            )}

            {/* Assets list */}
            <div style={{padding:'0 1rem'}}>
                <div style={{marginBottom:'1rem'}}>
                    <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'8px'}}>
                        <h6 style={{margin:0,fontSize:'0.85rem',fontWeight:700,color:'#198754'}}><i className="fas fa-arrow-up me-1"></i>Assets</h6>
                        <span className="badge bg-success" style={{fontSize:'0.62rem'}}>{assetItems.length}</span>
                        <span style={{marginLeft:'auto',fontSize:'0.8rem',fontWeight:700,color:'#198754'}}>{fmt(totalAssets, defaultCurrency)}</span>
                    </div>
                    {assetItems.length === 0 && primaryWalletItems.length === 0
                        ? <div style={{textAlign:'center',padding:'1rem 0',color:'#6c757d',fontSize:'0.83rem',background:'#f8f9fa',borderRadius:'8px'}}>No assets added yet.</div>
                        : assetCategories.filter(c => assetsByCat[c.id] || primaryWalletItemsByCat[c.id]).map(cat => (
                            <div key={cat.id} style={{marginBottom:'8px'}}>
                                <div style={{fontSize:'0.7rem',fontWeight:700,color:catColor[cat.name]||'#6c757d',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:'4px',paddingLeft:'2px'}}>{cat.name}</div>
                                {(assetsByCat[cat.id]||[]).map(item => renderItemCard(item, '#198754'))}
                                {(primaryWalletItemsByCat[cat.id]||[]).map(item => renderItemCard(item, '#198754'))}
                            </div>
                        ))
                    }
                </div>

                {/* Liabilities list */}
                <div style={{marginBottom:'1rem'}}>
                    <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'8px'}}>
                        <h6 style={{margin:0,fontSize:'0.85rem',fontWeight:700,color:'#dc3545'}}><i className="fas fa-arrow-down me-1"></i>Liabilities</h6>
                        <span className="badge bg-danger" style={{fontSize:'0.62rem'}}>{liabilityItems.length + debtLiabilities.length}</span>
                        <span style={{marginLeft:'auto',fontSize:'0.8rem',fontWeight:700,color:'#dc3545'}}>{fmt(totalLiabilities, defaultCurrency)}</span>
                    </div>
                    {liabilityItems.length === 0 && debtLiabilities.length === 0
                        ? <div style={{textAlign:'center',padding:'1rem 0',color:'#6c757d',fontSize:'0.83rem',background:'#f8f9fa',borderRadius:'8px'}}>No liabilities added yet.</div>
                        : <>
                            {liabilityCategories.filter(c => liabsByCat[c.id]).map(cat => (
                                <div key={cat.id} style={{marginBottom:'8px'}}>
                                    <div style={{fontSize:'0.7rem',fontWeight:700,color:catColor[cat.name]||'#6c757d',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:'4px',paddingLeft:'2px'}}>{cat.name}</div>
                                    {liabsByCat[cat.id].map(item => renderItemCard(item, '#dc3545'))}
                                </div>
                            ))}
                            {debtLiabilities.length > 0 && (
                                <div style={{marginBottom:'8px'}}>
                                    <div style={{fontSize:'0.7rem',fontWeight:700,color:'#e83e8c',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:'4px',paddingLeft:'2px'}}>
                                        Debts I Owe
                                        <span className="badge ms-1" style={{background:'#e83e8c',fontSize:'0.55rem',verticalAlign:'middle'}}>From Debt Tracker</span>
                                    </div>
                                    {debtLiabilities.map(debt => (
                                        <div key={debt.id} style={{marginBottom:'6px',borderRadius:'8px',border:'1px solid #f5c2d0',background:'#fff5f8',padding:'9px 12px',display:'flex',alignItems:'flex-start',gap:'8px'}}>
                                            <div style={{flex:1,minWidth:0}}>
                                                <div style={{fontWeight:600,fontSize:'0.88rem'}}>{debt.counterparty}</div>
                                                <div style={{fontSize:'0.9rem',fontWeight:700,color:'#dc3545'}}>{fmt(debt.amount, debt.currency)}</div>
                                                {debt.currency !== defaultCurrency && <div style={{fontSize:'0.72rem',color:'#6c757d'}}>≈ {fmt(convertToDefault(debt.amount, debt.currency), defaultCurrency)}</div>}
                                                {debt.dueDate && <div style={{fontSize:'0.72rem',color:'#6c757d'}}>Due: {new Date(debt.dueDate+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</div>}
                                                {debt.notes && <div style={{fontSize:'0.72rem',color:'#6c757d',marginTop:'2px'}}>{debt.notes}</div>}
                                            </div>
                                            <span style={{fontSize:'0.68rem',color:'#6c757d',flexShrink:0,marginTop:'2px'}}>auto</span>
                                        </div>
                                    ))}
                                </div>
                            )}
                          </>
                    }
                </div>
            </div>

            {/* History table */}
            <div style={{padding:'0 1rem 1rem'}}>
                <div style={{display:'flex',gap:'6px',marginBottom:'8px'}}>
                    <button type="button" className="btn btn-sm btn-outline-secondary flex-grow-1" onClick={() => setShowHistory(v => !v)}>
                        <i className={'fas fa-' + (showHistory ? 'chevron-up' : 'chevron-down') + ' me-1'}></i>
                        {showHistory ? 'Hide' : 'Show'} History ({sortedHistory.length} snapshots)
                    </button>
                    {sortedHistory.length > 0 && (
                        <button type="button" className="btn btn-sm btn-outline-danger" title="Delete all history" onClick={() => setShowClearHistoryConfirm(true)}>
                            <i className="fas fa-trash-alt"></i>
                        </button>
                    )}
                </div>
                {showHistory && (
                    sortedHistory.length === 0
                        ? <div style={{textAlign:'center',padding:'1rem',color:'#6c757d',fontSize:'0.83rem',background:'#f8f9fa',borderRadius:'8px'}}>No history yet. Add your first asset or liability above.</div>
                        : <div style={{borderRadius:'10px',overflow:'hidden',border:'1px solid #dee2e6'}}>
                            <table style={{width:'100%',borderCollapse:'collapse',fontSize:'0.8rem'}}>
                                <thead>
                                    <tr style={{background:'#f8f9fa'}}>
                                        <th style={{padding:'7px 10px',textAlign:'left',fontWeight:600,borderBottom:'1px solid #dee2e6'}}>Date</th>
                                        <th style={{padding:'7px 10px',textAlign:'right',fontWeight:600,borderBottom:'1px solid #dee2e6'}}>Net Worth</th>
                                        <th style={{padding:'7px 10px',textAlign:'right',fontWeight:600,borderBottom:'1px solid #dee2e6'}}>Change</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {sortedHistory.map((entry, idx) => {
                                        const prev = sortedHistory[idx + 1];
                                        const change = prev != null ? entry.netWorth - prev.netWorth : null;
                                        const isFirst = idx === 0;
                                        return (
                                            <tr key={idx} style={{borderBottom:idx < sortedHistory.length-1 ? '1px solid #f0f0f0' : 'none', background:isFirst?'#f0fff4':'#fff'}}>
                                                <td style={{padding:'7px 10px',color:'#495057'}}>
                                                    {new Date(entry.date+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
                                                    {isFirst && <span className="badge bg-success ms-1" style={{fontSize:'0.58rem'}}>Latest</span>}
                                                </td>
                                                <td style={{padding:'7px 10px',textAlign:'right',fontWeight:isFirst?700:400,color:entry.netWorth>=0?'#198754':'#dc3545'}}>
                                                    {fmt(entry.netWorth, defaultCurrency)}
                                                </td>
                                                <td style={{padding:'7px 10px',textAlign:'right',fontWeight:600,color:change===null?'#adb5bd':change>0?'#198754':change<0?'#dc3545':'#6c757d'}}>
                                                    {change === null ? '—' : change === 0 ? '±0' : (change > 0 ? '▲ ' : '▼ ') + fmt(Math.abs(change), defaultCurrency)}
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                          </div>
                )}
            </div>

            {/* Delete modal */}
            {showDeleteModal && (
                <div className="modal show d-block" style={{background:'rgba(0,0,0,0.5)'}}>
                    <div className="modal-dialog modal-dialog-centered">
                        <div className="modal-content">
                            <div className="modal-header"><h5 className="modal-title">Delete Item?</h5></div>
                            <div className="modal-body"><p className="mb-0">Delete this item? This cannot be undone.</p></div>
                            <div className="modal-footer">
                                <button type="button" className="btn btn-outline-secondary btn-sm" onClick={() => setShowDeleteModal(null)}>Cancel</button>
                                <button type="button" className="btn btn-danger btn-sm" onClick={() => handleDelete(showDeleteModal)}><i className="fas fa-trash me-1"></i>Delete</button>
                            </div>
                        </div>
                    </div>
                </div>
            )}

            {/* Clear all history modal */}
            {showClearHistoryConfirm && (
                <div className="modal show d-block" style={{background:'rgba(0,0,0,0.5)'}}>
                    <div className="modal-dialog modal-dialog-centered">
                        <div className="modal-content">
                            <div className="modal-header border-danger">
                                <h5 className="modal-title text-danger"><i className="fas fa-exclamation-triangle me-2"></i>Delete All History?</h5>
                            </div>
                            <div className="modal-body">
                                <p>You are about to permanently delete all <strong>{sortedHistory.length} net worth snapshot{sortedHistory.length !== 1 ? 's' : ''}</strong>.</p>
                                <p className="mb-0">Your assets and liabilities themselves will not be affected — only the historical trend is cleared.</p>
                            </div>
                            <div className="modal-footer">
                                <button type="button" className="btn btn-secondary" onClick={() => setShowClearHistoryConfirm(false)}>Cancel</button>
                                <button type="button" className="btn btn-danger" onClick={() => { DataService.clearNetWorthHistory(); setShowClearHistoryConfirm(false); reload(); }}>
                                    <i className="fas fa-trash-alt me-1"></i>Delete All
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            )}

            {/* Update valuation modal */}
            {valuationItem && (
                <div className="modal show d-block" style={{background:'rgba(0,0,0,0.5)'}}>
                    <div className="modal-dialog modal-dialog-centered">
                        <form className="modal-content" onSubmit={handleValuationSubmit}>
                            <div className="modal-header"><h5 className="modal-title">Update Valuation — {valuationItem.name}</h5></div>
                            <div className="modal-body">
                                <p className="text-muted" style={{fontSize:'0.85rem'}}>Current: {fmt(valuationItem.value, valuationItem.currency)}. This records a real change and will show as a gain/loss in the history below.</p>
                                <label className="form-label">New Value ({valuationItem.currency})</label>
                                <input type="number" step="0.01" className={'form-control' + (valuationError ? ' is-invalid' : '')} value={valuationValue} onChange={e => { setValuationValue(e.target.value); setValuationError(''); }} autoFocus />
                                {valuationError && <div className="invalid-feedback">{valuationError}</div>}
                            </div>
                            <div className="modal-footer">
                                <button type="button" className="btn btn-outline-secondary btn-sm" onClick={() => setValuationItem(null)}>Cancel</button>
                                <button type="submit" className="btn btn-success btn-sm"><i className="fas fa-chart-line me-1"></i>Save Valuation</button>
                            </div>
                        </form>
                    </div>
                </div>
            )}
            {/* Add Money modal */}
            {addMoneyItem && (
                <div className="modal show d-block" style={{background:'rgba(0,0,0,0.5)'}}>
                    <div className="modal-dialog modal-dialog-centered">
                        <form className="modal-content" onSubmit={handleAddMoneySubmit}>
