    <script type="text/babel">
const { useState, useEffect, useMemo } = React;

const BANK_ACCOUNT_TYPES = ['Checking', 'Savings', 'Credit Card', 'Investment', 'Cash', 'Loan', 'Other'];
const COUNTRY_CURRENCY_MAP = {
    'United Kingdom': 'GBP', 'United States': 'USD', 'India': 'INR', 'Ireland': 'EUR', 'Germany': 'EUR',
    'France': 'EUR', 'Spain': 'EUR', 'Italy': 'EUR', 'Netherlands': 'EUR', 'Belgium': 'EUR', 'Portugal': 'EUR',
    'Switzerland': 'CHF', 'Austria': 'EUR', 'Sweden': 'SEK', 'Norway': 'NOK', 'Denmark': 'DKK', 'Finland': 'EUR',
    'Poland': 'PLN', 'Greece': 'EUR', 'Luxembourg': 'EUR', 'Canada': 'CAD', 'Mexico': 'MXN', 'Brazil': 'BRL',
    'Argentina': 'ARS', 'Australia': 'AUD', 'New Zealand': 'NZD', 'Japan': 'JPY', 'China': 'CNY',
    'South Korea': 'KRW', 'Singapore': 'SGD', 'Hong Kong': 'HKD', 'United Arab Emirates': 'AED',
    'Saudi Arabia': 'SAR', 'Qatar': 'QAR', 'South Africa': 'ZAR', 'Nigeria': 'NGN', 'Kenya': 'KES',
    'Egypt': 'EGP', 'Turkey': 'TRY', 'Russia': 'RUB', 'Pakistan': 'PKR', 'Bangladesh': 'BDT', 'Sri Lanka': 'LKR',
    'Philippines': 'PHP', 'Indonesia': 'IDR', 'Malaysia': 'MYR', 'Thailand': 'THB', 'Vietnam': 'VND',
    'Israel': 'ILS', 'Czech Republic': 'CZK', 'Romania': 'RON', 'Hungary': 'HUF'
};
const defaultCountryForCurrency = (currency) => {
    const matches = Object.keys(COUNTRY_CURRENCY_MAP).filter(c => COUNTRY_CURRENCY_MAP[c] === currency);
    return matches.length === 1 ? matches[0] : '';
};
const COUNTRIES = Object.keys(COUNTRY_CURRENCY_MAP).sort((a, b) => a.localeCompare(b)).concat('Other');

class CurrencyService {
    static ratesCache = {};
    static API_KEY = null;
    
    static supportedCurrencies = {
        'GBP': { name: 'British Pound', symbol: '£' },
        'EUR': { name: 'Euro', symbol: '€' },
        'INR': { name: 'Indian Rupee', symbol: '₹' },
        'USD': { name: 'US Dollar', symbol: '$' }
    };

    static fallbackRates = {
        'GBP': { 'EUR': 1.17, 'USD': 1.27, 'INR': 106.5, 'GBP': 1 },
        'EUR': { 'GBP': 0.85, 'USD': 1.08, 'INR': 91.2, 'EUR': 1 },
        'USD': { 'GBP': 0.79, 'EUR': 0.92, 'INR': 84.1, 'USD': 1 },
        'INR': { 'GBP': 0.0094, 'EUR': 0.011, 'USD': 0.012, 'INR': 1 }
    };

    static async fetchExchangeRates(baseCurrency = 'GBP') {
        const cacheTime = 30 * 60 * 1000;
        const now = Date.now();
        if (this.ratesCache[baseCurrency] && (now - this.ratesCache[baseCurrency].timestamp) < cacheTime) {
            return this.ratesCache[baseCurrency].rates;
        }
        try {
            const response = await fetch('https://api.exchangerate-api.com/v4/latest/' + baseCurrency);
            if (response.ok) {
                const data = await response.json();
                this.ratesCache[baseCurrency] = { rates: data.rates, timestamp: now };
                localStorage.setItem('exchangeRates_' + baseCurrency, JSON.stringify({
                    rates: data.rates, timestamp: now
                }));
                return data.rates;
            }
        } catch (error) {
            console.warn('Failed to fetch live exchange rates for ' + baseCurrency + ':', error);
        }
        try {
            const cached = localStorage.getItem('exchangeRates_' + baseCurrency);
            if (cached) {
                const { rates, timestamp } = JSON.parse(cached);
                if ((now - timestamp) < 24 * 60 * 60 * 1000) {
                    this.ratesCache[baseCurrency] = { rates, timestamp };
                    return rates;
                }
            }
        } catch (error) {
            console.warn('Failed to load cached exchange rates:', error);
        }
        const fallback = this.fallbackRates[baseCurrency] || this.fallbackRates['GBP'];
        this.ratesCache[baseCurrency] = { rates: fallback, timestamp: now };
        return fallback;
    }

    static _customRateAmount(amount, fromCurrency, toCurrency) {
        const custom = DataService.getCustomCurrencies().find(c => c.code === fromCurrency);
        if (custom && custom.rateAgainst === toCurrency) return Math.round(amount * custom.rate * 100) / 100;
        const customTo = DataService.getCustomCurrencies().find(c => c.code === toCurrency);
        if (customTo && customTo.rateAgainst === fromCurrency) return Math.round((amount / customTo.rate) * 100) / 100;
        return null;
    }

    static async convertCurrency(amount, fromCurrency, toCurrency) {
        if (fromCurrency === toCurrency) return amount;
        // A custom currency isn't reliably known to the live-rate API (fetchExchangeRates
        // masks unrecognized base currencies by silently substituting GBP's fallback table —
        // see lookupLiveRate for the honest version). Trust the stored rate snapshot instead
        // of risking that masked, mislabeled fallback for either side of the pair.
        const isCustomPair = DataService.getCustomCurrencies().some(c => c.code === fromCurrency || c.code === toCurrency);
        if (isCustomPair) {
            const custom = this._customRateAmount(amount, fromCurrency, toCurrency);
            return custom !== null ? custom : amount;
        }
        try {
            const rates = await this.fetchExchangeRates(fromCurrency);
            if (rates[toCurrency]) {
                return Math.round(amount * rates[toCurrency] * 100) / 100;
            }
            const fallback = this.fallbackRates[fromCurrency];
            if (fallback && fallback[toCurrency]) {
                return Math.round(amount * fallback[toCurrency] * 100) / 100;
            }
            return amount;
        } catch (error) {
            console.error('Currency conversion failed:', error);
            const fallback = this.fallbackRates[fromCurrency];
            if (fallback && fallback[toCurrency]) {
                return Math.round(amount * fallback[toCurrency] * 100) / 100;
            }
            return amount;
        }
    }

    static getCurrencySymbol(currencyCode) {
        const c = this.supportedCurrencies[currencyCode];
        if (c) return c.symbol;
        const custom = DataService.getCustomCurrencies().find(cc => cc.code === currencyCode);
        if (custom && custom.symbol) return custom.symbol;
        // Falls back to deriving a real symbol via Intl (e.g. HUF -> "Ft") instead of just
        // printing the bare code — covers a custom currency saved without one, or a currency
        // that was never added as custom at all but still shows up somewhere (e.g. Cash
        // Withdraw items created for a currency picked before deriveSymbol existed).
        return this.deriveSymbol(currencyCode);
    }

    static getCurrencyName(currencyCode) {
        const c = this.supportedCurrencies[currencyCode];
        if (c) return c.name;
        const custom = DataService.getCustomCurrencies().find(cc => cc.code === currencyCode);
        return custom ? custom.name : currencyCode;
    }

    static formatCurrency(amount, currencyCode) {
        const symbol = this.getCurrencySymbol(currencyCode);
        return symbol + amount.toFixed(2);
    }

    static async getConversionRate(fromCurrency, toCurrency) {
        if (fromCurrency === toCurrency) return 1;
        try {
            return await this.convertCurrency(1, fromCurrency, toCurrency);
        } catch (error) {
            return 1;
        }
    }

    static async lookupLiveRate(fromCode, toCode) {
        if (fromCode === toCode) return 1;
        try {
            const response = await fetch('https://api.exchangerate-api.com/v4/latest/' + fromCode);
            if (!response.ok) return null;
            const data = await response.json();
            const rate = data.rates && data.rates[toCode];
            return typeof rate === 'number' ? rate : null;
        } catch (error) { return null; }
    }

    static deriveSymbol(code) {
        try {
            const parts = new Intl.NumberFormat('en-GB', { style: 'currency', currency: code, currencyDisplay: 'narrowSymbol' }).formatToParts(0);
            const sym = parts.find(p => p.type === 'currency');
            return sym ? sym.value : code;
        } catch (error) { return code; }
    }

    static getAllCurrencies() {
        const builtIn = Object.entries(this.supportedCurrencies).map(([code, v]) => ({ code, name: v.name, symbol: v.symbol }));
        const custom = DataService.getCustomCurrencies().map(c => ({ code: c.code, name: c.name, symbol: c.symbol || c.code }));
        return [...builtIn, ...custom];
    }

    static convertToDefaultSync(value, fromCurrency, toCurrency) {
        if (fromCurrency === toCurrency) return value;
        const rates = this.fallbackRates[fromCurrency];
        if (rates && rates[toCurrency]) return value * rates[toCurrency];
        const custom = DataService.getCustomCurrencies().find(c => c.code === fromCurrency);
        if (custom && custom.rateAgainst === toCurrency) return value * custom.rate;
        const customTo = DataService.getCustomCurrencies().find(c => c.code === toCurrency);
        if (customTo && customTo.rateAgainst === fromCurrency) return value / customTo.rate;
        return value;
    }
}
window.CurrencyService = CurrencyService;

const ValidationUtils = {
    validateExpense: (expense) => {
        const errors = {};
        if (!expense.amount || expense.amount <= 0) errors.amount = 'Amount must be greater than 0';
        if (!expense.date) { errors.date = 'Date is required'; } else if (expense.date > DateUtils.today()) { errors.date = 'Date cannot be in the future'; }
        if (!expense.categoryId) errors.categoryId = 'Category is required';
        if (!expense.subcategory) errors.subcategory = 'Subcategory is required';
        if (expense.paidBy && expense.paidBy.trim().length > 0 && expense.paidBy.trim().length < 2) errors.paidBy = 'Name must be at least 2 characters if provided';
        return { isValid: Object.keys(errors).length === 0, errors };
    },
    validateIncome: (income) => {
        const errors = {};
        if (!income.amount || income.amount <= 0) errors.amount = 'Amount must be greater than 0';
        if (!income.date) errors.date = 'Date is required';
        if (!income.source || income.source.trim().length === 0) errors.source = 'Income source is required';
        return { isValid: Object.keys(errors).length === 0, errors };
    },
    validateCategory: (category) => {
        const errors = {};
        if (!category.name || category.name.trim().length === 0) errors.name = 'Category name is required';
        else if (category.name.trim().length < 2) errors.name = 'Category name must be at least 2 characters';
        return { isValid: Object.keys(errors).length === 0, errors };
    },
    formatCurrency: (amount, currency = 'USD') => {
        const currencyMap = {
            'USD': { locale: 'en-US', currency: 'USD' },
            'GBP': { locale: 'en-GB', currency: 'GBP' },
            'EUR': { locale: 'en-EU', currency: 'EUR' },
            'INR': { locale: 'en-IN', currency: 'INR' }
        };
        const config = currencyMap[currency];
        if (config) return new Intl.NumberFormat(config.locale, { style: 'currency', currency: config.currency }).format(amount);
        return CurrencyService.getCurrencySymbol(currency) + amount.toFixed(2);
    },
    getCurrencySymbol: (currency = 'USD') => {
        const symbols = { 'USD': '$', 'GBP': '£', 'EUR': '€', 'INR': '₹' };
        return symbols[currency] || CurrencyService.getCurrencySymbol(currency);
    },
    formatDate: (date) => {
        // A stored date-only "YYYY-MM-DD" string must be parsed as a LOCAL calendar day —
        // new Date(str) reads it as UTC midnight, which displays the previous day in any
        // negative-UTC-offset timezone. Full timestamps/Date objects still go through new Date().
        const d = (typeof date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(date)) ? DateUtils.parseDateStr(date) : new Date(date);
        return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    },
    getPasswordStrength: (password) => {
        if (!password) return { label: '', className: '', percent: 0 };
        let categories = 0;
        if (/[a-z]/.test(password)) categories++;
        if (/[A-Z]/.test(password)) categories++;
        if (/[0-9]/.test(password)) categories++;
        if (/[^A-Za-z0-9]/.test(password)) categories++;
        let score = 0;
        if (password.length >= 8) score++;
        if (password.length >= 12) score++;
        if (categories >= 2) score++;
        if (categories >= 3) score++;
        if (score <= 1) return { label: 'Weak', className: 'weak', percent: 33 };
        if (score <= 3) return { label: 'Fair', className: 'fair', percent: 66 };
        return { label: 'Strong', className: 'strong', percent: 100 };
    }
};
window.ValidationUtils = ValidationUtils;

// ── Global "Active View" (who's data is currently visible) ────────────────
// Storage convention: 'own' represents the logged-in user themselves; every
// other entry is a person's name (matching DataService.getPeople()). This is
// a plain localStorage key (not part of financeApp_settings) because it must
// be readable synchronously at the very top of App's loadData/handleDataUpdate,
// before any DataService.get*() calls run.
const ACTIVE_VIEW_KEY = 'financeApp_activeView';
function getActiveView() {
    try {
        const v = JSON.parse(localStorage.getItem(ACTIVE_VIEW_KEY) || '["own"]');
        return Array.isArray(v) && v.length > 0 ? v : ['own'];
    } catch (_) { return ['own']; }
}
function setActiveView(view) {
    const safe = Array.isArray(view) && view.length > 0 ? view : ['own'];
    localStorage.setItem(ACTIVE_VIEW_KEY, JSON.stringify(safe));
    return safe;
}
// value = a record's paidBy/person/owner field (may be '', null, or undefined).
// Storage convention (existing, unchanged): expenses/income use '' (falsy) for "own";
// debts/net worth/goals use the literal string 'own' — both mean the same thing, so
// this treats them as equivalent rather than picking one. The active view's display
// name is a UI label only, never written into these fields either way.
function matchesActiveView(value, activeView) {
    const v = (value || '').trim().toLowerCase();
    if (!v || v === 'own') return activeView.includes('own');
    return activeView.some(sel => sel !== 'own' && sel.toLowerCase() === v);
}
// First + last initial (or just the first letter for a single-word name), e.g.
// "Alex Morgan" -> "AM", "John" -> "J". Keeps the header pill compact regardless
// of how long a display name or person's name is.
function getInitials(name) {
    const trimmed = (name || '').trim();
    if (!trimmed) return '';
    const parts = trimmed.split(/\s+/);
    return (parts.length === 1 ? parts[0].charAt(0) : parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
}
// Renders the header pill / any other "who's active" label, using initials in place
// of full names. 'own' maps to the user's display name's initials; past ~20 combined
// characters (rare now that names are this short), collapses to "First +N".
function formatActiveViewLabel(activeView, displayName) {
    const names = (activeView.length ? activeView : ['own']).map(v => getInitials(v === 'own' ? (displayName || 'Own') : v));
    const joined = names.join(', ');
    if (joined.length <= 20 || names.length === 1) return joined;
    return names[0] + ' +' + (names.length - 1);
}
// Date-only ("YYYY-MM-DD") helpers that never touch UTC/.toISOString() — every stored
// transaction "date" field must represent the LOCAL calendar day, not the UTC one, which
// new Date().toISOString().split('T')[0] silently gets wrong near local midnight (and
// new Date(dateOnlyStr) — parsed as UTC midnight per spec — mixed with local getters/
// setters gets wrong at month/day boundaries for negative UTC offsets). Route every such
// read/write through here instead.
const DateUtils = {
    toDateStr(d = new Date()) { const pad2 = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; },
    today() { return this.toDateStr(new Date()); },
    parseDateStr(str) { const [y, m, d] = String(str).split('-').map(Number); return new Date(y, m - 1, d); },
    addToDateStr(str, { days = 0, months = 0, years = 0 } = {}) {
        const d = this.parseDateStr(str);
        if (days) d.setDate(d.getDate() + days);
        if (months) d.setMonth(d.getMonth() + months);
        if (years) d.setFullYear(d.getFullYear() + years);
        return this.toDateStr(d);
    }
};
window.DateUtils = DateUtils;

// Per-screen list filters (Expense/Income History, Summary, Debts) live in each
// screen component's local state, and renderScreen() unmounts that component on
// every navigation — so without this the user's filters silently reset the moment
// they leave the screen. Persist them for the session (sessionStorage, so they
// survive navigation but not a browser close) and wipe them on logout so the next
// user on a shared device starts clean. Keys are namespaced 'ftFilter_<screen>'.
const FilterMemory = {
    load(screen) { try { return JSON.parse(sessionStorage.getItem('ftFilter_' + screen)) || {}; } catch { return {}; } },
    save(screen, obj) { try { sessionStorage.setItem('ftFilter_' + screen, JSON.stringify(obj)); } catch (_) {} },
    clearAll() {
        try {
            Object.keys(sessionStorage)
                .filter(k => k.startsWith('ftFilter_') || k.startsWith('trends_'))
                .forEach(k => sessionStorage.removeItem(k));
        } catch (_) {}
    }
};

// Local-vs-cloud tie-conflict store (see mergeById's conflictsOut, DataService.mergeBackups)
// — nested by collection, e.g. { expenses: { [id]: { cloudSnapshot, detectedAt } }, income: {...} }.
// Recomputed fresh on every merge (self-healing — a resolved or no-longer-tied record just
// stops appearing), and never uploaded to the cloud.
const SyncConflicts = {
    read(collection) {
        try { return (JSON.parse(localStorage.getItem('financeApp_syncConflicts')) || {})[collection] || {}; }
        catch (_) { return {}; }
    },
    dismiss(collection, id) {
        try {
            const all = JSON.parse(localStorage.getItem('financeApp_syncConflicts')) || {};
            if (all[collection]) { delete all[collection][String(id)]; localStorage.setItem('financeApp_syncConflicts', JSON.stringify(all)); }
        } catch (_) { /* best-effort */ }
    }
};

// Warning badge for a row whose local and cloud versions tied on timestamp but differ in
// content (see SyncConflicts above). Shared across every list screen — only expense-list-
// specific styling lived in `.expense-sync-conflict-icon` before; now generic `.sync-conflict-icon`.
function SyncConflictBadge({ conflict, onClick }) {
    if (!conflict) return null;
    return <i className="fas fa-triangle-exclamation sync-conflict-icon" title="Local and cloud versions differ — showing local. Click for details." onClick={(e) => { e.stopPropagation(); onClick(); }}></i>;
}

// Generic diff + resolve modal for a tie-conflict, shared across every list screen. Shows
// only the fields that actually differ, using the caller's field-label map and optional
// per-field formatter. "Keep Local"/"Use Cloud Instead" both call back into the caller,
// which is responsible for the actual DataService.update* call — that stamps a fresh
// updatedAt, which is what breaks the tie so the flag self-heals on the next merge.
function SyncConflictModal({ localRecord, cloudSnapshot, fieldLabels = {}, formatValue, metaKeys, onKeepLocal, onUseCloud, onClose }) {
    if (!localRecord || !cloudSnapshot) return null;
    const skip = metaKeys || ['id', 'createdAt', 'updatedAt'];
    const defaultFormat = (key, value) => {
        if (value === undefined || value === null || value === '') return '—';
        if (Array.isArray(value)) return value.length ? value.join(', ') : '—';
        if (typeof value === 'boolean') return value ? 'Yes' : 'No';
        if (typeof value === 'object') return 'Complex data — differs';
        return String(value);
    };
    const format = (key, value, record) => (formatValue ? formatValue(key, value, record) : defaultFormat(key, value));
    const keys = new Set([...Object.keys(localRecord), ...Object.keys(cloudSnapshot)]);
    const diffRows = [...keys].filter(k => !skip.includes(k) && JSON.stringify(localRecord[k]) !== JSON.stringify(cloudSnapshot[k]));
    return (
        <div className="modal show d-block" style={{backgroundColor: 'rgba(0,0,0,0.5)'}}>
            <div className="modal-dialog modal-dialog-centered">
                <div className="modal-content">
                    <div className="modal-header"><h5 className="modal-title"><i className="fas fa-triangle-exclamation sync-conflict-icon"></i> Sync Conflict</h5></div>
                    <div className="modal-body">
                        <p>This record was saved at the same time on this device and in the cloud, but the details differ. The local version is currently shown — review the differences below and choose which one to keep.</p>

function spCategoryLook(category, index) {

// Tag chips over the existing tag rules: trimmed + lowercased, no duplicates, at most 10
// tags of up to 30 characters (same limits and messages as before; spaces are kept).
function TagInput({ tags, onChange, allTags = [], onError, noun = 'expense' }) {
    const [input, setInput] = useState('');
    const addMany = (parts) => {
        let next = [...tags];
        for (const raw of parts) {
            const t = String(raw || '').trim().toLowerCase();
            if (!t || next.includes(t)) continue;
            if (t.length > 30) { onError('Tags must be 30 characters or fewer'); return false; }
            if (next.length >= 10) { onError('Maximum 10 tags allowed per ' + noun); return false; }
            next.push(t);
        }
        onError('');
        if (next.length !== tags.length) onChange(next);
        return true;
    };
    const handleChange = (v) => {
        if (v.includes(',')) {
            const parts = v.split(',');
            const rest = parts.pop();
            if (addMany(parts)) setInput(rest); else setInput(v);
        } else setInput(v);
    };
    const handleKey = (e) => {
        if (e.key === 'Enter') { e.preventDefault(); if (input.trim() && addMany([input])) setInput(''); }
        else if (e.key === 'Backspace' && !input && tags.length) { onChange(tags.slice(0, -1)); onError(''); }
    };
    const q = input.trim().toLowerCase();
    const sugg = allTags.filter(t => !tags.includes(t) && (!q || t.startsWith(q))).slice(0, 6);
    return (
        <div>
            <div className="sp-tagbox">
                {tags.map(t => (
                    <span key={t} className="sp-tagchip">#{t}<button type="button" onClick={() => { onChange(tags.filter(x => x !== t)); onError(''); }} title={'Remove ' + t}><i className="fas fa-xmark"></i></button></span>
                ))}
                <input type="text" value={input} onChange={e => handleChange(e.target.value)} onKeyDown={handleKey} placeholder={tags.length ? '' : 'Add a tag'} />
                {input.trim() && <button type="button" className="sp-tagadd" onClick={() => { if (addMany([input])) setInput(''); }}>Add</button>}
            </div>
            {sugg.length > 0 && (
                <div style={{display: 'flex', flexWrap: 'wrap', gap: '6px', marginTop: '8px'}}>
                    {sugg.map(t => <button key={t} type="button" className="sp-tagsugg" onClick={() => { if (addMany([t])) setInput(''); }}>+ #{t}</button>)}
                </div>
            )}
        </div>
    );
}

// A person's primary account only counts as the default for a new expense/income record
// when its currency matches the record's — otherwise the Account field is left unset so a
// GBP primary account never gets silently attached to e.g. a USD transaction.
function resolveDefaultAccountId(person, currency) {
    const primary = DataService.getPrimaryAccountForPerson(person || 'own');
    return (primary && primary.currency === currency) ? primary.id : '';

// Trim/lowercase before comparing — matches the normalization matchesActiveView already
// uses elsewhere, since CSV-imported paidBy values aren't validated against the People
// list and can carry stray whitespace/casing that would otherwise silently fail to match.
// Returns one entry per person with a primary bank account (even if their unlinked count
// is 0), so callers can distinguish "no primary account" from "primary but nothing to link".
function computeLinkCandidates(bankAccounts, expenses, income) {
    const normalize = (v) => (v || 'own').trim().toLowerCase();
    const seen = new Set();
    const candidates = [];
    bankAccounts.filter(a => a.isPrimary).forEach(primary => {
        if (seen.has(primary.person)) return;
        seen.add(primary.person);
        const target = normalize(primary.person);
        const expenseCount = expenses.filter(e => normalize(e.paidBy) === target && !e.accountId && !e.isCashPayment && (e.currency || 'GBP') === primary.currency).length;
        const incomeCount = income.filter(i => normalize(i.paidBy) === target && !i.accountId && (i.currency || 'GBP') === primary.currency).length;
        candidates.push({ person: primary.person, expenseCount, incomeCount });
    });
    return candidates;
}

// Given a list of cloud history files (each { id, name }) sorted newest-first
// (name is date-prefixed and zero-padded, so lexicographic order == chronological
// order), returns the subset to delete under the user's chosen retention policy —
// shared by GDriveService and OneDriveService since both use the same
// `financetracker-YYYY-MM-DD-HHMMSS.json` naming convention and the same setting.
// The single newest file (index 0) is never returned, regardless of policy or age,
// so a long-idle device under a day-based policy can never prune away every backup.
function selectHistoryFilesToPrune(files) {
    if (!files || files.length <= 1) return [];
    const retention = (JSON.parse(localStorage.getItem('financeApp_settings') || '{}').cloudBackupRetention) || 'count5';
    if (retention === 'count5') return files.length > 5 ? files.slice(5) : [];
    const days = { '7d': 7, '30d': 30, '90d': 90 }[retention] || 30;
    const cutoff = Date.now() - days * 24 * 60 * 60 * 1000;
    return files.slice(1).filter(f => {
        const m = f.name.match(/financetracker-(\d{4})-(\d{2})-(\d{2})-(\d{2})(\d{2})(\d{2})\.json/);
        if (!m) return false;
        const t = Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]);
        return t < cutoff;
    });
}

// ── Google Drive OAuth + REST API ──────────────────────────────────────────
const GDriveService = {
    SCOPES: 'https://www.googleapis.com/auth/drive.file',
    get FOLDER() { return (window.__OAUTH_CONFIG && window.__OAUTH_CONFIG.isProduction) ? 'FinanceTracker Backups' : 'FinanceTracker Backups (Dev)'; },
    FILE: 'financetracker-data.json',
    get clientId() { return (window.__OAUTH_CONFIG && window.__OAUTH_CONFIG.googleClientId) || ''; },
    isConfigured() { return !!this.clientId; },
    getToken() { return sessionStorage.getItem('ftGdToken'); },
    isTokenValid() { const e = sessionStorage.getItem('ftGdExp'); return !!(this.getToken() && e && Date.now() < +e); },
    _storeToken(t, sec) { sessionStorage.setItem('ftGdToken', t); sessionStorage.setItem('ftGdExp', String(Date.now() + ((sec||3600)-60)*1000)); },
    clearToken() { ['ftGdToken','ftGdExp'].forEach(k => sessionStorage.removeItem(k)); localStorage.removeItem('ftGdFileId'); },
    requestToken() {
        return new Promise((resolve, reject) => {
            if (!this.isConfigured()) { reject(new Error('not_configured')); return; }
            if (!window.google || !window.google.accounts) { reject(new Error('gis_not_loaded')); return; }
            const client = window.google.accounts.oauth2.initTokenClient({
                client_id: this.clientId, scope: this.SCOPES,
                callback: resp => { if (resp.error) { reject(new Error(resp.error)); return; } this._storeToken(resp.access_token, resp.expires_in); resolve(resp.access_token); }
            });
            client.requestAccessToken();
        });
    },
    // Tries to mint a fresh access token with zero UI — no popup, no account chooser.
    // Succeeds only if the user still has an active Google session in this browser AND
    // previously granted the Drive scope; GIS otherwise fires the callback with an
    // error (e.g. interaction_required) instead of ever showing anything. Used to avoid
    // interrupting returning users with the "Reconnect Google Drive" screen just because
    // the short-lived access token expired or the tab was reopened.
    requestTokenSilent() {
        return new Promise((resolve, reject) => {
            if (!this.isConfigured()) { reject(new Error('not_configured')); return; }
            if (!window.google || !window.google.accounts) { reject(new Error('gis_not_loaded')); return; }
            const client = window.google.accounts.oauth2.initTokenClient({
                client_id: this.clientId, scope: this.SCOPES,
                callback: resp => { if (resp.error) { reject(new Error(resp.error)); return; } this._storeToken(resp.access_token, resp.expires_in); resolve(resp.access_token); }
            });
            client.requestAccessToken({ prompt: '' });
        });
    },
    async _tok() { if (this.isTokenValid()) return this.getToken(); return this.requestToken(); },
    async _folder(tok) {
        const q = encodeURIComponent(`name='${this.FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
        const r = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`, { headers: { Authorization: `Bearer ${tok}` } });
        if (!r.ok) throw new Error('gdrive_folder:' + r.status);
        const { files } = await r.json();
        if (files && files.length) return files[0].id;
        const cr = await fetch('https://www.googleapis.com/drive/v3/files', {
            method: 'POST', headers: { Authorization: `Bearer ${tok}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: this.FOLDER, mimeType: 'application/vnd.google-apps.folder' })
        });
        if (!cr.ok) throw new Error('gdrive_mkdir:' + cr.status);
        return (await cr.json()).id;
    },
    // Takes the token from the caller instead of re-acquiring it — a caller like upload()
    // already fetched one token for the whole operation; having this call _tok() again
    // per-request could independently decide the token needs renewing and pop a second,
    // unexpected OAuth prompt mid-save (and silently hang the upload if popups are blocked).
    async _doForm(tok, method, url, meta, body) {
        const form = new FormData();
        form.append('metadata', new Blob([JSON.stringify(meta)], { type: 'application/json' }));
        form.append('file', new Blob([body], { type: 'application/json' }));
        return { tok, res: await fetch(url, { method, headers: { Authorization: `Bearer ${tok}` }, body: form }) };
    },
    _histName() {
        // Seconds included — minute-only precision let two saves in the same minute produce
        // the identical filename, so Drive/OneDrive kept both as separate files instead of
        // one: version history showed duplicate timestamps, the 5-snapshot prune cap filled
        // up with near-duplicates faster than expected, and storage grew accordingly.
        const n = new Date(); const p = x => String(x).padStart(2,'0');
        return `financetracker-${n.getUTCFullYear()}-${p(n.getUTCMonth()+1)}-${p(n.getUTCDate())}-${p(n.getUTCHours())}${p(n.getUTCMinutes())}${p(n.getUTCSeconds())}.json`;
    },
    async _pruneGdHistory(tok, fid) {
        try {
            const q = encodeURIComponent(`'${fid}' in parents and name contains 'financetracker-20' and trashed=false`);
            const r = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&orderBy=name desc`, { headers: { Authorization: `Bearer ${tok}` } });
            if (!r.ok) return;
            const { files } = await r.json();
            const toDelete = selectHistoryFilesToPrune(files);
            for (const f of toDelete) {
                await fetch(`https://www.googleapis.com/drive/v3/files/${f.id}`, { method: 'DELETE', headers: { Authorization: `Bearer ${tok}` } });
            }
        } catch (_) {}
    },
    async upload(json) {
        const tok = await this._tok();
        const fid = await this._folder(tok);
        const body = JSON.stringify(json);
        const cached = localStorage.getItem('ftGdFileId');
        if (cached) {
            const { res } = await this._doForm(tok, 'PATCH', `https://www.googleapis.com/upload/drive/v3/files/${cached}?uploadType=multipart`, { name: this.FILE }, body);
            if (res.status === 404) { localStorage.removeItem('ftGdFileId'); return this.upload(json); }
            if (!res.ok) throw new Error('gdrive_upload:' + res.status);
        } else {
            const q = encodeURIComponent(`'${fid}' in parents and name='${this.FILE}' and trashed=false`);
            const sr = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`, { headers: { Authorization: `Bearer ${tok}` } });
            const { files } = await sr.json();
            if (files && files.length) {
                localStorage.setItem('ftGdFileId', files[0].id);
                const { res } = await this._doForm(tok, 'PATCH', `https://www.googleapis.com/upload/drive/v3/files/${files[0].id}?uploadType=multipart`, { name: this.FILE }, body);
                if (!res.ok) throw new Error('gdrive_upload:' + res.status);
            } else {
                const { res } = await this._doForm(tok, 'POST', `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`, { name: this.FILE, parents: [fid] }, body);
                if (!res.ok) throw new Error('gdrive_upload:' + res.status);
                const f = await res.json(); if (f.id) localStorage.setItem('ftGdFileId', f.id);
            }
        }
        // versioned snapshot — best-effort, never fails the main upload
        try {
            const { res: sr } = await this._doForm(tok, 'POST', `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`, { name: this._histName(), parents: [fid] }, body);
            if (sr.ok) this._pruneGdHistory(tok, fid);
        } catch (_) {}
    },
    async download() {
        const tok = await this._tok();
        const fid = await this._folder(tok);
        let fileId = localStorage.getItem('ftGdFileId');
        if (!fileId) {
            const q = encodeURIComponent(`'${fid}' in parents and name='${this.FILE}' and trashed=false`);
            const r = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`, { headers: { Authorization: `Bearer ${tok}` } });
            if (!r.ok) return null;
            const { files } = await r.json();
            if (!files || !files.length) return null;
            fileId = files[0].id; localStorage.setItem('ftGdFileId', fileId);
        }
        const r = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, { headers: { Authorization: `Bearer ${tok}` } });
        if (r.status === 404) { localStorage.removeItem('ftGdFileId'); return null; }
        if (!r.ok) throw new Error('gdrive_download:' + r.status);
        const data = await r.json();
        // Best-effort: Drive's server-assigned modifiedTime is stamped at upload time, so
        // freshness comparisons built on it aren't thrown off by a device with a wrong system
        // clock the way the backup's own client-generated createdAt would be. Any failure here
        // (network or HTTP) just leaves it null and callers fall back to createdAt.
        let serverModifiedTime = null;
        try {
            const metaR = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?fields=modifiedTime`, { headers: { Authorization: `Bearer ${tok}` } });
            if (metaR.ok) serverModifiedTime = (await metaR.json()).modifiedTime || null;
        } catch (_) {}
        return { ...data, _serverModifiedTime: serverModifiedTime };
    },
    async listHistory() {
        const tok = await this._tok();
        const fid = await this._folder(tok);
        const q = encodeURIComponent(`'${fid}' in parents and name contains 'financetracker-20' and trashed=false`);
        const r = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,size)&orderBy=name desc`, { headers: { Authorization: `Bearer ${tok}` } });
        if (!r.ok) return [];
        const { files } = await r.json();
        return (files || []).map(f => ({ id: f.id, name: f.name, size: f.size }));
    },
    async downloadById(fileId) {
        const tok = await this._tok();
        const r = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, { headers: { Authorization: `Bearer ${tok}` } });
        if (!r.ok) throw new Error('gdrive_download:' + r.status);
        return r.json();
    }
};

// ── Microsoft OneDrive (Graph API via MSAL.js v2) ──────────────────────────
const OneDriveService = {
    get clientId() { return (window.__OAUTH_CONFIG && window.__OAUTH_CONFIG.msClientId) || ''; },
    SCOPES: ['Files.ReadWrite.AppFolder'],
    FILE: 'financetracker-data.json',
    _app: null, _account: null, _msalReadyPromise: null,
    isConfigured() { return !!this.clientId; },
    isTokenValid() { const a = this._getApp(); return !!(a && a.getAllAccounts().length > 0); },
    // msal-browser.min.js is loaded with async+defer, so it can still be missing the moment
    // the app checks for an existing session right after a fresh page load (window.msal is
    // undefined for a beat), which used to make isTokenValid() report false and pop the
    // reconnect gate even though the session was actually still valid in storage. Bound-poll
    // for the script to finish loading before trusting a negative isTokenValid() result.
    waitUntilReady(timeoutMs = 3000) {
        if (window.msal) return Promise.resolve(true);
        if (this._msalReadyPromise) return this._msalReadyPromise;
        this._msalReadyPromise = new Promise(resolve => {
            const start = Date.now();
            const poll = () => {
                if (window.msal) { resolve(true); return; }
                if (Date.now() - start >= timeoutMs) { resolve(false); return; }
                setTimeout(poll, 50);
            };
            poll();
        });
        return this._msalReadyPromise;
    },
    _getApp() {
        if (!window.msal || !this.clientId) return null;
        if (!this._app) {
            try { this._app = new window.msal.PublicClientApplication({ auth: { clientId: this.clientId, redirectUri: window.location.origin } }); } catch { return null; }
        }
        return this._app;
    },
    async requestToken() {
        const app = this._getApp();
        if (!app) throw new Error('not_configured');
        const r = await app.acquireTokenPopup({ scopes: this.SCOPES });
        this._account = r.account; return r.accessToken;
    },
    async _tok() {
        const app = this._getApp();
        if (!app) throw new Error('not_configured');
        const accounts = app.getAllAccounts();
        if (accounts.length) {
            try { const r = await app.acquireTokenSilent({ scopes: this.SCOPES, account: accounts[0] }); this._account = r.account; return r.accessToken; } catch {}
        }
        return this.requestToken();
    },
    clearToken() { this._account = null; this._app = null; },
    _histName() {
        // Seconds included — minute-only precision let two saves in the same minute produce
        // the identical filename, so Drive/OneDrive kept both as separate files instead of
        // one: version history showed duplicate timestamps, the 5-snapshot prune cap filled
        // up with near-duplicates faster than expected, and storage grew accordingly.
        const n = new Date(); const p = x => String(x).padStart(2,'0');
        return `financetracker-${n.getUTCFullYear()}-${p(n.getUTCMonth()+1)}-${p(n.getUTCDate())}-${p(n.getUTCHours())}${p(n.getUTCMinutes())}${p(n.getUTCSeconds())}.json`;
    },
    async _pruneOdHistory(tok) {
        try {
            const r = await fetch(`https://graph.microsoft.com/v1.0/me/drive/special/approot/children`, { headers: { Authorization: `Bearer ${tok}` } });
            if (!r.ok) return;
            const { value } = await r.json();
            const hist = (value || []).filter(f => /^financetracker-\d{4}/.test(f.name)).sort((a,b) => b.name.localeCompare(a.name));
            const toDelete = selectHistoryFilesToPrune(hist);
            for (const f of toDelete) {
                await fetch(`https://graph.microsoft.com/v1.0/me/drive/items/${f.id}`, { method: 'DELETE', headers: { Authorization: `Bearer ${tok}` } });
            }
        } catch (_) {}
    },
    async upload(json) {
        const tok = await this._tok();
        const body = JSON.stringify(json);
        const r = await fetch(`https://graph.microsoft.com/v1.0/me/drive/special/approot:/${encodeURIComponent(this.FILE)}:/content`, {
            method: 'PUT', headers: { Authorization: `Bearer ${tok}`, 'Content-Type': 'application/json' }, body
        });
        if (!r.ok) throw new Error('onedrive_upload:' + r.status);
        // versioned snapshot — best-effort
        try {
            const sr = await fetch(`https://graph.microsoft.com/v1.0/me/drive/special/approot:/${encodeURIComponent(this._histName())}:/content`, {
                method: 'PUT', headers: { Authorization: `Bearer ${tok}`, 'Content-Type': 'application/json' }, body
            });
            if (sr.ok) this._pruneOdHistory(tok);
        } catch (_) {}
    },
    async download() {
        const tok = await this._tok();
        const r = await fetch(`https://graph.microsoft.com/v1.0/me/drive/special/approot:/${encodeURIComponent(this.FILE)}:/content`, { headers: { Authorization: `Bearer ${tok}` } });
        if (r.status === 404) return null;
        if (!r.ok) throw new Error('onedrive_download:' + r.status);
        const data = await r.json();
        // Best-effort: see GDriveService.download() for why the server-assigned
        // lastModifiedDateTime is preferred over the backup's own client-generated
        // createdAt. Any failure here (network or HTTP) just leaves it null.
        let serverModifiedTime = null;
        try {
            const metaR = await fetch(`https://graph.microsoft.com/v1.0/me/drive/special/approot:/${encodeURIComponent(this.FILE)}`, { headers: { Authorization: `Bearer ${tok}` } });
            if (metaR.ok) serverModifiedTime = (await metaR.json()).lastModifiedDateTime || null;
        } catch (_) {}
        return { ...data, _serverModifiedTime: serverModifiedTime };
    },
    async listHistory() {
        const tok = await this._tok();
        const r = await fetch(`https://graph.microsoft.com/v1.0/me/drive/special/approot/children`, { headers: { Authorization: `Bearer ${tok}` } });
        if (!r.ok) return [];
        const { value } = await r.json();
        return (value || []).filter(f => /^financetracker-\d{4}/.test(f.name)).sort((a,b) => b.name.localeCompare(a.name)).map(f => ({ id: f.id, name: f.name, size: f.size }));
    },
    async downloadById(fileId) {
        const tok = await this._tok();
        const r = await fetch(`https://graph.microsoft.com/v1.0/me/drive/items/${fileId}/content`, { headers: { Authorization: `Bearer ${tok}` } });
        if (!r.ok) throw new Error('onedrive_download:' + r.status);
        return r.json();
    }
};

// ── Unified SyncService ────────────────────────────────────────────────────
const SyncService = {
    DOWNLOAD_TIMEOUT_MS: 15000,
    pref() { return localStorage.getItem('financeApp_storagePreference') || 'local'; },
    isCloudEnabled() { const p = this.pref(); return p === 'gdrive' || p === 'onedrive'; },
    svc() { const p = this.pref(); if (p === 'gdrive') return GDriveService; if (p === 'onedrive') return OneDriveService; return null; },
    // Cloud downloads use plain fetch(), which has no built-in timeout — an unresponsive
    // provider (dead connection, slow mobile network) leaves the promise pending forever,
    // so any UI gated on it (e.g. the login "checking" spinner) never resolves.
    _withTimeout(promise, ms) {
        return new Promise((resolve, reject) => {
            const timer = setTimeout(() => reject(new Error('sync_timeout')), ms);
            promise.then(
                v => { clearTimeout(timer); resolve(v); },
                e => { clearTimeout(timer); reject(e); }
            );
        });
    },
    async upload(json) {
        const s = this.svc(); if (!s) return { status: 'local' };
        if (!s.isConfigured()) return { status: 'not_configured' };
        // For GDrive, only upload if we already have a session token (no popup mid-update)
        if (s === GDriveService && !GDriveService.isTokenValid()) return { status: 'reconnect-needed' };
        try {
            await s.upload(json);
            const now = new Date().toISOString();
            localStorage.setItem('financeApp_lastCloudSync', now);
            return { status: 'success', syncedAt: now };
        } catch (err) {
            const m = err.message || '';
            if (m.includes('popup') || m.includes('interaction_required') || m.includes('not_configured') || m.includes('gis_not_loaded')) return { status: 'reconnect-needed' };
            return { status: 'error' };
        }
    },
    async download() { const s = this.svc(); if (!s || !s.isConfigured()) return null; return this._withTimeout(s.download(), this.DOWNLOAD_TIMEOUT_MS); },
    async listHistory() { const s = this.svc(); if (!s || !s.isConfigured()) return []; try { return await this._withTimeout(s.listHistory(), this.DOWNLOAD_TIMEOUT_MS); } catch (_) { return []; } },
    async downloadVersion(id) { const s = this.svc(); if (!s) return null; return this._withTimeout(s.downloadById(id), this.DOWNLOAD_TIMEOUT_MS); }
};

// Prefer a cloud backup's server-assigned modification time (set by Drive/OneDrive at
// upload time) over its own createdAt field (generated by whichever device's clock made
// the backup) for freshness/staleness comparisons. A device with a wrong system clock can
// only mis-stamp createdAt, not the provider's server timestamp, so routing "is cloud
// newer" decisions through this narrows (but does not eliminate — see mergeById, which
// still resolves same-ID record conflicts using each record's own client-generated
// updatedAt/createdAt) the impact of client clock skew on sync decisions.
function getBackupTimestamp(backup) {
    if (!backup) return 0;
    const t = backup._serverModifiedTime || backup.createdAt;
    return t ? new Date(t).getTime() : 0;
}

// ── Cloud Restore Modal ────────────────────────────────────────────────────
function CloudRestoreModal({ backupData, currentUser, onRestore, onKeepLocal }) {
    const [restoring, setRestoring] = React.useState(false);
    const [restoreError, setRestoreError] = React.useState('');
    // TOFU: unsigned backup requires explicit user acknowledgement before restoring
    const isUnsigned = !backupData.backupSignature;
    const [tofuConfirmed, setTofuConfirmed] = React.useState(!isUnsigned);
    const exp = (backupData.data && backupData.data.expenses && backupData.data.expenses.length) || 0;
    const inc = (backupData.data && backupData.data.income && backupData.data.income.length) || 0;
    const dateStr = backupData.createdAt ? new Date(backupData.createdAt).toLocaleString() : 'Unknown date';
    const handleRestore = async () => {
        if (!tofuConfirmed) return;
        setRestoring(true);
        setRestoreError('');
        try {
            // Re-validate ownership and signature before restoring (prevents TOCTOU bypass)
            if (!isBackupOwnedByCurrentUser(backupData, currentUser)) {
                setRestoreError('This backup does not belong to your account.');
                setRestoring(false); return;
            }
            const sigResult = await verifyBackupSignature(backupData, currentUser);
            // For TOFU flow: if the user confirmed, allow requiresConfirmation; block tampered
            if (!isSignatureAcceptable(sigResult) || sigResult.tampered) {
                setRestoreError('Backup integrity check failed — restore blocked.');
                setRestoring(false); return;
            }
            DataService.restoreBackup(backupData);
        } catch (e) {
            console.error(e);
            setRestoreError('Restore failed: ' + (e && e.message ? e.message : 'unknown error') + '. Your existing data was not replaced.');
            setRestoring(false);
            return;
        }
        onRestore();
    };
    return (
        <AuthShell icon="fas fa-cloud-arrow-down" title="Cloud backup found" tagline="A newer backup was found in your cloud storage.">
            <div className="sp-stat">
                <div className="sp-stat-title"><i className="fas fa-calendar" style={{marginRight: '8px'}}></i>{dateStr}</div>
                <div className="sp-stat-sub">{exp} expense{exp!==1?'s':''} · {inc} income record{inc!==1?'s':''}</div>
            </div>
            {isUnsigned && (
                <div className="sp-alert sp-alert-warn" style={{flexDirection: 'column', gap: '8px'}}>
                    <div style={{display: 'flex', gap: '8px'}}>
                        <i className="fas fa-triangle-exclamation" style={{marginTop: '2px'}}></i>
                        <span><strong>No integrity signature.</strong> This backup was created before cryptographic signing was enabled (or the signature was removed). Verify you trust its source before restoring.</span>
                    </div>
                    <label className="sp-check" style={{color: 'inherit'}}><input type="checkbox" checked={tofuConfirmed} onChange={e => setTofuConfirmed(e.target.checked)} />I understand and want to restore this unsigned backup</label>
                </div>
            )}
            {restoreError && <div className="sp-alert sp-alert-err"><i className="fas fa-shield-halved"></i><span>{restoreError}</span></div>}
            <button type="button" className="sp-btn sp-btn-primary" onClick={handleRestore} disabled={restoring || !tofuConfirmed}>
                {restoring ? <><i className="fas fa-spinner fa-spin"></i>Restoring…</> : <><i className="fas fa-cloud-arrow-down"></i>Use cloud backup</>}
            </button>
            <button type="button" className="sp-btn sp-btn-soft" style={{marginTop: '8px'}} onClick={onKeepLocal} disabled={restoring}><i className="fas fa-mobile-screen"></i>Keep this device's data</button>
            <div className="sp-footnote">Restoring will reload the app with cloud data</div>
        </AuthShell>
    );
}

// ── Cloud History Modal ────────────────────────────────────────────────────
function CloudHistoryModal({ onClose, onRestored, currentUser }) {
    const [loading, setLoading] = React.useState(true);
    const [snapshots, setSnapshots] = React.useState([]);
    const [error, setError] = React.useState('');
    const [restoring, setRestoring] = React.useState(null); // id of snapshot being restored
    const [confirmed, setConfirmed] = React.useState(null); // snapshot awaiting confirm
    const [confirmText, setConfirmText] = React.useState('');

    React.useEffect(() => {
        SyncService.listHistory().then(files => { setSnapshots(files); setLoading(false); })
            .catch(e => { setError('Could not load history: ' + e.message); setLoading(false); });
    }, []);

    const parseName = (name) => {
        // financetracker-2026-06-27-143045.json
        const m = name.match(/financetracker-(\d{4})-(\d{2})-(\d{2})-(\d{2})(\d{2})(\d{2})\.json/);
        if (!m) return null;
        return new Date(Date.UTC(+m[1], +m[2]-1, +m[3], +m[4], +m[5], +m[6]));
    };

    const retention = (JSON.parse(localStorage.getItem('financeApp_settings') || '{}').cloudBackupRetention) || 'count5';
    const retentionLabel = { count5: 'max 5 kept', '7d': 'kept for 7 days', '30d': 'kept for 30 days', '90d': 'kept for 90 days' }[retention] || 'max 5 kept';

    const doRestore = async (snap) => {
        setConfirmed(null);
        setConfirmText('');
        setRestoring(snap.id);
        try {
            const data = await SyncService.downloadVersion(snap.id);
            if (!data) throw new Error('Empty response');
            // Fail-closed: reject snapshots that don't belong to the current user
            if (!isBackupOwnedByCurrentUser(data, currentUser)) {
                throw new Error('This snapshot belongs to a different account and cannot be restored.');
            }
            // Reject if signature is missing, requires confirmation, or is invalid.
            // CloudHistoryModal has no TOFU confirmation UI, so requiresConfirmation is also blocked.
            const sigResult = await verifyBackupSignature(data, currentUser);
            if (!isSignatureAcceptable(sigResult) || sigResult.requiresConfirmation) {
                throw new Error('This snapshot failed integrity verification. Use the main restore flow to restore unsigned backups.');
            }
            DataService.restoreBackup(data);
            onRestored();
        } catch (e) {
            setError('Restore failed: ' + e.message);
            setRestoring(null);
        }
    };

    return (
        <div style={{position:'fixed',inset:0,zIndex:9999,background:'rgba(0,0,0,0.72)',display:'flex',alignItems:'center',justifyContent:'center',padding:'1rem'}}>
            <div style={{background:'#fff',borderRadius:'16px',padding:'1.5rem',maxWidth:'420px',width:'100%',boxShadow:'0 20px 60px rgba(0,0,0,0.3)',maxHeight:'80vh',display:'flex',flexDirection:'column'}}>
                <div className="d-flex align-items-center justify-content-between mb-3">
                    <div>
                        <h5 className="fw-bold mb-0"><i className="fas fa-history me-2 text-primary"></i>Version History</h5>
                        <div style={{fontSize:'0.78rem',color:'#6c757d'}}>Your cloud snapshots</div>
                    </div>
                    <button className="btn btn-sm btn-outline-secondary" onClick={onClose}><i className="fas fa-times"></i></button>
                </div>

                {loading && <div className="text-center py-4"><span className="spinner-border spinner-border-sm me-2"></span>Loading snapshots…</div>}
                {error && <div className="alert alert-danger py-2 mb-0" style={{fontSize:'0.85rem'}}><i className="fas fa-exclamation-circle me-1"></i>{error}</div>}

                {!loading && !error && snapshots.length === 0 && (
                    <div className="text-center py-4 text-muted">
                        <i className="fas fa-cloud" style={{fontSize:'2rem',opacity:0.3,marginBottom:'0.5rem',display:'block'}}></i>
                        No snapshots yet. They appear after your next sync.
                    </div>
                )}

                {!loading && snapshots.length > 0 && (
                    <div style={{overflowY:'auto',flex:1}}>
                        {snapshots.map((snap, i) => {
                            const date = parseName(snap.name);
                            const isRestoring = restoring === snap.id;
                            const isConfirming = confirmed && confirmed.id === snap.id;
                            return (
                                <div key={snap.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0.65rem 0.75rem',background: i===0 ? '#f0fdf4' : '#f8f9fa',borderRadius:'10px',marginBottom:'0.5rem',border: i===0 ? '1px solid #bbf7d0' : '1px solid #e9ecef'}}>
                                    <div>
                                        {i === 0 && <span style={{fontSize:'0.65rem',fontWeight:'700',background:'#16a34a',color:'#fff',borderRadius:'4px',padding:'1px 5px',marginRight:'6px'}}>LATEST</span>}
                                        <div style={{fontWeight:'600',fontSize:'0.88rem',display:'inline'}}>
                                            {date ? date.toLocaleDateString([], {day:'numeric',month:'short',year:'numeric'}) : snap.name}
                                        </div>
                                        {date && <div style={{fontSize:'0.75rem',color:'#6c757d'}}>{date.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} UTC</div>}
                                    </div>
                                    <div>
                                        {isConfirming ? (
                                            <div className="d-flex flex-column align-items-end gap-1">
                                                <input type="text" className="form-control form-control-sm" style={{fontSize:'0.7rem', width:'112px'}} placeholder="Type RESTORE" value={confirmText} onChange={e => setConfirmText(e.target.value)} autoFocus />
                                                <div className="d-flex gap-1">
                                                    <button className="btn btn-danger btn-sm" style={{fontSize:'0.75rem'}} onClick={() => doRestore(snap)} disabled={!!restoring || confirmText.trim().toUpperCase() !== 'RESTORE'}>Restore</button>
                                                    <button className="btn btn-outline-secondary btn-sm" style={{fontSize:'0.75rem'}} onClick={() => { setConfirmed(null); setConfirmText(''); }}>Cancel</button>
                                                </div>
                                            </div>
                                        ) : (
                                            <button className="btn btn-sm btn-outline-primary" style={{fontSize:'0.75rem'}} onClick={() => { setConfirmed(snap); setConfirmText(''); }} disabled={!!restoring}>
                                                {isRestoring ? <span className="spinner-border spinner-border-sm"></span> : <><i className="fas fa-undo me-1"></i>Restore</>}
                                            </button>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                )}
                <div className="mt-3 pt-2" style={{borderTop:'1px solid #e9ecef',fontSize:'0.72rem',color:'#9ca3af',textAlign:'center'}}>
                    Snapshots are saved automatically on every sync · {retentionLabel}
                </div>
            </div>
        </div>
    );
}

function CloudReconnectGate({ provider, connecting, error, onConnect, onSkip }) {
    const provIcon = provider === 'gdrive' ? 'fab fa-google-drive' : 'fab fa-microsoft';
    const provLabel = provider === 'gdrive' ? 'Google Drive' : 'OneDrive';
    return (
        <AuthShell icon={provIcon} title={'Reconnect ' + provLabel} tagline="Your data is backed up on the cloud. Sign in to restore it on this device.">
            {error && <div className="sp-alert sp-alert-warn"><i className="fas fa-triangle-exclamation"></i><span>{error}</span></div>}
            <button type="button" className="sp-btn sp-btn-primary" onClick={onConnect} disabled={connecting}>
                {connecting ? <><i className="fas fa-spinner fa-spin"></i>Connecting…</> : <><i className={provIcon}></i>Connect {provLabel}</>}
            </button>
            <button type="button" className="sp-btn sp-btn-soft" style={{marginTop: '8px'}} onClick={onSkip} disabled={connecting}>Continue without syncing</button>
        </AuthShell>
    );
}

        if (this.isInitialized) return;

            const savedExpenses = localStorage.getItem('financeApp_expenses');

                    { id: 2, name: 'Transportation', icon: 'fas fa-car', subcategories: ['Gas', 'Public Transit', 'Parking', 'Uber/Lyft'], monthlyBudget: 0, subcategoryBudgets: {} },
                    { id: 3, name: 'Shopping', icon: 'fas fa-shirt', subcategories: ['Clothing', 'Electronics', 'Home', 'Personal Care'], monthlyBudget: 0, subcategoryBudgets: {} },
                    { id: 4, name: 'Entertainment', icon: 'fas fa-film', subcategories: ['Movies', 'Sports', 'Music', 'Games'], monthlyBudget: 0, subcategoryBudgets: {} },
                    { id: 5, name: 'Bills & Utilities', icon: 'fas fa-bolt', subcategories: ['Electric', 'Water', 'Internet', 'Phone'], monthlyBudget: 0, subcategoryBudgets: {} }

                const parsed = JSON.parse(savedSettings);
                if (parsed.defaultCurrency && !parsed.currency) { parsed.currency = parsed.defaultCurrency; delete parsed.defaultCurrency; }
                this.data.settings = { ...this.data.settings, ...parsed };
                this.saveSettings();
            }
            this.isInitialized = true;
        } catch (error) {
            console.error('Error initializing DataService:', error);
            this.initializeDefaultData();
            this.isInitialized = true;
        }
    }

        if (!this.data.settings.people) this.data.settings.people = [];

        const person = { id: DataService._uniqueId(), name: trimmed, relationship: (relationship || '').trim(), isDefault: !!isDefault, systemManaged: !!systemManaged };

    static updatePerson(id, updates) {

            const trimmed = updates.name.trim();

            const duplicate = this.data.settings.people.find(p => p.id !== id && p.name.toLowerCase() === trimmed.toLowerCase());
            if (duplicate) throw new Error('A person with this name already exists');

    static migratePersonName(oldName, newName) {
        const now = new Date().toISOString();
        this.data.expenses.forEach(exp => { if (exp.paidBy === oldName) { exp.paidBy = newName; exp.updatedAt = now; } });
        this.data.income.forEach(inc => { if (inc.paidBy === oldName) { inc.paidBy = newName; inc.updatedAt = now; } });
        this.saveExpenses();
        this.saveIncome();
        const accounts = this.getBankAccounts();
        let accountsChanged = false;
        accounts.forEach(a => { if (a.person === oldName) { a.person = newName; a.updatedAt = now; accountsChanged = true; } });
        if (accountsChanged) this.saveBankAccounts(accounts);
        // Net Worth items, debts, bills and reconciliations are also person-scoped (matchesActiveView
        // filters on .person) but were missing from this migration — a renamed person's existing
        // items silently vanished from every screen since they stayed tagged with the old name.
        const netWorthItems = this.getNetWorthItems();
        let netWorthChanged = false;
        netWorthItems.forEach(i => { if (i.person === oldName) { i.person = newName; i.updatedAt = now; netWorthChanged = true; } });
        if (netWorthChanged) this.saveNetWorthItems(netWorthItems);
        const renameCreatedInView = (arr) => (arr || []).map(v => v === oldName ? newName : v);
        const debts = this.getDebts();
        let debtsChanged = false;
        debts.forEach(d => {
            let touched = false;
            if (d.person === oldName) { d.person = newName; debtsChanged = true; touched = true; }
            if ((d.createdInView || []).includes(oldName)) { d.createdInView = renameCreatedInView(d.createdInView); debtsChanged = true; touched = true; }
            if (touched) d.updatedAt = now;
        });
        if (debtsChanged) this.saveDebts(debts);
        const bills = this.getBills();
        let billsChanged = false;
        bills.forEach(b => {
            let touched = false;
            if (b.person === oldName) { b.person = newName; billsChanged = true; touched = true; }
            if ((b.createdInView || []).includes(oldName)) { b.createdInView = renameCreatedInView(b.createdInView); billsChanged = true; touched = true; }
            if (touched) b.updatedAt = now;
        });
        if (billsChanged) this.saveBills(bills);
        const reconciliations = this.getReconciliations();
        let reconciliationsChanged = false;
        reconciliations.forEach(r => { if (r.person === oldName) { r.person = newName; r.updatedAt = now; reconciliationsChanged = true; } });
        if (reconciliationsChanged) this.saveReconciliations(reconciliations);
        // Goals, recurring schedules, Net Worth history snapshots, per-person category budgets and
        // the stored Active View are person-scoped by NAME as well (matchesActiveView filters goals
        // on .owner and recurring schedules on templateExpense.paidBy/.person, the history table
        // filters on .view, budgets are looked up as personBudgets[<name>]) — leaving any of them
        // out made a renamed person's data silently vanish from its screen, exactly as the
        // collections above once did. updatedAt is stamped so the rename wins a cross-device merge.
        const goals = this.getGoals();
        let goalsChanged = false;
        goals.forEach(g => { if (g.owner === oldName) { g.owner = newName; g.updatedAt = now; goalsChanged = true; } });
        if (goalsChanged) this.saveGoals(goals);
        const schedules = this.getRecurring();
        let schedulesChanged = false;
        schedules.forEach(s => {
            const t = s.templateExpense;
            if (!t) return;
            let touched = false;
            // Expense/income schedules are scoped by paidBy, asset/liability ones by person.
            if (t.paidBy === oldName) { t.paidBy = newName; touched = true; }
            if (t.person === oldName) { t.person = newName; touched = true; }
            if (touched) { s.updatedAt = now; schedulesChanged = true; }
        });
        if (schedulesChanged) this.saveRecurring(schedules);
        const history = this.getNetWorthHistory();
        let historyChanged = false;
        history.forEach(entry => {
            if (Array.isArray(entry.view) && entry.view.includes(oldName)) {
                entry.view = entry.view.map(v => v === oldName ? newName : v);
                entry.updatedAt = now;
                historyChanged = true;
            }
        });
        if (historyChanged) localStorage.setItem('financeApp_netWorthHistory', JSON.stringify(history));
        // A budget entry already sitting under the new name (left behind by a since-deleted person
        // — deletePerson doesn't clear budgets) is never overwritten; the old entry stays put too,
        // so nothing is destroyed in that rare collision.
        const hasOwn = (obj, k) => Object.prototype.hasOwnProperty.call(obj, k);
        let categoriesChanged = false;
        (this.data.categories || []).forEach(cat => {
            const pb = cat.personBudgets;
            if (!pb || !hasOwn(pb, oldName) || hasOwn(pb, newName)) return;
            pb[newName] = pb[oldName];
            delete pb[oldName];
            cat.updatedAt = now;
            categoriesChanged = true;
        });
        if (categoriesChanged) this.saveCategories();
        // The selected Active View is stored by name too. Left alone it keeps pointing at the old
        // name, which no record carries any more, so every screen would look empty until the user
        // re-picked the person. (Key mirrors ACTIVE_VIEW_KEY; the UI re-syncs App's own state.)
        try {
            const rawView = localStorage.getItem('financeApp_activeView');
            const view = rawView ? JSON.parse(rawView) : null;
            if (Array.isArray(view) && view.includes(oldName)) {
                localStorage.setItem('financeApp_activeView', JSON.stringify(view.map(v => v === oldName ? newName : v)));
            }
        } catch (_) { /* a corrupt stored view is already treated as ['own'] by getActiveView */ }
    }

    // Fee cleanup is fire-and-forget (deleteExpense is async, matching every other
    // uncoupled caller of it in this file) — the transfer record itself is removed
    // synchronously either way.
    // Deleting an Asset Funding entry also takes its amount back off the asset (approved) —
    // value and invested both drop, and the matching top-up history entry is removed. This
    // includes the opening deduction made when the asset was added. Cash withdrawals aren't
    // asset funding and never come through here.
    static revertAssetFunding(transfer) {
        if (!transfer || !transfer.toAssetId || transfer.isCashWithdrawal) return;
        const item = this.getNetWorthItems().find(i => i.id === transfer.toAssetId);
        if (!item) return;
        const amt = Number(transfer.toAmount) || 0;
        const history = [...(item.history || [])];

        if (h !== -1) history.splice(h, 1);

        this.updateNetWorthItem(item.id, { value: Math.round((item.value - amt) * 100) / 100, originalAmount: Math.round((invested - amt) * 100) / 100, history });
    }
    static deleteTransfer(id) {

    static async bulkLinkAccounts(personNames) {
        await this.initialize();
        const accounts = this.getBankAccounts();
        const expenses = this.data.expenses;
        const income = this.data.income;
        let linkedCount = 0;
        const now = new Date().toISOString();
        const normalize = (v) => (v || 'own').trim().toLowerCase();
        personNames.forEach(person => {
            const primary = accounts.find(a => a.isPrimary && a.person === person);
            if (!primary) return;
            const target = normalize(person);
            [...expenses, ...income].forEach(record => {
                if (normalize(record.paidBy) === target && !record.accountId && !record.isCashPayment && (record.currency || 'GBP') === primary.currency) {
                    record.accountId = primary.id;
                    record.updatedAt = now;
                    linkedCount++;
                }
            });
        });
        if (linkedCount > 0) { this.saveExpenses(); this.saveIncome(); }
        return linkedCount;
    }

    // Bank account types that represent debt rather than money on hand. Anything else
    // (including 'Other') is treated as an asset-type account.
    static LIABILITY_ACCOUNT_TYPES = ['Credit Card', 'Loan'];
    // Finds a Net Worth category by case-insensitive name, creating it if missing —
    // addNetWorthCategory already no-ops when the name exists, so this is safe to call
    // unconditionally (self-healing if the category was ever renamed away or deleted).
    static getOrCreateNetWorthCategoryByName(type, name) {
        let cats = this.getNetWorthCategories(type);
        let cat = cats.find(c => c.name.toLowerCase() === name.toLowerCase());
        if (!cat) { this.addNetWorthCategory(type, name); cats = this.getNetWorthCategories(type); cat = cats.find(c => c.name.toLowerCase() === name.toLowerCase()); }
        return cat;
    }
    // Money currently in a bank account: Opening Amount + everything linked to it. Linked
    // records are converted into the account's own currency rather than assumed equal —
    // the Expense/Income "Account" picker only currency-*defaults* to the primary account
    // (see resolveDefaultAccountId), it doesn't stop a user from manually linking a
    // mismatched-currency record. For Credit Card/Loan accounts the sign is reversed:
    // expenses (charges) increase what's owed, income (payments) reduces it.
    static computeBankAccountBalance(account) {
        // convertToDefaultSync covers built-in fallback rates AND custom currencies (rated against
        // another currency); a pair with no known rate still comes back unconverted, as before.
        const convert = (amount, currency) => CurrencyService.convertToDefaultSync(amount, currency, account.currency);
        const linkedIncome = this.data.income.filter(i => String(i.accountId) === String(account.id)).reduce((s, i) => s + convert(i.amount, i.currency || 'GBP'), 0);
        const linkedExpenses = this.data.expenses.filter(e => String(e.accountId) === String(account.id)).reduce((s, e) => s + convert(e.amount, e.currency || 'GBP'), 0);
        // fromAmount/toAmount are always stored in the respective account's own currency
        // (see addTransfer callers), so no conversion is needed here — avoids compounding
        // conversion error on top of the rate already applied once at transfer creation.
        const transfers = this.getTransfers();
        const transfersOut = transfers.filter(t => String(t.fromAccountId) === String(account.id)).reduce((s, t) => s + t.fromAmount, 0);
        const transfersIn = transfers.filter(t => String(t.toAccountId) === String(account.id)).reduce((s, t) => s + t.toAmount, 0);
        // Unlogged reconciliations never touch linkedIncome/linkedExpenses, so their correction
        // is folded in directly here. delta = actualBalance - computedBalance at the moment it
        // was recorded, so summing it back in reproduces actualBalance regardless of asset vs
        // liability formula, and telescopes correctly across sequential reconciliations since
        // this function is always recomputed fresh. Logged ones are excluded — they already
        // moved the balance via their real Expense/Income record, so including both would
        // double-count.
        const unloggedReconciliationDelta = this.getReconciliations()
            .filter(r => String(r.accountId) === String(account.id) && !r.loggedAsTransaction)
            .reduce((s, r) => s + r.delta, 0);
        const opening = parseFloat(account.openingAmount) || 0;
        const base = this.LIABILITY_ACCOUNT_TYPES.includes(account.accountType)
            ? opening + linkedExpenses - linkedIncome + transfersOut - transfersIn
            : opening + linkedIncome - linkedExpenses + transfersIn - transfersOut;
        return base + unloggedReconciliationDelta;
    }
    // Records a cash withdrawal: deducts `deductedAmount` (the account's own currency) from
    // the bank account via the same "phantom transfer to an asset" trick Add Money/Fund Asset
    // use (toAccountId: null, toAssetId set — computeBankAccountBalance's transfersOut already
    // nets this). Unlike Add Money/Fund Asset, this does NOT touch a stored Net Worth item —
    // see getCashWithdrawItems below for why the Cash balance is computed instead of stored.
    // toAssetId/toAssetName here are purely for the Summary audit table's display text, not a
    // real item reference (nothing looks them up), so a synthetic id is fine.
    static withdrawCash({ accountId, currency, amount, fee, feeCurrency, deductedAmount, date }) {
        const account = this.getBankAccounts().find(a => a.id === accountId);
        if (!account) return null;
        // isOverseas stays false regardless of currency mismatch — same as Add Money/Fund
        // Asset — so this only ever lists in Summary's "Asset Funding" table, not also
        // "Overseas Transfers" (those two filters aren't mutually exclusive on toAssetId).
        const conversionRate = deductedAmount > 0 ? Math.round((amount / deductedAmount) * 10000) / 10000 : 1;
        this.addTransfer({
            date, fromAccountId: account.id, toAccountId: null,
            fromAmount: deductedAmount, toAmount: amount,
            isOverseas: false, conversionRate, fee: fee || 0,
            feeExpenseId: null, principalExpenseId: null, recipientIncomeId: null,
            toAssetId: 'cash-' + (account.person || 'own') + '-' + currency, toAssetName: 'Cash', isCashWithdrawal: true,
            // toAmount is denominated in the withdrawal currency, which can differ from the
            // account's own currency (fromAmount's currency) — stored explicitly since the
            // Summary audit table sums toAmount by currency and can't assume they match.
            cashWithdrawCurrency: currency,
            // The fee's own currency, independent of the account's — user-editable, so it
            // can't be assumed to match fromAccount's currency the way it used to.
            feeCurrency: feeCurrency || account.currency,
            notes: 'Cash withdrawal — logged for audit'
        });
        return null;
    }
    // Cash on hand, computed like a linked bank account (see getBankAssetItems) rather than a
    // stored/mutated item. The old design stored a single running total that got incrementally
    // adjusted (+amount on withdrawal, -amount on a "Paid by Cash" expense) directly on a
    // persisted Net Worth item — that broke across devices, because the cross-device merge
    // picks whichever device's whole copy of the item has the newer timestamp and discards the
    // other entirely. Two devices each applying their own delta before syncing would silently
    // lose one device's adjustment. Recomputing fresh each time from the underlying transfers/
    // expenses (which already merge correctly record-by-record) avoids that class of bug and
    // self-corrects any total the old bug already threw off — see migrateCashWithdrawItemsToComputed.
    static getCashWithdrawItems(activeView) {
        const accountsById = new Map(this.getBankAccounts().map(a => [String(a.id), a]));
        const totals = {}; // key: "person|currency" -> { person, currency, value }
        const bucket = (person, currency) => {
            const key = (person || 'own') + '|' + (currency || 'GBP');
            if (!totals[key]) totals[key] = { person: person || 'own', currency: currency || 'GBP', value: 0 };
            return totals[key];
        };
        this.getTransfers().filter(t => t.isCashWithdrawal).forEach(t => {
            const account = accountsById.get(String(t.fromAccountId));
            bucket(account && account.person, t.cashWithdrawCurrency || (account && account.currency)).value += t.toAmount;
        });
        this.data.expenses.filter(e => e.isCashPayment).forEach(e => {
            bucket(e.paidBy, e.currency).value -= e.amount;

        // Unlogged reconciliations adjust — or, for a person|currency with no withdrawal/expense
        // activity yet, create — a bucket directly. This is the only way a Cash item can be
        // corrected, since its value is otherwise fully computed (see NetWorth's cash-update
        // modal); same compute-time fold-in idiom as computeBankAccountBalance above, keyed by
        // this function's own synthetic 'cash-'+key id instead of a real bank accountId.
        this.getReconciliations().filter(r => !r.loggedAsTransaction && typeof r.accountId === 'string' && r.accountId.startsWith('cash-')).forEach(r => {
            const [person, currency] = r.accountId.slice(5).split('|');
            bucket(person, currency).value += r.delta;
        });
        const keys = Object.keys(totals);
        if (keys.length === 0) return [];
        const cashCat = this.getOrCreateNetWorthCategoryByName('asset', 'Cash');
        return keys
            .map(key => ({ id: 'cash-' + key, name: 'Cash', value: totals[key].value, currency: totals[key].currency, categoryId: cashCat.id, subcategory: '', type: 'asset', person: totals[key].person, country: '', isBankAccount: true, isComputedCash: true }))
            .filter(item => !activeView || matchesActiveView(item.person, activeView));
