                        <div key={category.id} className="category-item">
                            <div className="category-header">
                                {editingCategory === category.id ? (
                                    <div className="edit-category-form">
                                        <input type="text" className={'form-control ' + (errors[category.id] ? 'is-invalid' : '')} defaultValue={category.name} onBlur={(e) => handleUpdateCategory(category.id, e.target.value)} onKeyPress={(e) => { if (e.key === 'Enter') handleUpdateCategory(category.id, e.target.value); }} autoFocus />
                                        {errors[category.id] && (<div className="invalid-feedback d-block">{errors[category.id]}</div>)}
                                    </div>
                                ) : (
                                    <div className="category-info"><h6>{category.name}</h6><span className="subcategory-count">{category.subcategories.length} subcategories</span></div>
                                )}
                                <div className="category-actions">
                                    <button className="btn btn-sm btn-outline-primary" onClick={() => setEditingCategory(editingCategory === category.id ? null : category.id)} title="Edit"><i className="fas fa-edit"></i></button>
                                    <button className="btn btn-sm btn-outline-success" onClick={() => setAddingSubcategoryTo(addingSubcategoryTo === category.id ? null : category.id)} title="Add Subcategory"><i className="fas fa-plus"></i></button>
                                    <button className="btn btn-sm btn-outline-danger" onClick={() => setShowDeleteConfirm(category.id)} title="Delete"><i className="fas fa-trash"></i></button>
                                </div>
                            </div>
                            {isSingleView && (
                            <div className="category-budget-inline">
                                {category.subcategories.length > 0 && (
                                    <div className="budget-mode-toggle">
                                        <div className="form-check">
                                            <input type="checkbox" className="form-check-input" id={'budget-mode-' + category.id} checked={categoryBudgetModes[category.id] || false} onChange={() => toggleBudgetMode(category.id)} />
                                            <label className="form-check-label" htmlFor={'budget-mode-' + category.id}>Use subcategory-level budgets</label>
                                        </div>
                                    </div>
                                )}
                                {!categoryBudgetModes[category.id] && (
                                    <div className="budget-input-row">
                                        <label className="budget-label"><i className="fas fa-calculator"></i> Category Budget:</label>
                                        <div className="input-group input-group-sm budget-input">
                                            <span className="input-group-text">{ValidationUtils.getCurrencySymbol(hasBudgetCurrencyMismatch && category.personBudgets && category.personBudgets[editingPersonKey] && category.personBudgets[editingPersonKey].budgetCurrency ? category.personBudgets[editingPersonKey].budgetCurrency : defaultCurrency)}</span>
                                            <input type="number" className="form-control" value={getCurrentBudgetValue(category.id, 'category')} onChange={(e) => handleBudgetChange(category.id, 'category', null, e.target.value)} placeholder="0.00" step="0.01" min="0" disabled={hasBudgetCurrencyMismatch} />
                                        </div>
                                    </div>
                                )}
                                {categoryBudgetModes[category.id] && category.subcategories.length > 0 && (
                                    <div className="subcategory-budgets">
                                        <div className="subcategory-budget-header"><h6>Subcategory Budgets:</h6></div>
                                        {category.subcategories.map(subcategory => {
                                            const pb = category.personBudgets && category.personBudgets[editingPersonKey];
                                            const subBudgetCurrency = hasBudgetCurrencyMismatch && pb && pb.subcategoryBudgetCurrencies && pb.subcategoryBudgetCurrencies[subcategory] ? pb.subcategoryBudgetCurrencies[subcategory] : defaultCurrency;
                                            return (
                                            <div key={subcategory} className="budget-input-row subcategory-budget-row">
                                                <label className="budget-label subcategory-label">{subcategory}:</label>
                                                <div className="input-group input-group-sm budget-input">
                                                    <span className="input-group-text">{ValidationUtils.getCurrencySymbol(subBudgetCurrency)}</span>
                                                    <input type="number" className="form-control" value={getCurrentBudgetValue(category.id, 'subcategory', subcategory)} onChange={(e) => handleBudgetChange(category.id, 'subcategory', subcategory, e.target.value)} placeholder="0.00" step="0.01" min="0" disabled={hasBudgetCurrencyMismatch} />
                                                </div>
                                            </div>
                                            );
                                        })}
                                    </div>
                                )}
                                <div className="budget-input-row">
                                    <label className="budget-label"><i className="fas fa-bell"></i> Notify me at:</label>
                                    <div className="input-group input-group-sm budget-input">
                                        <input type="number" className="form-control" value={getCurrentThresholdValue(category.id)} onChange={(e) => handleThresholdChange(category.id, e.target.value)} min="50" max="100" step="1" />

                                    const pb = category.personBudgets && category.personBudgets[editingPersonKey];

                                    return totalCategoryBudget > 0 ? (<div className="category-total-budget"><div className="total-budget-display"><strong>Total for {category.name}: {ValidationUtils.formatCurrency(totalCategoryBudget, displayCurrency)}</strong></div></div>) : null;

                                </div>

                        </div>
                    </div>
                </div>
            )}
            {renameConfirm && (
                <div className="modal show d-block" style={{backgroundColor: 'rgba(0,0,0,0.5)'}}>
                    <div className="modal-dialog modal-dialog-centered">
                        <div className="modal-content">
                            <div className="modal-header"><h5 className="modal-title">Rename Subcategory</h5></div>
                            <div className="modal-body">

                            </div>
                            <div className="modal-footer">
                                <button type="button" className="btn btn-secondary" onClick={() => setRenameConfirm(null)}>Cancel</button>
                                <button type="button" className="btn btn-primary" onClick={handleConfirmRenameSubcategory}>Rename</button>
                            </div>
                        </div>
                    </div>
                </div>
            )}
            <NetWorthCategorySection type="asset" title="Asset Categories" icon="fa-plus-circle" categories={assetCategories} onUpdate={onUpdate} />
            <NetWorthCategorySection type="liability" title="Liability Categories" icon="fa-minus-circle" categories={liabilityCategories} onUpdate={onUpdate} />
        </div>
    );
}

// Simplified category/subcategory manager for Asset & Liability net worth categories —
// same add/rename/delete + subcategory-rename-with-confirm pattern as the expense category
// list above, minus the budget UI (budgets are expense-specific).
function NetWorthCategorySection({ type, title, icon, categories, onUpdate }) {
    const [editingCategory, setEditingCategory] = useState(null);
    const [newCategoryName, setNewCategoryName] = useState('');
    const [newSubcategoryName, setNewSubcategoryName] = useState('');
    const [addingSubcategoryTo, setAddingSubcategoryTo] = useState(null);
    const [errors, setErrors] = useState({});
    const [showDeleteConfirm, setShowDeleteConfirm] = useState(null);
    const [editingSubcategory, setEditingSubcategory] = useState(null);
    const [renameConfirm, setRenameConfirm] = useState(null);
    const [renameCategoryConfirm, setRenameCategoryConfirm] = useState(null);

    const handleAddCategory = (e) => {
        e.preventDefault();
        const name = newCategoryName.trim();
        if (!name) { setErrors({ name: 'Category name is required' }); return; }
        if (categories.some(c => c.name.toLowerCase() === name.toLowerCase())) { setErrors({ name: 'Category name already exists' }); return; }
        DataService.addNetWorthCategory(type, name);
        setNewCategoryName(''); setErrors({}); onUpdate();
    };
    // Renaming a category is gated behind a confirm-with-warning modal (rather than saving
    // straight on blur/Enter) because the name is what groups items in the Net Worth summary
    // and history — a rename changes how existing items are displayed there, not just the label.
    const handleUpdateCategory = (categoryId, newName) => {
        const name = newName.trim();
        const category = categories.find(c => c.id === categoryId);
        if (!name) { setErrors({ [categoryId]: 'Category name is required' }); return; }
        if (category && name === category.name) { setEditingCategory(null); return; }
        if (categories.some(c => c.id !== categoryId && c.name.toLowerCase() === name.toLowerCase())) { setErrors({ [categoryId]: 'Category name already exists' }); return; }
        setErrors({});
        setRenameCategoryConfirm({ categoryId, oldName: category.name, newName: name, itemCount: DataService.countNetWorthCategoryUsage(type, categoryId) });
    };
    const handleConfirmUpdateCategory = () => {
        if (!renameCategoryConfirm) return;
        const { categoryId, newName } = renameCategoryConfirm;
        DataService.updateNetWorthCategory(type, categoryId, newName);
        setRenameCategoryConfirm(null); setEditingCategory(null); onUpdate();
    };
    const handleDeleteCategory = (categoryId) => {
        const usage = DataService.countNetWorthCategoryUsage(type, categoryId);
        if (usage > 0) { setErrors({ delete: `Cannot delete category. It's being used by ${usage} item(s).` }); setShowDeleteConfirm(null); return; }
        DataService.deleteNetWorthCategory(type, categoryId);
        setShowDeleteConfirm(null); setErrors({}); onUpdate();
    };
    const handleAddSubcategory = (categoryId) => {
        if (!newSubcategoryName.trim()) { setErrors({ subcategory: 'Subcategory name is required' }); return; }
        const category = categories.find(c => c.id === categoryId);
        if (category.subcategories.includes(newSubcategoryName.trim())) { setErrors({ subcategory: 'Subcategory already exists' }); return; }
        DataService.addNetWorthSubcategory(type, categoryId, newSubcategoryName.trim());
        setNewSubcategoryName(''); setAddingSubcategoryTo(null); setErrors({}); onUpdate();
    };
    const handleDeleteSubcategory = (categoryId, subcategoryName) => {
        const usage = DataService.countNetWorthSubcategoryUsage(type, categoryId, subcategoryName);
        if (usage > 0) { setErrors({ delete: `Cannot delete subcategory. It's being used by ${usage} item(s).` }); return; }
        DataService.removeNetWorthSubcategory(type, categoryId, subcategoryName);
        setErrors({}); onUpdate();
    };
    const handleStartRenameSubcategory = (categoryId, name) => { setEditingSubcategory({ categoryId, oldName: name, value: name }); setErrors(prev => ({ ...prev, subcategory: '' })); };
    const handleCancelRenameSubcategory = () => { setEditingSubcategory(null); setErrors(prev => ({ ...prev, subcategory: '' })); };
    const handleRequestRenameSubcategory = () => {
        if (!editingSubcategory) return;
        const { categoryId, oldName, value } = editingSubcategory;
        const newName = (value || '').trim();
        if (!newName) { setErrors({ subcategory: 'Subcategory name is required' }); return; }
        if (newName === oldName) { setEditingSubcategory(null); return; }
        const category = categories.find(c => c.id === categoryId);
        if (category && category.subcategories.includes(newName)) { setErrors({ subcategory: 'Subcategory already exists' }); return; }
        const usage = DataService.countNetWorthSubcategoryUsage(type, categoryId, oldName);
        setErrors(prev => ({ ...prev, subcategory: '' }));
        if (usage === 0) {
            DataService.renameNetWorthSubcategory(type, categoryId, oldName, newName);
            setEditingSubcategory(null);
            onUpdate();
            return;
        }
        setRenameConfirm({ categoryId, oldName, newName, itemCount: usage });
    };
    const handleConfirmRenameSubcategory = () => {
        if (!renameConfirm) return;
        const { categoryId, oldName, newName } = renameConfirm;
        DataService.renameNetWorthSubcategory(type, categoryId, oldName, newName);
        setRenameConfirm(null);
        setEditingSubcategory(null);
        onUpdate();
    };

    return (
        <div style={{marginTop:'1.5rem'}}>
            <h4 style={{fontSize:'1rem', marginBottom:'0.75rem'}}><i className={'fas ' + icon + ' me-2'}></i>{title}</h4>
            {errors.delete && (<div className="alert alert-danger">{errors.delete}</div>)}
            <div className="add-category-section">
                <form onSubmit={handleAddCategory} className="add-form">
                    <div className="input-group">
                        <input type="text" className={'form-control ' + (errors.name ? 'is-invalid' : '')} value={newCategoryName} onChange={(e) => { setNewCategoryName(e.target.value); if (errors.name) setErrors(prev => ({ ...prev, name: '' })); }} placeholder="Enter category name" />
                        <button type="submit" className="btn btn-primary"><i className="fas fa-plus"></i> Add</button>
                    </div>
                    {errors.name && <div className="invalid-feedback d-block">{errors.name}</div>}
                </form>
            </div>
            <div className="categories-list">
                {(categories || []).length === 0 ? (
                    <div className="empty-state"><p>No categories found</p></div>
                ) : (
                    categories.map(category => (
                        <div key={category.id} className="category-item">
                            <div className="category-header">
                                {editingCategory === category.id ? (
                                    <div className="edit-category-form">
                                        <input type="text" className={'form-control ' + (errors[category.id] ? 'is-invalid' : '')} defaultValue={category.name} onBlur={(e) => handleUpdateCategory(category.id, e.target.value)} onKeyPress={(e) => { if (e.key === 'Enter') handleUpdateCategory(category.id, e.target.value); }} autoFocus />
                                        {errors[category.id] && (<div className="invalid-feedback d-block">{errors[category.id]}</div>)}
                                    </div>
                                ) : (
                                    <div className="category-info"><h6>{category.name}</h6><span className="subcategory-count">{category.subcategories.length} subcategories</span></div>
                                )}
                                <div className="category-actions">
                                    {!category.locked && (
                                        <button className="btn btn-sm btn-outline-primary" onClick={() => setEditingCategory(editingCategory === category.id ? null : category.id)} title="Edit"><i className="fas fa-edit"></i></button>
                                    )}
                                    <button className="btn btn-sm btn-outline-success" onClick={() => setAddingSubcategoryTo(addingSubcategoryTo === category.id ? null : category.id)} title="Add Subcategory"><i className="fas fa-plus"></i></button>
                                    {!category.locked && (
                                        <button className="btn btn-sm btn-outline-danger" onClick={() => setShowDeleteConfirm(category.id)} title="Delete"><i className="fas fa-trash"></i></button>
                                    )}
                                    {category.locked && (
                                        <span className="text-muted" style={{fontSize:'0.78rem', padding:'0 4px'}} title="Default category — can't be renamed or deleted"><i className="fas fa-lock"></i></span>
                                    )}
                                </div>
                            </div>
                            {addingSubcategoryTo === category.id && (
                                <div className="add-subcategory-form">
                                    <div className="input-group input-group-sm">
                                        <input type="text" className={'form-control ' + (errors.subcategory ? 'is-invalid' : '')} value={newSubcategoryName} onChange={(e) => { setNewSubcategoryName(e.target.value); if (errors.subcategory) setErrors(prev => ({ ...prev, subcategory: '' })); }} placeholder="Enter subcategory name" onKeyPress={(e) => { if (e.key === 'Enter') handleAddSubcategory(category.id); }} />
                                        <button className="btn btn-primary" onClick={() => handleAddSubcategory(category.id)}>Add</button>
                                    </div>
                                    {errors.subcategory && (<div className="invalid-feedback d-block">{errors.subcategory}</div>)}
                                </div>
                            )}
                            {category.subcategories.length > 0 && (
                                <div className="subcategories-list">
                                    {category.subcategories.map(subcategory => (
                                        <div key={subcategory} className="subcategory-item">
                                            {editingSubcategory && editingSubcategory.categoryId === category.id && editingSubcategory.oldName === subcategory ? (
                                                <>
                                                    <input type="text" className={'form-control form-control-sm ' + (errors.subcategory ? 'is-invalid' : '')} value={editingSubcategory.value} onChange={(e) => setEditingSubcategory(prev => ({ ...prev, value: e.target.value }))} onKeyPress={(e) => { if (e.key === 'Enter') handleRequestRenameSubcategory(); }} autoFocus />
                                                    <button className="btn btn-sm btn-outline-success" onClick={handleRequestRenameSubcategory} title="Save"><i className="fas fa-check"></i></button>
                                                    <button className="btn btn-sm btn-outline-secondary" onClick={handleCancelRenameSubcategory} title="Cancel"><i className="fas fa-times"></i></button>
                                                </>
                                            ) : (
                                                <>
                                                    <span>{subcategory}</span>
                                                    <button className="btn btn-sm btn-outline-primary" onClick={() => handleStartRenameSubcategory(category.id, subcategory)} title="Edit Subcategory"><i className="fas fa-edit"></i></button>
                                                    <button className="btn btn-sm btn-outline-danger" onClick={() => handleDeleteSubcategory(category.id, subcategory)} title="Delete Subcategory"><i className="fas fa-times"></i></button>
                                                </>
                                            )}
                                        </div>
                                    ))}
                                    {editingSubcategory && editingSubcategory.categoryId === category.id && errors.subcategory && (<div className="invalid-feedback d-block">{errors.subcategory}</div>)}
                                </div>
                            )}
                        </div>
                    ))
                )}
            </div>
            {showDeleteConfirm && (
                <div className="modal show d-block" style={{backgroundColor: 'rgba(0,0,0,0.5)'}}>
                    <div className="modal-dialog modal-dialog-centered">
                        <div className="modal-content">
                            <div className="modal-header"><h5 className="modal-title">Confirm Delete</h5></div>
                            <div className="modal-body"><p>Are you sure you want to delete this category?</p></div>
                            <div className="modal-footer">
                                <button type="button" className="btn btn-secondary" onClick={() => setShowDeleteConfirm(null)}>Cancel</button>
                                <button type="button" className="btn btn-danger" onClick={() => handleDeleteCategory(showDeleteConfirm)}>Delete</button>
                            </div>
                        </div>
                    </div>
                </div>
            )}
            {renameConfirm && (
                <div className="modal show d-block" style={{backgroundColor: 'rgba(0,0,0,0.5)'}}>
                    <div className="modal-dialog modal-dialog-centered">
                        <div className="modal-content">
                            <div className="modal-header"><h5 className="modal-title">Rename Subcategory</h5></div>
                            <div className="modal-body">
                                <p>Rename <strong>{renameConfirm.oldName}</strong> to <strong>{renameConfirm.newName}</strong>?</p>
                                <p className="text-warning"><i className="fas fa-exclamation-triangle me-1"></i>This will update <strong>{renameConfirm.itemCount}</strong> item(s).</p>
                            </div>
                            <div className="modal-footer">
                                <button type="button" className="btn btn-secondary" onClick={() => setRenameConfirm(null)}>Cancel</button>
                                <button type="button" className="btn btn-primary" onClick={handleConfirmRenameSubcategory}>Rename</button>
                            </div>
                        </div>
                    </div>
                </div>
            )}
            {renameCategoryConfirm && (
                <div className="modal show d-block" style={{backgroundColor: 'rgba(0,0,0,0.5)'}}>
                    <div className="modal-dialog modal-dialog-centered">
                        <div className="modal-content">
                            <div className="modal-header"><h5 className="modal-title">Rename Category</h5></div>
                            <div className="modal-body">
                                <p>Rename <strong>{renameCategoryConfirm.oldName}</strong> to <strong>{renameCategoryConfirm.newName}</strong>?</p>
                                <p className="text-warning"><i className="fas fa-exclamation-triangle me-1"></i>This changes how {renameCategoryConfirm.itemCount > 0 ? <><strong>{renameCategoryConfirm.itemCount}</strong> existing item(s)</> : 'items'} are grouped and labeled in your Net Worth summary and history — it isn't just a display label change.</p>
                            </div>
                            <div className="modal-footer">
                                <button type="button" className="btn btn-secondary" onClick={() => setRenameCategoryConfirm(null)}>Cancel</button>
                                <button type="button" className="btn btn-primary" onClick={handleConfirmUpdateCategory}>Rename</button>
                            </div>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

function IncomeForm({ income, onUpdate, activeView }) {
    const [people, setPeople] = useState([]);
    const [formData, setFormData] = useState(() => { const initialPaidBy = resolveActiveViewValue(activeView); return { amount: '', date: new Date().toISOString().split('T')[0], source: '', description: '', paidBy: initialPaidBy, currency: 'GBP', accountId: resolveDefaultAccountId(initialPaidBy, 'GBP') }; });
    const [errors, setErrors] = useState({});
    const [isSubmitting, setIsSubmitting] = useState(false);
    const [showSuccess, setShowSuccess] = useState(false);
    const [editingIncome, setEditingIncome] = useState(null);
    const [showDeleteConfirm, setShowDeleteConfirm] = useState(null);
    const [showClearAllConfirm, setShowClearAllConfirm] = useState(false);
    const [isRecurring, setIsRecurring] = useState(false);
    const [recurringFreq, setRecurringFreq] = useState('monthly');
    const [recurringEndDate, setRecurringEndDate] = useState('');
    const [searchTerm, setSearchTerm] = useState('');
    const [filterSource, setFilterSource] = useState('');
    const [filterPerson, setFilterPerson] = useState('');
    const [filterDateFrom, setFilterDateFrom] = useState('');
    const [filterDateTo, setFilterDateTo] = useState('');
    const [visibleCount, setVisibleCount] = useState(50);
    const [openMenuId, setOpenMenuId] = useState(null);

    useEffect(() => { setPeople(DataService.getPeople()); }, []);

    // Mirrors ExpenseList: the person sub-filter only makes sense when multiple
    // participants are active — drop any stale selection once it drops back to one.
    useEffect(() => { if (activeView.length <= 1 && filterPerson) setFilterPerson(''); }, [activeView]);

    // Re-defaults the Account field to the newly-selected person's primary account (only when
    // its currency matches formData.currency) whenever "Who's Income" or the currency changes —
    // see the matching effect in ExpenseForm for the full rationale. Skipped while editing an
    // existing record so it never clobbers that record's own accountId.
    useEffect(() => {
        if (editingIncome) return;
        const nextId = resolveDefaultAccountId(formData.paidBy, formData.currency);
        setFormData(prev => (prev.accountId === nextId ? prev : { ...prev, accountId: nextId }));
    }, [formData.paidBy, formData.currency]);

    useEffect(() => {
        if (!openMenuId) return;
        const close = () => setOpenMenuId(null);
        document.addEventListener('click', close);
        return () => document.removeEventListener('click', close);
    }, [openMenuId]);

    const handleInputChange = (field, value) => { setFormData(prev => ({ ...prev, [field]: value })); if (errors[field]) setErrors(prev => ({ ...prev, [field]: '' })); };
    const handleSubmit = (e) => {
        e.preventDefault(); setIsSubmitting(true);
        const validation = ValidationUtils.validateIncome({ ...formData, amount: parseFloat(formData.amount) });
        if (!validation.isValid) { setErrors(validation.errors); setIsSubmitting(false); return; }
        try {
            const incomeData = { ...formData, amount: parseFloat(formData.amount) };
            if (editingIncome) { DataService.updateIncome(editingIncome.id, incomeData); } else { DataService.addIncomeWithConversion(incomeData); if (isRecurring) { DataService.addRecurring({ templateExpense: incomeData, frequency: recurringFreq, endDate: recurringEndDate, type: 'income' }); } }
            setShowSuccess(true);
            setTimeout(() => { const newPaidBy = resolveActiveViewValue(activeView); setFormData({ amount: '', date: new Date().toISOString().split('T')[0], source: '', description: '', paidBy: newPaidBy, currency: 'GBP', accountId: resolveDefaultAccountId(newPaidBy, 'GBP') }); setEditingIncome(null); setShowSuccess(false); onUpdate(); }, 1000);
        } catch (error) { setErrors({ general: 'Failed to save income. Please try again.' }); }
        setIsSubmitting(false);
    };
    const handleEdit = (incomeItem) => { setEditingIncome(incomeItem); setFormData({ amount: incomeItem.amount.toString(), date: incomeItem.date, source: incomeItem.source, description: incomeItem.description || '', paidBy: incomeItem.paidBy || '', currency: incomeItem.currency || 'GBP', accountId: incomeItem.accountId || '' }); };
    const handleDelete = (incomeId) => { DataService.deleteIncome(incomeId); setShowDeleteConfirm(null); onUpdate(); };
    const handleDuplicateIncome = (incomeItem) => { const duplicate = { ...incomeItem, date: new Date().toISOString().split('T')[0] }; delete duplicate.id; delete duplicate.createdAt; DataService.addIncome(duplicate); onUpdate(); };
    const handleCancelEdit = () => { setEditingIncome(null); setFormData({ amount: '', date: new Date().toISOString().split('T')[0], source: '', description: '', paidBy: '', currency: 'GBP', accountId: resolveDefaultAccountId('own', 'GBP') }); setErrors({}); };
    const totalIncome = income.reduce((sum, item) => sum + item.amount, 0);

    const filteredIncome = useMemo(() => {
        let filtered = income;
        if (filterSource) filtered = filtered.filter(item => item.source === filterSource);
        if (filterPerson === '__mine__') filtered = filtered.filter(item => !(item.paidBy || '').trim());
        else if (filterPerson) filtered = filtered.filter(item => (item.paidBy || '').trim() === filterPerson.trim());
        if (filterDateFrom) filtered = filtered.filter(item => (item.date || '').substring(0, 10) >= filterDateFrom);
        if (filterDateTo) filtered = filtered.filter(item => (item.date || '').substring(0, 10) <= filterDateTo);
        if (searchTerm) { const st = searchTerm.toLowerCase(); filtered = filtered.filter(item => (item.description || '').toLowerCase().includes(st) || (item.source || '').toLowerCase().includes(st)); }
        return filtered;
    }, [income, filterSource, filterPerson, filterDateFrom, filterDateTo, searchTerm]);

    useEffect(() => { setVisibleCount(50); }, [filteredIncome]);

    const visibleIncome = filteredIncome.slice(0, visibleCount);
    const incomeSources = [...new Set(income.map(item => item.source).filter(Boolean))].sort();
    const incomeByCurrency = filteredIncome.reduce((acc, item) => { const currency = item.currency || 'GBP'; if (!acc[currency]) acc[currency] = { total: 0, count: 0 }; acc[currency].total += item.amount; acc[currency].count += 1; return acc; }, {});
    const getSourceColor = (name) => {
        const palette = ['#4a6cf7','#e67e22','#2ecc71','#e74c3c','#9b59b6','#1abc9c','#f39c12','#3498db','#e91e63','#00bcd4','#ff5722','#607d8b'];
        let h = 0;
        for (let i = 0; i < (name||'').length; i++) h = (h * 31 + (name||'').charCodeAt(i)) & 0xffff;
        return palette[h % palette.length];
    };

    if (showSuccess) { return (<div className="screen"><div className="success-message"><i className="fas fa-check-circle"></i><h3>Income {editingIncome ? 'Updated' : 'Added'} Successfully!</h3></div></div>); }

    return (
        <div className="screen">
            <div className="screen-header">
                <h2>Income Management</h2>
                <div className="income-total">Total Income: {ValidationUtils.formatCurrency(totalIncome, income[0]?.currency || 'GBP')}</div>
            </div>
            <div className="income-form-section">
                <h5>{editingIncome ? 'Edit Income' : 'Add New Income'}</h5>
                <form onSubmit={handleSubmit} className="income-form">
                    {errors.general && (<div className="alert alert-danger">{errors.general}</div>)}
                    <div className="form-group">
                        <label htmlFor="currency">Currency *</label>
                        <select id="currency" className="form-select" value={formData.currency} onChange={(e) => handleInputChange('currency', e.target.value)}>
                            {CurrencyService.getAllCurrencies().map(c => (<option key={c.code} value={c.code}>{c.name} ({c.symbol})</option>))}
                        </select>
                    </div>
                    <div className="form-group">
                        <label htmlFor="amount">Amount *</label>
                        <div className="input-group">
                            <span className="input-group-text">{ValidationUtils.getCurrencySymbol(formData.currency)}</span>
                            <input type="number" id="amount" className={'form-control ' + (errors.amount ? 'is-invalid' : '')} value={formData.amount} onChange={(e) => handleInputChange('amount', e.target.value)} placeholder="0.00" step="0.01" min="0" />
                        </div>
                        {errors.amount && <div className="invalid-feedback d-block">{errors.amount}</div>}
                    </div>
                    <div className="form-group">
                        <label htmlFor="date">Date *</label>
                        <input type="date" id="date" className={'form-control ' + (errors.date ? 'is-invalid' : '')} value={formData.date} onChange={(e) => handleInputChange('date', e.target.value)} />
                        {errors.date && <div className="invalid-feedback">{errors.date}</div>}
                    </div>
                    <div className="form-group">
                        <label htmlFor="source">Income Source *</label>
                        <input type="text" id="source" className={'form-control ' + (errors.source ? 'is-invalid' : '')} value={formData.source} onChange={(e) => handleInputChange('source', e.target.value)} placeholder="e.g., Salary, Freelance, Investment" />
                        {errors.source && <div className="invalid-feedback">{errors.source}</div>}
                    </div>
                    <div className="form-group">
                        <label htmlFor="description">Description (Optional)</label>
                        <input type="text" id="description" className="form-control" value={formData.description} onChange={(e) => handleInputChange('description', e.target.value)} placeholder="Additional details" />
                    </div>
                    {/* Hidden when a single Active View is selected — the income is auto-tagged
                        to that person. Reappears, restricted to the selected participants,
                        when multiple are active. */}
                    {activeView.length > 1 && (
                        <div className="form-group">
                            <label htmlFor="paidBy">Who's Income</label>
                            <PersonSelect id="paidBy" value={formData.paidBy} onChange={(v) => handleInputChange('paidBy', v)} activeView={activeView} className="form-select" />
                            <div className="form-text">Select who received this income</div>
                        </div>
                    )}
                    {DataService.getAccountsForPerson(formData.paidBy || 'own').length > 0 && (
                        <div className="form-group">
                            <label htmlFor="incomeAccountId">Account</label>
                            <select id="incomeAccountId" className="form-select" value={formData.accountId} onChange={(e) => handleInputChange('accountId', e.target.value)}>
                                <option value="">— None —</option>
                                {DataService.getAccountsForPerson(formData.paidBy || 'own').map(a => (<option key={a.id} value={a.id}>{a.accountName}{a.isPrimary ? ' ★' : ''}</option>))}
                            </select>
                            <div className="form-text">Defaults to this person's primary account</div>
                        </div>
                    )}
                    {!editingIncome && (
                        <div className="form-group">
                            <div className="form-check">
                                <input className="form-check-input" type="checkbox" id="isRecurringIncome" checked={isRecurring} onChange={e => setIsRecurring(e.target.checked)} />
                                <label className="form-check-label" htmlFor="isRecurringIncome"><i className="fas fa-redo me-1"></i>Make this a recurring income</label>
                            </div>
                            {isRecurring && (
                                <div className="mt-2">
                                    <select className="form-select mb-2" value={recurringFreq} onChange={e => {
                                        const freq = e.target.value;
                                        setRecurringFreq(freq);
                                        const minEnd = computeNextDue(new Date(), freq);
                                        if (recurringEndDate && recurringEndDate < minEnd) setRecurringEndDate('');
                                    }}>
                                        <option value="daily">Daily</option>
                                        <option value="weekly">Weekly</option>
                                        <option value="monthly">Monthly</option>
                                        <option value="yearly">Yearly</option>
                                    </select>
                                    <label className="form-label small text-muted">End Date (Optional)</label>
                                    <input type="date" className="form-control" value={recurringEndDate} min={computeNextDue(new Date(), recurringFreq)} onChange={e => setRecurringEndDate(e.target.value)} />
                                </div>
                            )}
                        </div>
                    )}
                    <div className="form-actions">
                        {editingIncome && (<button type="button" className="btn btn-secondary" onClick={handleCancelEdit} disabled={isSubmitting}>Cancel</button>)}
                        <button type="submit" className="btn btn-primary" disabled={isSubmitting}>
                            {isSubmitting ? (<><span className="spinner-border spinner-border-sm me-2"></span>{editingIncome ? 'Updating...' : 'Adding...'}</>) : (<><i className="fas fa-save me-2"></i>{editingIncome ? 'Update Income' : 'Add Income'}</>)}
                        </button>
                    </div>
                </form>
            </div>
            <div className="income-history">
                <div className="d-flex align-items-center justify-content-between mb-2" style={{flexWrap: 'wrap', gap: '0.5rem'}}>
                    <h5 className="mb-0">Income History</h5>
                    {Object.keys(incomeByCurrency).length === 1 ? (
                        <div className="income-total">Total: {ValidationUtils.formatCurrency(Object.values(incomeByCurrency)[0].total, Object.keys(incomeByCurrency)[0])}</div>
                    ) : Object.keys(incomeByCurrency).length > 1 ? (
                        <div className="income-total-multi">
                            {Object.entries(incomeByCurrency).map(([currency, data]) => (<div key={currency} className="income-total-item">{ValidationUtils.formatCurrency(data.total, currency)}</div>))}

                            <i className="fas fa-trash-alt me-1"></i>Clear All
                        </button>

                    <div className="search-box">

                            <input type="text" className="form-control" placeholder="Search income..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />

                        {activeView.length > 1 && (

                                <option value="">All (selected participants)</option>
                                {activeView.includes('own') && <option value="__mine__">My Income Only</option>}
                                {activeView.filter(v => v !== 'own').map(name => (<option key={name} value={name}>{name}</option>))}

                        <input type="date" className="form-control" title="To Date" value={filterDateTo} onChange={(e) => setFilterDateTo(e.target.value)} />
                    </div>
                    {(filterSource || filterPerson || filterDateFrom || filterDateTo || searchTerm) && (

                        </button>

                ) : (
                    <div className="income-list">
                        {visibleIncome.map(incomeItem => {

                                    {(incomeItem.source || '?').charAt(0).toUpperCase()}
