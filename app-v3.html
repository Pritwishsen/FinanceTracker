                                <div className="income-info">
                                    <div className="income-source">{incomeItem.source}</div>
                                    <div className="income-meta">{metaParts.filter(Boolean).join(' · ')}</div>
                                </div>
                                {personLabel && <span className="person-badge" title={personLabel}>{personLabel}</span>}
                                <div className="income-right">
                                    <div className="income-amount">{ValidationUtils.formatCurrency(incomeItem.amount, incomeItem.currency || 'GBP')}</div>
                                    <div className="income-menu-wrap">
                                        <button className="income-menu-btn" title="Actions"
                                            onClick={(e) => { e.stopPropagation(); setOpenMenuId(openMenuId === incomeItem.id ? null : incomeItem.id); }}>
                                            <i className="fas fa-ellipsis-v"></i>
                                        </button>
                                        {openMenuId === incomeItem.id && (
                                            <div className="income-menu-dropdown">
                                                <button onClick={() => { handleEdit(incomeItem); setOpenMenuId(null); }}><i className="fas fa-edit"></i>Edit</button>
                                                <button onClick={() => { handleDuplicateIncome(incomeItem); setOpenMenuId(null); }}><i className="fas fa-copy"></i>Duplicate</button>
                                                <button className="danger" onClick={() => { setShowDeleteConfirm(incomeItem.id); setOpenMenuId(null); }}><i className="fas fa-trash"></i>Delete</button>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                            );
                        })}
                    </div>
                )}
                {visibleCount < filteredIncome.length && (
                    <div className="text-center py-3">
                        <button className="btn btn-outline-primary" onClick={() => setVisibleCount(c => c + 50)}>
                            <i className="fas fa-chevron-down me-2"></i>Load more ({filteredIncome.length - visibleCount} remaining)
                        </button>
                    </div>
                )}
            </div>
            {showDeleteConfirm && (
                <div className="modal show d-block" style={{backgroundColor: 'rgba(0,0,0,0.5)'}}>
                    <div className="modal-dialog modal-dialog-centered">
                        <div className="modal-content">
                            <div className="modal-header"><h5 className="modal-title">Confirm Delete</h5></div>
                            <div className="modal-body"><p>Are you sure you want to delete this income entry? This action cannot be undone.</p></div>
                            <div className="modal-footer">
                                <button type="button" className="btn btn-secondary" onClick={() => setShowDeleteConfirm(null)}>Cancel</button>
                                <button type="button" className="btn btn-danger" onClick={() => handleDelete(showDeleteConfirm)}>Delete</button>
                            </div>
                        </div>
                    </div>
                </div>
            )}
            {showClearAllConfirm && (
                <div className="modal show d-block" style={{backgroundColor: 'rgba(0,0,0,0.6)'}}>
                    <div className="modal-dialog modal-dialog-centered">
                        <div className="modal-content">
                            <div className="modal-header border-danger">
                                <h5 className="modal-title text-danger"><i className="fas fa-exclamation-triangle me-2"></i>Delete All Income?</h5>
                            </div>
                            <div className="modal-body">
                                <p>You are about to permanently delete <strong>all {income.length} income record{income.length !== 1 ? 's' : ''}</strong>.</p>
                                <p className="text-danger mb-0"><strong>This cannot be undone.</strong></p>
                            </div>
                            <div className="modal-footer">
                                <button type="button" className="btn btn-secondary" onClick={() => setShowClearAllConfirm(false)}>Cancel</button>
                                <button type="button" className="btn btn-danger" onClick={() => { DataService.clearAllIncome(); setShowClearAllConfirm(false); onUpdate(); }}>
                                    <i className="fas fa-trash-alt me-1"></i>Delete All
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

// Draws a bar that grows upward from a baseline with rounded top corners and a
// square bottom edge (per the app's chart mark spec — data-end rounded, baseline square).
function verticalBarPath(x, yTop, w, h, r) {
    if (h <= 0) return '';
    const radius = Math.min(r, w / 2, h);
    return `M ${x} ${yTop + h} L ${x} ${yTop + radius} Q ${x} ${yTop} ${x + radius} ${yTop} L ${x + w - radius} ${yTop} Q ${x + w} ${yTop} ${x + w} ${yTop + radius} L ${x + w} ${yTop + h} Z`;
}
const formatCompactAmount = (value, defaultCurrency) => {
    const symbol = ValidationUtils.getCurrencySymbol(defaultCurrency);
    return symbol + new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 1 }).format(value);
};

// Grouped vertical bar chart: income vs expense across a series of periods (days,
// a single month, or a run of months — the caller decides the bucketing and just
// passes {label, income, expense} entries). Colors match the existing summary
// cards above it (success green / danger red) so the same income/expense color
// mapping is used everywhere on this screen. No Y-axis: every bar carries its own
// value label instead, so the scale never needs a separate reference line/legend.
function IncomeExpenseTrendChart({ months, defaultCurrency, seriesFilter = 'both' }) {
    const [hovered, setHovered] = useState(null); // { i, series } | null
    const INCOME_COLOR = '#10b981', EXPENSE_COLOR = '#ef4444';
    const showIncome = seriesFilter !== 'expense';
    const showExpense = seriesFilter !== 'income';
    const width = 340, height = 190;
    const padding = { top: 20, right: 10, bottom: 22, left: 6 };
    const plotWidth = width - padding.left - padding.right;
    const plotHeight = height - padding.top - padding.bottom;
    const visibleValues = months.flatMap(m => [showIncome ? m.income : null, showExpense ? m.expense : null]).filter(v => v !== null);
    const rawMax = Math.max(1, ...visibleValues);
    const groupWidth = plotWidth / months.length;
    const singleSeries = !(showIncome && showExpense);
    const barWidth = singleSeries ? Math.min(28, groupWidth - 10) : Math.min(20, groupWidth / 2 - 6);
    const barGap = 3;
    const yFor = (v) => padding.top + plotHeight - (v / rawMax) * plotHeight;
    // Past ~6 months the bars get too narrow for their value labels, which start
    // overlapping neighbors. Drop the always-on labels there and rely on the existing
    // hover/tap tooltip (below) instead, rather than adding a horizontal-scroll chart.
    const showLabels = months.length <= 6;

    return (
        <div style={{ position: 'relative' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '1rem', marginBottom: '0.5rem', fontSize: '0.8rem' }}>
                {showIncome && <span style={{ display: 'flex', alignItems: 'center', gap: '0.35rem' }}><span style={{ width: 10, height: 10, borderRadius: 2, background: INCOME_COLOR, display: 'inline-block' }}></span>Income</span>}
                {showExpense && <span style={{ display: 'flex', alignItems: 'center', gap: '0.35rem' }}><span style={{ width: 10, height: 10, borderRadius: 2, background: EXPENSE_COLOR, display: 'inline-block' }}></span>Expense</span>}
            </div>
            <svg viewBox={`0 0 ${width} ${height}`} style={{ width: '100%', height: 'auto', display: 'block', overflow: 'visible' }}>
                {months.map((m, i) => {
                    const groupX = padding.left + i * groupWidth;
                    const incomeX = singleSeries ? groupX + groupWidth / 2 - barWidth / 2 : groupX + groupWidth / 2 - barWidth - barGap / 2;
                    const expenseX = singleSeries ? groupX + groupWidth / 2 - barWidth / 2 : groupX + groupWidth / 2 + barGap / 2;
                    const incomeHovered = hovered && hovered.i === i && hovered.series === 'income';
                    const expenseHovered = hovered && hovered.i === i && hovered.series === 'expense';
                    return (
                        <g key={i}>
                            {showIncome && (
                                <>
                                    <path d={verticalBarPath(incomeX, yFor(m.income), barWidth, plotHeight - (yFor(m.income) - padding.top), 4)}
                                        fill={INCOME_COLOR} opacity={incomeHovered ? 1 : 0.9} style={{ cursor: 'pointer' }} tabIndex={0}
                                        onMouseEnter={() => setHovered({ i, series: 'income' })} onMouseLeave={() => setHovered(null)}
                                        onFocus={() => setHovered({ i, series: 'income' })} onBlur={() => setHovered(null)} />
                                    {showLabels && <text x={incomeX + barWidth / 2} y={yFor(m.income) - 4} textAnchor="middle" fontSize="7.5" fill="#1f2937" fontWeight="600">{formatCompactAmount(m.income, defaultCurrency)}</text>}
                                </>
                            )}
                            {showExpense && (
                                <>
                                    <path d={verticalBarPath(expenseX, yFor(m.expense), barWidth, plotHeight - (yFor(m.expense) - padding.top), 4)}
                                        fill={EXPENSE_COLOR} opacity={expenseHovered ? 1 : 0.9} style={{ cursor: 'pointer' }} tabIndex={0}
                                        onMouseEnter={() => setHovered({ i, series: 'expense' })} onMouseLeave={() => setHovered(null)}
                                        onFocus={() => setHovered({ i, series: 'expense' })} onBlur={() => setHovered(null)} />
                                    {showLabels && <text x={expenseX + barWidth / 2} y={yFor(m.expense) - 4} textAnchor="middle" fontSize="7.5" fill="#1f2937" fontWeight="600">{formatCompactAmount(m.expense, defaultCurrency)}</text>}
                                </>
                            )}
                            <text x={groupX + groupWidth / 2} y={height - padding.bottom + 13} textAnchor="middle" fontSize="9" fill="#6b7280">{m.label}</text>
                        </g>
                    );
                })}
            </svg>
            {hovered && (() => {
                const m = months[hovered.i];
                const val = hovered.series === 'income' ? m.income : m.expense;
                const groupX = padding.left + hovered.i * groupWidth;
                const leftPct = ((groupX + groupWidth / 2) / width) * 100;
                const topPct = (yFor(val) / height) * 100;
                return (
                    <div style={{ position: 'absolute', left: leftPct + '%', top: topPct + '%', transform: 'translate(-50%, -110%)', background: '#1f2937', color: '#fff', padding: '0.3rem 0.55rem', borderRadius: '6px', fontSize: '0.72rem', pointerEvents: 'none', whiteSpace: 'nowrap', zIndex: 5 }}>
                        <strong>{ValidationUtils.formatCurrency(val, defaultCurrency)}</strong> · {hovered.series === 'income' ? 'Income' : 'Expense'} · {m.label}
                    </div>
                );
            })()}
        </div>
    );
}


const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

function Summary({ expenses, income, categories, defaultCurrency, activeView, onUpdate }) {
    const [timeRange, setTimeRange] = useState('month');
    const [selectedCategory, setSelectedCategory] = useState('');
    const [selectedPaidBy, setSelectedPaidBy] = useState('');
    const [budgetData, setBudgetData] = useState([]);
    const [convertedExpenses, setConvertedExpenses] = useState([]);
    const [chartSeriesFilter, setChartSeriesFilter] = useState('both'); // 'both' | 'income' | 'expense'
    const [expandedBudgetItems, setExpandedBudgetItems] = useState({});
    const [transfers, setTransfers] = useState(() => DataService.getTransfers());
    const bankAccountsForTransfers = React.useMemo(() => DataService.getBankAccounts(), [transfers]);
    // Deleting a transfer can also remove its linked fee Expense — refresh App's own
    // expenses/categories state (not just this component's local transfers list) so
    // Quick Stats/Budget Overview/etc. don't keep showing the now-deleted fee.
    const handleDeleteTransfer = (id) => {
        DataService.deleteTransfer(id);
        setTransfers(DataService.getTransfers());
        if (onUpdate) onUpdate();
    };
    const [reconciliations, setReconciliations] = useState(() => DataService.getReconciliations());
    const handleDeleteReconciliation = (id) => {
        DataService.deleteReconciliation(id);
        setReconciliations(DataService.getReconciliations());
        if (onUpdate) onUpdate();
    };
    // Custom time period: month+year only (no day-level picker), one pair for each end
    // of the range. Defaults to the current month so opening "Custom" starts sane.
    const [customFromMonth, setCustomFromMonth] = useState(() => new Date().getMonth());
    const [customFromYear, setCustomFromYear] = useState(() => new Date().getFullYear());
    const [customToMonth, setCustomToMonth] = useState(() => new Date().getMonth());
    const [customToYear, setCustomToYear] = useState(() => new Date().getFullYear());

    // The person sub-filter only makes sense (and is only shown) when multiple
    // participants are active — drop any stale selection once it drops back to one.
    useEffect(() => { if (activeView.length <= 1 && selectedPaidBy) setSelectedPaidBy(''); }, [activeView]);
    const [convertedIncome, setConvertedIncome] = useState([]);

    const convertAmountSync = (amount, fromCurrency, toCurrency) => {
        if (!fromCurrency || !toCurrency || fromCurrency === toCurrency) return amount;
        const rates = CurrencyService.fallbackRates[fromCurrency];
        if (rates && rates[toCurrency]) return Math.round(amount * rates[toCurrency] * 100) / 100;
        return amount;
    };

    useEffect(() => {
        const convertAll = async () => {
            const newExpenses = await Promise.all(expenses.map(async (exp) => {
                const expCurrency = exp.currency || 'GBP';
                if (expCurrency === defaultCurrency) return exp;
                try {
                    const converted = await CurrencyService.convertCurrency(exp.amount, expCurrency, defaultCurrency);
                    return { ...exp, amount: converted, currency: defaultCurrency, originalDisplayAmount: exp.amount, originalDisplayCurrency: expCurrency };
                } catch (e) {
                    return { ...exp, amount: convertAmountSync(exp.amount, expCurrency, defaultCurrency), currency: defaultCurrency };
                }
            }));
            const newIncome = await Promise.all(income.map(async (inc) => {
                const incCurrency = inc.currency || 'GBP';
                if (incCurrency === defaultCurrency) return inc;
                try {
                    const converted = await CurrencyService.convertCurrency(inc.amount, incCurrency, defaultCurrency);
                    return { ...inc, amount: converted, currency: defaultCurrency };
                } catch (e) {
                    return { ...inc, amount: convertAmountSync(inc.amount, incCurrency, defaultCurrency), currency: defaultCurrency };
                }
            }));
            setConvertedExpenses(newExpenses);
            setConvertedIncome(newIncome);
        };
        convertAll();
    }, [expenses, income, defaultCurrency]);

    const getEffectiveBudget = (category, now, person) => {
        const pb = (category.personBudgets && category.personBudgets[person]) || {};
        const currentMonthStart = new Date(now.getFullYear(), now.getMonth(), 1);
        const currentMonthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 0);
        if (pb.budgetHistory && pb.budgetHistory.length > 0) {
            const midMonthReset = pb.budgetHistory.find(h => {
                const endDate = new Date(h.endDate);
                return endDate >= currentMonthStart && endDate <= currentMonthEnd;
            });
            if (midMonthReset) {
                return { amount: midMonthReset.amount, currency: midMonthReset.currency };
            }
        }
        if (pb.useSubcategoryBudgets && pb.subcategoryBudgets) {
            const total = Object.values(pb.subcategoryBudgets).reduce((sum, v) => sum + (v || 0), 0);
            const currency = pb.budgetCurrency || (pb.subcategoryBudgetCurrencies ? Object.values(pb.subcategoryBudgetCurrencies)[0] : null) || defaultCurrency;
            return { amount: total, currency: currency };
        }
        return { amount: pb.monthlyBudget || 0, currency: pb.budgetCurrency || defaultCurrency };
    };
    const getEffectiveSubcategoryBudget = (category, subcatName, now, person) => {
        const pb = (category.personBudgets && category.personBudgets[person]) || {};
        const currentMonthStart = new Date(now.getFullYear(), now.getMonth(), 1);
        const currentMonthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 0);
        if (pb.subcategoryBudgetHistory && pb.subcategoryBudgetHistory[subcatName]) {
            const midMonthReset = pb.subcategoryBudgetHistory[subcatName].find(h => {
                const endDate = new Date(h.endDate);
                return endDate >= currentMonthStart && endDate <= currentMonthEnd;
            });
            if (midMonthReset) {
                return { amount: midMonthReset.amount, currency: midMonthReset.currency };
            }
        }
        const amount = (pb.subcategoryBudgets && pb.subcategoryBudgets[subcatName]) || 0;
        const currency = (pb.subcategoryBudgetCurrencies && pb.subcategoryBudgetCurrencies[subcatName]) || defaultCurrency;
        return { amount, currency };
    };

    const convertBudgetAmount = async (amount, fromCurrency) => {
        if (!fromCurrency || fromCurrency === defaultCurrency || amount <= 0) return amount;
        try { return await CurrencyService.convertCurrency(amount, fromCurrency, defaultCurrency); }
        catch (e) { return convertAmountSync(amount, fromCurrency, defaultCurrency); }
    };

    // Always the current calendar month, independent of the Time Period filter above —
    // budgets are inherently a "this month" concept, and this is now the only
    // category-level breakdown on the screen (Expenses by Category was removed as a
    // duplicate of this), so it stays visible no matter what period is being viewed.
    useEffect(() => {
        const now = new Date();
        const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
        const endOfMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0);
        let monthlyExpenses = convertedExpenses.filter(exp => { const d = new Date(exp.date); return d >= startOfMonth && d <= endOfMonth; });
        if (selectedPaidBy) {
            if (selectedPaidBy === 'self') { monthlyExpenses = monthlyExpenses.filter(exp => !exp.paidBy || exp.paidBy.trim() === ''); }
            else { monthlyExpenses = monthlyExpenses.filter(exp => exp.paidBy && exp.paidBy === selectedPaidBy); }
        }
        // Which person(s)' budgets to combine — narrows to a single person when "Filter by
        // Person" is set, otherwise pools every currently active person (mirrors the exact
        // narrowing already applied to monthlyExpenses above).
        const budgetPeople = selectedPaidBy ? (selectedPaidBy === 'self' ? ['own'] : [selectedPaidBy]) : activeView;
        const buildSummary = async () => {
            const summaryPromises = categories.map(async (category) => {
                const catExpenses = monthlyExpenses.filter(exp => exp.categoryId === category.id);
                const totalSpent = catExpenses.reduce((sum, exp) => sum + exp.amount, 0);
                let budget = 0;
                for (const person of budgetPeople) {
                    const eff = getEffectiveBudget(category, now, person);
                    budget += await convertBudgetAmount(eff.amount, eff.currency);
                }
                // Subcategory rows only reflect people who've opted into subcategory-level
                // budgeting for this category; others' budgets still count toward the
                // category-level total above but aren't attributed to any one subcategory.
                const subcatModePeople = budgetPeople.filter(p => category.personBudgets && category.personBudgets[p] && category.personBudgets[p].useSubcategoryBudgets);
                const subcats = [];
                if (subcatModePeople.length > 0) {
                    for (const subcatName of (category.subcategories || [])) {
                        const subcatSpent = catExpenses.filter(exp => exp.subcategory === subcatName).reduce((sum, exp) => sum + exp.amount, 0);
                        let subcatBudget = 0;
                        for (const person of subcatModePeople) {
                            const effSub = getEffectiveSubcategoryBudget(category, subcatName, now, person);
                            subcatBudget += await convertBudgetAmount(effSub.amount, effSub.currency);
                        }
                        if (subcatBudget > 0 || subcatSpent > 0) { subcats.push({ name: subcatName, budget: subcatBudget, spent: subcatSpent, remaining: subcatBudget - subcatSpent, percentage: subcatBudget > 0 ? (subcatSpent / subcatBudget) * 100 : 0, hasBudget: subcatBudget > 0 }); }
                    }
                } else {
                    // Nobody currently active budgets this category at the subcategory level. Still
                    // surface a spend-only breakdown by subcategory (no bar/remaining, since there's
                    // no subcategory budget to measure against) — the budget view itself stays category-level.
                    for (const subcatName of (category.subcategories || [])) {
                        const subcatSpent = catExpenses.filter(exp => exp.subcategory === subcatName).reduce((sum, exp) => sum + exp.amount, 0);
                        if (subcatSpent > 0) { subcats.push({ name: subcatName, budget: 0, spent: subcatSpent, remaining: 0, percentage: 0, hasBudget: false }); }
                    }
                }
                return { id: category.id, name: category.name, budget: budget, spent: totalSpent, remaining: budget - totalSpent, percentage: budget > 0 ? (totalSpent / budget) * 100 : 0, hasBudget: budget > 0, subcategories: subcats };
            });
            const summary = (await Promise.all(summaryPromises)).filter(item => item.budget > 0 || item.spent > 0);
            setBudgetData(summary);
        };
        buildSummary();
    }, [convertedExpenses, categories, selectedPaidBy, defaultCurrency, activeView]);

    const getDateRange = () => {
        const now = new Date(); let startDate, endDate = now;
        switch (timeRange) {
            case 'week': startDate = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000); break;
            case 'month': startDate = new Date(now.getFullYear(), now.getMonth(), 1); break;
            case 'year': startDate = new Date(now.getFullYear(), 0, 1); break;
            case 'threeMonths': startDate = new Date(now.getFullYear(), now.getMonth() - 2, 1); break;
            case 'sixMonths': startDate = new Date(now.getFullYear(), now.getMonth() - 5, 1); break;
            case 'custom': {
                // Month+year only pickers, so always snap to the start/end of those months.
                // Swap ends if the user picked From after To, rather than returning an
                // inverted (always-empty) range.
                const fromKey = customFromYear * 12 + customFromMonth, toKey = customToYear * 12 + customToMonth;
                const [startYear, startMonth, endYear, endMonth] = fromKey <= toKey
                    ? [customFromYear, customFromMonth, customToYear, customToMonth]
                    : [customToYear, customToMonth, customFromYear, customFromMonth];
                startDate = new Date(startYear, startMonth, 1);
                endDate = new Date(endYear, endMonth + 1, 0, 23, 59, 59, 999);
                break;
            }
            default: startDate = new Date(now.getFullYear(), now.getMonth(), 1);
        }
        return { startDate, endDate };
    };
    const filterByDateRange = (data) => { const { startDate, endDate } = getDateRange(); return data.filter(item => { const itemDate = new Date(item.date); return itemDate >= startDate && itemDate <= endDate; }); };

    let filteredExpenses = filterByDateRange(convertedExpenses);
    let filteredIncome = filterByDateRange(convertedIncome);
    if (selectedPaidBy) {
        if (selectedPaidBy === 'self') { filteredExpenses = filteredExpenses.filter(expense => !expense.paidBy || expense.paidBy.trim() === ''); filteredIncome = filteredIncome.filter(incomeItem => !incomeItem.paidBy || incomeItem.paidBy.trim() === ''); }
        else { filteredExpenses = filteredExpenses.filter(expense => expense.paidBy && expense.paidBy === selectedPaidBy); filteredIncome = filteredIncome.filter(incomeItem => incomeItem.paidBy && incomeItem.paidBy === selectedPaidBy); }
    }
    if (selectedCategory) {
        filteredExpenses = filteredExpenses.filter(exp => exp.categoryId === parseInt(selectedCategory));
    }
    const totalExpenses = filteredExpenses.reduce((sum, expense) => sum + expense.amount, 0);
    const totalIncome = filteredIncome.reduce((sum, inc) => sum + inc.amount, 0);
    const netAmount = totalIncome - totalExpenses;
    const expensesByCategory = categories.map(category => { const categoryExpenses = filteredExpenses.filter(expense => expense.categoryId === category.id); const total = categoryExpenses.reduce((sum, expense) => sum + expense.amount, 0); const percentage = totalExpenses > 0 ? (total / totalExpenses) * 100 : 0; return { ...category, total, percentage, count: categoryExpenses.length }; }).filter(category => category.total > 0).sort((a, b) => b.total - a.total);
    // Trend chart bucketing, driven by the same Time Period selector as the summary
    // cards above (still scoped by the Person/Category filters, mirroring the filtering
    // already done for filteredExpenses/filteredIncome): This Week -> 7 daily bars for
    // the current Mon-Sun; This Month -> a single bar for the whole month; every
    // multi-month period (This Year / Last 3 / Last 6 / Custom) -> one bar per
    // calendar month in that window.
    const applyTrendFilters = (exps, incs) => {
        let fe = exps, fi = incs;
        if (selectedPaidBy) {
            if (selectedPaidBy === 'self') { fe = fe.filter(exp => !exp.paidBy || exp.paidBy.trim() === ''); fi = fi.filter(inc => !inc.paidBy || inc.paidBy.trim() === ''); }
            else { fe = fe.filter(exp => exp.paidBy && exp.paidBy === selectedPaidBy); fi = fi.filter(inc => inc.paidBy && inc.paidBy === selectedPaidBy); }
        }
        if (selectedCategory) { fe = fe.filter(exp => exp.categoryId === parseInt(selectedCategory)); }
        return { fe, fi };
    };
    const trendBucket = (start, end, label) => {
        const rawExpenses = convertedExpenses.filter(exp => { const d = new Date(exp.date); return d >= start && d <= end; });
        const rawIncome = convertedIncome.filter(inc => { const d = new Date(inc.date); return d >= start && d <= end; });
        const { fe, fi } = applyTrendFilters(rawExpenses, rawIncome);
        return { label, income: fi.reduce((sum, inc) => sum + inc.amount, 0), expense: fe.reduce((sum, exp) => sum + exp.amount, 0) };
    };
    const chartPeriods = (() => {
        const now = new Date();
        if (timeRange === 'week') {
            const dow = now.getDay();
            const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + (dow === 0 ? -6 : 1 - dow));
            const days = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
                days.push(trendBucket(d, new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59, 59, 999), d.toLocaleDateString('en-US', { weekday: 'short' })));
            }
            return days;
        }
        if (timeRange === 'month') {
            const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
            const monthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59, 999);
            return [trendBucket(monthStart, monthEnd, now.toLocaleDateString('en-US', { month: 'short' }))];
        }
        let monthStarts = [];
        if (timeRange === 'year') {
            for (let m = 0; m <= now.getMonth(); m++) monthStarts.push(new Date(now.getFullYear(), m, 1));
        } else if (timeRange === 'threeMonths') {
            for (let i = 2; i >= 0; i--) monthStarts.push(new Date(now.getFullYear(), now.getMonth() - i, 1));
        } else if (timeRange === 'custom') {
            const fromKey = customFromYear * 12 + customFromMonth, toKey = customToYear * 12 + customToMonth;
            const [sY, sM, eY, eM] = fromKey <= toKey ? [customFromYear, customFromMonth, customToYear, customToMonth] : [customToYear, customToMonth, customFromYear, customFromMonth];
            let cursor = new Date(sY, sM, 1);
            const end = new Date(eY, eM, 1);
            let guard = 0;
            while (cursor <= end && guard < 60) { monthStarts.push(new Date(cursor)); cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1); guard++; }
        } else { // 'sixMonths' and fallback
            for (let i = 5; i >= 0; i--) monthStarts.push(new Date(now.getFullYear(), now.getMonth() - i, 1));
        }
        return monthStarts.map(monthDate => {
            const monthStart = new Date(monthDate.getFullYear(), monthDate.getMonth(), 1);
            const monthEnd = new Date(monthDate.getFullYear(), monthDate.getMonth() + 1, 0, 23, 59, 59, 999);
            const label = monthDate.toLocaleDateString('en-US', { month: 'short' }) + (monthDate.getFullYear() !== now.getFullYear() ? " '" + String(monthDate.getFullYear()).slice(2) : '');
            return trendBucket(monthStart, monthEnd, label);
        });
    })();
    const chartLabel = (() => {
        const now = new Date();
        switch (timeRange) {
            case 'week': case 'month': return MONTH_NAMES[now.getMonth()] + ' ' + now.getFullYear();
            case 'year': return String(now.getFullYear());
            case 'threeMonths': return 'Last 3 Months';
            case 'custom': {
                const from = MONTH_NAMES[customFromMonth].slice(0, 3) + ' ' + customFromYear;
                const to = MONTH_NAMES[customToMonth].slice(0, 3) + ' ' + customToYear;
                return from === to ? from : from + ' – ' + to;
            }
            default: return 'Last 6 Months';
        }
    })();
    const getPreviousPeriodComparison = () => { const { startDate } = getDateRange(); const periodLength = new Date() - startDate; const previousEndDate = new Date(startDate.getTime() - 1); const previousStartDate = new Date(previousEndDate.getTime() - periodLength); const previousExpenses = convertedExpenses.filter(expense => { const expenseDate = new Date(expense.date); return expenseDate >= previousStartDate && expenseDate <= previousEndDate; }); const previousTotal = previousExpenses.reduce((sum, expense) => sum + expense.amount, 0); const change = totalExpenses - previousTotal; const changePercentage = previousTotal > 0 ? (change / previousTotal) * 100 : 0; return { change, changePercentage, previousTotal }; };
    const trendData = getPreviousPeriodComparison();
    const getTopSpendingDays = () => { const dailySpending = {}; filteredExpenses.forEach(expense => { const date = expense.date; dailySpending[date] = (dailySpending[date] || 0) + expense.amount; }); return Object.entries(dailySpending).sort(([,a], [,b]) => b - a).slice(0, 5).map(([date, amount]) => ({ date, amount })); };
    const topSpendingDays = getTopSpendingDays();
    const { startDate, endDate } = getDateRange();
    const daysDiff = Math.ceil((endDate - startDate) / (1000 * 60 * 60 * 24)) || 1;
    const avgDailySpending = totalExpenses / daysDiff;

    return (
        <div className="screen">
            <div className="screen-header">
                <h2>Financial Summary</h2>
                <div className="summary-filters">
                    <div className="filter-group">
                        <label className="filter-label">Time Period:</label>
                        <select className="form-select form-select-sm" value={timeRange} onChange={(e) => setTimeRange(e.target.value)}>
                            <option value="week">This Week</option><option value="month">This Month</option><option value="year">This Year</option>
                            <option value="threeMonths">Last 3 Months</option><option value="sixMonths">Last 6 Months</option><option value="custom">Custom</option>
                        </select>
                    </div>
                    {timeRange === 'custom' && (
                        <div className="filter-group" style={{display: 'flex', gap: '0.75rem', flexWrap: 'wrap'}}>
                            <div>
                                <label className="filter-label">From:</label>
                                <div style={{display: 'flex', gap: '0.25rem'}}>
                                    <select className="form-select form-select-sm" value={customFromMonth} onChange={e => setCustomFromMonth(parseInt(e.target.value))}>
                                        {MONTH_NAMES.map((m, i) => (<option key={i} value={i}>{m}</option>))}
                                    </select>
                                    <select className="form-select form-select-sm" value={customFromYear} onChange={e => setCustomFromYear(parseInt(e.target.value))}>
                                        {Array.from({length: 8}, (_, i) => new Date().getFullYear() - i).map(y => (<option key={y} value={y}>{y}</option>))}
                                    </select>
                                </div>
                            </div>
                            <div>
                                <label className="filter-label">To:</label>
                                <div style={{display: 'flex', gap: '0.25rem'}}>
                                    <select className="form-select form-select-sm" value={customToMonth} onChange={e => setCustomToMonth(parseInt(e.target.value))}>
                                        {MONTH_NAMES.map((m, i) => (<option key={i} value={i}>{m}</option>))}
                                    </select>
                                    <select className="form-select form-select-sm" value={customToYear} onChange={e => setCustomToYear(parseInt(e.target.value))}>
                                        {Array.from({length: 8}, (_, i) => new Date().getFullYear() - i).map(y => (<option key={y} value={y}>{y}</option>))}
                                    </select>
                                </div>
                            </div>
                        </div>
                    )}
                    {/* Hidden when a single Active View is selected — data is already scoped to
                        that person upstream. Reappears, restricted to the selected
                        participants, when multiple are active. */}
                    {activeView.length > 1 && (
                        <div className="filter-group">
                            <label className="filter-label">Filter by Person:</label>
                            <select className="form-select form-select-sm" value={selectedPaidBy} onChange={(e) => setSelectedPaidBy(e.target.value)}>
                                <option value="">All (selected participants)</option>
                                {activeView.includes('own') && <option value="self">My Money Only</option>}
                                {activeView.filter(v => v !== 'own').map(person => (<option key={person} value={person}>{person}'s Money Only</option>))}
                            </select>
                        </div>
                    )}
                    <div className="filter-group">
                        <label className="filter-label">Category:</label>
                        <select className="form-select form-select-sm" value={selectedCategory} onChange={e => setSelectedCategory(e.target.value)}>
                            <option value="">All Categories</option>
                            {categories.map(c => (<option key={c.id} value={c.id}>{c.name}</option>))}
                        </select>
                    </div>
                </div>
                <div className="print-hide" style={{textAlign: 'right', marginTop: '0.5rem'}}>
                    <button className="btn btn-sm btn-outline-secondary" onClick={() => window.print()}>
                        <i className="fas fa-file-pdf me-1"></i> Download as PDF
                    </button>
                </div>
            </div>
            <div className="summary-cards">
                <div className="summary-card income"><div className="card-icon"><i className="fas fa-arrow-up"></i></div><div className="card-content"><h6>Total Income</h6><div className="amount">{ValidationUtils.formatCurrency(totalIncome, defaultCurrency)}</div>{selectedPaidBy && (<div className="filter-info">{selectedPaidBy === 'self' ? 'Your income only' : selectedPaidBy + "'s income only"}</div>)}</div></div>
                <div className="summary-card expense"><div className="card-icon"><i className="fas fa-arrow-down"></i></div><div className="card-content"><h6>Total Expenses</h6><div className="amount">{ValidationUtils.formatCurrency(totalExpenses, defaultCurrency)}</div>{selectedPaidBy && (<div className="filter-info">{selectedPaidBy === 'self' ? 'Your expenses only' : selectedPaidBy + "'s expenses only"}</div>)}{trendData.changePercentage !== 0 && (<div className={'trend ' + (trendData.change > 0 ? 'negative' : 'positive')}><i className={'fas fa-arrow-' + (trendData.change > 0 ? 'up' : 'down')}></i>{Math.abs(trendData.changePercentage).toFixed(1)}% vs last period</div>)}</div></div>
                <div className={'summary-card ' + (netAmount >= 0 ? 'positive' : 'negative')}><div className="card-icon"><i className={'fas fa-' + (netAmount >= 0 ? 'plus' : 'minus')}></i></div><div className="card-content"><h6>Net Amount</h6><div className="amount">{ValidationUtils.formatCurrency(Math.abs(netAmount), defaultCurrency)}</div><div className="trend">{netAmount >= 0 ? 'Surplus' : 'Deficit'}</div></div></div>
                <div className="summary-card info"><div className="card-icon"><i className="fas fa-calendar-day"></i></div><div className="card-content"><h6>Daily Average</h6><div className="amount">{ValidationUtils.formatCurrency(avgDailySpending, defaultCurrency)}</div><div className="trend">{daysDiff} days</div></div></div>
            </div>
            <div className="category-breakdown" style={{marginBottom: '1.5rem'}}>
                <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '0.5rem', marginBottom: '0.5rem'}}>
                    <h5 style={{margin: 0}}><i className="fas fa-chart-bar me-2"></i>Income vs Expense ({chartLabel})</h5>
                    <div className="btn-group btn-group-sm" role="group" aria-label="Chart series">
                        <button type="button" className={'btn ' + (chartSeriesFilter === 'both' ? 'btn-primary' : 'btn-outline-secondary')} onClick={() => setChartSeriesFilter('both')}>Both</button>
                        <button type="button" className={'btn ' + (chartSeriesFilter === 'income' ? 'btn-primary' : 'btn-outline-secondary')} onClick={() => setChartSeriesFilter('income')}>Income</button>
                        <button type="button" className={'btn ' + (chartSeriesFilter === 'expense' ? 'btn-primary' : 'btn-outline-secondary')} onClick={() => setChartSeriesFilter('expense')}>Expense</button>
                    </div>
                </div>
                <IncomeExpenseTrendChart months={chartPeriods} defaultCurrency={defaultCurrency} seriesFilter={chartSeriesFilter} />
            </div>
            {budgetData.length > 0 && (
                <div className="budget-overview">
                    <h5><i className="fas fa-calculator"></i> Monthly Budget Overview</h5>
                    <div className="budget-list">
                        {budgetData.map(budgetItem => {
                            const hasSubcats = budgetItem.subcategories && budgetItem.subcategories.length > 0;
                            const isExpanded = !!expandedBudgetItems[budgetItem.id];
                            return (
                                <div key={budgetItem.id} className="budget-item">
                                    <div className="budget-info">
                                        <div className="budget-name" style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '0.5rem'}}>
                                            <span>{budgetItem.name}</span>
                                            {hasSubcats && (
                                                <button type="button" className="btn btn-sm btn-link p-0" style={{fontSize: '0.78rem', textDecoration: 'none'}} onClick={() => setExpandedBudgetItems(prev => ({ ...prev, [budgetItem.id]: !prev[budgetItem.id] }))}>
                                                    {isExpanded ? 'Hide' : 'Show'} subcategories <i className={'fas fa-chevron-' + (isExpanded ? 'up' : 'down') + ' ms-1'}></i>
                                                </button>
                                            )}
                                        </div>
                                        {budgetItem.hasBudget ? (
                                            <React.Fragment>
                                                <div className="budget-bar"><div className={'budget-bar-fill ' + (budgetItem.percentage > 100 ? 'over-budget' : budgetItem.percentage > 85 ? 'near-budget' : 'under-budget')} style={{ width: Math.min(budgetItem.percentage, 100) + '%' }}></div></div>
                                                <div className="budget-amounts">
                                                    <span className="budget-spent">Spent: {ValidationUtils.formatCurrency(budgetItem.spent, defaultCurrency)}</span>
                                                    <span className={'budget-remaining ' + (budgetItem.remaining >= 0 ? 'positive' : 'negative')}>{budgetItem.remaining >= 0 ? 'Remaining: ' : 'Over by: '}{ValidationUtils.formatCurrency(Math.abs(budgetItem.remaining), defaultCurrency)}</span>
                                                </div>
                                            </React.Fragment>
                                        ) : (
                                            <div className="budget-amounts">
                                                <span className="budget-spent">Spent: {ValidationUtils.formatCurrency(budgetItem.spent, defaultCurrency)}</span>
                                                <span className="budget-remaining" style={{color: '#6c757d'}}>No budget set</span>
                                            </div>
                                        )}
                                        {isExpanded && hasSubcats && (
                                            <div style={{marginTop: '0.6rem', paddingLeft: '0.85rem', borderLeft: '2px solid #e9ecef'}}>
                                                {budgetItem.subcategories.map(sub => (
                                                    <div key={sub.name} style={{marginBottom: '0.5rem'}}>
                                                        <div style={{fontSize: '0.83rem', fontWeight: 600, marginBottom: '0.2rem'}}>{sub.name}</div>
                                                        {sub.hasBudget ? (
                                                            <React.Fragment>
                                                                <div className="budget-bar" style={{height: '6px'}}><div className={'budget-bar-fill ' + (sub.percentage > 100 ? 'over-budget' : sub.percentage > 85 ? 'near-budget' : 'under-budget')} style={{ width: Math.min(sub.percentage, 100) + '%' }}></div></div>
                                                                <div className="budget-amounts" style={{fontSize: '0.76rem'}}>
                                                                    <span className="budget-spent">Spent: {ValidationUtils.formatCurrency(sub.spent, defaultCurrency)}</span>
                                                                    <span className={'budget-remaining ' + (sub.remaining >= 0 ? 'positive' : 'negative')}>{sub.remaining >= 0 ? 'Remaining: ' : 'Over by: '}{ValidationUtils.formatCurrency(Math.abs(sub.remaining), defaultCurrency)}</span>
                                                                </div>
                                                            </React.Fragment>
                                                        ) : (
                                                            <div className="budget-amounts" style={{fontSize: '0.76rem'}}>
                                                                <span className="budget-spent">Spent: {ValidationUtils.formatCurrency(sub.spent, defaultCurrency)}</span>
                                                            </div>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            )}
            {topSpendingDays.length > 0 && (
                <div className="top-spending-days">
                    <h5>Top Spending Days</h5>
                    <div className="spending-days-list">
                        {topSpendingDays.map((day, index) => (
                            <div key={day.date} className="spending-day-item"><div className="day-rank">#{index + 1}</div><div className="day-info"><div className="day-date">{ValidationUtils.formatDate(day.date)}</div></div><div className="day-amount">{ValidationUtils.formatCurrency(day.amount, defaultCurrency)}</div></div>
                        ))}
                    </div>
                </div>
            )}
            <div className="quick-stats">
                <h5>Quick Stats</h5>
                <div className="stats-grid">
                    <div className="stat-item"><div className="stat-label">Total Transactions</div><div className="stat-value">{filteredExpenses.length}</div></div>
                    <div className="stat-item"><div className="stat-label">Largest Expense</div><div className="stat-value">{filteredExpenses.length > 0 ? ValidationUtils.formatCurrency(Math.max(...filteredExpenses.map(e => e.amount)), defaultCurrency) : ValidationUtils.formatCurrency(0, defaultCurrency)}</div></div>
                    <div className="stat-item"><div className="stat-label">Categories Used</div><div className="stat-value">{expensesByCategory.length}</div></div>
                    <div className="stat-item"><div className="stat-label">Savings Rate</div><div className="stat-value">{totalIncome > 0 ? ((netAmount / totalIncome) * 100).toFixed(1) + '%' : 'N/A'}</div></div>
                </div>
            </div>
            {(() => {
                // Scoped to the active view via the FROM account's owner, same convention
                // Wallet/Net Worth use for "which accounts belong to who's currently active",
                // and to the Summary screen's own Time Period filter, same as expenses/income.
                const dateFilteredTransfers = filterByDateRange(transfers);
                const visibleTransfers = dateFilteredTransfers.filter(t => {
                    const from = bankAccountsForTransfers.find(a => a.id === t.fromAccountId);
                    return from && matchesActiveView(from.person, activeView);
                });
                const sortedVisibleTransfers = [...visibleTransfers].sort((a, b) => new Date(b.date) - new Date(a.date));
                const overseasTransfers = sortedVisibleTransfers.filter(t => t.isOverseas);
                const accountTransfers = sortedVisibleTransfers.filter(t => !t.isOverseas && !t.toAssetId);
                const assetFundingTransfers = sortedVisibleTransfers.filter(t => t.toAssetId);
                const findAccount = (id) => bankAccountsForTransfers.find(a => a.id === id);
                const accountLabel = (id) => { const a = findAccount(id); return a ? `${a.accountName} (${a.currency})` : 'Unknown account'; };
                const ownerLabel = (id) => { const a = findAccount(id); return a ? (a.person === 'own' ? 'Me' : a.person) : '—'; };
                const currencyOf = (id) => { const a = findAccount(id); return a ? a.currency : defaultCurrency; };
                const accountTransferTotals = accountTransfers.reduce((acc, t) => { const c = currencyOf(t.fromAccountId); acc[c] = (acc[c] || 0) + t.fromAmount; return acc; }, {});
                const assetFundingTotals = assetFundingTransfers.reduce((acc, t) => { const c = currencyOf(t.fromAccountId); acc[c] = (acc[c] || 0) + t.fromAmount; return acc; }, {});
                const overseasTransferAmountTotals = overseasTransfers.reduce((acc, t) => { const c = currencyOf(t.fromAccountId); acc[c] = (acc[c] || 0) + t.fromAmount; return acc; }, {});
                const overseasTransferFeeTotals = overseasTransfers.reduce((acc, t) => { const c = currencyOf(t.fromAccountId); acc[c] = (acc[c] || 0) + (t.fee || 0); return acc; }, {});
                if (transfers.length === 0) return null;
                return (
                    <React.Fragment>
                        <div style={{marginTop: '1.25rem'}}>
                            <h5>Overseas Transfers</h5>
                            {overseasTransfers.length > 0 ? (
                                <React.Fragment>
                                <div style={{overflowX: 'auto'}}>
                                    <table className="table table-sm" style={{fontSize: '0.82rem'}}>
                                        <thead>
                                            <tr><th>From Account</th><th>Amount</th><th>Date</th><th>Transferred Amount</th><th>Conversion Rate</th><th>Fee</th><th>To Whom</th><th>Target Account</th><th></th></tr>
                                        </thead>
                                        <tbody>
                                            {overseasTransfers.map(t => (
                                                <tr key={t.id}>
                                                    <td>{accountLabel(t.fromAccountId)}</td>
                                                    <td>{ValidationUtils.formatCurrency(t.fromAmount, currencyOf(t.fromAccountId))}</td>
                                                    <td>{ValidationUtils.formatDate(t.date)}</td>
                                                    <td>{ValidationUtils.formatCurrency(t.toAmount, currencyOf(t.toAccountId))}</td>
                                                    <td>1 {currencyOf(t.fromAccountId)} = {t.conversionRate} {currencyOf(t.toAccountId)}</td>
                                                    <td>{ValidationUtils.formatCurrency(t.fee || 0, currencyOf(t.fromAccountId))}</td>
                                                    <td>{ownerLabel(t.toAccountId)}</td>
                                                    <td>{accountLabel(t.toAccountId)}</td>
                                                    <td><button type="button" className="btn btn-sm btn-outline-danger" onClick={() => handleDeleteTransfer(t.id)} title="Delete"><i className="fas fa-trash"></i></button></td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                                <div style={{marginTop: '0.4rem', fontSize: '0.82rem'}}>
                                    {Object.keys(overseasTransferAmountTotals).length === 1 ? (
                                        <div><strong>Total Transferred:</strong> {ValidationUtils.formatCurrency(Object.values(overseasTransferAmountTotals)[0], Object.keys(overseasTransferAmountTotals)[0])}</div>
                                    ) : (
                                        <div style={{display: 'flex', gap: '0.75rem', flexWrap: 'wrap'}}>
                                            <strong>Total Transferred:</strong>
                                            {Object.entries(overseasTransferAmountTotals).map(([currency, total]) => (<span key={currency}>{ValidationUtils.formatCurrency(total, currency)}</span>))}
                                        </div>
                                    )}
                                    {Object.keys(overseasTransferFeeTotals).length === 1 ? (
                                        <div><strong>Total Fees:</strong> {ValidationUtils.formatCurrency(Object.values(overseasTransferFeeTotals)[0], Object.keys(overseasTransferFeeTotals)[0])}</div>
                                    ) : (
                                        <div style={{display: 'flex', gap: '0.75rem', flexWrap: 'wrap'}}>
                                            <strong>Total Fees:</strong>
                                            {Object.entries(overseasTransferFeeTotals).map(([currency, total]) => (<span key={currency}>{ValidationUtils.formatCurrency(total, currency)}</span>))}
                                        </div>
                                    )}
                                </div>
                                </React.Fragment>
                            ) : (
                                <div style={{color: '#6c757d', fontSize: '0.85rem'}}>No overseas transfers in the selected period.</div>
                            )}
                        </div>
                        <div style={{marginTop: '1.25rem'}}>
                            <h5>Account Transfers</h5>
                            {accountTransfers.length > 0 ? (
                                <React.Fragment>
                                <div style={{overflowX: 'auto'}}>
                                    <table className="table table-sm" style={{fontSize: '0.82rem'}}>
                                        <thead>
                                            <tr><th>From Account</th><th>To Account</th><th>Amount</th><th>Date</th><th>To Whom</th><th></th></tr>
                                        </thead>
                                        <tbody>
                                            {accountTransfers.map(t => (
                                                <tr key={t.id}>

                                        </tbody>
                                    </table>
                                </div>
                                <div style={{marginTop: '0.4rem', fontSize: '0.82rem'}}>
                                    {Object.keys(assetFundingTotals).length === 1 ? (
                                        <div><strong>Total:</strong> {ValidationUtils.formatCurrency(Object.values(assetFundingTotals)[0], Object.keys(assetFundingTotals)[0])}</div>

                                        <div style={{display: 'flex', gap: '0.75rem', flexWrap: 'wrap'}}>
                                            <strong>Total:</strong>
                                            {Object.entries(assetFundingTotals).map(([currency, total]) => (<span key={currency}>{ValidationUtils.formatCurrency(total, currency)}</span>))}

                                </div>
                                </React.Fragment>

                                <div style={{color: '#6c757d', fontSize: '0.85rem'}}>No asset funding transfers in the selected period.</div>
                            )}
                        </div>
                    </React.Fragment>
                );
            })()}
            {(() => {
                const dateFilteredReconciliations = filterByDateRange(reconciliations);
                const visibleReconciliations = dateFilteredReconciliations.filter(r => matchesActiveView(r.person, activeView));
                const sortedReconciliations = [...visibleReconciliations].sort((a, b) => new Date(b.date) - new Date(a.date));
                const findAccount = (id) => bankAccountsForTransfers.find(a => a.id === id);
                const accountLabel = (id) => { const a = findAccount(id); return a ? `${a.accountName} (${a.currency})` : 'Unknown account'; };
                const personLabel = (person) => (!person || person === 'own') ? 'Me' : person;
                const currencyOf = (id) => { const a = findAccount(id); return a ? a.currency : defaultCurrency; };
                if (reconciliations.length === 0) return null;
                return (
                    <div style={{marginTop: '1.25rem'}}>
                        <h5>Balance Reconciliations</h5>
                        {sortedReconciliations.length > 0 ? (

                                    <thead>
                                        <tr><th>Account</th><th>User</th><th>Date</th><th>Reconciled Amount</th><th>Balance Before</th><th>Balance After</th><th>Logged?</th><th></th></tr>
                                    </thead>
                                    <tbody>
                                        {sortedReconciliations.map(r => (
                                            <tr key={r.id}>
                                                <td>{accountLabel(r.accountId)}</td>
                                                <td>{personLabel(r.person)}</td>
                                                <td>{ValidationUtils.formatDate(r.date)}</td>
                                                <td style={{color: r.delta > 0 ? '#198754' : '#dc3545', fontWeight: 600}}>{r.delta > 0 ? '+' : '-'}{ValidationUtils.formatCurrency(Math.abs(r.delta), currencyOf(r.accountId))}</td>
                                                <td>{ValidationUtils.formatCurrency(r.balanceBefore, currencyOf(r.accountId))}</td>
                                                <td>{ValidationUtils.formatCurrency(r.balanceAfter, currencyOf(r.accountId))}</td>
                                                <td>{r.loggedAsTransaction
                                                    ? <span className={'badge ' + (r.transactionType === 'expense' ? 'bg-danger' : 'bg-success')}>{r.transactionType === 'expense' ? 'Expense' : 'Income'}</span>
                                                    : <span className="badge bg-secondary">Not logged</span>}
                                                </td>
                                                <td><button type="button" className="btn btn-sm btn-outline-danger" onClick={() => handleDeleteReconciliation(r.id)} title="Delete"><i className="fas fa-trash"></i></button></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        ) : (
                            <div style={{color: '#6c757d', fontSize: '0.85rem'}}>No balance reconciliations in the selected period.</div>
                        )}
                    </div>
                );
            })()}
            {filteredExpenses.length === 0 && filteredIncome.length === 0 && (
                <div className="empty-state"><i className="fas fa-chart-bar fa-3x"></i><h4>No financial data for this period</h4><p>Add some income and expenses to see your financial summary.</p></div>
            )}
        </div>
    );
}

function SettingsScreen({ onCurrencyChange, currentCurrency, currentUser, onStoragePickerOpen, syncStatus, lastSyncTime, storagePreference: storagePref, onSyncNow, onReconnect, onViewHistory, activeView, onActiveViewChange, scrollTarget, onScrollTargetHandled, onDisplayNameChange, categories, onUpdate }) {

    const [bankAccounts, setBankAccounts] = useState([]);
    const [accountForm, setAccountForm] = useState(emptyAccountForm);
    const [editingAccount, setEditingAccount] = useState(null);
    const [accountErrors, setAccountErrors] = useState({});

    const [showTransferForm, setShowTransferForm] = useState(false);

    const [showReconcileForm, setShowReconcileForm] = useState(false);
    const [reconcileForm, setReconcileForm] = useState(emptyReconcileForm);
    const [reconcileErrors, setReconcileErrors] = useState({});

    const linkCandidatesAll = React.useMemo(

    );
    useEffect(() => {
        const notifSettings = JSON.parse(localStorage.getItem('financeApp_notifSettings') || '{}');

    }, []);

    useEffect(() => {
        DataService.getSettings().then(s => {
            setAutoBackupEnabled(s.autoBackupEnabled !== false);
            setCloudBackupRetention(s.cloudBackupRetention || 'count5');
        });
        setBackupHistory(DataService.getBackupHistory());
        setLastSaveTime(localStorage.getItem('financeApp_lastSaveTime') || '');
    }, []);

    const handleToggleBudgetAlerts = (enabled) => {

        const notifSettings = JSON.parse(localStorage.getItem('financeApp_notifSettings') || '{}');
        notifSettings.budgetAlertsEnabled = enabled;
        localStorage.setItem('financeApp_notifSettings', JSON.stringify(notifSettings));
    };

    const handleToggleDesktopNotif = async (enabled) => {
        if (enabled) {
            let perm = Notification.permission;
            if (perm === 'default') { perm = await Notification.requestPermission(); setNotifPermission(perm); }
            if (perm !== 'granted') { setDesktopNotifEnabled(false); return; }
        }
        setDesktopNotifEnabled(enabled);
        const notifSettings = JSON.parse(localStorage.getItem('financeApp_notifSettings') || '{}');

        localStorage.setItem('financeApp_notifSettings', JSON.stringify(notifSettings));
    };

    const handleToggleAutoBackup = async (enabled) => {

        await DataService.updateSettings({ autoBackupEnabled: enabled });

    const handleChangeBackupRetention = async (value) => {
        setCloudBackupRetention(value);

    };

    const handleDownloadBackup = () => {
        DataService.downloadBackup();

        setBackupDownloaded(true);

    const handleRestoreFileChange = (e) => {
        setRestoreError(''); setRestorePreview(null); setRestoreFile(null);
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
            try {
                const parsed = JSON.parse(evt.target.result);
                if (!parsed.version || !parsed.data) { setRestoreError('Invalid backup file. Please select a valid FinanceTracker backup.'); return; }
                setRestoreFile(parsed);
                setRestorePreview({ date: parsed.createdAt, expenses: (parsed.data.expenses || []).length, income: (parsed.data.income || []).length });
            } catch (err) { setRestoreError('Invalid backup file. Please select a valid FinanceTracker backup.'); }
        };
        reader.readAsText(file);
    };

    const handleConfirmRestore = () => {
        try {
            DataService.restoreBackup(restoreFile);
            localStorage.setItem('financeApp_skipCloudRestoreCheck', 'true');
            window.location.reload();
        }
        catch (err) { setRestoreError('Restore failed: ' + err.message); setShowRestoreConfirm(false); setRestoreConfirmText(''); }
    };

    useEffect(() => {
        DataService.getSettings().then(s => {
            // financeApp_settings.displayName is only ever written when this field is
            // explicitly saved here (or via Profile) — social sign-in (Google/Facebook)
            // never seeds it, only currentUser.displayName. Fall back to that so the field
            // shows the name the app already picked up at sign-in instead of appearing blank.
            const name = s.displayName || (currentUser && currentUser.displayName) || '';
            setDisplayName(name);
            setSavedDisplayName(name);
        });
    }, []);

    const handleSaveDisplayName = async () => {
        setNameError('');
        const newName = displayName.trim();
        if (!newName || newName.length < 2) { setNameError('Name must be at least 2 characters'); return; }
        if (newName.length > 50) { setNameError('Name must be 50 characters or fewer'); return; }
        if (!/^[a-zA-Z\s\-']+$/.test(newName)) { setNameError("Only letters, spaces, hyphens and apostrophes are allowed"); return; }
        const settings = await DataService.getSettings();
        const oldName = settings.displayName || '';
        await DataService.updateSettings({ displayName: newName });
        if (oldName && oldName !== newName) DataService.migratePersonName(oldName, newName);
        try {
            const allPeople = DataService.getPeople();
            const systemPerson = allPeople.find(p => p.systemManaged === true);
            if (systemPerson) {
                DataService.updatePerson(systemPerson.id, { name: newName });
            } else {
                DataService.addPerson({ name: newName, isDefault: true, systemManaged: true });
            }
            setPeople(DataService.getPeople());
        } catch (e) { /* name conflict — still save display name */ }
        // Keep financeApp_currentUser (and App's currentUser state, via the callback) in
        // sync too — this save path previously only touched financeApp_settings and the
        // systemManaged person record, leaving the header's name pill showing the stale
        // pre-edit name until the next full login/reload.
        if (currentUser) {
            localStorage.setItem('financeApp_currentUser', JSON.stringify({ ...currentUser, displayName: newName }));

        if (onDisplayNameChange) onDisplayNameChange(newName);

    const handleAddPerson = (e) => {

                DataService.addPerson({ name: personForm.name, relationship: personForm.relationship, isDefault: personForm.isDefault });

    const transferFromAccount = bankAccounts.find(a => a.id === parseInt(transferForm.fromAccountId));

    const isOverseasTransfer = !!(transferFromAccount && transferToAccount && transferFromAccount.currency !== transferToAccount.currency);
    const isCrossPersonTransfer = !!(transferFromAccount && transferToAccount && transferFromAccount.person !== transferToAccount.person);
    const transferFeeCategory = categories.find(c => c.id === parseInt(transferForm.categoryId));
    const transferPrincipalCategory = categories.find(c => c.id === parseInt(transferForm.principalCategoryId));

    const handleSubmitReconcile = async (e) => {

        if (!reconcileForm.accountId) errors.accountId = 'Choose an account';
