                    <button key={t} type="button" className={'sp-chip' + (subject === t ? ' is-active' : '')} onClick={() => setSubject(prev => prev === t ? '' : t)}>{t}</button>
                ))}
            </div>
            <div className="sp-label">Message</div>
            <textarea className="sp-textarea" rows={5} placeholder="Tell us what happened and what you expected." value={details} onChange={e => setDetails(e.target.value)} maxLength={5000}></textarea>
            <div style={{display: 'flex', justifyContent: 'flex-end', margin: '5px 2px 12px'}}>
                <span className="sp-hint" style={{color: details.length > 4500 ? '#e11d48' : undefined}}>{details.length}/5000</span>
            </div>
            <div className="sp-btn-row">
                {!hideCancel && <button type="button" className="sp-btn sp-btn-soft" style={{flex: 1}} onClick={onCancel} disabled={isSending}>Cancel</button>}
                <button type="button" className="sp-btn sp-btn-dark" style={{flex: 1.6}} onClick={handleSend} disabled={isSending || !subject.trim() || !details.trim()}>
                    <i className={isSending ? 'fas fa-spinner fa-spin' : 'fas fa-paper-plane'}></i>{isSending ? 'Sending…' : 'Send'}
                </button>
            </div>
        </div>
    );
}

function DisplayNamePrompt({ onRegister }) {
    const [name, setName] = useState('');
    const [error, setError] = useState('');
    const [saving, setSaving] = useState(false);

    const handleSave = async () => {
        const trimmed = name.trim();
        if (!trimmed || trimmed.length < 2) { setError('Name must be at least 2 characters'); return; }
        if (trimmed.length > 50) { setError('Name must be 50 characters or fewer'); return; }
        if (!/^[a-zA-Z\s\-']+$/.test(trimmed)) { setError("Only letters, spaces, hyphens and apostrophes allowed"); return; }
        setSaving(true);
        try {
            const user = JSON.parse(localStorage.getItem('financeApp_currentUser') || '{}');
            const updated = { ...user, displayName: trimmed };
            localStorage.setItem('financeApp_currentUser', JSON.stringify(updated));
            await DataService.updateSettings({ displayName: trimmed });
            try { DataService.addPerson({ name: trimmed, isDefault: true, systemManaged: true }); } catch (_) {}
            onRegister(updated);
        } catch (e) { setError('Failed to save. Please try again.'); setSaving(false); }
    };

    return (
        <AuthShell icon="fas fa-id-badge" title="What should we call you?" tagline="This name will appear across your expenses and reports.">
            {error && <div className="sp-alert sp-alert-err"><i className="fas fa-triangle-exclamation"></i><span>{error}</span></div>}
            <SpField label="Display name" icon="fas fa-user" state={error ? 'bad' : null}>
                <input type="text" placeholder="Your name" value={name} onChange={e => { setName(e.target.value); setError(''); }} onKeyDown={e => { if (e.key === 'Enter' && !saving) handleSave(); }} autoFocus />
            </SpField>
            <button type="button" className="sp-btn sp-btn-primary" onClick={handleSave} disabled={saving}>
                <i className={saving ? 'fas fa-spinner fa-spin' : 'fas fa-arrow-right'}></i>{saving ? 'Saving…' : 'Continue'}
            </button>
        </AuthShell>
    );
}

function ExportData({ expenses, income, categories, netWorthItems = [], assetCategories = [], liabilityCategories = [], defaultCurrency, activeView, onNavigate }) {
    const [format, setFormat] = useState('csv');
    const [scope, setScope] = useState('all');
    const [fromDate, setFromDate] = useState('');
    const [toDate, setToDate] = useState('');
    const [toast, setToast] = useState('');
    const [printing, setPrinting] = useState(false);

    const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 3500); };

    const todayStr = () => DateUtils.today();

    const getDateRange = () => {
        if (fromDate || toDate) return { from: fromDate || null, to: toDate || null };
        if (scope === 'current-month') {
            const n = new Date(), y = n.getFullYear(), m = n.getMonth();
            return { from: DateUtils.toDateStr(new Date(y, m, 1)), to: DateUtils.toDateStr(new Date(y, m + 1, 0)) };
        }
        return { from: null, to: null };
    };

    const inRange = (dateStr, from, to) => {
        if (!dateStr) return true;
        if (from && dateStr < from) return false;
        if (to && dateStr > to) return false;
        return true;
    };

    const exportToCSV = downloadCSV;

    const getCatName = (id) => { const c = categories.find(c => c.id === id); return c ? c.name : id || ''; };
    const getSubName = (cid, sid) => { const c = categories.find(c => c.id === cid); if (!c || !c.subcategories) return sid || ''; const s = c.subcategories.find(s => s.id === sid); return s ? s.name : sid || ''; };
    // Bank accounts aren't pre-filtered/passed down like categories are — read directly,
    // matching how BulkUpload already reads DataService.getBankAccounts() itself.
    const bankAccounts = DataService.getBankAccounts();
    const getBankName = (accountId) => { const a = bankAccounts.find(a => a.id === accountId); return a ? a.accountName : ''; };
    // Net Worth/Liability items keep separate category lists per type, unlike Expense's
    // single shared list — look up against whichever list matches the item's own type.
    const getNWCatName = (item) => {
        const list = item.type === 'asset' ? assetCategories : liabilityCategories;
        const c = list.find(c => c.id === item.categoryId);
        return c ? c.name : '';
    };

    // Net Worth/Liabilities columns are deliberately identical between export and import
    // (see BulkUpload) so a file exported here reproduces exactly on re-import — unlike the
    // Expense/Income columns above, which include Tags/Notes that import doesn't read.
    // Bank: only set for a row that IS a linked bank/credit-card/loan account (isBankAccount,
    // but not the computed Cash figure, which isn't tied to one single account) — this is what
    // lets Bulk Upload reliably recognize "this row is already tracked automatically, don't
    // recreate it as a manual duplicate" on re-import, without guessing from the category name
    // alone (a user could have a manual item filed under "Bank & Savings" too).
    const nwHeaders = ['Name','Value','Currency','Category','Sub Category','Original Amount','Person','Country','Bank','Notes'];
    const nwRow = (item) => [item.name, item.value, item.currency || defaultCurrency, getNWCatName(item), item.subcategory || '', item.originalAmount != null ? item.originalAmount : item.value, item.person || 'own', item.country || '', (item.isBankAccount && !item.isComputedCash) ? item.name : '', item.notes || ''];

    const handleExport = () => {
        if (format === 'pdf') {
            if (onNavigate) onNavigate('summary');
            setPrinting(true);
            setTimeout(() => { window.print(); setTimeout(() => setPrinting(false), 2000); }, 400);
            return;
        }
        const { from, to } = getDateRange();
        const doExp = scope === 'all' || scope === 'expenses-only' || scope === 'current-month';
        const doInc = scope === 'all' || scope === 'income-only' || scope === 'current-month';
        // Assets/Liabilities are current balances, not dated transactions — the date range
        // (including the "Current Month" scope) never applies to them, only these two scopes do.
        const doAssets = scope === 'all' || scope === 'assets-only';
        const doLiab = scope === 'all' || scope === 'liabilities-only';
        const filteredExp = doExp ? expenses.filter(e => inRange(e.date, from, to)) : [];
        const filteredInc = doInc ? income.filter(i => inRange(i.date, from, to)) : [];
        // "Assets" is every asset-type row the Net Worth screen shows, not just manually-added
        // ones — linked Bank & Savings accounts and the computed Cash Withdraw figure are just
        // as much a part of your net worth, so a snapshot that omits them isn't a full one.
        const filteredAssets = doAssets ? [
            ...netWorthItems.filter(i => i.type === 'asset'),
            ...DataService.getBankAssetItems(activeView),
            ...DataService.getCashWithdrawItems(activeView),
        ] : [];
        const filteredLiab = doLiab ? [
            ...netWorthItems.filter(i => i.type === 'liability'),
            ...DataService.getBankLiabilityItems(activeView),
        ] : [];
        const expHeaders = ['Date','Description','Amount','Currency','Category','Sub Category','Paid By','Payment Method','Bank','Tags','Notes'];
        const incHeaders = ['Date','Source of Income','Currency','Amount',"Who's Income",'Bank'];
        const expRows = filteredExp.map(e => [e.date, e.description || '', e.amount, e.currency || defaultCurrency, getCatName(e.categoryId), e.subcategory || '', e.paidBy || '', e.isCashPayment ? 'Cash' : e.accountId ? 'Bank' : '', getBankName(e.accountId), (e.tags || []).join(';'), e.notes || '']);
        const incRows = filteredInc.map(i => [i.date, i.source || '', i.currency || defaultCurrency, i.amount, i.paidBy || '', getBankName(i.accountId)]);
        const assetRows = filteredAssets.map(nwRow);
        const liabRows = filteredLiab.map(nwRow);
        const exportJobs = [
            filteredExp.length > 0 && { filename: `financetracker-expenses-${todayStr()}.csv`, headers: expHeaders, rows: expRows },
            filteredInc.length > 0 && { filename: `financetracker-income-${todayStr()}.csv`, headers: incHeaders, rows: incRows },
            filteredAssets.length > 0 && { filename: `financetracker-assets-${todayStr()}.csv`, headers: nwHeaders, rows: assetRows },
            filteredLiab.length > 0 && { filename: `financetracker-liabilities-${todayStr()}.csv`, headers: nwHeaders, rows: liabRows },
        ].filter(Boolean);
        if (exportJobs.length === 0) { showToast('No records match. Export will be empty.'); return; }
        exportJobs.forEach((job, idx) => setTimeout(() => exportToCSV(job.filename, job.headers, job.rows), idx * 200));
    };

    const scopeOptions = [
        { value: 'all', label: 'All Data' },
        { value: 'expenses-only', label: 'Expenses Only' },
        { value: 'income-only', label: 'Income Only' },
        { value: 'assets-only', label: 'Assets Only' },
        { value: 'liabilities-only', label: 'Liabilities Only' },
        { value: 'current-month', label: 'Current Month' }
    ];

                            ))}

                    </div>

                    {format === 'csv' && (
                        <div className="mb-3">
                            <label className="form-label fw-semibold">Scope</label>
                            <div className="d-flex flex-wrap gap-2">

                                ))}

                                    <input type="date" className="form-control form-control-sm" value={fromDate} onChange={e => setFromDate(e.target.value)} />
                                </div>
                                <div className="flex-fill">
                                    <label className="form-label small text-muted mb-1">To</label>
                                    <input type="date" className="form-control form-control-sm" value={toDate} onChange={e => setToDate(e.target.value)} />

                                {(fromDate || toDate) && <div className="d-flex align-items-end pb-1"><button className="btn btn-sm btn-outline-secondary" onClick={() => { setFromDate(''); setToDate(''); }} title="Clear dates">✕</button></div>}

            {format === 'pdf' && (
                <div className="alert alert-info small mb-3">

                </div>

            {format === 'csv' && (
                <div className="alert alert-light small mb-3 text-muted border">
                    <i className="fas fa-info-circle me-2"></i>Amounts are exported in their original stored currency. A Currency column is included in each file.
                    {scope === 'all' && ' All Data exports up to four files: expenses, income, assets, and liabilities.'}
                    {' '}Assets and Liabilities aren&rsquo;t affected by the date range — they&rsquo;re current balances, not dated transactions.
                </div>
            )}

            <button className="btn btn-primary w-100 fw-semibold py-2" onClick={handleExport} style={gradientBtn}>
                <i className={'fas fa-' + (format === 'pdf' ? 'print' : 'download') + ' me-2'}></i>
                {format === 'pdf' ? 'Print / Save as PDF' : 'Download CSV'}
            </button>

            {printing && (
                <div className="text-center text-muted mt-3 small"><span className="spinner-border spinner-border-sm me-2"></span>Opening print dialog…</div>
            )}

            {toast && (
                <div style={{position: 'fixed', bottom: '5rem', left: '50%', transform: 'translateX(-50%)', background: '#333', color: '#fff', padding: '0.65rem 1.25rem', borderRadius: '8px', zIndex: 9999, fontSize: '0.88rem', whiteSpace: 'nowrap', boxShadow: '0 4px 12px rgba(0,0,0,0.3)'}}>
                    <i className="fas fa-exclamation-circle me-2"></i>{toast}

        </div>
    );

function ProfileScreen({ currentUser, onLogout, onUpdate, onDisplayNameChange, onClose, pendingSince }) {
    const [user, setUser] = useState({ ...currentUser });
    const [editingName, setEditingName] = useState(false);
    const [newName, setNewName] = useState(user.displayName || '');
    const [nameError, setNameError] = useState('');
    const [nameSaving, setNameSaving] = useState(false);
    const [nameSuccess, setNameSuccess] = useState('');
    const [currPw, setCurrPw] = useState('');
    const [newPw, setNewPw] = useState('');
    const [confirmPw, setConfirmPw] = useState('');
    const [pwError, setPwError] = useState('');
    const [pwSuccess, setPwSuccess] = useState('');
    const [showCurrPw, setShowCurrPw] = useState(false);
    const [showNewPw, setShowNewPw] = useState(false);
    const [showConfirmPw, setShowConfirmPw] = useState(false);
    const [showLogoutConfirm, setShowLogoutConfirm] = useState(false);

    const handleSaveName = async () => {
        const trimmed = newName.trim();
        if (!trimmed || trimmed.length < 2) { setNameError('Name must be at least 2 characters'); return; }
        if (trimmed.length > 50) { setNameError('Name must be 50 characters or fewer'); return; }
        if (!/^[a-zA-Z\s\-']+$/.test(trimmed)) { setNameError("Only letters, spaces, hyphens and apostrophes allowed"); return; }
        setNameSaving(true);
        try {
            const oldName = user.displayName;
            if (oldName && oldName !== trimmed) DataService.migratePersonName(oldName, trimmed);
            const people = DataService.getPeople();
            const match = people.find(p => p.name === oldName && p.systemManaged);
            if (match) { try { DataService.updatePerson(match.id, { name: trimmed }); } catch (_) {} }
            const updated = { ...user, displayName: trimmed };
            localStorage.setItem('financeApp_currentUser', JSON.stringify(updated));
            await DataService.updateSettings({ displayName: trimmed });
            setUser(updated);
            setEditingName(false);
            setNameSuccess('Display name updated.');
            setTimeout(() => setNameSuccess(''), 3000);
            if (onDisplayNameChange) onDisplayNameChange(trimmed);
            if (onUpdate) onUpdate();
        } catch (e) { setNameError('Failed to save. Please try again.'); }
        setNameSaving(false);
    };

    const handleChangePw = async () => {
        setPwError(''); setPwSuccess('');
        if (!newPw || newPw.length < 8) { setPwError('New password must be at least 8 characters.'); return; }
        if (newPw !== confirmPw) { setPwError('New passwords do not match.'); return; }
        if (AuthUtils.firebaseReady) {
            try {
                const fbUser = window.__firebaseAuth.currentUser;
                if (!fbUser) { setPwError('Session expired. Please sign out and sign in again.'); return; }
                const { EmailAuthProvider } = firebase.auth;
                const credential = EmailAuthProvider.credential(fbUser.email, currPw);
                await fbUser.reauthenticateWithCredential(credential);
                await fbUser.updatePassword(newPw);
                // Rotate the backup signing key: a device compromised before this password
                // change shouldn't keep a usable key after the account is re-secured
                rotateBackupSignKey(fbUser.uid);
                setCurrPw(''); setNewPw(''); setConfirmPw('');
                setPwSuccess('Password changed successfully.');
                setTimeout(() => setPwSuccess(''), 4000);
            } catch (err) {
                const mapped = AuthUtils.mapFirebaseError(err.code);
                if (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
                    setPwError('Current password is incorrect.');
                } else if (mapped) {
                    setPwError(mapped.message);
                } else {
                    setPwError('Failed to change password. Please try again.');
                }
            }
        } else {
            const stored = (() => { try { return JSON.parse(localStorage.getItem('financeApp_currentUser') || '{}'); } catch (_) { return {}; } })();
            if (stored.password && !stored.passwordHash) {
                stored.passwordHash = await AuthUtils.hashPassword(stored.password);
                delete stored.password;
                localStorage.setItem('financeApp_currentUser', JSON.stringify(stored));
            }
            const currentOk = await AuthUtils.verifyPassword(currPw, stored.passwordHash || '');
            if (!currentOk) { setPwError('Current password is incorrect.'); return; }
            stored.passwordHash = await AuthUtils.hashPassword(newPw);
            delete stored.password;
            localStorage.setItem('financeApp_currentUser', JSON.stringify(stored));
            // Rotate the backup signing key: a device compromised before this password
            // change shouldn't keep a usable key after the account is re-secured
            rotateBackupSignKey(stored.uid || String(stored.id));
            setCurrPw(''); setNewPw(''); setConfirmPw('');
            setPwSuccess('Password changed successfully.');
            setTimeout(() => setPwSuccess(''), 4000);
        }
    };

    const handleLogoutConfirm = async () => {
        await AuthUtils.signOut();
        await onLogout();
    };

    const providerLabel = { email: 'Email & Password', google: 'Google', facebook: 'Facebook' };
    const providerIcon = { email: 'fas fa-envelope', google: 'fab fa-google', facebook: 'fab fa-facebook', firebase: 'fas fa-envelope' };
    const createdDate = user.createdAt ? new Date(user.createdAt).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : '—';
    const [pwOpen, setPwOpen] = useState(false);
    const [loggingOut, setLoggingOut] = useState(false);
    useEffect(() => { if (pwSuccess) setPwOpen(false); }, [pwSuccess]);
    const eyeBtn = (shown, toggle) => (
        <button type="button" className="sp-field-eye" onClick={toggle} tabIndex={-1} title="Show or hide password"><i className={'fas fa-' + (shown ? 'eye-slash' : 'eye')}></i></button>
    );

    // Rendered inside a bottom sheet opened from the header avatar (redesign Phase 0).
    return (
        <div>
            <div className="sp-card-head">
                <span className="sp-av" style={{width: '44px', height: '44px', fontSize: '17px', background: '#0f172a', color: '#fff', border: 'none'}}>{(user.displayName || '?').trim().charAt(0).toUpperCase()}</span>
                <div className="sp-row-main"><div className="sp-sheet-title">{user.displayName}</div><div className="sp-row-sub">Signed in · primary user</div></div>
                {onClose && <button type="button" className="sp-sheet-close" onClick={onClose} title="Close"><i className="fas fa-xmark"></i></button>}
            </div>
            {nameSuccess && <div className="sp-alert sp-alert-ok"><i className="fas fa-circle-check"></i><span>{nameSuccess}</span></div>}

            <div className="sp-section-label">Display name</div>
            {editingName ? (
                <div style={{marginBottom: '12px'}}>
                    {nameError && <div className="sp-alert sp-alert-err"><i className="fas fa-triangle-exclamation"></i><span>{nameError}</span></div>}
                    <div className={'sp-field' + (nameError ? ' is-bad' : '')} style={{background: '#fff'}}>
                        <i className="fas fa-id-badge sp-field-icon"></i>
                        <input type="text" value={newName} onChange={e => { setNewName(e.target.value); setNameError(''); }} autoFocus />
                    </div>
                    <div className="sp-btn-row">
                        <button type="button" className="sp-btn sp-btn-soft" style={{flex: 1, background: '#fff'}} onClick={() => { setEditingName(false); setNewName(user.displayName || ''); setNameError(''); }}>Cancel</button>
                        <button type="button" className="sp-btn sp-btn-dark sp-btn-sm" style={{flex: 1.6}} onClick={handleSaveName} disabled={nameSaving}>{nameSaving ? 'Saving…' : 'Save name'}</button>
                    </div>
                </div>
            ) : (
                <div className="sp-rowcard">
                    <div className="sp-row">
                        <span className="sp-row-title">{user.displayName}</span>
                        <button type="button" className="sp-row-btn" style={{marginLeft: 'auto'}} onClick={() => { setEditingName(true); setNewName(user.displayName || ''); }} title="Edit name"><i className="fas fa-pen"></i></button>
                    </div>
                </div>
            )}

            <div className="sp-rowcard">
                <div className="sp-row"><span className="sp-row-label">Email</span><span className="sp-row-value">{user.email || '—'}<i className="fas fa-lock" style={{marginLeft: '6px', color: '#cbd5e1', fontSize: '11px'}}></i></span></div>
                <div className="sp-row"><span className="sp-row-label">Sign-in method</span><span className="sp-row-value"><i className={providerIcon[user.authProvider] || 'fas fa-key'} style={{marginRight: '6px', color: '#94a3b8'}}></i>{providerLabel[user.authProvider] || user.authProvider || '—'}</span></div>
                <div className="sp-row"><span className="sp-row-label">Account created</span><span className="sp-row-value">{createdDate}</span></div>
            </div>

            {user.authProvider === 'email' && (
                !pwOpen && !pwSuccess ? (
                    <div className="sp-rowcard">
                        <button type="button" className="sp-row" style={{width: '100%', background: 'none', border: 'none', cursor: 'pointer', fontFamily: 'inherit'}} onClick={() => setPwOpen(true)}>
                            <i className="fas fa-lock" style={{color: '#94a3b8'}}></i>
                            <span className="sp-row-title">Change password</span>
                            <i className="fas fa-chevron-right" style={{marginLeft: 'auto', color: '#cbd5e1', fontSize: '12px'}}></i>
                        </button>
                    </div>
                ) : pwSuccess ? (
                    <div className="sp-alert sp-alert-ok"><i className="fas fa-circle-check"></i><span>{pwSuccess}</span></div>
                ) : (
                    <div className="sp-rowcard" style={{padding: '12px 14px'}}>
                        <div className="sp-row-title" style={{marginBottom: '10px'}}>Change password</div>
                        {pwError && <div className="sp-alert sp-alert-err"><i className="fas fa-triangle-exclamation"></i><span>{pwError}</span></div>}
                        <SpField icon="fas fa-lock" trailing={eyeBtn(showCurrPw, () => setShowCurrPw(v => !v))}>
                            <input type={showCurrPw ? 'text' : 'password'} placeholder="Current password" value={currPw} onChange={e => { setCurrPw(e.target.value); setPwError(''); }} autoComplete="current-password" />
                        </SpField>
                        <SpField icon="fas fa-lock" trailing={eyeBtn(showNewPw, () => setShowNewPw(v => !v))}>
                            <input type={showNewPw ? 'text' : 'password'} placeholder="New password · 8+ characters" value={newPw} onChange={e => { setNewPw(e.target.value); setPwError(''); }} autoComplete="new-password" />
                        </SpField>
                        <SpField icon="fas fa-lock" trailing={eyeBtn(showConfirmPw, () => setShowConfirmPw(v => !v))}>
                            <input type={showConfirmPw ? 'text' : 'password'} placeholder="Confirm new password" value={confirmPw} onChange={e => { setConfirmPw(e.target.value); setPwError(''); }} autoComplete="new-password" />
                        </SpField>
                        <div className="sp-btn-row">
                            <button type="button" className="sp-btn sp-btn-soft" style={{flex: 1}} onClick={() => { setPwOpen(false); setCurrPw(''); setNewPw(''); setConfirmPw(''); setPwError(''); }}>Cancel</button>
                            <button type="button" className="sp-btn sp-btn-dark sp-btn-sm" style={{flex: 1.6}} onClick={handleChangePw}>Update password</button>
                        </div>
                    </div>
                )
            )}

            {!showLogoutConfirm ? (
                <button type="button" className="sp-btn" style={{background: '#fff', color: '#e11d48', marginTop: '4px'}} onClick={() => setShowLogoutConfirm(true)}>
                    <i className="fas fa-arrow-right-from-bracket"></i>Sign out
                </button>
            ) : (
                <InlineConfirm
                    text={<React.Fragment><div style={{fontWeight: 800}}>Sign out?</div>{pendingSince ? "You have changes that haven't been backed up yet — we'll try to upload them first." : 'Are you sure you want to log out?'}</React.Fragment>}
                    keepLabel="Cancel" cta="Sign out" busy={loggingOut}
                    onKeep={() => setShowLogoutConfirm(false)}
                    onConfirm={async () => { setLoggingOut(true); try { await handleLogoutConfirm(); } finally { setLoggingOut(false); } }} />
            )}
        </div>
    );
}

function MonthlyTrends({ expenses, income, categories, defaultCurrency, onMonthSelect }) {
    const [timeWindow, setTimeWindow] = useState(() => sessionStorage.getItem('trends_timeWindow') || '6m');
    const [selectedCategory, setSelectedCategory] = useState(() => sessionStorage.getItem('trends_category') || '');
    const [chartSeriesFilter, setChartSeriesFilter] = useState('both'); // 'both' | 'income' | 'expense'
    const [expanded, setExpanded] = useState({});
    // Custom time period: month+year only (no day-level picker), same shape as Summary's.
    const [customFromMonth, setCustomFromMonth] = useState(() => { const v = sessionStorage.getItem('trends_customFromMonth'); return v !== null ? parseInt(v) : new Date().getMonth(); });
    const [customFromYear, setCustomFromYear] = useState(() => { const v = sessionStorage.getItem('trends_customFromYear'); return v !== null ? parseInt(v) : new Date().getFullYear(); });
    const [customToMonth, setCustomToMonth] = useState(() => { const v = sessionStorage.getItem('trends_customToMonth'); return v !== null ? parseInt(v) : new Date().getMonth(); });
    const [customToYear, setCustomToYear] = useState(() => { const v = sessionStorage.getItem('trends_customToYear'); return v !== null ? parseInt(v) : new Date().getFullYear(); });

    const setTw = (v) => { setTimeWindow(v); sessionStorage.setItem('trends_timeWindow', v); };
    const setCat = (v) => { setSelectedCategory(v); sessionStorage.setItem('trends_category', v); };
    const setCustomFrom = (m, y) => { setCustomFromMonth(m); setCustomFromYear(y); sessionStorage.setItem('trends_customFromMonth', m); sessionStorage.setItem('trends_customFromYear', y); };
    const setCustomTo = (m, y) => { setCustomToMonth(m); setCustomToYear(y); sessionStorage.setItem('trends_customToMonth', m); sessionStorage.setItem('trends_customToYear', y); };

    const toggle = (key) => setExpanded(prev => ({ ...prev, [key]: !prev[key] }));

    const convertSync = (amount, from, to) => {
        if (!from || !to || from === to) return amount;
        return Math.round(CurrencyService.convertToDefaultSync(amount, from, to) * 100) / 100;
    };
    const fmt = (n) => ValidationUtils.formatCurrency(n, defaultCurrency);

    const getMonths = () => {
        const now = new Date();
        const months = [];
        if (timeWindow === 'year') {
            for (let m = 0; m <= now.getMonth(); m++) months.push({ year: now.getFullYear(), month: m });
        } else if (timeWindow === 'custom') {
            const fromKey = customFromYear * 12 + customFromMonth, toKey = customToYear * 12 + customToMonth;
            const [sY, sM, eY, eM] = fromKey <= toKey ? [customFromYear, customFromMonth, customToYear, customToMonth] : [customToYear, customToMonth, customFromYear, customFromMonth];
            let cursor = new Date(sY, sM, 1);
            const end = new Date(eY, eM, 1);
            let guard = 0;
            // Safety cap only — not meant to be reachable via the UI. The From/To year
            // selects offer up to 8 years back (96 months apart at most), so this used to
            // silently truncate at 60 months (a 6+ year range would cut off mid-range,
            // e.g. Aug 2020–Aug 2026 stopping at Jul 2025) well before that's possible.
            while (cursor <= end && guard < 240) { months.push({ year: cursor.getFullYear(), month: cursor.getMonth() }); cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1); guard++; }
        } else {
            const count = timeWindow === '3m' ? 3 : timeWindow === '12m' ? 12 : 6;
            for (let i = count - 1; i >= 0; i--) {
                const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                months.push({ year: d.getFullYear(), month: d.getMonth() });
            }
        }
        return months;
    };

    const months = getMonths();
    const now = new Date();
    const curYear = now.getFullYear(), curMonth = now.getMonth();
    // Person scoping now comes entirely from the global Active View — expenses/income
    // arrive already filtered by it; this screen only adds its own category filter.
    const filteredExpenses = selectedCategory ? expenses.filter(e => e.categoryId === parseInt(selectedCategory)) : expenses;
    const filteredIncome = income;

    // A custom range over 2 years (>24 monthly rows) is too dense to browse as individual
    // months — fold it down to one row per year instead (same threshold as Summary's own
    // custom-range chart). Each "period" below is either a single month (the normal case,
    // monthsIncluded.length === 1) or every month of that year that falls inside the
    // selected range (yearly grouping) — the aggregation code beneath is identical either
    // way, just summed over more months' worth of prefixes.
    const useYearlyGrouping = timeWindow === 'custom' && months.length > 24;
    const periods = useYearlyGrouping
        ? (() => {
            const yearGroups = {};
            months.forEach(({ year, month }) => { (yearGroups[year] = yearGroups[year] || []).push(month); });
            return Object.keys(yearGroups).sort((a, b) => a - b).map(y => ({ year: parseInt(y), monthsIncluded: yearGroups[y] }));
        })()
        : months.map(({ year, month }) => ({ year, monthsIncluded: [month] }));

    const monthData = periods.map(({ year, monthsIncluded }) => {
        const prefixes = monthsIncluded.map(m => `${year}-${String(m + 1).padStart(2, '0')}`);
        const me = filteredExpenses.filter(e => prefixes.some(p => (e.date || '').startsWith(p)));
        const mi = filteredIncome.filter(i => prefixes.some(p => (i.date || '').startsWith(p)));
        const totalExp = me.reduce((s, e) => s + convertSync(e.amount, e.currency || 'GBP', defaultCurrency), 0);
        const totalInc = mi.reduce((s, i) => s + convertSync(i.amount, i.currency || 'GBP', defaultCurrency), 0);
        const net = totalInc - totalExp;
        const savingsRate = totalInc > 0 ? ((totalInc - totalExp) / totalInc) * 100 : null;
        const minMonth = Math.min(...monthsIncluded), maxMonth = Math.max(...monthsIncluded);
        const isCurrent = useYearlyGrouping ? year === curYear : (year === curYear && minMonth === curMonth);
        const lastDay = new Date(year, maxMonth + 1, 0).getDate();
        const from = `${year}-${String(minMonth + 1).padStart(2, '0')}-01`;
        const to = `${year}-${String(maxMonth + 1).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;
        const prefix = useYearlyGrouping ? String(year) : prefixes[0];
        const label = useYearlyGrouping ? String(year) : new Date(year, minMonth, 1).toLocaleDateString('en-GB', { month: 'short', year: 'numeric' });
        const shortLabel = useYearlyGrouping ? String(year) : new Date(year, minMonth, 1).toLocaleDateString('en-GB', { month: 'short' });

        const catBreakdown = {};
        categories.forEach(cat => {
            const catExps = me.filter(e => e.categoryId === cat.id);
            if (catExps.length === 0) return;
            const total = catExps.reduce((s, e) => s + convertSync(e.amount, e.currency || 'GBP', defaultCurrency), 0);
            const subBreakdown = {};
            catExps.forEach(e => { if (e.subcategory) subBreakdown[e.subcategory] = (subBreakdown[e.subcategory] || 0) + convertSync(e.amount, e.currency || 'GBP', defaultCurrency); });
            catBreakdown[cat.id] = { total, subBreakdown, catName: cat.name };
        });

        const incomeBreakdown = {};
        mi.forEach(i => { const src = i.source || 'Other'; incomeBreakdown[src] = (incomeBreakdown[src] || 0) + convertSync(i.amount, i.currency || 'GBP', defaultCurrency); });

        return { year, month: monthsIncluded.length === 1 ? monthsIncluded[0] : null, prefix, label, shortLabel, totalExp, totalInc, net, savingsRate, isCurrent, from, to, catBreakdown, incomeBreakdown };
    });

    // A category filter turns this into "how much did I spend on X, month by month"
    // rather than a multi-month income/expense/net/savings-rate comparison — a single
    // month of spend (including the still-in-progress current month) is meaningful on
    // its own, so it doesn't need the 2-complete-month bar the general trend view uses.
    const completeMonths = selectedCategory
        ? monthData.filter(m => m.totalExp > 0)
        : monthData.filter(m => !m.isCurrent && (m.totalExp > 0 || m.totalInc > 0));
    const minMonthsNeeded = selectedCategory ? 1 : 2;

    // Chart series: a category filter means "no income data makes sense here", so it
    // always forces expense-only and hides the Both/Income/Expense toggle.
    const effectiveSeriesFilter = selectedCategory ? 'expense' : chartSeriesFilter;
    const chartMonths = monthData.map(m => ({ label: m.shortLabel, income: m.totalInc, expense: m.totalExp }));
    const totalIncomeAll = monthData.reduce((s, m) => s + m.totalInc, 0);
    const totalExpAll = monthData.reduce((s, m) => s + m.totalExp, 0);
    const totalNetAll = totalIncomeAll - totalExpAll;
    const totalSavingsPctAll = totalIncomeAll > 0 ? ((totalIncomeAll - totalExpAll) / totalIncomeAll) * 100 : null;
    // Table columns collapse to Month/Expenses only under a category filter, since
    // Income/Net/Savings% all depend on income data that isn't shown in that mode.
    // Fixed px widths computed once from the actual data, shared verbatim by the header,
    // every period row, and the Total row (all reference this same gridCols string) —
    // CSS max-content sizes each row's own grid independently (rows with different-width
    // numbers, e.g. a small month next to a large yearly total, drift out of alignment
    // with each other), and 'ch' units resolve relative to each element's OWN font-size —
    // the header row here is deliberately smaller (0.7rem) than the body rows (0.8rem), so
    // the same "9.5ch" was actually a different pixel width in each, which is exactly what
    // broke alignment between the header and the data rows even though ch kept data rows
    // aligned with each other. Measuring with a canvas at the data rows' (larger, bold)
    // font gives one true pixel width that's correct in every context, header included.
    // The Year/Month label column stays a flexible minmax(40px,1fr) so it's the one that
    // yields space first if the screen is narrow — it already truncates gracefully via its
    // own ellipsis handling below.
    const measureCtx = document.createElement('canvas').getContext('2d');
    const bodyFontFamily = getComputedStyle(document.body).fontFamily;
    const textWidthPx = (str, remSize, weight) => {
        measureCtx.font = `${weight} ${remSize * 16}px ${bodyFontFamily}`;
        return measureCtx.measureText(str).width;
    };
    const colWidthPx = (strings, remSize, weight, minPx) => Math.ceil(Math.max(minPx, ...strings.map(s => textWidthPx(s, remSize, weight))) + 14);
    const expWidth = colWidthPx([...monthData.map(m => fmt(m.totalExp)), fmt(totalExpAll), 'Expenses'], 0.8, 700, 40);
    let gridCols;
    if (selectedCategory) {
        gridCols = `minmax(40px, 1fr) ${expWidth}px`;
    } else {
        const incWidth = colWidthPx([...monthData.map(m => fmt(m.totalInc)), fmt(totalIncomeAll), 'Income'], 0.8, 700, 40);
        const netWidth = colWidthPx([...monthData.map(m => fmt(m.net)), fmt(totalNetAll), 'Net'], 0.8, 700, 30);
        const savStrings = [...monthData.map(m => m.savingsRate !== null ? m.savingsRate.toFixed(0) + '%' : 'N/A'), totalSavingsPctAll !== null ? totalSavingsPctAll.toFixed(0) + '%' : 'N/A', 'Savings%'];
        const savWidth = colWidthPx(savStrings, 0.78, 700, 40);
        gridCols = `minmax(40px, 1fr) ${incWidth}px ${expWidth}px ${netWidth}px ${savWidth}px`;
    }

    return (
        <div className="screen">
            <div className="screen-header">
                <h2><i className="fas fa-chart-line me-2"></i>Monthly Trends</h2>
                <div className="summary-filters">
                    <div className="filter-group">
                        <label className="filter-label">Time Period:</label>
                        <select className="form-select form-select-sm" value={timeWindow} onChange={(e) => setTw(e.target.value)}>
                            <option value="3m">Last 3 Months</option>
                            <option value="6m">Last 6 Months</option>
                            <option value="12m">Last 12 Months</option>
                            <option value="year">This Year</option>
                            <option value="custom">Custom</option>
                        </select>
                    </div>
                    {timeWindow === 'custom' && (
                        <div className="filter-group" style={{display: 'flex', gap: '0.75rem', flexWrap: 'wrap'}}>
                            <div>
                                <label className="filter-label">From:</label>
                                <div style={{display: 'flex', gap: '0.25rem'}}>
                                    <select className="form-select form-select-sm" value={customFromMonth} onChange={e => setCustomFrom(parseInt(e.target.value), customFromYear)}>
                                        {MONTH_NAMES.map((m, i) => (<option key={i} value={i}>{m}</option>))}
                                    </select>
                                    <select className="form-select form-select-sm" value={customFromYear} onChange={e => setCustomFrom(customFromMonth, parseInt(e.target.value))}>
                                        {Array.from({length: 8}, (_, i) => new Date().getFullYear() - i).map(y => (<option key={y} value={y}>{y}</option>))}
                                    </select>
                                </div>
                            </div>
                            <div>
                                <label className="filter-label">To:</label>
                                <div style={{display: 'flex', gap: '0.25rem'}}>
                                    <select className="form-select form-select-sm" value={customToMonth} onChange={e => setCustomTo(parseInt(e.target.value), customToYear)}>
                                        {MONTH_NAMES.map((m, i) => (<option key={i} value={i}>{m}</option>))}
                                    </select>
                                    <select className="form-select form-select-sm" value={customToYear} onChange={e => setCustomTo(customToMonth, parseInt(e.target.value))}>
                                        {Array.from({length: 8}, (_, i) => new Date().getFullYear() - i).map(y => (<option key={y} value={y}>{y}</option>))}
                                    </select>
                                </div>
                            </div>
                        </div>
                    )}
                    <div className="filter-group">
                        <label className="filter-label">Category:</label>
                        <select className="form-select form-select-sm" value={selectedCategory} onChange={e => setCat(e.target.value)}>
                            <option value="">All Categories</option>
                            {categories.map(c => (<option key={c.id} value={c.id}>{c.name}</option>))}
                        </select>
                    </div>
                </div>
            </div>

            {completeMonths.length < minMonthsNeeded ? (
                <div style={{textAlign:'center',padding:'3rem 1rem'}}>
                    <i className="fas fa-chart-line fa-3x text-muted" style={{display:'block',marginBottom:'1rem'}}></i>
                    <h5 className="text-muted">Not enough data yet</h5>
                    <p className="text-muted small">{selectedCategory ? 'Add an expense in this category to see trends.' : `Add expenses over at least 2 ${useYearlyGrouping ? 'years' : 'months'} to see trends.`}</p>
                </div>
            ) : (
                <React.Fragment>
                    <div style={{padding:'0 1rem 1rem'}}>
                        <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '0.5rem', marginBottom: '0.5rem'}}>
                            <h5 style={{margin: 0}}><i className="fas fa-chart-bar me-2"></i>Income vs Expense</h5>
                            {!selectedCategory && (
                                <div className="btn-group btn-group-sm" role="group" aria-label="Chart series">
                                    <button type="button" className={'btn ' + (chartSeriesFilter === 'both' ? 'btn-primary' : 'btn-outline-secondary')} onClick={() => setChartSeriesFilter('both')}>Both</button>
                                    <button type="button" className={'btn ' + (chartSeriesFilter === 'income' ? 'btn-primary' : 'btn-outline-secondary')} onClick={() => setChartSeriesFilter('income')}>Income</button>
                                    <button type="button" className={'btn ' + (chartSeriesFilter === 'expense' ? 'btn-primary' : 'btn-outline-secondary')} onClick={() => setChartSeriesFilter('expense')}>Expense</button>
                                </div>
                            )}
                        </div>
                        <IncomeExpenseTrendChart months={chartMonths} defaultCurrency={defaultCurrency} seriesFilter={effectiveSeriesFilter} />
                    </div>

                    <div style={{padding:'0 1rem 1rem'}}>
                        <div style={{display:'grid',gridTemplateColumns:gridCols,gap:'4px',padding:'0 10px 0.3rem',alignItems:'center',fontSize:'0.7rem',color:'#6c757d',fontWeight:600}}>
                            <span>{useYearlyGrouping ? 'Year' : 'Month'}</span>
                            {!selectedCategory && <span style={{textAlign:'right',color:'#198754'}}>Income</span>}
                            <span style={{textAlign:'right',color:'#fd7e14'}}>Expenses</span>
                            {!selectedCategory && <span style={{textAlign:'right'}}>Net</span>}
                            {!selectedCategory && <span style={{textAlign:'right'}}>Savings%</span>}
                        </div>

                        {monthData.map(m => {
                            const expKey = `${m.prefix}:exp`;
                            const incKey = `${m.prefix}:inc`;
                            const hasCat = Object.keys(m.catBreakdown).length > 0;
                            const hasInc = !selectedCategory && Object.keys(m.incomeBreakdown).length > 0;
                            return (
                                <div key={m.prefix} style={{marginBottom:'6px',border:'1px solid',borderColor:m.isCurrent?'#adb5bd':'#dee2e6',borderStyle:m.isCurrent?'dashed':'solid',borderRadius:'8px',overflow:'hidden'}}>
                                    <div style={{display:'grid',gridTemplateColumns:gridCols,gap:'4px',alignItems:'center',padding:'8px 10px',background:m.isCurrent?'#f8f9fa':'#fff'}}>
                                        <div style={{minWidth:0}}>
                                            <div style={{fontWeight:600,fontSize:'0.75rem',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{m.label}</div>
                                            {m.isCurrent && <span className="badge bg-secondary" style={{fontSize:'0.55rem',marginTop:'2px',display:'inline-block'}}>current</span>}
                                        </div>
                                        {!selectedCategory && <div style={{fontSize:'0.8rem',color:'#198754',textAlign:'right',whiteSpace:'nowrap'}}>{m.totalInc > 0 ? fmt(m.totalInc) : <span style={{color:'#adb5bd'}}>—</span>}</div>}
                                        <div style={{fontSize:'0.8rem',color:'#fd7e14',textAlign:'right',whiteSpace:'nowrap',cursor:m.totalExp>0?'pointer':'default',textDecoration:m.totalExp>0?'underline':'none',textDecorationColor:'#fd7e14',textUnderlineOffset:'2px'}}
                                            onClick={() => m.totalExp > 0 && onMonthSelect(m.from, m.to)}
                                            title={m.totalExp > 0 ? `View ${m.label} expenses` : undefined}>
                                            {m.totalExp > 0 ? fmt(m.totalExp) : <span style={{color:'#adb5bd'}}>—</span>}
                                        </div>
                                        {!selectedCategory && (
                                            <div style={{fontSize:'0.8rem',fontWeight:600,textAlign:'right',whiteSpace:'nowrap',color:(m.totalInc>0||m.totalExp>0)?(m.net>=0?'#198754':'#dc3545'):'#adb5bd'}}>
                                                {(m.totalInc > 0 || m.totalExp > 0) ? fmt(m.net) : '—'}
                                            </div>
                                        )}
                                        {!selectedCategory && (
                                            <div style={{fontSize:'0.78rem',color:'#6c757d',textAlign:'right',whiteSpace:'nowrap'}}>
                                                {m.savingsRate !== null ? m.savingsRate.toFixed(0)+'%' : 'N/A'}
                                            </div>
                                        )}
                                    </div>
                                    {(hasCat || hasInc) && (
                                        <div style={{display:'flex',gap:'4px',padding:'3px 10px 5px',borderTop:'1px solid #f0f0f0',background:'#fafafa'}}>
                                            {hasCat && (
                                                <button type="button" className={'btn btn-sm ' + (expanded[expKey] ? 'btn-warning' : 'btn-outline-secondary')}
                                                    style={{fontSize:'0.7rem',padding:'1px 8px'}}
                                                    onClick={e => { e.stopPropagation(); toggle(expKey); }}>
                                                    <i className={'fas fa-' + (expanded[expKey] ? 'minus' : 'plus') + ' me-1'}></i>Expenses
                                                </button>
                                            )}
                                            {hasInc && (
                                                <button type="button" className={'btn btn-sm ' + (expanded[incKey] ? 'btn-success' : 'btn-outline-secondary')}
                                                    style={{fontSize:'0.7rem',padding:'1px 8px'}}
                                                    onClick={e => { e.stopPropagation(); toggle(incKey); }}>
                                                    <i className={'fas fa-' + (expanded[incKey] ? 'minus' : 'plus') + ' me-1'}></i>Income
                                                </button>
                                            )}
                                        </div>
                                    )}
                                    {expanded[expKey] && hasCat && (
                                        <div style={{borderTop:'1px solid #f0f0f0'}}>
                                            {Object.entries(m.catBreakdown).sort((a,b) => b[1].total - a[1].total).map(([catId, data]) => {
                                                const catKey = `${m.prefix}:cat:${catId}`;
                                                const hasSubs = Object.keys(data.subBreakdown).length > 0;
                                                return (
                                                    <div key={catId}>
                                                        <div style={{display:'flex',alignItems:'center',padding:'5px 10px 5px 18px',gap:'6px',background:'#fff9f0'}}>
                                                            {hasSubs
                                                                ? <button type="button" className="btn btn-sm btn-outline-secondary" style={{fontSize:'0.65rem',padding:'0 5px',lineHeight:'1.4',minWidth:'20px'}} onClick={e => { e.stopPropagation(); toggle(catKey); }}>
                                                                    <i className={'fas fa-' + (expanded[catKey] ? 'minus' : 'plus')}></i>
                                                                  </button>
                                                                : <span style={{width:'22px',display:'inline-block'}}></span>
                                                            }
                                                            <span style={{flex:1,fontSize:'0.8rem',fontWeight:500}}>{data.catName}</span>
                                                            <span style={{fontSize:'0.8rem',color:'#fd7e14',fontWeight:600}}>{fmt(data.total)}</span>
                                                        </div>
                                                        {expanded[catKey] && hasSubs && Object.entries(data.subBreakdown).sort((a,b) => b[1]-a[1]).map(([sub, amt]) => (
                                                            <div key={sub} style={{display:'flex',padding:'3px 10px 3px 46px',fontSize:'0.77rem',color:'#6c757d',background:'#fffdf8'}}>
                                                                <span style={{flex:1}}>{sub}</span>
                                                                <span>{fmt(amt)}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                    {expanded[incKey] && hasInc && (
                                        <div style={{borderTop:'1px solid #f0f0f0'}}>
                                            {Object.entries(m.incomeBreakdown).sort((a,b) => b[1]-a[1]).map(([src, amt]) => (
                                                <div key={src} style={{display:'flex',padding:'5px 10px 5px 18px',fontSize:'0.8rem',background:'#f0fff4'}}>
                                                    <span style={{flex:1,color:'#495057'}}><i className="fas fa-arrow-circle-down me-1 text-success"></i>{src}</span>
                                                    <span style={{color:'#198754',fontWeight:600}}>{fmt(amt)}</span>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            );
                        })}

                        <div style={{display:'grid',gridTemplateColumns:gridCols,gap:'4px',alignItems:'center',padding:'8px 10px',marginTop:'2px',borderTop:'2px solid #adb5bd'}}>
                            <div style={{fontWeight:700,fontSize:'0.85rem',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>Total</div>
                            {!selectedCategory && <div style={{fontSize:'0.8rem',fontWeight:700,color:'#198754',textAlign:'right',whiteSpace:'nowrap'}}>{fmt(totalIncomeAll)}</div>}
                            <div style={{fontSize:'0.8rem',fontWeight:700,color:'#fd7e14',textAlign:'right',whiteSpace:'nowrap'}}>{fmt(totalExpAll)}</div>
                            {!selectedCategory && <div style={{fontSize:'0.8rem',fontWeight:700,textAlign:'right',whiteSpace:'nowrap',color:totalNetAll>=0?'#198754':'#dc3545'}}>{fmt(totalNetAll)}</div>}
                            {!selectedCategory && <div style={{fontSize:'0.78rem',fontWeight:700,color:'#6c757d',textAlign:'right',whiteSpace:'nowrap'}}>{totalSavingsPctAll !== null ? totalSavingsPctAll.toFixed(0)+'%' : 'N/A'}</div>}
                        </div>
                    </div>
                </React.Fragment>
            )}
        </div>
    );
}

// ── Net Worth (Phase 8) ──────────────────────────────────────────────────────
const SP_COUNTRY_CODE = {
    'United Kingdom': 'GB', 'United States': 'US', 'India': 'IN', 'Ireland': 'IE', 'Germany': 'DE', 'France': 'FR', 'Spain': 'ES', 'Italy': 'IT',
    'Netherlands': 'NL', 'Belgium': 'BE', 'Portugal': 'PT', 'Switzerland': 'CH', 'Austria': 'AT', 'Sweden': 'SE', 'Norway': 'NO', 'Denmark': 'DK',
    'Finland': 'FI', 'Poland': 'PL', 'Greece': 'GR', 'Luxembourg': 'LU', 'Canada': 'CA', 'Mexico': 'MX', 'Brazil': 'BR', 'Argentina': 'AR',
    'Australia': 'AU', 'New Zealand': 'NZ', 'Japan': 'JP', 'China': 'CN', 'South Korea': 'KR', 'Singapore': 'SG', 'Hong Kong': 'HK',
    'United Arab Emirates': 'AE', 'Saudi Arabia': 'SA', 'Qatar': 'QA', 'South Africa': 'ZA', 'Nigeria': 'NG', 'Kenya': 'KE', 'Egypt': 'EG',
    'Turkey': 'TR', 'Russia': 'RU', 'Pakistan': 'PK', 'Bangladesh': 'BD', 'Sri Lanka': 'LK', 'Philippines': 'PH', 'Indonesia': 'ID',
    'Malaysia': 'MY', 'Thailand': 'TH', 'Vietnam': 'VN', 'Israel': 'IL', 'Czech Republic': 'CZ', 'Romania': 'RO', 'Hungary': 'HU'
};
const spCountryCode = (c) => !c ? '—' : SP_COUNTRY_CODE[c] || c.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
const SP_NW_FREQS = ['daily', 'weekly', 'monthly', 'quarterly', 'yearly'];
const spNwFund = (a) => !DataService.LIABILITY_ACCOUNT_TYPES.includes(a.accountType); // accounts money can come out of
const spFmtMoney = (amount, currency, dp = 2) => {
    const num = Number(amount) || 0;
    return (num < 0 ? '−' : '') + CurrencyService.getCurrencySymbol(currency) + Math.abs(num).toLocaleString(currency === 'INR' ? 'en-IN' : 'en-GB', { minimumFractionDigits: dp, maximumFractionDigits: dp });
};

function SpCountrySelect({ value, currency, onChange }) {
    const matching = COUNTRIES.filter(c => COUNTRY_CURRENCY_MAP[c] === currency);
    const rest = COUNTRIES.filter(c => COUNTRY_CURRENCY_MAP[c] !== currency);
    return (
        <select value={value} onChange={e => onChange(e.target.value)}>
            <option value="">Not specified</option>
            {matching.length > 0 ? (
                <React.Fragment>
                    <optgroup label={'Countries using ' + currency}>{matching.map(c => <option key={c} value={c}>{c}</option>)}</optgroup>
                    <optgroup label="Other countries">{rest.map(c => <option key={c} value={c}>{c}</option>)}</optgroup>
                </React.Fragment>
            ) : COUNTRIES.map(c => <option key={c} value={c}>{c}</option>)}
        </select>
    );
}

// Where money for an asset comes from: nothing (external funds), a same-currency account that
// isn't a Credit Card/Loan, or the owner's cash in hand (DataService.deductCashForAsset).
const spNwPayOptions = (bankAccounts, currency, person) => [
    { value: '', label: 'None · external funds' },
    ...bankAccounts.filter(a => a.currency === currency && spNwFund(a)).map(a => ({ value: String(a.id), label: a.accountName + (a.isPrimary && (a.person || 'own') === (person || 'own') ? ' (primary)' : '') + ' · ' + a.currency })),
    { value: 'cash-' + (person || 'own') + '|' + currency, label: 'Cash in hand · ' + currency }
];
// -> { accountId: stored value ('' | account id | cash ref), label: how it reads in sentences }
const spNwPayResolve = (value, bankAccounts) => {
    if (!value) return { accountId: '', label: '' };
    if (DataService.isCashFundingRef(value)) return { accountId: value, label: 'cash in hand' };
    const a = bankAccounts.find(x => String(x.id) === String(value));
    return a ? { accountId: a.id, label: a.accountName } : { accountId: '', label: '' };
};

function SpRepeatPanel({ repeat, setRepeat, currency, payOptions, tint = '#ede9fe', ink = '#7c3aed', bankAccounts = [] }) {
    const first = computeNextDue(repeat.start || DateUtils.today(), repeat.freq);
    const pay = spNwPayResolve(repeat.pay, bankAccounts);
    return (
        <div className="sp-panel" style={{marginTop: '10px'}}>
            <div className="sp-formrow" style={{paddingTop: 0}}>
                <span>Amount each time</span>
                <span className="sp-moneyin"><span>{CurrencyService.getCurrencySymbol(currency)}</span><input type="number" step="0.01" min="0.01" inputMode="decimal" placeholder="0.00" value={repeat.amount} onChange={e => setRepeat(r => ({ ...r, amount: e.target.value }))} /></span>
            </div>
            {payOptions && (
                <div className="sp-formblock" style={{borderTop: '1px solid #f1f5f9'}}>
                    <div className="sp-formblock-label">Pay each time from</div>
                    <select className="sp-fullselect" value={repeat.pay || ''} onChange={e => setRepeat(r => ({ ...r, pay: e.target.value, payTouched: true }))}>
                        {payOptions.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                    </select>
                </div>
            )}
            <div className="sp-panel-label" style={{margin: '8px 0'}}>Repeat every</div>
            <div className="sp-seg is-light">
                {SP_NW_FREQS.map(f => <button key={f} type="button" className={repeat.freq === f ? 'is-active' : ''} onClick={() => setRepeat(r => ({ ...r, freq: f }))}>{f === 'quarterly' ? 'Quarter' : f.charAt(0).toUpperCase() + f.slice(1)}</button>)}
            </div>
            <div className="sp-formrow" style={{borderTop: '1px solid #f1f5f9', marginTop: '8px'}}><span>Starts</span><input type="date" value={repeat.start} onChange={e => setRepeat(r => ({ ...r, start: e.target.value }))} /></div>
            <div className="sp-formrow" style={{borderTop: '1px solid #f1f5f9'}}>
                <span>Ends (optional)</span>
                <span style={{display: 'inline-flex', alignItems: 'center', gap: '6px'}}>
                    <input type="date" value={repeat.end} min={first} onChange={e => setRepeat(r => ({ ...r, end: e.target.value }))} />
                    {repeat.end && <button type="button" className="sp-row-btn" onClick={() => setRepeat(r => ({ ...r, end: '' }))} title="Clear end date"><i className="fas fa-xmark"></i></button>}
                </span>
            </div>
            <div className="sp-infobox" style={{background: tint}}>
                <div className="sp-infobox-foot" style={{color: ink, paddingLeft: 0, marginTop: 0}}>
                    {spFmtMoney(parseFloat(repeat.amount) || 0, currency)} every {repeat.freq === 'daily' ? 'day' : repeat.freq === 'weekly' ? 'week' : repeat.freq === 'quarterly' ? 'quarter' : repeat.freq === 'yearly' ? 'year' : 'month'}, first on {spLongDate(first)}{repeat.end ? ', until ' + spLongDate(repeat.end) : ''}{payOptions ? (pay.label ? ', taken from ' + pay.label : ', from external funds (nothing deducted)') : ''}.
                </div>
            </div>
        </div>
    );
}

function NetWorthItemSheet({ type, item, assetCategories, liabilityCategories, bankAccounts, defaultCurrency, activeView, onClose, onSaved }) {
    const isAsset = type === 'asset';
    const cats = (isAsset ? assetCategories : liabilityCategories) || [];
    const people = DataService.getPeople();
    const locked = !!(item && item.history && item.history.length > 0);
    const [f, setF] = useState(() => item
        ? { name: item.name, value: String(item.value), currency: item.currency, categoryId: item.categoryId, subcategory: item.subcategory || '', notes: item.notes || '', person: item.person || 'own', country: item.country || '', openDate: item.openDate || '', fundAccountId: '' }
        : { name: '', value: '', currency: defaultCurrency || 'GBP', categoryId: '', subcategory: '', notes: '', person: resolveActiveViewValue(activeView) || 'own', country: defaultCountryForCurrency(defaultCurrency || 'GBP'), openDate: DateUtils.today(), fundAccountId: '' });
    const [repeatOn, setRepeatOn] = useState(false);
    const [repeat, setRepeat] = useState({ amount: '', freq: 'monthly', start: DateUtils.today(), end: '', pay: '', payTouched: false });
    const [errors, setErrors] = useState({});
    const [showCurrency, setShowCurrency] = useState(false);
    const set = (k, v) => { setF(p => ({ ...p, [k]: v })); if (errors[k]) setErrors(p => { const n = { ...p }; delete n[k]; return n; }); };
    const setCurrency = (cur) => { setF(p => {
        const matches = COUNTRIES.filter(c => COUNTRY_CURRENCY_MAP[c] === cur);
        let country = p.country;
        if (matches.length === 1) country = matches[0];
        else if (COUNTRY_CURRENCY_MAP[p.country] !== cur) country = '';
        return { ...p, currency: cur, country, fundAccountId: '' };
    }); setRepeat(r => ({ ...r, pay: '', payTouched: false })); };
    const cat = cats.find(c => String(c.id) === String(f.categoryId));
    const payOptions = spNwPayOptions(bankAccounts, f.currency, f.person);
    const fund = spNwPayResolve(f.fundAccountId, bankAccounts);
    // The repeat pays from the same place as the opening balance until the user picks otherwise.
    const setFund = (v) => { set('fundAccountId', v); setRepeat(r => r.payTouched ? r : ({ ...r, pay: v })); };
    useEffect(() => { if (!payOptions.some(o => o.value === f.fundAccountId)) set('fundAccountId', ''); }, [f.person, f.currency]);

    const save = () => {
        const e = {};
        if (!f.name.trim()) e.name = 'Name is required';
        if (!f.categoryId) e.categoryId = 'Pick a category';
        if (!f.value || parseFloat(f.value) <= 0) e.value = 'Value must be greater than 0';
        if (!item && repeatOn && (!repeat.amount || parseFloat(repeat.amount) <= 0)) e.repeat = 'Enter the amount to repeat';
        if (Object.keys(e).length > 0) { setErrors(e); return; }
        if (item) {
            // Corrections (not a valuation) — not logged as a net-worth movement, as before.
            const updates = { name: f.name.trim(), categoryId: parseInt(f.categoryId), subcategory: f.subcategory || '', notes: f.notes, person: f.person || 'own', country: f.country || '', openDate: f.openDate || '' };
            if (!locked) { updates.value = parseFloat(f.value); updates.currency = f.currency; }
            DataService.updateNetWorthItem(item.id, updates, { skipHistory: true });
            onSaved(f.name.trim() + ' updated');
            return;
        }
        const newItem = DataService.addNetWorthItem({ name: f.name.trim(), value: f.value, currency: f.currency, type, categoryId: parseInt(f.categoryId), subcategory: f.subcategory || '', notes: f.notes, person: f.person || 'own', country: f.country || '', openDate: f.openDate || '' }, activeView);
        if (isAsset && fund.accountId) {
            const amount = parseFloat(f.value);
            if (DataService.isCashFundingRef(fund.accountId)) {
                DataService.deductCashForAsset(fund.accountId, amount, DateUtils.today(), newItem.name);
            } else {
                // Funded via the Transfer ledger (not an Expense) — logged under Asset Funding.
                DataService.addTransfer({
                    date: DateUtils.today(), fromAccountId: fund.accountId, toAccountId: null,
                    fromAmount: amount, toAmount: amount, isOverseas: false, conversionRate: 1, fee: 0,
                    feeExpenseId: null, principalExpenseId: null, recipientIncomeId: null,
                    toAssetId: newItem.id, toAssetName: newItem.name, notes: 'Investment funding — logged for audit'
                });
            }
        }
        if (repeatOn) {
            const pay = isAsset ? spNwPayResolve(repeat.pay, bankAccounts) : { accountId: '' };
            DataService.addRecurring({
                templateExpense: { netWorthItemId: newItem.id, netWorthItemName: newItem.name, amount: parseFloat(repeat.amount), currency: f.currency, accountId: pay.accountId, person: f.person || 'own' },
                frequency: repeat.freq, endDate: repeat.end, type, startDate: repeat.start
            });
        }
        onSaved(newItem.name + ' added');
    };
    const err = errors.name || errors.categoryId || errors.value || errors.repeat;
    const noun = isAsset ? 'asset' : 'liability';
    const amountFmt = spFmtMoney(parseFloat(f.value) || 0, f.currency);

    return (
        <Sheet onClose={onClose} footer={<React.Fragment>
            <button type="button" className="sp-btn sp-btn-cancel" onClick={onClose}>Cancel</button>
            <button type="button" className="sp-btn sp-btn-primary sp-btn-grow" onClick={save}><i className="fas fa-check"></i>{item ? 'Save changes' : 'Save ' + noun}</button>
        </React.Fragment>}>
            <SpSheetHead icon={isAsset ? 'fas fa-arrow-trend-up' : 'fas fa-arrow-trend-down'} tint={isAsset ? '#dcfce7' : '#fee2e2'} ink={isAsset ? '#16a34a' : '#e11d48'} title={(item ? 'Edit ' : 'Add ') + noun} sub={isAsset ? 'Something you own' : 'Something you owe'} />
            {err && <div className="sp-alert sp-alert-err"><i className="fas fa-circle-exclamation"></i><span>{err}</span></div>}
            <div className="sp-formcard" style={{marginTop: 0}}>
                <div className={'sp-formrow' + (errors.name ? ' is-bad' : '')}><span>{isAsset ? 'Asset name' : 'Name'}</span><input type="text" value={f.name} placeholder={isAsset ? 'e.g. Vanguard ISA' : 'e.g. Car loan'} onChange={e => set('name', e.target.value)} /></div>
                <div className={'sp-formrow' + (errors.categoryId ? ' is-bad' : '')}>
                    <span>Category</span>
                    <select value={f.categoryId} onChange={e => setF(p => ({ ...p, categoryId: e.target.value, subcategory: '' }))}>
                        <option value="">Select</option>
                        {cats.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                    </select>
                </div>
                <div className="sp-formrow">
                    <span>Sub category</span>
                    <select value={f.subcategory} disabled={!cat || !cat.subcategories.length} onChange={e => set('subcategory', e.target.value)}>
                        <option value="">{!cat ? 'Pick a category first' : cat.subcategories.length ? 'None' : 'No sub categories'}</option>
                        {cat && cat.subcategories.map(s => <option key={s} value={s}>{s}</option>)}
                    </select>
                </div>
                <div className="sp-formrow">
                    <span>Owner</span>
                    {activeView.length > 1
                        ? <PersonSelect value={f.person === 'own' ? '' : f.person} onChange={v => set('person', v || 'own')} activeView={activeView} className="" ownLabel="You" />
                        : <span className="sp-lockedval">{spOwnerChip(f.person, people)}<i className="fas fa-lock"></i></span>}
                </div>
                <div className="sp-formrow"><span>Date of opening</span><input type="date" value={f.openDate} max={DateUtils.today()} onChange={e => set('openDate', e.target.value)} /></div>
                <div className="sp-formrow"><span>Country</span><SpCountrySelect value={f.country} currency={f.currency} onChange={v => set('country', v)} /></div>
                <div className="sp-formrow">
                    <span>Currency</span>
                    {locked
                        ? <span className="sp-lockedval"><b>{f.currency}</b><i className="fas fa-lock"></i></span>
                        : <button type="button" className="sp-rowpick" onClick={() => setShowCurrency(true)}>{f.currency}<i className="fas fa-chevron-down"></i></button>}
                </div>
            </div>
            <div className="sp-formlabel">{item ? 'Opening balance' : isAsset ? 'Opening balance' : 'Amount owed'}</div>
            <div className="sp-formcard" style={{marginTop: '8px'}}>
                <div className={'sp-formrow' + (errors.value ? ' is-bad' : '')}>
                    <span>{item ? 'Amount' : isAsset ? 'Value today' : 'Owed today'}</span>
                    {locked
                        ? <span className="sp-lockedval"><b>{spFmtMoney(item.value, item.currency)}</b><i className="fas fa-lock"></i></span>
                        : <span className="sp-moneyin"><span>{CurrencyService.getCurrencySymbol(f.currency)}</span><input type="number" step="0.01" min="0.01" inputMode="decimal" placeholder="0.00" value={f.value} onChange={e => set('value', e.target.value)} /></span>}
                </div>
                {locked && <div className="sp-hint" style={{fontSize: '11px', padding: '0 0 10px'}}><i className="fas fa-lock" style={{marginRight: '5px'}}></i>Locked because this {noun} has {isAsset ? 'top-ups or valuations' : 'balance updates'}. Use {isAsset ? 'Top up or Update value' : 'Update balance'} instead.</div>}
                {!item && isAsset && (
                    <div className="sp-formblock">
                        <div className="sp-formblock-label">Deducted from <span style={{color: 'var(--sp-slate-400)', fontSize: '12px'}}>(optional)</span></div>
                        <select className="sp-fullselect" value={f.fundAccountId} onChange={e => setFund(e.target.value)}>
                            {payOptions.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                        </select>
                        <div className="sp-hint" style={{fontSize: '11px', marginTop: '6px'}}>{!fund.accountId ? 'Nothing is deducted.' : DataService.isCashFundingRef(fund.accountId) ? 'Takes ' + amountFmt + ' from your cash in hand (saved as a cash correction, not an expense).' : 'Takes ' + amountFmt + ' from ' + fund.label + ' and logs it in Asset Funding (not an expense).'}</div>
                    </div>
                )}
            </div>
            {!item && (
                <React.Fragment>
                    <div className="sp-toggleline">
                        <div><div className="sp-row-title">{isAsset ? 'Recurring investment' : 'Repeat this amount'}</div><div className="sp-row-sub">{isAsset ? 'Optional · regular top-ups to this asset' : 'Optional · adds to the balance on a schedule'}</div></div>
                        <SpSwitch on={repeatOn} onToggle={() => { setRepeatOn(v => !v); setRepeat(r => ({ ...r, amount: r.amount || f.value, pay: r.payTouched ? r.pay : f.fundAccountId })); }} label="Repeat" />
                    </div>
                    {repeatOn && <SpRepeatPanel repeat={repeat} setRepeat={setRepeat} currency={f.currency} payOptions={isAsset ? payOptions : null} bankAccounts={bankAccounts} />}
                </React.Fragment>
            )}
            <div className="sp-formcard">
                <div className="sp-formblock">
                    <div className="sp-formblock-label">Note <span style={{color: 'var(--sp-slate-400)', fontSize: '12px'}}>(optional)</span></div>
                    <textarea className="sp-textarea" rows={2} style={{marginTop: '8px'}} value={f.notes} placeholder="e.g. Account number, platform, who manages it" onChange={e => set('notes', e.target.value)} />
                </div>
            </div>
            {showCurrency && <CurrencySheet value={f.currency} onPick={c => { setCurrency(c); setShowCurrency(false); }} onClose={() => setShowCurrency(false)} />}
        </Sheet>
    );
}

function NetWorthTopUpSheet({ item, bankAccounts, schedule, activeView, onClose, onSaved }) {
    const today = DateUtils.today();
    const payOptions = spNwPayOptions(bankAccounts, item.currency, item.person);
    const primary = bankAccounts.find(a => a.currency === item.currency && spNwFund(a) && a.isPrimary && (a.person || 'own') === (item.person || 'own'));
    const [amount, setAmount] = useState('');
    const [date, setDate] = useState(today);
    const [source, setSource] = useState(primary ? String(primary.id) : '');
    const [repeatOn, setRepeatOn] = useState(false);
    const [repeat, setRepeat] = useState({ amount: '', freq: 'monthly', start: today, end: '', pay: primary ? String(primary.id) : '', payTouched: false });
    const [error, setError] = useState('');
    const pay = spNwPayResolve(source, bankAccounts);
    const invested = item.originalAmount != null ? item.originalAmount : item.value;
    const amt = parseFloat(amount) || 0;
    const setSourceAndRepeat = (v) => { setSource(v); setRepeat(r => r.payTouched ? r : ({ ...r, pay: v })); };
    const save = () => {
        if (!amount || amt <= 0) { setError('Amount must be greater than 0'); return; }
        if (!date || date > today) { setError('Pick a date up to today'); return; }
        if (repeatOn && (!repeat.amount || parseFloat(repeat.amount) <= 0)) { setError('Enter the amount to repeat'); return; }
        DataService._applyNetWorthIncrement({ netWorthItemId: item.id, amount: amt, accountId: pay.accountId }, date, { activeView, notes: 'Investment funding — logged for audit' });
        if (repeatOn) {
            DataService.addRecurring({
                templateExpense: { netWorthItemId: item.id, netWorthItemName: item.name, amount: parseFloat(repeat.amount), currency: item.currency, accountId: spNwPayResolve(repeat.pay, bankAccounts).accountId, person: item.person || 'own' },
                frequency: repeat.freq, endDate: repeat.end, type: item.type, startDate: repeat.start
            });
        }
        onSaved(spFmtMoney(amt, item.currency) + ' added to ' + item.name);
    };
    return (
        <Sheet onClose={onClose} footer={<React.Fragment>
            <button type="button" className="sp-btn sp-btn-cancel" onClick={onClose}>Cancel</button>
            <button type="button" className="sp-btn sp-btn-primary sp-btn-grow" onClick={save}><i className="fas fa-plus"></i>Top up</button>
        </React.Fragment>}>
            <SpSheetHead icon="fas fa-plus" tint="#dcfce7" ink="#16a34a" title="Add more money" sub={item.name + ' · ' + item.currency} />
            {error && <div className="sp-alert sp-alert-err"><i className="fas fa-circle-exclamation"></i><span>{error}</span></div>}
            <div className="sp-formcard" style={{marginTop: 0}}>
                <div className="sp-formrow"><span>Amount</span><span className="sp-moneyin"><span>{CurrencyService.getCurrencySymbol(item.currency)}</span><input type="number" step="0.01" min="0.01" inputMode="decimal" placeholder="0.00" value={amount} autoFocus onChange={e => { setAmount(e.target.value); setError(''); }} /></span></div>
                <div className="sp-formrow"><span>Date</span><input type="date" value={date} max={today} onChange={e => setDate(e.target.value)} /></div>
                <div className="sp-formblock">
                    <div className="sp-formblock-label">Deduct from <span style={{color: 'var(--sp-slate-400)', fontSize: '12px'}}>(optional)</span></div>
                    <select className="sp-fullselect" value={source} onChange={e => setSourceAndRepeat(e.target.value)}>
                        {payOptions.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                    </select>
                </div>
            </div>
            <div className="sp-hint" style={{fontSize: '12px', margin: '10px 4px 0'}}>Invested becomes <b style={{color: 'var(--sp-navy)'}}>{spFmtMoney(invested + amt, item.currency)}</b> · value <b style={{color: 'var(--sp-navy)'}}>{spFmtMoney(item.value + amt, item.currency)}</b>{pay.label ? ' · ' + (DataService.isCashFundingRef(pay.accountId) ? 'your cash in hand' : pay.label) + ' goes down by the same amount' : ' · nothing is deducted'}</div>
            {schedule ? (
                <div className="sp-alert sp-alert-info" style={{marginTop: '12px', fontWeight: 600}}><i className="fas fa-rotate"></i><span>Already repeating {spFmtMoney(schedule.templateExpense.amount, item.currency)} {schedule.frequency} · next {spLongDate(schedule.nextDue)}. Change it in Scheduled → Recurring.</span></div>
            ) : (
                <React.Fragment>
                    <div className="sp-toggleline">
                        <div><div className="sp-row-title">Make this recurring?</div><div className="sp-row-sub">Regular top-ups to this asset</div></div>
                        <SpSwitch on={repeatOn} onToggle={() => { setRepeatOn(v => !v); setRepeat(r => ({ ...r, amount: r.amount || amount })); }} label="Repeat" />
                    </div>
                    {repeatOn && <SpRepeatPanel repeat={repeat} setRepeat={setRepeat} currency={item.currency} payOptions={payOptions} bankAccounts={bankAccounts} />}
                </React.Fragment>
            )}
        </Sheet>
    );
}

function NetWorthValueSheet({ item, activeView, onClose, onSaved }) {
    const today = DateUtils.today();
    const isAsset = item.type === 'asset';
    const [value, setValue] = useState(String(item.value));
    const [date, setDate] = useState(today);
    const [error, setError] = useState('');
    const base = item.originalAmount != null ? item.originalAmount : item.value;
    const v = parseFloat(value);
    const valid = !isNaN(v) && (isAsset ? v > 0 : v >= 0);
    const recent = (item.history || []).filter(h => h.type === (isAsset ? 'value' : 'balance')).slice(-3).reverse();
    const pctOf = (a, b) => b ? Math.round(((a - b) / b) * 1000) / 10 : 0;
    const tone = (good) => good ? { bg: '#dcfce7', ink: '#15803d' } : { bg: '#ffe4e6', ink: '#be123c' };
    const save = () => {
        if (!valid) { setError(isAsset ? 'Value must be greater than 0' : 'Enter the outstanding balance (0 or more)'); return; }
