        if (reconcileForm.actualBalance === '' || isNaN(actualBalance)) errors.actualBalance = 'Enter the actual balance';
        if (Object.keys(errors).length > 0) { setReconcileErrors(errors); return; }

        setReconcileSubmitting(true);
        try {
            const balanceBefore = DataService.computeBankAccountBalance(reconcileAccount);
            const delta = Math.round((actualBalance - balanceBefore) * 100) / 100;
            if (delta === 0) {
                setReconcileErrors({ general: 'Already matches — no adjustment needed.' });
                return;
            }
            const isLiability = DataService.LIABILITY_ACCOUNT_TYPES.includes(reconcileAccount.accountType);
            const asExpense = isLiability ? delta > 0 : delta < 0;
            const today = new Date().toISOString().split('T')[0];
            const description = `Balance reconciliation: ${reconcileAccount.accountName}` + (reconcileForm.notes ? ` — ${reconcileForm.notes}` : '');

            if (reconcileForm.logAsTransaction && asExpense) {
                const catErrors = {};
                if (!reconcileForm.categoryId) catErrors.categoryId = 'Category is required';
                if (reconcileCategory && reconcileCategory.subcategories.length > 0 && !reconcileForm.subcategory) catErrors.subcategory = 'Subcategory is required';
                if (Object.keys(catErrors).length > 0) { setReconcileErrors(catErrors); return; }
            }

            let transactionId = null;
            let transactionType = null;
            if (reconcileForm.logAsTransaction) {
                if (asExpense) {
                    const created = await DataService.addExpense({
                        amount: Math.abs(delta),
                        currency: reconcileAccount.currency,
                        date: today,
                        description,
                        categoryId: parseInt(reconcileForm.categoryId),
                        subcategory: reconcileForm.subcategory || '',
                        paidBy: reconcileAccount.person === 'own' ? '' : reconcileAccount.person,
                        accountId: reconcileAccount.id,
                        tags: ['balance-adjustment']
                    });
                    transactionId = created.id;
                    transactionType = 'expense';
                } else {
                    const created = await DataService.addIncome({
                        amount: Math.abs(delta),
                        currency: reconcileAccount.currency,
                        date: today,
                        source: description,
                        description,
                        paidBy: reconcileAccount.person === 'own' ? '' : reconcileAccount.person,
                        accountId: reconcileAccount.id,
                        tags: ['balance-adjustment']
                    });
                    transactionId = created.id;
                    transactionType = 'income';
                }
            }

            DataService.addReconciliation({
                accountId: reconcileAccount.id,
                person: reconcileAccount.person,
                date: today,
                balanceBefore,
                delta,
                balanceAfter: actualBalance,
                notes: reconcileForm.notes || '',
                loggedAsTransaction: !!reconcileForm.logAsTransaction,
                transactionType,
                transactionId
            });

            setShowReconcileForm(false);
            setReconcileForm(emptyReconcileForm);
            setReconcileErrors({});
            if (onUpdate) onUpdate();
        } finally {
            setReconcileSubmitting(false);
        }
    };

    const handleSubmitTransfer = async (e) => {
        e.preventDefault();
        const errors = {};
        const amount = parseFloat(transferForm.amount);
        if (!transferForm.fromAccountId) errors.fromAccountId = 'Choose a source account';
        if (!transferForm.toAccountId) errors.toAccountId = 'Choose a target account';
        if (transferForm.fromAccountId && transferForm.fromAccountId === transferForm.toAccountId) errors.toAccountId = 'Must differ from the source account';
        if (!amount || amount <= 0) errors.amount = 'Amount must be greater than 0';
        const feeAmount = parseFloat(transferForm.fee) || 0;
        if (isOverseasTransfer && feeAmount > 0 && !isCrossPersonTransfer) {
            if (!transferForm.categoryId) errors.categoryId = 'Category is required for a fee';
            if (transferFeeCategory && transferFeeCategory.subcategories.length > 0 && !transferForm.subcategory) errors.subcategory = 'Subcategory is required for a fee';
        }
        if (isCrossPersonTransfer) {
            if (!transferForm.principalCategoryId) errors.principalCategoryId = 'Category is required';
            if (transferPrincipalCategory && transferPrincipalCategory.subcategories.length > 0 && !transferForm.principalSubcategory) errors.principalSubcategory = 'Subcategory is required';
        }
        if (Object.keys(errors).length > 0) { setTransferErrors(errors); return; }

        setTransferSubmitting(true);
        try {
            const rate = isOverseasTransfer
                ? (parseFloat(transferForm.conversionRate) || liveConversionRate || await CurrencyService.getConversionRate(transferFromAccount.currency, transferToAccount.currency))
                : 1;
            const toAmount = isOverseasTransfer
                ? (parseFloat(transferForm.toAmount) || Math.round((amount - feeAmount) * rate * 100) / 100)
                : amount;
            let feeExpenseId = null;
            if (isOverseasTransfer && feeAmount > 0 && !isCrossPersonTransfer) {
                const feeExpense = await DataService.addExpense({
                    amount: feeAmount,
                    currency: transferFromAccount.currency,
                    date: transferForm.date,
                    description: `Transfer fee: ${transferFromAccount.accountName} → ${transferToAccount.accountName}`,
                    categoryId: parseInt(transferForm.categoryId),
                    subcategory: transferForm.subcategory || '',
                    paidBy: transferFromAccount.person === 'own' ? '' : transferFromAccount.person,
                    accountId: transferFromAccount.id,
                    tags: ['transfer-fee']
                });
                feeExpenseId = feeExpense.id;
            }
            let principalExpenseId = null;
            let recipientIncomeId = null;
            if (isCrossPersonTransfer) {
                const toPersonLabel = transferToAccount.person === 'own' ? 'Me' : transferToAccount.person;
                const fromPersonLabel = transferFromAccount.person === 'own' ? 'Me' : transferFromAccount.person;
                const principalExpense = await DataService.addExpense({
                    amount: amount + (isOverseasTransfer ? feeAmount : 0),
                    currency: transferFromAccount.currency,
                    date: transferForm.date,
                    description: `Transfer to ${toPersonLabel}: ${transferFromAccount.accountName} → ${transferToAccount.accountName}`,
                    categoryId: parseInt(transferForm.principalCategoryId),
                    subcategory: transferForm.principalSubcategory || '',
                    paidBy: transferFromAccount.person === 'own' ? '' : transferFromAccount.person,
                    tags: ['transfer-principal']
                });
                principalExpenseId = principalExpense.id;
                const recipientIncome = await DataService.addIncome({
                    amount: toAmount,
                    currency: transferToAccount.currency,
                    date: transferForm.date,
                    source: `Transfer from ${fromPersonLabel}`,
                    description: `Transfer from ${fromPersonLabel}: ${transferFromAccount.accountName} → ${transferToAccount.accountName}`,
                    paidBy: transferToAccount.person === 'own' ? '' : transferToAccount.person,
                    tags: ['transfer-incoming']
                });
                recipientIncomeId = recipientIncome.id;
            }
            DataService.addTransfer({
                date: transferForm.date,
                fromAccountId: transferFromAccount.id,
                toAccountId: transferToAccount.id,
                fromAmount: amount,
                toAmount,
                isOverseas: isOverseasTransfer,
                conversionRate: rate,
                fee: isOverseasTransfer ? feeAmount : 0,
                feeExpenseId,
                principalExpenseId,
                recipientIncomeId,
                notes: transferForm.notes || ''
            });
            setShowTransferForm(false);
            setTransferForm(emptyTransferForm);
            setTransferErrors({});
            if (onUpdate) onUpdate();
        } finally {
            setTransferSubmitting(false);
        }
    };

    const supportedCurrencies = CurrencyService.getAllCurrencies();

    const handleSelectChange = async (e) => {
        const newCurrency = e.target.value;
        try {
            await DataService.updateSettings({ currency: newCurrency });
            setSaveMessage('Currency updated successfully!');
            setTimeout(() => setSaveMessage(''), 2000);
            if (onCurrencyChange) onCurrencyChange(newCurrency);
        } catch (error) {
            setSaveMessage('Failed to update currency');
        }
    };

    const getCurrencySymbol = (code) => {
        const c = supportedCurrencies.find(cur => cur.code === code);
        return c ? c.symbol : code;
    };

    const staleCustomCurrencies = customCurrencies.filter(c => !c.isLive && c.rateAgainst !== currentCurrency);
    const builtInCurrencyList = Object.entries(CurrencyService.supportedCurrencies).map(([code, v]) => ({ code, name: v.name, symbol: v.symbol }));

    const handleCheckCurrency = async (e) => {
        e.preventDefault();
        setCurrencyFormError('');
        const name = currencyForm.name.trim();
        const code = currencyForm.code.trim().toUpperCase();
        if (!name) { setCurrencyFormError('Currency name is required'); return; }
        if (!/^[A-Z]{3}$/.test(code)) { setCurrencyFormError('Currency code must be 3 letters'); return; }
        if (CurrencyService.getAllCurrencies().some(c => c.code === code)) { setCurrencyFormError('This currency code already exists'); return; }
        setCurrencyChecking(true);
        try {
            const rate = await CurrencyService.lookupLiveRate(code, currentCurrency);
            if (rate != null) setCurrencyCheck({ name, code, rate });
            else { setCurrencyCheck({ name, code, needsManual: true }); setManualRate(''); }
        } finally {
            setCurrencyChecking(false);
        }
    };

    const handleConfirmAddCurrency = () => {
        const { name, code, rate } = currencyCheck;
        DataService.addCustomCurrency({ code, name, symbol: CurrencyService.deriveSymbol(code), rate, rateAgainst: currentCurrency, isLive: true });
        setCustomCurrencies(DataService.getCustomCurrencies());
        setCurrencyForm({ name: '', code: '' });
        setCurrencyCheck(null);
    };

    const handleSaveManualRate = (e) => {
        e.preventDefault();
        const rate = parseFloat(manualRate);
        if (!manualRate || rate <= 0) { setCurrencyFormError('Enter a conversion rate greater than 0'); return; }
        if (editingRateFor) {
            DataService.updateCustomCurrencyRate(editingRateFor.id, { rate, rateAgainst: currentCurrency, isLive: false });
            setEditingRateFor(null);
        } else {
            const { name, code } = currencyCheck;
            DataService.addCustomCurrency({ code, name, symbol: CurrencyService.deriveSymbol(code), rate, rateAgainst: currentCurrency, isLive: false });
        }
        setCustomCurrencies(DataService.getCustomCurrencies());
        setCurrencyForm({ name: '', code: '' });
        setCurrencyCheck(null);
        setManualRate('');
        setCurrencyFormError('');
    };

    const handleCancelCurrencyAdd = () => {
        setCurrencyCheck(null);
        setManualRate('');
        setCurrencyFormError('');
        setEditingRateFor(null);
    };

    const handleDeleteCustomCurrency = (id) => {
        DataService.deleteCustomCurrency(id);
        setCustomCurrencies(DataService.getCustomCurrencies());
    };

    const openUpdateRate = (currency) => {
        setEditingRateFor(currency);
        setManualRate('');
        setCurrencyFormError('');
    };

    return (
        <div className="screen">
            <div className="screen-header">
                <h2>Settings</h2>
            </div>

            <div className="settings-section" style={{marginBottom: '1.5rem'}}>
                <h5 style={{marginBottom: '0.5rem', color: '#4a6cf7'}}>
                    <i className="fas fa-user me-2"></i>Your Name
                </h5>
                <p className="text-muted" style={{fontSize: '0.9rem', marginBottom: '0.75rem'}}>
                    Used as your identity when tracking "paid by"
                </p>
                <input type="text" className="form-control" placeholder="Enter your display name (2–50 characters)" value={displayName} onChange={e => { setDisplayName(e.target.value); setNameError(''); }} />
                <div style={{display: 'flex', gap: '0.5rem', marginTop: '0.5rem'}}>
                    <button className="btn btn-primary" onClick={handleSaveDisplayName}>Save Name</button>
                    <button className="btn btn-outline-secondary" onClick={() => { setDisplayName(savedDisplayName); setNameError(''); }}>Cancel</button>
                </div>
                {nameError && <div className="text-danger mt-1" style={{fontSize: '0.875rem'}}>{nameError}</div>}
                {nameSaved && <div className="text-success mt-1" style={{fontSize: '0.875rem'}}><i className="fas fa-check me-1"></i>Name saved!</div>}
            </div>

            <hr style={{margin: '1rem 0 1.5rem'}} />

            <div style={{marginBottom: '1.5rem'}}>
                <h5 style={{marginBottom: '0.5rem', color: '#4a6cf7'}}>
                    <i className="fas fa-coins"></i> Default Currency
                </h5>
                <p className="text-muted" style={{fontSize: '0.9rem', marginBottom: '1rem'}}>
                    Choose your default currency for budgets and summaries
                </p>
            </div>
            <div style={{marginBottom: '1.5rem'}}>
                <label htmlFor="currency-select" style={{fontWeight: '600', marginBottom: '0.5rem', display: 'block'}}>
                    Select Currency:
                </label>
                <select
                    id="currency-select"
                    className="form-select"
                    value={currentCurrency}
                    onChange={handleSelectChange}
                    style={{fontSize: '1.1rem', padding: '0.75rem'}}
                >
                    {supportedCurrencies.map(currency => (
                        <option key={currency.code} value={currency.code}>
                            {currency.symbol} {currency.code} - {currency.name}
                        </option>
                    ))}
                </select>
            </div>
            {saveMessage && (
                <div className={'alert ' + (saveMessage.includes('Failed') ? 'alert-danger' : 'alert-success')}>
                    {saveMessage}
                </div>
            )}
            <div style={{
                background: '#f8f9fa',
                borderRadius: '12px',
                padding: '1.25rem',
                textAlign: 'center',
                border: '2px solid #e9ecef'
            }}>
                <div style={{fontSize: '2rem', marginBottom: '0.5rem'}}>
                    {getCurrencySymbol(currentCurrency)}
                </div>
                <div style={{fontWeight: '600', fontSize: '1.1rem'}}>
                    Current Default: {currentCurrency}
                </div>
                <div style={{color: '#6c757d', fontSize: '0.85rem', marginTop: '0.25rem'}}>
                    {supportedCurrencies.find(c => c.code === currentCurrency) ? supportedCurrencies.find(c => c.code === currentCurrency).name : ''}
                </div>
            </div>

            <div style={{marginTop: '1.5rem', marginBottom: '1rem'}}>
                <h5 style={{marginBottom: '0.5rem', color: '#4a6cf7'}}>
                    <i className="fas fa-plus-circle"></i> Add Currency
                </h5>
                <p className="text-muted" style={{fontSize: '0.9rem', marginBottom: '1rem'}}>
                    Add a currency not in the list above. It'll become available everywhere you can pick a currency.
                </p>
            </div>

            {staleCustomCurrencies.length > 0 && (
                <div className="alert alert-warning" style={{fontSize: '0.85rem'}}>
                    <i className="fas fa-exclamation-triangle me-1"></i>
                    These currencies need an updated rate for {currentCurrency}:{' '}
                    {staleCustomCurrencies.map((c, i) => (
                        <React.Fragment key={c.id}>
                            {i > 0 && ', '}
                            <a href="#" onClick={e => { e.preventDefault(); openUpdateRate(c); }}>{c.name}</a>
                        </React.Fragment>
                    ))}.
                </div>
            )}

            {editingRateFor ? (
                <form onSubmit={handleSaveManualRate} style={{marginBottom: '1rem'}}>
                    <label style={{fontWeight: '600', fontSize: '0.85rem', marginBottom: '0.25rem', display: 'block'}}>
                        1 {editingRateFor.code} = ___ {currentCurrency}
                    </label>
                    <input type="number" step="0.0001" min="0" className={'form-control' + (currencyFormError ? ' is-invalid' : '')} value={manualRate} onChange={e => setManualRate(e.target.value)} placeholder="Conversion rate" autoFocus />
                    {currencyFormError && <div className="invalid-feedback">{currencyFormError}</div>}
                    <div className="alert alert-warning py-2" style={{fontSize: '0.8rem', marginTop: '0.5rem'}}>
                        <i className="fas fa-exclamation-triangle me-1"></i>This rate won't update automatically — it'll be used for offline conversion until you update it again.
                    </div>
                    <div style={{display: 'flex', gap: '0.5rem'}}>
                        <button type="submit" className="btn btn-primary btn-sm">Save Rate</button>
                        <button type="button" className="btn btn-outline-secondary btn-sm" onClick={handleCancelCurrencyAdd}>Cancel</button>
                    </div>
                </form>
            ) : currencyCheck ? (
                currencyCheck.needsManual ? (
                    <form onSubmit={handleSaveManualRate} style={{marginBottom: '1rem'}}>
                        <p style={{fontSize: '0.9rem'}}>No live conversion rate found for <strong>{currencyCheck.code}</strong>.</p>
                        <label style={{fontWeight: '600', fontSize: '0.85rem', marginBottom: '0.25rem', display: 'block'}}>
                            1 {currencyCheck.code} = ___ {currentCurrency}
                        </label>
                        <input type="number" step="0.0001" min="0" className={'form-control' + (currencyFormError ? ' is-invalid' : '')} value={manualRate} onChange={e => setManualRate(e.target.value)} placeholder="Conversion rate" autoFocus />
                        {currencyFormError && <div className="invalid-feedback">{currencyFormError}</div>}
                        <div className="alert alert-warning py-2" style={{fontSize: '0.8rem', marginTop: '0.5rem'}}>
                            <i className="fas fa-exclamation-triangle me-1"></i>No live rate is available for this currency. This rate won't update automatically — it'll be used for offline conversion until you update it.
                        </div>
                        <div style={{display: 'flex', gap: '0.5rem'}}>
                            <button type="submit" className="btn btn-primary btn-sm">Add Currency</button>
                            <button type="button" className="btn btn-outline-secondary btn-sm" onClick={handleCancelCurrencyAdd}>Cancel</button>
                        </div>
                    </form>
                ) : (
                    <div style={{marginBottom: '1rem'}}>
                        <p style={{fontSize: '0.9rem'}}>
                            1 {currencyCheck.code} = {currencyCheck.rate} {currentCurrency} (today's rate). Add <strong>{currencyCheck.name}</strong>?
                        </p>
                        <div style={{display: 'flex', gap: '0.5rem'}}>
                            <button type="button" className="btn btn-primary btn-sm" onClick={handleConfirmAddCurrency}>Confirm & Add</button>
                            <button type="button" className="btn btn-outline-secondary btn-sm" onClick={handleCancelCurrencyAdd}>Cancel</button>
                        </div>
                    </div>
                )
            ) : (
                <form onSubmit={handleCheckCurrency} style={{marginBottom: '1rem'}}>
                    <div className="row g-2 align-items-end">
                        <div className="col">
                            <label style={{fontWeight: '600', fontSize: '0.85rem', marginBottom: '0.25rem', display: 'block'}}>Currency Name *</label>
                            <input type="text" className="form-control" value={currencyForm.name} onChange={e => setCurrencyForm(f => ({...f, name: e.target.value}))} placeholder="e.g., Japanese Yen" />
                        </div>
                        <div className="col-auto" style={{width: '110px'}}>
                            <label style={{fontWeight: '600', fontSize: '0.85rem', marginBottom: '0.25rem', display: 'block'}}>Code *</label>
                            <input type="text" className="form-control" value={currencyForm.code} maxLength={3} onChange={e => setCurrencyForm(f => ({...f, code: e.target.value.toUpperCase()}))} placeholder="JPY" />
                        </div>
                        <div className="col-auto">
                            <button type="submit" className="btn btn-primary btn-sm" disabled={currencyChecking}>
                                {currencyChecking ? <><span className="spinner-border spinner-border-sm me-1"></span>Checking…</> : 'Check Rate'}
                            </button>
                        </div>
                    </div>
                    {currencyFormError && <div className="text-danger mt-1" style={{fontSize: '0.875rem'}}>{currencyFormError}</div>}
                </form>
            )}

            <div>
                {builtInCurrencyList.map(c => (
                    <div key={c.code} style={{display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0.6rem 0.75rem', marginBottom: '0.5rem', background: '#f8f9fa', borderRadius: '8px', border: '1px solid #e9ecef'}}>
                        <div>
                            <span style={{fontWeight: '600'}}>{c.symbol} {c.code} - {c.name}</span>
                            <span className="badge bg-primary ms-2" style={{fontSize: '0.65rem'}}>Default</span>
                        </div>
                    </div>
                ))}
                {customCurrencies.map(c => (
                    <div key={c.id} style={{display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0.6rem 0.75rem', marginBottom: '0.5rem', background: '#f8f9fa', borderRadius: '8px', border: '1px solid #e9ecef'}}>
                        <div>
                            <span style={{fontWeight: '600'}}>{c.symbol} {c.code} - {c.name}</span>
                            {c.isLive ? (
                                <span className="badge bg-success ms-2" style={{fontSize: '0.65rem'}}>Live rate</span>
                            ) : (
                                <span className="badge bg-secondary ms-2" style={{fontSize: '0.65rem'}}>Manual: 1 {c.code} = {c.rate} {c.rateAgainst}</span>
                            )}
                        </div>
                        <div style={{display: 'flex', gap: '0.25rem'}}>
                            <button className="btn btn-sm btn-outline-primary" onClick={() => openUpdateRate(c)} title="Update rate"><i className="fas fa-pencil-alt"></i></button>
                            <button className="btn btn-sm btn-outline-danger" onClick={() => handleDeleteCustomCurrency(c.id)} title="Delete"><i className="fas fa-trash"></i></button>
                        </div>
                    </div>
                ))}
            </div>

            <hr style={{margin: '1.5rem 0'}} />

            <div style={{marginBottom: '1.5rem'}}>
                <h5 style={{marginBottom: '0.5rem', color: '#4a6cf7'}}>
                    <i className="fas fa-users"></i> People
                </h5>
                <p className="text-muted" style={{fontSize: '0.9rem', marginBottom: '1rem'}}>
                    Manage people for expense and income tracking
                </p>
            </div>

            <form onSubmit={handleAddPerson} style={{marginBottom: '1rem'}}>
                <div className="row g-2 align-items-end">
                    <div className="col">
                        <label style={{fontWeight: '600', fontSize: '0.85rem', marginBottom: '0.25rem', display: 'block'}}>Name *</label>
                        <input type="text" className={'form-control ' + (personErrors.name ? 'is-invalid' : '')} value={personForm.name} onChange={(e) => { setPersonForm(prev => ({ ...prev, name: e.target.value })); if (personErrors.name) setPersonErrors({}); }} placeholder="Person name" />
                        {personErrors.name && <div className="invalid-feedback">{personErrors.name}</div>}
                    </div>
                    <div className="col">
                        <label style={{fontWeight: '600', fontSize: '0.85rem', marginBottom: '0.25rem', display: 'block'}}>Relationship</label>
                        <input type="text" className="form-control" value={personForm.relationship} onChange={(e) => setPersonForm(prev => ({ ...prev, relationship: e.target.value }))} placeholder="e.g., Spouse" />
                    </div>
                    <div className="col-auto d-flex align-items-center" style={{paddingBottom: personErrors.name ? '1.5rem' : '0'}}>
                        <div className="form-check">
                            <input className="form-check-input" type="checkbox" id="isDefault" checked={personForm.isDefault} onChange={(e) => setPersonForm(prev => ({ ...prev, isDefault: e.target.checked }))} />
                            <label className="form-check-label" htmlFor="isDefault" style={{fontSize: '0.85rem'}}>Default</label>
                        </div>
                    </div>
                </div>
                <div style={{marginTop: '0.5rem', display: 'flex', gap: '0.5rem'}}>
                    <button type="submit" className="btn btn-primary btn-sm">
                        <i className={'fas fa-' + (editingPerson ? 'save' : 'plus') + ' me-1'}></i>{editingPerson ? 'Save' : 'Add'}
                    </button>
                    {editingPerson && (
                        <button type="button" className="btn btn-secondary btn-sm" onClick={handleCancelEditPerson}>Cancel</button>
                    )}
                </div>
            </form>

            <div>
                {people.length === 0 ? (
                    <div className="text-muted text-center" style={{padding: '1rem', background: '#f8f9fa', borderRadius: '8px'}}>
                        <i className="fas fa-user-plus fa-2x" style={{marginBottom: '0.5rem', display: 'block', opacity: 0.5}}></i>
                        No people added yet. Add people to quickly assign expenses and income.
                    </div>
                ) : (
                    people.map(person => (
                        <div key={person.id} style={{display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0.6rem 0.75rem', marginBottom: '0.5rem', background: person.isDefault ? '#fff3cd' : '#f8f9fa', borderRadius: '8px', border: '1px solid ' + (person.isDefault ? '#ffc107' : '#e9ecef')}}>
                            <div>
                                <span style={{fontWeight: '600'}}>{person.name}</span>
                                {person.isDefault && <span style={{marginLeft: '0.5rem', color: '#ffc107', fontSize: '0.9rem'}} title="Default">★</span>}
                                {person.relationship && <span style={{marginLeft: '0.5rem', color: '#6c757d', fontSize: '0.85rem'}}>({person.relationship})</span>}
                            </div>
                            <div style={{display: 'flex', gap: '0.25rem'}}>
                                <button className="btn btn-sm btn-outline-primary" onClick={() => handleEditPerson(person)} title="Edit"><i className="fas fa-pencil-alt"></i></button>
                                <button className="btn btn-sm btn-outline-danger" onClick={() => setShowDeletePersonConfirm(person)} title="Delete"><i className="fas fa-trash"></i></button>
                            </div>
                        </div>
                    ))
                )}
            </div>

            {showDeletePersonConfirm && (
                <div className="modal show d-block" style={{backgroundColor: 'rgba(0,0,0,0.5)'}}>
                    <div className="modal-dialog modal-dialog-centered">
                        <div className="modal-content">
                            <div className="modal-header"><h5 className="modal-title">Remove Person</h5></div>
                            <div className="modal-body"><p>Remove <strong>{showDeletePersonConfirm.name}</strong> from the people list? Existing records will not be affected.</p></div>
                            <div className="modal-footer">
                                <button type="button" className="btn btn-secondary" onClick={() => setShowDeletePersonConfirm(null)}>Cancel</button>
                                <button type="button" className="btn btn-danger" onClick={() => handleDeletePerson(showDeletePersonConfirm.id)}>Remove</button>
                            </div>
                        </div>
                    </div>

                    <div className="col">
                        <label style={{fontWeight: '600', fontSize: '0.85rem', marginBottom: '0.25rem', display: 'block'}}>Currency *</label>

                    </button>
                    {editingAccount && (
                        <button type="button" className="btn btn-secondary btn-sm" onClick={handleCancelEditAccount}>Cancel</button>

                </div>
            </form>

            <div>

                    <div className="text-muted text-center" style={{padding: '1rem', background: '#f8f9fa', borderRadius: '8px'}}>

                    </div>
                ) : (() => {
                    const byPerson = new Map();
                    bankAccounts.forEach(a => {
                        if (!byPerson.has(a.person)) byPerson.set(a.person, []);
                        byPerson.get(a.person).push(a);
                    });
                    const orderedPersons = ['own', ...people.filter(p => !p.systemManaged).map(p => p.name)].filter(p => byPerson.has(p));
                    byPerson.forEach((_, p) => { if (!orderedPersons.includes(p)) orderedPersons.push(p); });
                    return orderedPersons.map(person => (
                        <div key={person} style={{marginBottom: '1rem'}}>

                                const candidate = account.isPrimary ? linkCandidatesAll.find(c => c.person === account.person) : null;

                                        <div style={{display: 'flex', gap: '0.25rem'}}>

                                            )}

                                                <button className="btn btn-sm btn-outline-primary" onClick={() => handleQuickTransfer(account)} title="Transfer money"><i className="fas fa-exchange-alt"></i></button>

                                            <button className="btn btn-sm btn-outline-danger" onClick={() => setShowDeleteAccountConfirm(account)} title="Delete"><i className="fas fa-trash"></i></button>
                                        </div>
                                    </div>
                                );

                        </div>

                })()}
            </div>

            {showDeleteAccountConfirm && (

                                <button type="button" className="btn btn-secondary" onClick={() => setShowDeleteAccountConfirm(null)}>Cancel</button>
                                <button type="button" className="btn btn-danger" onClick={() => handleDeleteAccount(showDeleteAccountConfirm.id)}>Remove</button>
                            </div>
                        </div>
                    </div>
                </div>
            )}

            {showLinkAccountsConfirm && (
                <div className="modal show d-block" style={{backgroundColor: 'rgba(0,0,0,0.5)'}}>
                    <div className="modal-dialog modal-dialog-centered">

                            <div className="modal-header"><h5 className="modal-title">Link Existing Transactions</h5></div>
                            <div className="modal-body">

                                    <p>No unlinked expenses or income found for anyone with a primary account.</p>

                                        <p>Link past expenses/income to each person's primary account? Uncheck anyone you'd rather leave unlinked.</p>

                                {bankAccounts.map(a => (<option key={a.id} value={a.id}>{(a.person === 'own' ? 'Me' : a.person)} — {a.accountName} ({a.currency}) — {ValidationUtils.formatCurrency(DataService.computeBankAccountBalance(a), a.currency)}</option>))}

                        <div className="form-group mb-2">
                            <label>To Account</label>
                            <select className={'form-select ' + (transferErrors.toAccountId ? 'is-invalid' : '')} value={transferForm.toAccountId} onChange={e => handleTransferFieldChange('toAccountId', e.target.value)}>

                                            {transferPrincipalCategory.subcategories.map(sub => (<option key={sub} value={sub}>{sub}</option>))}
                                        </select>
                                        {transferErrors.principalSubcategory && <div className="invalid-feedback d-block">{transferErrors.principalSubcategory}</div>}
                                    </div>
                                )}
                            </React.Fragment>

                                        <div className="form-group mb-2">

                                                <option value="">Select a category</option>
                                                {categories.map(c => (<option key={c.id} value={c.id}>{c.name}</option>))}
                                            </select>
                                            {transferErrors.categoryId && <div className="invalid-feedback d-block">{transferErrors.categoryId}</div>}
                                        </div>
                                        {transferFeeCategory && transferFeeCategory.subcategories.length > 0 && (
                                            <div className="form-group mb-2">
                                                <label>Fee Subcategory</label>
                                                <select className={'form-select ' + (transferErrors.subcategory ? 'is-invalid' : '')} value={transferForm.subcategory} onChange={e => handleTransferFieldChange('subcategory', e.target.value)}>
                                                    <option value="">Select a subcategory</option>
                                                    {transferFeeCategory.subcategories.map(sub => (<option key={sub} value={sub}>{sub}</option>))}
                                                </select>
                                                {transferErrors.subcategory && <div className="invalid-feedback d-block">{transferErrors.subcategory}</div>}
                                            </div>
                                        )}
                                    </React.Fragment>
                                )}
                            </React.Fragment>
                        )}
                        <div className="form-group mb-2">
                            <label>Notes (optional)</label>
                            <input type="text" className="form-control" value={transferForm.notes} onChange={e => handleTransferFieldChange('notes', e.target.value)} />
                        </div>
                        <button type="submit" className="btn btn-primary btn-sm" disabled={transferSubmitting}>
                            {transferSubmitting ? <><span className="spinner-border spinner-border-sm me-1"></span>Transferring…</> : 'Transfer'}
                        </button>
                    </form>
                </div>
            )}

            {showReconcileForm && (
                <div ref={reconcileFormRef} style={{marginTop: '0.75rem', background: '#f8f9fa', borderRadius: '10px', padding: '0.75rem'}}>

                            <label>Account</label>
                            <input type="text" className="form-control" value={reconcileAccount ? `${reconcileAccount.accountName} (${reconcileAccount.currency})` : ''} disabled />
                        </div>
                        <div className="form-group mb-2">
                            <label>Currently Tracked Balance</label>
                            <input type="text" className="form-control" value={reconcileAccount ? ValidationUtils.formatCurrency(DataService.computeBankAccountBalance(reconcileAccount), reconcileAccount.currency) : ''} disabled />
                        </div>
                        <div className="form-group mb-2">
                            <label>Actual Balance {reconcileAccount ? `(${reconcileAccount.currency})` : ''}</label>
                            <input type="number" step="0.01" className={'form-control ' + (reconcileErrors.actualBalance ? 'is-invalid' : '')} value={reconcileForm.actualBalance} onChange={e => handleReconcileFieldChange('actualBalance', e.target.value)} />

                        </div>
                        <div className="form-check mb-2">
                            <input className="form-check-input" type="checkbox" id="reconcileLogAsTransaction" checked={reconcileForm.logAsTransaction} onChange={e => handleReconcileFieldChange('logAsTransaction', e.target.checked)} />
                            <label className="form-check-label" htmlFor="reconcileLogAsTransaction">Also record this as an Expense/Income transaction</label>
                        </div>
                        {reconcileAccount && reconcileForm.actualBalance !== '' && !isNaN(parseFloat(reconcileForm.actualBalance)) && (() => {
                            const computedBalance = DataService.computeBankAccountBalance(reconcileAccount);
                            const delta = Math.round((parseFloat(reconcileForm.actualBalance) - computedBalance) * 100) / 100;
                            if (delta === 0) {
                                return <div className="alert alert-info py-2" style={{fontSize: '0.82rem'}}><i className="fas fa-check me-1"></i>Already matches — no adjustment needed.</div>;
                            }
                            const isLiability = DataService.LIABILITY_ACCOUNT_TYPES.includes(reconcileAccount.accountType);
                            const asExpense = isLiability ? delta > 0 : delta < 0;
                            if (!reconcileForm.logAsTransaction) {
                                return (
                                    <div className="alert alert-secondary py-2" style={{fontSize: '0.82rem'}}>
                                        <i className="fas fa-info-circle me-1"></i>This will adjust the tracked balance by {ValidationUtils.formatCurrency(Math.abs(delta), reconcileAccount.currency)} and update Net Worth — it won't appear in your Expense/Income history.
                                    </div>
                                );
                            }
                            return (
                                <React.Fragment>
                                    <div className="alert alert-warning py-2" style={{fontSize: '0.82rem'}}>
                                        <i className="fas fa-exclamation-triangle me-1"></i>This will record {asExpense ? 'an expense' : 'an income'} of {ValidationUtils.formatCurrency(Math.abs(delta), reconcileAccount.currency)}.
                                    </div>
                                    {asExpense && (
                                        <React.Fragment>
                                            <div className="form-group mb-2">
                                                <label>Category</label>
                                                <select className={'form-select ' + (reconcileErrors.categoryId ? 'is-invalid' : '')} value={reconcileForm.categoryId} onChange={e => handleReconcileFieldChange('categoryId', e.target.value)}>
                                                    <option value="">Select a category</option>
                                                    {categories.map(c => (<option key={c.id} value={c.id}>{c.name}</option>))}
                                                </select>
                                                {reconcileErrors.categoryId && <div className="invalid-feedback d-block">{reconcileErrors.categoryId}</div>}
                                            </div>

                                                <div className="form-group mb-2">
                                                    <label>Subcategory</label>
                                                    <select className={'form-select ' + (reconcileErrors.subcategory ? 'is-invalid' : '')} value={reconcileForm.subcategory} onChange={e => handleReconcileFieldChange('subcategory', e.target.value)}>

                                                        {reconcileCategory.subcategories.map(sub => (<option key={sub} value={sub}>{sub}</option>))}

                            <input type="text" className="form-control" value={reconcileForm.notes} onChange={e => handleReconcileFieldChange('notes', e.target.value)} />

                        </button>{' '}

                    </form>
                </div>
