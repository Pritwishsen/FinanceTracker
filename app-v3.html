    // One-time cleanup for accounts that already have a real, stored "Cash Withdraw" item from
    // before getCashWithdrawItems existed — those are now stale (nothing writes to them anymore)
    // and would show up as a duplicate alongside the computed figure. Idempotent: a no-op once
    // the category has no real items left. recordDeletion (not deleteNetWorthItem, to avoid a
    // history-snapshot entry per item) still logs each removal so it propagates on next sync.
    // Also renames an existing "Cash Withdraw" category to "Cash" in place (preserving its id/
    // locked-state) so pre-existing accounts pick up the rename too, not just fresh installs.
    static migrateCashWithdrawItemsToComputed() {
        const cats = this.getNetWorthCategories('asset');
        const cashCat = cats.find(c => c.name.trim().toLowerCase() === 'cash withdraw');
        if (cashCat && !cats.some(c => c.id !== cashCat.id && c.name.trim().toLowerCase() === 'cash')) {
            this.saveNetWorthCategories('asset', cats.map(c => c.id === cashCat.id ? { ...c, name: 'Cash' } : c));

    static getBankAssetItems(activeView) {
        const cat = this.getOrCreateNetWorthCategoryByName('asset', 'Bank & Savings');
        if (!cat) return [];
        return this.getBankAccounts()
            .filter(a => !this.LIABILITY_ACCOUNT_TYPES.includes(a.accountType) && !a.isPrimary)
            .filter(a => !activeView || matchesActiveView(a.person, activeView))

    // asset-type). Its balance is already counted via computeWallet()'s Wallet figure — this
    // exists purely so the account is visible in the Bank & Savings list. Callers MUST NOT
    // spread this into visibleItems/assetItems/totalAssets/savingsValue (that would double-count
    // against Wallet); inject it only into the render loop, after totals are already computed.
    static getPrimaryWalletBankItems(activeView) {
        const cat = this.getOrCreateNetWorthCategoryByName('asset', 'Bank & Savings');
        if (!cat) return [];
        return this.getBankAccounts()
            .filter(a => a.isPrimary && !this.LIABILITY_ACCOUNT_TYPES.includes(a.accountType))
            .filter(a => !activeView || matchesActiveView(a.person, activeView))
            .map(a => ({ id: 'bank-primary-' + a.id, name: a.accountName, value: this.computeBankAccountBalance(a), currency: a.currency, categoryId: cat.id, subcategory: a.accountType, type: 'asset', person: a.person, country: a.country, isBankAccount: true, isPrimaryWallet: true }));
    }
    // Every Credit Card/Loan bank account (primary or not — Wallet-folding only ever applies
    // to asset-type primaries), shaped as a read-only Net Worth liability item under the
    // matching existing default category ("Credit Cards" / "Loans").
    static getBankLiabilityItems(activeView) {
        const categoryNameFor = { 'Credit Card': 'Credit Cards', 'Loan': 'Loans' };
        return this.getBankAccounts()
            .filter(a => this.LIABILITY_ACCOUNT_TYPES.includes(a.accountType))
            .filter(a => !activeView || matchesActiveView(a.person, activeView))
            .map(a => {
                const cat = this.getOrCreateNetWorthCategoryByName('liability', categoryNameFor[a.accountType]);
                return { id: 'bank-' + a.id, name: a.accountName, value: this.computeBankAccountBalance(a), currency: a.currency, categoryId: cat ? cat.id : null, subcategory: a.accountType, type: 'liability', person: a.person, country: a.country, isBankAccount: true };

    // Replaces the old "Cash Flow" (all-time income − all-time expenses) with a figure that
    // doesn't double-count money already represented by a Bank & Savings/Liability row:
    // unlinked income/expenses (no bank account at all) plus each active person's own
    // Primary account balance (only when it's an asset-type account — a Primary Credit
    // Card/Loan stays purely a Liability, it's not "spending money").
    static computeWallet(activeView, defaultCurrency) {
        const { unlinkedIncome, unlinkedExpenses, primaryBalances } = this.computeWalletParts(activeView, defaultCurrency);
        return (unlinkedIncome - unlinkedExpenses) + primaryBalances;
    }
    // The three pieces computeWallet adds up, for the Net Worth "In wallet" breakdown line.
    static computeWalletParts(activeView, defaultCurrency) {
        const convert = (amount, currency) => CurrencyService.convertToDefaultSync(amount, currency, defaultCurrency);
        const unlinkedIncome = this.data.income.filter(i => !i.accountId && (!activeView || matchesActiveView(i.paidBy, activeView))).reduce((s, i) => s + convert(i.amount, i.currency || 'GBP'), 0);
        const unlinkedExpenses = this.data.expenses.filter(e => !e.accountId && (!activeView || matchesActiveView(e.paidBy, activeView))).reduce((s, e) => s + convert(e.amount, e.currency || 'GBP'), 0);
        const primaryBalances = this.getBankAccounts()
            .filter(a => a.isPrimary && !this.LIABILITY_ACCOUNT_TYPES.includes(a.accountType))
            .filter(a => !activeView || matchesActiveView(a.person, activeView))
            .reduce((s, a) => s + convert(this.computeBankAccountBalance(a), a.currency), 0);
        return { unlinkedIncome, unlinkedExpenses, primaryBalances };

    static async getBudgetSummary(activeView) {
        await this.initialize();
        const now = new Date();
        const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
        const endOfMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0);
        const monthlyExpenses = this.data.expenses.filter(expense => { const expenseDate = DateUtils.parseDateStr(expense.date); return expenseDate >= startOfMonth && expenseDate <= endOfMonth && matchesActiveView(expense.paidBy, activeView); });
        const budgetSummary = [];
        this.data.categories.forEach(category => {
            const categoryExpenses = monthlyExpenses.filter(expense => expense.categoryId === category.id);
            const totalSpent = categoryExpenses.reduce((sum, expense) => sum + expense.amount, 0);
            // Combine each active person's effective budget for this category — per-subcategory-mode
            // budgets sum their subcategory values (mirrors getEffectiveBudget() in Summary, the other
            // place that already treats useSubcategoryBudgets as the source of truth); no currency
            // conversion is done here (pre-existing simplification, unchanged by person-scoping).
            const buckets = activeView.map(p => (category.personBudgets && category.personBudgets[p]) || null).filter(Boolean);
            const effectiveBudget = buckets.reduce((sum, pb) => sum + ((pb.useSubcategoryBudgets && pb.subcategoryBudgets)
                ? Object.values(pb.subcategoryBudgets).reduce((s, v) => s + (v || 0), 0)
                : (pb.monthlyBudget || 0)), 0);
            const notificationThreshold = buckets.length > 0 ? Math.min(...buckets.map(pb => pb.notificationThreshold || 80)) : 80;
            const categoryData = { id: category.id, name: category.name, budget: effectiveBudget, spent: totalSpent, remaining: effectiveBudget - totalSpent, percentage: effectiveBudget > 0 ? (totalSpent / effectiveBudget) * 100 : 0, notificationThreshold, subcategories: [] };
            category.subcategories.forEach(subcatName => {
                const subcatExpenses = categoryExpenses.filter(expense => expense.subcategory === subcatName);
                const subcatSpent = subcatExpenses.reduce((sum, expense) => sum + expense.amount, 0);
                const subcatBudget = buckets.reduce((sum, pb) => sum + ((pb.subcategoryBudgets && pb.subcategoryBudgets[subcatName]) || 0), 0);
                if (subcatBudget > 0 || subcatSpent > 0) { categoryData.subcategories.push({ name: subcatName, budget: subcatBudget, spent: subcatSpent, remaining: subcatBudget - subcatSpent, percentage: subcatBudget > 0 ? (subcatSpent / subcatBudget) * 100 : 0 }); }
            });
            if (categoryData.budget > 0 || categoryData.spent > 0) budgetSummary.push(categoryData);
        });
        return budgetSummary;
    }
    static async checkBudgetAlerts(activeView) {
        const budgetSummary = await this.getBudgetSummary(activeView);
        const alerts = [];
        budgetSummary.forEach(item => {
            if (item.budget > 0) {

                else if (item.percentage >= item.notificationThreshold) alerts.push({ type: 'near', categoryId: item.id, name: item.name, pct: item.percentage, spent: item.spent, budget: item.budget });
            }
        });
        return alerts;
    }

    static goalNameTaken(name, owner, exceptId) {

// Fail-closed backup ownership check.
// Returns true only when the backup is confirmed to belong to the current user.
// If the user is signed in but the backup carries no userId, it is treated as
// untrusted and rejected (an attacker can strip/null the field).
function isBackupOwnedByCurrentUser(backup, currentUser) {
    const currentUid = currentUser ? (currentUser.uid || String(currentUser.id)) : null;
    if (!currentUid) return true; // No signed-in user — allow restore
    if (!backup || !backup.userId) return false; // Signed in but backup has no owner stamp — reject
    return backup.userId === currentUid;
}

// ── Backup tamper-evidence (HMAC-SHA256) ──────────────────────────────────────
// The signing key is stored per-user under a non-financeApp_ prefix so it
// survives DataService.clearAllUserData() (which only wipes financeApp_* keys).
// The key is NEVER embedded in the cloud backup, so an attacker with cloud write
// access cannot forge a valid signature without access to the victim's device.
function getOrCreateBackupSignKey(userId) {
    if (!userId) return null;
    const storageKey = 'ftBsk_' + userId;
    let key = localStorage.getItem(storageKey);
    if (!key) {
        try {
            const bytes = crypto.getRandomValues(new Uint8Array(32));
            key = btoa(String.fromCharCode(...bytes));
            localStorage.setItem(storageKey, key);
        } catch (_) { return null; }
    }
    return key;
}

// Invalidates this device's signing key so a key extracted from the device (e.g. a
// shared/borrowed machine) stops working after the user logs out or changes their
// password. The next signBackupForUpload()/verifyBackupSignature() call transparently
// generates a fresh key via getOrCreateBackupSignKey() — cross-device backups already
// tolerate a non-matching key (see verifyBackupSignature's unverifiable branch), so
// rotating here doesn't break restores from other devices.
function rotateBackupSignKey(userId) {
    if (!userId) return;
    try { localStorage.removeItem('ftBsk_' + userId); } catch (_) {}
}

async function signBackupForUpload(backup, currentUser) {
    try {
        const userId = currentUser ? (currentUser.uid || String(currentUser.id)) : null;
        const signKey = getOrCreateBackupSignKey(userId);
        if (!signKey || !backup.data) return backup;
        const keyBytes = Uint8Array.from(atob(signKey), c => c.charCodeAt(0));
        const cryptoKey = await crypto.subtle.importKey('raw', keyBytes, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
        const dataBytes = new TextEncoder().encode(JSON.stringify(backup.data));
        const sig = await crypto.subtle.sign('HMAC', cryptoKey, dataBytes);
        return { ...backup, backupSignature: btoa(String.fromCharCode(...new Uint8Array(sig))) };
    } catch (_) { return backup; }
}

// Returns:
//   { ok: true }                      — HMAC signature verified ✓ → restore allowed
//   { ok: false, unverifiable: true } — no local signing key exists (device has never signed
//                                       a backup, or first-login on a new device) → allow silently
//   { ok: false, requiresConfirmation } — local key exists but backup carries no signature;
//                                       could be a legacy pre-signing backup or a stripped sig.
//                                       Migration policy: require explicit user confirmation
//                                       (TOFU — trust-on-first-use) before restoring, then sign
//                                       the next upload to enforce signatures going forward.
//   { ok: false, tampered: true }     — signature present but HMAC mismatch → ALWAYS reject.
async function verifyBackupSignature(backup, currentUser) {
    try {
        const userId = currentUser ? (currentUser.uid || String(currentUser.id)) : null;
        const signKey = userId ? localStorage.getItem('ftBsk_' + userId) : null;

        // No local key at all — this device has never signed a backup.
        // Treat as unverifiable and allow silently (first-use / cross-device fresh install).
        if (!signKey) return { ok: false, unverifiable: true };

        // Key exists but backup has no signature → TOFU migration policy.
        // Restore paths that have a modal must ask for explicit user confirmation.
        // Headless restore paths (no modal) must refuse.
        if (!backup || !backup.backupSignature) {
            return { ok: false, requiresConfirmation: true };
        }

        const keyBytes = Uint8Array.from(atob(signKey), c => c.charCodeAt(0));
        const cryptoKey = await crypto.subtle.importKey('raw', keyBytes, { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
        const dataBytes = new TextEncoder().encode(JSON.stringify(backup.data));
        const sigBytes = Uint8Array.from(atob(backup.backupSignature), c => c.charCodeAt(0));
        const valid = await crypto.subtle.verify('HMAC', cryptoKey, sigBytes, dataBytes);
        // Signature present and valid → full trust
        if (valid) return { ok: true };
        // Signature present but doesn't match this device's key.
        // This is expected when the backup was uploaded from a different device
        // (each device holds its own random key in localStorage). We cannot
        // distinguish a cross-device backup from a genuinely tampered one
        // without a shared key, so treat it as unverifiable and allow it
        // through silently — the same as a first-login / new-device restore.
        return { ok: false, unverifiable: true };
    } catch (_) { return { ok: false, unverifiable: true }; }
}

// Returns true when a backup's integrity state allows restore to proceed.
// ok and unverifiable → allow; requiresConfirmation → allow only via modal TOFU path;
// tampered → always block.
// Headless restore paths (no confirmation UI) must check !sigResult.requiresConfirmation separately.
function isSignatureAcceptable(sigResult) {
    return sigResult.ok || sigResult.unverifiable || sigResult.requiresConfirmation;
}

function computeNextDue(fromDate, frequency) {
    const fromStr = fromDate instanceof Date ? DateUtils.toDateStr(fromDate) : fromDate;
    const delta = frequency === 'daily' ? { days: 1 } : frequency === 'weekly' ? { days: 7 } : frequency === 'monthly' ? { months: 1 } : frequency === 'quarterly' ? { months: 3 } : frequency === 'yearly' ? { years: 1 } : {};
    return DateUtils.addToDateStr(fromStr, delta);
}

        if (tags.length > 10) { setErrors(prev => ({ ...prev, tags: 'Maximum 10 tags allowed per expense' })); return; }
        if (tags.some(t => t.length > 30)) { setErrors(prev => ({ ...prev, tags: 'Tags must be 30 characters or fewer' })); return; }
        setErrors(prev => ({ ...prev, tags: '' }));
        setFormData(prev => ({ ...prev, tags }));
    };

    // The "me" split participant's display name (seeded as 'Me' or an active-view label,
    // never blank — see splitParticipants' initial state) is separate from what should be
    // STORED as paidBy: it must resolve to the same ''/'own' convention every other "own"
    // record uses, or it silently disappears from the active-view filter once the app
    // isn't showing "All" anymore. `editSplitGroup` participants use real record ids, not
    // 'me', so they're identified by their original record having had an empty paidBy.
    const isPayerParticipant = (p) => {
        if (p.id === 'me') return true;
        if (editSplitGroup) {
            const original = editSplitGroup.find(r => r.id === p.id);
            if (original && !(original.paidBy || '').trim()) return true;
        }
        return false;
    };

    const resolveSplitParticipantPaidBy = (p) =>
        isPayerParticipant(p) ? resolveActiveViewValue(activeView) : p.name;

    // The payer keeps whatever account they explicitly chose in the form's own Account
    // field — recomputing it from their primary account here silently overrode a manual
    // non-primary selection the moment Split was checked. Every other participant's share
    // is a person-to-person IOU, not a real transaction against their account, so it's left
    // unlinked rather than auto-attached to their own primary account. Forced to '' when the
    // payer is marked Paid by Cash — a cash expense has no bank account either.
    const resolveSplitParticipantAccountId = (p) =>
        isPayerParticipant(p) ? (formData.isCashPayment ? '' : formData.accountId) : '';

    // Only the payer's share can be a cash payment — other participants' shares are unlinked
    // IOUs, same reasoning as resolveSplitParticipantAccountId above.
    const resolveSplitParticipantIsCash = (p) =>
        isPayerParticipant(p) ? formData.isCashPayment : false;

    // Used after adding (not editing) an expense so the user can log another one without
    // leaving the Add Expense screen — full reset back to the same blank state the form
    // opens in, except currency and date, which stay as whatever was last used: logging
    // several expenses for the same (possibly backdated) day shouldn't need re-entering
    // the date each time. The "Today" button next to the date field covers the common
    // case of wanting to jump back to today after a batch of backdated entries.
    const resetFormForNewEntry = () => {
        const newPaidBy = resolveActiveViewValue(activeView);
        setFormData(prev => ({
            amount: '', date: prev.date, description: '',
            categoryId: '', subcategory: '', paidBy: newPaidBy,
            currency: prev.currency, tags: [], accountId: resolveDefaultAccountId(newPaidBy, prev.currency),
            isCashPayment: false
        }));
        setTagInputRaw('');
        setErrors({});
        setIsSplit(false);
        setSplitParticipants([]);
        setSplitMethod('equal');
        setCustomAmounts({});
        setIsRecurring(false);
        setRecurringFreq('monthly');
        setRecurringEndDate('');
    };

    const handleSubmit = (e) => {
        e.preventDefault();
        setIsSubmitting(true);
        const tags = formData.tags || [];
        if (tags.length > 10) { setErrors({ tags: 'Maximum 10 tags allowed per expense' }); setIsSubmitting(false); return; }
        if (tags.some(t => t.length > 30)) { setErrors({ tags: 'Tags must be 30 characters or fewer' }); setIsSubmitting(false); return; }
        const validation = ValidationUtils.validateExpense({ ...formData, amount: parseFloat(formData.amount), categoryId: parseInt(formData.categoryId) });
        if (!validation.isValid) { setErrors(validation.errors); setIsSubmitting(false); return; }
        if (isSplit || editSplitGroup) {
            if (splitParticipants.length < 2) { setErrors({ general: 'A split needs at least 2 participants.' }); setIsSubmitting(false); return; }
            if (splitMethod === 'custom') {
                const total = splitParticipants.reduce((sum, p) => sum + (parseFloat(customAmounts[p.id]) || 0), 0);
                const target = parseFloat(formData.amount);
                if (Math.abs(total - target) > 0.01) { setErrors({ general: `Custom amounts must sum to ${ValidationUtils.formatCurrency(target, formData.currency)}. Current total: ${ValidationUtils.formatCurrency(total, formData.currency)}.` }); setIsSubmitting(false); return; }
                if (splitParticipants.some(p => !(parseFloat(customAmounts[p.id]) > 0))) { setErrors({ general: 'Each participant must have an amount greater than 0.' }); setIsSubmitting(false); return; }
            }
        }
        try {
            let description = formData.description.trim();
            if (!description && selectedCategory) description = selectedCategory.name + ' - ' + formData.subcategory;
            if (editSplitGroup) {
                // Batch-update every existing record in the split group instead of creating new
                // ones — shared fields (date/category/currency/etc.) apply to all, and each
                // participant's own share is recalculated from the edited total.
                const sharedFields = { date: formData.date, description, categoryId: parseInt(formData.categoryId), subcategory: formData.subcategory, currency: formData.currency, tags: formData.tags };
                const totalAmt = parseFloat(formData.amount);
                const n = splitParticipants.length;
                const baseShare = Math.round(totalAmt / n * 100) / 100;
                splitParticipants.forEach((p, i) => {
                    const share = splitMethod === 'equal'
                        ? (i === n - 1 ? Math.round((totalAmt - baseShare * (n - 1)) * 100) / 100 : baseShare)
                        : parseFloat(customAmounts[p.id] || 0);
                    DataService.updateExpense(p.id, { ...sharedFields, amount: share, paidBy: resolveSplitParticipantPaidBy(p), accountId: resolveSplitParticipantAccountId(p) });
                });
                setShowSuccess(true);
                setTimeout(() => { onSave(); if (onCancel) onCancel(); }, 1000);
                setIsSubmitting(false);
                return;
            }
            const baseExpenseData = { ...formData, description: description, amount: parseFloat(formData.amount), categoryId: parseInt(formData.categoryId), accountId: formData.isCashPayment ? '' : formData.accountId };
            // Repeat: create the schedule first so the expense(s) saved below can record its id
            // (recurringId). The schedule's template is the same data as before.
            const schedule = isRecurring ? DataService.addRecurring({ templateExpense: baseExpenseData, frequency: recurringFreq, endDate: recurringEndDate, type: 'expense' }) : null;
            const expenseData = schedule ? { ...baseExpenseData, recurringId: schedule.id } : baseExpenseData;
            if (editExpense) {
                if (isSplit && splitParticipants.length >= 2) {
                    // Converting a single expense into a new split — replace it with N split records
                    DataService.deleteExpense(editExpense.id);
                    const splitGroupId = 'split_' + Date.now();
                    const totalAmt = parseFloat(formData.amount);
                    const n = splitParticipants.length;
                    const baseShare = Math.round(totalAmt / n * 100) / 100;
                    splitParticipants.forEach((p, i) => {
                        const share = splitMethod === 'equal'
                            ? (i === n - 1 ? Math.round((totalAmt - baseShare * (n - 1)) * 100) / 100 : baseShare)
                            : parseFloat(customAmounts[p.id] || 0);
                        DataService.addExpenseWithConversion({ ...expenseData, amount: share, paidBy: resolveSplitParticipantPaidBy(p), accountId: resolveSplitParticipantAccountId(p), isCashPayment: resolveSplitParticipantIsCash(p), splitGroupId, isSplitRecord: true });
                    });
                } else {
                    DataService.updateExpense(editExpense.id, expenseData);
                }
            } else if (isSplit && splitParticipants.length >= 2) {
                const splitGroupId = 'split_' + Date.now();
                const totalAmt = parseFloat(formData.amount);
                const n = splitParticipants.length;
                const baseShare = Math.round(totalAmt / n * 100) / 100;
                splitParticipants.forEach((p, i) => {
                    const share = splitMethod === 'equal'
                        ? (i === n - 1 ? Math.round((totalAmt - baseShare * (n - 1)) * 100) / 100 : baseShare)
                        : parseFloat(customAmounts[p.id] || 0);
                    DataService.addExpenseWithConversion({ ...expenseData, amount: share, paidBy: resolveSplitParticipantPaidBy(p), accountId: resolveSplitParticipantAccountId(p), isCashPayment: resolveSplitParticipantIsCash(p), splitGroupId, isSplitRecord: true });
                });
            } else {
                DataService.addExpenseWithConversion(expenseData);
            }
            setShowSuccess(true);
            if (editExpense) {
                setTimeout(() => { onSave(); if (onCancel) onCancel(); }, 1000);
            } else {
                // New expense (not an edit): stay on this screen and reset the form instead of
                // navigating back to the list, so logging several expenses in a row doesn't
                // require a screen switch after each one.
                setTimeout(() => { onSave(); setShowSuccess(false); resetFormForNewEntry(); }, 1000);
            }
        } catch (error) { setErrors({ general: 'Failed to save expense. Please try again.' }); }
        setIsSubmitting(false);
    };

    const selectedCategory = categories.find(cat => cat.id === parseInt(formData.categoryId));

    // ── Redesign (Phase 2): layout state only — saving is unchanged (handleSubmit above) ──
    const [showCurrencySheet, setShowCurrencySheet] = useState(false);
    const [repeatEndMode, setRepeatEndMode] = useState('never');
    const [tagError, setTagError] = useState('');
    const allTags = useMemo(() => [...new Set((DataService.data.expenses || []).flatMap(e => e.tags || []))].sort(), []);
    const recentCurrencies = useMemo(() => {
        const seen = [];
        (DataService.data.expenses || []).forEach(e => { if (e.currency && !seen.includes(e.currency)) seen.push(e.currency); });
        let list = seen.slice(0, 3);
        if (!list.includes(formData.currency)) list = [formData.currency, ...list].slice(0, 3);
        return list;
    }, [formData.currency]);
    useEffect(() => {
        if (Object.values(errors).some(Boolean)) window.scrollTo({ top: 0, behavior: 'smooth' });
    }, [errors]);

    if (showSuccess) {
        return (
            <div className="sp-page">
                <div className="sp-saved"><i className="fas fa-circle-check"></i><div className="sp-sheet-title">{editSplitGroup ? 'Split updated' : editExpense ? 'Expense updated' : 'Expense added'}</div></div>
            </div>
        );
    }

    const splitOn = isSplit || !!editSplitGroup;
    const totalAmount = parseFloat(formData.amount) || 0;
    const nSplit = splitParticipants.length;
    const equalShare = (i) => {
        if (!nSplit) return 0;
        const base = Math.round(totalAmount / nSplit * 100) / 100;
        return i === nSplit - 1 ? Math.round((totalAmount - base * (nSplit - 1)) * 100) / 100 : base;
    };
    const customTotal = splitParticipants.reduce((sum, p) => sum + (parseFloat(customAmounts[p.id]) || 0), 0);
    const splitDiff = Math.round((totalAmount - customTotal) * 100) / 100;
    const splitUnbalanced = splitOn && splitMethod === 'custom' && totalAmount > 0 && Math.abs(splitDiff) > 0.01;
    const fmtAmt = (v) => ValidationUtils.formatCurrency(v, formData.currency);
    const participantLabel = (p) => (p.id === 'me' ? 'You' : p.name);
    const accounts = DataService.getAccountsForPerson(formData.paidBy || 'own');
    const firstRepeat = computeNextDue(new Date(), recurringFreq);
    const upcoming = [1, 2, 3].reduce((acc) => { acc.push(computeNextDue(acc[acc.length - 1], recurringFreq)); return acc; }, [firstRepeat]).slice(1);
    const firstError = errors.general || errors.amount || errors.date || errors.categoryId || errors.subcategory || errors.paidBy || errors.tags || tagError;
    const sortedCategories = [...categories].sort((a, b) => a.name.localeCompare(b.name));
    const ctaLabel = isSubmitting ? (editExpense || editSplitGroup ? 'Updating…' : 'Saving…')
        : splitUnbalanced ? 'Balance the split to save'
        : editSplitGroup ? 'Update all split records' : editExpense ? 'Save changes' : 'Save expense';

    return (
        <form onSubmit={handleSubmit} className="sp-page" noValidate>
            <div className="sp-formhead">
                <button type="button" className="sp-backbtn" onClick={onCancel} title="Back"><i className="fas fa-arrow-left"></i></button>
                <h2>{editSplitGroup ? 'Edit split expense' : editExpense ? 'Edit expense' : 'Add expense'}</h2>
                <div style={{width: '36px'}}></div>
            </div>
            {firstError && <div className="sp-alert sp-alert-err"><i className="fas fa-triangle-exclamation"></i><span>{firstError}</span></div>}

            <div className="sp-amounthero">
                <div className="sp-hero-label">{editSplitGroup ? 'Total amount' : 'Amount'}</div>
                <div className="sp-amounthero-row">
                    <span className="sp-amounthero-sym">{ValidationUtils.getCurrencySymbol(formData.currency)}</span>
                    <input type="number" step="0.01" min="0" inputMode="decimal" value={formData.amount} onChange={(e) => handleInputChange('amount', e.target.value)} placeholder="0.00" aria-label="Amount" />
                </div>
                <div className="sp-curchips">
                    {recentCurrencies.map(code => (
                        <button key={code} type="button" className={'sp-curchip' + (formData.currency === code ? ' is-active' : '')} onClick={() => handleInputChange('currency', code)}>
                            {formData.currency === code ? ValidationUtils.getCurrencySymbol(code) + ' ' + code : code}
                        </button>
                    ))}
                    <button type="button" className="sp-curchip" onClick={() => setShowCurrencySheet(true)}>More<i className="fas fa-chevron-down" style={{fontSize: '9px'}}></i></button>
                </div>
            </div>

            <div className="sp-formlabel">Category</div>
            <div className="sp-catchips">
                {sortedCategories.map(c => {
                    const look = spCategoryLook(c, categories.indexOf(c));
                    const on = String(formData.categoryId) === String(c.id);
                    return (
                        <button key={c.id} type="button" className={'sp-catchip' + (on ? ' is-active' : '') + (errors.categoryId && !formData.categoryId ? ' is-bad' : '')} onClick={() => handleInputChange('categoryId', String(c.id))}>
                            <i className={look.icon} style={{color: on ? '#34d399' : look.ink}}></i>{c.name}
                        </button>
                    );
                })}
            </div>

            <div className="sp-formcard">
                <div className={'sp-formrow' + (errors.date ? ' is-bad' : '')}>
                    <span>Date{formData.date !== DateUtils.today() && <button type="button" className="sp-link" style={{marginLeft: '8px', fontSize: '11px'}} onClick={() => handleInputChange('date', DateUtils.today())}>Today</button>}</span>
                    <input type="date" value={formData.date} max={DateUtils.today()} onChange={(e) => handleInputChange('date', e.target.value)} />
                </div>
                {selectedCategory && selectedCategory.subcategories.length > 0 && (
                    <div className={'sp-formrow' + (errors.subcategory ? ' is-bad' : '')}>
                        <span>Subcategory</span>
                        <select value={formData.subcategory} onChange={(e) => handleInputChange('subcategory', e.target.value)}>
                            <option value="">Select</option>
                            {[...selectedCategory.subcategories].sort((a, b) => a.localeCompare(b)).map(sub => (<option key={sub} value={sub}>{sub}</option>))}
                        </select>
                    </div>
                )}
                <div className="sp-formrow">
                    <span>Note</span>
                    <input type="text" value={formData.description} onChange={(e) => handleInputChange('description', e.target.value)} placeholder="Optional" style={{width: '60%'}} />
                </div>
                <div className="sp-formblock">
                    <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px'}}>
                        <span style={{fontSize: '14px', color: '#64748b', fontWeight: 600}}>Tags</span>
                        <span className="sp-hint">Enter or comma to add</span>
                    </div>
                    <TagInput tags={formData.tags || []} onChange={(tags) => setFormData(prev => ({ ...prev, tags }))} allTags={allTags} onError={setTagError} />
                </div>
                {!editSplitGroup && (activeView.length > 1 ? (
                    <div className={'sp-formrow' + (errors.paidBy ? ' is-bad' : '')}>
                        <span>Paid by</span>
                        <PersonSelect id="paidBy" value={formData.paidBy} onChange={(v) => handleInputChange('paidBy', v)} activeView={activeView} className="sp-row-input" />
                    </div>
                ) : (
                    <div className="sp-formrow">
                        <span>Paid by</span>
                        <span style={{display: 'inline-flex', alignItems: 'center', gap: '7px', fontSize: '13px', fontWeight: 700, color: '#0f172a'}}>{formData.paidBy || 'You'}<i className="fas fa-lock" style={{fontSize: '10px', color: '#cbd5e1'}}></i></span>
                    </div>
                ))}
            </div>

            {!editSplitGroup && (
                <React.Fragment>
                    <div className="sp-formlabel">Payment</div>
                    <div className="sp-seg">
                        <button type="button" className={!formData.isCashPayment ? 'is-active' : ''} onClick={() => handleInputChange('isCashPayment', false)}><i className="fas fa-credit-card" style={{marginRight: '6px'}}></i>Card / bank</button>
                        <button type="button" className={formData.isCashPayment ? 'is-active' : ''} onClick={() => handleInputChange('isCashPayment', true)}><i className="fas fa-money-bill-wave" style={{marginRight: '6px'}}></i>Cash</button>
                    </div>
                    {!formData.isCashPayment && (accounts.length > 0 ? (
                        <div className="sp-bankrows">
                            {accounts.map(a => {
                                const on = String(formData.accountId) === String(a.id);
                                return (
                                    <button key={a.id} type="button" className="sp-bankrow" onClick={() => handleInputChange('accountId', a.id)}>
                                        <span className="sp-tile" style={{background: on ? '#dbeafe' : '#f1f5f9', color: on ? '#1d4ed8' : '#64748b'}}><i className="fas fa-credit-card"></i></span>
                                        <div className="sp-row-main">
                                            <div style={{display: 'flex', alignItems: 'center', gap: '6px'}}><span className="sp-row-title">{a.accountName}</span>{a.isPrimary && <span className="sp-badge-primary">PRIMARY</span>}</div>
                                            <div className="sp-row-sub">{a.accountType || 'Account'} · {a.currency}</div>
                                        </div>
                                        <i className={on ? 'fas fa-circle-check' : 'far fa-circle'} style={{color: on ? '#10b981' : '#cbd5e1', fontSize: '16px'}}></i>
                                    </button>
                                );
                            })}
                            <button type="button" className="sp-bankrow" onClick={() => handleInputChange('accountId', '')}>
                                <span className="sp-tile" style={{background: '#f1f5f9', color: '#94a3b8'}}><i className="fas fa-link-slash"></i></span>
                                <div className="sp-row-main"><div className="sp-row-title">Not linked to an account</div><div className="sp-row-sub">Counts against your wallet</div></div>
                                <i className={!formData.accountId ? 'fas fa-circle-check' : 'far fa-circle'} style={{color: !formData.accountId ? '#10b981' : '#cbd5e1', fontSize: '16px'}}></i>
                            </button>
                        </div>
                    ) : (
                        <div className="sp-alert sp-alert-warn" style={{marginTop: '10px'}}><i className="fas fa-circle-info"></i><span>No bank accounts for {formData.paidBy || 'you'} yet, so this won't be linked to one. Add accounts in More → Accounts.</span></div>
                    ))}
                    {formData.isCashPayment && <div className="sp-hint" style={{margin: '8px 4px 0'}}>Taken from your cash in hand.</div>}
                </React.Fragment>
            )}

            <div className="sp-tiles2">
                {!editSplitGroup && (
                    <button type="button" className={'sp-toggletile' + (isSplit ? ' is-on' : '')} onClick={() => {
                        const val = !isSplit;
                        setIsSplit(val);
                        if (val && splitParticipants.length === 0) setSplitParticipants([{ id: 'me', name: formData.paidBy || 'Me' }]);
                    }}>
                        <span className="sp-tile" style={{background: '#eef2ff', color: '#6366f1'}}><i className="fas fa-users"></i></span>
                        <div style={{minWidth: 0}}><div className="sp-row-title" style={{fontSize: '13px'}}>Split</div><div style={{fontSize: '10px', fontWeight: 700, color: '#6366f1'}}>{isSplit ? nSplit + ' people' : 'Off'}</div></div>
                    </button>
                )}
                {!editSplitGroup && (
                    <button type="button" className={'sp-toggletile' + (isRecurring ? ' is-on' : '')} onClick={() => setIsRecurring(v => !v)}>
                        <span className="sp-tile" style={{background: '#dcfce7', color: '#16a34a'}}><i className="fas fa-redo"></i></span>
                        <div style={{minWidth: 0}}><div className="sp-row-title" style={{fontSize: '13px'}}>Repeat</div><div style={{fontSize: '10px', fontWeight: 700, color: '#16a34a'}}>{isRecurring ? recurringFreq.charAt(0).toUpperCase() + recurringFreq.slice(1) : 'Off'}</div></div>
                    </button>
                )}
            </div>

            {isRecurring && !editSplitGroup && (
                <div className="sp-panel">
                    <div className="sp-panel-label">Repeat every</div>
                    <div className="sp-seg is-light">
                        {['daily', 'weekly', 'monthly', 'quarterly', 'yearly'].map(f => (
                            <button key={f} type="button" className={recurringFreq === f ? 'is-active' : ''} onClick={() => {
                                setRecurringFreq(f);
                                const minEnd = computeNextDue(new Date(), f);
                                if (recurringEndDate && recurringEndDate < minEnd) setRecurringEndDate('');
                            }}>{f === 'quarterly' ? 'Quarter' : f.charAt(0).toUpperCase() + f.slice(1)}</button>
                        ))}
                    </div>
                    <div className="sp-panel-label" style={{margin: '14px 0 8px'}}>Ends</div>
                    <div className="sp-endtabs">
                        <button type="button" className={'sp-endtab' + (repeatEndMode === 'never' ? ' is-active' : '')} onClick={() => { setRepeatEndMode('never'); setRecurringEndDate(''); }}>Never</button>
                        <button type="button" className={'sp-endtab' + (repeatEndMode === 'date' ? ' is-active' : '')} onClick={() => setRepeatEndMode('date')}>On a date</button>
                    </div>
                    {repeatEndMode === 'date' && (
                        <div className="sp-formrow" style={{borderTop: '1px solid #f1f5f9', marginTop: '8px'}}>
                            <span>End date</span>
                            {/* Must allow at least one full cycle before ending (same rule as before). */}
                            <input type="date" value={recurringEndDate} min={firstRepeat} onChange={e => setRecurringEndDate(e.target.value)} />
                        </div>
                    )}
                    <div className="sp-infobox">
                        <div className="sp-infobox-row">
                            <span className="sp-infobox-icon"><i className="fas fa-calendar-check"></i></span>
                            <div><div className="sp-infobox-kicker">First repeat</div><div className="sp-infobox-value">{ValidationUtils.formatDate(firstRepeat)}</div></div>
                        </div>
                        <div className="sp-infobox-dates">{upcoming.map(d => <span key={d}>{ValidationUtils.formatDate(d)}</span>)}</div>
                        <div className="sp-infobox-foot">Adds a schedule under Scheduled → Recurring.</div>
                    </div>
                </div>
            )}

            {splitOn && (
                <div className="sp-panel">
                    <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px'}}>
                        <span className="sp-panel-label" style={{margin: 0}}>{editSplitGroup ? 'Split between' : 'Split with'}</span>
                        <span className="sp-hint">{nSplit} {nSplit === 1 ? 'person' : 'people'}{editSplitGroup ? ' · shares recalculated on save' : ''}</span>
                    </div>
                    <div style={{display: 'flex', flexWrap: 'wrap', gap: '8px'}}>
                        {editSplitGroup ? splitParticipants.map(p => (
                            <span key={p.id} className="sp-personchip is-on is-fixed"><span className="sp-personchip-av">{participantLabel(p).charAt(0)}</span>{participantLabel(p)}</span>
                        )) : (
                            <React.Fragment>
                                <span className="sp-personchip is-on is-fixed"><span className="sp-personchip-av">Y</span>You</span>
                                {/* The signed-in user's own (systemManaged) person record is already the fixed "You" chip. */}
                                {people.filter(person => !person.systemManaged && !splitParticipants.some(s => s.id === 'me' && s.name === person.name)).map(person => {
                                    const on = splitParticipants.some(s => s.id !== 'me' && s.name === person.name);
                                    return (
                                        <button key={person.id} type="button" className={'sp-personchip' + (on ? ' is-on' : '')} onClick={() => {
                                            if (on) {
                                                const existing = splitParticipants.find(s => s.id !== 'me' && s.name === person.name);
                                                setSplitParticipants(prev => prev.filter(x => x !== existing));
                                                setCustomAmounts(prev => { const n = { ...prev }; delete n[existing.id]; return n; });
                                            } else setSplitParticipants(prev => [...prev, { id: person.id, name: person.name }]);
                                        }}>
                                            <span className="sp-personchip-av">{(person.name || '?').charAt(0).toUpperCase()}</span>{person.name}{on && <i className="fas fa-check" style={{fontSize: '10px'}}></i>}
                                        </button>
                                    );
                                })}
                            </React.Fragment>
                        )}
                    </div>
                    {nSplit < 2 && <div className="sp-alert sp-alert-warn" style={{marginTop: '10px', marginBottom: 0}}><i className="fas fa-triangle-exclamation"></i><span>At least 2 participants required</span></div>}
                    <div className="sp-seg is-light" style={{marginTop: '14px'}}>
                        <button type="button" className={splitMethod === 'equal' ? 'is-active' : ''} onClick={() => setSplitMethod('equal')}>Split equally</button>
                        <button type="button" className={splitMethod === 'custom' ? 'is-active' : ''} onClick={() => setSplitMethod('custom')}>Custom amounts</button>
                    </div>
                    <div style={{marginTop: '10px'}}>
                        {splitParticipants.map((p, i) => {
                            const c = spPersonColor(p.id === 'me' ? 'own' : p.name, people);
                            return (
                                <div key={p.id} className="sp-splitrow">
                                    <span className="sp-tile" style={{width: '30px', height: '30px', borderRadius: '10px', background: c[0], color: c[1], fontWeight: 800, fontSize: '12px'}}>{participantLabel(p).charAt(0)}</span>
                                    <span className="sp-row-title" style={{flex: 1, fontSize: '13px'}}>{participantLabel(p)}</span>
                                    {splitMethod === 'equal' ? (
                                        <span className="sp-row-title" style={{fontSize: '13px'}}>{fmtAmt(equalShare(i))}</span>
                                    ) : (
                                        <div className="sp-splitinput">
                                            <span>{ValidationUtils.getCurrencySymbol(formData.currency)}</span>
                                            <input type="number" step="0.01" min="0" placeholder="0.00" value={customAmounts[p.id] || ''} onChange={e => setCustomAmounts(prev => ({ ...prev, [p.id]: e.target.value }))} />
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                    {splitMethod === 'custom' && (() => {
                        const balanced = totalAmount > 0 && Math.abs(splitDiff) <= 0.01;
                        const over = splitDiff < -0.01;
                        const bg = totalAmount <= 0 ? '#f1f5f9' : balanced ? '#dcfce7' : over ? '#fee2e2' : '#fef3c7';
                        const ink = totalAmount <= 0 ? '#64748b' : balanced ? '#15803d' : over ? '#be123c' : '#b45309';
                        const title = totalAmount <= 0 ? 'Enter an amount first' : balanced ? 'Fully distributed' : over ? 'Over-allocated' : 'Not fully distributed';
                        const pct = totalAmount > 0 ? Math.min((customTotal / totalAmount) * 100, 100) : 0;
                        return (
                            <div className="sp-splitsum" style={{background: bg}}>
                                <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                                    <span style={{fontSize: '12px', fontWeight: 700, color: ink}}><i className={balanced ? 'fas fa-circle-check' : 'fas fa-triangle-exclamation'} style={{marginRight: '6px'}}></i>{title}</span>
                                    <span style={{fontSize: '13px', fontWeight: 800, color: ink}}>{fmtAmt(customTotal)} / {fmtAmt(totalAmount)}</span>
                                </div>
                                <div className="sp-splitsum-bar"><div style={{width: pct + '%', height: '100%', background: ink, borderRadius: '999px'}}></div></div>
                                {totalAmount > 0 && !balanced && <div style={{fontSize: '11px', fontWeight: 600, color: ink, marginTop: '6px'}}>{over ? fmtAmt(-splitDiff) + ' more than the expense — reduce a share' : fmtAmt(splitDiff) + ' left to assign'}</div>}
                            </div>
                        );
                    })()}
                </div>
            )}

            <div style={{height: '84px'}}></div>
            <PinnedCta type="submit" label={ctaLabel} icon={isSubmitting ? 'fas fa-spinner fa-spin' : 'fas fa-check'} disabled={isSubmitting || splitUnbalanced} />

            {showCurrencySheet && (
                <CurrencySheet value={formData.currency} onClose={() => setShowCurrencySheet(false)} onPick={(code) => { handleInputChange('currency', code); setShowCurrencySheet(false); }} />
            )}
        </form>
    );
}

function ExpenseList({ expenses, categories, onUpdate, initialDateFrom = '', initialDateTo = '', initialPaidBy = '', activeView, defaultCurrency }) {
    // Restore last session's filters (see FilterMemory). A date range or person
    // passed in from a Trends/Summary drill-down still wins over the saved value.
    const _f0 = FilterMemory.load('expenses');
    const [filterCategory, setFilterCategory] = useState(_f0.category || '');
    const [filterSubcategory, setFilterSubcategory] = useState(_f0.subcategory || '');
    // Person filter is multi-select (any of the chosen people); '__mine__' = your own expenses.
    const [filterPersons, setFilterPersons] = useState(() => initialPaidBy ? [initialPaidBy] : Array.isArray(_f0.persons) ? _f0.persons : (_f0.person ? [_f0.person] : []));
    const [filterDateFrom, setFilterDateFrom] = useState(initialDateFrom || _f0.dateFrom || '');
    const [filterDateTo, setFilterDateTo] = useState(initialDateTo || _f0.dateTo || '');
    const [datePreset, setDatePreset] = useState(() => (initialDateFrom || initialDateTo) ? 'custom' : (_f0.datePreset || ((_f0.dateFrom || _f0.dateTo) ? 'custom' : 'all')));
    const [showFilterSheet, setShowFilterSheet] = useState(false);
    const [openRowId, setOpenRowId] = useState(null);
    const [stopRepeat, setStopRepeat] = useState(false);
    const [editingExpense, setEditingExpense] = useState(null);
    const [editingSplitGroupId, setEditingSplitGroupId] = useState(null);
    const [showEditConfirm, setShowEditConfirm] = useState(null);
    const [showDeleteConfirm, setShowDeleteConfirm] = useState(null);
    const [searchTerm, setSearchTerm] = useState(_f0.search || '');
    const [duplicatingExpense, setDuplicatingExpense] = useState(null);
    const [duplicateDate, setDuplicateDate] = useState('today');
    const [duplicateCustomDate, setDuplicateCustomDate] = useState('');
    const [duplicateDateError, setDuplicateDateError] = useState('');
    const [filterTags, setFilterTags] = useState(Array.isArray(_f0.tags) ? _f0.tags : []);
    const [filterSyncConflict, setFilterSyncConflict] = useState(!!_f0.syncConflict);
    const [visibleCount, setVisibleCount] = useState(50);
    const [openMenuId, setOpenMenuId] = useState(null);
    const [showConflictDetail, setShowConflictDetail] = useState(null);

    // The person sub-filter only makes sense (and is only shown) when multiple
    // participants are active — drop any stale selection once it drops back to one.
    useEffect(() => { if (activeView.length <= 1 && filterPersons.length) setFilterPersons([]); }, [activeView]);

    // Persist filters for the session so leaving and returning to this screen keeps them.
    useEffect(() => {
        FilterMemory.save('expenses', { category: filterCategory, subcategory: filterSubcategory, persons: filterPersons, dateFrom: filterDateFrom, dateTo: filterDateTo, datePreset, search: searchTerm, tags: filterTags, syncConflict: filterSyncConflict });
    }, [filterCategory, filterSubcategory, filterPersons, filterDateFrom, filterDateTo, datePreset, searchTerm, filterTags, filterSyncConflict]);

    useEffect(() => {
        if (!openMenuId) return;
        const close = () => setOpenMenuId(null);
        document.addEventListener('click', close);
        return () => document.removeEventListener('click', close);
    }, [openMenuId]);

    // accountId -> account name, for showing which bank/card a card-paid expense used.
    const accountNameById = useMemo(() => {
        const m = new Map();
        DataService.getBankAccounts().forEach(a => m.set(String(a.id), a.accountName));
        return m;
    }, [expenses]);

    // Local-vs-cloud tie conflicts detected by DataService.mergeBackups (see mergeById).
    // Recomputed on every merge and re-read here whenever `expenses` changes, so a
    // resolved conflict disappears on its own without any separate cleanup step.
    const syncConflicts = useMemo(() => SyncConflicts.read('expenses'), [expenses]);

    const filteredExpenses = useMemo(() => {
        let filtered = expenses;
        if (filterCategory) filtered = filtered.filter(expense => expense.categoryId === parseInt(filterCategory));
        if (filterSubcategory) filtered = filtered.filter(expense => expense.subcategory === filterSubcategory);
        if (filterPersons.length) filtered = filtered.filter(expense => {
            const who = (expense.paidBy || '').trim();
            return filterPersons.some(p => p === '__mine__' ? !who : who === p.trim());
        });
        if (filterDateFrom) filtered = filtered.filter(expense => (expense.date || '').substring(0, 10) >= filterDateFrom);
        if (filterDateTo) filtered = filtered.filter(expense => (expense.date || '').substring(0, 10) <= filterDateTo);
        if (filterSyncConflict) filtered = filtered.filter(expense => !!syncConflicts[String(expense.id)]);
        if (searchTerm) { const st = searchTerm.toLowerCase(); filtered = filtered.filter(e => (e.description || '').toLowerCase().includes(st) || (e.tags || []).some(tag => tag.includes(st))); }
        if (filterTags.length > 0) filtered = filtered.filter(e => filterTags.every(ft => (e.tags || []).includes(ft)));
        return filtered;
    }, [expenses, filterCategory, filterSubcategory, filterPersons, filterDateFrom, filterDateTo, filterSyncConflict, syncConflicts, searchTerm, filterTags]);

    useEffect(() => { setVisibleCount(50); }, [filteredExpenses]);

    const visibleExpenses = filteredExpenses.slice(0, visibleCount);

    // filteredExpenses is already date-desc (see DataService.getExpenses), so same-date
    // items are contiguous — no separate sort needed, just a linear grouping pass.
    const groupedExpenses = useMemo(() => {
        const groups = [];
        let current = null;
        visibleExpenses.forEach(expense => {
            const dateKey = (expense.date || '').substring(0, 10);
            if (!current || current.date !== dateKey) { current = { date: dateKey, items: [], total: 0 }; groups.push(current); }
            current.items.push(expense);
            current.total += CurrencyService.convertToDefaultSync(expense.amount, expense.currency || 'GBP', defaultCurrency);
        });
        return groups;
    }, [visibleExpenses, defaultCurrency]);

    const handleCategoryFilter = (categoryId) => { setFilterCategory(categoryId); setFilterSubcategory(''); };
    const handleDeleteExpense = (expenseId) => { DataService.deleteExpense(expenseId); setShowDeleteConfirm(null); onUpdate(); };
    const handleDeleteSplitGroup = (splitGroupId) => { DataService.deleteExpensesBySplitGroup(splitGroupId); setShowDeleteConfirm(null); onUpdate(); };
    const deletingExpense = showDeleteConfirm ? expenses.find(e => e.id === showDeleteConfirm) : null;
    const deletingIsSplit = !!(deletingExpense && deletingExpense.isSplitRecord && deletingExpense.splitGroupId);
    const editConfirmExpense = showEditConfirm ? expenses.find(e => e.id === showEditConfirm) : null;
    const conflictExpense = showConflictDetail ? expenses.find(e => e.id === showConflictDetail) : null;
    const conflictSnapshot = showConflictDetail ? syncConflicts[String(showConflictDetail)] : null;
    const expenseConflictFieldLabels = { amount: 'Amount', date: 'Date', description: 'Description', categoryId: 'Category', subcategory: 'Subcategory', currency: 'Currency', paidBy: 'Paid By', accountId: 'Account', isCashPayment: 'Cash Payment', tags: 'Tags' };
    const formatExpenseConflictValue = (key, value, record) => {
        if (key === 'categoryId') return value ? (getCategoryName(value) || String(value)) : '—';
        if (key === 'accountId') return value ? (accountNameById.get(String(value)) || String(value)) : '—';
        if (key === 'amount' && value !== undefined && value !== null) return ValidationUtils.formatCurrency(value, (conflictExpense && conflictExpense.currency) || 'GBP');
        if (key === 'isCashPayment') return value ? 'Cash' : ((record && record.accountId) ? 'Bank/Card' : 'Not Tagged');
        if (Array.isArray(value)) return value.length ? value.join(', ') : '—';
        return value === undefined || value === null || value === '' ? '—' : String(value);
    };
    const handleResolveConflict = async (useCloud) => {
        const expenseId = showConflictDetail;
        const updates = useCloud && conflictSnapshot ? conflictSnapshot.cloudSnapshot : {};
        await DataService.updateExpense(expenseId, updates);
        SyncConflicts.dismiss('expenses', expenseId);
        setShowConflictDetail(null);
        onUpdate();
    };
    const handleDuplicateExpense = (expense) => { setDuplicatingExpense(expense); setDuplicateDate('today'); setDuplicateCustomDate(''); setDuplicateDateError(''); };
    const handleConfirmDuplicate = () => {
        const today = DateUtils.today();
        let chosenDate;
        if (duplicateDate === 'original') chosenDate = duplicatingExpense.date;
        else if (duplicateDate === 'today') chosenDate = today;
        else { if (!duplicateCustomDate) { setDuplicateDateError('Please pick a date.'); return; } chosenDate = duplicateCustomDate; }
        if (chosenDate > today) { setDuplicateDateError('Duplicate date cannot be in the future.'); return; }
        // A copy isn't generated by the original's repeat schedule, so it doesn't inherit the link.
        const { recurringId: _notCopied, ...source } = duplicatingExpense;
        const newRecord = { ...source, id: DataService._uniqueId(), createdAt: new Date().toISOString(), date: chosenDate, description: duplicatingExpense.description + ' (Copy)' };
        DataService.addExpense(newRecord); onUpdate(); setDuplicatingExpense(null);
    };
    const getCategoryName = (categoryId) => { const category = categories.find(cat => cat.id === categoryId); return category ? category.name : 'Unknown Category'; };
    const selectedCategory = categories.find(cat => cat.id === parseInt(filterCategory));
    const expensesByCurrency = filteredExpenses.reduce((acc, expense) => { const currency = expense.currency || 'GBP'; if (!acc[currency]) acc[currency] = { total: 0, count: 0 }; acc[currency].total += expense.amount; acc[currency].count += 1; return acc; }, {});

    if (editingExpense) {
        return (<ExpenseForm categories={categories} editExpense={editingExpense} onSave={() => { setEditingExpense(null); onUpdate(); }} onCancel={() => setEditingExpense(null)} activeView={activeView} />);
    }
    if (editingSplitGroupId) {
        const groupRecords = expenses.filter(e => e.splitGroupId === editingSplitGroupId);
        return (<ExpenseForm categories={categories} editSplitGroup={groupRecords} onSave={() => { setEditingSplitGroupId(null); onUpdate(); }} onCancel={() => setEditingSplitGroupId(null)} activeView={activeView} />);
    }

    // ── Redesign (Phase 2): presentation only. Filtering, delete, duplicate and conflict
    // resolution all go through the existing handlers above. ──
    const people = DataService.getPeople();
    const today = DateUtils.today();
    const monthKey = today.slice(0, 7);
    const scheduleIds = new Set(DataService.getRecurring().map(r => r.id));
    const monthExpenses = expenses.filter(e => (e.date || '').slice(0, 7) === monthKey);
    const monthSpent = monthExpenses.reduce((s, e) => s + CurrencyService.convertToDefaultSync(e.amount, e.currency || 'GBP', defaultCurrency), 0);
    const monthSplit = monthExpenses.filter(e => e.isSplitRecord).length;
    const allTagList = [...new Set(expenses.flatMap(e => e.tags || []))].sort();
    const dayTotals = filteredExpenses.reduce((acc, e) => { const k = (e.date || '').substring(0, 10); acc[k] = (acc[k] || 0) + CurrencyService.convertToDefaultSync(e.amount, e.currency || 'GBP', defaultCurrency); return acc; }, {});
    const personName = (key) => key === '__mine__' ? 'You' : key;
    const presetRange = (key) => {
        if (key === 'month') return [monthKey + '-01', today];
        if (key === 'last') { const first = DateUtils.addToDateStr(monthKey + '-01', { months: -1 }); return [first, DateUtils.addToDateStr(monthKey + '-01', { days: -1 })]; }
        if (key === '30d') return [DateUtils.addToDateStr(today, { days: -29 }), today];
        if (key === 'all') return ['', ''];
        return [filterDateFrom, filterDateTo];
    };
    const applyPreset = (key) => { const [f, t] = presetRange(key); setDatePreset(key); setFilterDateFrom(f); setFilterDateTo(t); };
    const PRESET_LABELS = { all: 'All time', month: 'This month', last: 'Last month', '30d': 'Last 30 days', custom: 'Custom' };
    const clearAll = () => { setFilterCategory(''); setFilterSubcategory(''); setFilterPersons([]); setFilterDateFrom(''); setFilterDateTo(''); setDatePreset('all'); setSearchTerm(''); setFilterTags([]); setFilterSyncConflict(false); };
    const activeChips = [];
    if (filterCategory && selectedCategory) activeChips.push({ key: 'cat', label: selectedCategory.name, onRemove: () => handleCategoryFilter('') });
    if (filterSubcategory) activeChips.push({ key: 'sub', label: filterSubcategory, onRemove: () => setFilterSubcategory('') });
    filterPersons.forEach(p => activeChips.push({ key: 'p:' + p, label: personName(p), onRemove: () => setFilterPersons(prev => prev.filter(x => x !== p)) }));
    filterTags.forEach(t => activeChips.push({ key: 't:' + t, label: '#' + t, onRemove: () => setFilterTags(prev => prev.filter(x => x !== t)) }));
    if (datePreset !== 'all' && (filterDateFrom || filterDateTo)) activeChips.push({ key: 'date', label: datePreset === 'custom' ? [filterDateFrom && ValidationUtils.formatDate(filterDateFrom), filterDateTo && ValidationUtils.formatDate(filterDateTo)].filter(Boolean).join(' – ') : PRESET_LABELS[datePreset], onRemove: () => applyPreset('all') });
    if (filterSyncConflict) activeChips.push({ key: 'cf', label: 'Sync conflicts', onRemove: () => setFilterSyncConflict(false) });
    const filterCount = activeChips.length;

    const deleteSchedule = deletingExpense && deletingExpense.recurringId ? DataService.getRecurring().find(r => r.id === deletingExpense.recurringId) : null;
    const closeDelete = () => { setShowDeleteConfirm(null); setStopRepeat(false); };
    const afterDelete = () => { if (stopRepeat && deleteSchedule) DataService.deleteRecurring(deleteSchedule.id); setStopRepeat(false); setOpenRowId(null); };
    const splitRecords = deletingIsSplit ? expenses.filter(e => e.splitGroupId === deletingExpense.splitGroupId) : [];
    const whoLabel = (e) => (e.paidBy || '').trim() ? e.paidBy : 'You';
    const stopRepeatBox = deleteSchedule ? (
        <label className="sp-check" style={{marginTop: '10px', display: 'flex'}}>
            <input type="checkbox" checked={stopRepeat} onChange={e => setStopRepeat(e.target.checked)} />
            Also stop repeating ({(deleteSchedule.frequency || '').toLowerCase()} schedule)
        </label>
    ) : null;

    return (
        <div className="sp-page">
            <div className="sp-head">
                <div><div className="sp-head-kicker">{new Date().toLocaleDateString('en-GB', { month: 'long', year: 'numeric' })}</div><h2>Expenses</h2></div>
                <button type="button" className="sp-filterbtn" onClick={() => setShowFilterSheet(true)} title="Filters">
                    <i className="fas fa-sliders-h"></i>
                    {filterCount > 0 && <span className="sp-filterbtn-count">{filterCount}</span>}
                </button>
            </div>
            <div className="sp-hero">
                <div className="sp-hero-label">Spent this month</div>
                <div className="sp-hero-value">{ValidationUtils.formatCurrency(monthSpent, defaultCurrency)}</div>
                <div className="sp-hero-pills">
                    <span className="sp-hero-pill is-green">{monthExpenses.length} expense{monthExpenses.length === 1 ? '' : 's'}</span>
                    {monthSplit > 0 && <span className="sp-hero-pill">{monthSplit} split</span>}
                </div>
            </div>
            <div className="sp-search">
                <i className="fas fa-search"></i>
                <input type="text" placeholder="Search expenses" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
            </div>
            <div className="sp-pillrow">
                <button type="button" className={'sp-pill' + (!filterCategory ? ' is-active' : '')} onClick={() => handleCategoryFilter('')}>All</button>
                {categories.map(c => (
                    <button key={c.id} type="button" className={'sp-pill' + (String(filterCategory) === String(c.id) ? ' is-active' : '')} onClick={() => handleCategoryFilter(String(c.id))}>{c.name}</button>
                ))}
            </div>
            {filterCount > 0 && (
                <div className="sp-activechips">
                    {activeChips.map(c => <button key={c.key} type="button" className="sp-activechip" onClick={c.onRemove}>{c.label}<i className="fas fa-xmark" style={{fontSize: '10px'}}></i></button>)}
                    <button type="button" className="sp-clearlink" onClick={clearAll}>Clear all</button>
                </div>
            )}
            <div className="sp-resultlabel">{filteredExpenses.length} expense{filteredExpenses.length === 1 ? '' : 's'} · tap a row for actions</div>

            {filteredExpenses.length === 0 ? (
                <div className="sp-empty"><i className="fas fa-receipt"></i>{expenses.length === 0 ? 'No expenses yet — tap + to add your first one.' : 'No expenses match your filters.'}</div>
            ) : groupedExpenses.map(group => (
                <div key={group.date} className="sp-group">
                    <div className="sp-group-head">
                        <span className="sp-group-label">{spDayLabel(group.date)}</span>
                        <span className="sp-group-total">{ValidationUtils.formatCurrency(dayTotals[group.date] || group.total, defaultCurrency)}</span>
                    </div>
                    <div className="sp-listcard">
                        {group.items.map(expense => {
                            const cat = categories.find(c => c.id === expense.categoryId);
                            const look = spCategoryLook(cat, categories.indexOf(cat));
                            const bankName = (!expense.isCashPayment && expense.accountId) ? (accountNameById.get(String(expense.accountId)) || 'Bank') : '';
                            const isOpen = openRowId === expense.id;
                            const conflict = syncConflicts[String(expense.id)];
                            const cfOpen = conflict && showConflictDetail === expense.id;
                            const ownerKey = (expense.paidBy || '').trim() ? expense.paidBy : 'own';
                            const oc = spPersonColor(ownerKey, people);
                            const tags = (expense.tags || []);
                            return (
                                <div key={expense.id} className="sp-item">
                                    <div role="button" tabIndex={0} className={'sp-item-row' + (isOpen ? ' is-open' : '')} onClick={() => setOpenRowId(isOpen ? null : expense.id)} onKeyDown={e => { if (e.key === 'Enter') setOpenRowId(isOpen ? null : expense.id); }}>
                                        <span className="sp-cattile" style={{background: look.tint, color: look.ink}}><i className={look.icon}></i></span>
                                        <div className="sp-item-main">
                                            <div className="sp-item-title">
                                                <span>{expense.description}</span>
                                                {conflict && <button type="button" className={'sp-cfbtn' + (cfOpen ? ' is-open' : '')} title="Sync conflict · tap to compare" onClick={(e) => { e.stopPropagation(); setShowConflictDetail(cfOpen ? null : expense.id); }}><i className="fas fa-code-compare"></i></button>}
                                                {expense.recurringId && scheduleIds.has(expense.recurringId) && <i className="fas fa-rotate" title="Repeats" style={{color: '#16a34a', fontSize: '10px'}}></i>}
                                            </div>
                                            <div className="sp-item-meta">
                                                {expense.isCashPayment
                                                    ? <span className="sp-paybadge is-cash"><i className="fas fa-money-bill-wave" style={{fontSize: '9px'}}></i>Cash</span>
                                                    : bankName && <span className="sp-paybadge is-card"><i className="fas fa-credit-card" style={{fontSize: '9px'}}></i>{bankName}</span>}
                                                <span className="sp-item-sub">{[cat ? cat.name : 'Unknown Category', expense.subcategory].filter(Boolean).join(' · ')}{tags.length > 0 && <span className="sp-item-tags"> {tags.map(t => '#' + t).join(' ')}</span>}</span>
                                            </div>
                                        </div>
                                        <div className="sp-item-right">
                                            <div className="sp-item-amount">{ValidationUtils.formatCurrency(expense.amount, expense.currency || 'GBP')}</div>
                                            <div className="sp-item-right-meta">
                                                {activeView.length > 1 && <span className="sp-ownerchip" style={{background: oc[0], color: oc[1]}}><span className="sp-ownerchip-dot" style={{background: oc[1]}}>{whoLabel(expense).charAt(0).toUpperCase()}</span>{whoLabel(expense)}</span>}
                                                {expense.isSplitRecord && <span className="sp-minibadge"><i className="fas fa-users" style={{fontSize: '9px'}}></i>Split</span>}
                                            </div>
                                        </div>
                                    </div>
                                    {cfOpen && (
                                        <ConflictCompare localRecord={expense} cloudSnapshot={conflict.cloudSnapshot} detectedAt={conflict.detectedAt}
                                            fieldLabels={expenseConflictFieldLabels} formatValue={formatExpenseConflictValue}
                                            onKeepLocal={() => handleResolveConflict(false)} onUseCloud={() => handleResolveConflict(true)} />
                                    )}
                                    {isOpen && (
                                        <div className="sp-rowactions">
                                            <button type="button" className="sp-rowaction" onClick={() => { if (expense.isSplitRecord && expense.splitGroupId) setShowEditConfirm(expense.id); else setEditingExpense(expense); }}><i className="fas fa-pen" style={{fontSize: '10px'}}></i>Edit</button>
                                            <button type="button" className="sp-rowaction is-indigo" onClick={() => handleDuplicateExpense(expense)}><i className="fas fa-copy" style={{fontSize: '10px'}}></i>Duplicate</button>
                                            <button type="button" className="sp-rowaction is-danger" onClick={() => { setStopRepeat(false); setShowDeleteConfirm(expense.id); }}><i className="fas fa-trash" style={{fontSize: '10px'}}></i>Delete</button>
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            ))}
            {visibleCount < filteredExpenses.length && (
                <div className="sp-more-wrap">
                    <button type="button" className="sp-more-btn" onClick={() => setVisibleCount(c => c + 50)}><i className="fas fa-chevron-down" style={{fontSize: '11px', color: '#10b981'}}></i>Show {Math.min(50, filteredExpenses.length - visibleCount)} more</button>
                    <span className="sp-hint">Showing {visibleCount} of {filteredExpenses.length}</span>
                </div>
            )}

            {showFilterSheet && (

    [/mortgage/i, 'fas fa-house-chimney', '#fee2e2', '#e11d48'], [/loan/i, 'fas fa-hand-holding-dollar', '#ffedd5', '#ea580c'],

const spNetWorthCatLook = (cat, type) => {
