                <div className="sp-formrow"><span>Note</span><input type="text" value={f.notes} placeholder="Optional" onChange={e => set('notes', e.target.value)} /></div>
            </div>
            <div className="sp-panel">
                <div className="sp-remind-head"><span><i className="fas fa-bell"></i>Remind me before</span><span className="sp-remind-when">{remind > 0 ? 'On ' + spShortDate(remindOn) : 'No reminder'}</span></div>
                <div className="sp-remind-chips">
                    {remindChoices.map(n => <button key={n} type="button" className={remind === n ? 'is-active' : ''} onClick={() => set('reminderDaysBefore', n)}>{n === 0 ? 'Off' : n + 'd'}</button>)}
                </div>
            </div>
            {showCurrency && <CurrencySheet value={f.currency} onPick={c => { set('currency', c); setShowCurrency(false); }} onClose={() => setShowCurrency(false)} />}
        </Sheet>
    );
}

function BillTracker({ categories, onUpdate, activeView, embedded }) {
    const [bills, setBills] = useState(() => DataService.getBills());
    const [openId, setOpenId] = useState(null);
    const [pendingDelete, setPendingDelete] = useState(null);
    const [formBill, setFormBill] = useState(null); // null | 'new' | bill
    const [payBill, setPayBill] = useState(null);
    const [toast, setToast] = useState('');
    const _f0 = FilterMemory.load('bills');
    const [filterSyncConflict, setFilterSyncConflict] = useState(!!_f0.syncConflict);
    const [showConflictDetail, setShowConflictDetail] = useState(null);
    const people = DataService.getPeople();

    const loadBills = () => setBills(DataService.getBills());
    useEffect(() => { FilterMemory.save('bills', { syncConflict: filterSyncConflict }); }, [filterSyncConflict]);
    useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(''), 4000); return () => clearTimeout(t); }, [toast]);

    const syncConflicts = useMemo(() => SyncConflicts.read('bills'), [bills]);
    const today = DateUtils.today();
    const visibleBills = bills.filter(b => spBillVisible(b, activeView));
    const displayBills = filterSyncConflict ? visibleBills.filter(b => !!syncConflicts[String(b.id)]) : visibleBills;
    const sortedBills = [...displayBills].sort((a, b) => {
        if (!!a.isActive !== !!b.isActive) return a.isActive ? -1 : 1;
        return (a.nextDueDate || '').localeCompare(b.nextDueDate || '');
    });

    const afterChange = (msg) => { loadBills(); if (msg) setToast(msg); if (onUpdate) onUpdate(); };
    const handleDelete = (id) => { DataService.deleteBill(id); setPendingDelete(null); setOpenId(null); afterChange('Bill deleted'); };
    const setActive = (bill, isActive) => { DataService.updateBill(bill.id, { isActive }); afterChange(bill.name + (isActive ? ' resumed' : ' paused')); };

    const fmtCurrency = (amt, cur) => ValidationUtils.formatCurrency(amt, cur || 'GBP');
    const conflictBill = showConflictDetail ? bills.find(b => b.id === showConflictDetail) : null;
    const conflictSnapshot = showConflictDetail ? syncConflicts[String(showConflictDetail)] : null;
    const billConflictFieldLabels = { name: 'Name', amount: 'Amount', currency: 'Currency', frequency: 'Frequency', nextDueDate: 'Next Due Date', categoryId: 'Category', subcategory: 'Subcategory', reminderDaysBefore: 'Reminder (days before)', notes: 'Notes', person: 'Person', isActive: 'Active', isPaid: 'Paid' };
    const formatBillConflictValue = (key, value) => {
        if (key === 'categoryId') { const cat = categories.find(c => c.id === value); return cat ? cat.name : (value ? String(value) : '—'); }
        if (key === 'amount' && value !== undefined && value !== null) return fmtCurrency(value, (conflictBill && conflictBill.currency) || 'GBP');
        if (typeof value === 'boolean') return value ? 'Yes' : 'No';
        return value === undefined || value === null || value === '' ? '—' : String(value);
    };
    const handleResolveConflict = async (useCloud) => {
        const billId = showConflictDetail;
        const updates = useCloud && conflictSnapshot ? conflictSnapshot.cloudSnapshot : {};
        await DataService.updateBill(billId, updates);
        SyncConflicts.dismiss('bills', billId);
        setShowConflictDetail(null);
        afterChange();
    };

    return (
        <div className={embedded ? undefined : 'sp-page'}>
            {toast && <div className="sp-alert sp-alert-ok"><i className="fas fa-circle-check"></i><span>{toast}</span></div>}
            {Object.keys(syncConflicts).length > 0 && (
                <label className="sp-check" style={{margin: '0 4px 10px'}}>
                    <input type="checkbox" checked={filterSyncConflict} onChange={(e) => setFilterSyncConflict(e.target.checked)} />
                    <i className="fas fa-code-compare" style={{color: '#4f46e5'}}></i>Sync conflicts only
                </label>
            )}
            {visibleBills.length === 0 ? (
                <div className="sp-empty"><i className="fas fa-file-invoice"></i>No bills yet. Add regular bills and subscriptions to get reminders before they're due.</div>
            ) : sortedBills.map(bill => {
                const cat = categories.find(c => c.id === bill.categoryId);
                const look = spCategoryLook(cat, categories.indexOf(cat));
                const diff = spDaysFrom(today, bill.nextDueDate);
                const remind = Number(bill.reminderDaysBefore) || 0;
                const dueText = !bill.isActive ? 'Paused' : diff < 0 ? 'Overdue · was due ' + spDueDate(bill.nextDueDate) : diff === 0 ? 'Due today' : diff === 1 ? 'Due tomorrow' : 'Due ' + spDueDate(bill.nextDueDate);
                const metaColor = !bill.isActive ? 'var(--sp-slate-400)' : diff <= 0 ? '#e11d48' : remind > 0 && diff <= remind ? '#d97706' : 'var(--sp-slate-400)';
                const isOpen = openId === bill.id;
                const conflict = syncConflicts[String(bill.id)];
                const cfOpen = showConflictDetail === bill.id;
                return (
                    <div key={bill.id} className="sp-schedcard">
                        <button type="button" className="sp-schedrow" style={{opacity: bill.isActive ? 1 : 0.6}} onClick={() => { setOpenId(isOpen ? null : bill.id); setPendingDelete(null); }}>
                            <span className="sp-schedicon" style={{background: look.tint, color: look.ink}}><i className={look.icon}></i></span>
                            <span className="sp-schedmain">
                                <span className="sp-schedtitle">
                                    <span>{bill.name}</span>
                                    {conflict && <span role="button" className={'sp-cfbtn' + (cfOpen ? ' is-open' : '')} title="Sync conflict · tap to compare" onClick={(e) => { e.stopPropagation(); setShowConflictDetail(cfOpen ? null : bill.id); }}><i className="fas fa-code-compare"></i></span>}
                                    {!bill.isActive && <span className="sp-kindtag is-paused">PAUSED</span>}
                                </span>
                                <span className="sp-schedmeta" style={{color: metaColor}}>
                                    {activeView.length > 1 && spOwnerChip(bill.person, people)}
                                    <span>{dueText} · {bill.frequency}</span>
                                </span>
                                {bill.isActive && remind > 0 && <span className="sp-schedremind"><i className="fas fa-bell"></i>{remind}d before</span>}
                            </span>
                            <span className="sp-schedright">
                                <span className="sp-schedamt">{fmtCurrency(bill.amount, bill.currency)}</span>
                                {cat && <span className="sp-schedsub">{cat.name}</span>}
                            </span>
                        </button>
                        {cfOpen && conflictBill && conflictSnapshot && (
                            <div style={{padding: '0 15px 12px'}}>
                                <ConflictCompare localRecord={conflictBill} cloudSnapshot={conflictSnapshot.cloudSnapshot} detectedAt={conflictSnapshot.detectedAt} fieldLabels={billConflictFieldLabels} formatValue={formatBillConflictValue} onKeepLocal={() => handleResolveConflict(false)} onUseCloud={() => handleResolveConflict(true)} />
                            </div>
                        )}
                        {isOpen && (
                            <div className="sp-schedopen">
                                {bill.notes && <div className="sp-schednote">{bill.notes}</div>}
                                <SpActBar actions={[
                                    bill.isActive && { key: 'paid', label: 'Mark paid', icon: 'fas fa-check', tone: 'green', onClick: () => setPayBill(bill) },
                                    { key: 'edit', label: 'Edit', icon: 'fas fa-pen', tone: 'slate', onClick: () => setFormBill(bill) },
                                    bill.isActive
                                        ? { key: 'pause', label: 'Pause', icon: 'fas fa-pause', tone: 'amber', onClick: () => setActive(bill, false) }
                                        : { key: 'resume', label: 'Resume', icon: 'fas fa-play', tone: 'blue', onClick: () => setActive(bill, true) },
                                    { key: 'delete', label: 'Delete', icon: 'fas fa-trash', tone: 'rose', onClick: () => setPendingDelete(bill.id) }
                                ]} />
                                {pendingDelete === bill.id && (
                                    <div style={{padding: '4px 4px 2px'}}>
                                        <InlineConfirm text={'Delete ' + bill.name + '? Past expenses already logged from this bill stay in Expenses.'} keepLabel="Cancel" cta="Delete bill" onKeep={() => setPendingDelete(null)} onConfirm={() => handleDelete(bill.id)} />
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                );
            })}
            {!formBill && !payBill && <PinnedCta label="Add Bill" icon="fas fa-plus" onClick={() => setFormBill('new')} aboveDock />}
            {formBill && <BillFormSheet bill={formBill === 'new' ? null : formBill} categories={categories} activeView={activeView} onClose={() => setFormBill(null)} onSaved={(msg) => { setFormBill(null); afterChange(msg); }} />}
            {payBill && <BillPaySheet bill={payBill} categories={categories} onClose={() => setPayBill(null)} onPaid={(msg) => { setPayBill(null); setOpenId(null); afterChange(msg); }} />}
        </div>
    );
}

const SP_SCHED_KIND = {
    expense: { label: 'EXPENSE', bg: '#fee2e2', ink: '#e11d48', word: 'Expenses', name: 'Expense' },
    income: { label: 'INCOME', bg: '#dcfce7', ink: '#16a34a', word: 'Income', name: 'Income' },
    asset: { label: 'INVESTMENT', bg: '#ede9fe', ink: '#7c3aed', word: 'Net Worth', name: 'Investment' },
    liability: { label: 'LIABILITY', bg: '#fef3c7', ink: '#b45309', word: 'Net Worth', name: 'Liability' }
};
const spFreqWord = (f) => f ? f.charAt(0).toUpperCase() + f.slice(1) : '';
const spScheduleName = (s) => { const t = s.templateExpense || {}; return (s.type === 'asset' || s.type === 'liability') ? (t.netWorthItemName || '—') : (t.description || t.source || '—'); };
// How a repeat is paid, read from its template (display only): the expense's card/account or
// cash, the account income lands in, or where an asset top-up is taken from.
const spSchedulePay = (s, accountNameById) => {
    const t = s.templateExpense || {};
    const acc = (id) => (accountNameById && accountNameById.get(String(id))) || 'an account';
    if (s.type === 'expense') return t.isCashPayment ? { icon: 'fas fa-money-bill-wave', label: 'Paid in cash' } : t.accountId ? { icon: 'fas fa-credit-card', label: 'Card · ' + acc(t.accountId) } : { icon: 'fas fa-link-slash', label: 'No account linked' };
    if (s.type === 'income') return t.accountId ? { icon: 'fas fa-building-columns', label: 'Into ' + acc(t.accountId) } : { icon: 'fas fa-money-bill-wave', label: 'Received as cash' };
    if (s.type === 'asset') return DataService.isCashFundingRef(t.accountId) ? { icon: 'fas fa-money-bill-wave', label: 'From cash in hand' } : t.accountId ? { icon: 'fas fa-building-columns', label: 'From ' + acc(t.accountId) } : { icon: 'fas fa-arrow-right-to-bracket', label: 'External funds' };
    return null;
};

// Payment choices for a repeat, matching what its add form offers: an expense can use any of
// the payer's accounts, cash, or no account; income lands in one of the earner's accounts or
// as cash; an asset top-up comes from an account, cash in hand or external funds.
// Each choice carries the templateExpense fields it writes. Only future entries use a change.
const spSchedulePayChoices = (schedule) => {
    const t = schedule.templateExpense || {};
    const accts = DataService.getBankAccounts();
    const named = (a) => a.accountName + (a.isPrimary ? ' (primary)' : '') + ' · ' + a.currency;
    if (schedule.type === 'expense') {
        const mine = DataService.getAccountsForPerson((t.paidBy || '').trim() || 'own');
        const opts = [...mine.map(a => ({ value: 'acct:' + a.id, label: 'Card / bank · ' + named(a), patch: { accountId: a.id, isCashPayment: false } })),
            { value: 'cash', label: 'Cash', patch: { accountId: '', isCashPayment: true } },
            { value: 'none', label: 'Not linked to an account', patch: { accountId: '', isCashPayment: false } }];
        return { label: 'Paid from', opts, current: t.isCashPayment ? 'cash' : t.accountId ? 'acct:' + t.accountId : 'none' };
    }
    if (schedule.type === 'income') {
        const mine = DataService.getAccountsForPerson((t.paidBy || '').trim() || 'own');
        const opts = [...mine.map(a => ({ value: 'acct:' + a.id, label: named(a), patch: { accountId: a.id } })),
            { value: 'cash', label: 'Cash (no account)', patch: { accountId: '' } }];
        return { label: 'Paid into', opts, current: t.accountId ? 'acct:' + t.accountId : 'cash' };
    }
    if (schedule.type === 'asset') {
        const opts = spNwPayOptions(accts, t.currency || 'GBP', t.person || 'own').map(o => ({ ...o, patch: { accountId: spNwPayResolve(o.value, accts).accountId } }));
        return { label: 'Pay each time from', opts, current: DataService.isCashFundingRef(t.accountId) ? t.accountId : t.accountId ? String(t.accountId) : '' };
    }
    return null;
};

function RecurringEditSheet({ schedule, onClose, onSaved }) {
    const t = schedule.templateExpense || {};
    const kind = SP_SCHED_KIND[schedule.type] || SP_SCHED_KIND.expense;
    const payChoices = useMemo(() => {
        const c = spSchedulePayChoices(schedule);
        // A saved account that has since been deleted still shows, so nothing changes silently.
        if (c && !c.opts.some(o => o.value === c.current)) c.opts.unshift({ value: c.current, label: 'Current account (no longer available)', patch: {} });
        return c;
    }, [schedule]);
    const [f, setF] = useState({ amount: String(t.amount || ''), frequency: schedule.frequency, endDate: schedule.endDate || '', nextDue: schedule.nextDue, pay: payChoices ? payChoices.current : '' });
    const [endMode, setEndMode] = useState(schedule.endDate ? 'date' : 'never');
    const [errors, setErrors] = useState({});
    const set = (k, v) => setF(p => ({ ...p, [k]: v }));
    const save = () => {
        const amount = parseFloat(f.amount);
        if (!f.amount || isNaN(amount) || amount <= 0) { setErrors({ amount: 'Amount must be greater than 0' }); return; }
        if (!f.nextDue) { setErrors({ nextDue: 'Next payment date is required' }); return; }
        DataService.updateRecurring(schedule.id, {
            templateExpense: { ...schedule.templateExpense, amount, ...(payChoices && f.pay !== payChoices.current ? ((payChoices.opts.find(o => o.value === f.pay) || {}).patch || {}) : {}) },
            frequency: f.frequency,
            endDate: endMode === 'date' ? (f.endDate || '') : '',
            nextDue: f.nextDue
        });
        onSaved(spScheduleName(schedule) + ' updated');
    };
    const upcoming = f.nextDue ? [1, 2, 3].reduce((acc) => { acc.push(computeNextDue(acc[acc.length - 1], f.frequency)); return acc; }, [f.nextDue]).slice(1) : [];
    const endDate = endMode === 'date' ? f.endDate : '';
    const shownUpcoming = upcoming.filter(d => !endDate || d <= endDate);
    const err = errors.amount || errors.nextDue;
    return (
        <Sheet onClose={onClose} footer={<React.Fragment>
            <button type="button" className="sp-btn sp-btn-cancel" onClick={onClose}>Cancel</button>
            <button type="button" className="sp-btn sp-btn-primary sp-btn-grow" onClick={save}><i className="fas fa-check"></i>Save changes</button>
        </React.Fragment>}>
            <SpSheetHead icon="fas fa-rotate" tint="#ede9fe" ink="#7c3aed" title="Edit recurring" sub={spScheduleName(schedule) + ' · ' + kind.name} />
            {err && <div className="sp-alert sp-alert-err"><i className="fas fa-circle-exclamation"></i><span>{err}</span></div>}
            <div className="sp-formcard" style={{marginTop: 0}}>
                <div className={'sp-formrow' + (errors.amount ? ' is-bad' : '')}>
                    <span>Amount</span>
                    <span className="sp-moneyin"><span>{ValidationUtils.getCurrencySymbol(t.currency || 'GBP')}</span><input type="number" step="0.01" inputMode="decimal" value={f.amount} onChange={e => set('amount', e.target.value)} /></span>
                </div>
                <div className={'sp-formrow' + (errors.nextDue ? ' is-bad' : '')}><span>Next processing date</span><input type="date" value={f.nextDue} onChange={e => set('nextDue', e.target.value)} /></div>
                {payChoices && (
                    <div className="sp-formblock">
                        <div className="sp-formblock-label">{payChoices.label}</div>
                        <select className="sp-fullselect" value={f.pay} onChange={e => set('pay', e.target.value)}>
                            {payChoices.opts.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                        </select>
                        {f.pay !== payChoices.current && <div className="sp-hint" style={{fontSize: '11px', marginTop: '6px'}}>Applies to entries created from now on. Ones already logged keep their original {schedule.type === 'income' ? 'account' : 'payment method'}.</div>}
                    </div>
                )}
            </div>
            <div className="sp-panel">
                <div className="sp-panel-label">Repeat every</div>
                <div className="sp-seg is-light">
                    {['daily', 'weekly', 'monthly', 'quarterly', 'yearly'].map(q => <button key={q} type="button" className={f.frequency === q ? 'is-active' : ''} onClick={() => set('frequency', q)}>{q === 'quarterly' ? 'Quarter' : spFreqWord(q)}</button>)}
                </div>
                <div className="sp-panel-label" style={{margin: '14px 0 8px'}}>Ends</div>
                <div className="sp-endtabs">
                    <button type="button" className={'sp-endtab' + (endMode === 'never' ? ' is-active' : '')} onClick={() => setEndMode('never')}>Never</button>
                    <button type="button" className={'sp-endtab' + (endMode === 'date' ? ' is-active' : '')} onClick={() => setEndMode('date')}>On a date</button>
                </div>
                {endMode === 'date' && (
                    <div className="sp-formrow" style={{borderTop: '1px solid #f1f5f9', marginTop: '8px'}}>
                        <span>End date</span>
                        <input type="date" value={f.endDate} min={f.nextDue} onChange={e => set('endDate', e.target.value)} />
                    </div>
                )}
                {f.nextDue && (
                    <div className="sp-infobox">
                        <div className="sp-infobox-row">
                            <span className="sp-infobox-icon"><i className="fas fa-calendar-check"></i></span>
                            <div><div className="sp-infobox-kicker">Next processing</div><div className="sp-infobox-value">{DateUtils.parseDateStr(f.nextDue).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }).replace(/\bSept\b/, 'Sep')}</div></div>
                        </div>
                        {shownUpcoming.length > 0 && <div className="sp-infobox-dates">{shownUpcoming.map(d => <span key={d}>{spShortDate(d)}</span>)}</div>}
                        <div className="sp-infobox-foot">Repeats {f.frequency} from {spShortDate(f.nextDue)} · {endDate ? 'until ' + spLongDate(endDate) : 'no end date'}</div>
                    </div>
                )}
                {f.nextDue !== schedule.nextDue
                    ? <div className="sp-alert sp-alert-warn" style={{margin: '10px 0 0'}}><i className="fas fa-triangle-exclamation"></i><span>The next payment date moves to {spLongDate(f.nextDue) || '—'}. Nothing is recorded until then.</span></div>
                    : <div className="sp-hint" style={{margin: '10px 2px 0', fontSize: '11px'}}>A frequency change takes effect from the following cycle, not this one.</div>}
            </div>
        </Sheet>
    );
}

function RecurringList({ onUpdate, activeView, embedded }) {
    const [schedules, setSchedules] = useState(() => DataService.getRecurring());
    const [openId, setOpenId] = useState(null);
    const [pendingDelete, setPendingDelete] = useState(null);
    const [editSchedule, setEditSchedule] = useState(null);
    const [toast, setToast] = useState('');
    const _f0 = FilterMemory.load('recurring');
    const [filterSyncConflict, setFilterSyncConflict] = useState(!!_f0.syncConflict);
    const [showConflictDetail, setShowConflictDetail] = useState(null);
    const people = DataService.getPeople();

    const load = () => setSchedules(DataService.getRecurring());
    useEffect(() => { FilterMemory.save('recurring', { syncConflict: filterSyncConflict }); }, [filterSyncConflict]);
    useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(''), 4000); return () => clearTimeout(t); }, [toast]);

    const syncConflicts = useMemo(() => SyncConflicts.read('recurring'), [schedules]);
    const accountNameById = useMemo(() => {
        const m = new Map();
        DataService.getBankAccounts().forEach(a => m.set(String(a.id), a.accountName));
        return m;
    }, [schedules]);
    // templateExpense is a nested object, so the generic diff would show it as one opaque
    // "differs" row — flatten it into dotted keys so the compare panel reads naturally.
    const flattenScheduleForDiff = (s) => {
        if (!s) return {};
        const t = s.templateExpense || {};
        return {
            type: s.type, frequency: s.frequency, endDate: s.endDate, nextDue: s.nextDue, lastGenerated: s.lastGenerated, isActive: s.isActive,
            'templateExpense.amount': t.amount, 'templateExpense.description': t.description, 'templateExpense.source': t.source,
            'templateExpense.paidBy': t.paidBy, 'templateExpense.person': t.person, 'templateExpense.currency': t.currency,
            'templateExpense.accountId': t.accountId, 'templateExpense.netWorthItemName': t.netWorthItemName
        };
    };

    const today = DateUtils.today();
    const isNetWorthType = (type) => type === 'asset' || type === 'liability';
    const visibleSchedules = schedules.filter(s => spScheduleVisible(s, activeView));
    // Soonest next payment first; paused ones after the running ones, ended ones last.
    const scheduleRank = (s) => spScheduleEnded(s, today) ? 2 : s.isActive ? 0 : 1;
    const displaySchedules = (filterSyncConflict ? visibleSchedules.filter(s => !!syncConflicts[String(s.id)]) : visibleSchedules)
        .slice().sort((a, b) => scheduleRank(a) - scheduleRank(b) || (a.nextDue || '').localeCompare(b.nextDue || ''));

    const afterChange = (msg) => { load(); if (msg) setToast(msg); if (onUpdate) onUpdate(); };
    const handlePauseResume = (s) => {
        if (s.isActive) DataService.pauseRecurring(s.id);
        else DataService.resumeRecurring(s.id);
        afterChange(spScheduleName(s) + (s.isActive ? ' paused' : ' resumed'));
    };
    const handleDelete = (s) => { DataService.deleteRecurring(s.id); setPendingDelete(null); setOpenId(null); afterChange(spScheduleName(s) + ' stopped repeating'); };

    const conflictSchedule = showConflictDetail ? schedules.find(s => s.id === showConflictDetail) : null;
    const conflictSnapshot = showConflictDetail ? syncConflicts[String(showConflictDetail)] : null;
    const recurringConflictFieldLabels = { type: 'Type', frequency: 'Frequency', endDate: 'End Date', nextDue: 'Next Due', lastGenerated: 'Last Generated', isActive: 'Active', 'templateExpense.amount': 'Amount', 'templateExpense.description': 'Description', 'templateExpense.source': 'Source', 'templateExpense.paidBy': 'Paid By', 'templateExpense.person': 'Person', 'templateExpense.currency': 'Currency', 'templateExpense.accountId': 'Account', 'templateExpense.netWorthItemName': 'Item Name' };
    const formatRecurringConflictValue = (key, value) => {
        if (key === 'templateExpense.accountId') return value ? (accountNameById.get(String(value)) || String(value)) : '—';
        if (typeof value === 'boolean') return value ? 'Yes' : 'No';
        return value === undefined || value === null || value === '' ? '—' : String(value);
    };
    const handleResolveConflict = async (useCloud) => {
        const scheduleId = showConflictDetail;
        const updates = useCloud && conflictSnapshot ? conflictSnapshot.cloudSnapshot : {};
        DataService.updateRecurring(scheduleId, updates);
        SyncConflicts.dismiss('recurring', scheduleId);
        setShowConflictDetail(null);
        afterChange();
    };

    return (
        <div className={embedded ? undefined : 'sp-page'}>
            <div className="sp-alert sp-alert-info" style={{fontWeight: 600}}><i className="fas fa-circle-info"></i><span>Created by ticking <strong>Repeat</strong> when adding a transaction, or a repeat on a Net Worth item.</span></div>
            {toast && <div className="sp-alert sp-alert-ok"><i className="fas fa-circle-check"></i><span>{toast}</span></div>}
            {Object.keys(syncConflicts).length > 0 && (
                <label className="sp-check" style={{margin: '0 4px 10px'}}>
                    <input type="checkbox" checked={filterSyncConflict} onChange={(e) => setFilterSyncConflict(e.target.checked)} />
                    <i className="fas fa-code-compare" style={{color: '#4f46e5'}}></i>Sync conflicts only
                </label>
            )}
            {visibleSchedules.length === 0 ? (
                <div className="sp-empty"><i className="fas fa-rotate"></i>No repeating transactions yet.</div>
            ) : displaySchedules.map(s => {
                const t = s.templateExpense || {};
                const kind = SP_SCHED_KIND[s.type] || SP_SCHED_KIND.expense;
                const ended = spScheduleEnded(s, today);
                const paused = !ended && !s.isActive;
                const netWorth = isNetWorthType(s.type);
                const pay = spSchedulePay(s, accountNameById);
                const isOpen = openId === s.id;
                const conflict = syncConflicts[String(s.id)];
                const cfOpen = showConflictDetail === s.id;
                const owner = netWorth ? t.person : ((t.paidBy || '').trim() ? t.paidBy : 'own');
                const endLabel = ended ? 'Ended ' + spLongDate(s.endDate) : s.endDate ? 'Ends ' + spLongDate(s.endDate) : 'No end date';
                return (
                    <div key={s.id} className="sp-schedcard">
                        <button type="button" className="sp-schedrow" style={{opacity: ended || paused ? 0.6 : 1}} onClick={() => { setOpenId(isOpen ? null : s.id); setPendingDelete(null); }}>
                            <span className="sp-schedicon" style={{background: '#ede9fe', color: '#7c3aed'}}><i className="fas fa-rotate"></i></span>
                            <span className="sp-schedmain">
                                <span className="sp-schedtitle">
                                    <span>{spScheduleName(s)}</span>
                                    <span className="sp-kindtag" style={{background: kind.bg, color: kind.ink}}>{kind.label}</span>
                                    {conflict && <span role="button" className={'sp-cfbtn' + (cfOpen ? ' is-open' : '')} title="Sync conflict · tap to compare" onClick={(e) => { e.stopPropagation(); setShowConflictDetail(cfOpen ? null : s.id); }}><i className="fas fa-code-compare"></i></span>}
                                    {paused && <span className="sp-kindtag is-paused">PAUSED</span>}
                                </span>
                                <span className="sp-schedmeta">
                                    {activeView.length > 1 && spOwnerChip(owner, people)}
                                    <span>{paused ? 'Paused · ' + spFreqWord(s.frequency) : ended ? spFreqWord(s.frequency) : spFreqWord(s.frequency) + ' · next ' + spDueDate(s.nextDue)}</span>
                                </span>
                                {pay && <span className="sp-schedpay"><i className={pay.icon}></i>{pay.label}</span>}
                                <span className="sp-schedend" style={{color: s.endDate && !ended ? '#d97706' : 'var(--sp-slate-400)'}}>{endLabel}</span>
                            </span>
                            <span className="sp-schedright"><span className="sp-schedamt">{netWorth ? '+' : ''}{ValidationUtils.formatCurrency(t.amount || 0, t.currency || 'GBP')}</span></span>
                        </button>
                        {cfOpen && conflictSchedule && conflictSnapshot && (
                            <div style={{padding: '0 15px 12px'}}>
                                <ConflictCompare localRecord={flattenScheduleForDiff(conflictSchedule)} cloudSnapshot={flattenScheduleForDiff(conflictSnapshot.cloudSnapshot)} detectedAt={conflictSnapshot.detectedAt} fieldLabels={recurringConflictFieldLabels} formatValue={formatRecurringConflictValue} onKeepLocal={() => handleResolveConflict(false)} onUseCloud={() => handleResolveConflict(true)} />
                            </div>
                        )}
                        {isOpen && (
                            <div className="sp-schedopen">
                                {s.lastGenerated && <div className="sp-schednote">Last run {spLongDate(s.lastGenerated)}</div>}
                                <SpActBar actions={[
                                    { key: 'edit', label: 'Edit', icon: 'fas fa-pen', tone: 'slate', onClick: () => setEditSchedule(s) },
                                    !ended && (s.isActive
                                        ? { key: 'pause', label: 'Pause', icon: 'fas fa-pause', tone: 'amber', onClick: () => handlePauseResume(s) }
                                        : { key: 'resume', label: 'Resume', icon: 'fas fa-play', tone: 'blue', onClick: () => handlePauseResume(s) }),
                                    { key: 'delete', label: 'Delete', icon: 'fas fa-trash', tone: 'rose', onClick: () => setPendingDelete(s.id) }
                                ]} />
                                {pendingDelete === s.id && (
                                    <div style={{padding: '4px 4px 2px'}}>
                                        <InlineConfirm text={'Stop repeating ' + spScheduleName(s) + '? Entries already logged stay in ' + kind.word + '.'} keepLabel="Cancel" cta="Delete" onKeep={() => setPendingDelete(null)} onConfirm={() => handleDelete(s)} />
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                );
            })}
            {editSchedule && <RecurringEditSheet schedule={editSchedule} onClose={() => setEditSchedule(null)} onSaved={(msg) => { setEditSchedule(null); afterChange(msg); }} />}
        </div>
    );
}

const AuthUtils = {
    get firebaseReady() { return !!window.__firebaseReady; },
    PBKDF2_ITERATIONS: 210000,
    _bytesToB64(bytes) { return btoa(String.fromCharCode(...bytes)); },
    _b64ToBytes(b64) { return Uint8Array.from(atob(b64), c => c.charCodeAt(0)); },
    async _pbkdf2(password, saltBytes, iterations) {
        const keyMaterial = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), { name: 'PBKDF2' }, false, ['deriveBits']);
        const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: saltBytes, iterations, hash: 'SHA-256' }, keyMaterial, 256);
        return this._bytesToB64(new Uint8Array(bits));
    },
    // Salted, iterated PBKDF2-SHA256. Format: pbkdf2$<iterations>$<saltB64>$<hashB64> —
    // self-describing so verifyPassword() can still check hashes from before this scheme
    // (a bare 64-char SHA-256 hex digest, unsalted/unstretched) without forcing every
    // existing local account to reset their password.
    async hashPassword(password) {
        const saltBytes = crypto.getRandomValues(new Uint8Array(16));
        const hash = await this._pbkdf2(password, saltBytes, this.PBKDF2_ITERATIONS);
        return `pbkdf2$${this.PBKDF2_ITERATIONS}$${this._bytesToB64(saltBytes)}$${hash}`;
    },
    isLegacyHash(hash) { return !!hash && !hash.startsWith('pbkdf2$'); },
    async verifyPassword(password, hash) {
        if (!hash) return false;
        if (this.isLegacyHash(hash)) {
            // Pre-upgrade format: bare unsalted SHA-256 hex digest.
            const data = new TextEncoder().encode(password);
            const buf = await crypto.subtle.digest('SHA-256', data);
            const legacyHash = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
            return legacyHash === hash;
        }
        const parts = hash.split('$');
        if (parts.length !== 4 || parts[0] !== 'pbkdf2') return false;
        const iterations = parseInt(parts[1], 10);
        const saltBytes = this._b64ToBytes(parts[2]);
        const computed = await this._pbkdf2(password, saltBytes, iterations);
        return computed === parts[3];
    },
    async register(email, password, displayName) {
        const cred = await window.__firebaseAuth.createUserWithEmailAndPassword(email, password);
        await cred.user.updateProfile({ displayName });
        await window.__firebaseDb.collection('users').doc(cred.user.uid).set({
            displayName,
            storagePreference: 'local',
            createdAt: new Date().toISOString()
        });
        return cred.user;
    },
    async signIn(email, password) {
        const cred = await window.__firebaseAuth.signInWithEmailAndPassword(email, password);
        return cred.user;
    },
    async signOut() {
        if (window.__firebaseReady) await window.__firebaseAuth.signOut();
        localStorage.removeItem('financeApp_session_expiry');
        sessionStorage.removeItem('financeApp_session_active');
    },
    async sendPasswordReset(email) {
        await window.__firebaseAuth.sendPasswordResetEmail(email);
    },
    // Deliberately does NOT touch storagePreference/financeApp_currentUser here — that used
    // to be duplicated in every sign-in method AND in App's onAuthStateChanged listener
    // (which fires for every one of these anyway), and the two independent Firestore
    // reads racing against each other could let onAuthStateChanged's read "win" with a
    // stale/incomplete result, incorrectly showing the storage picker to a returning user.
    // onAuthStateChanged is now the single place that resolves the saved preference.
    async signInWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.addScope('email');
        const cred = await window.__firebaseAuth.signInWithPopup(provider);
        return cred.user;
    },
    async signInWithFacebook() {
        const provider = new firebase.auth.FacebookAuthProvider();
        provider.addScope('email');
        const cred = await window.__firebaseAuth.signInWithPopup(provider);
        return cred.user;
    },
    async linkSocialCredential(email, password, pendingCredential) {
        const cred = await window.__firebaseAuth.signInWithEmailAndPassword(email, password);
        await cred.user.linkWithCredential(pendingCredential);
        return cred.user;
    },
    mapFirebaseError(code) {
        const map = {
            'auth/email-already-in-use': { field: 'email', message: 'An account with this email already exists. Please sign in instead.' },
            'auth/invalid-email': { field: 'email', message: 'Please enter a valid email address.' },
            'auth/weak-password': { field: 'password', message: 'Password must be at least 6 characters.' },
            'auth/user-not-found': null,
            'auth/wrong-password': { field: null, message: 'Incorrect email or password.' },
            'auth/invalid-credential': { field: null, message: 'Incorrect email or password.' },
            'auth/too-many-requests': { field: null, message: 'Too many failed attempts. Please try again later.' },
            'auth/requires-recent-login': { field: null, message: 'Please sign out and sign in again before changing your password.' },
            'auth/account-exists-with-different-credential': { field: null, message: 'An account already exists with this email. Enter your password to link the accounts.' },
            'auth/popup-closed-by-user': null,
            'auth/cancelled-popup-request': null,
            'auth/popup-blocked': { field: null, message: 'Sign-in popup was blocked. Please allow popups for this site and try again.' },
            'auth/unauthorized-domain': { field: null, message: 'This domain is not authorised for sign-in. Please add it to Firebase Console → Authentication → Settings → Authorised domains.' },
            'auth/operation-not-allowed': { field: null, message: 'This sign-in method is not enabled. Please enable it in Firebase Console → Authentication → Sign-in method.' },
            'auth/network-request-failed': { field: null, message: 'Network error. Please check your connection and try again.' },
            'auth/internal-error': { field: null, message: 'An internal error occurred. Please try again.' },
            'auth/user-disabled': { field: null, message: 'This account has been disabled. Please contact support.' }
        };
        return map.hasOwnProperty(code) ? map[code] : { field: null, message: `Sign-in failed (${code || 'unknown error'}). Please try again.` };
    }
};

function StoragePickerModal({ currentUser, initialPreference, onConfirm, onSkip }) {
    const providers = [
        { id: 'gdrive',   icon: 'fab fa-google-drive', label: 'Google Drive', color: '#4285F4', bgColor: '#e8f0fe', sub: 'Save to Google Drive' },
        { id: 'onedrive', icon: 'fab fa-microsoft',    label: 'OneDrive',     color: '#0078D4', bgColor: '#e6f2fb', sub: 'Save to OneDrive' },
        { id: 'local',    icon: 'fas fa-mobile-alt',   label: 'Local only',   color: '#6c757d', bgColor: '#f0f0f0', sub: 'This device only' }
    ];
    const [selected, setSelected] = React.useState(initialPreference || null);
    const [saving, setSaving] = React.useState(false);
    const [oauthStep, setOauthStep] = React.useState(null); // null | 'connecting' | 'downloading' | 'done' | 'error'

    const handleConfirm = async () => {
        if (!selected || saving) return;
        setSaving(true);
        setOauthStep(null);

        // OAuth FIRST while user gesture is still fresh (required for popup)
        let cloudBackup = null;
        let svc = null;
        if (selected === 'gdrive' || selected === 'onedrive') {
            svc = selected === 'gdrive' ? GDriveService : OneDriveService;
            if (svc.isConfigured()) {
                try {
                    setOauthStep('connecting');
                    await svc.requestToken();
                    setOauthStep('downloading');
                    cloudBackup = await svc.download();
                } catch (_) {
                    setOauthStep('error');
                    setSaving(false);
                    return; // Connection/download failed — abort before touching the committed preference
                }
            }
        }

        // If the chosen provider has no backup file yet, we're about to become its only copy
        // of this data — the upload must actually succeed before we commit the switch. Otherwise
        // financeApp_storagePreference would point at a provider with nothing backed up, and the
        // app would show "cloud protected" while silently having no cloud copy at all.
        if (svc && svc.isConfigured() && !cloudBackup) {
            try {
                setOauthStep('uploading');
                const signed = await signBackupForUpload(DataService.createBackup(currentUser), currentUser);
                await svc.upload(signed);
                localStorage.setItem('financeApp_lastCloudSync', new Date().toISOString());
            } catch (_) {
                setOauthStep('error');
                setSaving(false);
                return; // Upload failed — keep the previous provider active, don't commit the switch
            }
        }

        if (window.__firebaseReady && currentUser && currentUser.uid) {
            // set(..., {merge:true}) instead of update() — update() throws "no document to
            // update" and silently no-ops (caught below) if the per-user Firestore doc hasn't
            // been created yet at this exact moment, which meant the choice only ever landed
            // in localStorage and never reached Firestore: it looked like it "worked" for as
            // long as the browser kept that localStorage around, then vanished the moment the
            // user logged out (which wipes it) and reappeared on next login with nothing saved
            // server-side to restore. set+merge creates the doc if missing, so this can't fail
            // that way.
            try {
                await window.__firebaseDb.collection('users').doc(currentUser.uid).set({ storagePreference: selected, pickerConfirmed: true }, { merge: true });
                console.log('[BackupPref] wrote to Firestore OK', { uid: currentUser.uid, selected });
            } catch (err) {
                console.error('[BackupPref] Firestore write FAILED', { uid: currentUser.uid, selected, err });
            }
        }
        localStorage.setItem('financeApp_storagePreference', selected);
        localStorage.setItem('financeApp_storagePickerConfirmed', 'true');
        localStorage.removeItem('financeApp_storagePickerSkipCount');
        setOauthStep('done');
        setSaving(false);
        onConfirm(selected, cloudBackup);
    };

    const isCloud = selected === 'gdrive' || selected === 'onedrive';

    const provLabel = selected === 'gdrive' ? 'Google Drive' : 'OneDrive';
    const stepText = {
        connecting: 'Connecting to ' + provLabel + '…',
        downloading: 'Checking for existing backup…',
        uploading: 'Saving your first backup to ' + provLabel + '…',
        done: 'Connected! Proceeding…',
        error: "Couldn't back up to " + provLabel + " — nothing has changed, you're still on your previous storage. Please try again."
    };
    const busyLabel = oauthStep === 'connecting' ? 'Connecting…' : oauthStep === 'downloading' ? 'Checking backup…' : oauthStep === 'uploading' ? 'Backing up…' : 'Saving…';

    return (
        <AuthShell icon="fas fa-cloud-arrow-up" title="Where should your backup live?" tagline="Choose where your financial data is backed up. You can change this later in Settings."
            footer={onSkip ? (
                <div className="sp-auth-foot">
                    <button type="button" className="sp-auth-foot-link" onClick={onSkip} disabled={saving}>Maybe later — <strong>remind me next time</strong></button>
                </div>
            ) : null}>
            <div className="sp-label">Storage</div>
            <div className="sp-options">
                {providers.map(p => {
                    const on = selected === p.id;
                    return (
                        <button key={p.id} type="button" className="sp-option" disabled={saving && !on}
                            onClick={() => { if (!saving) { setSelected(p.id); setOauthStep(null); } }}>
                            <span className="sp-option-tile" style={{background: p.bgColor, color: p.color}}><i className={p.icon}></i></span>
                            <div>
                                <div className="sp-option-label">{p.label}</div>
                                <div className="sp-option-sub">{p.sub}</div>
                            </div>
                            <i className={'sp-option-check ' + (on ? 'fas fa-circle-check' : 'far fa-circle')} style={{color: on ? '#10b981' : '#cbd5e1'}}></i>
                        </button>
                    );
                })}
            </div>
            {selected === 'local' && (
                <div className="sp-alert sp-alert-warn"><i className="fas fa-triangle-exclamation"></i><span>Your data is only available on this device. If you log in elsewhere, you'll see an empty app unless you import a backup.</span></div>
            )}
            {isCloud && !oauthStep && (
                <div className="sp-alert sp-alert-info"><i className="fas fa-circle-info"></i><span>Your backup will be saved to <strong>FinanceTracker Backups</strong> in your {provLabel}. Only you can access it.</span></div>
            )}
            {isCloud && oauthStep && (
                <div className={'sp-alert ' + (oauthStep === 'error' ? 'sp-alert-warn' : oauthStep === 'done' ? 'sp-alert-ok' : 'sp-alert-info')}>
                    <i className={oauthStep === 'error' ? 'fas fa-triangle-exclamation' : oauthStep === 'done' ? 'fas fa-circle-check' : 'fas fa-circle-notch fa-spin'}></i>
                    <span>{stepText[oauthStep]}</span>
                </div>
            )}
            <button type="button" className="sp-btn sp-btn-primary" onClick={handleConfirm} disabled={!selected || saving}>
                {saving ? <><i className="fas fa-spinner fa-spin"></i>{busyLabel}</> : <><i className="fas fa-check"></i>Confirm</>}
            </button>
        </AuthShell>
    );
}

function RegistrationScreen({ onRegister, onLogin }) {
    const [activeTab, setActiveTab] = useState('signin');
    const [formData, setFormData] = useState({ displayName: '', email: '', password: '', confirmPassword: '' });
    const [errors, setErrors] = useState({});
    const [isSubmitting, setIsSubmitting] = useState(false);
    const [showPassword, setShowPassword] = useState(false);
    const [showConfirm, setShowConfirm] = useState(false);
    const [socialLoading, setSocialLoading] = useState(null);
    const [socialError, setSocialError] = useState('');
    const [linkModal, setLinkModal] = useState(null);
    const [linkPw, setLinkPw] = useState('');
    const [linkShowPw, setLinkShowPw] = useState(false);
    const [linkError, setLinkError] = useState('');
    const [linkLoading, setLinkLoading] = useState(false);
    const [signEmail, setSignEmail] = useState('');
    const [signPw, setSignPw] = useState('');
    const [signShowPw, setSignShowPw] = useState(false);
    const [signRemember, setSignRemember] = useState(false);
    const [signLockUntil] = useState(() => { const v = parseInt(localStorage.getItem('financeApp_failLockUntil') || '0'); return v > Date.now() ? v : 0; });
    const [failCount, setFailCount] = useState(() => parseInt(localStorage.getItem('financeApp_failCount') || '0'));
    const [signError, setSignError] = useState(() => { const until = parseInt(localStorage.getItem('financeApp_failLockUntil') || '0'); return until > Date.now() ? 'Too many failed attempts. Please try again in 15 minutes.' : ''; });
    const [lockedOut, setLockedOut] = useState(() => { const v = parseInt(localStorage.getItem('financeApp_failLockUntil') || '0'); return v > Date.now(); });
    const [showForgot, setShowForgot] = useState(false);
    const [forgotEmail, setForgotEmail] = useState('');
    const [forgotSent, setForgotSent] = useState(false);
    const [showContact, setShowContact] = useState(false);
    const [contactSentMsg, setContactSentMsg] = useState('');
    // UI-only: ignore repeat submits while a sign-in / reset request is in flight.
    const [signBusy, setSignBusy] = useState(false);
    const [forgotBusy, setForgotBusy] = useState(false);
    const [forgotError, setForgotError] = useState('');

    const handleChange = (field, value) => { setFormData(prev => ({ ...prev, [field]: value })); if (errors[field]) setErrors(prev => ({ ...prev, [field]: '' })); };

    const validate = () => {
        const e = {};
        const nameRx = /^[a-zA-Z\s\-']+$/;
        const n = formData.displayName.trim();
        if (!n || n.length < 2) e.displayName = 'Display name must be at least 2 characters';
        else if (n.length > 50) e.displayName = 'Display name must be 50 characters or fewer';
        else if (!nameRx.test(n)) e.displayName = 'Only letters, spaces, hyphens and apostrophes allowed';
        if (!formData.email.trim()) e.email = 'Email is required';
        else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(formData.email.trim())) e.email = 'Enter a valid email address';
        if (!formData.password) e.password = 'Password is required';
        else if (formData.password.length < 8) e.password = 'Password must be at least 8 characters';
        if (!formData.confirmPassword) e.confirmPassword = 'Please confirm your password';
        else if (formData.password !== formData.confirmPassword) e.confirmPassword = 'Passwords do not match';
        return e;
    };

    const handleSubmit = async (ev) => {
        ev.preventDefault();
        const errs = validate();
        if (Object.keys(errs).length > 0) { setErrors(errs); return; }
        setIsSubmitting(true);
        try {
            if (AuthUtils.firebaseReady) {
                const fbUser = await AuthUtils.register(formData.email.trim().toLowerCase(), formData.password, formData.displayName.trim());
                const user = { id: fbUser.uid, uid: fbUser.uid, displayName: formData.displayName.trim(), email: formData.email.trim().toLowerCase(), authProvider: 'firebase', createdAt: new Date().toISOString() };
                localStorage.setItem('financeApp_currentUser', JSON.stringify(user));
                await DataService.updateSettings({ displayName: user.displayName });
                try { DataService.addPerson({ name: user.displayName, isDefault: true, systemManaged: true }); } catch (_) {}
                onRegister(user);
            } else {
                const existing = (() => { try { return JSON.parse(localStorage.getItem('financeApp_currentUser') || 'null'); } catch (_) { return null; } })();
                if (existing && existing.email === formData.email.trim().toLowerCase()) {
                    setErrors({ email: 'An account with this email already exists. Please sign in instead.' });
                    setIsSubmitting(false); return;
                }
                // A different account's data is in storage — wipe it before creating the new account
                if (existing) { DataService.clearAllUserData(); }
                const passwordHash = await AuthUtils.hashPassword(formData.password);
                const user = { id: Date.now(), displayName: formData.displayName.trim(), email: formData.email.trim().toLowerCase(), passwordHash, authProvider: 'email', createdAt: new Date().toISOString() };
                localStorage.setItem('financeApp_currentUser', JSON.stringify(user));
                localStorage.setItem('financeApp_session_expiry', String(Date.now() + 30 * 24 * 60 * 60 * 1000));
                localStorage.setItem('financeApp_session_uid', String(user.id));
                localStorage.removeItem('financeApp_failCount');
                localStorage.removeItem('financeApp_failLockUntil');
                await DataService.updateSettings({ displayName: user.displayName });
                try { DataService.addPerson({ name: user.displayName, isDefault: true, systemManaged: true }); } catch (_) {}
                onRegister(user);
            }
        } catch (err) {
            if (AuthUtils.firebaseReady && err.code) {
                const mapped = AuthUtils.mapFirebaseError(err.code);
                if (mapped && mapped.field) setErrors({ [mapped.field]: mapped.message });
                else if (mapped) setErrors({ general: mapped.message });
                else setErrors({ general: 'Registration failed. Please try again.' });
            } else {
                setErrors({ general: 'Registration failed. Please try again.' });
            }
            setIsSubmitting(false);
        }
    };

    const handleSocialSignIn = async (provider) => {
        if (!AuthUtils.firebaseReady) { setSocialError('Sign-in not available. Please use email and password.'); return; }
        setSocialLoading(provider);
        setSocialError('');
        try {
            const fbUser = provider === 'google' ? await AuthUtils.signInWithGoogle() : await AuthUtils.signInWithFacebook();
            localStorage.removeItem('financeApp_failCount');
            localStorage.removeItem('financeApp_failLockUntil');
            const storedUser = (() => { try { return JSON.parse(localStorage.getItem('financeApp_currentUser') || 'null'); } catch (_) { return null; } })();
            const user = { id: fbUser.uid, uid: fbUser.uid, displayName: fbUser.displayName || (storedUser && storedUser.displayName) || fbUser.email, email: fbUser.email, authProvider: 'firebase', createdAt: (storedUser && storedUser.createdAt) || new Date().toISOString() };
            localStorage.setItem('financeApp_currentUser', JSON.stringify(user));
            const people = DataService.getPeople();
            const match = people.find(p => p.name === user.displayName && p.systemManaged);
            if (match) { try { DataService.updatePerson(match.id, { isDefault: true }); } catch (_) {} }
            else if (user.displayName) { try { DataService.addPerson({ name: user.displayName, isDefault: true, systemManaged: true }); } catch (_) {} }
            // Not calling onLogin/onRegister here — App's onAuthStateChanged listener is
            // already firing for this same sign-in and is now the single place that resolves
            // the saved storagePreference before setting currentUser (see its comment). Setting
            // currentUser here too raced that fetch and could beat it, showing the storage
            // picker to a returning user who'd already chosen one.
        } catch (err) {
            console.error('[Social sign-in error]', err.code, err.message, err);
            if (err.code === 'auth/account-exists-with-different-credential') {
                setLinkModal({ email: err.email, credential: err.credential, providerName: provider === 'google' ? 'Google' : 'Facebook' });
            } else if (err.code !== 'auth/popup-closed-by-user' && err.code !== 'auth/cancelled-popup-request') {
                const mapped = AuthUtils.mapFirebaseError(err.code);
                setSocialError(mapped ? mapped.message : 'Sign-in failed. Please try again.');
            }
        } finally {
            setSocialLoading(null);
        }
    };

    const handleLinkAccounts = async () => {
        if (!linkModal) return;
        setLinkLoading(true);
        setLinkError('');
        try {
            const fbUser = await AuthUtils.linkSocialCredential(linkModal.email, linkPw, linkModal.credential);
            const storedUser = (() => { try { return JSON.parse(localStorage.getItem('financeApp_currentUser') || 'null'); } catch (_) { return null; } })();
            const user = { id: fbUser.uid, uid: fbUser.uid, displayName: fbUser.displayName || (storedUser && storedUser.displayName) || fbUser.email, email: fbUser.email, authProvider: 'firebase', createdAt: (storedUser && storedUser.createdAt) || new Date().toISOString() };
            localStorage.setItem('financeApp_currentUser', JSON.stringify(user));
            setLinkModal(null);
            setLinkPw('');
            // Not calling onLogin/onRegister here — see the comment in handleSocialSignIn.
        } catch (err) {
            const mapped = AuthUtils.mapFirebaseError(err.code);
            setLinkError(mapped ? mapped.message : 'Incorrect password. Please try again.');
        } finally {
            setLinkLoading(false);
        }
    };

    const handleSignIn = async (ev) => {
        ev.preventDefault();
        if (lockedOut) return;
        if (AuthUtils.firebaseReady) {
            try {
                const fbUser = await AuthUtils.signIn(signEmail.trim().toLowerCase(), signPw);
                localStorage.removeItem('financeApp_failCount');
                localStorage.removeItem('financeApp_failLockUntil');
                const storedUser = (() => { try { return JSON.parse(localStorage.getItem('financeApp_currentUser') || 'null'); } catch (_) { return null; } })();
                const user = {
                    id: fbUser.uid, uid: fbUser.uid,
                    displayName: fbUser.displayName || (storedUser && storedUser.displayName) || signEmail.trim(),
                    email: fbUser.email,
                    authProvider: 'firebase',
                    createdAt: (storedUser && storedUser.createdAt) || new Date().toISOString()
                };
                localStorage.setItem('financeApp_currentUser', JSON.stringify(user));
                const people = DataService.getPeople();
                const match = people.find(p => p.name === user.displayName && p.systemManaged);
                if (match) { try { DataService.updatePerson(match.id, { isDefault: true }); } catch (_) {} }
                // Not calling onLogin/onRegister here — see the comment in handleSocialSignIn.
            } catch (err) {
                if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password') {
                    // Attempt migration: check if a localStorage account exists with matching credentials
                    const stored = (() => { try { return JSON.parse(localStorage.getItem('financeApp_currentUser') || 'null'); } catch (_) { return null; } })();
                    if (stored && stored.email === signEmail.trim().toLowerCase()) {
                        // Support both legacy plaintext password and hashed password
                        if (stored.password && !stored.passwordHash) {
                            stored.passwordHash = await AuthUtils.hashPassword(stored.password);
                            delete stored.password;
                            localStorage.setItem('financeApp_currentUser', JSON.stringify(stored));
                        }
                        const localOk = stored.passwordHash && await AuthUtils.verifyPassword(signPw, stored.passwordHash);
                        if (localOk) {
                            try {
                                const fbUser = await AuthUtils.register(stored.email, signPw, stored.displayName || stored.email);
                                const user = { ...stored, id: fbUser.uid, uid: fbUser.uid, authProvider: 'firebase' };
                                delete user.passwordHash; delete user.password;
                                localStorage.setItem('financeApp_currentUser', JSON.stringify(user));
                                localStorage.removeItem('financeApp_failCount');
                                localStorage.removeItem('financeApp_failLockUntil');
                                // Not calling onLogin/onRegister here — see the comment in handleSocialSignIn.
                                return;
                            } catch (migrErr) { /* fall through to error */ }
                        }
                    }
                }
                const mapped = AuthUtils.mapFirebaseError(err.code);
                const msg = mapped ? mapped.message : 'Incorrect email or password.';
                const newCount = failCount + 1;
                setFailCount(newCount);
                localStorage.setItem('financeApp_failCount', String(newCount));
                if (newCount >= 5) {
                    const until = Date.now() + 15 * 60 * 1000;
                    localStorage.setItem('financeApp_failLockUntil', String(until));
                    setLockedOut(true);
                    setSignError('Too many failed attempts. Please try again in 15 minutes.');
                } else {
                    setSignError(msg || 'Incorrect email or password.');
                }
            }
        } else {
            const stored = (() => { try { return JSON.parse(localStorage.getItem('financeApp_currentUser') || 'null'); } catch (_) { return null; } })();
            if (stored && stored.password && !stored.passwordHash) {
                stored.passwordHash = await AuthUtils.hashPassword(stored.password);
                delete stored.password;
                localStorage.setItem('financeApp_currentUser', JSON.stringify(stored));
            }
            const emailMatch = stored && stored.email === signEmail.trim().toLowerCase();
            const passwordMatch = emailMatch && await AuthUtils.verifyPassword(signPw, stored.passwordHash);
            if (!emailMatch || !passwordMatch) {
                const newCount = failCount + 1;
                setFailCount(newCount);
                localStorage.setItem('financeApp_failCount', String(newCount));
                if (newCount >= 5) {
                    const until = Date.now() + 15 * 60 * 1000;
                    localStorage.setItem('financeApp_failLockUntil', String(until));
                    setLockedOut(true);
                    setSignError('Too many failed attempts. Please try again in 15 minutes.');
                } else {
                    setSignError('Incorrect email or password.');
                }
                return;
            }
            // Transparently upgrade a pre-PBKDF2 (bare SHA-256) hash now that we have the
            // plaintext password in hand from a successful verify — same pattern as the
            // legacy-plaintext migration above, so existing accounts get the stronger hash
            // without a forced password reset.
            if (AuthUtils.isLegacyHash(stored.passwordHash)) {
                stored.passwordHash = await AuthUtils.hashPassword(signPw);
                localStorage.setItem('financeApp_currentUser', JSON.stringify(stored));
            }
            localStorage.removeItem('financeApp_failCount');
            localStorage.removeItem('financeApp_failLockUntil');
            if (signRemember) {
                localStorage.setItem('financeApp_session_expiry', String(Date.now() + 30 * 24 * 60 * 60 * 1000));
                localStorage.setItem('financeApp_session_uid', String(stored.id));
            } else {
                sessionStorage.setItem('financeApp_session_active', 'true');
                sessionStorage.setItem('financeApp_session_uid', String(stored.id));
            }
            const people = DataService.getPeople();
            const match = people.find(p => p.name === stored.displayName && p.systemManaged);
            if (match) { try { DataService.updatePerson(match.id, { isDefault: true }); } catch (_) {} }
            (onLogin || onRegister)(stored);
        }
    };

    const handleForgotPw = async () => {
        if (AuthUtils.firebaseReady) {
            try { await AuthUtils.sendPasswordReset(forgotEmail.trim().toLowerCase()); } catch (_) {}
        } else {
            const stored = (() => { try { return JSON.parse(localStorage.getItem('financeApp_currentUser') || 'null'); } catch (_) { return null; } })();
            console.log('[ForgotPW] Reset requested for:', forgotEmail.trim().toLowerCase(), '| match:', stored && stored.email === forgotEmail.trim().toLowerCase());
        }
        setForgotSent(true);
    };

    // UI wrappers only — each delegates to the unchanged handler above.
    const onSignInSubmit = async (ev) => {
        ev.preventDefault();
        if (signBusy || lockedOut) return;
        setSignBusy(true);
        try { await handleSignIn(ev); } finally { setSignBusy(false); }
    };
    const onForgotSubmit = async () => {
        if (forgotBusy) return;
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(forgotEmail.trim())) { setForgotError('Enter a valid email address.'); return; }
        setForgotError('');
        setForgotBusy(true);
        try { await handleForgotPw(); } finally { setForgotBusy(false); }
    };
    const closeLink = () => { setLinkModal(null); setLinkPw(''); setLinkError(''); };

    const regError = errors.general || errors.displayName || errors.email || errors.password || errors.confirmPassword || '';
    const confirmTyped = formData.confirmPassword.length > 0;
    const confirmOk = confirmTyped && formData.password === formData.confirmPassword;
    const eyeBtn = (shown, toggle) => (
        <button type="button" className="sp-field-eye" onClick={toggle} tabIndex={-1} title="Show or hide password"><i className={'fas fa-' + (shown ? 'eye-slash' : 'eye')}></i></button>
    );
    const socialButtons = (
        <div className="sp-social">
            <button type="button" onClick={() => handleSocialSignIn('google')} disabled={!!socialLoading}>
                <i className={socialLoading === 'google' ? 'fas fa-spinner fa-spin' : 'fab fa-google'} style={{color: '#ea4335'}}></i>Google
            </button>
            <button type="button" onClick={() => handleSocialSignIn('facebook')} disabled={!!socialLoading}>
                <i className={socialLoading === 'facebook' ? 'fas fa-spinner fa-spin' : 'fab fa-facebook'} style={{color: '#1877f2'}}></i>Facebook
            </button>
        </div>
    );
    const alertBox = (msg, kind = 'err') => msg ? (
        <div className={'sp-alert sp-alert-' + kind}><i className={kind === 'err' ? 'fas fa-triangle-exclamation' : 'fas fa-circle-check'}></i><span>{msg}</span></div>
    ) : null;

    let body;
    if (linkModal) {
        body = (
            <div>
                <button type="button" className="sp-back" onClick={closeLink} disabled={linkLoading}><i className="fas fa-arrow-left"></i>Back to sign in</button>
                <div className="sp-card-head">
                    <span className="sp-tile sp-tile-indigo"><i className="fas fa-link"></i></span>
                    <div><div className="sp-card-head-title">Link your accounts</div><div className="sp-card-head-sub">{linkModal.providerName} and email sign-in</div></div>
                </div>
                <div className="sp-card-sub" style={{marginTop: 0}}>An account already exists for <strong>{linkModal.email}</strong>. Enter your current password to link your <strong>{linkModal.providerName}</strong> account — all your data will be preserved.</div>
                {alertBox(linkError)}
                <SpField label="Current password" icon="fas fa-lock" trailing={eyeBtn(linkShowPw, () => setLinkShowPw(v => !v))}>
                    <input type={linkShowPw ? 'text' : 'password'} placeholder="Your existing password" value={linkPw} onChange={e => { setLinkPw(e.target.value); setLinkError(''); }} autoComplete="current-password" onKeyDown={e => { if (e.key === 'Enter' && linkPw) handleLinkAccounts(); }} />
                </SpField>
                <button type="button" className="sp-btn sp-btn-primary" onClick={handleLinkAccounts} disabled={linkLoading || !linkPw}>
                    <i className={linkLoading ? 'fas fa-spinner fa-spin' : 'fas fa-link'}></i>{linkLoading ? 'Linking…' : 'Link & sign in'}
                </button>
            </div>
        );
    } else if (showContact) {
        body = (
            <div>
                <button type="button" className="sp-back" onClick={() => setShowContact(false)}><i className="fas fa-arrow-left"></i>Back</button>
                <div className="sp-card-head">
                    <span className="sp-tile sp-tile-indigo"><i className="fas fa-envelope"></i></span>
                    <div><div className="sp-card-head-title">Contact us</div><div className="sp-card-head-sub">We'll reply by email</div></div>
                </div>
                <ContactForm hideCancel onSent={(msg) => { setShowContact(false); setContactSentMsg(msg); }} />
            </div>
        );
    } else if (activeTab === 'signin' && showForgot) {
        body = (
            <div>
                <button type="button" className="sp-back" onClick={() => setShowForgot(false)}><i className="fas fa-arrow-left"></i>Back to sign in</button>
                {!forgotSent ? (
                    <React.Fragment>
                        <div className="sp-card-title">Forgot password?</div>
                        <div className="sp-card-sub">Type the email on your account and we'll send you a link to reset your password.</div>
                        {alertBox(forgotError)}
                        <SpField label="Email" icon="fas fa-at">
                            <input type="email" placeholder="you@example.com" value={forgotEmail} onChange={e => { setForgotEmail(e.target.value); setForgotError(''); }} autoComplete="email" onKeyDown={e => { if (e.key === 'Enter') onForgotSubmit(); }} />
                        </SpField>
                        <button type="button" className="sp-btn sp-btn-primary" onClick={onForgotSubmit} disabled={forgotBusy}>
                            <i className={forgotBusy ? 'fas fa-spinner fa-spin' : 'fas fa-paper-plane'}></i>{forgotBusy ? 'Sending…' : 'Send reset link'}
                        </button>
                    </React.Fragment>
                ) : (
                    <div className="sp-done">
                        <span className="sp-done-tile"><i className="fas fa-envelope-circle-check"></i></span>
                        <div className="sp-card-title" style={{marginTop: '14px'}}>Check your inbox</div>
                        <div className="sp-card-sub" style={{margin: '6px 0 18px'}}>If an account exists for <b style={{color: '#0f172a'}}>{forgotEmail.trim()}</b>, we've sent a link to reset your password.</div>
                        <div className="sp-btn-row">
                            <button type="button" className="sp-btn sp-btn-soft" style={{flex: 1}} onClick={onForgotSubmit} disabled={forgotBusy}>{forgotBusy ? 'Sending…' : 'Resend'}</button>
                            <button type="button" className="sp-btn sp-btn-dark sp-btn-sm" style={{flex: 1.4}} onClick={() => setShowForgot(false)}>Back to sign in</button>
                        </div>
                    </div>
                )}
            </div>
        );
    } else {
        body = (
            <div>
                <div className="sp-tabs">
                    {[['signin', 'Sign in'], ['register', 'Create login']].map(([tab, label]) => (
                        <button key={tab} type="button" className={'sp-tab' + (activeTab === tab ? ' is-active' : '')} onClick={() => setActiveTab(tab)}>{label}</button>
                    ))}
                </div>
                {activeTab === 'signin' ? (
                    <form onSubmit={onSignInSubmit} noValidate>
                        {alertBox(signError)}
                        {alertBox(socialError)}
                        <SpField label="Email" icon="fas fa-at">
                            <input type="email" placeholder="you@example.com" value={signEmail} onChange={e => { setSignEmail(e.target.value); setSignError(''); }} autoComplete="email" />
                        </SpField>
                        <SpField label="Password" icon="fas fa-lock" trailing={eyeBtn(signShowPw, () => setSignShowPw(v => !v))}>
                            <input type={signShowPw ? 'text' : 'password'} placeholder="Your password" value={signPw} onChange={e => { setSignPw(e.target.value); setSignError(''); }} autoComplete="current-password" />
                        </SpField>
                        <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '8px', flexWrap: 'wrap', margin: '-2px 2px 14px'}}>
                            <label className="sp-check"><input type="checkbox" checked={signRemember} onChange={e => setSignRemember(e.target.checked)} />Remember me (30 days)</label>
                            <button type="button" className="sp-link" onClick={() => { setShowForgot(true); setForgotEmail(signEmail); setForgotSent(false); setForgotError(''); }}>Forgot password?</button>
                        </div>
                        <button type="submit" className="sp-btn sp-btn-primary" disabled={lockedOut || signBusy}>
                            <i className={signBusy ? 'fas fa-spinner fa-spin' : 'fas fa-arrow-right-to-bracket'}></i>{signBusy ? 'Signing in…' : 'Sign in'}
                        </button>
                        <div className="sp-divider"><span>or sign in with</span></div>
                        {socialButtons}
                    </form>
                ) : (
                    <form onSubmit={handleSubmit} noValidate>
                        {alertBox(regError)}
                        {alertBox(socialError)}
                        <SpField label="Display name" icon="fas fa-id-badge" state={errors.displayName ? 'bad' : null}>
                            <input type="text" placeholder="How we greet you" value={formData.displayName} onChange={e => handleChange('displayName', e.target.value)} autoComplete="name" />
                        </SpField>
                        <SpField label="Email" icon="fas fa-at" state={errors.email ? 'bad' : null}>
                            <input type="email" placeholder="you@example.com" value={formData.email} onChange={e => handleChange('email', e.target.value)} autoComplete="email" />
                        </SpField>
                        <SpField label="Password" icon="fas fa-lock" state={errors.password ? 'bad' : null} trailing={eyeBtn(showPassword, () => setShowPassword(v => !v))}>
                            <input type={showPassword ? 'text' : 'password'} placeholder="At least 8 characters" value={formData.password} onChange={e => handleChange('password', e.target.value)} autoComplete="new-password" />
                        </SpField>
                        <SpField label="Confirm password" icon="fas fa-lock" state={confirmTyped ? (confirmOk ? 'ok' : 'bad') : (errors.confirmPassword ? 'bad' : null)}
                            trailing={<React.Fragment>
                                {confirmTyped && <i className={confirmOk ? 'fas fa-circle-check' : 'fas fa-circle-xmark'} style={{color: confirmOk ? '#16a34a' : '#e11d48', fontSize: '14px'}}></i>}
                                {eyeBtn(showConfirm, () => setShowConfirm(v => !v))}
                            </React.Fragment>}>
                            <input type={showConfirm ? 'text' : 'password'} placeholder="Type it again" value={formData.confirmPassword} onChange={e => handleChange('confirmPassword', e.target.value)} autoComplete="new-password" />
                        </SpField>
                        <button type="submit" className="sp-btn sp-btn-primary" disabled={isSubmitting}>
                            <i className={isSubmitting ? 'fas fa-spinner fa-spin' : 'fas fa-user-plus'}></i>{isSubmitting ? 'Creating…' : 'Create login'}
                        </button>
                        <div className="sp-divider"><span>or create login with</span></div>
                        {socialButtons}
                    </form>
                )}
            </div>
        );
    }

    return (
        <AuthShell footer={
            <React.Fragment>
                {!showContact && !linkModal && (
                    <div className="sp-auth-foot">
                        <button type="button" className="sp-auth-foot-link" onClick={() => { setContactSentMsg(''); setShowContact(true); }}><i className="fas fa-envelope"></i>Need help? <strong>Contact us</strong></button>
                    </div>
                )}
                {contactSentMsg && !showContact && <div className="sp-alert sp-alert-ok" style={{margin: '0 16px 26px', justifyContent: 'center'}}><i className="fas fa-circle-check"></i><span>{contactSentMsg}</span></div>}
            </React.Fragment>
        }>
            {body}
        </AuthShell>
    );
}

// Contact-support form. Same request, fields and validation as before; only the layout is
// the redesign's. Used inline on the sign-in card and inside ContactUsModal (Settings).
const CONTACT_TOPICS = ['Bug report', 'Sync & backup', 'Account', 'Feature idea'];
function ContactForm({ defaultReplyTo, onSent, onCancel, hideCancel }) {
    const [subject, setSubject] = useState('');
    const [details, setDetails] = useState('');
    const [replyTo, setReplyTo] = useState(defaultReplyTo || '');
    const [isSending, setIsSending] = useState(false);
    const [error, setError] = useState('');

    const handleSend = async () => {
        setError('');
        const trimmedSubject = subject.trim();
        const trimmedDetails = details.trim();
        const trimmedReplyTo = replyTo.trim();
        if (!trimmedSubject) { setError('Please enter a subject.'); return; }
        if (!trimmedDetails) { setError('Please enter some details.'); return; }
        if (trimmedReplyTo && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(trimmedReplyTo)) { setError('Please enter a valid email address.'); return; }
        setIsSending(true);
        try {
            const res = await fetch('/api/contact', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ subject: trimmedSubject, details: trimmedDetails, replyTo: trimmedReplyTo })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) { setError(data.error || 'Failed to send message. Please try again.'); setIsSending(false); return; }
            setIsSending(false);
            if (onSent) onSent("Message sent — we'll get back to you soon.");
        } catch (e) {
            setError('Network error. Please check your connection and try again.');
            setIsSending(false);
        }
    };

    return (
        <div className="sp-form">
            {error && <div className="sp-alert sp-alert-err"><i className="fas fa-triangle-exclamation"></i><span>{error}</span></div>}
            {defaultReplyTo ? (
                <SpField label="Your email" icon="fas fa-at" trailing={<i className="fas fa-lock" style={{color: '#94a3b8', fontSize: '12px'}}></i>}>
                    <input type="email" value={replyTo} disabled />
                </SpField>
            ) : (
                <SpField label="Your email (optional, for a reply)" icon="fas fa-at">
                    <input type="email" placeholder="you@example.com" value={replyTo} onChange={e => setReplyTo(e.target.value)} autoComplete="email" />
                </SpField>
            )}
            <div className="sp-label">Subject</div>
            <input type="text" className="sp-input" style={{marginBottom: '8px'}} placeholder="What's this about?" value={subject} onChange={e => setSubject(e.target.value)} maxLength={200} />
            <div className="sp-chips">
                {CONTACT_TOPICS.map(t => (
