                        <span className="sp-mvcard-total">{sec.rows.length === 0 ? 'None' : sec.key === 'recon' ? sec.rows.length + ' logged' : sec.key === 'cash' ? sumBy(sec.rows, t => Number(t.toAmount) || 0, t => t.cashWithdrawCurrency || currencyOf(t.fromAccountId)) : sumBy(sec.rows, t => Number(t.fromAmount) || 0, t => currencyOf(t.fromAccountId))}</span>
                    </div>
                    {sec.rows.length > 0 && <div className="sp-mvrows">{sec.rows.map(t => movementRow(sec, t))}</div>}
                </div>
            ))}

            {!form && <PinnedCta label="Add account" icon="fas fa-plus" onClick={() => { setForm('new'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} />}

            {linkSheet && (
                <Sheet onClose={() => setLinkSheet(null)}>
                    <SpSheetHead icon="fas fa-link" tint="#dbeafe" ink="#2563eb" title="Link transactions" sub={linkSheet.account.accountName + ' · ' + (linkSheet.account.person === 'own' ? 'your' : linkSheet.account.person + "'s") + ' primary account'} />
                    {linkSheet.expenseCount + linkSheet.incomeCount > 0 ? (
                        <React.Fragment>
                            <div className="sp-alert sp-alert-warn"><i className="fas fa-triangle-exclamation"></i><span>{linkSheet.expenseCount} expense{linkSheet.expenseCount === 1 ? '' : 's'} and {linkSheet.incomeCount} income record{linkSheet.incomeCount === 1 ? '' : 's'} for {linkSheet.account.person === 'own' ? 'you' : linkSheet.account.person} have no account. Linking puts them on {linkSheet.account.accountName}, which changes its balance.</span></div>
                            <div className="sp-sheet-foot"><button type="button" className="sp-btn sp-btn-cancel" onClick={() => setLinkSheet(null)}>Cancel</button><button type="button" className="sp-btn sp-btn-primary sp-btn-grow" onClick={confirmLink}><i className="fas fa-link"></i>Link {linkSheet.expenseCount + linkSheet.incomeCount}</button></div>
                        </React.Fragment>
                    ) : (
                        <React.Fragment>
                            <div className="sp-alert sp-alert-ok"><i className="fas fa-circle-check"></i><span>Nothing to link — every expense and income record for {linkSheet.account.person === 'own' ? 'you' : linkSheet.account.person} already has an account or is cash.</span></div>
                            <button type="button" className="sp-btn sp-btn-primary" onClick={() => setLinkSheet(null)}>Done</button>
                        </React.Fragment>
                    )}
                </Sheet>
            )}

            {transferForm && transferFromAccount && (
                <Sheet onClose={() => setTransferForm(null)} footer={<React.Fragment>
                    <button type="button" className="sp-btn sp-btn-cancel" onClick={() => setTransferForm(null)}>Cancel</button>
                    <button type="button" className="sp-btn sp-btn-primary sp-btn-grow" disabled={transferSubmitting} onClick={submitTransfer}><i className="fas fa-right-left"></i>{transferSubmitting ? 'Moving…' : 'Transfer'}</button>
                </React.Fragment>}>
                    <div className="sp-sheet-head"><div className="sp-sheet-title">Transfer money</div>{isOverseasTransfer && <span className="sp-kindtag" style={{background: '#dbeafe', color: '#2563eb', marginLeft: 'auto', alignSelf: 'center'}}><i className="fas fa-earth-europe" style={{marginRight: '4px'}}></i>OVERSEAS</span>}</div>
                    {Object.values(transferErrors).filter(Boolean)[0] && <div className="sp-alert sp-alert-err" style={{marginTop: '8px'}}><i className="fas fa-circle-exclamation"></i><span>{Object.values(transferErrors).filter(Boolean)[0]}</span></div>}
                    <div className="sp-xferbox">
                        <div className="sp-xferbox-k">FROM</div>
                        <div className="sp-xferbox-from"><span>{transferFromAccount.accountName} · {transferFromAccount.currency}</span><b>{spFmtMoney(bal(transferFromAccount), transferFromAccount.currency)}</b></div>
                        <div className="sp-xferbox-arrow"><i className="fas fa-arrow-down"></i></div>
                        <div className="sp-xferbox-k">TO</div>
                        <select className="sp-fullselect" style={{marginTop: '4px'}} value={tf.toAccountId} onChange={e => setTf('toAccountId', e.target.value)}>
                            <option value="">Select account</option>
                            {bankAccounts.filter(a => a.id !== transferFromAccount.id).map(a => <option key={a.id} value={a.id}>{(a.person === 'own' ? 'You' : a.person)} — {a.accountName} ({a.currency})</option>)}
                        </select>
                    </div>
                    <div className="sp-formcard">
                        <div className="sp-formrow"><span>Date</span><input type="date" value={tf.date} onChange={e => setTf('date', e.target.value)} /></div>
                        <div className={'sp-formrow' + (transferErrors.amount ? ' is-bad' : '')}><span>Amount</span><span className="sp-moneyin"><span>{CurrencyService.getCurrencySymbol(transferFromAccount.currency)}</span><input type="number" step="0.01" inputMode="decimal" placeholder="0.00" value={tf.amount} onChange={e => setTf('amount', e.target.value)} /></span></div>
                        {isOverseasTransfer && (
                            <React.Fragment>
                                <div className="sp-formrow"><span>Fee</span><span className="sp-moneyin"><span>{CurrencyService.getCurrencySymbol(transferFromAccount.currency)}</span><input type="number" step="0.01" inputMode="decimal" placeholder="0.00" value={tf.fee} onChange={e => setTf('fee', e.target.value)} /></span></div>
                                <div className="sp-formrow"><span>Rate<small className="sp-formrow-hint">1 {transferFromAccount.currency} = ? {transferToAccount.currency}{liveConversionRate ? ' · today ' + liveConversionRate : ''}</small></span><input type="number" step="0.0001" placeholder={liveConversionRate ? String(liveConversionRate) : "today's rate"} value={tf.conversionRate} onChange={e => setTf('conversionRate', e.target.value)} /></div>
                                <div className="sp-formrow"><span>They receive<small className="sp-formrow-hint">(amount − fee) × rate · you can change it</small></span><span className="sp-moneyin"><span>{CurrencyService.getCurrencySymbol(transferToAccount.currency)}</span><input type="number" step="0.01" inputMode="decimal" value={tf.toAmount} onChange={e => setTf('toAmount', e.target.value)} /></span></div>
                            </React.Fragment>
                        )}
                        <div className="sp-formrow"><span>Note</span><input type="text" value={tf.notes} placeholder="Optional" onChange={e => setTf('notes', e.target.value)} /></div>
                    </div>
                    {isCrossPersonTransfer && (
                        <div className="sp-panel">
                            <div className="sp-row-title">Logged as an expense and income</div>
                            <div className="sp-row-sub" style={{marginBottom: '8px'}}>Money to another person is recorded as an expense for {transferFromAccount.person === 'own' ? 'you' : transferFromAccount.person} and income for {transferToAccount.person === 'own' ? 'you' : transferToAccount.person}.</div>
                            <SpCategoryPicker categories={categories} categoryId={tf.principalCategoryId} subcategory={tf.principalSubcategory} required bad={!!(transferErrors.principalCategoryId || transferErrors.principalSubcategory)} onChange={(c, s) => setTransferForm(p => ({ ...p, principalCategoryId: c, principalSubcategory: s }))} />
                        </div>
                    )}
                    {isOverseasTransfer && !isCrossPersonTransfer && parseFloat(tf.fee) > 0 && (
                        <div className="sp-panel">
                            <div className="sp-row-title">Fee logged as an expense</div>
                            <div className="sp-row-sub" style={{marginBottom: '8px'}}>The {spFmtMoney(parseFloat(tf.fee) || 0, transferFromAccount.currency)} fee is recorded as an expense paid from {transferFromAccount.accountName}.</div>
                            <SpCategoryPicker categories={categories} categoryId={tf.categoryId} subcategory={tf.subcategory} required bad={!!(transferErrors.categoryId || transferErrors.subcategory)} onChange={(c, s) => setTransferForm(p => ({ ...p, categoryId: c, subcategory: s }))} />
                        </div>
                    )}
                    {transferToAccount && <div className="sp-hint" style={{fontSize: '12px', margin: '10px 4px 0'}}>{spFmtMoney(parseFloat(tf.amount) || 0, transferFromAccount.currency)} leaves {transferFromAccount.accountName}; {transferToAccount.accountName} gets {spFmtMoney(isOverseasTransfer ? (parseFloat(tf.toAmount) || 0) : (parseFloat(tf.amount) || 0), transferToAccount.currency)}.</div>}
                </Sheet>
            )}

            {withdrawAccount && (
                <Sheet onClose={() => setWithdrawAccount(null)} footer={<React.Fragment>
                    <button type="button" className="sp-btn sp-btn-cancel" onClick={() => setWithdrawAccount(null)}>Cancel</button>
                    <button type="button" className="sp-btn sp-btn-primary sp-btn-grow" disabled={withdrawSubmitting} onClick={submitWithdraw}><i className="fas fa-money-bill-wave"></i>Withdraw</button>
                </React.Fragment>}>
                    <SpSheetHead icon="fas fa-money-bill-wave" tint="#fef3c7" ink="#d97706" title="Cash withdrawal" sub={withdrawAccount.accountName + ' · ' + spFmtMoney(bal(withdrawAccount), withdrawAccount.currency)} />
                    {Object.values(withdrawErrors).filter(Boolean)[0] && <div className="sp-alert sp-alert-err"><i className="fas fa-circle-exclamation"></i><span>{Object.values(withdrawErrors).filter(Boolean)[0]}</span></div>}
                    <div className="sp-formcard" style={{marginTop: 0}}>
                        <div className="sp-formrow"><span>Amount</span><span className="sp-moneyin"><input type="number" step="0.01" inputMode="decimal" placeholder="0.00" value={withdrawForm.amount} autoFocus onChange={e => setWithdrawForm(f => ({ ...f, amount: e.target.value }))} /><select value={withdrawForm.currency} onChange={e => setWithdrawForm(f => ({ ...f, currency: e.target.value }))}>{CurrencyService.getAllCurrencies().map(c => <option key={c.code} value={c.code}>{c.code}</option>)}</select></span></div>
                        <div className="sp-formrow"><span>Fee<small className="sp-formrow-hint">Optional</small></span><span className="sp-moneyin"><input type="number" step="0.01" inputMode="decimal" placeholder="0.00" value={withdrawForm.fee} onChange={e => setWithdrawForm(f => ({ ...f, fee: e.target.value }))} /><select value={withdrawForm.feeCurrency} onChange={e => setWithdrawForm(f => ({ ...f, feeCurrency: e.target.value }))}>{CurrencyService.getAllCurrencies().map(c => <option key={c.code} value={c.code}>{c.code}</option>)}</select></span></div>
                        <div className="sp-formrow"><span>Date</span><input type="date" max={DateUtils.today()} value={withdrawForm.date} onChange={e => setWithdrawForm(f => ({ ...f, date: e.target.value }))} /></div>
                        <div className="sp-formrow"><span>Deducted from account<small className="sp-formrow-hint">Amount + fee in {withdrawAccount.currency} · edit to match your statement</small></span><span className="sp-moneyin"><span>{CurrencyService.getCurrencySymbol(withdrawAccount.currency)}</span><input type="number" step="0.01" inputMode="decimal" value={withdrawForm.deductedAmount} onChange={e => setWithdrawForm(f => ({ ...f, deductedAmount: e.target.value }))} /></span></div>
                    </div>
                    <div className="sp-hint" style={{fontSize: '11px', margin: '8px 4px 0'}}>Adds to your cash in hand for {withdrawForm.currency}. Not logged as an expense.</div>
                </Sheet>
            )}

            {reconcile && (
                <Sheet onClose={() => setReconcile(null)} footer={<React.Fragment>
                    <button type="button" className="sp-btn sp-btn-cancel" onClick={() => setReconcile(null)}>Cancel</button>
                    <button type="button" className="sp-btn sp-btn-primary sp-btn-grow" onClick={submitReconcile}><i className="fas fa-check"></i>Update balance</button>
                </React.Fragment>}>
                    <SpSheetHead icon="fas fa-scale-balanced" tint="#fae8ff" ink="#c026d3" title="Reconcile balance" sub={reconcile.account.accountName + ' · ' + reconcile.account.currency} />
                    {reconcile.error && <div className="sp-alert sp-alert-err"><i className="fas fa-circle-exclamation"></i><span>{reconcile.error}</span></div>}
                    <div className="sp-formcard" style={{marginTop: 0}}>
                        <div className="sp-formrow"><span>Current balance</span><b>{spFmtMoney(bal(reconcile.account), reconcile.account.currency)}</b></div>
                        <div className="sp-formrow"><span>Update to</span><span className="sp-moneyin"><span>{CurrencyService.getCurrencySymbol(reconcile.account.currency)}</span><input type="number" step="0.01" inputMode="decimal" placeholder="0.00" value={reconcile.to} autoFocus onChange={e => setReconcile(r => ({ ...r, to: e.target.value, error: '' }))} /></span></div>
                        <div className="sp-formrow"><span>Note</span><input type="text" value={reconcile.notes} placeholder="e.g. Matched bank statement" onChange={e => setReconcile(r => ({ ...r, notes: e.target.value }))} /></div>
                    </div>
                    {reconcile.to !== '' && !isNaN(parseFloat(reconcile.to)) && (() => {
                        const d = Math.round((parseFloat(reconcile.to) - bal(reconcile.account)) * 100) / 100;
                        return <div className="sp-nwtiles"><div><span>Change · today</span><b style={{color: d === 0 ? undefined : d > 0 ? '#16a34a' : '#e11d48'}}>{d > 0 ? '+' : d < 0 ? '−' : ''}{spFmtMoney(Math.abs(d), reconcile.account.currency)}</b></div></div>;
                    })()}
                    <div className="sp-hint" style={{fontSize: '11px', margin: '8px 4px 0'}}>Saved as a balance correction in Money movements. It isn't added to your expenses or income.</div>
                </Sheet>
            )}

            {deleteAccount && (
                <Sheet onClose={() => setDeleteAccount(null)} danger footer={<React.Fragment>
                    <button type="button" className="sp-btn sp-btn-cancel" onClick={() => setDeleteAccount(null)}>Cancel</button>
                    <button type="button" className="sp-btn sp-btn-danger sp-btn-grow" disabled={!deleteAck} onClick={confirmDeleteAccount}><i className="fas fa-trash"></i>Delete account</button>
                </React.Fragment>}>
                    <SpSheetHead icon="fas fa-triangle-exclamation" tint="#fee2e2" ink="#e11d48" title={'Delete ' + deleteAccount.accountName + '?'} sub={'This can\'t be undone. The account and its ' + spFmtMoney(bal(deleteAccount), deleteAccount.currency) + ' balance will be removed.'} />
                    <div className="sp-formcard" style={{marginTop: 0}}>
                        {accountImpacts(deleteAccount).map((i, n) => <div key={n} className="sp-formrow" style={{justifyContent: 'flex-start'}}><i className={i.icon} style={{color: 'var(--sp-slate-400)', width: '16px'}}></i><span style={{whiteSpace: 'normal', fontSize: '13px'}}>{i.text}</span></div>)}
                    </div>
                    <button type="button" className="sp-checkrow" onClick={() => setDeleteAck(v => !v)}>
                        <span className={'sp-checkbox' + (deleteAck ? ' is-on is-danger' : '')}>{deleteAck && <i className="fas fa-check"></i>}</span>
                        <span className="sp-row-title" style={{fontSize: '13px'}}>I understand this permanently deletes the account</span>
                    </button>
                </Sheet>
            )}

            {editWithdraw && (
                <Sheet onClose={() => setEditWithdraw(null)} footer={<React.Fragment>
                    <button type="button" className="sp-btn sp-btn-cancel" onClick={() => setEditWithdraw(null)}>Cancel</button>
                    <button type="button" className="sp-btn sp-btn-primary sp-btn-grow" onClick={saveEditWithdraw}><i className="fas fa-check"></i>Save changes</button>
                </React.Fragment>}>
                    <SpSheetHead icon="fas fa-money-bill-wave" tint="#fef3c7" ink="#d97706" title="Edit cash withdrawal" sub={editWithdraw.accountName} />
                    {editWithdraw.error && <div className="sp-alert sp-alert-err"><i className="fas fa-circle-exclamation"></i><span>{editWithdraw.error}</span></div>}
                    <div className="sp-formcard" style={{marginTop: 0}}>
                        <div className="sp-formrow"><span>Amount</span><span className="sp-moneyin"><input type="number" step="0.01" value={editWithdraw.amount} onChange={e => setEditWithdraw(p => ({ ...p, amount: e.target.value, error: '' }))} /><select value={editWithdraw.currency} onChange={e => setEditWithdraw(p => ({ ...p, currency: e.target.value }))}>{CurrencyService.getAllCurrencies().map(c => <option key={c.code} value={c.code}>{c.code}</option>)}</select></span></div>
                        <div className="sp-formrow"><span>Fee</span><span className="sp-moneyin"><input type="number" step="0.01" value={editWithdraw.fee} onChange={e => setEditWithdraw(p => ({ ...p, fee: e.target.value }))} /><select value={editWithdraw.feeCurrency} onChange={e => setEditWithdraw(p => ({ ...p, feeCurrency: e.target.value }))}>{CurrencyService.getAllCurrencies().map(c => <option key={c.code} value={c.code}>{c.code}</option>)}</select></span></div>
                        {/* Not recomputed from amount + fee on purpose: that would overwrite the historical figure at today's rate. */}
                        <div className="sp-formrow"><span>Deducted from account</span><span className="sp-moneyin"><span>{CurrencyService.getCurrencySymbol(editWithdraw.accountCurrency)}</span><input type="number" step="0.01" value={editWithdraw.deductedAmount} onChange={e => setEditWithdraw(p => ({ ...p, deductedAmount: e.target.value, error: '' }))} /></span></div>
                        <div className="sp-formrow"><span>Date</span><input type="date" max={DateUtils.today()} value={editWithdraw.date} onChange={e => setEditWithdraw(p => ({ ...p, date: e.target.value }))} /></div>
                    </div>
                </Sheet>
            )}
        </div>
    );
}

function SettingsScreen({ onCurrencyChange, currentCurrency, currentUser, onStoragePickerOpen, syncStatus, lastSyncTime, storagePreference: storagePref, onSyncNow, onReconnect, onViewHistory, activeView, onActiveViewChange, scrollTarget, onScrollTargetHandled, onDisplayNameChange, categories, onUpdate }) {
    const activeViewSectionRef = React.useRef(null);
    // Each section is collapsed by default; opening one closes any other (accordion,
    // not independent toggles) so the screen doesn't grow unbounded again as sections
    // are added — the whole point of this collapsing in the first place.
    const [expandedSection, setExpandedSection] = useState(null);
    const toggleSection = (id) => setExpandedSection(prev => prev === id ? null : id);
    const renderSectionHeader = (id, iconClass, title, color) => (
        <div onClick={() => toggleSection(id)} style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', cursor: 'pointer'}}>
            <h5 style={{marginBottom: 0, color: color || '#4a6cf7'}}>
                <i className={iconClass + ' me-2'}></i>{title}
            </h5>
            <i className={'fas fa-chevron-' + (expandedSection === id ? 'up' : 'down')} style={{color: '#adb5bd', fontSize: '0.85rem'}}></i>
        </div>
    );
    // Delayed slightly so this fires after this screen's own async effects (people,
    // backup history, settings) have settled, since scrolling before they load targets
    // a position that content loading afterward could shift.
    useEffect(() => {
        if (scrollTarget !== 'activeView') return;
        setExpandedSection('activeView');
        const timer = setTimeout(() => {
            if (activeViewSectionRef.current) activeViewSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
            if (onScrollTargetHandled) onScrollTargetHandled();
        }, 200);
        return () => clearTimeout(timer);
    }, [scrollTarget]);
    const handleToggleActiveViewPerson = (key) => {
        const isSelected = activeView.includes(key);
        let next;
        if (isSelected) {
            next = activeView.filter(v => v !== key);
            if (next.length === 0) next = ['own'];
        } else {
            next = [...activeView, key];
        }
        if (onActiveViewChange) onActiveViewChange(next);
    };
    const [saveMessage, setSaveMessage] = useState('');
    const [people, setPeople] = useState([]);
    const [personForm, setPersonForm] = useState({ name: '', relationship: '', isDefault: false });
    const [editingPerson, setEditingPerson] = useState(null);
    const [personErrors, setPersonErrors] = useState({});
    const [showDeletePersonConfirm, setShowDeletePersonConfirm] = useState(null);
    const [currencyForm, setCurrencyForm] = useState({ name: '', code: '' });
    const [currencyCheck, setCurrencyCheck] = useState(null);
    const [manualRate, setManualRate] = useState('');
    const [currencyFormError, setCurrencyFormError] = useState('');
    const [currencyChecking, setCurrencyChecking] = useState(false);
    const [customCurrencies, setCustomCurrencies] = useState(() => DataService.getCustomCurrencies());
    const [editingRateFor, setEditingRateFor] = useState(null);
    const emptyAccountForm = { accountName: '', accountRef: '', accountType: BANK_ACCOUNT_TYPES[0], country: COUNTRIES[0], currency: 'GBP', person: 'own', openingAmount: '', isPrimary: false };
    const [bankAccounts, setBankAccounts] = useState([]);
    const [accountForm, setAccountForm] = useState(emptyAccountForm);
    const [editingAccount, setEditingAccount] = useState(null);
    const [accountErrors, setAccountErrors] = useState({});
    const [showDeleteAccountConfirm, setShowDeleteAccountConfirm] = useState(null);
    const [showLinkAccountsConfirm, setShowLinkAccountsConfirm] = useState(false);
    const [filterBankAccountSyncConflict, setFilterBankAccountSyncConflict] = useState(!!FilterMemory.load('bankAccounts').syncConflict);
    const [showAccountConflictDetail, setShowAccountConflictDetail] = useState(null);
    const [linkCandidates, setLinkCandidates] = useState([]);
    const [linkableExpenses, setLinkableExpenses] = useState([]);
    const [linkableIncome, setLinkableIncome] = useState([]);
    const emptyTransferForm = { fromAccountId: '', toAccountId: '', date: DateUtils.today(), amount: '', conversionRate: '', fee: '', toAmount: '', categoryId: '', subcategory: '', principalCategoryId: '', principalSubcategory: '', notes: '' };
    const [showTransferForm, setShowTransferForm] = useState(false);
    const [transferForm, setTransferForm] = useState(emptyTransferForm);
    const [transferErrors, setTransferErrors] = useState({});
    const [transferSubmitting, setTransferSubmitting] = useState(false);
    const emptyReconcileForm = { accountId: '', actualBalance: '', notes: '', logAsTransaction: false, categoryId: '', subcategory: '' };
    const [showReconcileForm, setShowReconcileForm] = useState(false);
    const [reconcileForm, setReconcileForm] = useState(emptyReconcileForm);
    const [reconcileErrors, setReconcileErrors] = useState({});
    const [reconcileSubmitting, setReconcileSubmitting] = useState(false);
    const emptyWithdrawForm = { currency: 'GBP', amount: '', fee: '', feeCurrency: 'GBP', deductedAmount: '', date: DateUtils.today() };
    const [withdrawAccount, setWithdrawAccount] = useState(null);
    const [withdrawForm, setWithdrawForm] = useState(emptyWithdrawForm);
    const [withdrawErrors, setWithdrawErrors] = useState({});
    const [withdrawSubmitting, setWithdrawSubmitting] = useState(false);
    const [liveConversionRate, setLiveConversionRate] = useState(null);
    const [displayName, setDisplayName] = useState('');
    const [nameError, setNameError] = useState('');
    const [nameSaved, setNameSaved] = useState(false);
    const [savedDisplayName, setSavedDisplayName] = useState('');
    const [budgetAlertsEnabled, setBudgetAlertsEnabled] = useState(true);
    const [autoBackupEnabled, setAutoBackupEnabled] = useState(true);
    const [backupHistory, setBackupHistory] = useState([]);
    const [lastSaveTime, setLastSaveTime] = useState('');
    const [restoreFile, setRestoreFile] = useState(null);
    const [restorePreview, setRestorePreview] = useState(null);
    const [restoreError, setRestoreError] = useState('');
    const [showRestoreConfirm, setShowRestoreConfirm] = useState(false);
    const [restoreConfirmText, setRestoreConfirmText] = useState('');
    const [backupDownloaded, setBackupDownloaded] = useState(false);
    const [showClearExpensesConfirm, setShowClearExpensesConfirm] = useState(false);
    const [clearExpensesConfirmText, setClearExpensesConfirmText] = useState('');
    const [showClearIncomeConfirm, setShowClearIncomeConfirm] = useState(false);
    const [clearIncomeConfirmText, setClearIncomeConfirmText] = useState('');
    const [showContactModal, setShowContactModal] = useState(false);
    const [cloudBackupRetention, setCloudBackupRetention] = useState('count5');
    const [desktopNotifEnabled, setDesktopNotifEnabled] = useState(false);
    const [notifPermission, setNotifPermission] = useState(() => ('Notification' in window ? Notification.permission : 'unsupported'));

    useEffect(() => { DataService.initialize().then(async () => {
        setPeople(DataService.getPeople());
        setBankAccounts(DataService.getBankAccounts());
        const [exp, inc] = await Promise.all([DataService.getExpenses(), DataService.getIncome()]);
        setLinkableExpenses(exp); setLinkableIncome(inc);
    }); }, []);
    const linkCandidatesAll = React.useMemo(
        () => computeLinkCandidates(bankAccounts, linkableExpenses, linkableIncome),
        [bankAccounts, linkableExpenses, linkableIncome]
    );
    const bankAccountSyncConflicts = useMemo(() => SyncConflicts.read('bankAccounts'), [bankAccounts]);
    useEffect(() => { FilterMemory.save('bankAccounts', { syncConflict: filterBankAccountSyncConflict }); }, [filterBankAccountSyncConflict]);
    // balance is derived (DataService.computeBankAccountBalance), never stored — excluded
    // from the diff entirely so it never shows up as noise.
    const bankAccountConflictFieldLabels = { accountName: 'Account Name', accountRef: 'Account ID', accountType: 'Type', country: 'Country', currency: 'Currency', person: 'Person', openingAmount: 'Opening Amount', isPrimary: 'Primary' };
    const formatBankAccountConflictValue = (key, value) => {
        if (typeof value === 'boolean') return value ? 'Yes' : 'No';
        return value === undefined || value === null || value === '' ? '—' : String(value);
    };
    const conflictAccount = showAccountConflictDetail ? bankAccounts.find(a => a.id === showAccountConflictDetail) : null;
    const accountConflictSnapshot = showAccountConflictDetail ? bankAccountSyncConflicts[String(showAccountConflictDetail)] : null;
    const handleResolveAccountConflict = (useCloud) => {
        const accountId = showAccountConflictDetail;
        const updates = useCloud && accountConflictSnapshot ? accountConflictSnapshot.cloudSnapshot : {};
        DataService.updateBankAccount(accountId, updates);
        SyncConflicts.dismiss('bankAccounts', accountId);
        setShowAccountConflictDetail(null);
        setBankAccounts(DataService.getBankAccounts());
    };
    useEffect(() => {
        const notifSettings = JSON.parse(localStorage.getItem('financeApp_notifSettings') || '{}');
        setBudgetAlertsEnabled(notifSettings.budgetAlertsEnabled !== false);
        setDesktopNotifEnabled(!!notifSettings.desktopNotificationsEnabled && notifPermission === 'granted');
    }, []);

    useEffect(() => {
        DataService.getSettings().then(s => {
            setAutoBackupEnabled(s.autoBackupEnabled !== false);
            setCloudBackupRetention(s.cloudBackupRetention || 'count5');
        });
        setBackupHistory(DataService.getBackupHistory());
        setLastSaveTime(localStorage.getItem('financeApp_lastSaveTime') || '');
    }, []);

    const handleToggleBudgetAlerts = (enabled) => {
        setBudgetAlertsEnabled(enabled);
        const notifSettings = JSON.parse(localStorage.getItem('financeApp_notifSettings') || '{}');
        notifSettings.budgetAlertsEnabled = enabled;
        localStorage.setItem('financeApp_notifSettings', JSON.stringify(notifSettings));
    };

    const handleToggleDesktopNotif = async (enabled) => {
        if (enabled) {
            let perm = Notification.permission;
            if (perm === 'default') { perm = await Notification.requestPermission(); setNotifPermission(perm); }
            if (perm !== 'granted') { setDesktopNotifEnabled(false); return; }
        }
        setDesktopNotifEnabled(enabled);
        const notifSettings = JSON.parse(localStorage.getItem('financeApp_notifSettings') || '{}');
        notifSettings.desktopNotificationsEnabled = enabled;
        localStorage.setItem('financeApp_notifSettings', JSON.stringify(notifSettings));
    };

    const handleToggleAutoBackup = async (enabled) => {
        setAutoBackupEnabled(enabled);
        await DataService.updateSettings({ autoBackupEnabled: enabled });
    };

    const handleChangeBackupRetention = async (value) => {
        setCloudBackupRetention(value);
        await DataService.updateSettings({ cloudBackupRetention: value });
    };

    const handleDownloadBackup = () => {
        DataService.downloadBackup();
        setBackupHistory(DataService.getBackupHistory());
        setBackupDownloaded(true);
        setTimeout(() => setBackupDownloaded(false), 2000);
    };

    const handleRestoreFileChange = (e) => {
        setRestoreError(''); setRestorePreview(null); setRestoreFile(null);
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
            try {
                const parsed = JSON.parse(evt.target.result);
                if (!parsed.version || !parsed.data) { setRestoreError('Invalid backup file. Please select a valid FinanceTracker backup.'); return; }
                setRestoreFile(parsed);
                setRestorePreview({ date: parsed.createdAt, expenses: (parsed.data.expenses || []).length, income: (parsed.data.income || []).length });
            } catch (err) { setRestoreError('Invalid backup file. Please select a valid FinanceTracker backup.'); }
        };
        reader.readAsText(file);
    };

    const handleConfirmRestore = () => {
        try {
            DataService.restoreBackup(restoreFile);
            localStorage.setItem('financeApp_skipCloudRestoreCheck', 'true');
            window.location.reload();
        }
        catch (err) { setRestoreError('Restore failed: ' + err.message); setShowRestoreConfirm(false); setRestoreConfirmText(''); }
    };

    const handleConfirmClearExpenses = () => {
        DataService.clearAllExpenses();
        setShowClearExpensesConfirm(false);
        setClearExpensesConfirmText('');
        onUpdate();
    };

    const handleConfirmClearIncome = () => {
        DataService.clearAllIncome();
        setShowClearIncomeConfirm(false);
        setClearIncomeConfirmText('');
        onUpdate();
    };

    useEffect(() => {
        DataService.getSettings().then(s => {
            // financeApp_settings.displayName is only ever written when this field is
            // explicitly saved here (or via Profile) — social sign-in (Google/Facebook)
            // never seeds it, only currentUser.displayName. Fall back to that so the field
            // shows the name the app already picked up at sign-in instead of appearing blank.
            const name = s.displayName || (currentUser && currentUser.displayName) || '';
            setDisplayName(name);
            setSavedDisplayName(name);
        });
    }, []);

    const handleSaveDisplayName = async () => {
        setNameError('');
        const newName = displayName.trim();
        if (!newName || newName.length < 2) { setNameError('Name must be at least 2 characters'); return; }
        if (newName.length > 50) { setNameError('Name must be 50 characters or fewer'); return; }
        if (!/^[a-zA-Z\s\-']+$/.test(newName)) { setNameError("Only letters, spaces, hyphens and apostrophes are allowed"); return; }
        const settings = await DataService.getSettings();
        const oldName = settings.displayName || '';
        await DataService.updateSettings({ displayName: newName });
        if (oldName && oldName !== newName) DataService.migratePersonName(oldName, newName);
        try {
            const allPeople = DataService.getPeople();
            const systemPerson = allPeople.find(p => p.systemManaged === true);
            if (systemPerson) {
                DataService.updatePerson(systemPerson.id, { name: newName });
            } else {
                DataService.addPerson({ name: newName, isDefault: true, systemManaged: true });
            }
            setPeople(DataService.getPeople());
        } catch (e) { /* name conflict — still save display name */ }
        // Keep financeApp_currentUser (and App's currentUser state, via the callback) in
        // sync too — this save path previously only touched financeApp_settings and the
        // systemManaged person record, leaving the header's name pill showing the stale
        // pre-edit name until the next full login/reload.
        if (currentUser) {
            localStorage.setItem('financeApp_currentUser', JSON.stringify({ ...currentUser, displayName: newName }));
        }
        if (onDisplayNameChange) onDisplayNameChange(newName);
        setSavedDisplayName(newName);
        setNameSaved(true);
        setTimeout(() => setNameSaved(false), 2000);
    };

    const handleAddPerson = (e) => {
        e.preventDefault();
        setPersonErrors({});
        try {
            if (editingPerson) {
                DataService.updatePerson(editingPerson.id, { name: personForm.name, relationship: personForm.relationship, isDefault: personForm.isDefault });
                // A rename also rewrites the stored Active View (migratePersonName); App keeps its
                // own copy in React state, so push the new value up or it would keep filtering by
                // the old name and every screen would look empty.
                const storedView = getActiveView();
                if (onActiveViewChange && JSON.stringify(storedView) !== JSON.stringify(activeView)) onActiveViewChange(storedView);
            } else {
                DataService.addPerson({ name: personForm.name, relationship: personForm.relationship, isDefault: personForm.isDefault });
            }
            setPeople(DataService.getPeople());
            setPersonForm({ name: '', relationship: '', isDefault: false });
            setEditingPerson(null);
        } catch (error) {
            setPersonErrors({ name: error.message });
        }
    };
    const handleEditPerson = (person) => {
        setEditingPerson(person);
        setPersonForm({ name: person.name, relationship: person.relationship || '', isDefault: person.isDefault || false });
        setPersonErrors({});
    };
    const handleCancelEditPerson = () => {
        setEditingPerson(null);
        setPersonForm({ name: '', relationship: '', isDefault: false });
        setPersonErrors({});
    };
    const handleDeletePerson = (id) => {
        DataService.deletePerson(id);
        setPeople(DataService.getPeople());
        setShowDeletePersonConfirm(null);
    };

    const handleAddAccount = (e) => {
        e.preventDefault();
        setAccountErrors({});
        try {
            if (editingAccount) {
                DataService.updateBankAccount(editingAccount.id, accountForm);
            } else {
                DataService.addBankAccount(accountForm);
            }
            setBankAccounts(DataService.getBankAccounts());
            setAccountForm(emptyAccountForm);
            setEditingAccount(null);
        } catch (error) {
            setAccountErrors({ accountName: error.message });
        }
    };
    const handleEditAccount = (account) => {
        setEditingAccount(account);
        setAccountForm({ accountName: account.accountName, accountRef: account.accountRef || '', accountType: account.accountType, country: account.country, currency: account.currency, person: account.person, openingAmount: String(account.openingAmount), isPrimary: !!account.isPrimary });
        setAccountErrors({});
    };
    const handleCancelEditAccount = () => {
        setEditingAccount(null);
        setAccountForm(emptyAccountForm);
        setAccountErrors({});
    };
    const handleDeleteAccount = (id) => {
        DataService.deleteBankAccount(id);
        setBankAccounts(DataService.getBankAccounts());
        setShowDeleteAccountConfirm(null);
    };
    const handleOpenLinkAccounts = (personFilter = null) => {
        const candidates = linkCandidatesAll
            .filter(c => c.expenseCount + c.incomeCount > 0)
            .filter(c => !personFilter || c.person === personFilter)
            .map(c => ({ ...c, selected: true }));
        setLinkCandidates(candidates);
        setShowLinkAccountsConfirm(true);
    };
    const handleToggleLinkCandidate = (person) => {
        setLinkCandidates(prev => prev.map(c => c.person === person ? { ...c, selected: !c.selected } : c));
    };
    const handleConfirmLinkAccounts = async () => {
        const selected = linkCandidates.filter(c => c.selected).map(c => c.person);
        if (selected.length > 0) {
            await DataService.bulkLinkAccounts(selected);
            const [exp, inc] = await Promise.all([DataService.getExpenses(), DataService.getIncome()]);
            setLinkableExpenses(exp); setLinkableIncome(inc);
        }
        setShowLinkAccountsConfirm(false);
        setLinkCandidates([]);
    };

    const transferFromAccount = bankAccounts.find(a => a.id === parseInt(transferForm.fromAccountId));
    const transferToAccount = bankAccounts.find(a => a.id === parseInt(transferForm.toAccountId));
    const isOverseasTransfer = !!(transferFromAccount && transferToAccount && transferFromAccount.currency !== transferToAccount.currency);
    const isCrossPersonTransfer = !!(transferFromAccount && transferToAccount && transferFromAccount.person !== transferToAccount.person);
    const transferFeeCategory = categories.find(c => c.id === parseInt(transferForm.categoryId));
    const transferPrincipalCategory = categories.find(c => c.id === parseInt(transferForm.principalCategoryId));
    const reconcileAccount = bankAccounts.find(a => a.id === parseInt(reconcileForm.accountId));
    const reconcileCategory = categories.find(c => c.id === parseInt(reconcileForm.categoryId));

    // Pre-fills the "today's rate" placeholder for an overseas transfer whenever both
    // accounts (and therefore both currencies) are chosen — live-fetch-capable, falls
    // back gracefully inside CurrencyService itself if the network call fails.
    useEffect(() => {
        if (!isOverseasTransfer) { setLiveConversionRate(null); return; }
        let cancelled = false;
        CurrencyService.getConversionRate(transferFromAccount.currency, transferToAccount.currency).then(rate => {
            if (!cancelled) setLiveConversionRate(rate);
        });
        return () => { cancelled = true; };
    }, [transferFromAccount && transferFromAccount.currency, transferToAccount && transferToAccount.currency, isOverseasTransfer]);

    // Recomputes the suggested Transferred Amount whenever its source inputs change, but
    // deliberately excludes transferForm.toAmount from its own deps so a manual override
    // isn't immediately clobbered — it's only refreshed when amount/fee/rate change again.
    useEffect(() => {
        if (!isOverseasTransfer) return;
        const amount = parseFloat(transferForm.amount) || 0;
        const fee = parseFloat(transferForm.fee) || 0;
        const rate = parseFloat(transferForm.conversionRate) || liveConversionRate;
        if (!amount || !rate) return;
        const computed = Math.round((amount - fee) * rate * 100) / 100;
        setTransferForm(prev => ({ ...prev, toAmount: String(computed) }));
        // eslint-disable-next-line react-hooks/exhaustive-deps
    }, [transferForm.amount, transferForm.fee, transferForm.conversionRate, liveConversionRate, isOverseasTransfer]);

    const handleTransferFieldChange = (field, value) => {
        setTransferForm(prev => {
            const next = { ...prev, [field]: value };
            if (field === 'categoryId') next.subcategory = '';
            if (field === 'principalCategoryId') next.principalSubcategory = '';
            if (field === 'fromAccountId' && value === prev.toAccountId) next.toAccountId = '';
            return next;
        });
        if (transferErrors[field]) setTransferErrors(prev => ({ ...prev, [field]: '' }));
    };

    const handleCancelTransfer = () => {
        setShowTransferForm(false);
        setTransferForm(emptyTransferForm);
        setTransferErrors({});
    };

    const transferFormRef = React.useRef(null);
    const handleQuickTransfer = (account) => {
        setTransferForm({ ...emptyTransferForm, fromAccountId: String(account.id) });
        setTransferErrors({});
        setShowTransferForm(true);
        setTimeout(() => { if (transferFormRef.current) transferFormRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50);
    };

    const handleReconcileFieldChange = (field, value) => {
        setReconcileForm(prev => {
            const next = { ...prev, [field]: value };
            if (field === 'categoryId') next.subcategory = '';
            return next;
        });
        if (reconcileErrors[field]) setReconcileErrors(prev => ({ ...prev, [field]: '' }));
    };

    const handleCancelReconcile = () => {
        setShowReconcileForm(false);
        setReconcileForm(emptyReconcileForm);
        setReconcileErrors({});
    };

    const reconcileFormRef = React.useRef(null);
    const handleQuickReconcile = (account) => {
        setReconcileForm({ ...emptyReconcileForm, accountId: String(account.id) });
        setReconcileErrors({});
        setShowReconcileForm(true);
        setTimeout(() => { if (reconcileFormRef.current) reconcileFormRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50);
    };

    const handleSubmitReconcile = async (e) => {
        e.preventDefault();
        const errors = {};
        if (!reconcileForm.accountId) errors.accountId = 'Choose an account';
        const actualBalance = parseFloat(reconcileForm.actualBalance);
        if (reconcileForm.actualBalance === '' || isNaN(actualBalance)) errors.actualBalance = 'Enter the actual balance';
        if (Object.keys(errors).length > 0) { setReconcileErrors(errors); return; }

        setReconcileSubmitting(true);
        try {
            const balanceBefore = DataService.computeBankAccountBalance(reconcileAccount);
            const delta = Math.round((actualBalance - balanceBefore) * 100) / 100;
            if (delta === 0) {
                setReconcileErrors({ general: 'Already matches — no adjustment needed.' });
                return;
            }
            const isLiability = DataService.LIABILITY_ACCOUNT_TYPES.includes(reconcileAccount.accountType);
            const asExpense = isLiability ? delta > 0 : delta < 0;
            const today = DateUtils.today();
            const description = `Balance reconciliation: ${reconcileAccount.accountName}` + (reconcileForm.notes ? ` — ${reconcileForm.notes}` : '');

            if (reconcileForm.logAsTransaction && asExpense) {
                const catErrors = {};
                if (!reconcileForm.categoryId) catErrors.categoryId = 'Category is required';
                if (reconcileCategory && reconcileCategory.subcategories.length > 0 && !reconcileForm.subcategory) catErrors.subcategory = 'Subcategory is required';
                if (Object.keys(catErrors).length > 0) { setReconcileErrors(catErrors); return; }
            }

            let transactionId = null;
            let transactionType = null;
            if (reconcileForm.logAsTransaction) {
                if (asExpense) {
                    const created = await DataService.addExpense({
                        amount: Math.abs(delta),
                        currency: reconcileAccount.currency,
                        date: today,
                        description,
                        categoryId: parseInt(reconcileForm.categoryId),
                        subcategory: reconcileForm.subcategory || '',
                        paidBy: reconcileAccount.person === 'own' ? '' : reconcileAccount.person,
                        accountId: reconcileAccount.id,
                        tags: ['balance-adjustment']
                    });
                    transactionId = created.id;
                    transactionType = 'expense';
                } else {
                    const created = await DataService.addIncome({
                        amount: Math.abs(delta),
                        currency: reconcileAccount.currency,
                        date: today,
                        source: description,
                        description,
                        paidBy: reconcileAccount.person === 'own' ? '' : reconcileAccount.person,
                        accountId: reconcileAccount.id,
                        tags: ['balance-adjustment']
                    });
                    transactionId = created.id;
                    transactionType = 'income';
                }
            }

            DataService.addReconciliation({
                accountId: reconcileAccount.id,
                person: reconcileAccount.person,
                date: today,
                balanceBefore,
                delta,
                balanceAfter: actualBalance,
                notes: reconcileForm.notes || '',
                loggedAsTransaction: !!reconcileForm.logAsTransaction,
                transactionType,
                transactionId
            });

            setShowReconcileForm(false);
            setReconcileForm(emptyReconcileForm);
            setReconcileErrors({});
            if (onUpdate) onUpdate();
        } finally {
            setReconcileSubmitting(false);
        }
    };

    const handleOpenWithdraw = (account) => {
        setWithdrawAccount(account);
        setWithdrawForm({ ...emptyWithdrawForm, currency: account.currency, feeCurrency: account.currency });
        setWithdrawErrors({});
    };

    const handleCancelWithdraw = () => {
        setWithdrawAccount(null);
        setWithdrawForm(emptyWithdrawForm);
        setWithdrawErrors({});
    };

    // Auto-fills "Deducted from Account" as convert(amount) + convert(fee), both converted
    // independently into the account's own currency (the fee's currency no longer has to
    // match the withdrawal currency) — deliberately excludes deductedAmount from its own deps
    // (same trick as Transfer's toAmount effect above) so a manual edit isn't clobbered.
    useEffect(() => {
        if (!withdrawAccount) return;
        const amount = parseFloat(withdrawForm.amount) || 0;
        const fee = parseFloat(withdrawForm.fee) || 0;
        if (!amount && !fee) return;
        const converted = CurrencyService.convertToDefaultSync(amount, withdrawForm.currency, withdrawAccount.currency);
        const convertedFee = CurrencyService.convertToDefaultSync(fee, withdrawForm.feeCurrency, withdrawAccount.currency);
        const computed = Math.round((converted + convertedFee) * 100) / 100;
        setWithdrawForm(prev => ({ ...prev, deductedAmount: String(computed) }));
    }, [withdrawForm.amount, withdrawForm.fee, withdrawForm.currency, withdrawForm.feeCurrency, withdrawAccount]);

    const handleSubmitWithdraw = async (e) => {
        e.preventDefault();
        const errors = {};
        const amount = parseFloat(withdrawForm.amount);
        const deductedAmount = parseFloat(withdrawForm.deductedAmount);
        if (!withdrawForm.amount || amount <= 0) errors.amount = 'Amount must be greater than 0';
        if (!withdrawForm.deductedAmount || deductedAmount <= 0) errors.deductedAmount = 'Deducted amount must be greater than 0';
        if (!withdrawForm.date) errors.date = 'Date is required';
        if (Object.keys(errors).length > 0) { setWithdrawErrors(errors); return; }

        setWithdrawSubmitting(true);
        try {
            DataService.withdrawCash({
                accountId: withdrawAccount.id,
                currency: withdrawForm.currency,
                amount, fee: parseFloat(withdrawForm.fee) || 0, feeCurrency: withdrawForm.feeCurrency,
                deductedAmount, date: withdrawForm.date
            });
            setWithdrawAccount(null);
            setWithdrawForm(emptyWithdrawForm);
            setWithdrawErrors({});
            if (onUpdate) await onUpdate();
        } finally {
            setWithdrawSubmitting(false);
        }
    };

    const handleSubmitTransfer = async (e) => {
        e.preventDefault();
        const errors = {};
        const amount = parseFloat(transferForm.amount);
        if (!transferForm.fromAccountId) errors.fromAccountId = 'Choose a source account';
        if (!transferForm.toAccountId) errors.toAccountId = 'Choose a target account';
        if (transferForm.fromAccountId && transferForm.fromAccountId === transferForm.toAccountId) errors.toAccountId = 'Must differ from the source account';
        if (!amount || amount <= 0) errors.amount = 'Amount must be greater than 0';
        const feeAmount = parseFloat(transferForm.fee) || 0;
        if (isOverseasTransfer && feeAmount > 0 && !isCrossPersonTransfer) {
            if (!transferForm.categoryId) errors.categoryId = 'Category is required for a fee';
            if (transferFeeCategory && transferFeeCategory.subcategories.length > 0 && !transferForm.subcategory) errors.subcategory = 'Subcategory is required for a fee';
        }
        if (isCrossPersonTransfer) {
            if (!transferForm.principalCategoryId) errors.principalCategoryId = 'Category is required';
            if (transferPrincipalCategory && transferPrincipalCategory.subcategories.length > 0 && !transferForm.principalSubcategory) errors.principalSubcategory = 'Subcategory is required';
        }
        if (Object.keys(errors).length > 0) { setTransferErrors(errors); return; }

        setTransferSubmitting(true);
        try {
            const rate = isOverseasTransfer
                ? (parseFloat(transferForm.conversionRate) || liveConversionRate || await CurrencyService.getConversionRate(transferFromAccount.currency, transferToAccount.currency))
                : 1;
            const toAmount = isOverseasTransfer
                ? (parseFloat(transferForm.toAmount) || Math.round((amount - feeAmount) * rate * 100) / 100)
                : amount;
            let feeExpenseId = null;
            if (isOverseasTransfer && feeAmount > 0 && !isCrossPersonTransfer) {
                const feeExpense = await DataService.addExpense({
                    amount: feeAmount,
                    currency: transferFromAccount.currency,
                    date: transferForm.date,
                    description: `Transfer fee: ${transferFromAccount.accountName} → ${transferToAccount.accountName}`,
                    categoryId: parseInt(transferForm.categoryId),
                    subcategory: transferForm.subcategory || '',
                    paidBy: transferFromAccount.person === 'own' ? '' : transferFromAccount.person,
                    accountId: transferFromAccount.id,
                    tags: ['transfer-fee']
                });
                feeExpenseId = feeExpense.id;
            }
            let principalExpenseId = null;
            let recipientIncomeId = null;
            if (isCrossPersonTransfer) {
                const toPersonLabel = transferToAccount.person === 'own' ? 'Me' : transferToAccount.person;
                const fromPersonLabel = transferFromAccount.person === 'own' ? 'Me' : transferFromAccount.person;
                const principalExpense = await DataService.addExpense({
                    amount: amount + (isOverseasTransfer ? feeAmount : 0),
                    currency: transferFromAccount.currency,
                    date: transferForm.date,
                    description: `Transfer to ${toPersonLabel}: ${transferFromAccount.accountName} → ${transferToAccount.accountName}`,
                    categoryId: parseInt(transferForm.principalCategoryId),
                    subcategory: transferForm.principalSubcategory || '',
                    paidBy: transferFromAccount.person === 'own' ? '' : transferFromAccount.person,
                    tags: ['transfer-principal']
                });
                principalExpenseId = principalExpense.id;
                const recipientIncome = await DataService.addIncome({
                    amount: toAmount,
                    currency: transferToAccount.currency,
                    date: transferForm.date,
                    source: `Transfer from ${fromPersonLabel}`,
                    description: `Transfer from ${fromPersonLabel}: ${transferFromAccount.accountName} → ${transferToAccount.accountName}`,
                    paidBy: transferToAccount.person === 'own' ? '' : transferToAccount.person,
                    tags: ['transfer-incoming']
                });
                recipientIncomeId = recipientIncome.id;
            }
            DataService.addTransfer({
                date: transferForm.date,
                fromAccountId: transferFromAccount.id,
                toAccountId: transferToAccount.id,
                fromAmount: amount,
                toAmount,
                isOverseas: isOverseasTransfer,
                conversionRate: rate,
                fee: isOverseasTransfer ? feeAmount : 0,
                feeExpenseId,
                principalExpenseId,
                recipientIncomeId,
                notes: transferForm.notes || ''
            });
            setShowTransferForm(false);
            setTransferForm(emptyTransferForm);
            setTransferErrors({});
            if (onUpdate) onUpdate();
        } finally {
            setTransferSubmitting(false);
        }
    };

    const supportedCurrencies = CurrencyService.getAllCurrencies();

    const handleSelectChange = async (e) => {
        const newCurrency = e.target.value;
        try {
            await DataService.updateSettings({ currency: newCurrency });
            setSaveMessage('Currency updated successfully!');
            setTimeout(() => setSaveMessage(''), 2000);
            if (onCurrencyChange) onCurrencyChange(newCurrency);
        } catch (error) {
            setSaveMessage('Failed to update currency');
        }
    };

    const getCurrencySymbol = (code) => {
        const c = supportedCurrencies.find(cur => cur.code === code);
        return c ? c.symbol : code;
    };

    const staleCustomCurrencies = customCurrencies.filter(c => !c.isLive && c.rateAgainst !== currentCurrency);
    const builtInCurrencyList = Object.entries(CurrencyService.supportedCurrencies).map(([code, v]) => ({ code, name: v.name, symbol: v.symbol }));

    const handleCheckCurrency = async (e) => {
        e.preventDefault();
        setCurrencyFormError('');
        const name = currencyForm.name.trim();
        const code = currencyForm.code.trim().toUpperCase();
        if (!name) { setCurrencyFormError('Currency name is required'); return; }
        if (!/^[A-Z]{3}$/.test(code)) { setCurrencyFormError('Currency code must be 3 letters'); return; }
        if (CurrencyService.getAllCurrencies().some(c => c.code === code)) { setCurrencyFormError('This currency code already exists'); return; }
        setCurrencyChecking(true);
        try {
            const rate = await CurrencyService.lookupLiveRate(code, currentCurrency);
            if (rate != null) setCurrencyCheck({ name, code, rate });
            else { setCurrencyCheck({ name, code, needsManual: true }); setManualRate(''); }
        } finally {
            setCurrencyChecking(false);
        }
    };

    const handleConfirmAddCurrency = () => {
        const { name, code, rate } = currencyCheck;
        DataService.addCustomCurrency({ code, name, symbol: CurrencyService.deriveSymbol(code), rate, rateAgainst: currentCurrency, isLive: true });
        setCustomCurrencies(DataService.getCustomCurrencies());
        setCurrencyForm({ name: '', code: '' });
        setCurrencyCheck(null);
    };

    const handleSaveManualRate = (e) => {
        e.preventDefault();
        const rate = parseFloat(manualRate);
        if (!manualRate || rate <= 0) { setCurrencyFormError('Enter a conversion rate greater than 0'); return; }
        if (editingRateFor) {
            DataService.updateCustomCurrencyRate(editingRateFor.id, { rate, rateAgainst: currentCurrency, isLive: false });
            setEditingRateFor(null);
        } else {
            const { name, code } = currencyCheck;
            DataService.addCustomCurrency({ code, name, symbol: CurrencyService.deriveSymbol(code), rate, rateAgainst: currentCurrency, isLive: false });
        }
        setCustomCurrencies(DataService.getCustomCurrencies());
        setCurrencyForm({ name: '', code: '' });
        setCurrencyCheck(null);
        setManualRate('');
        setCurrencyFormError('');
    };

    const handleCancelCurrencyAdd = () => {
        setCurrencyCheck(null);
        setManualRate('');
        setCurrencyFormError('');
        setEditingRateFor(null);
    };

    const handleDeleteCustomCurrency = (id) => {
        DataService.deleteCustomCurrency(id);
        setCustomCurrencies(DataService.getCustomCurrencies());
    };

    const openUpdateRate = (currency) => {
        setEditingRateFor(currency);
        setManualRate('');
        setCurrencyFormError('');
    };

    return (
        <div className="screen">
            <div className="screen-header">
                <h2>Settings</h2>
            </div>

            <div className="settings-section" style={{marginBottom: '1.5rem'}}>
                {renderSectionHeader('yourName', 'fas fa-user', 'Your Name')}
                {expandedSection === 'yourName' && (<React.Fragment>
                <p className="text-muted" style={{fontSize: '0.9rem', marginBottom: '0.75rem', marginTop: '0.75rem'}}>
                    Used as your identity when tracking "paid by"
                </p>
                <input type="text" className="form-control" placeholder="Enter your display name (2–50 characters)" value={displayName} onChange={e => { setDisplayName(e.target.value); setNameError(''); }} />
                <div style={{display: 'flex', gap: '0.5rem', marginTop: '0.5rem'}}>
                    <button className="btn btn-primary" onClick={handleSaveDisplayName}>Save Name</button>
                    <button className="btn btn-outline-secondary" onClick={() => { setDisplayName(savedDisplayName); setNameError(''); }}>Cancel</button>
                </div>
                {nameError && <div className="text-danger mt-1" style={{fontSize: '0.875rem'}}>{nameError}</div>}
                {nameSaved && <div className="text-success mt-1" style={{fontSize: '0.875rem'}}><i className="fas fa-check me-1"></i>Name saved!</div>}
                </React.Fragment>)}
            </div>

            <hr style={{margin: '1rem 0 1.5rem'}} />

            <div style={{marginBottom: '1.5rem'}}>
                {renderSectionHeader('currency', 'fas fa-coins', 'Currency')}
            </div>
            {expandedSection === 'currency' && (<React.Fragment>
            <div style={{marginBottom: '1.5rem'}}>
                <p className="text-muted" style={{fontSize: '0.9rem', marginBottom: '1rem'}}>
                    Choose your default currency for budgets and summaries
                </p>
            </div>
            <div style={{marginBottom: '1.5rem'}}>
                <label htmlFor="currency-select" style={{fontWeight: '600', marginBottom: '0.5rem', display: 'block'}}>
                    Select Currency:
                </label>
                <select
                    id="currency-select"
                    className="form-select"
                    value={currentCurrency}
                    onChange={handleSelectChange}
                    style={{fontSize: '1.1rem', padding: '0.75rem'}}
                >
                    {supportedCurrencies.map(currency => (
                        <option key={currency.code} value={currency.code}>
                            {currency.symbol} {currency.code} - {currency.name}
                        </option>
                    ))}
                </select>
            </div>
            {saveMessage && (
                <div className={'alert ' + (saveMessage.includes('Failed') ? 'alert-danger' : 'alert-success')}>
                    {saveMessage}
                </div>
            )}
            <div style={{
                background: '#f8f9fa',
                borderRadius: '12px',
                padding: '1.25rem',
                textAlign: 'center',
                border: '2px solid #e9ecef'
            }}>
                <div style={{fontSize: '2rem', marginBottom: '0.5rem'}}>
                    {getCurrencySymbol(currentCurrency)}
                </div>
                <div style={{fontWeight: '600', fontSize: '1.1rem'}}>
                    Current Default: {currentCurrency}
                </div>
                <div style={{color: '#6c757d', fontSize: '0.85rem', marginTop: '0.25rem'}}>
                    {supportedCurrencies.find(c => c.code === currentCurrency) ? supportedCurrencies.find(c => c.code === currentCurrency).name : ''}
                </div>
            </div>

            <div style={{marginTop: '1.5rem', marginBottom: '1rem'}}>
                <h5 style={{marginBottom: '0.5rem', color: '#4a6cf7'}}>
                    <i className="fas fa-plus-circle"></i> Add Currency
                </h5>
                <p className="text-muted" style={{fontSize: '0.9rem', marginBottom: '1rem'}}>
                    Add a currency not in the list above. It'll become available everywhere you can pick a currency.
                </p>
            </div>

            {staleCustomCurrencies.length > 0 && (
                <div className="alert alert-warning" style={{fontSize: '0.85rem'}}>
                    <i className="fas fa-exclamation-triangle me-1"></i>
                    These currencies need an updated rate for {currentCurrency}:{' '}
                    {staleCustomCurrencies.map((c, i) => (
                        <React.Fragment key={c.id}>
                            {i > 0 && ', '}
                            <a href="#" onClick={e => { e.preventDefault(); openUpdateRate(c); }}>{c.name}</a>
                        </React.Fragment>
                    ))}.
                </div>
            )}

            {editingRateFor ? (
                <form onSubmit={handleSaveManualRate} style={{marginBottom: '1rem'}}>
                    <label style={{fontWeight: '600', fontSize: '0.85rem', marginBottom: '0.25rem', display: 'block'}}>
                        1 {editingRateFor.code} = ___ {currentCurrency}
                    </label>
                    <input type="number" step="0.0001" min="0" className={'form-control' + (currencyFormError ? ' is-invalid' : '')} value={manualRate} onChange={e => setManualRate(e.target.value)} placeholder="Conversion rate" autoFocus />
                    {currencyFormError && <div className="invalid-feedback">{currencyFormError}</div>}
                    <div className="alert alert-warning py-2" style={{fontSize: '0.8rem', marginTop: '0.5rem'}}>
                        <i className="fas fa-exclamation-triangle me-1"></i>This rate won't update automatically — it'll be used for offline conversion until you update it again.
                    </div>
                    <div style={{display: 'flex', gap: '0.5rem'}}>
                        <button type="submit" className="btn btn-primary btn-sm">Save Rate</button>
                        <button type="button" className="btn btn-outline-secondary btn-sm" onClick={handleCancelCurrencyAdd}>Cancel</button>
                    </div>
                </form>
            ) : currencyCheck ? (
                currencyCheck.needsManual ? (
                    <form onSubmit={handleSaveManualRate} style={{marginBottom: '1rem'}}>
                        <p style={{fontSize: '0.9rem'}}>No live conversion rate found for <strong>{currencyCheck.code}</strong>.</p>
                        <label style={{fontWeight: '600', fontSize: '0.85rem', marginBottom: '0.25rem', display: 'block'}}>
                            1 {currencyCheck.code} = ___ {currentCurrency}
                        </label>
                        <input type="number" step="0.0001" min="0" className={'form-control' + (currencyFormError ? ' is-invalid' : '')} value={manualRate} onChange={e => setManualRate(e.target.value)} placeholder="Conversion rate" autoFocus />
                        {currencyFormError && <div className="invalid-feedback">{currencyFormError}</div>}
                        <div className="alert alert-warning py-2" style={{fontSize: '0.8rem', marginTop: '0.5rem'}}>
                            <i className="fas fa-exclamation-triangle me-1"></i>No live rate is available for this currency. This rate won't update automatically — it'll be used for offline conversion until you update it.
                        </div>
                        <div style={{display: 'flex', gap: '0.5rem'}}>
                            <button type="submit" className="btn btn-primary btn-sm">Add Currency</button>
                            <button type="button" className="btn btn-outline-secondary btn-sm" onClick={handleCancelCurrencyAdd}>Cancel</button>
                        </div>
                    </form>
                ) : (
                    <div style={{marginBottom: '1rem'}}>
                        <p style={{fontSize: '0.9rem'}}>
                            1 {currencyCheck.code} = {currencyCheck.rate} {currentCurrency} (today's rate). Add <strong>{currencyCheck.name}</strong>?
                        </p>
                        <div style={{display: 'flex', gap: '0.5rem'}}>
                            <button type="button" className="btn btn-primary btn-sm" onClick={handleConfirmAddCurrency}>Confirm & Add</button>
                            <button type="button" className="btn btn-outline-secondary btn-sm" onClick={handleCancelCurrencyAdd}>Cancel</button>
                        </div>
                    </div>
                )
            ) : (
                <form onSubmit={handleCheckCurrency} style={{marginBottom: '1rem'}}>
                    <div className="row g-2 align-items-end">
                        <div className="col">
